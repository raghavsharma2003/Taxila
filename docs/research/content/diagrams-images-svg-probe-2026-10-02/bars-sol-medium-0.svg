<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 320" role="img" aria-label="Bar chart of monthly rainfall in Pune">
  <rect x="0" y="0" width="380" height="320" fill="#FFFFFF"/>
  
  <text x="52" y="28" font-size="18" font-family="Arial, sans-serif" font-weight="700" fill="#1F1A14">Rainfall in Pune (mm)</text>

  <g fill="none" stroke="#1F1A14">
    <line x1="52" y1="65" x2="354" y2="65" stroke-width="1" opacity="0.25"/>
    <line x1="52" y1="130" x2="354" y2="130" stroke-width="1" opacity="0.25"/>
    <line x1="52" y1="195" x2="354" y2="195" stroke-width="1" opacity="0.25"/>
    <line x1="52" y1="260" x2="354" y2="260" stroke-width="2"/>
    <line x1="52" y1="65" x2="52" y2="260" stroke-width="2"/>
  </g>

  <g fill="#1F1A14" font-family="Arial, sans-serif" text-anchor="end">
    <text x="44" y="71" font-size="16">150</text>
    <text x="44" y="136" font-size="16">100</text>
    <text x="44" y="201" font-size="16">50</text>
    <text x="44" y="266" font-size="16">0</text>
  </g>

  <g fill="#1F1A14">
    <rect class="bar" data-v="12" x="70" y="244.4" width="38" height="15.6"/>
    <rect class="bar" data-v="30" x="128" y="221" width="38" height="39"/>
    <rect class="bar" data-v="45" x="186" y="201.5" width="38" height="58.5"/>
    <rect class="bar" data-v="80" x="244" y="156" width="38" height="104"/>
    <rect class="bar" data-v="150" x="302" y="65" width="38" height="195"/>
  </g>

  <g fill="#1F1A14" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">
    <text x="89" y="237" font-size="16" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">12</text>
    <text x="147" y="214" font-size="16" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">30</text>
    <text x="205" y="194" font-size="16" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">45</text>
    <text x="263" y="149" font-size="16" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">80</text>
    <text x="321" y="57" font-size="16" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">150</text>
  </g>

  <g fill="#1F1A14" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="89" y="288" font-size="16">Jan</text>
    <text x="147" y="288" font-size="16">Feb</text>
    <text x="205" y="288" font-size="16">Mar</text>
    <text x="263" y="288" font-size="16">Apr</text>
    <text x="321" y="288" font-size="16">May</text>
  </g>
</svg>