<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 325" role="img" aria-label="Bar chart of monthly rainfall in Pune">
  <rect width="380" height="325" fill="white"/>
  <g fill="none" stroke="#1F1A14">
    <line x1="48" y1="60" x2="368" y2="60" opacity="0.25"/>
    <line x1="48" y1="130" x2="368" y2="130" opacity="0.25"/>
    <line x1="48" y1="200" x2="368" y2="200" opacity="0.25"/>
    <line x1="48" y1="270" x2="368" y2="270" stroke-width="2"/>
    <line x1="48" y1="60" x2="48" y2="270" stroke-width="2"/>
  </g>

  <g fill="#1F1A14" font-family="Arial, sans-serif" font-size="16">
    <text x="48" y="22" font-weight="bold">Rainfall (mm)</text>

    <text x="40" y="65" text-anchor="end">150</text>
    <text x="40" y="135" text-anchor="end">100</text>
    <text x="40" y="205" text-anchor="end">50</text>
    <text x="40" y="275" text-anchor="end">0</text>

    <rect class="bar" data-v="12" x="62" y="253.2" width="32" height="16.8"/>
    <rect class="bar" data-v="30" x="122" y="228" width="32" height="42"/>
    <rect class="bar" data-v="45" x="182" y="207" width="32" height="63"/>
    <rect class="bar" data-v="80" x="242" y="158" width="32" height="112"/>
    <rect class="bar" data-v="150" x="302" y="60" width="32" height="210"/>

    <text x="78" y="246" text-anchor="middle">12</text>
    <text x="138" y="221" text-anchor="middle">30</text>
    <text x="198" y="200" text-anchor="middle">45</text>
    <text x="258" y="151" text-anchor="middle">80</text>
    <text x="318" y="52" text-anchor="middle">150</text>

    <text x="78" y="298" text-anchor="middle">Jan</text>
    <text x="138" y="298" text-anchor="middle">Feb</text>
    <text x="198" y="298" text-anchor="middle">Mar</text>
    <text x="258" y="298" text-anchor="middle">Apr</text>
    <text x="318" y="298" text-anchor="middle">May</text>
  </g>
</svg>