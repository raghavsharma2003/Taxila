<!doctype html><meta charset=utf-8><style>body{margin:0;background:#000}</style><script src="p4dist.js"></script><script src="common.iife.js"></script><script>
const balls=C.mkBalls(); new Phaser.Game({type:Phaser.WEBGL,width:360,height:640,audio:{noAudio:true},banner:false,scene:{create(){ const g=this.add.graphics(); g.fillStyle(0xff8800).fillCircle(8,8,8); g.generateTexture('b',16,16); g.destroy(); this.s=balls.map(b=>this.add.image(b.x,b.y,'b')); this.add.text(10,10,'score 0',{fontSize:'20px'}); }, update(){ C.stepBalls(balls); this.s.forEach((s,i)=>s.setPosition(balls[i].x,balls[i].y)); C.frame(); }}});
</script>
