<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nagar · Taxila U1 direction B</title>
<meta name="color-scheme" content="light">
<!--@FONTS
Serif=InstrumentSerif-latin-normal.woff2;font-weight:400
Grot=bricolage-grotesque-latin.woff2;font-weight:200 800
TiroD=TiroDevanagariHindi-devanagari-normal.woff2;font-weight:400
Anek=AnekDevanagari-devanagari-normal.woff2;font-weight:100 800;font-stretch:75% 125%
-->
<style>
/* NAGAR. Your city of ideas: a floating sandstone island in clear daylight. Every idea you make pakka raises a
   real Indian structure on it (a baoli for equal parts, a jantar for angles, a bridge for the number line).
   Architectural, editorial, quiet; the game lives in the world, not in badges. */
:root{
  --sky1:#BFD9E4; --sky2:#E9E4DA; --haze:#F4EFE7;
  --ink:#14202A; --ink2:#36424B; --ink3:#3F4A52;
  --card:rgba(255,255,255,.78); --card2:rgba(255,255,255,.92); --line:rgba(20,32,42,.12); --line2:rgba(20,32,42,.24);
  --move:#1E2A57; --move2:#2E3D78; --her:#C2512A; --secure:#086A61; --look:#5650C4; --sand:#EBD9BA;
  --serif:"Serif","TiroD",Georgia,serif; --sans:"Grot","Anek",system-ui,sans-serif; --deva:"Anek","Grot",sans-serif; --dserif:"TiroD","Serif",serif;
  --e-out:cubic-bezier(.16,1,.3,1); --e-spring:cubic-bezier(.34,1.56,.64,1);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:400 16px/1.5 var(--sans);color:var(--ink);background:linear-gradient(180deg,var(--sky1) 0,var(--sky2) 55%,var(--haze) 100%) fixed;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body[data-lang=hi]{font-family:var(--deva);font-size:17px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--move);outline-offset:3px}
.app{position:relative;max-width:1366px;margin:0 auto;min-height:100dvh}
section[data-screen]{min-height:100dvh;padding:0 16px 28px;display:flex;flex-direction:column;position:relative}
section[hidden]{display:none!important}
.k{font:600 15px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
body[data-lang=hi] .k{font:600 16px/1.3 var(--deva);letter-spacing:0;text-transform:none}
.top{display:flex;align-items:center;gap:8px;min-height:60px}
.sp{flex:1}
.brand{display:flex;align-items:center;gap:8px;font:400 24px/1 var(--serif);letter-spacing:-.01em}
.brand svg{width:26px;height:26px}
@media (max-width:420px){.brand span{display:none}}
.langs{display:flex;background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:12px;padding:3px;height:52px}
.langs button{min-width:44px;padding:0 10px;border-radius:9px;font:600 14px/1 var(--sans);color:var(--ink2)}
.langs button[data-lang-btn=hi]{font:600 16px/1 var(--deva)}
.langs button[aria-pressed=true]{background:var(--ink);color:#fff}
.ib{min-width:46px;height:46px;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.6);border:1px solid var(--line);padding:0 12px;font-size:15px;font-weight:600}
body[data-lang=hi] .ib{font-size:16px}
.ib svg{width:20px;height:20px}
.card{background:var(--card);border:1px solid rgba(255,255,255,.7);border-radius:var(--r);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 18px 40px -24px rgba(20,32,42,.35);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3)}
/* primary: an indigo slab with a hard sandstone edge (NeoPOP-style extrusion, no blur cost) */
.cta{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;min-height:60px;padding:0 26px;border-radius:14px;background:var(--move);color:#fff;
  font:700 19px/1 var(--sans);box-shadow:0 5px 0 #0D1534,0 16px 30px -12px rgba(30,42,87,.6);transition:transform .12s var(--e-out),box-shadow .12s var(--e-out)}
body[data-lang=hi] .cta{font:700 20px/1 var(--deva)}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 #0D1534,0 8px 20px -12px rgba(30,42,87,.6)}
.cta svg{width:22px;height:22px}
.cta .shine{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.22) 45%,transparent 60%);background-size:250% 100%;animation:shine 4s ease-in-out infinite 1s}
@keyframes shine{0%{background-position:120% 0}50%,100%{background-position:-60% 0}}
.ghost{min-height:52px;padding:0 20px;border-radius:14px;border:1.5px solid var(--line2);background:rgba(255,255,255,.55);font:600 16px/1 var(--sans)}
body[data-lang=hi] .ghost{font:600 17px/1 var(--deva)}
.portrait{position:relative;border-radius:22px;overflow:hidden;background:radial-gradient(100% 90% at 50% 30%,#F6D6A4 0,#E2B485 60%,#B98563);box-shadow:0 24px 40px -22px rgba(70,40,20,.55),0 0 0 4px rgba(255,255,255,.75)}
.portrait .asha-slot{position:absolute;inset:0}
.portrait .nm{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;align-items:center;z-index:2}
.nm b{background:rgba(255,255,255,.9);color:var(--ink);padding:5px 9px;border-radius:9px;font:600 16px/1 var(--sans)}
body[data-lang=hi] .nm b{font:600 17px/1.1 var(--deva)}
.ai{background:var(--her);color:#fff;padding:5px 8px;border-radius:9px;font:700 14px/1 var(--sans);letter-spacing:.02em}
body[data-lang=hi] .ai{font:700 16px/1 var(--deva)}
.portrait[data-talk]::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 3px rgba(194,81,42,.65);animation:talk 1.4s ease-in-out infinite}
@keyframes talk{50%{box-shadow:inset 0 0 0 6px rgba(194,81,42,.25)}}
.pending{display:none!important}
.reveal{animation:rise .7s var(--e-out) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}

/* the island (SVG diorama) */
.island{position:relative;width:100%}
.island svg{display:block;width:100%;height:100%;overflow:visible}
.cloud{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,0));filter:blur(2px);pointer-events:none;animation:drift 38s linear infinite}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(110vw)}}
.water-shim{animation:shim 3s linear infinite}
@keyframes shim{to{stroke-dashoffset:-40}}
.kite{animation:kite 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes kite{50%{transform:translate(6px,-8px) rotate(6deg)}}
.bob{animation:bob 7s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.rise-b{transform-box:fill-box;transform-origin:50% 100%;animation:build 1.6s var(--e-spring) both}
@keyframes build{0%{transform:scaleY(0);opacity:0}30%{opacity:1}}
.scaff{stroke:#7a5b3a;stroke-width:1;fill:none;animation:fadeout 2.4s ease both}
@keyframes fadeout{0%,55%{opacity:1}100%{opacity:0}}
.spark{animation:spark 1.8s ease-out both}
@keyframes spark{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-40px) scale(1.4)}}

/* ---------- OPEN ---------- */
.open .island{height:min(44vh,360px);margin-top:-6px}
.open-card{margin-top:-28px;padding:18px;display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;view-transition-name:panel}
.open-card .portrait{width:96px;height:112px;view-transition-name:asha}
.open-card .portrait .nm{display:none}
.hello h1{margin:0;font:400 38px/1 var(--serif);letter-spacing:-.01em}
body[data-lang=hi] .hello h1{font:400 34px/1.25 var(--dserif)}
.hello p{margin:6px 0 0;color:var(--ink2);font-size:16px}
.who-line{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.who-line b{font-weight:700}
.open .cta{margin-top:14px;grid-column:1/-1}
.open-nav{display:flex;gap:10px;margin-top:12px}
.open-nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;background:rgba(255,255,255,.55);border:1px solid var(--line);font-weight:600;font-size:15px}
body[data-lang=hi] .open-nav button{font-size:16px}
.open-nav svg{width:20px;height:20px}

/* ---------- INTAKE ---------- */
.intake-grid{flex:1;display:grid;gap:14px;align-content:start}
.speaker{display:grid;grid-template-columns:112px 1fr;gap:14px;align-items:end}
.speaker .portrait{width:112px;height:132px;view-transition-name:asha}
.speaker .portrait .nm{display:none}
.cap{margin:0;font:400 26px/1.22 var(--serif);letter-spacing:-.005em}
body[data-lang=hi] .cap{font:400 24px/1.45 var(--dserif)}
.cap .w{opacity:.2;transition:opacity .25s}
.cap .w.on{opacity:1}
.listen{display:flex;align-items:center;gap:10px;color:var(--secure);font-weight:600;min-height:44px}
.wave{display:flex;gap:3px;align-items:center;height:30px}
.wave i{width:4px;border-radius:2px;background:var(--secure);height:5px}
.you{justify-self:end;max-width:90%;padding:12px 14px;border-radius:14px 14px 4px 14px;background:var(--ink);color:#fff;font-size:17px}
.you .k{color:#B9C7D2;display:block;margin-bottom:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.65);border:1px solid var(--line);font-weight:600;font-size:15px}
body[data-lang=hi] .chip{font-size:16px}
.sheet-map{padding:0;overflow:hidden}
.sheet-map .tb{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.5)}
.sheet-map .body{padding:14px;display:grid;gap:12px}
.sheet-map h3{margin:0;font:400 28px/1.1 var(--serif)}
body[data-lang=hi] .sheet-map h3{font:400 26px/1.35 var(--dserif)}
.floors{display:grid;gap:6px}
.floor{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;min-height:44px;padding:0 10px;border-radius:10px;background:rgba(30,42,87,.05);transform-origin:left;transition:background .4s}
.floor i{width:26px;height:26px;border-radius:8px;border:2px solid var(--move);display:grid;place-items:center;font:700 14px/1 var(--sans);color:var(--move);font-style:normal}
.floor.lit{background:rgba(30,42,87,.1)}
.floor.lit i{background:var(--move);color:#fff}
.floor span{font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- LESSON ---------- */
.lesson-wrap{flex:1;display:grid;gap:12px;align-content:start}
.lesson-head{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center}
.lesson-head .portrait{width:84px;height:98px;border-radius:18px;view-transition-name:asha}
.lesson-head .portrait .nm{display:none}
.lesson .cap{font-size:23px;min-height:3.7em;display:flex;align-items:center;flex-wrap:wrap;column-gap:.25em}
body[data-lang=hi] .lesson .cap{font-size:21px}
.progress{display:flex;gap:4px;flex:1;max-width:520px}
.progress i{flex:1;height:6px;border-radius:3px;background:rgba(20,32,42,.12);overflow:hidden;position:relative}
.progress i::after{content:"";position:absolute;inset:0;background:var(--her);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--e-out)}
.progress i.done::after{transform:none}
.progress i.cp{background:rgba(30,42,87,.2)}
.board{position:relative;height:clamp(270px,44vh,440px);border-radius:18px;background:#FBFAF7;box-shadow:0 1px 0 #fff inset,0 20px 40px -26px rgba(20,32,42,.45);border:1px solid var(--line);overflow:hidden}
.board::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(46,97,140,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(46,97,140,.09) 1px,transparent 1px);background-size:24px 24px}
.board .tb{position:absolute;left:12px;top:10px;right:12px;display:flex;gap:8px;align-items:center;z-index:2}
.board svg{position:relative;width:100%;height:100%}
.cp-chip{display:none;align-items:center;gap:6px;padding:7px 10px;border-radius:10px;background:var(--move);color:#fff;font:700 14px/1 var(--sans);letter-spacing:.04em}
body[data-lang=hi] .cp-chip{font:700 16px/1 var(--deva)}
.cp-chip.on{display:inline-flex;animation:rise .5s var(--e-out)}
.ink{fill:none;stroke-linecap:round;stroke-linejoin:round}
.l-main{stroke:var(--ink);stroke-width:3.5}.l-tick{stroke:var(--ink);stroke-width:3}.l-arc{stroke:var(--her);stroke-width:3.5}
.l-num{fill:var(--ink2);font:600 26px var(--sans)}.l-frac{fill:var(--her);font:700 31px var(--sans)}
.l-hit{fill:transparent;cursor:pointer}.l-mark{fill:var(--move)}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw var(--d,.9s) var(--e-out) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .55s var(--e-spring) both}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
.board.ask{box-shadow:0 0 0 3px var(--move),0 20px 40px -26px rgba(20,32,42,.45)}
.hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-weight:700;color:var(--move);z-index:2}
.duplex{display:flex;align-items:center;gap:10px;min-height:50px;padding:0 14px;border-radius:14px;background:rgba(255,255,255,.55);border:1px solid var(--line);color:var(--ink2);font-size:15px}
body[data-lang=hi] .duplex{font-size:16px}
.duplex .wave i{background:var(--secure)}
.go-play{display:none}.go-play.on{display:flex;animation:rise .6s var(--e-out)}

/* ---------- GAME ---------- */
.mission{flex:1;display:grid;gap:14px;align-content:start}
.arch{position:relative;height:min(50vh,420px);border-radius:999px 999px 22px 22px;overflow:hidden;box-shadow:0 0 0 6px #fff,0 0 0 7px var(--line2),0 30px 50px -26px rgba(20,32,42,.6);background:#1b1640}
.arch img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:slowpan 18s ease-in-out infinite alternate}
@keyframes slowpan{to{transform:scale(1.08) translate(-2%,1%)}}
.arch .scrim{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(10,10,30,.85))}
.arch .t{position:absolute;left:18px;right:18px;bottom:16px;color:#fff}
.arch h2{margin:0;font:400 54px/.95 var(--serif)}
body[data-lang=hi] .arch h2{font:400 46px/1.2 var(--dserif)}
.arch p{margin:6px 0 0;color:#E3E6F2}
.naksha{padding:14px;display:grid;gap:8px}
.naksha p{margin:0;display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:15px}
body[data-lang=hi] .naksha p{font-size:16px}
.naksha p svg{width:20px;height:20px;color:var(--secure);margin-top:2px}
.holdbtn .fill{position:absolute;inset:0;border-radius:inherit;background:rgba(255,255,255,.28);transform:scaleX(0);transform-origin:left}
.next-tile{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;padding:10px}
.next-tile img{width:96px;height:72px;border-radius:10px;object-fit:cover}
.next-tile b{display:block;font-size:17px}
.next-tile span{font-size:15px;color:var(--ink2)}
body[data-lang=hi] .next-tile span{font-size:16px}
.play{position:fixed;inset:0;z-index:20;display:none;background:#0d0b22}
.play.on{display:block}
.play img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play .hud{position:absolute;left:12px;right:12px;top:12px;display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:16px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px)}
.play .hud .portrait{width:60px;height:68px;border-radius:12px;box-shadow:none}
.play .hud .portrait .nm{display:none}
.play .hud .cap{font-size:21px;min-height:0}
.play .fire{position:absolute;left:16px;right:16px;bottom:24px;max-width:420px;margin:0 auto}
.gate{position:fixed;inset:0;z-index:30;pointer-events:none;display:none}
.gate.on{display:block}

/* ---------- END ---------- */
.end-wrap{flex:1;display:grid;gap:14px;align-content:start}
.end-hero{padding:18px;display:grid;gap:6px}
.end-hero h2{margin:0;font:400 44px/1 var(--serif)}
body[data-lang=hi] .end-hero h2{font:400 38px/1.25 var(--dserif)}
.end-hero .mins{font:700 18px/1 var(--sans);color:var(--ink2)}
.did{list-style:none;margin:6px 0 0;padding:0;display:grid}
.did li{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:17px}
.did svg{width:22px;height:22px;color:var(--secure)}
.built{display:grid;grid-template-columns:1fr 140px;gap:12px;padding:16px;align-items:center;background:linear-gradient(135deg,rgba(11,122,112,.13),rgba(255,255,255,.85) 60%)}
.built .k{color:#05564F}
.built h3{margin:4px 0;font:400 30px/1.05 var(--serif)}
body[data-lang=hi] .built h3{font:400 26px/1.3 var(--dserif)}
.built p{margin:0;color:var(--ink2);font-size:15px}
body[data-lang=hi] .built p{font-size:16px}
.built .opened{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;font-weight:700}
.bp{width:140px;height:120px}
.bp .line{fill:none;stroke:#2E618C;stroke-width:1.4;stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1.6s var(--e-out) forwards .4s}
.bp .solid{opacity:0;animation:solid .8s ease forwards 1.9s}
@keyframes solid{to{opacity:1}}
.tmr{padding:14px 16px;display:grid;gap:4px}
.tmr .k{color:#9E3E1B}
.end-asha{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.end-asha .portrait{width:72px;height:84px;border-radius:16px;view-transition-name:asha}
.end-asha .portrait .nm{display:none}
.end-asha .cap{font-size:22px;min-height:0}

/* ---------- WORLD ---------- */
.world-wrap{flex:1;display:grid;gap:14px;align-content:start}
.world-title h2{margin:0;font:400 40px/1 var(--serif)}
body[data-lang=hi] .world-title h2{font:400 36px/1.25 var(--dserif)}
.seg{display:flex;background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:12px;padding:3px;height:52px}
.seg button{min-width:64px;padding:0 12px;border-radius:9px;font-weight:600;font-size:15px}
body[data-lang=hi] .seg button{font-size:16px}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.world .island{height:min(54vh,460px)}
.world .island .bld{cursor:pointer}
.tag{position:absolute;padding:6px 10px;border-radius:10px;background:#fff;box-shadow:0 8px 20px -10px rgba(20,32,42,.5);font-weight:700;font-size:15px;transform:translate(-50%,-100%);white-space:nowrap;pointer-events:none}
body[data-lang=hi] .tag{font-size:16px}
.tag.new{background:var(--secure);color:#fff}
.tag::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:inherit;transform:translateX(-50%) rotate(45deg)}
.coll h3{margin:0;font:400 30px/1.1 var(--serif)}
body[data-lang=hi] .coll h3{font:400 28px/1.3 var(--dserif)}
.coll>p{margin:4px 0 12px;color:var(--ink2);font-size:15px}
body[data-lang=hi] .coll>p{font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{position:relative;padding:12px;border-radius:14px;text-align:left;display:grid;gap:4px;min-height:160px;transition:transform .3s var(--e-out)}
.tile:hover{transform:translateY(-3px)}
.tile svg{width:100%;height:76px}
.tile b{font-size:16px;line-height:1.2}
.tile span{font-size:14px;color:var(--ink2);line-height:1.3}
body[data-lang=hi] .tile span{font-size:16px}
.tile.dim{background:rgba(255,255,255,.35);box-shadow:none;border:1.5px dashed rgba(46,97,140,.35)}
.tile.dim b{color:var(--ink2)}
.tile.new{box-shadow:0 0 0 2px var(--secure),0 18px 40px -24px rgba(20,32,42,.35)}
.tile.new::after{content:attr(data-new);position:absolute;top:10px;right:10px;padding:4px 7px;border-radius:7px;background:var(--secure);color:#fff;font:700 14px/1 var(--sans)}
body[data-lang=hi] .tile.new::after{font:700 16px/1 var(--deva)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:560px;margin:0 auto;padding:18px 16px 24px;border-radius:22px 22px 0 0;background:var(--card2);box-shadow:0 -20px 50px -20px rgba(20,32,42,.4);transform:translateY(110%);transition:transform .5s var(--e-out)}
.sheet.on{transform:none}
.sheet h4{margin:4px 0;font:400 30px/1.1 var(--serif)}
body[data-lang=hi] .sheet h4{font:400 26px/1.3 var(--dserif)}
.sheet p{margin:0 0 12px;color:var(--ink2)}

/* ---------- PARENT ---------- */
.p-wrap{flex:1;display:grid;gap:12px;align-content:start;max-width:900px;width:100%;margin:0 auto}
.p-wrap h2{margin:4px 0 0;font:400 46px/1 var(--serif)}
body[data-lang=hi] .p-wrap h2{font:400 38px/1.3 var(--dserif)}
.p-card{padding:16px;display:grid;gap:8px}
.p-card q{font:400 22px/1.3 var(--serif);quotes:"“" "”"}
body[data-lang=hi] .p-card q{font:400 21px/1.5 var(--dserif)}
.ev{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.st{padding:6px 9px;border-radius:8px;font:700 14px/1 var(--sans);white-space:nowrap;color:#fff}
body[data-lang=hi] .st{font:700 16px/1 var(--deva)}
.st.s{background:var(--secure)}.st.l{background:var(--look)}
.p-grid{display:grid;gap:12px}
.made{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center}
.made img{width:120px;height:90px;border-radius:10px;object-fit:cover}
.safe .k{color:#9E3E1B}

::view-transition-old(root){animation:.3s var(--e-out) both vo}
::view-transition-new(root){animation:.55s var(--e-out) both vn}
@keyframes vo{to{opacity:0}}
@keyframes vn{from{opacity:0;transform:translateY(20px)}}
::view-transition-group(asha){animation-duration:.75s;animation-timing-function:var(--e-out)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

@media (min-width:900px){
  section[data-screen]{padding:0 40px 30px}
  .open-main{display:grid;grid-template-columns:1.35fr 1fr;align-items:center;gap:20px;flex:1}
  .open .island{height:600px;margin:0}
  .open-card{margin:0;grid-template-columns:150px 1fr;padding:24px}
  .open-card .portrait{width:150px;height:176px}
  .hello h1{font-size:52px}
  .intake-grid{grid-template-columns:400px 1fr;gap:16px 32px;padding-top:10px}
  .speaker{grid-row:1/8;grid-template-columns:1fr;align-items:start}
  .speaker .portrait{width:400px;height:460px}
  .cap{font-size:34px}
  .lesson-wrap{grid-template-columns:280px 1fr;gap:16px 28px}
  .lesson-head{grid-row:1/4;grid-template-columns:1fr;align-items:start}
  .lesson-head .portrait{width:280px;height:320px}
  .lesson .cap{font-size:28px}
  .board{height:460px}
  .lesson-wrap>.lowbar{grid-column:2}
  .mission{grid-template-columns:1.2fr 1fr;gap:20px;align-items:start}
  .arch{grid-row:1/5;height:640px}
  .end-wrap{grid-template-columns:1fr 1fr;gap:16px 24px}
  .end-wrap .full{grid-column:1/-1}
  .world-wrap{grid-template-columns:1.5fr 1fr;gap:20px}
  .world-wrap .world-title{grid-column:1/-1}
  .world .island{height:600px}
  .p-grid{grid-template-columns:1fr 1fr}
}
</style>

/* ---------- GAME: hold, then an arch-shaped gate opens onto the game ---------- */

['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => launch.addEventListener(ev, () => { if (hold) { cancelAnimationFrame(hold); hold = null; fill.style.transform = 'scaleX(0)'; } }));
