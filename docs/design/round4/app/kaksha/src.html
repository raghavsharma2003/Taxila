<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaksha · Taxila U1 direction A</title>
<meta name="color-scheme" content="dark">
<!--@FONTS
Grotesk=SpaceGrotesk-latin-normal.woff2;font-weight:300 700
Mono=JetBrainsMono-latin-normal.woff2;font-weight:400 800
Anek=AnekDevanagari-devanagari-normal.woff2;font-weight:100 800;font-stretch:75% 125%
AnekL=AnekDevanagari-latin-normal.woff2;font-weight:100 800;font-stretch:75% 125%
-->
<style>
/* KAKSHA (कक्षा = orbit, and classroom). A premium game-client shell: deep space, hairline glass, one plasma
   "your move" colour, her warm kesar light, your planet whose night side lights up as ideas become secure. */
:root{
  --void:#05060A; --deep:#0A0D16; --panel:rgba(16,20,34,.78); --panel2:rgba(24,30,50,.86);
  --line:rgba(150,170,255,.16); --line2:rgba(150,170,255,.30);
  --ink:#EEF1F8; --ink2:#B9C0D4; --ink3:#9AA3BC;
  --plasma:#3EE6FF; --plasma2:#0FB8D6; --kesar:#FFB547; --secure:#7CF5B5; --look:#B3A6FF;
  --cut:12px;
  --sans:"Grotesk","AnekL","Anek",system-ui,sans-serif; --mono:"Mono","Anek",ui-monospace,monospace; --deva:"Anek","AnekL",sans-serif;
  --e-out:cubic-bezier(.16,1,.3,1); --e-snap:cubic-bezier(.3,1.4,.4,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--void);color:var(--ink)}
body{font:400 16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;min-height:100dvh;overflow-x:hidden}
body[data-lang=hi]{font-family:var(--deva);font-size:17px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--plasma);outline-offset:3px}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.app{position:relative;z-index:1;min-height:100dvh;max-width:1366px;margin:0 auto}
section[data-screen]{min-height:100dvh;padding:0 16px 28px;display:flex;flex-direction:column}
section[hidden]{display:none!important}
.mono{font-family:var(--mono);font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
body[data-lang=hi] .mono{font-family:var(--deva);font-size:16px;letter-spacing:0;text-transform:none}
.hair{border:1px solid var(--line)}
.cut{clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.glass{background:var(--panel);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}

/* top bar */
.top{display:flex;align-items:center;gap:8px;min-height:60px;padding-top:env(safe-area-inset-top)}
.mark{display:flex;align-items:center;gap:10px;font:700 15px/1 var(--mono);letter-spacing:.24em;color:var(--ink)}
@media (max-width:420px){.mark .wm{display:none}}
.mark i{width:22px;height:22px;border:1.5px solid var(--plasma);border-radius:50%;position:relative;display:block}
.mark i::after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:var(--kesar);top:-4px;left:6px;box-shadow:0 0 10px var(--kesar);animation:orb 6s linear infinite;transform-origin:3px 14px}
@keyframes orb{to{transform:rotate(360deg)}}
.sp{flex:1}
.langs{display:flex;border:1px solid var(--line);height:48px}
.langs button{min-width:44px;padding:0 10px;font:600 14px/1 var(--sans);color:var(--ink2)}
.langs button[data-lang-btn=hi]{font:600 16px/1 var(--deva)}
.langs button[aria-pressed=true]{color:var(--void);background:var(--ink)}
.icon-btn{min-width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);color:var(--ink2);padding:0 10px;font-size:14px}
.icon-btn svg{width:20px;height:20px}
body[data-lang=hi] .icon-btn{font-family:var(--deva);font-size:16px}

/* the comms frame Asha lives in: chamfered, hairline, a slow warm rim */
.comms{position:relative;background:linear-gradient(160deg,#2a2233,#141826 60%);overflow:hidden;--cut:18px}
.comms::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;border:1px solid rgba(255,181,71,.35);
  clip-path:inherit;box-shadow:inset 0 0 40px rgba(255,181,71,.14)}
.comms .tick{position:absolute;width:14px;height:14px;z-index:3;border-color:var(--kesar);border-style:solid;opacity:.9}
.comms .t1{top:8px;right:8px;border-width:1.5px 1.5px 0 0}.comms .t2{bottom:8px;left:8px;border-width:0 0 1.5px 1.5px}
.comms .who{position:absolute;left:12px;bottom:10px;z-index:3;display:flex;gap:8px;align-items:center}
.who b{font:700 18px/1 var(--sans);letter-spacing:.01em}
body[data-lang=hi] .who b{font-family:var(--deva);font-size:19px}
.ai{font:600 14px/1 var(--mono);color:var(--kesar);border:1px solid rgba(255,181,71,.5);padding:5px 7px;letter-spacing:.06em;background:rgba(10,12,20,.6)}
body[data-lang=hi] .ai{font:600 16px/1 var(--deva);letter-spacing:0}
.asha-slot{position:absolute;inset:0;background:radial-gradient(110% 90% at 50% 30%,#F4D3A0 0,#D9A877 55%,#9C6E55 100%)}
[data-asha-state=speak] + .ring, .comms[data-speaking] .ring{opacity:1}
.ring{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .3s;box-shadow:inset 0 0 0 2px rgba(255,181,71,.55),inset 0 0 60px rgba(255,181,71,.18)}

/* primary action: a plasma slab with real key travel and a light sweep */
.cta{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;min-height:60px;padding:0 28px;font:700 19px/1 var(--sans);letter-spacing:.02em;
  color:#021015;background:linear-gradient(180deg,#7BF0FF,var(--plasma) 45%,var(--plasma2));--cut:14px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(62,230,255,.6),0 10px 40px -8px rgba(62,230,255,.55);transition:transform .12s var(--e-out),filter .2s}
body[data-lang=hi] .cta{font:700 20px/1 var(--deva)}
.cta::after{content:"";position:absolute;inset:-40% auto -40% -30%;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:sweep 3.6s var(--e-out) infinite 1.2s}
@keyframes sweep{0%{left:-40%}40%,100%{left:130%}}
.cta:active{transform:translateY(2px) scale(.985);filter:brightness(1.1)}
.cta svg{width:22px;height:22px}
.ghost{min-height:52px;padding:0 20px;border:1px solid var(--line2);font:600 16px/1 var(--sans);color:var(--ink);--cut:10px;background:rgba(20,26,44,.6);transition:border-color .2s,background .2s}
body[data-lang=hi] .ghost{font-family:var(--deva);font-size:17px}
.ghost:hover{border-color:var(--plasma);background:rgba(62,230,255,.08)}

/* ---------- OPEN ---------- */
.open-main{flex:1;display:grid;align-content:center;gap:22px;padding:8px 0 4px}
.open-face{view-transition-name:asha;width:min(78vw,300px);aspect-ratio:3/3.5;margin:0 auto}
.open-copy{text-align:center}
.open-copy h1{margin:0;font:700 34px/1.05 var(--sans);letter-spacing:-.025em}
body[data-lang=hi] .open-copy h1{font:700 34px/1.2 var(--deva)}
.open-copy p{margin:10px auto 0;max-width:30ch;color:var(--ink2)}
.open .cta{width:min(100%,340px);margin:4px auto 0}
.dock{display:flex;justify-content:center;gap:10px;margin-top:6px}
.dock button{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;color:var(--ink2);border:1px solid var(--line);--cut:8px;font-size:15px}
body[data-lang=hi] .dock button{font-size:16px}
.dock svg{width:18px;height:18px}
.boot .open-face,.boot .open-copy>*,.boot .open .cta,.boot .dock{animation:rise .9s var(--e-out) both}
.boot .open-copy>*:nth-child(2){animation-delay:.08s}.boot .open .cta{animation-delay:.16s}.boot .dock{animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(18px);filter:blur(6px)}}

/* ---------- INTAKE ---------- */
.intake-grid{flex:1;display:grid;gap:14px;align-content:start;padding-top:6px}
.intake-face{view-transition-name:asha;height:min(38vh,300px);width:100%;transition:height .7s var(--e-out)}
.intake-grid.mapped .intake-face{height:min(22vh,170px)}
.cap{font:500 21px/1.35 var(--sans);min-height:2.7em;letter-spacing:-.005em}
body[data-lang=hi] .cap{font:500 21px/1.5 var(--deva)}
.cap .w{opacity:.18;transition:opacity .25s,color .25s}
.cap .w.on{opacity:1}
.cap.saying .w.on:last-child{color:var(--kesar)}
.listen{display:flex;align-items:center;gap:12px;min-height:44px}
.meter{display:flex;gap:3px;align-items:center;height:28px}
.meter i{width:3px;background:var(--plasma);border-radius:2px;height:4px;transition:height .08s}
.you{justify-self:end;max-width:88%;padding:12px 14px;background:rgba(62,230,255,.08);border:1px solid rgba(62,230,255,.3);--cut:10px;font-size:17px}
.you .mono{display:block;margin-bottom:4px;color:var(--plasma)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 14px;border:1px solid var(--line2);font-size:15px;color:var(--ink2);--cut:8px}
body[data-lang=hi] .chip{font-size:16px}
.map{padding:14px 16px;border:1px solid var(--line2);--cut:12px;background:var(--panel2);display:grid;gap:10px}
.trail{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font:500 14px/1.2 var(--mono);color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
body[data-lang=hi] .trail{font:500 16px/1.3 var(--deva);text-transform:none;letter-spacing:0}
.map h3{margin:0;font:700 22px/1.2 var(--sans)}
body[data-lang=hi] .map h3{font-family:var(--deva)}
.lock-on{position:relative}
.lock-on::before,.lock-on::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--plasma);transition:all .5s var(--e-out)}
.lock-on::before{left:-8px;top:-6px;border-width:2px 0 0 2px}.lock-on::after{right:-8px;bottom:-6px;border-width:0 2px 2px 0}
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:0;position:relative;margin-top:4px}
.plan::before{content:"";position:absolute;left:16.6%;right:16.6%;top:15px;height:1px;background:var(--line2)}
.plan div{display:grid;justify-items:center;gap:6px;text-align:center;font-size:15px;color:var(--ink2);position:relative}
body[data-lang=hi] .plan div{font-size:16px}
.plan div i{width:30px;height:30px;border:1.5px solid var(--plasma);transform:rotate(45deg);background:var(--deep);display:grid;place-items:center}
.plan div i::after{content:"";width:8px;height:8px;background:var(--plasma);transform:scale(0);transition:transform .4s var(--e-snap)}
.plan div.lit i::after{transform:scale(1)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.reveal{animation:rise .7s var(--e-out) both}
.pending{display:none!important}

/* ---------- LESSON ---------- */
.lesson-wrap{flex:1;display:grid;gap:12px;align-content:start;grid-template-rows:auto 1fr auto}
.lesson-head{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center}
.lesson-face{view-transition-name:asha;width:92px;height:108px;--cut:12px}
.lesson-face .who{display:none}
.lesson .cap{font-size:19px;min-height:3.9em}
body[data-lang=hi] .lesson .cap{font-size:19px}
.steps{display:flex;align-items:center;gap:6px}
.steps i{flex:1;height:3px;background:var(--line);position:relative;overflow:hidden}
.steps i::after{content:"";position:absolute;inset:0;background:var(--kesar);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--e-out)}
.steps i.done::after{transform:scaleX(1)}
.steps i.cp{background:rgba(62,230,255,.25)}
.board{position:relative;--cut:16px;height:clamp(260px,44vh,420px);align-self:start;background:linear-gradient(180deg,rgba(14,18,30,.92),rgba(9,12,20,.95));border:1px solid var(--line);min-height:300px;display:grid;overflow:hidden}
.board::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;opacity:.35;mask-image:radial-gradient(80% 70% at 50% 50%,#000 30%,transparent)}
.board svg{position:relative;width:100%;height:100%;display:block}
.board .bhead{position:absolute;left:14px;top:12px;display:flex;gap:10px;align-items:center;z-index:2}
.cp-chip{display:none;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--plasma);color:var(--plasma);font:700 14px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;--cut:6px;background:rgba(62,230,255,.08)}
body[data-lang=hi] .cp-chip{font:700 16px/1 var(--deva);letter-spacing:0}
.cp-chip.on{display:inline-flex;animation:rise .5s var(--e-out)}
.cp-chip i{width:8px;height:8px;background:var(--plasma);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.ink{fill:none;stroke-linecap:round}
.l-main{stroke:var(--ink);stroke-width:3}
.l-tick{stroke:var(--ink);stroke-width:3}
.l-arc{stroke:var(--kesar);stroke-width:3}
.l-lab{fill:var(--ink);font:600 22px var(--sans)}
.l-frac{fill:var(--kesar);font:700 31px var(--sans)}
.l-num{fill:var(--ink2);font:600 26px var(--mono)}
.l-hit{fill:transparent;cursor:pointer}
.l-mark{fill:var(--plasma)}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw var(--d,.9s) var(--e-out) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .55s var(--e-snap) both}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
.board.ask{border-color:rgba(62,230,255,.6);box-shadow:inset 0 0 50px rgba(62,230,255,.08)}
.hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:var(--plasma);font:600 15px/1 var(--sans);z-index:2}
body[data-lang=hi] .hint{font:600 16px/1 var(--deva)}
.duplex{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 12px;border:1px solid var(--line);--cut:10px;background:rgba(10,13,22,.7);color:var(--ink2);font-size:15px}
body[data-lang=hi] .duplex{font-size:16px}
.duplex .dot{width:10px;height:10px;border-radius:50%;background:var(--secure);box-shadow:0 0 12px var(--secure);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.4;transform:scale(.8)}}
.duplex .meter i{background:var(--secure)}
.go-play{display:none}
.go-play.on{display:flex;animation:rise .6s var(--e-out)}

/* ---------- GAME ---------- */
.mission{flex:1;display:grid;gap:14px;align-content:start}
.hero{position:relative;height:min(52vh,430px);overflow:hidden;--cut:18px;border:1px solid var(--line)}
.hero img{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;transition:transform 1.2s var(--e-out)}
.hero:hover img{transform:scale(1.03)}
.hero .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,6,10,.1) 40%,rgba(5,6,10,.92))}
.hero .title{position:absolute;left:16px;right:16px;bottom:14px}
.hero h2{margin:0;font:700 46px/.95 var(--sans);letter-spacing:-.03em;text-transform:uppercase}
body[data-lang=hi] .hero h2{font:800 46px/1.1 var(--deva);text-transform:none}
.bracket{position:absolute;left:58%;top:47%;width:64px;height:64px;transform:translate(-50%,-50%);border:2px solid var(--plasma);clip-path:polygon(0 0,30% 0,30% 4%,4% 4%,4% 30%,0 30%,0 70%,4% 70%,4% 96%,30% 96%,30% 100%,70% 100%,70% 96%,96% 96%,96% 70%,100% 70%,100% 30%,96% 30%,96% 4%,70% 4%,70% 0,100% 0,100% 100%,0 100%);animation:lock 2.4s var(--e-out) infinite}
@keyframes lock{0%{width:120px;height:120px;opacity:0}30%{width:64px;height:64px;opacity:1}80%{opacity:1}100%{opacity:0}}
.buildlog{display:grid;gap:6px;padding:12px 14px;border:1px solid var(--line);--cut:10px;background:var(--panel)}
.buildlog p{margin:0;font:500 14px/1.4 var(--mono);color:var(--ink2)}
body[data-lang=hi] .buildlog p{font:500 16px/1.4 var(--deva)}
.buildlog p b{color:var(--secure);font-weight:600}
.holdbtn{position:relative}
.holdbtn .fill{position:absolute;inset:0;background:rgba(255,255,255,.35);transform:scaleX(0);transform-origin:left}
.next-tile{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);--cut:10px;background:var(--panel)}
.next-tile img{width:96px;height:72px;object-fit:cover;--cut:8px}
.next-tile b{display:block;font-size:17px}
.next-tile span{color:var(--ink2);font-size:15px}
body[data-lang=hi] .next-tile span{font-size:16px}
.play{position:fixed;inset:0;z-index:20;display:none;background:#000}
.play.on{display:block}
.play img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play .hud{position:absolute;left:12px;right:12px;top:12px;display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:8px;background:rgba(5,6,10,.72);border:1px solid var(--line);--cut:10px;backdrop-filter:blur(8px)}
.play .hud .comms{width:64px;height:72px;--cut:8px}
.play .hud .comms .who{display:none}
.play .hud .cap{font-size:18px;min-height:0}
.play .fire{position:absolute;left:16px;right:16px;bottom:24px;max-width:420px;margin:0 auto}
.warp{position:fixed;inset:0;z-index:30;pointer-events:none;display:none}
.warp.on{display:block}

/* ---------- END ---------- */
.debrief{flex:1;display:grid;gap:14px;align-content:start;padding-top:4px}
.big-time{display:flex;align-items:baseline;gap:10px}
.big-time b{font:700 64px/1 var(--sans);letter-spacing:-.04em}
.big-time span{color:var(--ink2)}
.did{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.did li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);font-size:17px}
.did li svg{width:22px;height:22px;color:var(--secure);margin-top:2px}
.secure-card{position:relative;padding:16px;--cut:16px;background:linear-gradient(135deg,rgba(124,245,181,.14),rgba(16,20,34,.9) 60%);border:1px solid rgba(124,245,181,.45);overflow:hidden;display:grid;grid-template-columns:1fr 112px;gap:12px;align-items:center}
.secure-card .k{color:var(--secure)}
.secure-card h3{margin:4px 0 2px;font:700 24px/1.15 var(--sans)}
body[data-lang=hi] .secure-card h3{font-family:var(--deva)}
.secure-card p{margin:0;color:var(--ink2);font-size:15px}
body[data-lang=hi] .secure-card p{font-size:16px}
.opened{display:flex;gap:10px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid rgba(124,245,181,.25)}
.opened b{font-size:16px}
.ship{width:112px;height:84px}
.ship-dock{animation:dock 1.6s var(--e-out) both .5s}
@keyframes dock{from{transform:translate(-80px,40px) rotate(-18deg) scale(.6);opacity:0}}
.tmr{padding:14px 16px;border:1px solid var(--line);--cut:12px;background:var(--panel);display:grid;gap:6px}
.end-asha{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.end-asha .comms{width:72px;height:84px;--cut:10px;view-transition-name:asha}
.end-asha .comms .who{display:none}
.end-asha .cap{font-size:18px;min-height:0}

/* ---------- WORLD ---------- */
.world-wrap{flex:1;display:grid;gap:14px;align-content:start}
.world-head{display:flex;align-items:end;gap:10px;justify-content:space-between}
.world-head h2{margin:0;font:700 30px/1 var(--sans);letter-spacing:-.02em}
body[data-lang=hi] .world-head h2{font-family:var(--deva);line-height:1.2}
.seg{display:flex;border:1px solid var(--line2);height:48px}
.seg button{min-width:64px;padding:0 12px;color:var(--ink2);font-size:15px}
body[data-lang=hi] .seg button{font-size:16px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--void)}
.orbit{position:relative;height:min(56vh,440px);--cut:18px;border:1px solid var(--line);background:radial-gradient(70% 60% at 50% 55%,rgba(30,40,80,.5),rgba(5,6,10,.2));overflow:hidden}
.orbit canvas{position:absolute;inset:0;width:100%;height:100%}
.orbit .tag{position:absolute;padding:6px 9px;background:rgba(5,6,10,.82);border:1px solid var(--line2);font-size:14px;white-space:nowrap;transform:translate(-50%,-140%);pointer-events:none;transition:opacity .4s}
body[data-lang=hi] .orbit .tag{font-size:16px}
.orbit .tag.new{border-color:var(--secure);color:var(--secure)}
.legend{position:absolute;left:12px;bottom:10px;display:flex;gap:12px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink2)}
body[data-lang=hi] .legend span{font-size:16px}
.legend i{width:10px;height:10px;transform:rotate(45deg)}
.hangar h3{margin:0 0 4px;font:700 22px/1.2 var(--sans)}
body[data-lang=hi] .hangar h3{font-family:var(--deva)}
.hangar>p{margin:0 0 12px;color:var(--ink2);font-size:15px}
body[data-lang=hi] .hangar>p{font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{position:relative;padding:12px;--cut:12px;border:1px solid var(--line);background:var(--panel);display:grid;gap:6px;min-height:150px;text-align:left;transition:transform .3s var(--e-out),border-color .3s}
.tile:hover{transform:translateY(-3px);border-color:var(--line2)}
.tile svg.sh{width:100%;height:64px}
.tile b{font-size:16px;line-height:1.2}
.tile span{font-size:14px;color:var(--ink2);line-height:1.3}
body[data-lang=hi] .tile span{font-size:16px}
.tile.new{border-color:rgba(124,245,181,.6);box-shadow:0 0 30px -10px rgba(124,245,181,.5)}
.tile.new::after{content:attr(data-new);position:absolute;top:10px;right:10px;font:700 14px/1 var(--mono);color:var(--void);background:var(--secure);padding:4px 6px;letter-spacing:.06em}
body[data-lang=hi] .tile.new::after{font:700 16px/1 var(--deva)}
.tile.dim{background:rgba(10,12,20,.5)}
.tile.dim svg.sh{opacity:.35;filter:grayscale(1)}
.tile.dim b{color:var(--ink2)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:560px;margin:0 auto;padding:18px 16px 24px;background:var(--panel2);border:1px solid var(--line2);--cut:16px;transform:translateY(110%);transition:transform .45s var(--e-out);backdrop-filter:blur(16px)}
.sheet.on{transform:none}
.sheet h4{margin:4px 0 6px;font:700 22px/1.2 var(--sans)}
body[data-lang=hi] .sheet h4{font-family:var(--deva)}
.sheet p{margin:0 0 12px;color:var(--ink2)}

/* ---------- PARENT ---------- */
.parent{background:linear-gradient(180deg,#0B0E16,#0E1220)}
.p-wrap{flex:1;display:grid;gap:12px;align-content:start;max-width:880px;width:100%;margin:0 auto}
.p-wrap h2{margin:6px 0 0;font:700 32px/1.1 var(--sans);letter-spacing:-.02em}
body[data-lang=hi] .p-wrap h2{font-family:var(--deva);line-height:1.25}
.p-card{padding:16px;border:1px solid var(--line);--cut:12px;background:rgba(16,20,34,.9);display:grid;gap:8px}
.p-card .mono{color:var(--ink3)}
.p-card q{font-size:18px;line-height:1.45;quotes:"“" "”"}
.ev{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.ev:first-of-type{border-top:0}
.st{font:700 14px/1 var(--mono);padding:6px 8px;letter-spacing:.04em;white-space:nowrap;text-transform:uppercase}
body[data-lang=hi] .st{font:700 16px/1 var(--deva);text-transform:none;letter-spacing:0}
.st.s{color:#052215;background:var(--secure)}.st.l{color:#170F33;background:var(--look)}.st.c{color:#2A1800;background:var(--kesar)}
.p-grid{display:grid;gap:12px}
.made{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center}
.made img{width:120px;height:90px;object-fit:cover;--cut:8px}
.safe{border-color:rgba(255,181,71,.4)}

/* ---------- motion between screens ---------- */
::view-transition-old(root){animation:.35s var(--e-out) both vt-out}
::view-transition-new(root){animation:.55s var(--e-out) both vt-in}
@keyframes vt-out{to{opacity:0;transform:scale(.985);filter:blur(4px)}}
@keyframes vt-in{from{opacity:0;transform:translateY(14px) scale(1.01);filter:blur(6px)}}
::view-transition-group(asha){animation-duration:.7s;animation-timing-function:var(--e-out)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- desktop 1366 ---------- */
@media (min-width:900px){
  section[data-screen]{padding:0 40px 32px}
  .open-main{grid-template-columns:minmax(300px,420px) minmax(320px,460px);justify-content:center;align-items:center;gap:56px}
  .open-face{width:100%;max-width:400px}
  .open-copy{text-align:left}.open-copy h1{font-size:56px}.open-copy p{margin-left:0;font-size:18px}
  .open .cta{margin:28px 0 0;width:340px}.dock{justify-content:flex-start;margin-top:14px}
  .open-copy-wrap{display:grid}
  .intake-grid{grid-template-columns:420px 1fr;gap:28px;align-items:start;padding-top:16px}
  .intake-face{height:520px;grid-row:span 6}
  .lesson-wrap{grid-template-columns:300px 1fr;grid-template-rows:auto 1fr auto;gap:16px 28px}
  .lesson-head{grid-row:1/3;grid-template-columns:1fr;align-content:start}
  .lesson-face{width:300px;height:340px}.lesson-face .who{display:flex}
  .lesson .cap{font-size:22px}
  .board{height:440px}
  .lesson-wrap>div:last-child{grid-column:2;align-self:start}
  .mission{grid-template-columns:1.4fr 1fr;align-items:start;gap:20px}
  .hero{height:600px;grid-row:span 4}
  .debrief{grid-template-columns:1fr 1fr;gap:16px 28px}
  .debrief>.full{grid-column:1/-1}
  .world-wrap{grid-template-columns:1.3fr 1fr;gap:20px}
  .world-head{grid-column:1/-1}
  .orbit{height:600px}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .p-grid{grid-template-columns:1fr 1fr}
}
</style>

    return `<button class="tile cut ${have ? '' : 'dim'} ${have && h.today ? 'new' : ''}" data-new="${T('k.new')}" data-id="${h.id}">${shipSVG(h.c, h.id)}<b>${h.n[U.lang]}</b><span>${have ? '' : T('opens.when') + ': '}${h.by[U.lang]}</span></button>`; }).join('');

function setAfter(v) { after = v; document.getElementById('w-after').setAttribute('aria-pressed', v); document.getElementById('w-before').setAttribute('aria-pressed', !v); if (v) { dockT = performance.now(); U.sfx('chime'); } renderTiles(); }
document.getElementById('w-before').onclick = () => setAfter(false); document.getElementById('w-after').onclick = () => setAfter(true);
document.getElementById('tiles').addEventListener('click', (e) => { const b = e.target.closest('.tile'); if (!b) return; U.sfx('tap'); const h = HANGAR.find((x) => x.id === b.dataset.id); const have = h.have && (after || !h.today);
  document.getElementById('sh-k').textContent = have ? T('opened') : T('opens.when'); document.getElementById('sh-h').textContent = h.n[U.lang]; document.getElementById('sh-p').textContent = h.by[U.lang]; document.getElementById('sheet').classList.add('on'); });
document.getElementById('sh-x').onclick = () => document.getElementById('sheet').classList.remove('on');
U.on.world = async (tok, opt) => { document.getElementById('sheet').classList.remove('on'); setAfter(opt.at !== 'before'); if (!orbitRun) { orbitRun = true; requestAnimationFrame(drawOrbit); } };
U.on.lang = () => { if (U.screen === 'world') renderTiles(); };
U.on.open = async (tok) => { U.ashaState('idle'); };
U.on.parent = async () => {};
})();
</script>
