<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chhaap · Taxila U1 direction C</title>
<meta name="color-scheme" content="light">
<!--@FONTS
Bric=bricolage-grotesque-latin.woff2;font-weight:200 800
Anek=AnekDevanagari-devanagari-normal.woff2;font-weight:100 800;font-stretch:75% 125%
Geist=geist-mono-latin.woff2;font-weight:100 900
-->
<style>
/* CHHAAP (छाप = a print, a stamp, an impression). A riso print studio: two inks (fluoro rani pink and riso
   blue) and black on bright stock, halftone, misregistration that snaps into place, Sanganer block-print
   motifs. Every idea you make pakka becomes a wooden block; your poster prints a new pass with it. */
:root{
  --paper:#F6F5F1; --paper2:#ECEAE3; --ink:#121212; --ink2:#3E3E3E; --ink3:#5A5A5A;
  --pink:#FF3D8B; --pink2:#E0206F; --blue:#2D4BF0; --blue2:#1E36C8; --mint:#00A884; --sun:#FFC21A; --look:#6A4BF0;
  --sans:"Bric","Anek",system-ui,sans-serif; --deva:"Anek","Bric",sans-serif; --mono:"Geist","Anek",ui-monospace,monospace;
  --e-out:cubic-bezier(.16,1,.3,1); --e-stamp:cubic-bezier(.5,0,.75,0); --e-pop:cubic-bezier(.34,1.7,.6,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--sans);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(rgba(18,18,18,.05) 1px,transparent 1.2px);background-size:5px 5px}
body[data-lang=hi]{font-family:var(--deva);font-size:17px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.app{max-width:1366px;margin:0 auto;min-height:100dvh;position:relative}
section[data-screen]{min-height:100dvh;padding:0 16px 28px;display:flex;flex-direction:column;position:relative}
section[hidden]{display:none!important}
.lab{font:600 14px/1.2 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)}
body[data-lang=hi] .lab{font:600 16px/1.3 var(--deva);letter-spacing:0;text-transform:none}
.top{display:flex;align-items:center;gap:8px;min-height:62px}
.sp{flex:1}
.logo{font:800 22px/1 var(--sans);letter-spacing:-.04em;position:relative;color:var(--ink)}
.logo::before{content:"taxila";position:absolute;left:2px;top:2px;color:var(--pink);mix-blend-mode:multiply;z-index:-1}
@media (max-width:420px){.logo{display:none}}
.langs{display:flex;border:2px solid var(--ink);height:46px;background:var(--paper)}
.langs button{min-width:44px;padding:0 10px;font:700 14px/1 var(--sans)}
.langs button[data-lang-btn=hi]{font:700 16px/1 var(--deva)}
.langs button+button{border-left:2px solid var(--ink)}
.langs button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.ib{min-width:46px;height:46px;display:grid;place-items:center;border:2px solid var(--ink);background:var(--paper);padding:0 12px;font-weight:700;font-size:15px}
body[data-lang=hi] .ib{font-size:16px}
.ib svg{width:20px;height:20px}
/* a print block: hard black rule + a misregistered ink shadow */
.blk{background:var(--paper);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--pink)}
.blk.b{box-shadow:5px 5px 0 var(--blue)}
.cta{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;min-height:62px;padding:0 26px;background:var(--blue);color:#fff;border:2px solid var(--ink);
  box-shadow:6px 6px 0 var(--pink);font:800 21px/1 var(--sans);letter-spacing:-.01em;transition:transform .1s var(--e-out),box-shadow .1s var(--e-out)}
body[data-lang=hi] .cta{font:700 22px/1 var(--deva)}
.cta:hover{transform:translate(-1px,-1px);box-shadow:7px 7px 0 var(--pink)}
.cta:active{transform:translate(5px,5px);box-shadow:1px 1px 0 var(--pink)}
.cta svg{width:22px;height:22px}
.ghost{min-height:52px;padding:0 18px;border:2px solid var(--ink);background:var(--paper);font:700 16px/1 var(--sans)}
body[data-lang=hi] .ghost{font:700 17px/1 var(--deva)}
.ghost:active{transform:translate(2px,2px)}
.frame{position:relative;border:2px solid var(--ink);background:radial-gradient(100% 90% at 50% 30%,#F8D9A8,#E6B488 60%,#C08A64);box-shadow:8px 8px 0 var(--pink);overflow:hidden}
.frame .asha-slot{position:absolute;inset:0}
.frame .tag{position:absolute;left:0;bottom:0;display:flex;z-index:2}
.frame .tag b{background:var(--ink);color:var(--paper);padding:6px 10px;font:800 16px/1 var(--sans)}
body[data-lang=hi] .frame .tag b{font:700 17px/1.1 var(--deva)}
.frame .tag span{background:var(--sun);color:var(--ink);padding:6px 8px;font:700 14px/1.15 var(--mono);text-transform:uppercase}
body[data-lang=hi] .frame .tag span{font:700 16px/1 var(--deva);text-transform:none}
.reg{animation:reg .9s var(--e-out) both}
@keyframes reg{from{box-shadow:22px -10px 0 var(--pink);transform:translate(-6px,4px)}}
.pending{display:none!important}
.reveal{animation:inkin .6s var(--e-out) both}
@keyframes inkin{from{opacity:0;transform:translate(-8px,6px);filter:blur(2px)}}
.mark{position:absolute;width:18px;height:18px;border:1.5px solid var(--ink);border-radius:50%;pointer-events:none}
.mark::before,.mark::after{content:"";position:absolute;background:var(--ink)}
.mark::before{left:-6px;right:-6px;top:50%;height:1.5px;margin-top:-.75px}.mark::after{top:-6px;bottom:-6px;left:50%;width:1.5px;margin-left:-.75px}

/* ---------- OPEN: a poster ---------- */
.poster{flex:1;display:grid;gap:22px;align-content:start;padding-top:4px;position:relative}
.big{position:relative;margin:8px 0 6px;font:800 84px/.86 var(--sans);letter-spacing:-.055em;text-transform:none}
.big .p{position:absolute;inset:0;color:var(--pink);mix-blend-mode:multiply;transform:translate(4px,3px);z-index:0}
.big .k{position:relative;z-index:1;color:var(--blue);mix-blend-mode:multiply}
body[data-lang=hi] .big{font:800 64px/1.05 var(--deva);letter-spacing:0}
.big-reg .p{animation:mis 1.1s var(--e-out) both}
@keyframes mis{from{transform:translate(18px,-8px)}}
.open-row{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:end}
.open-row .frame{width:150px;height:180px;view-transition-name:asha}
.open-row .frame .tag{display:none}
.open-row p{margin:0;font-size:17px;color:var(--ink2)}
.who{display:flex;gap:0;margin-top:10px}
.who b{background:var(--ink);color:var(--paper);padding:6px 10px;font:800 16px/1 var(--sans)}
body[data-lang=hi] .who b{font:700 17px/1.1 var(--deva)}
.who span{background:var(--sun);padding:6px 8px;font:700 14px/1.15 var(--mono);text-transform:uppercase}
body[data-lang=hi] .who span{font:700 16px/1 var(--deva);text-transform:none}
.open .cta{margin-top:4px}
.open-nav{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.open-nav button{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 14px;border:2px solid var(--ink);background:var(--paper);font-weight:700;font-size:15px;text-align:left}
body[data-lang=hi] .open-nav button{font-size:16px}
.open-nav svg{width:24px;height:24px;flex:none}
.open-poster{display:none}
.strip{height:36px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);overflow:hidden;position:relative}
.strip svg{position:absolute;inset:0;width:200%;height:100%;animation:runstrip 30s linear infinite}
@keyframes runstrip{to{transform:translateX(-50%)}}

/* ---------- INTAKE ---------- */
.intake-grid{flex:1;display:grid;gap:14px;align-content:start}
.speak{display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:start}
.speak .frame{width:104px;height:122px;box-shadow:6px 6px 0 var(--pink);view-transition-name:asha}
.speak .frame .tag{display:none}
.cap{margin:0;font:700 25px/1.18 var(--sans);letter-spacing:-.02em}
body[data-lang=hi] .cap{font:600 24px/1.45 var(--deva);letter-spacing:0}
.cap .w{opacity:.16;transition:opacity .2s}
.cap .w.on{opacity:1}
.cap.saying .w.on:last-child{background:linear-gradient(transparent 55%,rgba(255,61,139,.45) 55%)}
.listen{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--blue);min-height:44px}
.bars{display:flex;gap:3px;align-items:center;height:30px}
.bars i{width:5px;height:5px;background:var(--blue)}
.you{justify-self:end;max-width:90%;padding:12px 14px;background:var(--sun);border:2px solid var(--ink);font-size:17px;font-weight:500}
.you .lab{display:block;color:var(--ink);margin-bottom:2px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 14px;border:2px solid var(--ink);background:var(--paper);font-weight:700;font-size:15px}
body[data-lang=hi] .chip{font-size:16px}
.map{padding:14px;display:grid;gap:10px;position:relative}
.map h3{margin:0;font:800 30px/1 var(--sans);letter-spacing:-.03em}
body[data-lang=hi] .map h3{font:700 28px/1.3 var(--deva);letter-spacing:0}
.stamped{position:absolute;right:10px;top:-16px;background:var(--paper);transform:rotate(-8deg);border:2.5px solid var(--pink);color:var(--pink);padding:4px 8px;font:800 14px/1 var(--mono);text-transform:uppercase;animation:stamp .45s var(--e-stamp) both .25s}
body[data-lang=hi] .stamped{font:700 16px/1.1 var(--deva)}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.4);opacity:0}70%{transform:rotate(-8deg) scale(.94);opacity:1}}
.passes{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--ink)}
.passes div{display:grid;gap:4px;padding:10px;min-height:64px;font-weight:700;font-size:15px;position:relative;overflow:hidden}
body[data-lang=hi] .passes div{font-size:16px}
.passes div+div{border-left:2px solid var(--ink)}
.passes div::before{content:"";position:absolute;inset:0;transform:scaleX(0);transform-origin:left;transition:transform .5s var(--e-out);z-index:-1}
.passes div:nth-child(1)::before{background:rgba(255,61,139,.35)}.passes div:nth-child(2)::before{background:rgba(45,75,240,.25)}.passes div:nth-child(3)::before{background:rgba(255,194,26,.5)}
.passes div.lit::before{transform:none}
.passes .lab{color:var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap}

/* ---------- LESSON ---------- */
.lesson-wrap{flex:1;display:grid;gap:12px;align-content:start}
.lhead{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center}
.lhead .frame{width:84px;height:100px;box-shadow:5px 5px 0 var(--pink);view-transition-name:asha}
.lhead .frame .tag{display:none}
.lesson .cap{font-size:22px;min-height:3.6em;display:flex;flex-wrap:wrap;align-content:center;column-gap:.25em}
body[data-lang=hi] .lesson .cap{font-size:21px}
.pg{display:flex;gap:3px;flex:1;max-width:560px}
.pg i{flex:1;height:12px;border:2px solid var(--ink);background:var(--paper);position:relative;overflow:hidden}
.pg i::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,var(--pink) 0 3px,transparent 3px 6px);transform:translateX(-101%);transition:transform .5s var(--e-out)}
.pg i.done::after{transform:none}
.pg i.cp{border-color:var(--blue)}
.board{position:relative;height:clamp(270px,44vh,440px);background:#fff;border:2px solid var(--ink);box-shadow:6px 6px 0 var(--blue);overflow:hidden}
.board .tb{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:8px;align-items:center;z-index:2}
.board svg{position:relative;width:100%;height:100%}
.cp-chip{display:none;background:var(--blue);color:#fff;padding:6px 9px;font:700 14px/1 var(--mono);text-transform:uppercase;border:2px solid var(--ink)}
body[data-lang=hi] .cp-chip{font:700 16px/1 var(--deva)}
.cp-chip.on{display:inline-block;animation:stamp .4s var(--e-stamp) both}
.ink{fill:none;stroke-linecap:square}
.l-main{stroke:var(--ink);stroke-width:4}.l-tick{stroke:var(--ink);stroke-width:4}.l-arc{stroke:var(--pink);stroke-width:5;mix-blend-mode:multiply}
.l-num{fill:var(--ink2);font:700 21px var(--mono)}.l-frac{fill:var(--blue);font:800 27px var(--sans)}
.l-hit{fill:transparent;cursor:pointer}.l-mark{fill:var(--blue)}
.dots{fill:url(#half)}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw var(--d,.9s) var(--e-out) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s var(--e-pop) both}
@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-8deg)}}
.board.ask{box-shadow:6px 6px 0 var(--pink);border-color:var(--blue)}
.hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-weight:800;color:var(--blue);z-index:2}
.duplex{display:flex;align-items:center;gap:10px;min-height:50px;padding:0 12px;border:2px solid var(--ink);background:var(--paper);font-size:15px;font-weight:600}
body[data-lang=hi] .duplex{font-size:16px}
.duplex .bars i{background:var(--mint)}
.go-play{display:none}.go-play.on{display:flex;animation:inkin .5s var(--e-out)}

/* ---------- GAME ---------- */
.mission{flex:1;display:grid;gap:16px;align-content:start}
.gposter{position:relative;height:min(50vh,430px);border:2px solid var(--ink);box-shadow:8px 8px 0 var(--pink);overflow:hidden;background:#1d1350}
.gposter img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.1) contrast(1.05)}
.gposter .half{position:absolute;inset:0;background-image:radial-gradient(rgba(255,61,139,.55) 30%,transparent 32%);background-size:7px 7px;mask-image:linear-gradient(180deg,#000,transparent 35%,transparent 65%,#000);mix-blend-mode:screen;opacity:.6}
.gposter h2{position:absolute;left:10px;right:10px;bottom:6px;margin:0;font:800 64px/.8 var(--sans);letter-spacing:-.06em;color:#fff}
.gposter h2 span{position:absolute;left:4px;top:3px;color:var(--pink);mix-blend-mode:screen;z-index:-0}
body[data-lang=hi] .gposter h2{font:800 58px/1.05 var(--deva);letter-spacing:0}
.gposter .sticker{position:absolute;right:10px;top:10px;background:var(--sun);border:2px solid var(--ink);padding:6px 9px;font:700 14px/1 var(--mono);text-transform:uppercase;transform:rotate(4deg)}
body[data-lang=hi] .gposter .sticker{font:700 16px/1.1 var(--deva)}
.recipe{padding:12px 14px;display:grid;gap:6px}
.recipe p{margin:0;display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:15px;font-weight:500}
body[data-lang=hi] .recipe p{font-size:16px}
.recipe p b{font:800 15px/1.4 var(--mono);color:var(--pink)}
.holdbtn .fill{position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.35) 0 6px,transparent 6px 12px);transform:scaleX(0);transform-origin:left}
.next-tile{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;padding:10px}
.next-tile img{width:96px;height:72px;object-fit:cover;border:2px solid var(--ink)}
.next-tile b{display:block;font-size:17px}
.next-tile span{font-size:15px;color:var(--ink2)}
body[data-lang=hi] .next-tile span{font-size:16px}
.play{position:fixed;inset:0;z-index:20;display:none;background:#1d1350}
.play.on{display:block}
.play img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play .hud{position:absolute;left:12px;right:12px;top:12px;display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center;padding:8px;background:var(--paper);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--pink)}
.play .hud .frame{width:60px;height:70px;box-shadow:none}
.play .hud .frame .tag{display:none}
.play .hud .cap{font-size:20px;min-height:0}
.play .fire{position:absolute;left:16px;right:16px;bottom:24px;max-width:420px;margin:0 auto}
.roller{position:fixed;inset:0;z-index:30;pointer-events:none;display:none}
.roller.on{display:block}
.roller i{position:absolute;top:0;bottom:0;width:120%;left:-120%}

/* ---------- END: a print proof ---------- */
.end-wrap{flex:1;display:grid;gap:16px;align-content:start}
.proof{padding:16px;position:relative;display:grid;gap:6px}
.proof .m1{left:-10px;top:-10px}.proof .m2{right:-10px;bottom:-10px}
.proof h2{margin:0;font:800 50px/.9 var(--sans);letter-spacing:-.05em}
body[data-lang=hi] .proof h2{font:800 44px/1.2 var(--deva);letter-spacing:0}
.mins{font:700 16px/1 var(--mono);text-transform:uppercase;color:var(--ink2)}
body[data-lang=hi] .mins{font:700 16px/1 var(--deva)}
.did{list-style:none;margin:4px 0 0;padding:0;display:grid}
.did li{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:10px 0;border-top:2px solid var(--ink);font-size:17px;font-weight:500}
.did svg{width:22px;height:22px;color:var(--mint)}
.secured{display:grid;grid-template-columns:1fr 128px;gap:12px;align-items:center;padding:16px;background:#fff}
.secured .lab{color:var(--mint)}
.secured h3{margin:4px 0;font:800 30px/1 var(--sans);letter-spacing:-.03em}
body[data-lang=hi] .secured h3{font:700 27px/1.3 var(--deva);letter-spacing:0}
.secured p{margin:0;font-size:15px;color:var(--ink2)}
body[data-lang=hi] .secured p{font-size:16px}
.opened{margin-top:10px;padding-top:10px;border-top:2px dashed var(--ink);display:flex;gap:8px;align-items:center;font-weight:800;flex-wrap:wrap}
.blockstamp{width:128px;height:128px;position:relative}
.blockstamp .wood{position:absolute;inset:0;animation:press 1.2s var(--e-out) both .4s}
.blockstamp .print{position:absolute;inset:0;opacity:0;animation:printed .4s ease-out both 1.15s}
@keyframes press{0%{transform:translateY(-70px) rotate(-6deg);opacity:0}45%{transform:translateY(0) rotate(0);opacity:1}60%{transform:translateY(4px) scale(.97)}100%{transform:translate(70px,-50px) rotate(14deg);opacity:0}}
@keyframes printed{from{opacity:0;transform:scale(1.1);filter:blur(3px)}to{opacity:1}}
.tmr{padding:14px 16px;display:grid;gap:4px}
.tmr .lab{color:var(--pink)}
.end-asha{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.end-asha .frame{width:72px;height:86px;box-shadow:4px 4px 0 var(--pink);view-transition-name:asha}
.end-asha .frame .tag{display:none}
.end-asha .cap{font-size:21px;min-height:0}

/* ---------- WORLD: your printed poster + the blocks ---------- */
.world-wrap{flex:1;display:grid;gap:16px;align-content:start}
.whead h2{margin:0;font:800 44px/.92 var(--sans);letter-spacing:-.05em}
body[data-lang=hi] .whead h2{font:800 40px/1.2 var(--deva);letter-spacing:0}
.seg{display:flex;border:2px solid var(--ink);height:46px}
.seg button{min-width:64px;padding:0 12px;font-weight:700;font-size:15px}
body[data-lang=hi] .seg button{font-size:16px}
.seg button+button{border-left:2px solid var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.wposter{position:relative;aspect-ratio:3/4;max-height:70vh;width:100%;border:2px solid var(--ink);box-shadow:8px 8px 0 var(--blue);background:#FBFAF6;overflow:hidden}
.wposter svg{position:absolute;inset:0;width:100%;height:100%}
.pass-new{animation:passin 1.4s var(--e-out) both .2s}
@keyframes passin{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.newtag{position:absolute;padding:6px 9px;background:var(--mint);color:#fff;border:2px solid var(--ink);font:800 15px/1 var(--sans);transform:rotate(-4deg);pointer-events:none}
body[data-lang=hi] .newtag{font:700 16px/1.1 var(--deva)}
.blocks h3{margin:0;font:800 30px/1 var(--sans);letter-spacing:-.03em}
body[data-lang=hi] .blocks h3{font:700 28px/1.3 var(--deva);letter-spacing:0}
.blocks>p{margin:6px 0 12px;font-size:15px;color:var(--ink2)}
body[data-lang=hi] .blocks>p{font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{position:relative;padding:12px;display:grid;gap:4px;text-align:left;min-height:168px;background:var(--paper);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);transition:transform .15s var(--e-out),box-shadow .15s}
.tile:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.tile svg{width:72px;height:72px}
.tile b{font-size:16px;line-height:1.2}
.tile span{font-size:14px;color:var(--ink2);line-height:1.3}
body[data-lang=hi] .tile span{font-size:16px}
.tile.dim{box-shadow:none;border-style:dashed;background:transparent}
.tile.dim svg{opacity:.3}
.tile.dim b{color:var(--ink2)}
.tile.new{box-shadow:4px 4px 0 var(--mint)}
.tile.new::after{content:attr(data-new);position:absolute;right:8px;top:8px;background:var(--mint);color:#fff;border:2px solid var(--ink);padding:3px 6px;font:800 14px/1 var(--mono);text-transform:uppercase}
body[data-lang=hi] .tile.new::after{font:700 16px/1.1 var(--deva)}
.inks{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.inks button{width:44px;height:44px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.inks button[aria-pressed=true]{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);outline:3px solid var(--ink);outline-offset:2px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:560px;margin:0 auto;padding:18px 16px 24px;background:var(--paper);border:2px solid var(--ink);box-shadow:0 -6px 0 var(--pink);transform:translateY(115%);transition:transform .45s var(--e-out)}
.sheet.on{transform:none}
.sheet h4{margin:4px 0;font:800 28px/1 var(--sans)}
body[data-lang=hi] .sheet h4{font:700 26px/1.3 var(--deva)}
.sheet p{margin:0 0 12px;color:var(--ink2)}

/* ---------- PARENT: a one-page newspaper ---------- */
.p-wrap{flex:1;display:grid;gap:14px;align-content:start;max-width:920px;width:100%;margin:0 auto}
.mast{border-top:6px solid var(--ink);border-bottom:2px solid var(--ink);padding:8px 0 10px;display:grid;gap:4px}
.mast h2{margin:0;font:800 48px/.95 var(--sans);letter-spacing:-.05em}
body[data-lang=hi] .mast h2{font:800 42px/1.2 var(--deva);letter-spacing:0}
.p-card{padding:14px;display:grid;gap:8px}
.p-card q{font:700 21px/1.3 var(--sans);letter-spacing:-.01em;quotes:"“" "”"}
body[data-lang=hi] .p-card q{font:600 20px/1.5 var(--deva)}
.ev{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 0;border-top:2px solid var(--ink)}
.st{padding:6px 8px;font:700 14px/1 var(--mono);text-transform:uppercase;border:2px solid var(--ink);white-space:nowrap}
body[data-lang=hi] .st{font:700 16px/1 var(--deva);text-transform:none}
.st.s{background:var(--mint);color:#fff}.st.l{background:var(--sun)}
.p-grid{display:grid;gap:14px}
.made{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center}
.made img{width:120px;height:90px;object-fit:cover;border:2px solid var(--ink)}
.safe{background:#fff}

::view-transition-old(root){animation:.3s ease both vo}
::view-transition-new(root){animation:.5s var(--e-out) both vn}
@keyframes vo{to{opacity:0;transform:translateX(-12px)}}
@keyframes vn{from{opacity:0;transform:translateX(16px)}}
::view-transition-group(asha){animation-duration:.6s;animation-timing-function:var(--e-out)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

@media (min-width:900px){
  section[data-screen]{padding:0 40px 30px}
  .poster{grid-template-columns:1.1fr 1fr;gap:20px 40px;align-items:center;padding-top:20px}
  .big{font-size:132px;grid-column:1/-1}
  body[data-lang=hi] .big{font-size:110px}
  .open-row{grid-template-columns:220px 1fr}.open-row .frame{width:220px;height:260px}
  .open-side{display:grid;gap:16px}
  .strip{grid-column:1/-1}
  .open-poster{display:block;position:relative;height:440px;aspect-ratio:3/4;justify-self:center;border:2px solid var(--ink);box-shadow:8px 8px 0 var(--blue);overflow:hidden;background:#FBFAF6}
  .open-poster svg{position:absolute;inset:0;width:100%;height:100%}
  .open-poster .newtag{display:none}
  .intake-grid{grid-template-columns:380px 1fr;gap:16px 32px;padding-top:10px}
  .speak{grid-row:1/8;grid-template-columns:1fr}
  .speak .frame{width:380px;height:440px;box-shadow:10px 10px 0 var(--pink)}
  .cap{font-size:32px}
  .lesson-wrap{grid-template-columns:280px 1fr;gap:16px 28px}
  .lhead{grid-row:1/4;grid-template-columns:1fr;align-items:start}
  .lhead .frame{width:280px;height:330px;box-shadow:8px 8px 0 var(--pink)}
  .lesson .cap{font-size:27px}
  .board{height:470px}
  .lesson-wrap>.lowbar{grid-column:2}
  .mission{grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}
  .gposter{grid-row:1/5;height:640px}
  .gposter h2{font-size:120px}
  .end-wrap{grid-template-columns:1fr 1fr;gap:18px 26px}
  .end-wrap .full{grid-column:1/-1}
  .world-wrap{grid-template-columns:minmax(380px,460px) 1fr;gap:20px 36px;align-items:start}
  .whead{grid-column:1/-1}
  .wposter{max-height:none;height:600px;aspect-ratio:auto}
  .tiles{grid-template-columns:repeat(3,1fr)}
  .p-grid{grid-template-columns:1fr 1fr}
}

  { id: 'kairi', n: s('Kairi', 'कैरी', 'Kairi'), by: s('Barabar bhinn', 'समतुल्य भिन्न', 'Equivalent fractions'), have: 1, today: 1 },
  { id: 'chakra', n: s('Chakra', 'चक्र', 'Wheel'), by: s('Bhinn ki tulna', 'भिन्नों की तुलना', 'Comparing fractions'), have: 0 },
  { id: 'lehar', n: s('Lehar', 'लहर', 'Wave'), by: s('Dashamlav, line par', 'दशमलव, रेखा पर', 'Decimals on a line'), have: 0 },
];
let ink = '#FF3D8B';
function strip() { const g = document.getElementById('strip'); let h = ''; for (let i = 0; i < 40; i++) { const id = ['buti', 'jaal', 'sun', 'kairi'][i % 4]; h += `<use href="#${id}" x="${i * 20 + 2}" y="4" width="16" height="28" fill="${['#FF3D8B', '#2D4BF0', '#121212', '#00A884'][i % 4]}" color="${['#FF3D8B', '#2D4BF0', '#121212', '#00A884'][i % 4]}"/>`; } g.innerHTML = h; }
function bars(el, n, quiet) { el.innerHTML = '<i></i>'.repeat(n); const b = [...el.children]; const f = (t) => { b.forEach((x, i) => (x.style.height = 5 + U.level(t / 1000 + i * 0.4) * 22 * (quiet ? 0.3 : 1) + 'px')); requestAnimationFrame(f); }; requestAnimationFrame(f); }
bars(document.getElementById('bars1'), 12); bars(document.getElementById('bars2'), 8, true);
const show = (id, on = true) => { const e = document.getElementById(id); e.classList.toggle('pending', !on); if (on) { e.classList.remove('reveal'); void e.offsetWidth; e.classList.add('reveal'); } };
U.on.init = () => { document.querySelectorAll('[data-asha]').forEach((el) => U.mountAsha(el, { view: el.dataset.asha })); strip(); };
U.on.leave = () => document.getElementById('play').classList.remove('on');
U.on.open = async () => { after = false; renderPoster(false, 'open-poster'); after = true; const b = U.$('.big'); b.classList.remove('big-reg'); void b.offsetWidth; b.classList.add('big-reg'); };

U.on.intake = async (tok, opt) => {
  ['listen', 'you', 'chips', 'map', 'agree'].forEach((i) => show(i, false)); U.$$('#plan div').forEach((d) => d.classList.remove('lit'));
  const cap = document.getElementById('cap-intake');
  if (opt.at === 'plan') { cap.textContent = T('intake.plan'); ['you', 'map', 'agree'].forEach((i) => show(i)); document.getElementById('you-text').textContent = T('child.says'); U.$$('#plan div').forEach((d) => d.classList.add('lit')); return; }
  await U.wait(500, tok); await U.say(cap, 'intake.q', tok);
  show('listen'); show('chips'); U.ashaState('listen'); await U.wait(1300, tok);
  show('you'); const yt = document.getElementById('you-text'); yt.textContent = ''; for (const ch of T('child.says')) { yt.textContent += ch; await U.wait(22, tok); }
  await U.wait(500, tok); show('listen', false); show('chips', false);
  await U.say(cap, 'intake.back', tok); show('map'); U.sfx('ok'); await U.wait(400, tok);
  await U.say(cap, 'intake.plan', tok, { after: 0 });
  for (const d of U.$$('#plan div')) { d.classList.add('lit'); U.sfx('tap'); await U.wait(280, tok); }
  show('agree'); U.ashaState('listen');
};

const svg = document.getElementById('ink'), X0 = 60, X1 = 580, Y = 170;
function mk(tag, a, p) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); (p || svg).appendChild(e); return e; }
function el(tag, a, cls) { const e = mk(tag, a); if (cls) e.setAttribute('class', cls); return e; }
function stroke(d, cls, dur = 0.9, delay = 0) { const p = el('path', { d }, 'ink ' + cls); const L = p.getTotalLength(); p.style.setProperty('--len', L); p.style.setProperty('--d', dur + 's'); p.style.animationDelay = delay + 's'; p.classList.add('draw'); return p; }
function text(x, y, t, cls, delay = 0) { const e = el('text', { x, y, 'text-anchor': 'middle' }, cls + ' pop'); e.textContent = t; e.style.animationDelay = delay + 's'; return e; }
function frac(x, y, a, b, delay = 0) { const g = el('g', {}, 'pop'); g.style.animationDelay = delay + 's'; mk('text', { x, y, 'text-anchor': 'middle', class: 'l-frac' }, g).textContent = a; mk('text', { x, y: y + 30, 'text-anchor': 'middle', class: 'l-frac' }, g).textContent = b; mk('line', { x1: x - 14, x2: x + 14, y1: y + 8, y2: y + 8, stroke: '#2D4BF0', 'stroke-width': 3 }, g); return g; }
const xs = (n) => Array.from({ length: n + 1 }, (_, i) => X0 + (X1 - X0) * i / n);
function stepUI(i) { U.$$('#steps i').forEach((e, k) => e.classList.toggle('done', k < i)); document.getElementById('stepname').textContent = `${T('step')} ${String(i).padStart(2, '0')}`; }
function halftone(x0, x1, delay) { const r = el('rect', { x: x0, y: Y - 40, width: x1 - x0, height: 34 }, 'dots pop'); r.style.animationDelay = delay + 's'; }
U.on.lesson = async (tok, opt) => {
  svg.innerHTML = ''; document.getElementById('board').classList.remove('ask'); document.getElementById('cpchip').classList.remove('on'); show('hint', false); document.getElementById('toplay').classList.remove('on');
  const cap = document.getElementById('cap-lesson'); if (opt.at === 'check' || opt.at === 'ok') return checkpoint(tok, cap, opt.at);
  stepUI(1); await U.wait(350, tok);
  const s1 = U.say(cap, 'b1', tok); stroke(`M${X0} ${Y}H${X1}`, 'l-main', 1.1, 0.3); text(X0, Y + 50, '0', 'l-num', 0.5); text(X1, Y + 50, '1', 'l-num', 1); await s1;
  stepUI(2); const s2 = U.say(cap, 'b2', tok); xs(3).forEach((x, i) => stroke(`M${x} ${Y - 16}V${Y + 16}`, 'l-tick', 0.35, 0.6 + i * 0.35)); await s2;
  stepUI(3); const s3 = U.say(cap, 'b3', tok); const [a0, a1, a2] = xs(3); halftone(a0 + 4, a1 - 4, 0.3); stroke(`M${a0} ${Y - 22}Q${(a0 + a1) / 2} ${Y - 92} ${a1} ${Y - 22}`, 'l-arc', 0.8, 0.5); frac((a0 + a1) / 2, Y - 112, '1', '3', 1); await s3;
  stepUI(4); const s4 = U.say(cap, 'b4', tok); halftone(a1 + 4, a2 - 4, 0.2); stroke(`M${a1} ${Y - 22}Q${(a1 + a2) / 2} ${Y - 92} ${a2} ${Y - 22}`, 'l-arc', 0.8, 0.4); el('rect', { x: a2 - 10, y: Y - 10, width: 20, height: 20 }, 'l-mark pop').style.animationDelay = '1.1s'; frac(a2, Y + 48, '2', '3', 1.2); await s4;
  await U.wait(700, tok); return checkpoint(tok, cap);
};
async function checkpoint(tok, cap, at) {
  svg.innerHTML = ''; stepUI(5); const board = document.getElementById('board'); document.getElementById('cpchip').classList.add('on'); U.sfx('soft');
  stroke(`M${X0} ${Y}H${X1}`, 'l-main', 0.8, 0.1); xs(4).forEach((x, i) => stroke(`M${x} ${Y - 14}V${Y + 14}`, 'l-tick', 0.3, 0.5 + i * 0.12)); text(X0, Y + 50, '0', 'l-num', 0.4); text(X1, Y + 50, '1', 'l-num', 0.4);
  const hit = el('rect', { x: X0 - 30, y: Y - 60, width: X1 - X0 + 60, height: 120 }, 'l-hit');
  if (at === 'ok') return finish(tok, cap, xs(4)[3], true);
  await U.say(cap, 'b5', tok, { after: 0 }); board.classList.add('ask'); show('hint'); U.ashaState('listen');
  const x = await new Promise((res) => hit.addEventListener('click', (e) => { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; res(pt.matrixTransform(svg.getScreenCTM().inverse()).x); }, { once: true }));
  if (!U.alive(tok)) return; const k = Math.max(0, Math.min(4, Math.round((x - X0) / ((X1 - X0) / 4)))); return finish(tok, cap, xs(4)[k], k === 3);
}
async function finish(tok, cap, x, ok) {
  document.getElementById('board').classList.remove('ask'); show('hint', false); el('rect', { x: x - 11, y: Y - 11, width: 22, height: 22 }, 'l-mark pop').style.fill = ok ? 'var(--mint)' : 'var(--look)';
  const q = xs(4);
  if (ok) { U.sfx('ok'); for (let i = 0; i < 3; i++) { halftone(q[i] + 4, q[i + 1] - 4, i * 0.25); stroke(`M${q[i]} ${Y - 22}Q${(q[i] + q[i + 1]) / 2} ${Y - 70} ${q[i + 1]} ${Y - 22}`, 'l-arc', 0.45, i * 0.3); } frac(x, Y - 104, '3', '4', 1); await U.say(cap, 'b.ok', tok); stepUI(6); await U.say(cap, 'b6', tok); document.getElementById('toplay').classList.add('on'); U.ashaState('idle'); }
  else { U.sfx('soft'); for (let i = 0; i < 4; i++) text((q[i] + q[i + 1]) / 2, Y - 34, String(i + 1), 'l-frac', i * 0.35); await U.say(cap, 'b.look', tok); return checkpoint(tok, cap); }
}

/* game: hold, then three ink rollers sweep across and the game is "printed" in */
const launch = document.getElementById('launch'), fill = document.getElementById('fill'); let hold = null;
launch.addEventListener('pointerdown', (e) => { e.preventDefault(); if (hold) return; const t0 = performance.now(); U.sfx('launch'); hold = requestAnimationFrame(function f(n) { const k = Math.min(1, (n - t0) / 650); fill.style.transform = `scaleX(${k})`; if (k >= 1) { hold = null; fill.style.transform = 'scaleX(0)'; rollIn(); } else hold = requestAnimationFrame(f); }); });
['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => launch.addEventListener(ev, () => { if (hold) { cancelAnimationFrame(hold); hold = null; fill.style.transform = 'scaleX(0)'; } }));
launch.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); rollIn(); } });
async function rollIn(skip) {
  const tok = U.tok, play = document.getElementById('play'), r = document.getElementById('roller');
  if (!skip && !U.reduced) { r.classList.add('on'); const bars = [...r.children]; bars.forEach((b, i) => b.animate([{ left: '-120%' }, { left: '0%' }, { left: '120%' }], { duration: 900, delay: i * 110, easing: 'cubic-bezier(.7,0,.3,1)', fill: 'both' }));
    await new Promise((res) => setTimeout(res, 520)); play.classList.add('on'); await new Promise((res) => setTimeout(res, 700)); r.classList.remove('on'); bars.forEach((b) => b.getAnimations().forEach((a) => a.cancel())); }
  else play.classList.add('on');
  U.sfx('ok'); try { await U.say(document.getElementById('cap-play'), 'game.line1', tok); } catch (e) { }
}
const AIM = document.getElementById('hero-img').src, HIT = '@img(assets/antariksh-hit.webp)';
document.getElementById('play-x').addEventListener('click', () => { document.getElementById('play').classList.remove('on'); U.go('end'); });
document.getElementById('fire').addEventListener('click', () => { U.sfx('ok'); const img = document.querySelector('#play img'); img.src = HIT; if (!U.reduced) document.getElementById('play').animate([{ transform: 'translate(0,0)' }, { transform: 'translate(-4px,3px)' }, { transform: 'none' }], { duration: 150 }); setTimeout(() => { img.src = AIM; U.go('end'); }, 1600); });
U.on.game = async (tok, opt) => { const logs = U.$$('#buildlog p'); logs.forEach((p) => (p.style.opacity = 0)); for (const p of logs) { await U.wait(240, tok); p.style.opacity = 1; p.animate([{ opacity: 0, transform: 'translate(-10px,0)' }, { opacity: 1, transform: 'none' }], { duration: 380, easing: 'cubic-bezier(.16,1,.3,1)' }); U.sfx('tap'); } if (opt.at === 'play') rollIn(true); };

U.on.end = async (tok) => { U.$$('.blockstamp svg').forEach((s) => { s.style.animation = 'none'; void s.getBoundingClientRect(); s.style.animation = ''; }); const m = document.getElementById('mins'); m.textContent = '0'; U.count(m, 22, 1000); await U.wait(1200, tok); U.sfx('chime'); await U.say(document.getElementById('cap-end'), 'end.asha', tok); };

/* world: the poster. Each secure idea is one printed pass of its block; today's pass rolls on. */
let after = true;
function renderPoster(animate, hostId = 'wposter') {
  const host = document.getElementById(hostId); host.innerHTML = '';
  const W = 300, H = 400; const sv = mk('svg', { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'xMidYMid slice', role: 'img', 'aria-label': T('c.postername') }, host);
  const have = BLOCKS.filter((b) => b.have && (after || !b.today));
  const col = ['#2D4BF0', '#FF3D8B', '#00A884', ink];
  have.forEach((b, layer) => {
    const g = mk('g', { 'style': 'mix-blend-mode:multiply' }, sv); if (b.today && animate) g.setAttribute('class', 'pass-new');
    const c = b.today ? ink : col[layer % 3]; const step = 46 - layer * 2, off = layer * 11;
    for (let y = -20 + off; y < H + 20; y += step) for (let x = -20 + ((y / step) % 2) * step / 2 + off; x < W + 20; x += step) mk('use', { href: '#' + b.id, x: x - 9, y: y - 11, width: 18, height: 22, fill: c, color: c, opacity: b.today ? 0.95 : 0.55 }, g);
  });
  // the child's name, big, overprinted (identity, not a score)
  const nm = mk('text', { x: 14, y: H - 26, 'font-family': 'Bric, Anek, sans-serif', 'font-weight': 800, 'font-size': U.lang === 'hi' ? 92 : 108, 'letter-spacing': U.lang === 'hi' ? 0 : -7, fill: '#121212' }, sv); nm.textContent = U.lang === 'hi' ? 'रिया' : 'RIYA';
  const nm2 = nm.cloneNode(true); nm2.setAttribute('fill', '#FF3D8B'); nm2.setAttribute('x', 18); nm2.setAttribute('y', H - 22); nm2.style.mixBlendMode = 'multiply'; sv.insertBefore(nm2, nm);
  mk('rect', { x: 8, y: 8, width: W - 16, height: H - 16, fill: 'none', stroke: '#121212', 'stroke-width': 2 }, sv);
  if (after) { const t = document.createElement('div'); t.className = 'newtag'; t.style.left = '14px'; t.style.top = '14px'; t.textContent = `${T('c.new')}: ${BLOCKS.find((b) => b.today).n[U.lang]}`; host.appendChild(t); }
  if (hostId === 'wposter') renderTiles();
}
function renderTiles() {
  document.getElementById('tiles').innerHTML = BLOCKS.map((b, i) => { const h = b.have && (after || !b.today); return `<button class="tile ${h ? '' : 'dim'} ${h && b.today ? 'new' : ''}" data-i="${i}" data-new="${T('c.new')}"><svg viewBox="-24 -24 48 48"><rect x="-22" y="-22" width="44" height="44" rx="3" fill="${h ? '#C08A58' : 'none'}" stroke="#121212" stroke-width="2"/><use href="#${b.id}" x="-17" y="-17" width="34" height="34" fill="${h ? '#5E3B1F' : '#121212'}" color="${h ? '#5E3B1F' : '#121212'}"/></svg><b>${b.n[U.lang]}</b><span>${h ? '' : T('opens.when') + ': '}${b.by[U.lang]}</span></button>`; }).join('');
  U.$$('#tiles .tile').forEach((t) => t.addEventListener('click', () => { const b = BLOCKS[+t.dataset.i]; const h = b.have && (after || !b.today); U.sfx('tap'); document.getElementById('sh-k').textContent = h ? T('opened') : T('opens.when'); document.getElementById('sh-h').textContent = b.n[U.lang]; document.getElementById('sh-p').textContent = b.by[U.lang]; document.getElementById('sheet').classList.add('on'); }));
}
document.getElementById('sh-x').onclick = () => document.getElementById('sheet').classList.remove('on');
U.$$('.inks button').forEach((b) => b.addEventListener('click', () => { ink = b.dataset.ink; U.$$('.inks button').forEach((x) => x.setAttribute('aria-pressed', x === b)); U.sfx('tap'); renderPoster(true); }));
function setAfter(v, animate) { after = v; document.getElementById('w-after').setAttribute('aria-pressed', v); document.getElementById('w-before').setAttribute('aria-pressed', !v); if (v && animate) U.sfx('chime'); renderPoster(v && animate); }
document.getElementById('w-before').onclick = () => setAfter(false); document.getElementById('w-after').onclick = () => setAfter(true, true);
U.on.world = async (tok, opt) => { document.getElementById('sheet').classList.remove('on'); U.$$('.inks button').forEach((x) => x.setAttribute('aria-pressed', x.dataset.ink === ink)); setAfter(opt.at !== 'before', true); };
U.on.lang = () => { if (U.screen === 'world') renderPoster(false); };
U.on.parent = async () => {};
})();
