<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Taxila mark: an open book seen from the front whose centre spine rises into a fountain-pen nib.
       Two colours only: nib token #24346E (tile) and paper token #F6F3EC (book and nib). No text. Tile = 88% of frame. -->
  <rect x="61" y="61" width="902" height="902" rx="206" ry="206" fill="#24346E"/>
  <g transform="translate(0 -21)">
  <g fill="#F6F3EC">
    <!-- left page: the top edge sags gently toward the spine, the bottom edge dips under it -->
    <path d="M490 676 C438 636 352 612 236 618 C226 618 220 625 220 635 L220 752 C220 762 228 769 238 768
             C344 760 428 776 490 818 Z"/>
    <!-- right page (mirror, a hair less sag so the hand shows) -->
    <path d="M534 676 C586 636 672 614 788 619 C798 619 804 626 804 636 L804 752 C804 762 796 769 786 768
             C680 761 596 777 534 818 Z"/>
    <!-- spine rising into the nib: a narrow stem that widens into the nib's shoulders and closes to a point -->
    <path d="M512 214 C530 270 580 338 604 400 C620 442 618 486 596 522 C578 552 548 576 532 604
             L527 836 C527 846 520 852 512 852 C504 852 497 846 497 836 L492 604
             C476 576 446 552 428 522 C406 486 404 442 420 400 C444 338 494 270 512 214 Z"/>
  </g>
  <g fill="#24346E">
    <!-- the nib's slit and breather hole -->
    <path d="M512 262 L519 446 L505 446 Z"/>
    <circle cx="512" cy="466" r="24"/>
  </g>
  </g>
</svg>
