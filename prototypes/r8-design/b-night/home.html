<body class="child scr-home has-tabs">
<header class="appbar">
  <span class="brand" data-i="arch">Taxila</span>
  <nav class="topnav" aria-label="Main">
    <a href="home.html" aria-current="page" data-i="home"><span data-c="nav.home"></span></a>

<main class="home">

    <h1 class="hero" data-c="home.hi"></h1>

    <a class="btn-quiet wide-only notyou" href="#" data-i="swap"><span data-c="home.notyou"></span></a>

  <section class="lesson-card" aria-labelledby="lc-t">

      <p class="eyebrow" data-c="home.eyebrow"></p>
      <h2 id="lc-t" data-c="home.title"></h2>
      <p class="lead" data-c="home.lead"></p>
      <a class="btn-primary" href="lesson-board.html" data-i="play"><span data-c="home.go"></span></a>
    </div>
  </section>
  <div class="home-foot phone-only">
    <p class="parked" data-c="home.parked"></p>
    <a class="btn-quiet" href="#" data-i="swap"><span data-c="home.notyou"></span></a>
  </div>
</main>
