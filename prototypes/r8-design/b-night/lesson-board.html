<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson · Taxila</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="../layout.css">
<link rel="stylesheet" href="skin.css">
<script src="../content.js" defer></script>
</head>
<body class="child lesson is-talking" data-motion="board">
<header class="lbar">
  <a class="btn-quiet" href="#" data-i="pause"><span data-c="lesson.pause"></span></a>
  <div class="lbar-title"><b data-c="topic"></b>
    <ol class="phases" aria-label="Lesson parts"><li data-c="lesson.phase.1"></li><li aria-current="step"><span data-c="lesson.phase.2"></span><span class="of"> · 2 of 4</span></li><li data-c="lesson.phase.3"></li><li data-c="lesson.phase.4"></li></ol>
  </div>
  <button class="btn-icon" aria-label="Captions" data-i="cc"></button>
</header>
<main class="desk">
  <section class="stage" aria-label="Board">
    <p class="stage-head sr">Board</p>
    <div class="board" data-board="halves"></div>
    <ul class="legend"><li class="lg-focus" data-c="legend.focus"></li><li class="lg-ans" data-c="legend.ans"></li><li class="lg-mix" data-c="legend.mix"></li></ul>
  </section>
  <div class="talk">
    <div class="tutor is-talking"><span class="tutor-face" aria-hidden="true">A</span><span class="tutor-meta"><b data-c="teacher.name"></b><small data-c="tutor.talking"></small></span></div>
    <p class="caption" data-c="lesson.caption"></p>
  </div>
  <section class="qbar"><p class="q" data-c="lesson.q"></p><button class="btn-icon" aria-label="Hear it again" data-i="speaker"></button></section>
  <div class="steer" aria-label="Ask Asha to">
    <button class="chip" data-c="lesson.steer.1"></button><button class="chip" data-c="lesson.steer.2"></button><button class="chip" data-c="lesson.steer.3"></button><button class="chip" data-c="lesson.steer.4"></button>
  </div>
  <div class="dock" role="status">
    <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
    <span class="state"><b data-c="lesson.talking"></b><small data-c="lesson.talking.sub"></small></span>
  </div>
</main>
</body>
</html>
