<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get started · Taxila</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="../layout.css">
<link rel="stylesheet" href="skin.css">
<script src="../content.js" defer></script>
</head>
<body class="parent onboarding">
<header class="obar">
  <div class="obar-top"><span class="brand" data-i="arch">Taxila</span><span data-c="onb.step"></span></div>
  <div class="meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
</header>
<main class="onb">
  <div class="onb-head"><h1 data-c="onb.title"></h1><p class="lead" data-c="onb.lead"></p></div>
  <fieldset>
    <legend data-c="onb.class"></legend>
    <div class="seg seg-9">
      <label class="opt num"><input type="radio" name="cls" value="1"><span class="sr">Class </span>1</label>
<label class="opt num"><input type="radio" name="cls" value="2"><span class="sr">Class </span>2</label>
<label class="opt num"><input type="radio" name="cls" value="3"><span class="sr">Class </span>3</label>
<label class="opt num"><input type="radio" name="cls" value="4"><span class="sr">Class </span>4</label>
<label class="opt num"><input type="radio" name="cls" value="5" checked><span class="sr">Class </span>5</label>
<label class="opt num"><input type="radio" name="cls" value="6"><span class="sr">Class </span>6</label>
<label class="opt num"><input type="radio" name="cls" value="7"><span class="sr">Class </span>7</label>
<label class="opt num"><input type="radio" name="cls" value="8"><span class="sr">Class </span>8</label>
<label class="opt num"><input type="radio" name="cls" value="9"><span class="sr">Class </span>9</label>
    </div>
  </fieldset>
  <fieldset>
    <legend data-c="onb.board"></legend>
    <div class="seg seg-3">
      <label class="opt"><input type="radio" name="board" checked>CBSE</label>
      <label class="opt"><input type="radio" name="board">RBSE</label>
      <label class="opt"><input type="radio" name="board"><span data-c="onb.board.other"></span></label>
    </div>
  </fieldset>
  <fieldset>
    <legend data-c="onb.lang"></legend>
    <div class="langs">
      <div class="lang"><label><input type="radio" name="lang"><span data-c="onb.lang.1"></span></label><button class="btn-icon" aria-label="Hear a sample in English" data-i="speaker"></button></div>
      <div class="lang"><label><input type="radio" name="lang"><span><span lang="hi" data-c="onb.lang.2"></span> <small data-c="onb.lang.2l"></small></span></label><button class="btn-icon" aria-label="Hear a sample in Hindi" data-i="speaker"></button></div>
      <div class="lang"><label><input type="radio" name="lang" checked><span data-c="onb.lang.3"></span></label><button class="btn-icon" aria-label="Hear a sample in Hindi and English" data-i="speaker"></button></div>
    </div>
  </fieldset>
  <div class="onb-foot">
    <a class="btn-quiet" href="#" data-c="onb.student"></a>
    <a class="btn-primary" href="#" data-c="onb.continue"></a>
  </div>
</main>
</body>
</html>
