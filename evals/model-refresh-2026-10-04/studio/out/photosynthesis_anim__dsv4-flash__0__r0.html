<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Roboto, system-ui, sans-serif; background: #e8f4f8; width: 100%; min-height: 640px; overflow-x: hidden; }
  .scene-wrap { width: 360px; margin: 0 auto; padding: 8px 4px; position: relative; }
  svg { display: block; width: 100%; height: auto; }
  .controls { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 0; justify-content: center; align-items: center; }
  .ctrl-btn { background: #4b8bb5; border: none; border-radius: 24px; padding: 8px 14px; font-size: 13px; font-weight: 600; color: #fff; cursor: pointer; transition: transform 0.15s, background 0.2s; min-width: 52px; box-shadow: 0 2px 6px rgba(0,0,0,0.12); }
  .ctrl-btn:active { transform: scale(0.92); }
  .ctrl-btn.step { background: #6aa84f; min-width: 42px; padding: 8px 6px; font-size: 13px; }
  .ctrl-btn.step.active { background: #f1c40f; color: #1e3a5f; box-shadow: 0 0 0 2px #f39c12; }
  .caption { background: #fcf8e3; border-radius: 14px; padding: 8px 12px; margin: 4px 0; font-size: 13px; font-weight: 500; color: #1e3a5f; text-align: center; border: 1px solid #f0d58a; min-height: 36px; word-break: break-word; }
  .question-box { background: #fff; border-radius: 16px; padding: 10px 8px; margin: 6px 0; border: 2px solid #9b59b6; }
  .question-box .q { font-size: 14px; font-weight: 600; color: #2c3e50; margin-bottom: 8px; text-align: center; }
  .options { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .option-btn { background: #dfe6e9; border: 2px solid #b2bec3; border-radius: 20px; padding: 8px 18px; font-size: 14px; font-weight: 600; color: #2d3436; cursor: pointer; transition: 0.15s; min-width: 60px; }
  .option-btn:active { transform: scale(0.92); }
  .option-btn.selected { background: #74b9ff; border-color: #0984e3; color: #fff; }
  .feedback { font-size: 13px; text-align: center; padding: 6px; border-radius: 12px; margin-top: 4px; min-height: 28px; font-weight: 500; }
  .feedback.correct { background: #d4edda; color: #155724; }
  .feedback.wrong { background: #f8d7da; color: #721c24; }
  button:focus-visible { outline: 3px solid #f1c40f; }
  [data-entity] { transition: filter 0.2s; }
  .particle { transition: transform 0.5s linear; }
</style>
<div class="scene-wrap" style="max-width:360px;width:100%;" id="app">
  <svg viewBox="0 0 340 260" xmlns="http://www.w3.org/2000/svg" style="background: #b3d9ff; border-radius: 20px; overflow: visible;">
    <!-- sky / sun -->
    <circle cx="280" cy="36" r="24" fill="#f9e547" opacity="0.9"/>
    <text x="280" y="40" text-anchor="middle" font-size="9" font-weight="bold" fill="#4a2c0a" data-label="sun">SUPPLANT</text>
    <line x1="256" y1="36" x2="234" y2="36" stroke="#f9e547" stroke-width="2" opacity="0.5"/>
    <line x1="304" y1="36" x2="326" y2="36" stroke="#f9e547" stroke-width="2" opacity="0.5"/>
    <line x1="280" y1="12" x2="280" y2="0" stroke="#f9e547" stroke-width="2" opacity="0.5"/>
    <line x1="280" y1="60" x2="280" y2="72" stroke="#f9e547" stroke-width="2" opacity="0.5"/>
    <line x1="262" y1="18" x2="248" y2="6" stroke="#f9e547" stroke-width="2" opacity="0.5"/>
    <line x1="298" y1="18" x2="312" y2="6" stroke="#f9e547" stroke-width="2" opacity="0.5"/>
    <!-- sun rays (to leaf) -->
    <line x1="256" y1="48" x2="196" y2="94" stroke="#f9e547" stroke-width="1.5" opacity="0.3" class="sun-ray"/>
    <line x1="304" y1="48" x2="218" y2="94" stroke="#f9e547" stroke-width="1.5" opacity="0.3" class="sun-ray"/>

    <!-- soil -->
    <rect x="30" y="210" width="280" height="50" rx="12" fill="#6d4c2a" />
    <rect x="30" y="210" width="280" height="10" rx="5" fill="#8b5e3c" />
    <!-- roots -->
    <g data-entity="roots">
      <path d="M130 200 Q120 220 110 240" stroke="#a0522d" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M140 198 Q148 225 160 240" stroke="#a0522d" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M125 202 Q110 210 90 225" stroke="#a0522d" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M145 198 Q160 210 175 220" stroke="#a0522d" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
    <!-- stem -->
    <path d="M135 200 Q138 160 140 130 Q142 100 150 78" stroke="#2e7d32" stroke-width="8" fill="none" stroke-linecap="round" />
    <!-- leaf -->
    <g data-entity="leaf">
      <ellipse cx="170" cy="72" rx="36" ry="20" fill="#43a047" transform="rotate(-10 170 72)" stroke="#2e7d32" stroke-width="1.5"/>
      <path d="M170 72 Q180 72 196 76" stroke="#2e7d32" stroke-width="1" fill="none"/>
      <text x="170" y="58" text-anchor="middle" font-size="8" fill="#fff" font-weight="bold" data-label="leaf">LEAF</text>
    </g>
    <!-- glucose dot inside leaf -->
    <circle cx="165" cy="75" r="4" fill="#f1c40f" id="glucose-dot" opacity="0.3"/>
    <text x="148" y="80" font-size="6" fill="#f39c12" font-weight="bold" data-label="glucose">GLUCOSE</text>

    <!-- labels outside: water, co2, o2 -->
    <text x="52" y="232" font-size="8" fill="#fff" font-weight="bold" data-label="water">WATER</text>
    <text x="266" y="180" font-size="8" fill="#2c3e50" font-weight="bold" data-label="co2">CO₂</text>
    <text x="14" y="120" font-size="8" fill="#2c3e50" font-weight="bold" data-label="o2">O₂</text>

    <!-- particle containers (invisible) – we will animate with JS -->
    <!-- particles placed as circles via JS, but we need initial static? we create in script -->
  </svg>
  <!-- controls -->
  <div class="controls">
    <button class="ctrl-btn" data-action="play">▶ PLAY</button>
    <button class="ctrl-btn step" data-action="step-1">1</button>
    <button class="ctrl-btn step" data-action="step-2">2</button>
    <button class="ctrl-btn step" data-action="step-3">3</button>
    <button class="ctrl-btn step" data-action="step-4">4</button>
    <button class="ctrl-btn step" data-action="step-5">5</button>
  </div>
  <div class="caption" data-caption="">🌱 Step 1: सूरज की रोशनी पत्ती तक पहुँचती है</div>
  <!-- question (always visible) -->
  <div class="question-box">
    <div class="q">❓ प्रश्न: photosynthesis के लिए पौधा क्या अंदर लेता है?</div>
    <div class="options">
      <button class="option-btn" data-option="co2">CO₂</button>
      <button class="option-btn" data-option="o2">O₂</button>
      <button class="option-btn" data-option="water">पानी</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
</div>
<script>
(function() {
  const app = document.getElementById('app');
  const svg = app.querySelector('svg');
  const ns = 'http://www.w3.org/2000/svg';
  const captions = {
    1: Studio.t('step1') || '🌱 Step 1: सूरज की रोशनी पत्ती तक पहुँचती है',
    2: Studio.t('step2') || '💧 Step 2: जड़ों से पानी पत्ती तक जाता है',
    3: Studio.t('step3') || '🌬️ Step 3: CO₂ हवा से पत्ती में प्रवेश करती है',
    4: Studio.t('step4') || '☀️ Step 4: प्रकाश संश्लेषण में ग्लूकोज़ बनता है',
    5: Studio.t('step5') || '🌿 Step 5: ऑक्सीजन पत्ती से बाहर निकलती है'
  };

  let playing = true;
  let currentStep = 1;
  let animFrame = null;
  let particleState = { water: [], co2: [], o2: [] };
  let lastTime = 0;

  // create particle groups if needed
  function ensureParticles() {
    for (let type of ['water', 'co2', 'o2']) {
      const existing = svg.querySelectorAll(`circle[data-flow="${type}"]`);
      if (existing.length >= 3) continue;
      const count = 4;
      for (let i = 0; i < count; i++) {
        const c = document.createElementNS(ns, 'circle');
        c.setAttribute('r', '3.5');
        c.setAttribute('data-flow', type);
        c.setAttribute('fill', type === 'water' ? '#2196f3' : type === 'co2' ? '#7f8c8d' : '#e74c3c');
        c.setAttribute('opacity', '0.8');
        // initial position off-screen
        c.setAttribute('cx', '-10');
        c.setAttribute('cy', '-10');
        svg.appendChild(c);
        // init state
        particleState[type].push({
          el: c,
          phase: Math.random() * Math.PI * 2,
          speed: 0.3 + Math.random() * 0.3,
          delay: Math.random() * 2
        });
      }
    }
  }
  ensureParticles();

  // step visuals: highlight
  function setStep(n) {
    currentStep = n;
    const steps = app.querySelectorAll('[data-action^="step-"]');
    steps.forEach(b => {
      b.classList.toggle('active', b.dataset.action === 'step-' + n);
    });
    const cap = app.querySelector('[data-caption]');
    cap.textContent = captions[n] || 'Step ' + n;
    // update sun ray visibility etc.
    const sunRays = svg.querySelectorAll('.sun-ray');
    sunRays.forEach(r => r.setAttribute('opacity', n >= 1 ? '0.35' : '0.1'));
    // highlight leaf etc. based on step
    const leaf = svg.querySelector('[data-entity="leaf"]');
    const roots = svg.querySelector('[data-entity="roots"]');
    leaf.style.filter = n >= 2 ? 'drop-shadow(0 0 4px #43a047)' : 'none';
    roots.style.filter = (n === 2 || n === 1) ? 'drop-shadow(0 0 3px #8b5e3c)' : 'none';
  }

  // play/pause
  function togglePlay() {
    playing = !playing;
    const btn = app.querySelector('[data-action="play"]');
    btn.textContent = playing ? '⏸ PAUSE' : '▶ PLAY';
    if (playing) {
      lastTime = performance.now();
      animateParticles(lastTime);
    } else {
      if (animFrame) cancelAnimationFrame(animFrame);
    }
  }

  // particle animation
  function animateParticles(now) {
    if (!playing) { animFrame = null; return; }
    if (!lastTime) lastTime = now;
    const dt = Math.min(now - lastTime, 40);
    lastTime = now;
    const elapsed = now / 1000;

    // for each type, update positions
    const step = currentStep;
    // water: move up from roots (x 130-145, y 210) to leaf (170,72) via stem
    if (step >= 2) {
      const particles = particleState.water;
      const baseX = 137, baseY = 205;
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const t = ((elapsed * 0.15 + p.phase + p.delay) % 4) / 4; // 0..1
        const progress = t;
        let x, y;
        if (progress < 0.5) {
          // stem up
          const p2 = progress / 0.5;
          x = baseX + (170 - baseX) * p2 * 0.4 + 3 * Math.sin(progress * 10);
          y = baseY - (baseY - 72) * p2 * 0.7;
        } else {
          // into leaf
          const p2 = (progress - 0.5) / 0.5;
          x = 170 + 10 * Math.sin(p2 * 3);
          y = 72 - 8 * p2;
          if (p2 > 0.8) { x = -10; y = -10; } // reset
        }
        if (y > -5) {
          p.el.setAttribute('cx', x);
          p.el.setAttribute('cy', y);
        } else {
          p.el.setAttribute('cx', -10);
          p.el.setAttribute('cy', -10);
        }
      }
    } else {
      particleState.water.forEach(p => { p.el.setAttribute('cx', -10); p.el.setAttribute('cy', -10); });
    }

    // co2: from air (right side, x 300, y 80-120) into leaf (170,72)
    if (step >= 3) {
      const particles = particleState.co2;
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const t = ((elapsed * 0.12 + p.phase + p.delay) % 5) / 5;
        let x, y;
        if (t < 0.7) {
          // move from right to leaf
          const p2 = t / 0.7;
          x = 300 - (300 - 170) * p2;
          y = 90 + 20 * Math.sin(p2 * 4) - 10 * p2;
        } else {
          // inside leaf (small loop)
          const p2 = (t - 0.7) / 0.3;
          x = 170 - 6 + 12 * Math.sin(p2 * 3);
          y = 72 - 4 + 8 * Math.cos(p2 * 2);
          if (p2 > 0.9) { x = -10; y = -10; }
        }
        if (y > -5) {
          p.el.setAttribute('cx', x);
          p.el.setAttribute('cy', y);
        } else {
          p.el.setAttribute('cx', -10);
          p.el.setAttribute('cy', -10);
        }
      }
    } else {
      particleState.co2.forEach(p => { p.el.setAttribute('cx', -10); p.el.setAttribute('cy', -10); });
    }

    // o2: from leaf (170,72) to air left side
    if (step >= 5) {
      const particles = particleState.o2;
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const t = ((elapsed * 0.12 + p.phase + p.delay) % 5) / 5;
        let x, y;
        if (t < 0.6) {
          // move from leaf leftwards
          const p2 = t / 0.6;
          x = 170 - (170 - 30) * p2;
          y = 72 - 10 + 20 * Math.sin(p2 * 5);
        } else {
          // disappear
          const p2 = (t - 0.6) / 0.4;
          x = 30 - 20 * p2;
          y = 90 + 30 * Math.sin(p2 * 3);
          if (p2 > 0.8) { x = -10; y = -10; }
        }
        if (y > -5) {
          p.el.setAttribute('cx', x);
          p.el.setAttribute('cy', y);
        } else {
          p.el.setAttribute('cx', -10);
          p.el.setAttribute('cy', -10);
        }
      }
    } else {
      particleState.o2.forEach(p => { p.el.setAttribute('cx', -10); p.el.setAttribute('cy', -10); });
    }

    // glucose dot glow if step 4 or 5
    const gdot = svg.querySelector('#glucose-dot');
    if (step >= 4) {
      gdot.setAttribute('opacity', 0.4 + 0.6 * Math.sin(elapsed * 3));
      gdot.setAttribute('r', 4 + 2 * Math.sin(elapsed * 2));
    } else {
      gdot.setAttribute('opacity', 0.2);
      gdot.setAttribute('r', 4);
    }

    animFrame = requestAnimationFrame(animateParticles);
  }

  // event listeners
  function init() {
    // play button
    app.querySelector('[data-action="play"]').addEventListener('click', togglePlay);
    // step buttons
    const stepBtns = app.querySelectorAll('[data-action^="step-"]');
    stepBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        const n = parseInt(this.dataset.action.split('-')[1]);
        setStep(n);
        // if not playing, start?
        if (!playing) { togglePlay(); }
      });
    });
    // set initial step 1 active
    setStep(1);

    // question options
    const options = app.querySelectorAll('.option-btn');
    let answerSelected = false;
    options.forEach(btn => {
      btn.addEventListener('click', function() {
        if (answerSelected) {
          // allow retry?
        }
        const val = this.dataset.option;
        options.forEach(b => b.classList.remove('selected'));
        this.classList.add('selected');
        Studio.answer(val);
      });
    });

    Studio.onVerdict(function(result) {
      const fb = document.getElementById('feedback');
      if (result.correct) {
        fb.textContent = '✅ सही! शाबाश!';
        fb.className = 'feedback correct';
        options.forEach(b => b.disabled = true);
        Studio.done();
      } else {
        fb.textContent = '❌ गलत, फिर से कोशिश करो';
        fb.className = 'feedback wrong';
        options.forEach(b => b.classList.remove('selected'));
      }
    });

    // start animation
    lastTime = performance.now();
    animateParticles(lastTime);

    Studio.ready();
  }

  // ensure all strings (labels) are set from Studio.t
  function applyLabels() {
    const labelMap = {
      'sun': Studio.t('sun'),
      'leaf': Studio.t('leaf'),
      'roots': Studio.t('roots'),
      'water': Studio.t('water'),
      'co2': Studio.t('co2'),
      'o2': Studio.t('o2'),
      'glucose': Studio.t('glucose')
    };
    document.querySelectorAll('[data-label]').forEach(el => {
      const key = el.dataset.label;
      if (labelMap[key]) el.textContent = labelMap[key];
    });
    // also set play/pause text
    const playBtn = app.querySelector('[data-action="play"]');
    playBtn.textContent = '⏸ ' + (Studio.t('pause') || 'PAUSE');
    // step captions already used
  }

  applyLabels();
  // reapply labels after possible string updates
  setTimeout(() => applyLabels(), 100);

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
