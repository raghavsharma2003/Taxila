<style>
  .photo-wrap{
    --sky1:#bfe9ff; --sky2:#e9f7ff;
    --sun:#ffd166; --sun2:#ffb347;
    --leaf:#4caf50; --leaf2:#2e7d32;
    --stem:#5d9640; --soil:#8d6036; --soil2:#5e3f22;
    --water:#2f9fe0; --co2:#8e7cd8; --o2:#e7f2f9;
    --ink:#20402a;
    width:360px; max-width:100%; box-sizing:border-box;
    font-family:"Trebuchet MS",Verdana,sans-serif; color:var(--ink);
    background:linear-gradient(180deg,var(--sky1),var(--sky2) 60%);
    border-radius:18px; padding:8px 8px 10px;
    display:flex; flex-direction:column; gap:6px;
    overflow:hidden;
  }
  .photo-wrap *{box-sizing:border-box;}
  .p-title{
    margin:0; text-align:center; font-size:16px; line-height:1.15;
    font-weight:700; color:#1d4f33; letter-spacing:.2px;
  }
  .stage{
    position:relative; width:100%;
    border-radius:14px; overflow:hidden;
    background:linear-gradient(180deg,#d8f0ff,#f2fbf0 55%,#f6ead8 55%,#f6ead8);
  }
  .stage svg{display:block; width:100%; height:auto;}
  .p-caption{
    min-height:38px; display:flex; align-items:center; justify-content:center;
    text-align:center; font-size:13px; line-height:1.2; font-weight:600;
    background:#ffffffcc; border:2px solid #cfe8d4; border-radius:12px;
    padding:5px 8px; color:#1d4f33;
    transition:background .25s, border-color .25s;
  }
  .p-caption.flash{background:#e6f7e9; border-color:#8fd39b;}

  .ctrl-row{display:flex; align-items:center; gap:8px;}
  .playbtn{
    flex:0 0 auto; min-width:96px; min-height:46px;
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    border:none; border-radius:14px; cursor:pointer;
    background:linear-gradient(180deg,#ffd98a,#f7b733);
    color:#4a2f00; font-size:14px; font-weight:800; letter-spacing:.3px;
    box-shadow:0 3px 0 #d99a1f, 0 4px 10px #0000001f;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .playbtn:active{transform:translateY(2px) scale(.97); box-shadow:0 1px 0 #d99a1f;}
  .playbtn .icon{font-size:15px; line-height:1;}
  .steps{display:flex; gap:6px; flex:1 1 auto; justify-content:space-between;}
  .stepbtn{
    flex:1 1 0; min-width:44px; min-height:46px;
    border:2px solid #bfe0c6; border-radius:12px; cursor:pointer;
    background:#ffffff; color:#2b6b3f; font-size:16px; font-weight:800;
    box-shadow:0 2px 0 #d5ebda;
    transition:transform .12s ease, background .2s, border-color .2s, color .2s;
  }
  .stepbtn:active{transform:scale(.94);}
  .stepbtn[aria-pressed="true"]{
    background:linear-gradient(180deg,#7bd389,#43a047);
    border-color:#2e7d32; color:#fff; box-shadow:0 2px 0 #2e7d32;
  }

  .ask-box{
    background:#ffffffd9; border:2px solid #cfe8d4; border-radius:14px;
    padding:7px 8px 9px; display:flex; flex-direction:column; gap:7px;
  }
  .ask{
    margin:0; font-size:13px; font-weight:700; text-align:center; color:#1d4f33;
    line-height:1.2;
  }
  .opts{display:flex; gap:6px;}
  .opt{
    flex:1 1 0; min-height:44px; border:2px solid #c9d9f2; border-radius:12px;
    background:#f7fbff; color:#26406b; font-size:14px; font-weight:800;
    cursor:pointer; padding:4px 2px; line-height:1.1;
    box-shadow:0 2px 0 #e0e9f7;
    transition:transform .12s ease, background .2s, border-color .2s;
  }
  .opt:active{transform:scale(.95);}
  .opt.good{background:#dff6e2; border-color:#43a047; color:#1d6b2d;}
  .opt.bad{background:#ffe6e6; border-color:#e07a7a; color:#8c2b2b;}
  .opt.shake{animation:shake .4s ease;}
  .feedback{
    min-height:17px; font-size:12.5px; font-weight:700; text-align:center;
    transition:opacity .25s;
  }
  .feedback.good{color:#1d8a3a;}
  .feedback.bad{color:#c0504d;}

  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-4px);}
    40%{transform:translateX(4px);}
    60%{transform:translateX(-3px);}
    80%{transform:translateX(3px);}
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.045);}
  }
  @keyframes glow{
    0%,100%{opacity:.55;}
    50%{opacity:1;}
  }
  @keyframes rayPulse{
    0%,100%{opacity:.35;}
    50%{opacity:.85;}
  }
  @keyframes swim{
    0%{transform:translate(0,0);}
    50%{transform:translate(-3px,-2px);}
    100%{transform:translate(0,0);}
  }

  .running .rayline{animation:rayPulse 2.4s ease-in-out infinite;}
  .running .grain circle{animation:swim 2s ease-in-out infinite;}
  .running .grain circle:nth-child(2n){animation-duration:2.6s; animation-delay:-.6s;}
  .running .grain circle:nth-child(3n){animation-duration:3.1s; animation-delay:-1.2s;}
  .running .glucose-glow{animation:glow 1.8s ease-in-out infinite;}
  .running .leaf-shape{animation:pulse 2.8s ease-in-out infinite; transform-origin:210px 300px;}
  .paused .rayline,
  .paused .grain circle,
  .paused .glucose-glow,
  .paused .leaf-shape{animation-play-state:paused;}

  .hl{opacity:.28; transition:opacity .35s;}
  .hl.on{opacity:1;}
  .dim{opacity:.35; transition:opacity .35s;}
  .dim.off{opacity:1;}
  @media (max-width:359px){
    .p-title{font-size:14px;}
    .p-caption{font-size:12px;}
    .opt{font-size:12.5px;}
    .playbtn{min-width:86px; font-size:13px;}
  }
</style>

<script>
(function(){
  var wrap   = document.getElementById('photoWrap');
  var stage  = document.getElementById('stage');
  var capEl  = document.getElementById('caption');
  var playBtn= document.getElementById('playBtn');
  var playIcon=document.getElementById('playIcon');
  var playTxt= document.getElementById('playTxt');
  var stepBtns = Array.prototype.slice.call(document.querySelectorAll('.stepbtn'));
  var optBtns  = Array.prototype.slice.call(document.querySelectorAll('.opt'));
  var fbEl     = document.getElementById('feedback');

  var P = (Studio && Studio.params) ? Studio.params : {};
  var STEP_COUNT = (typeof P.steps === 'number' && P.steps > 0) ? P.steps : 5;
  var t = function(k){ try { return Studio.t(k); } catch(e){ return k; } };

  var stepEls = document.querySelectorAll('.stepbtn');
  if (STEP_COUNT !== stepEls.length) {
    for (var i = stepEls.length - 1; i >= STEP_COUNT; i--) {
      stepEls[i].parentNode.removeChild(stepEls[i]);
    }
    stepBtns = stepBtns.slice(0, STEP_COUNT);
  }

  document.querySelector('.p-title').textContent = t('title');
  playTxt.textContent = t('pause');
  var askEl = document.getElementById('askText');
  askEl.textContent = t('ask');

  var labelMap = {
    sun:'sun', leaf:'leaf', roots:'roots', water:'water',
    co2:'co2', o2:'o2', glucose:'glucose'
  };
  Object.keys(labelMap).forEach(function(key){
    document.querySelectorAll('[data-label="'+key+'"]').forEach(function(el){
      var v = t(labelMap[key]);
      if (v && v !== key) el.textContent = v;
    });
  });
  var ttl = document.getElementById('ttl');
  if (ttl) ttl.textContent = t('title');

  document.querySelector('[data-option="co2"]').textContent  = t('co2');
  document.querySelector('[data-option="o2"]').textContent   = t('o2');
  document.querySelector('[data-option="water"]').textContent= t('water');

  var STEPS = [];
  for (var s = 1; s <= STEP_COUNT; s++) STEPS.push(t('step'+s));
  function stepText(n){
    return STEPS[n-1] !== undefined ? STEPS[n-1] : t('step'+n);
  }

  var SUN  = {x:170, y:46};
  var SOIL = 320;

  var PATHS = {
    water: [],
    co2:   [],
    o2:    []
  };

  PATHS.water = [
    {x:156,y:352},{x:170,y:330},{x:170,y:300},
    {x:170,y:270},{x:176,y:252},{x:196,y:244}
  ];
  PATHS.co2 = [
    {x:40,y:110},{x:70,y:160},{x:104,y:204},{x:150,y:232}
  ];
  PATHS.o2 = [
    {x:266,y:238},{x:290,y:206},{x:300,y:164},{x:296,y:118}
  ];

  var waterDots = [], co2Dots = [], o2Dots = [];
  (function collect(){
    stage.querySelectorAll('circle[data-flow]').forEach(function(c){
      var f = c.getAttribute('data-flow');
      var d = {el:c};
      if (f === 'water') waterDots.push(d);
      else if (f === 'co2') co2Dots.push(d);
      else if (f === 'o2') o2Dots.push(d);
    });
  })();

  var raf = null;
  var running = true;
  var t0 = 0;
  var elapsed = 0;
  var lastTs = 0;
  var scale = 1;

  function applyScale(){
    var w = stage.clientWidth || 340;
    scale = w / 340;
  }

  function lerpPath(path, u){
    if (u <= 0) return path[0];
    if (u >= 1) return path[path.length - 1];
    var segs = path.length - 1;
    var p = u * segs;
    var i = Math.floor(p);
    var f = p - i;
    var a = path[i], b = path[i + 1];
    return {x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f};
  }

  function place(dot, path, u, wob){
    var pt = lerpPath(path, u);
    dot.el.setAttribute('cx', (pt.x + wob).toFixed(2));
    dot.el.setAttribute('cy', pt.y.toFixed(2));
  }

  function tick(ts){
    if (!lastTs) lastTs = ts;
    var dt = Math.min(60, ts - lastTs);
    lastTs = ts;
    if (running) elapsed += dt;

    var e = elapsed;

    var cycle = {
      water: 6200,
      co2:   7000,
      o2:    7000
    };

    waterDots.forEach(function(dot, i){
      var u = ((e / cycle.water) + i / waterDots.length) % 1;
      place(dot, PATHS.water, u, (i - 2) * 1.5);
      dot.el.setAttribute('opacity', (0.5 + 0.5 * Math.sin(u * Math.PI)).toFixed(2));
    });
    co2Dots.forEach(function(dot, i){
      var u = ((e / cycle.co2) + i / co2Dots.length) % 1;
      place(dot, PATHS.co2, u, (i - 1.5) * 1.4);
      dot.el.setAttribute('opacity', (0.45 + 0.55 * Math.sin(u * Math.PI)).toFixed(2));
    });
    o2Dots.forEach(function(dot, i){
      var u = ((e / cycle.o2) + i / o2Dots.length) % 1;
      place(dot, PATHS.o2, u, (i - 1.5) * 1.4);
      dot.el.setAttribute('opacity', (0.45 + 0.55 * Math.sin(u * Math.PI)).toFixed(2));
    });

    raf = requestAnimationFrame(tick);
  }

  function startLoop(){
    if (raf) return;
    lastTs = 0;
    raf = requestAnimationFrame(tick);
  }
  function stopLoop(){
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    lastTs = 0;
  }

  var FORCE = {
    '1': { glow: ['water'], dimOther: ['co2','o2'] },
    '2': { glow: ['co2'],   dimOther: ['water','o2'] },
    '3': { glow: ['o2'],    dimOther: ['water','co2'] },
    '4': { glow: ['glucose'], dimOther: [] },
    '5': { glow: ['water','co2','o2','glucose'], dimOther: [] }
  };

  function setEmphasis(step){
    var gset = (FORCE[String(step)] || FORCE['1']);

    stage.querySelectorAll('circle[data-flow]').forEach(function(c){
      var f = c.getAttribute('data-flow');
      var gp = c.parentNode;
      var emph = gset.glow.indexOf(f) !== -1;
      var faded = gset.dimOther.indexOf(f) !== -1;
      gp.classList.toggle('on', emph);
      gp.classList.toggle('off', !faded);
      gp.style.opacity = emph ? '1' : (faded ? '0.16' : '0.45');
    });

    stage.querySelectorAll('.glucose-glow').forEach(function(g){
      g.style.opacity = gset.glow.indexOf('glucose') !== -1 ? '1' : '0.25';
    });

    var leafy = stage.querySelectorAll('.leaf-shape');
    leafy.forEach(function(l){
      l.style.filter = (step === 4 || step === 5 || step === 3 || step === 2) ? 'brightness(1.08)' : 'none';
    });
  }

  function setStep(n, fromUser){
    n = Math.max(1, Math.min(STEP_COUNT, n));
    currentStep = n;
    capEl.textContent = stepText(n);
    capEl.classList.add('flash');
    setTimeout(function(){ capEl.classList.remove('flash'); }, 420);

    stepBtns.forEach(function(b){
      var on = b.getAttribute('data-action') === 'step-' + n;
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });

    setEmphasis(n);

    if (running) {
      elapsed = 0;
    }

    if (fromUser && Studio.event) {
      Studio.event('step', {step: n});
    }
  }

  var currentStep = 1;

  function setPlaying(v){
    running = v;
    wrap.classList.toggle('running', v);
    wrap.classList.toggle('paused', !v);
    playBtn.setAttribute('aria-pressed', v ? 'false' : 'true');
    var lbl = v ? t('pause') : t('play');
    playTxt.textContent = lbl;
    playIcon.textContent = v ? '\u275A\u275A' : '\u25B6';
    playBtn.setAttribute('aria-label', lbl);
    if (v) { lastTs = 0; startLoop(); } else { stopLoop(); }
  }

  playBtn.addEventListener('click', function(){
    setPlaying(!running);
    if (Studio.event) Studio.event('toggle', {playing: running, step: currentStep});
  });

  stepBtns.forEach(function(b){
    b.addEventListener('click', function(){
      var m = /^step-(\d+)$/.exec(b.getAttribute('data-action'));
      var n = m ? parseInt(m[1], 10) : 1;
      if (!running) setPlaying(true);
      setStep(n, true);
    });
  });

  var verdictBound = false;
  optBtns.forEach(function(b){
    b.addEventListener('click', function(){
      if (b.dataset.locked === '1') return;
      var key = b.getAttribute('data-option');
      b.style.transform = 'scale(.95)';
      setTimeout(function(){ b.style.transform = ''; }, 140);
      if (Studio.event) Studio.event('answer', {option: key});
      try { Studio.answer(key); } catch(e){}
    });
  });

  function bindVerdict(){
    if (verdictBound) return;
    verdictBound = true;
    try {
      Studio.onVerdict(function(res){
        var ok = res && res.correct;
        optBtns.forEach(function(b){ b.disabled = false; });
        if (ok) {
          optBtns.forEach(function(b){
            b.classList.remove('bad','good');
            b.classList.add('good');
          });
          fbEl.textContent = t('step5');
          fbEl.className = 'feedback good';
          try { Studio.done(); } catch(e){}
        } else {
          optBtns.forEach(function(b){ b.classList.remove('good'); });
          var target = document.querySelector('.opt.bad') || optBtns[0];
          optBtns.forEach(function(b){ b.classList.remove('shake','bad'); });
          void target.offsetWidth;
          optBtns.forEach(function(b){ b.classList.add('shake'); });
          setTimeout(function(){ optBtns.forEach(function(b){ b.classList.remove('shake'); }); }, 450);
          fbEl.textContent = t('play');
          fbEl.className = 'feedback bad';
        }
      });
    } catch(e){}
  }

  applyScale();
  window.addEventListener('resize', applyScale);

  setPlaying(true);
  setStep(1, false);
  bindVerdict();
  startLoop();

  try { Studio.ready(); } catch(e){}
})();
</script>
