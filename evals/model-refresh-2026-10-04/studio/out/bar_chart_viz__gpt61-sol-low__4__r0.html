<style>
*{box-sizing:border-box}
:root{font-family:system-ui,sans-serif;color:#243c49;background:#f4f7ef}
main{width:min(100%,460px);margin:auto;padding:20px 14px}
h1{font-size:23px;line-height:1.25;margin:0 0 16px;font-weight:800}
.card{background:#fff;border:1px solid #e1e9de;border-radius:24px;padding:16px 10px;box-shadow:0 8px 24px #294d3910}
.axis-title{font-size:13px;font-weight:650;color:#536a73;margin:0 0 12px 30px}
.chart{position:relative;height:276px;margin-right:2px}
.plot{position:absolute;left:30px;right:0;top:8px;bottom:44px;display:grid;gap:0}
.grid{position:absolute;left:30px;right:0;top:8px;bottom:44px;pointer-events:none}
.gridline{position:absolute;left:0;right:0;border-top:1px solid #e1e9e8}
.gridline.zero{border-color:#78918f;border-top-width:2px}
.tick{position:absolute;right:calc(100% + 7px);top:0;transform:translateY(-50%);font-size:12px;color:#5d7078;font-variant-numeric:tabular-nums}
.column{position:relative;display:flex;align-items:flex-end;justify-content:center;min-width:0}
.bar{position:relative;width:calc(100% - 7px);min-width:44px;padding:0;border:0;border-radius:10px 10px 0 0;background:#4b9e97;cursor:pointer;transform-origin:center bottom;animation:grow .85s cubic-bezier(.2,.7,.2,1) both;transition:filter .18s,box-shadow .18s}
.bar:hover{filter:brightness(1.06)}
.bar:active{filter:brightness(.9)}
.bar:focus-visible{outline:3px solid #d08038;outline-offset:3px}
.bar.selected{box-shadow:inset 0 0 0 3px #245e59}
.bar[aria-disabled=true]{cursor:default}
.fruit{position:absolute;top:calc(100% + 11px);left:0;right:0;text-align:center;font-size:11px;font-weight:700;overflow-wrap:anywhere;color:#405d64}
.value{position:absolute;left:50%;top:10px;transform:translateX(-50%);color:white;font-size:17px;font-weight:800;pointer-events:none}
.question{margin:18px 4px 0;font-size:18px;line-height:1.4;font-weight:700}
.feedback{min-height:48px;margin:12px 4px 0;padding:10px 12px;border-radius:14px;font-size:16px;line-height:1.4}
.feedback:empty{padding:0}
.feedback.retry{background:#fff0df;color:#805229}
.feedback.success{background:#e4f3e9;color:#286343}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{50%{transform:scale(1.025)}}
.feedback:not(:empty){animation:pop .3s ease}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<main>
<h1 id="title"></h1>
<section class="card" aria-labelledby="title">
<div class="axis-title" id="axis-title"></div>
<div class="chart" id="chart">
<div class="grid" id="grid" aria-hidden="true"></div>
<div class="plot" id="plot"></div>
</div>
</section>
<p class="question" id="ask"></p>
<div class="feedback" id="feedback" role="status" aria-live="polite"></div>
</main>
<script>
(function(){
const data=Studio.params.data;
const title=document.getElementById('title');
const axis=document.getElementById('axis-title');
const ask=document.getElementById('ask');
const feedback=document.getElementById('feedback');
const grid=document.getElementById('grid');
const plot=document.getElementById('plot');
title.textContent=Studio.t('title');
axis.textContent=Studio.t('yaxis');
ask.textContent=Studio.t('ask');
const maximum=Math.max(...data.map(d=>d.value));
const zero=maximum-maximum;
const raw=maximum/4;
const power=Math.pow(10,Math.floor(Math.log10(raw||1)));
const fraction=raw/power;
const step=(fraction<=1?1:fraction<=2?2:fraction<=5?5:10)*power;
const ceiling=Math.ceil(maximum/step)*step||step;
for(let value=zero;value<=ceiling;value+=step){
const line=document.createElement('div');
line.className='gridline'+(value===zero?' zero':'');
line.style.bottom=(value/ceiling*100)+'%';
const tick=document.createElement('span');
tick.className='tick';
tick.dataset.tick=String(value);
tick.textContent=String(value);
line.appendChild(tick);
grid.appendChild(line);
}
plot.style.gridTemplateColumns='repeat('+data.length+',minmax(0,1fr))';
let pending=false;
let complete=false;
const bars=[];
data.forEach(d=>{
const column=document.createElement('div');
column.className='column';
const bar=document.createElement('div');
bar.className='bar';
bar.dataset.bar=d.key;
bar.dataset.value=String(d.value);
bar.style.height=(d.value/ceiling*100)+'%';
bar.setAttribute('role','button');
bar.setAttribute('aria-label',Studio.t(d.key));
bar.setAttribute('aria-describedby','ask');
bar.tabIndex=0;
const label=document.createElement('div');
label.className='fruit';
label.textContent=Studio.t(d.key);
const value=document.createElement('span');
value.className='value';
value.hidden=true;
bar.appendChild(value);
function choose(){
if(pending||complete)return;
pending=true;
bars.forEach(b=>{
b.classList.remove('selected');
b.querySelector('.value').hidden=true;
b.setAttribute('aria-disabled','true');
});
bar.classList.add('selected');
value.textContent=String(d.value);
value.hidden=false;
feedback.textContent='';
feedback.className='feedback';
Studio.event('bar_tap',{key:d.key,value:d.value});
Studio.answer(d.key);
}
bar.addEventListener('click',choose);
bar.addEventListener('keydown',e=>{
if(e.key==='Enter'||e.key===' '){e.preventDefault();choose();}
});
column.append(bar,label);
plot.appendChild(column);
bars.push(bar);
});
Studio.onVerdict(function(verdict){
if(!pending||complete)return;
pending=false;
if(verdict.correct){
complete=true;
feedback.className='feedback success';
feedback.textContent=Studio.t('right')+' '+Studio.t('done');
bars.forEach(b=>{b.tabIndex=-1;b.setAttribute('aria-disabled','true');});
Studio.done();
}else{
feedback.className='feedback retry';
feedback.textContent=Studio.t('wrong');
bars.forEach(b=>b.setAttribute('aria-disabled','false'));
}
});
Studio.ready();
})();
</script>
