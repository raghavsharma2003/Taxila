<style>
  *{box-sizing:border-box}
  :root{color-scheme:light}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff8ed;color:#25354a}
  .stage{width:min(100%,440px);min-height:100vh;margin:auto;padding:18px 16px 22px;display:flex;flex-direction:column;gap:14px}
  .top{display:flex;align-items:center;justify-content:center;min-height:48px}
  h1{margin:0;text-align:center;font-size:clamp(22px,6vw,28px);line-height:1.15;color:#293c58}
  .card{background:#fff;border:2px solid #f0e5d6;border-radius:24px;padding:18px 16px;box-shadow:0 7px 0 #eadbc9}
  .instruction{margin:0;text-align:center;font-size:17px;line-height:1.4;color:#53647a}
  .fraction{display:flex;align-items:center;justify-content:center;gap:13px;margin:2px auto 14px;color:#293c58;font-size:34px;font-weight:800}
  .fraction span{min-width:44px;text-align:center}
  .fraction .bar{height:3px;min-width:42px;background:#f29a59;border-radius:3px}
  .hint{margin:0 0 12px;text-align:center;font-size:15px;color:#778397}
  .parts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px;border-radius:20px;background:#f8ead8}
  .part{height:64px;min-width:44px;border:2px solid #e8c9a4;border-radius:14px;background:#fffaf2;cursor:pointer;transition:transform .16s,background .2s,border-color .2s,box-shadow .2s}
  .part:active{transform:scale(.92)}
  .part[data-shaded="true"]{background:#ffb45c;border-color:#e88a38;box-shadow:inset 0 -4px 0 #e99543}
  .part:focus-visible,.check:focus-visible{outline:3px solid #528fd3;outline-offset:2px}
  .feedback{min-height:26px;margin:0;text-align:center;font-size:17px;font-weight:700;color:#607287}
  .feedback.good{color:#368466}
  .feedback.bad{color:#bd6b61}
  .check{display:block;width:100%;min-height:54px;border:0;border-radius:17px;background:#547fb1;color:white;font:700 19px system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer;box-shadow:0 5px 0 #3d638f;transition:transform .15s,background .2s}
  .check:active{transform:translateY(3px) scale(.985);box-shadow:0 2px 0 #3d638f}
  .done-mark{display:grid;place-items:center;width:76px;height:76px;margin:6px auto 14px;border-radius:50%;background:#dcf1e5;color:#368466;font-size:42px}
  .celebrate{animation:bloom .5s ease}
  @keyframes bloom{50%{transform:scale(1.035)}}
  @media(max-height:620px){.stage{gap:10px;padding-top:12px}.card{padding:14px}.part{height:54px}}
</style>
<main class="stage">
  <header class="top"><h1 id="title"></h1></header>
  <section class="card" id="itemBox" data-item="">
    <p class="instruction" id="instruction"></p>
    <div id="question">
      <div class="fraction" aria-live="polite"><span id="numerator"></span><span class="bar"></span><span id="denominator"></span></div>
      <p class="hint" id="hint"></p>
      <div class="parts" id="parts"></div>
      <p class="feedback" id="feedback" aria-live="polite"></p>
      <button class="check" id="check" data-action="check" type="button"></button>
    </div>
    <div id="complete" hidden>
      <div class="done-mark" aria-hidden="true">✓</div>
      <p class="instruction" id="doneText"></p>
    </div>
  </section>
</main>
<script>
(()=>{
  const items=Studio.params.items;
  const t=key=>Studio.t(key);
  const title=document.getElementById("title");
  const instruction=document.getElementById("instruction");
  const hint=document.getElementById("hint");
  const check=document.getElementById("check");
  const box=document.getElementById("itemBox");
  const partsBox=document.getElementById("parts");
  const feedback=document.getElementById("feedback");
  let current=0,locked=false,finished=false;

  title.textContent=t("title");
  instruction.textContent=t("instr");
  hint.textContent=t("hint");
  check.textContent=t("check");

  function render(){
    const item=items[current];
    locked=false;
    box.dataset.item=item.id;
    document.getElementById("numerator").textContent=item.n;
    document.getElementById("denominator").textContent=item.d;
    feedback.textContent="";
    feedback.className="feedback";
    partsBox.replaceChildren();
    partsBox.style.gridTemplateColumns=`repeat(${Math.min(4,item.d)},minmax(0,1fr))`;
    for(let i=0;i<item.d;i++){
      const part=document.createElement("button");
      part.type="button";
      part.className="part";
      part.dataset.part=String(i);
      part.dataset.shaded="false";
      part.addEventListener("click",()=>{
        if(locked||finished)return;
        part.dataset.shaded=part.dataset.shaded==="true"?"false":"true";
        Studio.event("part_toggle",{item:item.id,part:i,shaded:part.dataset.shaded==="true"});
      });
      partsBox.appendChild(part);
    }
    Studio.event("item_shown",{item:item.id});
  }

  check.addEventListener("click",()=>{
    if(locked||finished)return;
    const item=items[current];
    const n=partsBox.querySelectorAll('[data-shaded="true"]').length;
    locked=true;
    Studio.event("check",{item:item.id,n:n,d:item.d});
    Studio.answer({n:n,d:item.d});
  });

  Studio.onVerdict(({correct})=>{
    if(finished)return;
    feedback.textContent=t(correct?"right":"wrong");
    feedback.className=`feedback ${correct?"good":"bad"}`;
    if(!correct){locked=false;return}
    box.classList.remove("celebrate");
    void box.offsetWidth;
    box.classList.add("celebrate");
    window.setTimeout(()=>{
      if(current<items.length-1){current++;render()}
      else{
        finished=true;
        box.removeAttribute("data-item");
        document.getElementById("question").hidden=true;
        document.getElementById("complete").hidden=false;
        document.getElementById("doneText").textContent=t("done");
        Studio.done();
      }
    },650);
  });

  render();
  Studio.ready();
})();
</script>
