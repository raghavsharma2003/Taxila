<style>
*{box-sizing:border-box} :root{font-family:system-ui,sans-serif;color:#24473e;background:#f3f7ee} #activity{width:100%;max-width:460px;margin:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px} h1{font-size:20px;line-height:1.2;margin:0;color:#244d3e} .scene{width:100%;height:278px;background:linear-gradient(#e8f6fb,#f8fbea);border-radius:24px;border:1px solid #d8e7db;overflow:hidden} svg{width:100%;height:100%;display:block} svg text{font-size:12px;font-weight:650;fill:#294f47;paint-order:stroke;stroke:#f5fbf4;stroke-width:3px;stroke-linejoin:round} .controls{display:flex;gap:6px;align-items:center} button{border:0;font:inherit;min-width:44px;min-height:44px;border-radius:14px;cursor:pointer;background:#e2eee3;color:#244d3e;transition:transform .15s,background .25s,box-shadow .25s;touch-action:manipulation} button:active{transform:scale(.93)} button:focus-visible{outline:3px solid #e9aa35;outline-offset:2px} #play{flex:1;padding:0 8px;font-size:14px;background:#285d4b;color:white} .steps{display:flex;gap:4px} .steps button{min-width:44px;padding:0;font-weight:750} .steps button.selected{background:#f9d980;box-shadow:inset 0 -3px #eac264} [data-caption]{margin:0;min-height:50px;font-size:14px;line-height:1.4;background:#fffdf3;padding:10px 12px;border-radius:14px;border-left:4px solid #edc565} .question{background:white;border-radius:18px;padding:10px 12px;box-shadow:0 3px 12px #224e3910} #ask{margin:0 0 8px;font-size:14px;line-height:1.35} .options{display:flex;gap:7px} .options button{flex:1;padding:5px;font-size:13px;overflow-wrap:anywhere;border:1px solid #d7e7dc} #feedback{display:none;width:44px;min-height:44px;align-items:center;justify-content:center;font-size:25px;border-radius:12px;background:#fff0cf} #feedback.visible{display:flex} .process{opacity:.52;transition:opacity .45s} .process.emphasis{opacity:1} .glow{animation:glow 2s ease-in-out infinite;transform-origin:220px 156px} .paused .glow{animation-play-state:paused} @keyframes glow{50%{opacity:.6;filter:drop-shadow(0 0 6px #ffd15c)}} .chosen{box-shadow:0 0 0 2px #e6b951 inset} @media(max-width:370px){#activity{padding:10px;gap:7px}.controls{gap:4px}.steps{gap:3px}.scene{height:268px}h1{font-size:18px}}
</style>

<p data-caption aria-live="polite"></p>
<section class="question">
<p id="ask"></p>

<button data-option="co2"></button>
<button data-option="o2"></button>
<button data-option="water"></button>
<span id="feedback" role="status" aria-live="polite"></span>
</div>
</section>
</main>
<script>
(function(){
const p=Studio.params;
const root=document.getElementById('activity');
document.getElementById('title').textContent=Studio.t('title');
document.getElementById('ask').textContent=Studio.t('ask');
document.querySelectorAll('[data-label]').forEach(el=>el.textContent=Studio.t(el.dataset.label));
const play=document.getElementById('play');
let playing=true,completed=false,time=0,last=null;
const steps=Array.from(document.querySelectorAll('.steps button'));
const groups=['light','waterFlow','co2Flow','sugar','o2Flow'];
function selectStep(n){
document.querySelector('[data-caption]').textContent=Studio.t('step'+n);
steps.forEach((b,i)=>{b.classList.toggle('selected',i+1===n);b.setAttribute('aria-pressed',String(i+1===n));});
groups.forEach((id,i)=>document.getElementById(id).classList.toggle('emphasis',i+1===n));
}
steps.forEach((b,i)=>{
const n=i+1;
if(n>p.steps){b.hidden=true;return;}
b.textContent=String(n);
b.onclick=()=>{selectStep(n);Studio.event('step',{step:n});};
});
function setPlay(){
play.textContent=Studio.t(playing?'pause':'play');
play.setAttribute('aria-pressed',String(playing));
root.classList.toggle('paused',!playing);
}
play.onclick=()=>{playing=!playing;setPlay();Studio.event('play',{playing});};
const feedback=document.getElementById('feedback');
document.querySelectorAll('[data-option]').forEach(b=>{
b.textContent=Studio.t(b.dataset.option);
b.onclick=()=>{
if(completed)return;
feedback.classList.remove('visible');
document.querySelectorAll('[data-option]').forEach(o=>o.classList.toggle('chosen',o===b));
Studio.answer(b.dataset.option);
};
});
Studio.onVerdict(v=>{
if(completed)return;
feedback.textContent=v.correct?'✓':'↻';
feedback.classList.add('visible');
feedback.style.background=v.correct?'#dbefdc':'#fff0cf';
if(v.correct){completed=true;Studio.done();}
});
const particles={};
Object.keys(p.flows).forEach(key=>{
const nodes=Array.from(document.querySelectorAll('[data-flow="'+key+'"]'));
if(nodes.length)particles[key]=nodes;
});
function frame(now){
if(last!==null&&playing)time+=Math.min(now-last,80);
last=now;
Object.entries(particles).forEach(([key,nodes])=>{
nodes.forEach((node,i)=>{
const t=(time/3400+i/nodes.length)%1;
let x,y;
if(key==='water'){x=164+37*t*t*t;y=249-100*t;}
else if(key==='co2'){x=319-94*t;y=132+15*t+4*Math.sin(t*Math.PI);}
else if(key==='o2'){x=232+88*t;y=157+21*t-4*Math.sin(t*Math.PI);}
node.setAttribute('cx',x);
node.setAttribute('cy',y);
node.style.opacity=String(.25+.75*Math.sin(Math.PI*t));
});
});
requestAnimationFrame(frame);
}
selectStep(1);setPlay();requestAnimationFrame(frame);Studio.ready();
})();
</script>
