<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #e8f4f8; width: 100%; min-height: 640px; overflow-x: hidden; }
  .scene-wrap { width: 360px; margin: 0 auto; padding: 6px 3px; position: relative; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .controls { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 0; justify-content: center; align-items: center; }
  .ctrl-btn { background: #4b8bb5; border: none; border-radius: 24px; padding: 8px 14px; font-size: 13px; font-weight: 600; color: #fff; cursor: pointer; transition: transform 0.15s, background 0.2s; min-width: 52px; box-shadow: 0 2px 6px rgba(0,0,0,0.12); }
  .ctrl-btn:active { transform: scale(0.92); }
  .ctrl-btn.step { background: #6aa84f; min-width: 44px; padding: 8px 6px; font-size: 13px; }
  .ctrl-btn.step.active { background: #f1c40f; color: #1e3a5f; box-shadow: 0 0 0 2px #f39c12; }
  .caption { background: #fcf8e3; border-radius: 14px; padding: 6px 10px; margin: 4px 0; font-size: 12px; font-weight: 500; color: #1e3a5f; text-align: center; border: 1px solid #f0d58a; min-height: 32px; word-break: break-word; }
  .question-box { background: #fff; border-radius: 16px; padding: 8px 6px; margin: 4px 0; border: 2px solid #9b59b6; }
  .question-box .q { font-size: 13px; font-weight: 600; color: #2c3e50; margin-bottom: 6px; text-align: center; }
  .options { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .option-btn { background: #dfe6e9; border: 2px solid #b2bec3; border-radius: 20px; padding: 8px 16px; font-size: 13px; font-weight: 600; color: #2d3436; cursor: pointer; transition: 0.15s; min-width: 60px; }
  .option-btn:active { transform: scale(0.92); }
  .option-btn.selected { background: #74b9ff; border-color: #0984e3; color: #fff; }
  .feedback { font-size: 13px; text-align: center; padding: 6px; border-radius: 12px; margin-top: 4px; min-height: 28px; font-weight: 500; }
  .feedback.correct { background: #d4edda; color: #155724; }
  .feedback.wrong { background: #f8d7da; color: #721c24; }
  button:focus-visible { outline: 3px solid #f1c40f; }
  [data-entity] { transition: filter 0.2s; }
</style>
<div class="scene-wrap" id="app">
  <svg viewBox="0 0 340 260" xmlns="http://www.w3.org/2000/svg" style="background: #b3d9ff; border-radius: 20px;">
    <!-- sun -->
    <circle cx="280" cy="36" r="24" fill="#f9e547" opacity="0.9"/>
    <text x="280" y="40" text-anchor="middle" font-size="9" font-weight="bold" fill="#4a2c0a" data-label="sun">SUPPLANT</text>
    <line x1="256" y1="36" x2="234" y2="36" stroke="#f9e547" stroke-width="2" opacity="0.5"/>
    <line x1="304" y1="36" x2="326" y2="36" stroke="#f9e547" stroke-width="2" opacity="0.5"/>
    <line x1="280" y1="12" x2="280" y2="0" stroke="#f9e547" stroke-width="2" opacity="0.5"/>
    <line x1="280" y1="60" x2="280" y2="72" stroke="#f9e547" stroke-width="2" opacity="0.5"/>
    <line x1="262" y1="18" x2="248" y2="6" stroke="#f9e547" stroke-width="2" opacity="0.5"/>
    <line x1="298" y1="18" x2="312" y2="6" stroke="#f9e547" stroke-width="2" opacity="0.5"/>
    <line x1="256" y1="48" x2="196" y2="94" stroke="#f9e547" stroke-width="1.5" opacity="0.3" class="sun-ray"/>
    <line x1="304" y1="48" x2="218" y2="94" stroke="#f9e547" stroke-width="1.5" opacity="0.3" class="sun-ray"/>

    <!-- soil -->
    <rect x="30" y="210" width="280" height="50" rx="12" fill="#6d4c2a" />
    <rect x="30" y="210" width="280" height="10" rx="5" fill="#8b5e3c" />
    
    <!-- roots -->
    <g data-entity="roots">
      <path d="M130 200 Q120 220 110 240" stroke="#a0522d" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M140 198 Q148 225 160 240" stroke="#a0522d" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M125 202 Q110 210 90 225" stroke="#a0522d" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M145 198 Q160 210 175 220" stroke="#a0522d" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
    
    <!-- stem -->
    <path d="M135 200 Q138 160 140 130 Q142 100 150 78" stroke="#2e7d32" stroke-width="8" fill="none" stroke-linecap="round" />
    
    <!-- leaf -->
    <g data-entity="leaf">
      <ellipse cx="170" cy="72" rx="36" ry="20" fill="#43a047" transform="rotate(-10 170 72)" stroke="#2e7d32" stroke-width="1.5"/>
      <path d="M170 72 Q180 72 196 76" stroke="#2e7d32" stroke-width="1" fill="none"/>
      <text x="170" y="58" text-anchor="middle" font-size="8" fill="#fff" font-weight="bold" data-label="leaf">LEAF</text>
    </g>
    
    <!-- glucose dot inside leaf -->
    <circle cx="165" cy="75" r="4" fill="#f1c40f" id="glucose-dot" opacity="0.3"/>
    <text x="148" y="80" font-size="6" fill="#f39c12" font-weight="bold" data-label="glucose">GLUCOSE</text>

    <!-- labels inside view (near referents) -->
    <text x="280" y="50" font-size="7" fill="#4a2c0a" text-anchor="middle" data-label="sun">SUPPLANT</text>
    <text x="130" y="248" font-size="7" fill="#fff" text-anchor="middle" data-label="roots">ROOTS</text>
    <text x="170" y="94" font-size="7" fill="#fff" text-anchor="middle" data-label="leaf">LEAF</text>
    <text x="58" y="248" font-size="7" fill="#fff" text-anchor="middle" data-label="water">WATER</text>
    <text x="250" y="100" font-size="7" fill="#2c3e50" text-anchor="middle" data-label="co2">CO₂</text>
    <text x="35" y="100" font-size="7" fill="#2c3e50" text-anchor="middle" data-label="o2">O₂</text>
  </svg>

  <!-- controls -->
  <div class="controls">
    <button class="ctrl-btn" data-action="play" style="font-size:12px;padding:8px 10px;min-width:60px;">⏸ PAUSE</button>
    <button class="ctrl-btn step" data-action="step-1">1</button>
    <button class="ctrl-btn step" data-action="step-2">2</button>
    <button class="ctrl-btn step" data-action="step-3">3</button>
    <button class="ctrl-btn step" data-action="step-4">4</button>
    <button class="ctrl-btn step" data-action="step-5">5</button>
  </div>
  <div class="caption" data-caption="">Step 1</div>

  <!-- question (always visible) -->
  <div class="question-box">
    <div class="q"><span id="q-text"></span></div>
    <div class="options">
      <button class="option-btn" data-option="co2">CO₂</button>
      <button class="option-btn" data-option="o2">O₂</button>
      <button class="option-btn" data-option="water">WATER</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
</div>

<script>
(function() {
  const app = document.getElementById('app');
  const svg = app.querySelector('svg');
  const ns = 'http://www.w3.org/2000/svg';
  const captions = {
    1: '',
    2: '',
    3: '',
    4: '',
    5: ''
  };

  let playing = true;
  let currentStep = 1;
  let animFrame = null;
  let lastTime = 0;

  // particle data store
  let waterParticles = [];
  let co2Particles = [];
  let o2Particles = [];

  function makeParticles(count, type, color) {
    const arr = [];
    for (let i = 0; i < count; i++) {
      const c = document.createElementNS(ns, 'circle');
      c.setAttribute('r', '3.5');
      c.setAttribute('data-flow', type);
      c.setAttribute('fill', color);
      c.setAttribute('opacity', '0.8');
      c.setAttribute('cx', '-10');
      c.setAttribute('cy', '-10');
      svg.appendChild(c);
      arr.push({
        el: c,
        phase: Math.random() * Math.PI * 2,
        speed: 0.3 + Math.random() * 0.3,
        delay: Math.random() * 2
      });
    }
    return arr;
  }

  waterParticles = makeParticles(4, 'water', '#2196f3');
  co2Particles = makeParticles(4, 'co2', '#7f8c8d');
  o2Particles = makeParticles(4, 'o2', '#e74c3c');

  function setStep(n) {
    currentStep = n;
    const steps = app.querySelectorAll('[data-action^="step-"]');
    steps.forEach(b => b.classList.toggle('active', b.dataset.action === 'step-' + n));
    
    const cap = app.querySelector('[data-caption]');
    cap.textContent = Studio.t('step' + n) || 'Step ' + n;
    
    const sunRays = svg.querySelectorAll('.sun-ray');
    sunRays.forEach(r => r.setAttribute('opacity', n === 1 || n === 4 ? '0.35' : '0.1'));
    
    const leaf = svg.querySelector('[data-entity="leaf"]');
    const roots = svg.querySelector('[data-entity="roots"]');
    leaf.style.filter = n >= 2 ? 'drop-shadow(0 0 4px #43a047)' : 'none';
    roots.style.filter = n === 2 ? 'drop-shadow(0 0 3px #8b5e3c)' : 'none';
  }

  function togglePlay() {
    playing = !playing;
    const btn = app.querySelector('[data-action="play"]');
    btn.textContent = playing ? '⏸ ' + (Studio.t('pause') || 'PAUSE') : '▶ ' + (Studio.t('play') || 'PLAY');
    if (playing) {
      lastTime = performance.now();
      animateParticles(lastTime);
    } else {
      if (animFrame) cancelAnimationFrame(animFrame);
    }
  }

  function animateParticles(now) {
    if (!playing) { animFrame = null; return; }
    if (!lastTime) lastTime = now;
    const dt = Math.min(now - lastTime, 40);
    lastTime = now;
    const elapsed = now / 1000;

    const step = currentStep;

    // water: roots (135,205) -> leaf (170,72) via stem
    if (step >= 2) {
      waterParticles.forEach(p => {
        const t = ((elapsed * 0.15 + p.phase + p.delay) % 4) / 4;
        let x, y;
        if (t < 0.5) {
          const p2 = t / 0.5;
          x = 135 + (170 - 135) * p2 * 0.4 + 3 * Math.sin(t * 10);
          y = 205 - (205 - 72) * p2 * 0.7;
        } else {
          const p2 = (t - 0.5) / 0.5;
          x = 170 + 10 * Math.sin(p2 * 3);
          y = 72 - 8 * p2;
          if (p2 > 0.8) { x = -10; y = -10; }
        }
        if (y > -5) { p.el.setAttribute('cx', x); p.el.setAttribute('cy', y); }
        else { p.el.setAttribute('cx', -10); p.el.setAttribute('cy', -10); }
      });
    } else {
      waterParticles.forEach(p => { p.el.setAttribute('cx', -10); p.el.setAttribute('cy', -10); });
    }

    // co2: air (300,90) -> leaf (170,72)
    if (step >= 3) {
      co2Particles.forEach(p => {
        const t = ((elapsed * 0.12 + p.phase + p.delay) % 5) / 5;
        let x, y;
        if (t < 0.7) {
          const p2 = t / 0.7;
          x = 300 - (300 - 170) * p2;
          y = 90 + 20 * Math.sin(p2 * 4) - 10 * p2;
        } else {
          const p2 = (t - 0.7) / 0.3;
          x = 170 - 6 + 12 * Math.sin(p2 * 3);
          y = 72 - 4 + 8 * Math.cos(p2 * 2);
          if (p2 > 0.9) { x = -10; y = -10; }
        }
        if (y > -5) { p.el.setAttribute('cx', x); p.el.setAttribute('cy', y); }
        else { p.el.setAttribute('cx', -10); p.el.setAttribute('cy', -10); }
      });
    } else {
      co2Particles.forEach(p => { p.el.setAttribute('cx', -10); p.el.setAttribute('cy', -10); });
    }

    // o2: leaf (170,72) -> air left (30,90)
    if (step >= 5) {
      o2Particles.forEach(p => {
        const t = ((elapsed * 0.12 + p.phase + p.delay) % 5) / 5;
        let x, y;
        if (t < 0.6) {
          const p2 = t / 0.6;
          x = 170 - (170 - 30) * p2;
          y = 72 - 10 + 20 * Math.sin(p2 * 5);
        } else {
          const p2 = (t - 0.6) / 0.4;
          x = 30 - 20 * p2;
          y = 90 + 30 * Math.sin(p2 * 3);
          if (p2 > 0.8) { x = -10; y = -10; }
        }
        if (y > -5) { p.el.setAttribute('cx', x); p.el.setAttribute('cy', y); }
        else { p.el.setAttribute('cx', -10); p.el.setAttribute('cy', -10); }
      });
    } else {
      o2Particles.forEach(p => { p.el.setAttribute('cx', -10); p.el.setAttribute('cy', -10); });
    }

    // glucose glow
    const gdot = svg.querySelector('#glucose-dot');
    if (step >= 4) {
      gdot.setAttribute('opacity', 0.4 + 0.6 * Math.sin(elapsed * 3));
      gdot.setAttribute('r', 4 + 2 * Math.sin(elapsed * 2));
    } else {
      gdot.setAttribute('opacity', 0.2);
      gdot.setAttribute('r', 4);
    }

    animFrame = requestAnimationFrame(animateParticles);
  }

  function init() {
    // labels
    const labelKeys = ['sun','leaf','roots','water','co2','o2','glucose','title'];
    document.querySelectorAll('[data-label]').forEach(el => {
      const key = el.dataset.label;
      const txt = Studio.t(key);
      if (txt) el.textContent = txt;
    });

    // set play/pause text
    const playBtn = app.querySelector('[data-action="play"]');
    playBtn.textContent = '⏸ ' + (Studio.t('pause') || 'PAUSE');

    // set question text
    const qText = document.getElementById('q-text');
    qText.textContent = Studio.t('ask') || 'Photosynthesis ke liye paudha kya andar leta hai?';

    // set option labels
    const optBtns = app.querySelectorAll('.option-btn');
    optBtns.forEach(btn => {
      const key = btn.dataset.option;
      const txt = Studio.t(key);
      if (txt) btn.textContent = txt;
    });

    // step captions
    for (let i = 1; i <= 5; i++) {
      captions[i] = Studio.t('step' + i) || 'Step ' + i;
    }

    // event listeners
    playBtn.addEventListener('click', togglePlay);

    app.querySelectorAll('[data-action^="step-"]').forEach(btn => {
      btn.addEventListener('click', function() {
        const n = parseInt(this.dataset.action.split('-')[1]);
        setStep(n);
        if (!playing) togglePlay();
      });
    });

    // question options
    let answered = false;
    optBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        if (answered) return;
        const val = this.dataset.option;
        optBtns.forEach(b => b.classList.remove('selected'));
        this.classList.add('selected');
        Studio.answer(val);
      });
    });

    Studio.onVerdict(function(result) {
      const fb = document.getElementById('feedback');
      if (result.correct) {
        fb.textContent = '✅ ' + (Studio.t('correct_answer') || 'Sahi! Shabash!');
        fb.className = 'feedback correct';
        optBtns.forEach(b => b.disabled = true);
        answered = true;
        Studio.done();
      } else {
        fb.textContent = '❌ ' + (Studio.t('wrong_answer') || 'Galat, phir se koshish karo');
        fb.className = 'feedback wrong';
        optBtns.forEach(b => b.classList.remove('selected'));
      }
    });

    setStep(1);
    lastTime = performance.now();
    animateParticles(lastTime);
    Studio.ready();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
