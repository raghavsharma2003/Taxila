<style>
  *{box-sizing:border-box}
  :root{
    --ink:#493548;
    --cream:#fff9ed;
    --card:#ffffff;
    --berry:#d95d78;
    --berry-dark:#b94362;
    --mango:#f7b94c;
    --mango-light:#ffe5a6;
    --mint:#61c4a7;
    --muted:#eadfd8;
  }
  body{
    margin:0;
    min-width:0;
    min-height:100vh;
    overflow-x:hidden;
    background:
      radial-gradient(circle at 12% 9%,rgba(247,185,76,.2) 0 38px,transparent 39px),
      radial-gradient(circle at 90% 20%,rgba(97,196,167,.16) 0 52px,transparent 53px),
      linear-gradient(180deg,#fff8e8,#fffdf8);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  button{font:inherit}
  .app{
    width:100%;
    max-width:440px;
    min-height:100vh;
    margin:auto;
    padding:18px 14px 22px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .title{
    margin:2px 0 5px;
    max-width:100%;
    text-align:center;
    font-size:clamp(23px,7vw,31px);
    line-height:1.15;
    color:var(--berry-dark);
  }
  .instruction{
    margin:0 0 10px;
    min-height:24px;
    text-align:center;
    font-size:16px;
    line-height:1.35;
  }
  .card{
    position:relative;
    width:100%;
    flex:1;
    min-height:472px;
    padding:13px 12px 16px;
    border:2px solid rgba(217,93,120,.13);
    border-radius:30px;
    background:rgba(255,255,255,.92);
    box-shadow:0 13px 30px rgba(100,65,45,.13);
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow:hidden;
  }
  .fraction{
    min-width:86px;
    min-height:72px;
    padding:4px 18px;
    border-radius:20px;
    background:var(--cream);
    box-shadow:inset 0 0 0 2px var(--mango-light);
    display:grid;
    grid-template-rows:1fr 3px 1fr;
    align-items:center;
    justify-items:center;
    font-size:25px;
    line-height:1;
    font-weight:800;
    color:var(--berry-dark);
  }
  .fraction-line{
    width:42px;
    height:3px;
    border-radius:4px;
    background:currentColor;
  }
  .picture-wrap{
    position:relative;
    width:min(100%,310px);
    aspect-ratio:1;
    margin:4px auto 0;
    display:grid;
    place-items:center;
  }
  .pizza{
    width:100%;
    height:100%;
    overflow:visible;
    filter:drop-shadow(0 8px 6px rgba(96,54,35,.17));
  }
  .pizza-base{fill:#e99c3e}
  .pizza-inner{fill:#fff0bd}
  .part{
    cursor:pointer;
    fill:#ffe7a0;
    stroke:#fffaf0;
    stroke-width:5;
    stroke-linejoin:round;
    transform-origin:150px 150px;
    transition:fill .22s ease,transform .16s ease,filter .22s ease;
    outline:none;
  }
  .part:hover{filter:brightness(1.025)}
  .part:active{transform:scale(.955)}
  .part[data-shaded="true"]{
    fill:var(--berry);
    filter:drop-shadow(0 2px 2px rgba(138,48,72,.25));
  }
  .part:focus-visible{
    stroke:var(--ink);
    stroke-width:6;
  }
  .center-dot{
    pointer-events:none;
    fill:#f8c65e;
    stroke:#fffaf0;
    stroke-width:4;
  }
  .feedback{
    min-height:31px;
    margin:0 5px 7px;
    text-align:center;
    font-weight:750;
    font-size:17px;
    line-height:1.3;
    color:var(--berry-dark);
    transition:opacity .18s ease,transform .18s ease;
  }
  .feedback.good{color:#21836c;animation:pop .42s ease}
  .feedback.try{animation:nudge .35s ease}
  .check{
    width:min(100%,280px);
    min-height:52px;
    border:0;
    border-radius:18px;
    padding:11px 22px;
    color:#fff;
    background:linear-gradient(180deg,var(--berry),var(--berry-dark));
    box-shadow:0 7px 0 #8f304c,0 10px 18px rgba(143,48,76,.2);
    font-weight:800;
    font-size:19px;
    cursor:pointer;
    transition:transform .13s ease,box-shadow .13s ease,opacity .2s ease;
  }
  .check:active{
    transform:translateY(5px) scale(.98);
    box-shadow:0 2px 0 #8f304c,0 5px 10px rgba(143,48,76,.18);
  }
  .check:focus-visible{outline:4px solid var(--mango);outline-offset:3px}
  .check:disabled{cursor:default;opacity:.62}
  .celebrate .pizza{animation:happy .55s ease}
  .spark{
    position:absolute;
    width:13px;
    height:13px;
    border-radius:50%;
    background:var(--mango);
    pointer-events:none;
    opacity:0;
  }
  .celebrate .spark{animation:spark .7s ease-out}
  .spark:nth-of-type(1){left:8%;top:20%;--x:-15px;--y:-35px}
  .spark:nth-of-type(2){right:7%;top:26%;--x:18px;--y:-32px;background:var(--mint);animation-delay:.06s}
  .spark:nth-of-type(3){left:13%;bottom:18%;--x:-17px;--y:27px;background:var(--berry);animation-delay:.1s}
  .spark:nth-of-type(4){right:12%;bottom:20%;--x:20px;--y:28px;animation-delay:.14s}
  .done-screen{
    flex:1;
    width:100%;
    display:none;
    place-items:center;
    text-align:center;
    padding:24px;
  }
  .done-screen.show{display:grid}
  .done-badge{
    width:180px;
    height:180px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:linear-gradient(145deg,#fff0ad,#ffd36c);
    border:9px solid #fff;
    box-shadow:0 12px 30px rgba(115,72,34,.18);
    animation:doneIn .65s cubic-bezier(.2,.85,.3,1.25);
  }
  .done-mark{
    width:82px;
    height:45px;
    border-left:12px solid #248970;
    border-bottom:12px solid #248970;
    transform:rotate(-45deg) translate(6px,-5px);
    border-radius:5px;
  }
  .done-text{
    margin-top:22px;
    color:var(--berry-dark);
    font-size:clamp(25px,8vw,34px);
    line-height:1.2;
    font-weight:850;
  }
  @keyframes pop{50%{transform:scale(1.08)}}
  @keyframes nudge{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
  @keyframes happy{35%{transform:rotate(-3deg) scale(1.04)}70%{transform:rotate(3deg) scale(1.04)}}
  @keyframes spark{20%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.25)}}
  @keyframes doneIn{from{opacity:0;transform:scale(.55) rotate(-10deg)}to{opacity:1;transform:scale(1) rotate(0)}}
  @media (max-height:660px){
    .app{padding-top:10px;padding-bottom:12px}
    .title{font-size:24px}
    .instruction{margin-bottom:5px}
    .card{min-height:455px;padding-top:9px}
    .picture-wrap{width:min(100%,275px)}
    .fraction{min-height:62px;font-size:22px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  }
</style>

<main class="app">
  <h1 class="title" id="title"></h1>
  <p class="instruction" id="instruction"></p>

  <section class="card" id="itemCard" data-item="">
    <div class="fraction" aria-hidden="true">
      <span id="numerator"></span>
      <span class="fraction-line"></span>
      <span id="denominator"></span>
    </div>

    <div class="picture-wrap" id="pictureWrap">
      <svg class="pizza" id="pizza" viewBox="0 0 300 300" role="group">
        <circle class="pizza-base" cx="150" cy="150" r="138"></circle>
        <circle class="pizza-inner" cx="150" cy="150" r="129"></circle>
        <g id="parts"></g>
        <circle class="center-dot" cx="150" cy="150" r="8"></circle>
      </svg>
      <i class="spark"></i>
      <i class="spark"></i>
      <i class="spark"></i>
      <i class="spark"></i>
    </div>

    <div class="feedback" id="feedback" aria-live="polite"></div>
    <button class="check" id="check" data-action="check" type="button"></button>
  </section>

  <section class="done-screen" id="doneScreen">
    <div>
      <div class="done-badge" aria-hidden="true"><span class="done-mark"></span></div>
      <div class="done-text" id="doneText"></div>
    </div>
  </section>
</main>

<script>
(() => {
  const items = Studio.params.items;
  const title = document.getElementById("title");
  const instruction = document.getElementById("instruction");
  const card = document.getElementById("itemCard");
  const numerator = document.getElementById("numerator");
  const denominator = document.getElementById("denominator");
  const partsGroup = document.getElementById("parts");
  const pictureWrap = document.getElementById("pictureWrap");
  const feedback = document.getElementById("feedback");
  const check = document.getElementById("check");
  const doneScreen = document.getElementById("doneScreen");
  const doneText = document.getElementById("doneText");
  const svgNS = "http://www.w3.org/2000/svg";
  let itemIndex = 0;
  let shaded = new Set();
  let waiting = false;
  let finished = false;

  title.textContent = Studio.t("title");
  instruction.textContent = Studio.t("instr");
  check.textContent = Studio.t("check");
  doneText.textContent = Studio.t("done");
  check.setAttribute("aria-label", Studio.t("check"));

  function point(angle, radius) {
    return {
      x: 150 + radius * Math.cos(angle),
      y: 150 + radius * Math.sin(angle)
    };
  }

  function sectorPath(start, end) {
    const a = point(start, 126);
    const b = point(end, 126);
    const large = end - start > Math.PI ? 1 : 0;
    return "M 150 150 L " + a.x + " " + a.y +
      " A 126 126 0 " + large + " 1 " + b.x + " " + b.y + " Z";
  }

  function togglePart(part, index) {
    if (waiting) return;
    if (shaded.has(index)) {
      shaded.delete(index);
      part.setAttribute("data-shaded", "false");
    } else {
      shaded.add(index);
      part.setAttribute("data-shaded", "true");
    }
    feedback.textContent = "";
    feedback.className = "feedback";
    Studio.event("part_toggle", {
      item: items[itemIndex].id,
      part: index,
      shaded: shaded.has(index)
    });
  }

  function renderItem() {
    const item = items[itemIndex];
    shaded = new Set();
    waiting = false;
    card.classList.remove("celebrate");
    card.dataset.item = item.id;
    numerator.textContent = item.n;
    denominator.textContent = item.d;
    feedback.textContent = "";
    feedback.className = "feedback";
    check.disabled = false;
    partsGroup.replaceChildren();

    const turn = Math.PI * 2 / item.d;
    const offset = -Math.PI / 2;

    for (let index = 0; index < item.d; index += 1) {
      const part = document.createElementNS(svgNS, "path");
      part.setAttribute("class", "part");
      part.setAttribute("d", sectorPath(offset + index * turn, offset + (index + 1) * turn));
      part.setAttribute("data-part", String(index));
      part.setAttribute("data-shaded", "false");
      part.setAttribute("tabindex", "0");
      part.setAttribute("role", "button");
      part.setAttribute("aria-label", Studio.t("instr"));
      part.addEventListener("click", () => togglePart(part, index));
      part.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          togglePart(part, index);
        }
      });
      partsGroup.appendChild(part);
    }

    Studio.event("item_show", {item: item.id});
  }

  function finish() {
    if (finished) return;
    finished = true;
    card.hidden = true;
    instruction.hidden = true;
    doneScreen.classList.add("show");
    Studio.event("activity_done", {});
    Studio.done();
  }

  check.addEventListener("click", () => {
    if (waiting || finished) return;
    waiting = true;
    check.disabled = true;
    feedback.textContent = "";
    feedback.className = "feedback";
    const item = items[itemIndex];
    Studio.event("check", {item: item.id, n: shaded.size, d: item.d});
    Studio.answer({n: shaded.size, d: item.d});
  });

  Studio.onVerdict(verdict => {
    if (!waiting || finished) return;
    waiting = false;

    if (verdict.correct) {
      feedback.textContent = Studio.t("right");
      feedback.className = "feedback good";
      card.classList.add("celebrate");
      Studio.event("verdict", {item: items[itemIndex].id, correct: true});

      window.setTimeout(() => {
        itemIndex += 1;
        if (itemIndex >= items.length) {
          finish();
        } else {
          renderItem();
        }
      }, 850);
    } else {
      feedback.textContent = Studio.t("wrong") + " " + Studio.t("hint");
      feedback.className = "feedback try";
      check.disabled = false;
      Studio.event("verdict", {item: items[itemIndex].id, correct: false});
    }
  });

  renderItem();
  Studio.ready();
})();
</script>
