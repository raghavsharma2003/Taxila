<style>
  :root {
    --bg: #f0f8ff;
    --soil: #5d4037;
    --stem: #8bc34a;
    --leaf: #4caf50;
    --sun: #ffeb3b;
    --particle-water: #2196f3;
    --particle-co2: #9c27b0;
    --particle-o2: #00bcd4;
    --particle-glucose: #ffc107;
    --text: #212121;
    --control: #ffffff;
    --control-bg: #607d8b;
    --control-active: #009688;
    --border-radius: 12px;
    --transition: 0.3s ease;
  }
  body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    width: 360px;
    height: 640px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
  }
  svg {
    width: 360px;
    height: 400px;
    background: linear-gradient(to bottom, #87ceeb 0%, #87ceeb 60%, var(--soil) 60%);
    border-radius: 0 0 var(--border-radius) var(--border-radius);
    overflow: visible;
  }
  .title {
    font-size: 20px;
    font-weight: bold;
    margin: 8px 0;
    text-align: center;
  }
  .controls {
    display: flex;
    gap: 8px;
    margin: 8px 0;
    flex-wrap: wrap;
    justify-content: center;
  }
  .play-pause, .step-btn, .option-btn {
    background: var(--control-bg);
    color: var(--control);
    border: none;
    border-radius: var(--border-radius);
    padding: 8px 12px;
    font-size: 16px;
    cursor: pointer;
    transition: transform var(--transition), background var(--transition);
    min-width: 44px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .play-pause:active, .step-btn:active, .option-btn:active {
    transform: scale(0.95);
  }
  .play-pause {
    background: var(--control-active);
  }
  .step-btn.active, .option-btn.selected {
    background: var(--control-active);
  }
  .caption {
    font-size: 16px;
    text-align: center;
    margin: 8px 0;
    min-height: 24px;
    color: var(--text);
  }
  .question {
    font-size: 18px;
    font-weight: bold;
    margin: 8px 0;
    text-align: center;
  }
  .options {
    display: flex;
    gap: 8px;
    margin: 8px 0;
    justify-content: center;
  }
  .feedback {
    font-size: 16px;
    text-align: center;
    margin: 4px 0;
    min-height: 20px;
  }
  .label {
    font-size: 14px;
    fill: var(--text);
    pointer-events: none;
  }
  .particle {
    transition: transform 0.5s linear;
  }
  .sun-ray {
    stroke: var(--sun);
    stroke-width: 2;
    opacity: 0.7;
  }
</style>

<svg viewBox="0 0 360 400">
  <!-- Sun -->
  <circle cx="180" cy="50" r="30" fill="var(--sun)" data-entity="sun" />
  <g data-entity="sun">
    <line x1="180" y1="50" x2="150" y2="30" class="sun-ray" />
    <line x1="180" y1="50" x2="210" y2="30" class="sun-ray" />
    <line x1="180" y1="50" x2="130" y2="80" class="sun-ray" />
    <line x1="180" y1="50" x2="230" y2="80" class="sun-ray" />
    <line x1="180" y1="50" x2="180" y2="10" class="sun-ray" />
  </g>
  <text x="180" y="90" text-anchor="middle" class="label" data-label="sun"></text>

  <!-- Plant -->
  <rect x="175" y="200" width="10" height="100" fill="var(--stem)" />
  <ellipse cx="180" cy="150" rx="40" ry="25" fill="var(--leaf)" data-entity="leaf" />
  <text x="180" y="150" text-anchor="middle" class="label" data-label="leaf"></text>

  <!-- Roots -->
  <path d="M170,300 Q160,320 170,340 Q180,360 190,340 Q200,320 190,300 Z" fill="var(--soil)" />
  <path d="M175,300 L175,350 M185,300 L185,350" stroke="var(--soil)" stroke-width="3" fill="none" data-entity="roots" />
  <text x="180" y="360" text-anchor="middle" class="label" data-label="roots"></text>

  <!-- Water particles (roots -> leaf) -->
  <circle cx="175" cy="320" r="4" fill="var(--particle-water)" class="particle" data-flow="water" />
  <circle cx="180" cy="300" r="4" fill="var(--particle-water)" class="particle" data-flow="water" />
  <circle cx="185" cy="280" r="4" fill="var(--particle-water)" class="particle" data-flow="water" />
  <circle cx="180" cy="250" r="4" fill="var(--particle-water)" class="particle" data-flow="water" />
  <circle cx="180" cy="220" r="4" fill="var(--particle-water)" class="particle" data-flow="water" />
  <text x="180" y="330" text-anchor="middle" class="label" data-label="water"></text>

  <!-- CO2 particles (air -> leaf) -->
  <circle cx="100" cy="120" r="4" fill="var(--particle-co2)" class="particle" data-flow="co2" />
  <circle cx="140" cy="130" r="4" fill="var(--particle-co2)" class="particle" data-flow="co2" />
  <circle cx="170" cy="140" r="4" fill="var(--particle-co2)" class="particle" data-flow="co2" />
  <text x="140" y="110" text-anchor="middle" class="label" data-label="co2"></text>

  <!-- O2 particles (leaf -> air) -->
  <circle cx="250" cy="120" r="4" fill="var(--particle-o2)" class="particle" data-flow="o2" />
  <circle cx="210" cy="130" r="4" fill="var(--particle-o2)" class="particle" data-flow="o2" />
  <circle cx="190" cy="140" r="4" fill="var(--particle-o2)" class="particle" data-flow="o2" />
  <text x="220" y="110" text-anchor="middle" class="label" data-label="o2"></text>

  <!-- Glucose (inside leaf) -->
  <circle cx="180" cy="150" r="6" fill="var(--particle-glucose)" opacity="0" class="particle" data-flow="glucose" />
  <text x="180" y="170" text-anchor="middle" class="label" data-label="glucose"></text>
</svg>

<div class="title" data-label="title"></div>

<div class="controls">
  <button class="play-pause" data-action="play"></button>
  <button class="step-btn active" data-action="step-1">1</button>
  <button class="step-btn" data-action="step-2">2</button>
  <button class="step-btn" data-action="step-3">3</button>
  <button class="step-btn" data-action="step-4">4</button>
  <button class="step-btn" data-action="step-5">5</button>
</div>

<div class="caption" data-caption></div>

<div class="question" data-label="ask"></div>

<div class="options">
  <button class="option-btn" data-option="co2"></button>
  <button class="option-btn" data-option="o2"></button>
  <button class="option-btn" data-option="water"></button>
</div>

<div class="feedback"></div>

<script>
  (function() {
    const params = Studio.params;
    const t = Studio.t;
    const particles = {
      water: document.querySelectorAll('[data-flow="water"]'),
      co2: document.querySelectorAll('[data-flow="co2"]'),
      o2: document.querySelectorAll('[data-flow="o2"]'),
      glucose: document.querySelector('[data-flow="glucose"]')
    };
    const leaf = document.querySelector('[data-entity="leaf"]');
    const roots = document.querySelector('[data-entity="roots"]');
    const sun = document.querySelector('[data-entity="sun"]');
    const playPauseBtn = document.querySelector('[data-action="play"]');
    const stepBtns = document.querySelectorAll('.step-btn');
    const captionEl = document.querySelector('[data-caption]');
    const questionEl = document.querySelector('[data-label="ask"]');
    const optionBtns = document.querySelectorAll('.option-btn');
    const feedbackEl = document.querySelector('.feedback');
    const titleEl = document.querySelector('[data-label="title"]');
    const labelEls = document.querySelectorAll('[data-label]');

    let isPlaying = true;
    let currentStep = 1;
    let animationId = null;
    let isAnswered = false;

    // Update all labels
    function updateLabels() {
      labelEls.forEach(el => {
        const key = el.getAttribute('data-label');
        el.textContent = t(key);
      });
      playPauseBtn.textContent = isPlaying ? t('pause') : t('play');
      optionBtns.forEach(btn => {
        const option = btn.getAttribute('data-option');
        btn.textContent = t(option);
      });
    }

    // Step captions
    const stepCaptions = {
      1: t('step1'),
      2: t('step2'),
      3: t('step3'),
      4: t('step4'),
      5: t('step5')
    };

    // Animate particles
    function animateParticles() {
      if (!isPlaying) return;

      // Water particles: roots -> leaf
      particles.water.forEach((p, i) => {
        let cy = parseFloat(p.getAttribute('cy'));
        cy -= 0.5 + i * 0.2;
        if (cy < 150) cy = 320 - i * 20;
        p.setAttribute('cy', cy);
      });

      // CO2 particles: air -> leaf
      particles.co2.forEach((p, i) => {
        let cx = parseFloat(p.getAttribute('cx'));
        let cy = parseFloat(p.getAttribute('cy'));
        cx += 0.3 + i * 0.1;
        cy += (0.3 + i * 0.1) * 0.5;
        if (cx > 180) {
          cx = 100 + i * 30;
          cy = 120 + i * 10;
        }
        p.setAttribute('cx', cx);
        p.setAttribute('cy', cy);
      });

      // O2 particles: leaf -> air
      particles.o2.forEach((p, i) => {
        let cx = parseFloat(p.getAttribute('cx'));
        let cy = parseFloat(p.getAttribute('cy'));
        cx += 0.3 + i * 0.1;
        cy -= (0.3 + i * 0.1) * 0.5;
        if (cx > 250) {
          cx = 190 + i * 20;
          cy = 140 - i * 10;
        }
        p.setAttribute('cx', cx);
        p.setAttribute('cy', cy);
      });

      // Glucose: pulse in leaf
      if (currentStep >= 4) {
        particles.glucose.style.opacity = particles.glucose.style.opacity === '1' ? '0.5' : '1';
      }

      animationId = requestAnimationFrame(animateParticles);
    }

    // Highlight step
    function highlightStep(step) {
      stepBtns.forEach(btn => btn.classList.remove('active'));
      document.querySelector(`[data-action="step-${step}"]`).classList.add('active');
      captionEl.textContent = stepCaptions[step];

      // Reset all particles opacity
      ['water', 'co2', 'o2'].forEach(f => {
        particles[f].forEach(p => p.style.opacity = '1');
      });
      particles.glucose.style.opacity = step >= 4 ? '1' : '0';
      if (sun) sun.style.filter = 'none';

      // Highlight current flow
      if (step === 1) {
        particles.water.forEach(p => p.style.opacity = '1');
      } else if (step === 2) {
        particles.co2.forEach(p => p.style.opacity = '1');
      } else if (step === 3) {
        if (sun) sun.style.filter = 'drop-shadow(0 0 8px gold)';
      } else if (step === 4) {
        particles.glucose.style.opacity = '1';
      } else if (step === 5) {
        particles.o2.forEach(p => p.style.opacity = '1');
      }
    }

    // Play/pause toggle
    playPauseBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playPauseBtn.textContent = isPlaying ? t('pause') : t('play');
      Studio.event('toggle_play', { playing: isPlaying });
      if (isPlaying) {
        animateParticles();
      } else {
        cancelAnimationFrame(animationId);
      }
    });

    // Step buttons
    stepBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const step = parseInt(btn.getAttribute('data-action').split('-')[1]);
        currentStep = step;
        highlightStep(currentStep);
        Studio.event('step_change', { step });
      });
    });

    // Option buttons
    optionBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const option = btn.getAttribute('data-option');
        Studio.answer(option);
        btn.classList.add('selected');
        isAnswered = true;
        Studio.event('answer_submit', { option });
      });
    });

    // Verdict handler
    Studio.onVerdict(({ correct }) => {
      feedbackEl.textContent = correct ? t('correct') : t('wrong');
      feedbackEl.className = correct ? 'feedback correct' : 'feedback';
      if (correct) {
        Studio.done();
      } else {
        isAnswered = false;
        optionBtns.forEach(btn => btn.classList.remove('selected'));
      }
    });

    // Initialize
    updateLabels();
    highlightStep(1);
    animateParticles();
    Studio.ready();
  })();
</script>
