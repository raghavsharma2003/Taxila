<style>
  :root{
    --bg:#fff8ef;
    --card:#ffffff;
    --ink:#3b2f2f;
    --muted:#7a6a6a;
    --accent:#ff8a65;
    --accent2:#ffd180;
    --good:#2e9e6f;
    --bad:#d95b6a;
    --shade:#ff7043;
    --unshade:#ffe0b2;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  .app{
    width:100%;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:14px;
  }
  .card{
    width:min(96vw,420px);
    background:var(--card);
    border-radius:20px;
    box-shadow:0 8px 24px rgba(0,0,0,.08);
    padding:14px 14px 16px;
    overflow:hidden;
  }
  .title{
    font-size:24px;
    font-weight:800;
    margin:2px 2px 6px;
    color:#5a3d2b;
  }
  .instr{
    font-size:16px;
    color:var(--muted);
    margin:0 2px 10px;
    line-height:1.3;
    min-height:40px;
  }
  .frac{
    margin:0 auto 10px;
    width:max-content;
    font-weight:800;
    color:#6d3f2e;
    font-size:30px;
    line-height:1;
    display:flex;
    align-items:center;
    gap:8px;
    background:#fff4e6;
    border-radius:14px;
    padding:8px 14px;
  }
  .whole{
    width:100%;
    display:flex;
    justify-content:center;
    margin:4px 0 12px;
  }
  svg{
    width:min(82vw,320px);
    height:auto;
    display:block;
  }
  .part{
    fill:var(--unshade);
    stroke:#ffffff;
    stroke-width:2.5;
    cursor:pointer;
    transform-origin:160px 160px;
    transition:transform .16s ease, fill .2s ease, filter .2s ease;
    filter:drop-shadow(0 2px 1px rgba(0,0,0,.05));
  }
  .part[data-shaded="true"]{
    fill:var(--shade);
  }
  .part:active{
    transform:scale(.97);
  }
  .controls{
    display:flex;
    justify-content:center;
    margin-top:2px;
  }
  button{
    min-width:130px;
    min-height:48px;
    border:none;
    border-radius:14px;
    background:linear-gradient(180deg,var(--accent),#ff7043);
    color:white;
    font-size:18px;
    font-weight:800;
    padding:10px 18px;
    cursor:pointer;
    transition:transform .14s ease, box-shadow .2s ease, opacity .2s;
    box-shadow:0 6px 14px rgba(255,112,67,.35);
  }
  button:active{transform:scale(.97)}
  button[disabled]{opacity:.6;cursor:not-allowed}
  .feedback{
    margin-top:10px;
    text-align:center;
    min-height:42px;
    font-size:18px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:2px;
  }
  .feedback.good{color:var(--good)}
  .feedback.bad{color:var(--bad)}
  .hint{
    font-size:14px;
    font-weight:600;
    color:#8a7a7a;
  }
  .pop{
    animation:pop .42s ease;
  }
  @keyframes pop{
    0%{transform:scale(1)}
    35%{transform:scale(1.08)}
    100%{transform:scale(1)}
  }
  .done{
    display:none;
    text-align:center;
    padding:28px 10px 16px;
  }
  .done.show{display:block}
  .done-badge{
    width:90px;height:90px;margin:0 auto 10px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #fff59d, #ffcc80 60%, #ffb74d);
    display:flex;align-items:center;justify-content:center;
    font-size:42px;
    animation:float 1.4s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-5px)}
  }
</style>

<div class="app">
  <div class="card">
    <div id="game">
      <div class="title" id="title"></div>
      <div class="instr" id="instr"></div>
      <div class="frac"><span id="fracN">0</span><span>/</span><span id="fracD">0</span></div>
      <div class="whole">
        <div id="itemBox" data-item="">
          <svg id="pizza" viewBox="0 0 320 320" aria-hidden="true">
            <defs>
              <radialGradient id="crust" cx="50%" cy="50%" r="60%">
                <stop offset="0%" stop-color="#ffd8a8"/>
                <stop offset="100%" stop-color="#ffb74d"/>
              </radialGradient>
            </defs>
            <circle cx="160" cy="160" r="142" fill="url(#crust)"></circle>
            <circle cx="160" cy="160" r="128" fill="#ffe9cc"></circle>
            <g id="partsLayer"></g>
          </svg>
        </div>
      </div>
      <div class="controls">
        <button id="checkBtn" data-action="check" type="button"></button>
      </div>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </div>
    <div id="done" class="done">
      <div class="done-badge">✓</div>
      <div class="title" id="doneText"></div>
    </div>
  </div>
</div>

<script>
(function(){
  const items = (Studio.params && Studio.params.items) ? Studio.params.items : [];
  let idx = 0;
  let locked = false;
  let waitingVerdict = false;

  const els = {
    title: document.getElementById('title'),
    instr: document.getElementById('instr'),
    fracN: document.getElementById('fracN'),
    fracD: document.getElementById('fracD'),
    itemBox: document.getElementById('itemBox'),
    partsLayer: document.getElementById('partsLayer'),
    checkBtn: document.getElementById('checkBtn'),
    feedback: document.getElementById('feedback'),
    game: document.getElementById('game'),
    done: document.getElementById('done'),
    doneText: document.getElementById('doneText')
  };

  els.title.textContent = Studio.t('title');
  els.instr.textContent = Studio.t('instr');
  els.checkBtn.textContent = Studio.t('check');
  els.doneText.textContent = Studio.t('done');

  function polar(cx, cy, r, ang){
    const a = (ang - 90) * Math.PI / 180;
    return {x: cx + r * Math.cos(a), y: cy + r * Math.sin(a)};
  }

  function wedgePath(cx, cy, r, a0, a1){
    const p0 = polar(cx, cy, r, a0);
    const p1 = polar(cx, cy, r, a1);
    const large = (a1 - a0) > 180 ? 1 : 0;
    return `M ${cx} ${cy} L ${p0.x} ${p0.y} A ${r} ${r} 0 ${large} 1 ${p1.x} ${p1.y} Z`;
  }

  function makePart(i, d){
    const a0 = (360 / d) * i;
    const a1 = (360 / d) * (i + 1);
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('class','part');
    p.setAttribute('d', wedgePath(160,160,124,a0,a1));
    p.setAttribute('data-part', String(i));
    p.setAttribute('data-shaded', 'false');
    p.style.minWidth = '44px';
    p.style.minHeight = '44px';
    p.addEventListener('click', function(){
      if (locked) return;
      const now = p.getAttribute('data-shaded') === 'true';
      p.setAttribute('data-shaded', now ? 'false' : 'true');
      p.classList.remove('pop');
      void p.offsetWidth;
      p.classList.add('pop');
      Studio.event('part_tap', {item: items[idx].id, part: i, shaded: !now});
      clearFeedback();
    });
    return p;
  }

  function shadedCount(){
    return els.partsLayer.querySelectorAll('.part[data-shaded="true"]').length;
  }

  function clearFeedback(){
    els.feedback.textContent = '';
    els.feedback.className = 'feedback';
  }

  function renderItem(){
    const item = items[idx];
    els.itemBox.setAttribute('data-item', item.id);
    els.fracN.textContent = String(item.n);
    els.fracD.textContent = String(item.d);
    els.partsLayer.innerHTML = '';
    for(let i=0;i<item.d;i++){
      els.partsLayer.appendChild(makePart(i,item.d));
    }
    locked = false;
    waitingVerdict = false;
    els.checkBtn.disabled = false;
    clearFeedback();
  }

  els.checkBtn.addEventListener('click', function(){
    if (locked || waitingVerdict || idx >= items.length) return;
    waitingVerdict = true;
    const item = items[idx];
    const n = shadedCount();
    Studio.event('check', {item:item.id, n:n, d:item.d});
    Studio.answer({n:n, d:item.d});
  });

  Studio.onVerdict(function(v){
    waitingVerdict = false;
    if (!v || typeof v.correct !== 'boolean') return;
    if (v.correct){
      locked = true;
      els.feedback.className = 'feedback good';
      els.feedback.textContent = Studio.t('right');
      els.itemBox.classList.add('pop');
      setTimeout(()=>els.itemBox.classList.remove('pop'), 350);
      setTimeout(function(){
        idx += 1;
        if (idx < items.length){
          renderItem();
        } else {
          els.game.style.display = 'none';
          els.done.classList.add('show');
          Studio.done();
        }
      }, 700);
    } else {
      els.feedback.className = 'feedback bad';
      els.feedback.innerHTML = '';
      const m = document.createElement('div');
      m.textContent = Studio.t('wrong');
      const h = document.createElement('div');
      h.className = 'hint';
      h.textContent = Studio.t('hint');
      els.feedback.appendChild(m);
      els.feedback.appendChild(h);
    }
  });

  if (items.length > 0){
    renderItem();
  } else {
    els.game.style.display = 'none';
    els.done.classList.add('show');
    Studio.done();
  }

  Studio.ready();
})();
</script>
