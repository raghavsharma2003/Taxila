<style>
  :root{
    --bg:#fff8ef;
    --card:#ffffff;
    --ink:#2b2b3a;
    --muted:#6b6b7a;
    --accent:#ff8a3d;
    --accent2:#ffd9b8;
    --good:#35b36a;
    --bad:#e85d68;
    --ring:#ffe7d1;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    font-family: ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
    color:var(--ink);
  }
  #app{
    width:100%;
    min-height:100vh;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:10px;
    overflow:hidden;
  }
  .head{
    background:linear-gradient(180deg,#fff,#fff7f0);
    border-radius:18px;
    padding:12px 14px;
    box-shadow:0 6px 20px rgba(0,0,0,.06);
  }
  h1{
    margin:0;
    font-size:22px;
    line-height:1.2;
  }
  #instr{
    margin:6px 0 0;
    color:var(--muted);
    font-size:15px;
    line-height:1.3;
  }
  #card{
    background:var(--card);
    border-radius:22px;
    padding:14px;
    box-shadow:0 10px 24px rgba(0,0,0,.08);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    flex:1;
    min-height:0;
  }
  #fraction{
    font-weight:800;
    font-size:34px;
    line-height:1;
    color:#303049;
    padding:8px 18px;
    border-radius:14px;
    background:#fff5eb;
    border:2px solid var(--ring);
  }
  #wholeWrap{
    width:min(92vw,320px);
    aspect-ratio:1/1;
    display:grid;
    place-items:center;
    background:radial-gradient(circle at 50% 40%, #fff, #fff3e8);
    border-radius:50%;
    border:2px solid #ffd3ab;
    box-shadow: inset 0 4px 14px rgba(255,151,74,.18);
  }
  #whole{
    width:92%;
    height:92%;
  }
  .part{
    cursor:pointer;
    transition:transform .14s ease, opacity .2s ease, filter .2s ease;
    transform-origin:center;
    outline:none;
  }
  .part[data-shaded="false"]{
    fill:#ffe9d4;
    stroke:#e38e4f;
    stroke-width:2;
  }
  .part[data-shaded="true"]{
    fill:var(--accent);
    stroke:#b85e25;
    stroke-width:2.2;
    filter:drop-shadow(0 0 3px rgba(255,138,61,.45));
  }
  .part:active{
    transform:scale(.97);
  }
  .part.pop{
    animation:pop .2s ease;
  }
  @keyframes pop{
    0%{transform:scale(1)}
    50%{transform:scale(1.05)}
    100%{transform:scale(1)}
  }
  #feedback{
    min-height:24px;
    font-size:18px;
    font-weight:700;
    text-align:center;
  }
  #feedback.good{color:var(--good)}
  #feedback.bad{color:var(--bad)}
  #check{
    min-width:150px;
    min-height:48px;
    border:none;
    border-radius:14px;
    background:linear-gradient(180deg,#ff9d57,#ff7f2f);
    color:#fff;
    font-size:18px;
    font-weight:800;
    padding:10px 16px;
    cursor:pointer;
    box-shadow:0 8px 16px rgba(255,127,47,.28);
    transition:transform .12s ease, filter .2s ease, opacity .2s ease;
  }
  #check:active{transform:scale(.97)}
  #check[disabled]{opacity:.65;filter:grayscale(.15)}
  #doneScreen{
    display:none;
    flex:1;
    background:var(--card);
    border-radius:22px;
    box-shadow:0 10px 24px rgba(0,0,0,.08);
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    font-size:28px;
    font-weight:800;
    color:var(--good);
    animation:fadeIn .35s ease;
  }
  #doneScreen.show{display:flex}
  .celebrate{
    animation:celebrate .45s ease;
  }
  @keyframes celebrate{
    0%{transform:scale(1)}
    50%{transform:scale(1.06)}
    100%{transform:scale(1)}
  }
  @keyframes fadeIn{
    from{opacity:0;transform:translateY(8px)}
    to{opacity:1;transform:translateY(0)}
  }
</style>

<div id="app">
  <div class="head">
    <h1 id="title"></h1>
    <p id="instr"></p>
  </div>

  <div id="card" data-item="">
    <div id="fraction"><span id="num"></span>/<span id="den"></span></div>
    <div id="wholeWrap">
      <svg id="whole" viewBox="-110 -110 220 220" aria-hidden="true"></svg>
    </div>
    <div id="feedback" aria-live="polite"></div>
    <button id="check" data-action="check" type="button"></button>
  </div>

  <div id="doneScreen" aria-live="polite"></div>
</div>

<script>
(function(){
  const items = (Studio.params && Studio.params.items) ? Studio.params.items : [];
  const elTitle = document.getElementById('title');
  const elInstr = document.getElementById('instr');
  const elCard = document.getElementById('card');
  const elNum = document.getElementById('num');
  const elDen = document.getElementById('den');
  const elWhole = document.getElementById('whole');
  const elFeedback = document.getElementById('feedback');
  const elCheck = document.getElementById('check');
  const elDone = document.getElementById('doneScreen');

  let idx = 0;
  let shaded = new Set();
  let awaiting = false;
  let finished = false;

  elTitle.textContent = Studio.t('title');
  elInstr.textContent = Studio.t('instr');
  elCheck.textContent = Studio.t('check');

  function point(r, a){
    return {x:r*Math.cos(a), y:r*Math.sin(a)};
  }

  function wedgePath(i, d, r){
    const step = (Math.PI * 2) / d;
    const a1 = -Math.PI/2 + i*step;
    const a2 = a1 + step;
    const p1 = point(r, a1);
    const p2 = point(r, a2);
    const large = (a2-a1) > Math.PI ? 1 : 0;
    return `M 0 0 L ${p1.x.toFixed(3)} ${p1.y.toFixed(3)} A ${r} ${r} 0 ${large} 1 ${p2.x.toFixed(3)} ${p2.y.toFixed(3)} Z`;
  }

  function updatePartState(part, on){
    part.setAttribute('data-shaded', on ? 'true' : 'false');
    part.classList.remove('pop');
    void part.offsetWidth;
    part.classList.add('pop');
  }

  function renderItem(){
    const item = items[idx];
    if(!item){ return; }
    shaded = new Set();
    awaiting = false;
    elCheck.disabled = false;
    elFeedback.textContent = '';
    elFeedback.className = '';
    elCard.setAttribute('data-item', item.id);
    elNum.textContent = String(item.n);
    elDen.textContent = String(item.d);
    elWhole.innerHTML = '';

    const r = 95;
    for(let i=0;i<item.d;i++){
      const p = document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d', wedgePath(i,item.d,r));
      p.setAttribute('class','part');
      p.setAttribute('data-part', String(i));
      p.setAttribute('data-shaded','false');
      p.style.transformOrigin = '0px 0px';
      p.addEventListener('click', function(){
        if(awaiting || finished) return;
        const key = i;
        if(shaded.has(key)){
          shaded.delete(key);
          updatePartState(p,false);
        }else{
          shaded.add(key);
          updatePartState(p,true);
        }
        Studio.event('tap_part',{item:item.id,part:i,shaded:shaded.has(key)});
      });
      elWhole.appendChild(p);
    }
    const rim = document.createElementNS('http://www.w3.org/2000/svg','circle');
    rim.setAttribute('cx','0'); rim.setAttribute('cy','0'); rim.setAttribute('r', String(r+1.5));
    rim.setAttribute('fill','none'); rim.setAttribute('stroke','#b8622c'); rim.setAttribute('stroke-width','3');
    rim.setAttribute('opacity','0.45');
    elWhole.appendChild(rim);
  }

  function goDone(){
    finished = true;
    elCard.style.display = 'none';
    elDone.textContent = Studio.t('done');
    elDone.classList.add('show');
    Studio.done();
  }

  elCheck.addEventListener('click', function(){
    if(awaiting || finished) return;
    const item = items[idx];
    if(!item) return;
    awaiting = true;
    elCheck.disabled = true;
    Studio.event('check',{item:item.id,n:shaded.size,d:item.d});
    Studio.answer({n: shaded.size, d: item.d});
  });

  Studio.onVerdict(function(v){
    if(finished) return;
    if(!v || typeof v.correct !== 'boolean') return;
    awaiting = false;
    elCheck.disabled = false;

    if(v.correct){
      elFeedback.className = 'good';
      elFeedback.textContent = Studio.t('right');
      elCard.classList.remove('celebrate');
      void elCard.offsetWidth;
      elCard.classList.add('celebrate');
      Studio.event('verdict',{correct:true,item:items[idx] && items[idx].id});
      setTimeout(function(){
        idx += 1;
        if(idx >= items.length){
          goDone();
        }else{
          renderItem();
        }
      }, 700);
    }else{
      elFeedback.className = 'bad';
      elFeedback.textContent = Studio.t('wrong') + ' ' + Studio.t('hint');
      Studio.event('verdict',{correct:false,item:items[idx] && items[idx].id});
    }
  });

  renderItem();
  Studio.ready();
})();
</script>
