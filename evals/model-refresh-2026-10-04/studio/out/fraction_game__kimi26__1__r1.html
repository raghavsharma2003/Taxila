<style>
  :root {
    --bg: #FFF9F0;
    --ink: #2D1F14;
    --accent: #FF8B3D;
    --accent2: #FF5E3A;
    --check: #34C759;
    --hint: #8A7B6E;
    --toast-wrong: #E85D75;
    --ring: #FFD8B8;
    --part-fill: #FFFFFF;
    --part-stroke: #D4A574;
    --part-selected: #FFB347;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes popIn {
    0% { transform: scale(0.8); opacity: 0; }
    70% { transform: scale(1.05); }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes littleBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  @keyframes checkPulse {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(52,199,89,0.5); }
    70% { transform: scale(1.02); box-shadow: 0 0 0 10px rgba(52,199,89,0); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(52,199,89,0); }
  }

  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(200px) rotate(720deg); opacity: 0; }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #app {
    width: 100%;
    height: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    padding: 16px;
    position: relative;
  }

  /* Intro */
  #intro {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    text-align: center;
    animation: fadeIn 0.6s ease;
  }
  .mascot {
    width: 120px;
    height: 120px;
    margin-bottom: 24px;
  }
  .title {
    font-size: 28px;
    font-weight: 800;
    color: var(--accent2);
    margin-bottom: 12px;
    line-height: 1.2;
  }
  .subtitle {
    font-size: 16px;
    color: var(--hint);
    margin-bottom: 32px;
    line-height: 1.4;
  }
  .btn-go {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #FFF;
    border: none;
    border-radius: 50px;
    padding: 16px 48px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(255,94,58,0.3);
    transition: transform 0.2s, box-shadow 0.2s;
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn-go:active { transform: scale(0.95); }

  /* Game */
  #game {
    display: none;
    flex-direction: column;
    align-items: center;
    flex: 1;
    width: 100%;
    animation: fadeIn 0.4s ease;
  }
  #game.active { display: flex; }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    margin-bottom: 8px;
  }
  .item-tag {
    background: #FFF;
    border: 2px solid var(--ring);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent2);
  }
  .progress-dots { display: flex; gap: 6px; }
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #E8DDD0;
    transition: all 0.3s;
  }
  .dot.done { background: var(--check); }
  .dot.current { background: var(--accent); transform: scale(1.3); }

  .fraction-display {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 12px 0;
    animation: popIn 0.5s ease;
  }
  .frac-card {
    text-align: center;
  }
  .frac-num {
    font-size: 48px;
    font-weight: 900;
    color: var(--accent2);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .frac-line {
    width: 64px;
    height: 4px;
    background: var(--accent2);
    border-radius: 2px;
    margin: 6px auto;
  }
  .frac-den {
    font-size: 48px;
    font-weight: 900;
    color: var(--accent2);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .equals {
    font-size: 36px;
    font-weight: 800;
    color: var(--hint);
    animation: littleBounce 2s infinite;
  }

  .shape-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    position: relative;
  }

  .shape-wrap {
    width: 280px;
    height: 280px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .part {
    cursor: pointer;
    transition: fill 0.3s ease, filter 0.2s, transform 0.15s;
  }
  .part:hover { filter: brightness(0.98); }
  .part[data-shaded="true"] { filter: brightness(1); }
  .part:active { transform: scale(0.97); }

  .hint-text {
    font-size: 14px;
    color: var(--hint);
    margin: 8px 0;
    min-height: 20px;
    text-align: center;
    font-weight: 600;
  }

  .check-bar {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .btn-check {
    width: 100%;
    max-width: 240px;
    min-height: 52px;
    border: none;
    border-radius: 16px;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #FFF;
    box-shadow: 0 6px 20px rgba(255,94,58,0.35);
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    position: relative;
    overflow: hidden;
  }
  .btn-check:active { transform: scale(0.97); }
  .btn-check::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.15);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .btn-check:hover::after { opacity: 1; }

  .feedback-msg {
    font-size: 16px;
    font-weight: 700;
    min-height: 24px;
    text-align: center;
    transition: all 0.3s;
  }
  .feedback-msg.right { color: var(--check); animation: checkPulse 0.6s ease; }
  .feedback-msg.wrong { color: var(--toast-wrong); animation: shake 0.4s ease; }

  /* Done */
  #done {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    text-align: center;
    animation: fadeIn 0.6s ease;
  }
  .done-mascot {
    width: 140px;
    height: 140px;
    margin-bottom: 20px;
  }
  .done-msg {
    font-size: 22px;
    font-weight: 800;
    color: var(--accent2);
    margin-bottom: 8px;
  }
  .done-sub {
    font-size: 16px;
    color: var(--hint);
    margin-bottom: 28px;
  }
  .btn-finish {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #FFF;
    border: none;
    border-radius: 50px;
    padding: 16px 40px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(255,94,58,0.3);
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn-finish:active { transform: scale(0.95); }

  /* Confetti particle */
  .confetti {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    pointer-events: none;
    animation: confettiFall 1s ease-out forwards;
  }

  /* Shared SVG styles */
  .pizza-crust { fill: var(--part-fill); stroke: var(--part-stroke); stroke-width: 3; }
  .bar-bg { fill: #F5EBE0; stroke: var(--part-stroke); stroke-width: 3; rx: 12; }
  .bar-part { fill: var(--part-fill); stroke: var(--part-stroke); stroke-width: 2; rx: 8; transition: fill 0.3s; }
  .bar-part.sel { fill: var(--part-selected); }
  .slice { transition: fill 0.3s; }
  .slice.sel { fill: var(--part-selected); }
</style>

<div id="app">
  <!-- Intro Screen -->
  <div id="intro">
    <svg class="mascot" viewBox="0 0 120 120">
      <defs>
        <radialGradient id="mg" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FFD8B8"/>
          <stop offset="100%" stop-color="#FF8B3D"/>
        </radialGradient>
      </defs>
      <circle cx="60" cy="60" r="50" fill="url(#mg)" />
      <ellipse cx="45" cy="50" rx="5" ry="7" fill="#2D1F14"/>
      <ellipse cx="75" cy="50" rx="5" ry="7" fill="#2D1F14"/>
      <path d="M 42 75 Q 60 92 78 75" fill="none" stroke="#2D1F14" stroke-width="4" stroke-linecap="round"/>
      <circle cx="60" cy="62" r="4" fill="#E85D75" opacity="0.6"/>
    </svg>
    <div class="title" id="t-title"></div>
    <div class="subtitle" id="t-instr"></div>
    <button class="btn-go" id="btn-go"></button>
  </div>

  <!-- Game Screen -->
  <div id="game">
    <div class="top-bar">
      <div class="item-tag" id="item-tag"></div>
      <div class="progress-dots" id="dots"></div>
    </div>

    <div class="fraction-display" id="fraction-display">
      <div class="frac-card">
        <div class="frac-num" id="fd-n">0</div>
        <div class="frac-line"></div>
        <div class="frac-den" id="fd-d">0</div>
      </div>
      <div class="equals">=</div>
      <svg width="48" height="48" viewBox="0 0 48 48" style="opacity:0.7;">
        <circle cx="24" cy="24" r="20" fill="none" stroke="var(--hint)" stroke-width="3" stroke-dasharray="4 4"/>
        <path d="M16 24 L22 30 L32 18" fill="none" stroke="var(--hint)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="shape-area" id="shape-area"></div>

    <div class="hint-text" id="t-hint"></div>

    <div class="check-bar">
      <button class="btn-check" id="btn-check" data-action="check"></button>
      <div class="feedback-msg" id="feedback"></div>
    </div>
  </div>

  <!-- Done Screen -->
  <div id="done">
    <svg class="done-mascot" viewBox="0 0 120 120">
      <defs>
        <radialGradient id="dg" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FFD8B8"/>
          <stop offset="100%" stop-color="#FF8B3D"/>
        </radialGradient>
      </defs>
      <circle cx="60" cy="60" r="50" fill="url(#dg)" />
      <ellipse cx="40" cy="50" rx="5" ry="7" fill="#2D1F14"/>
      <ellipse cx="80" cy="50" rx="5" ry="7" fill="#2D1F14"/>
      <path d="M 38 72 Q 60 95 82 72" fill="none" stroke="#2D1F14" stroke-width="4" stroke-linecap="round"/>
      <path d="M 30 38 L 24 32 M 90 38 L 96 32" stroke="#2D1F14" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <div class="done-msg" id="t-done"></div>
    <div class="done-sub"></div>
    <button class="btn-finish" id="btn-finish"></button>
  </div>
</div>

<script>
(function(){
  const params = Studio.params;
  const items = params.items || [];
  const picture = params.picture || 'pizza-or-bar';

  const app = document.getElementById('app');
  const introEl = document.getElementById('intro');
  const gameEl = document.getElementById('game');
  const doneEl = document.getElementById('done');

  /* ---- Intro ---- */
  document.getElementById('t-title').textContent = Studio.t('title');
  document.getElementById('t-instr').textContent = Studio.t('instr');
  const goBtn = document.getElementById('btn-go');
  goBtn.textContent = Studio.t('check'); /* repurposed for "Start" feel; using 'check' as start label per constraints */

  /* ---- UI refs ---- */
  const itemTag = document.getElementById('item-tag');
  const dotsEl = document.getElementById('dots');
  const fdN = document.getElementById('fd-n');
  const fdD = document.getElementById('fd-d');
  const shapeArea = document.getElementById('shape-area');
  const hintEl = document.getElementById('t-hint');
  const checkBtn = document.getElementById('btn-check');
  const feedbackEl = document.getElementById('feedback');

  /* ---- State ---- */
  let currentIdx = 0;
  let selected = new Set();
  let isLocked = false;

  /* ---- Helpers ---- */
  function setText(el, key){ el.textContent = Studio.t(key); }

  function createDots(){
    dotsEl.innerHTML = '';
    items.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'dot' + (i===0 ? ' current' : '');
      dotsEl.appendChild(d);
    });
  }

  function updateDots(){
    const ds = dotsEl.children;
    for(let i=0;i<ds.length;i++){
      ds[i].className = 'dot' + (i < currentIdx ? ' done' : i === currentIdx ? ' current' : '');
    }
  }

  /* ---- SVG Builders ---- */

  function buildPizza(d){
    const size = 260;
    const cx = size/2, cy = size/2, r = 100;
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('width','280');
    svg.setAttribute('height','280');
    svg.setAttribute('viewBox','0 0 260 260');
    svg.style.overflow = 'visible';

    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('transform',`translate(0,0)`);

    for(let i=0;i<d;i++){
      const start = -90 + (360/d)*i;
      const end = start + (360/d);
      const rad1 = (Math.PI/180)*start;
      const rad2 = (Math.PI/180)*end;
      const x1 = cx + r*Math.cos(rad1);
      const y1 = cy + r*Math.sin(rad1);
      const x2 = cx + r*Math.cos(rad2);
      const y2 = cy + r*Math.sin(rad2);
      const large = (360/d) > 180 ? 1 : 0;

      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      const dStr = `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z`;
      path.setAttribute('d',dStr);
      path.setAttribute('class','slice pizza-crust');
      path.setAttribute('data-part', String(i));
      path.setAttribute('data-shaded','false');
      path.style.fill = 'var(--part-fill)';
      g.appendChild(path);
    }
    svg.appendChild(g);
    return svg;
  }

  function buildBar(d){
    const W = 260, H = 120;
    const gap = 6;
    const sw = (W - gap*(d-1)) / d;
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('width','280');
    svg.setAttribute('height','180');
    svg.setAttribute('viewBox',`0 0 ${W} ${H}`);

    for(let i=0;i<d;i++){
      const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
      rect.setAttribute('x', i*(sw+gap));
      rect.setAttribute('y', 0);
      rect.setAttribute('width', sw);
      rect.setAttribute('height', H);
      rect.setAttribute('class','bar-part');
      rect.setAttribute('data-part', String(i));
      rect.setAttribute('data-shaded','false');
      svg.appendChild(rect);
    }
    return svg;
  }

  /* ---- Feedback ---- */
  function showFeedback(correct){
    if(correct){
      feedbackEl.textContent = Studio.t('right');
      feedbackEl.className = 'feedback-msg right';
      checkBtn.style.background = '#34C759';
      checkBtn.style.boxShadow = '0 6px 20px rgba(52,199,89,0.35)';
    } else {
      feedbackEl.textContent = Studio.t('wrong');
      feedbackEl.className = 'feedback-msg wrong';
      checkBtn.style.background = '';
      checkBtn.style.boxShadow = '';
    }
  }

  function clearFeedback(){
    feedbackEl.textContent = '';
    feedbackEl.className = 'feedback-msg';
    checkBtn.style.background = '';
    checkBtn.style.boxShadow = '';
  }

  /* ---- Confetti burst ---- */
  function burstConfetti(x, y){
    const colors = ['#FF8B3D','#34C759','#34B7F1','#FF5E3A','#FFD8B8'];
    for(let i=0;i<20;i++){
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = x + 'px';
      c.style.top = y + 'px';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      const dx = (Math.random()-0.5)*160;
      const dy = Math.random()*120 + 40;
      c.style.setProperty('--tx', dx+'px');
      c.style.setProperty('--ty', dy+'px');
      c.animate([
        { transform: `translate(0,0) rotate(0deg)`, opacity:1 },
        { transform: `translate(${dx}px, ${dy}px) rotate(${Math.random()*720}deg)`, opacity:0 }
      ], { duration: 800 + Math.random()*600, easing: 'ease-out', fill: 'forwards' });
      app.appendChild(c);
      setTimeout(()=> c.remove(), 1500);
    }
  }

  /* ---- Interaction ---- */
  function togglePart(el){
    if(isLocked) return;
    const idx = el.getAttribute('data-part');
    const shaded = el.getAttribute('data-shaded') === 'true';
    if(shaded){
      el.setAttribute('data-shaded','false');
      el.classList.remove('sel');
      selected.delete(idx);
    } else {
      el.setAttribute('data-shaded','true');
      el.classList.add('sel');
      selected.add(idx);
    }
    clearFeedback();
    Studio.event('part_toggle',{index:idx, shaded:!shaded});
  }

  function attachPartListeners(root){
    const parts = root.querySelectorAll('[data-part]');
    parts.forEach(p => {
      p.addEventListener('click', function(e){
        e.stopPropagation();
        togglePart(this);
      });
    });
  }

  /* ---- Show Item ---- */
  function showItem(idx){
    if(idx >= items.length){ showDone(); return; }
    currentIdx = idx;
    selected = new Set();
    isLocked = false;
    clearFeedback();
    updateDots();

    const item = items[idx];
    itemTag.textContent = (idx+1) + ' / ' + items.length;

    // Update fraction display
    fdN.textContent = item.n;
    fdD.textContent = item.d;

    hintEl.textContent = Studio.t('hint');

    // Shape
    shapeArea.innerHTML = '';
    const isPizza = (picture === 'pizza-or-bar' && item.d <= 8) || picture === 'pizza';
    const svg = isPizza ? buildPizza(item.d) : buildBar(item.d);
    const container = document.createElement('div');
    container.className = 'shape-wrap';
    container.setAttribute('data-item', item.id);
    container.appendChild(svg);
    shapeArea.appendChild(container);

    attachPartListeners(svg);

    // Animate in
    container.style.opacity = '0';
    container.style.transform = 'scale(0.9)';
    requestAnimationFrame(()=>{
      container.style.transition = 'opacity 0.4s, transform 0.4s cubic-bezier(0.34,1.56,0.64,1)';
      container.style.opacity = '1';
      container.style.transform = 'scale(1)';
    });
  }

  /* ---- Check ---- */
  function doCheck(){
    if(isLocked) return;
    const item = items[currentIdx];
    const n = selected.size;
    Studio.answer({n:n, d:item.d});
  }

  checkBtn.addEventListener('click', doCheck);

  Studio.onVerdict(function(v){
    const correct = !!v.correct;
    showFeedback(correct);
    if(correct){
      isLocked = true;
      // small celebration
      const rect = checkBtn.getBoundingClientRect();
      burstConfetti(rect.left + rect.width/2, rect.top);
      setTimeout(()=>{
        showItem(currentIdx+1);
      }, 1200);
    } else {
      // gentle hint already shown by text update
    }
  });

  /* ---- Navigation ---- */
  goBtn.addEventListener('click', function(){
    Studio.ready();
    introEl.style.display = 'none';
    gameEl.classList.add('active');
    createDots();
    showItem(0);
  });

  function showDone(){
    gameEl.classList.remove('active');
    doneEl.style.display = 'flex';
    setText(document.getElementById('t-done'), 'done');
    const finishBtn = document.getElementById('btn-finish');
    setText(finishBtn, 'check'); // reusing 'check' as finish label
    finishBtn.addEventListener('click', function(){
      Studio.done();
    });
  }

})();
</script>
