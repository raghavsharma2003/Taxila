<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fdf6e3; font-family: system-ui, -apple-system, sans-serif; display: flex; justify-content: center; }
  #app { width: 360px; min-height: 640px; background: #fdf6e3; padding: 10px 10px 20px; position: relative; }
  h1 { text-align: center; font-size: 19px; color: #2e7d32; margin-bottom: 6px; font-weight: 700; }
  svg { display: block; width: 340px; height: 280px; margin: 0 auto; background: #e8f5e9; border-radius: 16px; }
  #caption { text-align: center; font-size: 12px; font-weight: 600; background: #fff3e0; border-radius: 20px; padding: 6px 8px; min-height: 32px; display: flex; align-items: center; justify-content: center; margin: 6px auto 4px; width: 100%; color: #bf360c; }
  .controls-row { display: flex; gap: 6px; justify-content: center; margin: 6px 0; }
  .step-btn { width: 40px; height: 44px; border-radius: 14px; border: 2px solid #4caf50; background: #c8e6c9; font-weight: 700; color: #1b5e20; font-size: 16px; cursor: pointer; transition: all 0.2s; }
  .step-btn.active { background: #4caf50; color: white; transform: scale(1.1); box-shadow: 0 3px 10px rgba(76,175,80,0.4); }
  .play-pause { margin: 0 auto 4px; display: block; width: 120px; height: 44px; border-radius: 24px; border: 2px solid #ff9800; background: #ffe0b2; font-weight: 700; color: #e65100; font-size: 14px; cursor: pointer; transition: all 0.2s; }
  .play-pause:active, .step-btn:active { transform: scale(0.92); }
  .question-box { background: #e3f2fd; border-radius: 16px; padding: 10px 8px; margin-top: 8px; }
  .question-box h2 { text-align: center; font-size: 14px; color: #0d47a1; margin-bottom: 6px; }
  .options { display: flex; gap: 6px; justify-content: center; }
  .option-btn { width: 68px; height: 44px; border-radius: 12px; border: 2px solid #1565c0; background: #bbdefb; font-weight: 700; color: #0d47a1; font-size: 13px; cursor: pointer; transition: all 0.2s; }
  .option-btn.correct { background: #4caf50; border-color: #2e7d32; color: white; }
  .option-btn.wrong { background: #ef5350; border-color: #c62828; color: white; }
  .feedback { text-align: center; font-size: 13px; font-weight: 600; margin-top: 6px; color: #1b5e20; min-height: 18px; }
</style>

<div id="app">
  <h1 data-label="title"></h1>
  <svg viewBox="0 0 340 280" xmlns="http://www.w3.org/2000/svg">
    <circle cx="170" cy="45" r="20" fill="#f4d03f" stroke="#f39c12" stroke-width="2" id="sunCircle"/>
    <text x="170" y="30" text-anchor="middle" font-size="11" font-weight="bold" fill="#b8860b" data-label="sun">सूरज</text>
    <g id="rays" opacity="0.5">
      <line x1="160" y1="65" x2="130" y2="110" stroke="#ffeb3b" stroke-width="3" class="ray"/>
      <line x1="170" y1="67" x2="170" y2="110" stroke="#ffeb3b" stroke-width="3" class="ray"/>
      <line x1="180" y1="65" x2="210" y2="110" stroke="#ffeb3b" stroke-width="3" class="ray"/>
    </g>
    <ellipse cx="170" cy="140" rx="65" ry="28" fill="#66bb6a" stroke="#2e7d32" stroke-width="2" data-entity="leaf" id="leafShape"/>
    <line x1="115" y1="140" x2="225" y2="140" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="170" y="160" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20" data-label="leaf">पत्ता</text>
    <text x="170" y="133" text-anchor="middle" font-size="9" fill="#c62828" data-label="glucose" id="glucoseLabel" opacity="0.4">★ ग्लूकोज़</text>
    <path d="M170 160 Q168 200 170 230" stroke="#6d4c41" stroke-width="8" fill="none"/>
    <path d="M170 230 Q160 240 145 255 M170 230 Q175 245 190 258 M170 230 Q165 250 170 265" stroke="#5d4037" stroke-width="5" fill="none" data-entity="roots" id="rootsShape"/>
    <text x="198" y="255" font-size="10" font-weight="bold" fill="#4e342e" data-label="roots">जड़ें</text>
    <path d="M120 230 Q170 225 220 230 L215 260 Q170 265 125 260 Z" fill="#8d6e63" stroke="#6d4c41" stroke-width="1.5"/>
  </svg>
  <div id="caption" data-caption></div>
  <button class="play-pause" data-action="play" id="playBtn"><span class="pp-icon">⏸</span></button>
  <div class="controls-row">
    <button class="step-btn active" data-action="step-1">1</button>
    <button class="step-btn" data-action="step-2">2</button>
    <button class="step-btn" data-action="step-3">3</button>
    <button class="step-btn" data-action="step-4">4</button>
    <button class="step-btn" data-action="step-5">5</button>
  </div>
  <div class="question-box">
    <h2 data-label="ask"></h2>
    <div class="options">
      <button class="option-btn" data-option="co2"><span data-label="co2"></span></button>
      <button class="option-btn" data-option="o2"><span data-label="o2"></span></button>
      <button class="option-btn" data-option="water"><span data-label="water"></span></button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
</div>

<script>
  (function() {
    const t = (k) => Studio.t(k);
    document.querySelectorAll('[data-label]').forEach(el => {
      const key = el.getAttribute('data-label');
      el.textContent = t(key);
    });

    let playing = true;
    let currentStep = 1;
    let particleTimer = null;

    const svg = document.querySelector('svg');
    const NS = 'http://www.w3.org/2000/svg';

    // Water particles
    for (let i = 0; i < 4; i++) {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', 168 + (i % 2 ? 4 : -4));
      c.setAttribute('cy', 250 - (i * 20));
      c.setAttribute('r', 3);
      c.setAttribute('fill', '#29b6f6');
      c.setAttribute('data-flow', 'water');
      c.setAttribute('class', 'water-particle');
      svg.appendChild(c);
    }

    // CO2 particles
    for (let i = 0; i < 4; i++) {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', 100 + (i * 8));
      c.setAttribute('cy', 95 + (i * 10));
      c.setAttribute('r', 3);
      c.setAttribute('fill', '#9e9e9e');
      c.setAttribute('data-flow', 'co2');
      c.setAttribute('class', 'co2-particle');
      svg.appendChild(c);
    }

    // O2 particles
    for (let i = 0; i < 4; i++) {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', 225 + (i * 6));
      c.setAttribute('cy', 135 + (i * 12));
      c.setAttribute('r', 3);
      c.setAttribute('fill', '#4fc3f7');
      c.setAttribute('data-flow', 'o2');
      c.setAttribute('class', 'o2-particle');
      svg.appendChild(c);
    }

    const waterParticles = document.querySelectorAll('.water-particle');
    const co2Particles = document.querySelectorAll('.co2-particle');
    const o2Particles = document.querySelectorAll('.o2-particle');

    function animateParticles() {
      if (!playing) return;

      // Water: move up through stem to leaf
      waterParticles.forEach((p) => {
        let cy = parseFloat(p.getAttribute('cy'));
        cy -= 2;
        if (cy < 140) cy = 260;
        p.setAttribute('cy', cy);
      });

      // CO2: move toward leaf
      co2Particles.forEach((p, idx) => {
        let cx = parseFloat(p.getAttribute('cx'));
        let cy = parseFloat(p.getAttribute('cy'));
        cx += (170 - cx) * 0.04;
        cy += (140 - cy) * 0.04;
        if (Math.abs(cx - 170) < 8 && Math.abs(cy - 140) < 8) {
          cx = 100 + (idx * 8);
          cy = 95 + (idx * 10);
        }
        p.setAttribute('cx', cx);
        p.setAttribute('cy', cy);
      });

      // O2: move away from leaf
      o2Particles.forEach((p, idx) => {
        let cx = parseFloat(p.getAttribute('cx'));
        let cy = parseFloat(p.getAttribute('cy'));
        cx += (260 - cx) * 0.03;
        cy += (80 + idx * 15 - cy) * 0.03;
        if (cx > 250) {
          cx = 225 + (idx * 6);
          cy = 135 + (idx * 12);
        }
        p.setAttribute('cx', cx);
        p.setAttribute('cy', cy);
      });
    }

    function startAnimation() {
      if (!particleTimer) {
        particleTimer = setInterval(animateParticles, 50);
      }
      document.querySelectorAll('.ray').forEach(r => {
        r.style.transition = 'opacity 0.8s';
        r.style.opacity = '0.7';
      });
    }

    function stopAnimation() {
      if (particleTimer) {
        clearInterval(particleTimer);
        particleTimer = null;
      }
      document.querySelectorAll('.ray').forEach(r => {
        r.style.opacity = '0.2';
      });
    }

    const captions = [t('step1'), t('step2'), t('step3'), t('step4'), t('step5')];
    const captionEl = document.querySelector('[data-caption]');
    captionEl.textContent = captions[0];

    function updateStepVisuals() {
      // Reset all particles to subtle opacity
      document.querySelectorAll('.water-particle, .co2-particle, .o2-particle').forEach(p => {
        p.style.opacity = '0.15';
      });
      // Show relevant flows per step
      if (currentStep === 1 || currentStep === 2) {
        document.querySelectorAll('.water-particle').forEach(p => p.style.opacity = '1');
      }
      if (currentStep === 3) {
        document.querySelectorAll('.co2-particle').forEach(p => p.style.opacity = '1');
        document.querySelectorAll('.water-particle').forEach(p => p.style.opacity = '0.3');
        document.querySelectorAll('.o2-particle').forEach(p => p.style.opacity = '0.3');
      }
      if (currentStep === 4) {
        document.querySelectorAll('.o2-particle').forEach(p => p.style.opacity = '1');
        document.querySelectorAll('.co2-particle').forEach(p => p.style.opacity = '0.3');
      }
      if (currentStep === 5) {
        document.querySelectorAll('.water-particle, .co2-particle').forEach(p => p.style.opacity = '0.3');
        const gl = document.getElementById('glucoseLabel');
        gl.style.transition = 'opacity 1s';
        gl.style.opacity = '1';
      } else {
        const gl = document.getElementById('glucoseLabel');
        gl.style.opacity = '0.4';
      }
    }

    const playBtn = document.querySelector('[data-action="play"]');
    const ppIcon = playBtn.querySelector('.pp-icon');

    playBtn.addEventListener('click', () => {
      playing = !playing;
      if (playing) {
        startAnimation();
        ppIcon.textContent = '⏸';
      } else {
        stopAnimation();
        ppIcon.textContent = '▶';
      }
      Studio.event('toggle_play', { playing });
    });

    document.querySelectorAll('.step-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const step = parseInt(btn.getAttribute('data-action').split('-')[1]);
        currentStep = step;
        document.querySelectorAll('.step-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        captionEl.textContent = captions[step - 1];
        updateStepVisuals();
        Studio.event('step_select', { step });
      });
    });

    const optionButtons = document.querySelectorAll('.option-btn');
    const feedbackEl = document.getElementById('feedback');

    optionButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const choice = btn.getAttribute('data-option');
        Studio.answer(choice);
        Studio.event('answer_submit', { choice });
      });
    });

    Studio.onVerdict(({ correct }) => {
      if (correct) {
        optionButtons.forEach(b => {
          b.classList.add('correct');
          b.style.pointerEvents = 'none';
        });
        feedbackEl.textContent = '✅ सही जवाब!';
        Studio.done();
      } else {
        optionButtons.forEach(b => b.classList.remove('wrong'));
        const chosen = document.querySelector('.option-btn:focus');
        // Highlight only wrong choice
        optionButtons.forEach(b => {
          if (b.matches(':focus') || b.style.opacity !== '') {
            b.classList.add('wrong');
            b.style.opacity = '0.5';
          }
        });
        feedbackEl.textContent = '❌ गलत, फिर कोशिश करो!';
        setTimeout(() => {
          optionButtons.forEach(b => {
            b.classList.remove('wrong');
            b.style.opacity = '1';
          });
          feedbackEl.textContent = '';
        }, 1200);
      }
    });

    // Initial setup
    startAnimation();
    updateStepVisuals();
    document.querySelector('[data-label="play"]').textContent = t('play');
    document.querySelector('[data-label="pause"]').textContent = t('pause');

    Studio.ready();
  })();
</script>
