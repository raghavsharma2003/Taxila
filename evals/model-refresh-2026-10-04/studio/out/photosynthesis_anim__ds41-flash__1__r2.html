<style>
  :root{
    --sky:#dff1ff;
    --sky2:#bfe3ff;
    --leaf:#3f9d4f;
    --leaf-dark:#2f7d3d;
    --leaf-lite:#7ecb85;
    --stem:#4a8a3c;
    --soil:#8a5a37;
    --soil-dark:#6d452a;
    --sun:#ffcf4d;
    --sun-deep:#f5a623;
    --water:#2f8fe0;
    --co2:#7a6ad6;
    --o2:#e0733f;
    --glucose:#f2b13c;
    --ink:#26423a;
    --card:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  .stage{
    width:360px;max-width:100%;margin:0 auto;
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 100%);
    border-radius:20px;
    padding:7px 7px 9px;
    display:flex;flex-direction:column;gap:6px;
    overflow:hidden;
  }
  .ttl{
    text-align:center;font-size:16px;font-weight:700;letter-spacing:.2px;
    color:#1c5c3a;padding:0 2px;
    text-shadow:0 1px 0 rgba(255,255,255,.8);
  }
  .scene-wrap{
    background:linear-gradient(180deg,#eaf7ff 0%,#d8efff 100%);
    border-radius:16px;
    padding:3px;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.7),0 2px 6px rgba(38,66,58,.12);
  }
  svg#scene{display:block;width:100%;height:auto;border-radius:12px;}
  .label{font-family:"Trebuchet MS",system-ui,sans-serif;font-weight:700;font-size:9.5px;}

  .flowtag{opacity:.9;transition:opacity .3s ease;}
  .flowtag.dim{opacity:.22;}

  .particle{transition:opacity .35s ease;}
  .paused .particle,
  .paused .rayflow,
  .paused .sun-core,
  .paused .glucose-glow,
  .paused .leafPulse{animation-play-state:paused !important;}

  .rays line{stroke:#ffd766;stroke-width:2.4;stroke-linecap:round;opacity:.85;}
  .rayflow{animation:rayPulse 3.2s ease-in-out infinite;}
  .rayflow:nth-child(2){animation-delay:.5s;}
  .rayflow:nth-child(3){animation-delay:1s;}
  .rayflow:nth-child(4){animation-delay:1.5s;}
  @keyframes rayPulse{0%,100%{opacity:.35;}50%{opacity:.95;}}

  .sun-core{animation:sunGlow 3.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box;}
  @keyframes sunGlow{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}

  .glucose-glow{
    animation:glowPulse 2.6s ease-in-out infinite;
    transform-origin:center;transform-box:fill-box;
  }
  @keyframes glowPulse{0%,100%{opacity:.55;transform:scale(.9);}50%{opacity:1;transform:scale(1.12);}}

  .leafPulse{animation:leafBreathe 4s ease-in-out infinite;transform-origin:60% 60%;transform-box:fill-box;}
  @keyframes leafBreathe{0%,100%{transform:scale(1);}50%{transform:scale(1.025);}}

  @keyframes waterUp{
    0%{transform:translate(0,0);opacity:0;}
    10%{opacity:1;}
    85%{opacity:1;}
    100%{transform:translate(2px,-100px);opacity:0;}
  }
  @keyframes co2In{
    0%{transform:translate(0,0);opacity:0;}
    12%{opacity:1;}
    86%{opacity:1;}
    100%{transform:translate(-40px,40px);opacity:0;}
  }
  @keyframes o2Out{
    0%{transform:translate(0,0);opacity:0;}
    12%{opacity:1;}
    86%{opacity:1;}
    100%{transform:translate(34px,-40px);opacity:0;}
  }
  .w-a{animation:waterUp 3.4s linear infinite;}
  .w-b{animation:waterUp 3.4s linear infinite;animation-delay:1.15s;}
  .w-c{animation:waterUp 3.4s linear infinite;animation-delay:2.3s;}

  .c-a{animation:co2In 3.2s linear infinite;}
  .c-b{animation:co2In 3.2s linear infinite;animation-delay:1.05s;}
  .c-c{animation:co2In 3.2s linear infinite;animation-delay:2.1s;}

  .o-a{animation:o2Out 3s linear infinite;}
  .o-b{animation:o2Out 3s linear infinite;animation-delay:1s;}
  .o-c{animation:o2Out 3s linear infinite;animation-delay:2s;}

  .controls{display:flex;flex-direction:column;gap:5px;}
  .row{display:flex;gap:5px;align-items:stretch;justify-content:center;}
  .btn{
    border:none;cursor:pointer;font-family:inherit;font-weight:700;
    min-height:44px;min-width:44px;
    border-radius:14px;
    background:var(--card);color:var(--ink);
    box-shadow:0 2px 0 rgba(38,66,58,.18),0 1px 3px rgba(38,66,58,.12);
    transition:transform .12s ease,box-shadow .12s ease,background .2s ease,color .2s ease;
    display:flex;align-items:center;justify-content:center;
    padding:0 10px;font-size:13px;
  }
  .btn:active{transform:scale(.93);box-shadow:0 1px 0 rgba(38,66,58,.18);}
  .btn.play{
    flex:1;background:linear-gradient(180deg,#57b866,#3f9d4f);color:#fff;
    font-size:14px;letter-spacing:.3px;
  }
  .btn.step{
    flex:1;font-size:15px;color:#2f7d3d;background:#f2fbf3;
    box-shadow:inset 0 0 0 2px #cfe9d3,0 2px 0 rgba(38,66,58,.10);
  }
  .btn.step[aria-current="true"]{
    background:linear-gradient(180deg,#57b866,#3f9d4f);color:#fff;
    box-shadow:0 2px 0 rgba(38,66,58,.22),0 0 0 3px #bfe6c6;
  }
  .caption{
    min-height:40px;
    background:rgba(255,255,255,.92);
    border-radius:14px;
    padding:7px 10px;
    font-size:12.5px;line-height:1.26;font-weight:600;
    color:#20503a;
    box-shadow:inset 0 0 0 2px rgba(126,203,133,.5);
    display:flex;align-items:center;
  }
  .caption.pulseAnim{animation:capIn .45s ease;}
  @keyframes capIn{0%{opacity:.25;transform:translateY(4px);}100%{opacity:1;transform:translateY(0);}}

  .quiz{
    background:rgba(255,255,255,.95);
    border-radius:16px;padding:7px 8px 9px;
    box-shadow:inset 0 0 0 2px rgba(122,106,214,.35);
    display:flex;flex-direction:column;gap:6px;
  }
  .ask{font-size:12.5px;font-weight:700;color:#3b3480;line-height:1.24;}
  .opts{display:flex;gap:5px;}
  .btn.opt{
    flex:1;font-size:13px;background:#f4f2ff;color:#3b3480;
    box-shadow:inset 0 0 0 2px #d6d0f5,0 2px 0 rgba(38,66,58,.10);
    transition:transform .12s ease,background .25s ease,box-shadow .25s ease,color .25s ease;
  }
  .btn.opt.right{background:linear-gradient(180deg,#57b866,#3f9d4f);color:#fff;box-shadow:0 2px 0 rgba(38,66,58,.22),0 0 0 3px #bfe6c6;}
  .btn.opt.wrong{animation:shake .4s ease;background:#ffe2e0;color:#a8382f;box-shadow:inset 0 0 0 2px #f3b3ad;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
  .fb{min-height:0;font-size:17px;font-weight:700;text-align:center;color:#a8382f;transition:opacity .25s ease;}
  .fb.good{color:#2f7d3d;}
  .fb:empty{display:none;}

  .sparkle{opacity:0;}
  .sparkle.on{animation:sparkleOn 1.1s ease forwards;}
  @keyframes sparkleOn{0%{opacity:0;transform:scale(.5);}40%{opacity:1;transform:scale(1.15);}100%{opacity:0;transform:scale(1.4);}}
</style>

<div class="stage" id="stage">
  <div class="ttl" data-label="title" id="titleEl"></div>

  <div class="scene-wrap">
    <svg id="scene" viewBox="0 0 336 254" role="img" aria-labelledby="titleEl">
      <defs>
        <radialGradient id="gSun" cx="50%" cy="45%" r="60%">
          <stop offset="0%" stop-color="#fff3c9"/>
          <stop offset="60%" stop-color="#ffcf4d"/>
          <stop offset="100%" stop-color="#f5a623"/>
        </radialGradient>
        <linearGradient id="gLeaf" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#7ecb85"/>
          <stop offset="100%" stop-color="#3f9d4f"/>
        </linearGradient>
        <linearGradient id="gSoil" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#a06a41"/>
          <stop offset="100%" stop-color="#6d452a"/>
        </linearGradient>
        <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#eaf7ff"/>
          <stop offset="100%" stop-color="#d3ecff"/>
        </linearGradient>
      </defs>

      <rect x="0" y="0" width="336" height="254" rx="12" fill="url(#gSky)"/>

      <g class="rays" id="rays">
        <line class="rayflow" x1="196" y1="30" x2="164" y2="80"/>
        <line class="rayflow" x1="214" y1="34" x2="178" y2="88"/>
        <line class="rayflow" x1="232" y1="38" x2="190" y2="94"/>
        <line class="rayflow" x1="178" y1="26" x2="150" y2="74"/>
      </g>

      <g id="sunGroup">
        <circle cx="252" cy="28" r="19" fill="url(#gSun)"/>
        <g class="sun-core">
          <circle cx="252" cy="28" r="12.5" fill="#ffd75e"/>
        </g>
      </g>
      <text class="label" data-label="sun" x="252" y="62" text-anchor="middle" fill="#8c5a08"></text>

      <rect x="0" y="192" width="336" height="62" fill="url(#gSoil)"/>
      <ellipse cx="106" cy="192" rx="68" ry="7" fill="#7a4d2c" opacity=".55"/>

      <g id="rootsGroup" data-entity="roots">
        <path d="M106 192 C98 204 88 210 80 220" stroke="#5b3a22" stroke-width="3.4" fill="none" stroke-linecap="round"/>
        <path d="M106 192 C114 204 124 210 132 220" stroke="#5b3a22" stroke-width="3.4" fill="none" stroke-linecap="round"/>
        <path d="M106 194 C106 208 106 216 106 226" stroke="#5b3a22" stroke-width="3.2" fill="none" stroke-linecap="round"/>
        <path d="M92 206 C86 212 84 218 84 224" stroke="#5b3a22" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M120 206 C126 212 128 218 128 224" stroke="#5b3a22" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </g>

      <path d="M106 192 C102 164 106 136 104 100" stroke="#4a8a3c" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M106 192 C102 164 106 136 104 100" stroke="#62a850" stroke-width="2.6" fill="none" stroke-linecap="round"/>

      <g class="leafPulse">
        <g id="leafGroup" data-entity="leaf">
          <path d="M104 98 C138 72 184 70 204 90 C186 120 142 124 104 102 Z" fill="url(#gLeaf)" stroke="#2f7d3d" stroke-width="2.6" stroke-linejoin="round"/>
          <path d="M108 100 C140 94 178 90 202 90" stroke="#d9f3dc" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".85"/>
          <path d="M124 100 C128 94 134 90 142 87" stroke="#d9f3dc" stroke-width="1.3" fill="none" stroke-linecap="round" opacity=".75"/>
          <path d="M154 96 C160 91 168 89 176 88" stroke="#d9f3dc" stroke-width="1.3" fill="none" stroke-linecap="round" opacity=".75"/>
        </g>
        <g id="glucoseGroup">
          <circle class="glucose-glow" cx="164" cy="95" r="12" fill="#f2b13c" opacity=".5"/>
          <circle cx="164" cy="95" r="6" fill="#ffd070" stroke="#e29a1d" stroke-width="1.6"/>
          <circle class="sparkle" id="spk1" cx="153" cy="89" r="2.6" fill="#fff2c4"/>
          <circle class="sparkle" id="spk2" cx="176" cy="98" r="2.6" fill="#fff2c4"/>
          <circle class="sparkle" id="spk3" cx="164" cy="106" r="2.6" fill="#fff2c4"/>
        </g>
      </g>

      <g id="particles">
        <circle class="particle w-a" data-flow="water" cx="98" cy="222" r="4.4" fill="#2f8fe0"/>
        <circle class="particle w-b" data-flow="water" cx="106" cy="226" r="4.4" fill="#2f8fe0"/>
        <circle class="particle w-c" data-flow="water" cx="114" cy="220" r="4.4" fill="#2f8fe0"/>

        <circle class="particle c-a" data-flow="co2" cx="302" cy="98" r="4.6" fill="#7a6ad6"/>
        <circle class="particle c-b" data-flow="co2" cx="312" cy="120" r="4.6" fill="#7a6ad6"/>
        <circle class="particle c-c" data-flow="co2" cx="296" cy="140" r="4.6" fill="#7a6ad6"/>

        <circle class="particle o-a" data-flow="o2" cx="140" cy="90" r="4.4" fill="#e0733f"/>
        <circle class="particle o-b" data-flow="o2" cx="178" cy="84" r="4.4" fill="#e0733f"/>
        <circle class="particle o-c" data-flow="o2" cx="196" cy="98" r="4.4" fill="#e0733f"/>
      </g>

      <text class="label flowtag" data-flow="water" data-label="water" x="6" y="250" fill="#1f6fb2"></text>
      <text class="label flowtag" data-flow="co2" data-label="co2" x="286" y="168" fill="#5b4bbd" text-anchor="middle"></text>
      <text class="label flowtag" data-flow="o2" data-label="o2" x="146" y="52" fill="#b9532a" text-anchor="middle"></text>
      <text class="label" data-label="glucose" x="164" y="150" text-anchor="middle" fill="#a9711a"></text>
      <text class="label" data-label="roots" x="106" y="188" text-anchor="middle" fill="#f0d9c4"></text>
      <text class="label" data-label="leaf" x="272" y="80" text-anchor="middle" fill="#2f7d3d"></text>
    </svg>
  </div>

  <div class="controls">
    <div class="row">
      <button class="btn play" data-action="play" id="playBtn" type="button"></button>
    </div>
    <div class="row" id="stepRow">
      <button class="btn step" data-action="step-1" type="button">1</button>
      <button class="btn step" data-action="step-2" type="button">2</button>
      <button class="btn step" data-action="step-3" type="button">3</button>
      <button class="btn step" data-action="step-4" type="button">4</button>
      <button class="btn step" data-action="step-5" type="button">5</button>
    </div>
    <div class="caption" data-caption id="captionEl"></div>
  </div>

  <div class="quiz">
    <div class="ask" data-label="ask" id="askEl"></div>
    <div class="opts">
      <button class="btn opt" data-option="co2" type="button" id="optCo2"></button>
      <button class="btn opt" data-option="o2" type="button" id="optO2"></button>
      <button class="btn opt" data-option="water" type="button" id="optWater"></button>
    </div>
    <div class="fb" id="fb" role="status" aria-live="polite"></div>
  </div>
</div>

<script>
(function(){
  var P = Studio.params || {};
  var STEP_COUNT = (typeof P.steps === "number" && P.steps > 0) ? P.steps : 5;

  function setText(el, key){
    if(!el) return;
    var v = Studio.t(key);
    el.textContent = (v === undefined || v === null) ? "" : String(v);
  }

  setText(document.getElementById('titleEl'), 'title');
  setText(document.getElementById('playBtn'), 'play');
  setText(document.getElementById('askEl'), 'ask');
  setText(document.getElementById('optCo2'), 'co2');
  setText(document.getElementById('optO2'), 'o2');
  setText(document.getElementById('optWater'), 'water');

  var labelKeys = ['sun','leaf','roots','water','co2','o2','glucose'];
  var labels = document.querySelectorAll('[data-label]');
  for(var i=0;i<labels.length;i++){
    var k = labels[i].getAttribute('data-label');
    if(k === 'ask' || k === 'title') continue;
    if(labelKeys.indexOf(k) >= 0) setText(labels[i], k);
  }

  var stage = document.getElementById('stage');
  var playBtn = document.getElementById('playBtn');
  var captionEl = document.getElementById('captionEl');
  var stepRow = document.getElementById('stepRow');
  var stepBtns = stepRow.querySelectorAll('button[data-action^="step-"]');

  var playing = true;
  var currentStep = 1;

  var stepFlows = {
    1: {water:true},
    2: {co2:true},
    3: {water:true, co2:true},
    4: {o2:true},
    5: {glucose:true}
  };

  function applyEmphasis(){
    var f = stepFlows[currentStep] || {};
    var tags = document.querySelectorAll('.flowtag');
    for(var i=0;i<tags.length;i++){
      var t = tags[i].getAttribute('data-flow');
      if(f[t]) tags[i].classList.remove('dim');
      else tags[i].classList.add('dim');
    }
    var parts = document.querySelectorAll('.particle');
    for(var j=0;j<parts.length;j++){
      var pf = parts[j].getAttribute('data-flow');
      parts[j].style.filter = f[pf] ? "drop-shadow(0 0 3px rgba(255,255,255,.9))" : "saturate(.55)";
    }
    var glu = document.getElementById('glucoseGroup');
    glu.style.filter = f.glucose ? "drop-shadow(0 0 5px rgba(242,177,60,.9))" : "saturate(.6)";
    if(f.glucose){
      var s1=document.getElementById('spk1'),s2=document.getElementById('spk2'),s3=document.getElementById('spk3');
      [s1,s2,s3].forEach(function(s,idx){
        s.classList.remove('on');
        void s.getBoundingClientRect();
        setTimeout(function(){ s.classList.add('on'); }, idx*140);
      });
    }
    Studio.event('step_emphasis', {step: currentStep});
  }

  function setCaption(){
    var key = 'step' + currentStep;
    var v = Studio.t(key);
    captionEl.textContent = (v === undefined || v === null) ? "" : String(v);
    captionEl.classList.remove('pulseAnim');
    void captionEl.getBoundingClientRect();
    captionEl.classList.add('pulseAnim');
  }

  function setStep(n){
    currentStep = Math.max(1, Math.min(STEP_COUNT, n));
    for(var i=0;i<stepBtns.length;i++){
      var num = parseInt(stepBtns[i].getAttribute('data-action').split('-')[1], 10);
      stepBtns[i].setAttribute('aria-current', num === currentStep ? 'true' : 'false');
    }
    setCaption();
    applyEmphasis();
    Studio.event('step_select', {step: currentStep});
  }

  function setPlaying(on){
    playing = !!on;
    stage.classList.toggle('paused', !playing);
    var anims = document.querySelectorAll('.particle,.rayflow,.sun-core,.glucose-glow,.leafPulse');
    for(var i=0;i<anims.length;i++){
      anims[i].style.animationPlayState = playing ? 'running' : 'paused';
    }
    setText(playBtn, playing ? 'pause' : 'play');
    Studio.event('play_toggle', {playing: playing});
  }

  playBtn.addEventListener('click', function(){
    setPlaying(!playing);
  });

  for(var s=0;s<stepBtns.length;s++){
    (function(btn){
      btn.addEventListener('click', function(){
        var n = parseInt(btn.getAttribute('data-action').split('-')[1], 10);
        setStep(n);
        if(!playing) setPlaying(true);
      });
    })(stepBtns[s]);
  }

  var fb = document.getElementById('fb');
  var optBtns = document.querySelectorAll('button[data-option]');
  var lastKey = null;

  Studio.onVerdict(function(res){
    var ok = !!(res && res.correct);
    if(ok){
      fb.className = 'fb good';
      fb.textContent = '\u2713';
      for(var i=0;i<optBtns.length;i++){
        var b = optBtns[i];
        if(b.getAttribute('data-option') === lastKey){
          b.classList.remove('wrong');
          b.classList.add('right');
        }
        b.disabled = true;
      }
      setTimeout(function(){ Studio.done(); }, 700);
    } else {
      fb.className = 'fb';
      fb.textContent = '\u21bb';
      for(var j=0;j<optBtns.length;j++){
        var bb = optBtns[j];
        if(bb.getAttribute('data-option') === lastKey){
          bb.classList.remove('wrong');
          void bb.getBoundingClientRect();
          bb.classList.add('wrong');
        }
      }
    }
  });

  for(var o=0;o<optBtns.length;o++){
    (function(btn){
      btn.addEventListener('click', function(){
        var key = btn.getAttribute('data-option');
        lastKey = key;
        fb.textContent = '';
        fb.className = 'fb';
        btn.classList.remove('wrong');
        Studio.answer(key);
      });
    })(optBtns[o]);
  }

  setStep(1);
  setPlaying(true);
  Studio.ready();
})();
</script>
