<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #FDF6EC; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 12px; }
  .wrap { width: 100%; max-width: 440px; background: #fff; border-radius: 24px; padding: 16px 12px 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); display: flex; flex-direction: column; align-items: center; }
  .title { font-size: 20px; font-weight: 700; color: #5A3E2B; text-align: center; margin-bottom: 8px; }
  .ask { font-size: 15px; color: #7A5C4A; background: #FBE8D9; padding: 8px 14px; border-radius: 20px; margin: 6px 0 10px; text-align: center; line-height: 1.4; }
  .chart-wrap { width: 100%; display: flex; justify-content: center; }
  .chart { display: flex; flex-direction: column; width: 100%; }
  .plot-row { display: flex; width: 100%; height: 200px; }
  .y-axis { width: 30px; position: relative; flex-shrink: 0; }
  .y-axis span { position: absolute; right: 4px; transform: translateY(50%); font-size: 10px; color: #8A7A6A; font-weight: 600; }
  .grid-area { flex: 1; position: relative; }
  .grid-line { position: absolute; left: 0; right: 0; border-top: 1px dashed #E4D5C5; }
  .bars-area { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end; justify-content: space-around; padding: 0 2px; }
  .bar-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; width: 13%; height: 100%; }
  .bar { width: 100%; max-width: 34px; border-radius: 8px 8px 3px 3px; background: #4E9F6A; transition: transform 0.15s; transform-origin: bottom; cursor: pointer; position: relative; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.08); }
  .bar:active { transform: scale(0.95); }
  .bar-label { font-size: 11px; font-weight: 600; color: #6B4E3D; margin-top: 6px; }
  .bar-val { position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); background: #5A3E2B; color: white; font-size: 11px; padding: 2px 7px; border-radius: 10px; white-space: nowrap; opacity: 0; transition: opacity 0.2s; pointer-events: none; font-weight: 700; }
  .bar-val.show { opacity: 1; }
  .axis-title { text-align: right; font-size: 11px; color: #7A5C4A; margin-bottom: 5px; font-weight: 600; letter-spacing: 0.3px; }
  .x-labels { display: flex; justify-content: space-around; padding: 0 4px; margin-top: 4px; }
  .feedback { margin-top: 12px; font-size: 15px; font-weight: 700; text-align: center; min-height: 22px; padding: 0 8px; }
  .fb-right { color: #2D7A4F; }
  .fb-wrong { color: #C44B3C; }
  .done { margin-top: 8px; font-size: 16px; font-weight: 800; color: #2D7A4F; background: #E2F4E5; padding: 6px 16px; border-radius: 20px; display: none; }
  .done.show { display: block; }
</style>

<div class="wrap">
  <div class="title" data-test="title"></div>
  <div class="ask" data-test="ask"></div>
  <div class="chart-wrap">
    <div class="chart">
      <div class="axis-title"></div>
      <div class="plot-row">
        <div class="y-axis"></div>
        <div class="grid-area">
          <div class="bars-area" id="barsArea"></div>
        </div>
      </div>
      <div class="x-labels"></div>
    </div>
  </div>
  <div class="feedback"></div>
  <div class="done"></div>
</div>

<script>
  (function() {
    const data = Studio.params.data;
    const keys = ['mango','banana','apple','guava','orange'];
    const labels = {};
    keys.forEach(k => labels[k] = Studio.t(k));
    const yTitle = Studio.t('yaxis');
    document.querySelector('.title').textContent = Studio.t('title');
    document.querySelector('.ask').textContent = Studio.t('ask');
    document.querySelector('.axis-title').textContent = yTitle;

    // y max & ticks
    const maxVal = Math.max(...data.map(d => d.value));
    const step = maxVal <= 5 ? 1 : maxVal <= 10 ? 2 : maxVal <= 20 ? 4 : 5;
    const yMax = Math.ceil((maxVal + step) / step) * step;
    const ticks = [];
    for (let v = 0; v <= yMax; v += step) ticks.push(v);

    // y-axis labels & gridlines
    const yAxisEl = document.querySelector('.y-axis');
    const gridArea = document.querySelector('.grid-area');
    ticks.forEach(t => {
      const yPos = (1 - t / yMax) * 100 + '%';
      const span = document.createElement('span');
      span.style.bottom = yPos;
      span.textContent = t;
      span.setAttribute('data-tick', t);
      yAxisEl.appendChild(span);
      const line = document.createElement('div');
      line.className = 'grid-line';
      line.style.bottom = yPos;
      gridArea.appendChild(line);
    });

    // bars
    const barsArea = document.getElementById('barsArea');
    const xLabels = document.querySelector('.x-labels');
    data.forEach((item, idx) => {
      const col = document.createElement('div');
      col.className = 'bar-col';
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.setAttribute('data-bar', item.key);
      bar.setAttribute('data-value', item.value);
      const hPct = (item.value / yMax) * 100;
      bar.style.height = '0%';
      bar.style.marginTop = 'auto';
      setTimeout(() => { bar.style.height = hPct + '%'; }, 50 + idx * 120);
      bar.style.transition = 'height 0.8s cubic-bezier(0.22,1,0.36,1)';

      const valTip = document.createElement('div');
      valTip.className = 'bar-val';
      valTip.textContent = item.value;
      bar.appendChild(valTip);

      // tap -> show value + answer
      bar.addEventListener('click', function() {
        valTip.classList.add('show');
        Studio.event('bar_tap', { key: item.key, value: item.value });
        Studio.answer(item.key);
      });

      col.appendChild(bar);
      const lbl = document.createElement('span');
      lbl.className = 'bar-label';
      lbl.textContent = labels[item.key];
      col.appendChild(lbl);
      barsArea.appendChild(col);

      const xl = document.createElement('span');
      xl.className = 'bar-label';
      xl.textContent = labels[item.key];
      xl.style.fontSize = '11px';
      xl.style.color = '#6B4E3D';
      xLabels.appendChild(xl);
    });

    // feedback
    const fbEl = document.querySelector('.feedback');
    const doneEl = document.querySelector('.done');
    Studio.onVerdict(function(v) {
      fbEl.className = 'feedback ' + (v.correct ? 'fb-right' : 'fb-wrong');
      fbEl.textContent = v.correct ? Studio.t('right') : Studio.t('wrong');
      if (v.correct) {
        doneEl.textContent = Studio.t('done');
        doneEl.classList.add('show');
        Studio.done();
      }
    });

    Studio.ready();
  })();
</script>
