<style>
  *{box-sizing:border-box}
  :root{
    --ink:#29334f;
    --cream:#fff9ee;
    --card:#ffffff;
    --berry:#ee6685;
    --berry-dark:#c94268;
    --gold:#ffc95c;
    --mint:#62c9a5;
    --soft:#f3e7d3;
    --line:#6f5b52;
  }
  body{
    margin:0;
    min-width:0;
    background:
      radial-gradient(circle at 15% 8%,#fff4bd 0 7%,transparent 7.5%),
      radial-gradient(circle at 88% 18%,#dff7eb 0 8%,transparent 8.5%),
      linear-gradient(180deg,#fffaf0,#ffeef2);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Noto Sans",sans-serif;
    overflow-x:hidden;
  }
  .app{
    width:100%;
    min-height:640px;
    padding:18px 14px 22px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .title{
    margin:2px 0 6px;
    font-size:clamp(25px,8vw,34px);
    line-height:1.1;
    text-align:center;
    color:var(--berry-dark);
  }
  .instr{
    max-width:320px;
    min-height:44px;
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:17px;
    line-height:1.35;
    font-weight:650;
  }
  .card{
    position:relative;
    width:min(100%,332px);
    margin-top:12px;
    padding:14px 12px 16px;
    border:2px solid #f1d8cf;
    border-radius:28px;
    background:rgba(255,255,255,.94);
    box-shadow:0 10px 0 #edcfd1,0 16px 30px rgba(89,55,64,.12);
    text-align:center;
    overflow:hidden;
  }
  .target{
    min-height:55px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    font-size:34px;
    line-height:1;
    font-weight:850;
    color:var(--ink);
  }
  .fraction{
    display:inline-grid;
    grid-template-rows:1fr 2px 1fr;
    min-width:44px;
    align-items:center;
    justify-items:center;
    line-height:.9;
  }
  .fraction-line{
    width:100%;
    height:2px;
    border-radius:2px;
    background:var(--ink);
  }
  .picture{
    display:block;
    width:min(100%,270px);
    height:auto;
    margin:5px auto 8px;
    overflow:visible;
    touch-action:manipulation;
  }
  .part{
    cursor:pointer;
    outline:none;
    transform-origin:150px 150px;
    transition:fill .22s ease,filter .22s ease,transform .14s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .part[data-shaded="false"]{fill:#ffe4a3}
  .part[data-shaded="true"]{
    fill:var(--berry);
    filter:drop-shadow(0 2px 1px rgba(139,45,75,.22));
  }
  .part:active{transform:scale(.97)}
  .part.popped{animation:pop .3s ease}
  .pizza-edge{fill:none;stroke:var(--line);stroke-width:5;pointer-events:none}
  .feedback{
    min-height:48px;
    margin:4px 4px 8px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:5px;
    font-size:17px;
    line-height:1.25;
    font-weight:750;
  }
  .feedback.good{color:#16866b}
  .feedback.try{color:#ad4865}
  .check{
    width:min(100%,250px);
    min-height:52px;
    border:0;
    border-radius:18px;
    background:linear-gradient(180deg,#ff7f98,var(--berry-dark));
    box-shadow:0 6px 0 #9e3454;
    color:white;
    font:800 19px/1 system-ui,-apple-system,"Noto Sans",sans-serif;
    cursor:pointer;
    touch-action:manipulation;
    transition:transform .12s ease,box-shadow .12s ease,opacity .2s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .check:active{
    transform:translateY(4px) scale(.98);
    box-shadow:0 2px 0 #9e3454;
  }
  .check:disabled{opacity:.58;cursor:default}
  .celebrate .card{animation:cardJoy .55s ease}
  .celebrate .part[data-shaded="true"]{animation:sparkle .55s ease}
  .confetti{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0;
  }
  .celebrate .confetti{animation:showConfetti .7s ease}
  .dot{
    position:absolute;
    width:12px;
    height:12px;
    border-radius:4px;
    background:var(--gold);
  }
  .dot:nth-child(1){left:10%;top:16%;transform:rotate(20deg)}
  .dot:nth-child(2){right:10%;top:23%;background:var(--mint);transform:rotate(55deg)}
  .dot:nth-child(3){left:17%;top:58%;background:#8ca8ff;transform:rotate(75deg)}
  .dot:nth-child(4){right:16%;top:62%;background:var(--berry);transform:rotate(35deg)}
  .done-card{
    min-height:390px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .done-shape{
    width:170px;
    height:170px;
    margin-bottom:22px;
    border-radius:50%;
    background:conic-gradient(var(--berry),var(--gold),var(--mint),#8ca8ff,var(--berry));
    box-shadow:inset 0 0 0 18px white,0 9px 0 #edcfd1;
    animation:gentle 2.4s ease-in-out infinite;
  }
  .done-text{
    margin:0;
    color:#16866b;
    font-size:30px;
    line-height:1.2;
    font-weight:850;
  }
  @keyframes pop{
    0%{transform:scale(1)}
    45%{transform:scale(.94)}
    75%{transform:scale(1.035)}
    100%{transform:scale(1)}
  }
  @keyframes cardJoy{
    0%,100%{transform:rotate(0)}
    30%{transform:rotate(-1.2deg) scale(1.015)}
    65%{transform:rotate(1.2deg) scale(1.015)}
  }
  @keyframes sparkle{
    50%{filter:brightness(1.16) drop-shadow(0 0 7px #ffc95c)}
  }
  @keyframes showConfetti{
    0%{opacity:0;transform:translateY(-12px)}
    30%{opacity:1}
    100%{opacity:0;transform:translateY(24px)}
  }
  @keyframes gentle{
    0%,100%{transform:translateY(0) rotate(-2deg)}
    50%{transform:translateY(-8px) rotate(2deg)}
  }
  @media (prefers-reduced-motion:reduce){
    *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
</style>

<main class="app" id="app">
  <h1 class="title" id="title"></h1>
  <p class="instr" id="instr"></p>

  <section class="card" id="itemCard" data-item="">
    <div class="confetti" aria-hidden="true">
      <i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i>
    </div>

    <div class="target" id="target">
      <span class="fraction">
        <span id="numerator"></span>
        <span class="fraction-line"></span>
        <span id="denominator"></span>
      </span>
    </div>

    <svg class="picture" id="picture" viewBox="0 0 300 300" role="group">
      <g id="parts"></g>
      <circle class="pizza-edge" cx="150" cy="150" r="124"></circle>
    </svg>

    <div class="feedback" id="feedback" aria-live="polite"></div>
    <button class="check" id="check" data-action="check" type="button"></button>
  </section>
</main>

<script>
(() => {
  const items = Studio.params.items;
  const app = document.getElementById("app");
  const card = document.getElementById("itemCard");
  const partsGroup = document.getElementById("parts");
  const numerator = document.getElementById("numerator");
  const denominator = document.getElementById("denominator");
  const feedback = document.getElementById("feedback");
  const check = document.getElementById("check");
  const edge = document.querySelector(".pizza-edge");
  let itemIndex = 0;
  let shaded = [];
  let waiting = false;
  let finished = false;

  document.getElementById("title").textContent = Studio.t("title");
  document.getElementById("instr").textContent = Studio.t("instr");
  check.textContent = Studio.t("check");

  const point = (angle, radius) => {
    const radians = (angle - 90) * Math.PI / 180;
    return {
      x: 150 + radius * Math.cos(radians),
      y: 150 + radius * Math.sin(radians)
    };
  };

  const slicePath = (start, end) => {
    const outerStart = point(start, 124);
    const outerEnd = point(end, 124);
    const large = end - start > 180 ? 1 : 0;
    return [
      "M", 150, 150,
      "L", outerStart.x, outerStart.y,
      "A", 124, 124, 0, large, 1, outerEnd.x, outerEnd.y,
      "Z"
    ].join(" ");
  };

  const togglePart = (part, index) => {
    if (waiting) return;
    shaded[index] = !shaded[index];
    part.setAttribute("data-shaded", String(shaded[index]));
    part.classList.remove("popped");
    void part.getBoundingClientRect();
    part.classList.add("popped");
    feedback.textContent = "";
    feedback.className = "feedback";
    Studio.event("part_toggle", {item: items[itemIndex].id, part: index, shaded: shaded[index]});
  };

  const renderItem = () => {
    const item = items[itemIndex];
    waiting = false;
    shaded = Array.from({length:item.d}, () => false);
    card.setAttribute("data-item", item.id);
    numerator.textContent = item.n;
    denominator.textContent = item.d;
    feedback.textContent = "";
    feedback.className = "feedback";
    check.disabled = false;
    app.classList.remove("celebrate");
    partsGroup.replaceChildren();

    const step = 360 / item.d;
    shaded.forEach((state, index) => {
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", slicePath(index * step, (index + 1) * step));
      path.setAttribute("class", "part");
      path.setAttribute("data-part", String(index));
      path.setAttribute("data-shaded", "false");
      path.setAttribute("stroke", "#6f5b52");
      path.setAttribute("stroke-width", "4");
      path.setAttribute("stroke-linejoin", "round");
      path.setAttribute("tabindex", "0");
      path.addEventListener("click", () => togglePart(path, index));
      path.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          togglePart(path, index);
        }
      });
      partsGroup.appendChild(path);
    });
    edge.parentNode.appendChild(edge);
    Studio.event("item_view", {item:item.id});
  };

  const showDone = () => {
    if (finished) return;
    finished = true;
    document.getElementById("instr").textContent = "";
    card.removeAttribute("data-item");
    card.className = "card done-card";
    card.replaceChildren();

    const shape = document.createElement("div");
    shape.className = "done-shape";
    shape.setAttribute("aria-hidden", "true");
    const text = document.createElement("p");
    text.className = "done-text";
    text.textContent = Studio.t("done");
    card.append(shape, text);
    Studio.done();
  };

  check.addEventListener("click", () => {
    if (waiting || finished) return;
    waiting = true;
    check.disabled = true;
    const item = items[itemIndex];
    const count = shaded.reduce((sum, value) => sum + (value ? 1 : 0), 0);
    Studio.event("check", {item:item.id, n:count, d:item.d});
    Studio.answer({n:count, d:item.d});
  });

  Studio.onVerdict(verdict => {
    if (finished) return;
    if (verdict.correct) {
      feedback.textContent = Studio.t("right");
      feedback.className = "feedback good";
      app.classList.add("celebrate");
      Studio.event("verdict", {item:items[itemIndex].id, correct:true});
      setTimeout(() => {
        itemIndex += 1;
        if (itemIndex < items.length) renderItem();
        else showDone();
      }, 850);
    } else {
      feedback.textContent = Studio.t("wrong") + " " + Studio.t("hint");
      feedback.className = "feedback try";
      waiting = false;
      check.disabled = false;
      Studio.event("verdict", {item:items[itemIndex].id, correct:false});
    }
  });

  renderItem();
  Studio.ready();
})();
</script>
