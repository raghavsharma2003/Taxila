<style>
*{box-sizing:border-box}
:root{color-scheme:light}
body{margin:0;background:#f4f8ed;color:#24473c;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif}
#app{width:min(100%,420px);min-height:100vh;margin:auto;padding:10px 12px 14px;display:flex;flex-direction:column;gap:7px}
h1{margin:0;text-align:center;font-size:20px;line-height:1.2;color:#285746}
.scene{width:100%;height:auto;display:block;border-radius:22px;background:#e7f5fa;box-shadow:0 3px 12px #275a5920}
svg text{font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;fill:#24473c;font-size:12px;font-weight:700}
.sun-core{fill:#ffd568;stroke:#efa93b;stroke-width:2}
.ray{stroke:#f5c04e;stroke-width:3;stroke-linecap:round;opacity:.78;animation:ray 2.4s ease-in-out infinite alternate}
.ground{fill:#b9865d}
.soil-line{stroke:#8a6149;stroke-width:3}
.stem{fill:none;stroke:#498956;stroke-width:11;stroke-linecap:round}
.leaf-shape{fill:#64b66c;stroke:#357a4c;stroke-width:3;transform-box:fill-box;transform-origin:center;transition:filter .25s,transform .25s}
.leaf-vein{fill:none;stroke:#e2f3ae;stroke-width:2}
.root-line{fill:none;stroke:#f1d4a0;stroke-width:4;stroke-linecap:round}
[data-flow="water"]{fill:#39a9e2;stroke:#fff;stroke-width:1.5}
[data-flow="co2"]{fill:#8973c9;stroke:#fff;stroke-width:1.5}
[data-flow="o2"]{fill:#f18464;stroke:#fff;stroke-width:1.5}
.glucose{fill:#ffd45c;stroke:#d89427;stroke-width:1.5;animation:glow 1.2s ease-in-out infinite alternate}
.scene.step-1 .ray{opacity:1;stroke-width:5}
.scene.step-2 [data-flow="water"],.scene.step-2 [data-flow="co2"]{filter:drop-shadow(0 0 4px #fff)}
.scene.step-3 [data-flow="o2"]{filter:drop-shadow(0 0 4px #fff)}
.scene.step-4 .leaf-shape,.scene.step-5 .glucose{filter:drop-shadow(0 0 8px #ffd45c);transform:scale(1.08)}
.controls{display:flex;align-items:center;gap:7px}
button{font:inherit;color:#285746;background:#fff;border:2px solid #c4d9c6;border-radius:14px;min-height:46px;cursor:pointer;touch-action:manipulation;transition:transform .14s,background .2s,border-color .2s}
button:active{transform:scale(.94)}
#play{flex:1;background:#dff1df;border-color:#a6cda9;font-weight:750}
#steps{display:flex;gap:5px}
.step-button{width:44px;padding:0;font-weight:800}
.step-button.selected{background:#f9dc8b;border-color:#e9bb4f}
#caption{min-height:42px;padding:7px 11px;border-radius:13px;background:#fff9e8;color:#68552b;font-size:14px;line-height:1.25;display:flex;align-items:center}
#ask{margin:0;text-align:center;font-size:15px;line-height:1.2}
#options{display:flex;gap:7px}
.option{flex:1;min-width:0;padding:5px 3px;font-size:14px;font-weight:750;overflow-wrap:anywhere}
.option.correct{background:#d9f2d9;border-color:#61ad6b}
.option.incorrect{background:#ffebe3;border-color:#e59a7c}
@keyframes ray{to{opacity:.42}}
@keyframes glow{to{filter:drop-shadow(0 0 7px #ffc83c);transform:scale(1.12)}}
@media(max-height:680px){#app{gap:5px;padding-top:6px}.scene{max-height:310px}.scene-wrap{display:flex;justify-content:center}}
</style>
<main id="app">
<h1 id="title"></h1>
<div class="scene-wrap">
<svg class="scene step-1" id="scene" viewBox="0 0 360 330" role="img" aria-label="">
<circle class="sun-core" cx="54" cy="48" r="23"/>
<path class="ray" d="M54 12V3M19 48H9M89 48h10M29 23l-7-7M79 23l7-7M29 73l-7 7"/>
<text data-label="sun" x="34" y="86"></text>
<path class="ray" d="M76 62L153 134M66 69L137 145M86 55L164 125"/>
<rect class="ground" x="0" y="252" width="360" height="78" rx="4"/>
<path class="soil-line" d="M0 253H360"/>
<path class="stem" d="M176 258C176 218 177 180 181 139"/>
<path class="root-line" data-entity="roots" d="M176 255C165 273 151 284 144 307M177 255C187 274 203 284 211 307M171 267L168 298M185 269L193 300"/>
<path class="leaf-shape" data-entity="leaf" d="M179 145C145 107 99 106 89 129C107 158 147 169 179 145Z"/>
<path class="leaf-vein" d="M101 128Q139 133 173 145M133 133l-13-16M145 137l2-15"/>
<path class="leaf-shape" d="M183 141C205 102 246 91 260 111C246 141 215 157 183 141Z"/>
<path class="leaf-vein" d="M254 113Q220 127 189 141M222 126l7-17M209 132l-2-15"/>
<text data-label="leaf" x="151" y="102"></text>
<text data-label="roots" x="147" y="322"></text>
<text data-label="water" x="130" y="222" text-anchor="middle"></text>
<text data-label="co2" x="281" y="85"></text>
<text data-label="o2" x="285" y="191"></text>
<text data-label="glucose" x="207" y="174"></text>
<circle data-flow="water" r="5" cx="166" cy="290"/>
<circle data-flow="water" r="5" cx="178" cy="274"/>
<circle data-flow="water" r="5" cx="174" cy="235"/>
<circle data-flow="co2" r="5" cx="306" cy="106"/>
<circle data-flow="co2" r="5" cx="282" cy="134"/>
<circle data-flow="co2" r="5" cx="318" cy="151"/>
<circle data-flow="o2" r="5" cx="208" cy="132"/>
<circle data-flow="o2" r="5" cx="246" cy="144"/>
<circle data-flow="o2" r="5" cx="274" cy="158"/>
<circle class="glucose" r="5" cx="172" cy="140"/>
<circle class="glucose" r="5" cx="181" cy="148"/>
<circle class="glucose" r="5" cx="190" cy="139"/>
</svg>
</div>
<div class="controls"><button id="play" data-action="play" type="button"></button><div id="steps"></div></div>
<div id="caption" data-caption></div>
<p id="ask"></p>
<div id="options">
<button class="option" data-option="co2" type="button"></button>
<button class="option" data-option="o2" type="button"></button>
<button class="option" data-option="water" type="button"></button>
</div>
</main>
<script>
(()=>{
const t=k=>Studio.t(k);
const params=Studio.params;
const steps=Number(params.steps);
document.getElementById("title").textContent=t("title");
document.getElementById("ask").textContent=t("ask");
document.querySelectorAll("[data-label]").forEach(e=>e.textContent=t(e.getAttribute("data-label")));
document.querySelectorAll("[data-option]").forEach(e=>e.textContent=t(e.getAttribute("data-option")));
const scene=document.getElementById("scene");
const caption=document.getElementById("caption");
const play=document.getElementById("play");
const stepBox=document.getElementById("steps");
let current=1,playing=true,phase=0;
const flowDefs={
water:[[166,290,174,236],[178,274,178,196],[174,235,178,150]],
co2:[[306,106,252,124],[282,134,220,140],[318,151,188,145]],
o2:[[208,132,265,115],[246,144,296,144],[274,158,328,165]]
};
const particles={};
Object.keys(flowDefs).forEach(k=>particles[k]=Array.from(document.querySelectorAll('[data-flow="'+k+'"]')));
function showStep(n){
current=n;
scene.className="scene step-"+n;
caption.textContent=t("step"+n);
stepBox.querySelectorAll("button").forEach(b=>b.classList.toggle("selected",Number(b.dataset.step)===n));
}
for(let n=1;n<=steps;n++){
const b=document.createElement("button");
b.type="button";b.className="step-button";b.dataset.action="step-"+n;b.dataset.step=String(n);b.textContent=String(n);
b.addEventListener("click",()=>{showStep(n);Studio.event("step",{step:n})});
stepBox.appendChild(b);
}
function setPlay(){
play.textContent=t(playing?"pause":"play");
}
play.addEventListener("click",()=>{playing=!playing;setPlay();Studio.event("play",{playing})});
setPlay();showStep(1);
function animate(){
if(playing){
phase+=.012;
Object.keys(particles).forEach(k=>particles[k].forEach((p,i)=>{
const [x1,y1,x2,y2]=flowDefs[k][i];
const f=(phase+i*.34)%1;
p.setAttribute("cx",x1+(x2-x1)*f);
p.setAttribute("cy",y1+(y2-y1)*f);
}));
}
requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
document.querySelectorAll(".option").forEach(b=>b.addEventListener("click",()=>{
document.querySelectorAll(".option").forEach(x=>x.classList.remove("correct","incorrect"));
Studio.event("answer",{option:b.dataset.option});
Studio.answer(b.dataset.option);
}));
Studio.onVerdict(({correct})=>{
const picked=document.activeElement;
if(picked&&picked.matches("[data-option]"))picked.classList.add(correct?"correct":"incorrect");
if(correct)Studio.done();
});
Studio.ready();
})();
</script>
