<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f6fbf2;color:#24483a;font-family:system-ui,sans-serif;overflow:hidden}
  #app{width:100%;max-width:360px;height:640px;margin:auto;padding:10px 12px 8px;display:flex;flex-direction:column;gap:7px;background:linear-gradient(180deg,#dff4ff 0%,#f8fff2 53%,#fff9e9 100%)}
  h1{margin:0;text-align:center;font-size:19px;line-height:24px;color:#276146;min-height:24px}
  .scene-wrap{height:292px;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#a9e1f6 0%,#d7f3db 72%,#d6a66d 73%);box-shadow:0 5px 14px #78a98a55;flex:none}
  svg{width:100%;height:100%;display:block}
  text{font-family:system-ui,sans-serif;font-weight:700;fill:#25503d;font-size:12px;paint-order:stroke;stroke:#effff0;stroke-width:3px;stroke-linejoin:round}
  .sun-label{fill:#7a5510}
  .soil{fill:#9b653e}
  .soil-dot{fill:#77472e;opacity:.38}
  .stem{fill:none;stroke:#378253;stroke-width:12;stroke-linecap:round}
  .branch{fill:none;stroke:#378253;stroke-width:6;stroke-linecap:round}
  .leaf-shape{fill:#55bd70;stroke:#28784b;stroke-width:3}
  .vein{fill:none;stroke:#d8f6b2;stroke-width:2;stroke-linecap:round}
  .root{fill:none;stroke:#7a4a31;stroke-width:5;stroke-linecap:round}
  .ray{stroke:#ffe66c;stroke-width:5;stroke-linecap:round;opacity:.82;animation:ray 1.8s ease-in-out infinite}
  .ray:nth-child(2){animation-delay:.35s}.ray:nth-child(3){animation-delay:.7s}
  @keyframes ray{50%{stroke-width:8;opacity:1}}
  .water{fill:#278ed5;stroke:#d8f9ff;stroke-width:2}
  .co2{fill:#7d76c8;stroke:#f1eaff;stroke-width:2}
  .o2{fill:#6bc9a0;stroke:#effff3;stroke-width:2}
  .glow{fill:#f8ce45;stroke:#fff4a8;stroke-width:3;filter:drop-shadow(0 0 5px #ffe96b);animation:glow 1.4s ease-in-out infinite}
  @keyframes glow{50%{opacity:.55;transform:scale(.78);transform-origin:210px 132px}}
  .flow-muted{opacity:.16}
  .flow-hot{opacity:1}
  .controls{display:flex;gap:6px;align-items:center;justify-content:center;min-height:46px}
  button{border:0;font:700 14px system-ui,sans-serif;color:#24533e;cursor:pointer;min-height:44px;touch-action:manipulation;transition:transform .16s,box-shadow .16s,background .16s}
  button:active{transform:scale(.91)}
  #play{padding:0 11px;border-radius:14px;background:#fff6ad;box-shadow:0 3px 0 #d8b94a;min-width:72px}
  .steps{display:flex;gap:5px}
  .step{width:44px;border-radius:50%;background:#e5f5e9;box-shadow:0 3px 0 #9fc9aa;font-size:16px}
  .step.active{background:#54b978;color:white;box-shadow:0 3px 0 #28734b;transform:translateY(-2px)}
  #caption{margin:0;min-height:38px;border-radius:13px;background:#ffffffcc;padding:8px 11px;text-align:center;font-size:13px;font-weight:700;color:#276146;display:flex;align-items:center;justify-content:center}
  .question{border-radius:17px;background:#fffdf6;box-shadow:0 3px 12px #70936b33;padding:8px 9px 9px;flex:1;min-height:0}
  #ask{font-size:13px;font-weight:750;text-align:center;line-height:17px;min-height:18px}
  .options{display:flex;justify-content:center;gap:7px;margin-top:6px}
  .option{flex:1;max-width:100px;border-radius:13px;background:#dff4ec;box-shadow:0 3px 0 #91c8b4;font-size:13px}
  .option:active{background:#bde9d3}
  #feedback{height:14px;text-align:center;font-size:13px;font-weight:900;line-height:14px;color:#28734b;margin-top:3px}
  #feedback.no{color:#b85a4c}
  .paused .moving{opacity:.3}
</style>

<div id="app">
  <h1 id="title"></h1>
  <div class="scene-wrap" id="scene">
    <svg viewBox="0 0 336 292" role="img">
      <path class="ray" d="M73 62 L173 118"></path>
      <path class="ray" d="M87 74 L180 127"></path>
      <path class="ray" d="M96 88 L188 135"></path>
      <circle cx="62" cy="48" r="27" fill="#ffd84e" stroke="#efa92e" stroke-width="3"></circle>
      <path d="M62 8v-8M28 20l-7-7M18 50H8M28 77l-7 7M96 20l7-7M106 50h10" stroke="#f5b72b" stroke-width="4" stroke-linecap="round"></path>
      <text class="sun-label" data-label="sun" x="41" y="52"></text>

      <path class="soil" d="M0 215 Q42 208 83 216 T165 213 T250 216 T336 211 V292H0Z"></path>
      <circle class="soil-dot" cx="32" cy="244" r="3"></circle><circle class="soil-dot" cx="83" cy="270" r="2"></circle><circle class="soil-dot" cx="287" cy="250" r="3"></circle><circle class="soil-dot" cx="236" cy="278" r="2"></circle>

      <path class="stem" d="M169 222 C170 193 172 165 179 135"></path>
      <path class="branch" d="M173 173 Q151 157 132 151"></path>
      <path class="branch" d="M175 154 Q197 143 218 133"></path>
      <g data-entity="leaf">
        <path class="leaf-shape" d="M178 139 C194 101 246 99 255 119 C245 151 207 162 178 139Z"></path>
        <path class="vein" d="M181 139 Q211 132 244 119M205 132l7 17M220 127l8 13"></path>
      </g>
      <path class="leaf-shape" d="M169 161 C143 129 108 126 98 145 C108 174 145 180 169 161Z"></path>
      <path class="vein" d="M164 160 Q137 151 105 145M136 151l-4 15"></path>
      <g data-entity="roots">
        <path class="root" d="M169 214 Q157 237 143 257M169 216 Q178 237 193 258M165 225 Q147 233 128 238M175 226 Q193 234 211 240"></path>
      </g>

      <g id="waterFlow" class="moving">
        <circle data-flow="water" class="water" r="5"></circle><circle data-flow="water" class="water" r="5"></circle><circle data-flow="water" class="water" r="5"></circle>
      </g>
      <g id="co2Flow" class="moving">
        <circle data-flow="co2" class="co2" r="5"></circle><circle data-flow="co2" class="co2" r="5"></circle><circle data-flow="co2" class="co2" r="5"></circle>
      </g>
      <g id="o2Flow" class="moving">
        <circle data-flow="o2" class="o2" r="5"></circle><circle data-flow="o2" class="o2" r="5"></circle><circle data-flow="o2" class="o2" r="5"></circle>
      </g>
      <circle id="glucoseGlow" class="glow" cx="215" cy="133" r="8"></circle>

      <text data-label="leaf" x="249" y="158"></text>
      <text data-label="roots" x="112" y="276"></text>
      <text data-label="water" x="113" y="200"></text>
      <text data-label="co2" x="286" y="112"></text>
      <text data-label="o2" x="284" y="181"></text>
      <text data-label="glucose" x="191" y="104"></text>
    </svg>
  </div>

  <div class="controls">
    <button id="play" data-action="play"></button>
    <div class="steps">
      <button class="step active" data-action="step-1"></button>
      <button class="step" data-action="step-2"></button>
      <button class="step" data-action="step-3"></button>
      <button class="step" data-action="step-4"></button>
      <button class="step" data-action="step-5"></button>
    </div>
  </div>
  <p id="caption" data-caption></p>

  <section class="question">
    <div id="ask"></div>
    <div class="options">
      <button class="option" data-option="co2"></button>
      <button class="option" data-option="o2"></button>
      <button class="option" data-option="water"></button>
    </div>
    <div id="feedback" aria-live="polite"></div>
  </section>
</div>

<script>
(function(){
  var p=Studio.params, playing=true, step=1, complete=false, tick=0;
  var scene=document.getElementById('scene');
  var flows={water:document.getElementById('waterFlow'),co2:document.getElementById('co2Flow'),o2:document.getElementById('o2Flow')};
  function words(){
    document.getElementById('title').textContent=Studio.t('title');
    document.getElementById('play').textContent=Studio.t('pause');
    document.getElementById('caption').textContent=Studio.t('step1');
    document.getElementById('ask').textContent=Studio.t('ask');
    document.querySelectorAll('[data-label]').forEach(function(el){el.textContent=Studio.t(el.getAttribute('data-label'));});
    document.querySelectorAll('.step').forEach(function(el,i){el.textContent=String(i+1);});
    document.querySelectorAll('[data-option]').forEach(function(el){el.textContent=Studio.t(el.getAttribute('data-option'));});
  }
  function focusStep(n){
    step=n;
    document.querySelectorAll('.step').forEach(function(b,i){b.classList.toggle('active',i+1===n);});
    document.getElementById('caption').textContent=Studio.t('step'+n);
    Object.keys(flows).forEach(function(k){flows[k].classList.toggle('flow-muted',false);flows[k].classList.toggle('flow-hot',false);});
    var key=n===2?'water':n===3?'co2':n===5?'o2':'';
    if(key){Object.keys(flows).forEach(function(k){flows[k].classList.toggle('flow-muted',k!==key);flows[k].classList.toggle('flow-hot',k===key);});}
    document.getElementById('glucoseGlow').style.opacity=n===4?'1':'.72';
    Studio.event('step',{step:n});
  }
  function move(){
    if(playing){
      tick+=0.009;
      Array.prototype.forEach.call(flows.water.children,function(c,i){var q=(tick+i/3)%1;c.setAttribute('transform','translate('+(165+q*13)+' '+(254-q*113)+')');});
      Array.prototype.forEach.call(flows.co2.children,function(c,i){var q=(tick*.75+i/3)%1;c.setAttribute('transform','translate('+(324-q*102)+' '+(112+q*23)+')');});
      Array.prototype.forEach.call(flows.o2.children,function(c,i){var q=(tick*.75+i/3)%1;c.setAttribute('transform','translate('+(228+q*96)+' '+(151+q*22)+')');});
    }
    requestAnimationFrame(move);
  }
  words();
  document.getElementById('play').addEventListener('click',function(){
    playing=!playing;
    scene.classList.toggle('paused',!playing);
    this.textContent=Studio.t(playing?'pause':'play');
    Studio.event('play',{playing:playing});
  });
  document.querySelectorAll('.step').forEach(function(b,i){b.addEventListener('click',function(){focusStep(i+1);});});
  document.querySelectorAll('[data-option]').forEach(function(b){
    b.addEventListener('click',function(){
      document.getElementById('feedback').textContent='';
      Studio.event('answer',{option:b.getAttribute('data-option')});
      Studio.answer(b.getAttribute('data-option'));
    });
  });
  Studio.onVerdict(function(v){
    var f=document.getElementById('feedback');
    f.textContent=v.correct?'✓':'↻';
    f.className=v.correct?'':'no';
    if(v.correct&&!complete){complete=true;Studio.done();}
  });
  move();
  Studio.ready();
}());
</script>
