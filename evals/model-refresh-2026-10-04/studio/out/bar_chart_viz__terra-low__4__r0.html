<style>
  :root{
    --ink:#24334a;
    --muted:#6b7a91;
    --paper:#fffdf7;
    --sky:#e9f5ff;
    --line:#c9dced;
    --bar:#ff8b63;
    --bar-dark:#e9644e;
    --leaf:#55ae7a;
    --gold:#ffd66b;
    --good:#2f9c69;
    --bad:#df625b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-width:320px;
    min-height:100vh;
    overflow-x:hidden;
    background:linear-gradient(160deg,#eaf7ff 0%,#fff9e9 100%);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  .page{
    width:min(100%,430px);
    min-height:100vh;
    margin:auto;
    padding:18px 14px 22px;
    display:flex;
    flex-direction:column;
    gap:13px;
  }
  .heading{
    display:flex;
    align-items:center;
    gap:11px;
    padding:4px 5px 0;
  }
  .fruit-mark{
    width:43px;
    height:43px;
    flex:none;
    filter:drop-shadow(0 4px 3px rgba(48,91,117,.12));
  }
  h1{
    margin:0;
    font-size:clamp(20px,6vw,27px);
    line-height:1.1;
    letter-spacing:-.4px;
  }
  .chart-card{
    background:var(--paper);
    border:2px solid rgba(255,255,255,.9);
    border-radius:24px;
    padding:10px 4px 3px;
    box-shadow:0 10px 28px rgba(69,112,141,.14);
    overflow:hidden;
  }
  #chart{
    display:block;
    width:100%;
    height:auto;
    overflow:visible;
  }
  .grid{
    stroke:var(--line);
    stroke-width:1;
    stroke-dasharray:3 4;
  }
  .axis{
    stroke:#7890a8;
    stroke-width:1.6;
    stroke-linecap:round;
  }
  .tick-label,.fruit-label,.axis-title{
    fill:var(--muted);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  .tick-label{
    font-size:11px;
    text-anchor:end;
    dominant-baseline:middle;
  }
  .fruit-label{
    font-size:11px;
    text-anchor:middle;
    font-weight:700;
  }
  .axis-title{
    font-size:11px;
    font-weight:700;
    text-anchor:middle;
  }
  .bar{
    fill:var(--bar);
    stroke:var(--bar-dark);
    stroke-width:1.3;
    transform-box:fill-box;
    transform-origin:center bottom;
    transition:filter .18s ease,fill .18s ease,stroke .18s ease;
    cursor:pointer;
    touch-action:manipulation;
  }
  .bar:focus{
    outline:none;
    stroke:#345174;
    stroke-width:3;
  }
  .bar.picked{
    fill:var(--gold);
    stroke:#c58d27;
    filter:drop-shadow(0 5px 4px rgba(170,105,35,.22));
  }
  .bar.correct{
    fill:var(--good);
    stroke:#18744b;
  }
  .value-bubble{
    pointer-events:none;
    opacity:0;
    transform:translateY(5px);
    transition:opacity .18s ease,transform .18s ease;
  }
  .value-bubble.show{
    opacity:1;
    transform:translateY(0);
  }
  .value-pill{
    fill:#24334a;
  }
  .value-text{
    fill:white;
    font-size:12px;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    text-anchor:middle;
    dominant-baseline:middle;
    font-weight:800;
  }
  .question-card{
    position:relative;
    background:#ffffffd9;
    border-radius:20px;
    padding:15px 17px;
    min-height:78px;
    box-shadow:0 7px 18px rgba(69,112,141,.11);
    border:1px solid rgba(255,255,255,.9);
  }
  .question-card:before{
    content:"";
    position:absolute;
    left:25px;
    top:-8px;
    width:16px;
    height:16px;
    background:#ffffffd9;
    transform:rotate(45deg);
    border-left:1px solid rgba(255,255,255,.9);
    border-top:1px solid rgba(255,255,255,.9);
  }
  #ask{
    position:relative;
    margin:0;
    font-weight:750;
    font-size:17px;
    line-height:1.3;
  }
  #feedback{
    position:relative;
    min-height:22px;
    margin-top:7px;
    color:var(--muted);
    font-size:15px;
    font-weight:750;
    transition:color .2s ease,transform .2s ease;
  }
  #feedback.good{color:var(--good);transform:scale(1.02);transform-origin:left center}
  #feedback.bad{color:var(--bad);animation:nudge .3s ease}
  #completion{
    position:relative;
    display:none;
    margin-top:4px;
    color:var(--good);
    font-size:15px;
    font-weight:800;
  }
  #completion.show{display:block;animation:rise .35s ease both}
  @keyframes nudge{
    0%,100%{transform:translateX(0)}
    30%{transform:translateX(-5px)}
    65%{transform:translateX(4px)}
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(7px)}
    to{opacity:1;transform:translateY(0)}
  }
  @media (max-height:680px){
    .page{padding-top:12px;gap:9px}
    .chart-card{padding-top:5px}
    .question-card{padding:12px 16px;min-height:68px}
  }
</style>

<main class="page">
  <header class="heading">
    <svg class="fruit-mark" viewBox="0 0 48 48" aria-hidden="true">
      <path d="M24 8c4-6 10-6 14-5-1 6-5 11-12 12" fill="#55ae7a"/>
      <path d="M23 12C12 12 7 20 8 30c1 10 8 14 16 14s15-5 16-14c1-10-5-18-17-18Z" fill="#ffb64d"/>
      <path d="M15 22c-2 4-1 10 1 13" fill="none" stroke="#ffe2a2" stroke-width="3" stroke-linecap="round"/>
      <circle cx="30" cy="28" r="2" fill="#fff3cf"/>
    </svg>
    <h1 id="title"></h1>
  </header>

  <section class="chart-card">
    <svg id="chart" viewBox="0 0 340 355" role="img">
      <g id="grid-layer"></g>
      <g id="axis-layer"></g>
      <g id="bar-layer"></g>
      <g id="label-layer"></g>
      <g id="bubble-layer"></g>
    </svg>
  </section>

  <section class="question-card" aria-live="polite">
    <p id="ask"></p>
    <div id="feedback"></div>
    <div id="completion"></div>
  </section>
</main>

<script>
(function(){
  var data=Studio.params.data;
  var title=document.getElementById("title");
  var ask=document.getElementById("ask");
  var feedback=document.getElementById("feedback");
  var completion=document.getElementById("completion");
  var grid=document.getElementById("grid-layer");
  var axes=document.getElementById("axis-layer");
  var bars=document.getElementById("bar-layer");
  var labels=document.getElementById("label-layer");
  var bubbles=document.getElementById("bubble-layer");
  var ns="http://www.w3.org/2000/svg";
  var left=48, right=326, top=44, base=280;
  var maxValue=0, i;
  var pending=false, finished=false, selected=null;

  title.textContent=Studio.t("title");
  ask.textContent=Studio.t("ask");

  for(i=0;i<data.length;i++){
    if(data[i].value>maxValue) maxValue=data[i].value;
  }
  var rough=maxValue/5;
  var power=Math.pow(10,Math.floor(Math.log(rough||1)/Math.LN10));
  var unit=rough/power;
  var nice=unit<=1?1:(unit<=2?2:(unit<=5?5:10));
  var step=nice*power;
  var ceiling=Math.ceil(maxValue/step)*step;
  if(!ceiling) ceiling=step;
  var scale=(base-top)/ceiling;

  function el(name,attrs,parent){
    var node=document.createElementNS(ns,name);
    for(var key in attrs) node.setAttribute(key,attrs[key]);
    (parent||grid).appendChild(node);
    return node;
  }
  function line(x1,y1,x2,y2,cls,parent){
    return el("line",{x1:x1,y1:y1,x2:x2,y2:y2,"class":cls},parent);
  }

  for(var tick=0;tick<=ceiling;tick+=step){
    var y=base-tick*scale;
    line(left,y,right,y,"grid",grid);
    var tickText=el("text",{x:left-8,y:y,"class":"tick-label","data-tick":tick},labels);
    tickText.textContent=tick;
  }
  line(left,top,left,base,"axis",axes);
  line(left,base,right,base,"axis",axes);
  var ytitle=el("text",{x:15,y:(top+base)/2,"class":"axis-title",transform:"rotate(-90 15 "+((top+base)/2)+")"},labels);
  ytitle.textContent=Studio.t("yaxis");

  var span=right-left;
  var slot=span/data.length;
  var barWidth=Math.min(42,slot*.62);
  var barNodes=[], bubbleNodes=[];

  data.forEach(function(item,index){
    var x=left+slot*index+(slot-barWidth)/2;
    var height=item.value*scale;
    var rect=el("rect",{
      x:x,y:base,width:barWidth,height:0,rx:10,ry:10,
      "class":"bar",tabindex:0,role:"button",
      "data-bar":item.key,"data-value":item.value
    },bars);
    var fruit=el("text",{x:x+barWidth/2,y:base+22,"class":"fruit-label"},labels);
    fruit.textContent=Studio.t(item.key);

    var bubble=el("g",{"class":"value-bubble"},bubbles);
    var bubbleY=Math.max(top+10,base-height-17);
    el("rect",{x:x+barWidth/2-16,y:bubbleY-11,width:32,height:22,rx:11,ry:11,"class":"value-pill"},bubble);
    var valueText=el("text",{x:x+barWidth/2,y:bubbleY,"class":"value-text"},bubble);
    valueText.textContent=item.value;

    function choose(){
      if(pending||finished) return;
      pending=true;
      selected=rect;
      barNodes.forEach(function(n){n.classList.remove("picked");});
      bubbleNodes.forEach(function(n){n.classList.remove("show");});
      rect.classList.add("picked");
      bubble.classList.add("show");
      feedback.textContent="";
      feedback.className="";
      Studio.event("bar_tap",{key:item.key,value:item.value});
      Studio.answer(item.key);
    }
    rect.addEventListener("click",choose);
    rect.addEventListener("keydown",function(ev){
      if(ev.key==="Enter"||ev.key===" "){
        ev.preventDefault();
        choose();
      }
    });
    barNodes.push(rect);
    bubbleNodes.push(bubble);
    requestAnimationFrame(function(){
      rect.setAttribute("y",base-height);
      rect.setAttribute("height",height);
    });
  });

  Studio.onVerdict(function(result){
    pending=false;
    if(result.correct){
      finished=true;
      if(selected) selected.classList.add("correct");
      feedback.textContent=Studio.t("right");
      feedback.className="good";
      completion.textContent=Studio.t("done");
      completion.className="show";
      Studio.done();
    }else{
      feedback.textContent=Studio.t("wrong");
      feedback.className="bad";
      if(selected) selected.classList.remove("picked");
      selected=null;
    }
  });

  Studio.ready();
})();
</script>
