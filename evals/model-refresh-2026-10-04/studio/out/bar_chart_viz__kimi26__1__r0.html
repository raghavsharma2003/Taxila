<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#FFF3E0;color:#3E2723;width:360px;height:640px;overflow:hidden;display:flex;justify-content:center;align-items:center}
#app{width:100%;height:100%;padding:16px;position:relative;display:flex;flex-direction:column}
.card{background:#FFFFFF;border-radius:20px;box-shadow:0 8px 24px rgba(93,64,35,0.12);padding:20px 16px 16px;flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden}
.title{font-size:20px;font-weight:700;text-align:center;margin-bottom:16px;color:#5D4037}
.chart-box{position:relative;flex:1;display:flex;flex-direction:row;min-height:0}
.yaxis-label{width:28px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#795548;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;padding:4px 0;flex-shrink:0}
.chart-area{position:relative;flex:1;height:280px;border-left:2px solid #5D4037;border-bottom:2px solid #5D4037;margin-bottom:36px}
.grid-layer{position:absolute;inset:0}
.gridline{position:absolute;left:0;right:0;border-top:1px dashed #D7CCC8}
.tick-label{position:absolute;left:-40px;width:36px;text-align:right;font-size:12px;color:#795548;transform:translateY(-50%)}
.bars-layer{position:absolute;inset:0;display:flex;justify-content:space-around;align-items:flex-end;padding:0 8px}
.bar-wrapper{position:relative;width:44px;height:100%}
.bar{position:absolute;bottom:0;left:0;width:100%;border-radius:10px 10px 0 0;cursor:pointer;transform-origin:bottom center;transition:height 0.9s cubic-bezier(0.34,1.56,0.64,1),filter 0.2s ease,box-shadow 0.2s ease;height:0}
.bar::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;height:44px;background:transparent}
.bar-value{position:absolute;bottom:100%;left:0;right:0;text-align:center;font-size:13px;font-weight:700;color:#3E2723;padding-bottom:4px;opacity:0;transform:translateY(4px);transition:all 0.25s ease;pointer-events:none}
.bar-value.show{opacity:1;transform:translateY(0)}
.bar-label{position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);font-size:13px;color:#5D4037;white-space:nowrap;font-weight:500;pointer-events:none}
.bar.tapped{filter:brightness(1.15);box-shadow:0 -4px 14px rgba(0,0,0,0.12);z-index:2}
.bar.correct{box-shadow:0 0 0 3px #43A047}
.bar.shake{animation:shake 0.45s ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.question{margin-top:16px;font-size:16px;font-weight:600;text-align:center;color:#4E342E;line-height:1.4;min-height:44px;display:flex;align-items:center;justify-content:center}
.feedback{margin-top:8px;font-size:15px;font-weight:600;text-align:center;min-height:28px;display:none}
.feedback.right{color:#2E7D32}
.feedback.wrong{color:#C62828}
.done-overlay{position:absolute;inset:0;background:rgba(255,253,245,0.96);border-radius:20px;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:30;animation:fadeIn 0.4s ease}
@keyframes fadeIn{from{opacity:0;transform:scale(0.92)}to{opacity:1;transform:scale(1)}}
.checkmark{width:64px;height:64px;margin-bottom:16px}
.done-text{font-size:22px;font-weight:700;color:#2E7D32;text-align:center}
</style>
<div id="app">
  <div class="card">
    <div id="title" class="title"></div>
    <div class="chart-box">
      <div id="yaxis-label" class="yaxis-label"></div>
      <div class="chart-area">
        <div class="grid-layer" id="grid-layer"></div>
        <div class="bars-layer" id="bars-layer"></div>
      </div>
    </div>
    <div id="question" class="question"></div>
    <div id="feedback" class="feedback"></div>
  </div>
  <div id="done-overlay" class="done-overlay">
    <svg class="checkmark" viewBox="0 0 52 52">
      <circle cx="26" cy="26" r="25" fill="none" stroke="#66BB6A" stroke-width="3"/>
      <path d="M14 27 l7 7 l16 -16" fill="none" stroke="#66BB6A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div id="done-text" class="done-text"></div>
  </div>
</div>
<script>
(function(){
var data=Studio.params.data;
var maxVal=Math.max.apply(Math,data.map(function(d){return d.value}));
var step=maxVal<=10?1:maxVal<=20?2:maxVal<=50?5:10;
var maxTick=Math.ceil(maxVal/step)*step;
var chartArea=document.getElementById('chart-area');
var gridLayer=document.getElementById('grid-layer');
var barsLayer=document.getElementById('bars-layer');
document.getElementById('title').textContent=Studio.t('title');
document.getElementById('yaxis-label').textContent=Studio.t('yaxis');
document.getElementById('question').textContent=Studio.t('ask');
for(var v=0;v<=maxTick;v+=step){
  var pct=(v/maxTick)*100;
  if(v>0){
    var line=document.createElement('div');
    line.className='gridline';
    line.style.bottom=pct+'%';
    gridLayer.appendChild(line);
  }
  var label=document.createElement('div');
  label.className='tick-label';
  label.textContent=v;
  label.setAttribute('data-tick',v);
  label.style.bottom=pct+'%';
  gridLayer.appendChild(label);
}
var colors={mango:'#FFB74D',banana:'#FFE082',apple:'#EF5350',guava:'#A5D6A7',orange:'#FFAB91'};
var selectedBar=null;
var finished=false;
var feedbackEl=document.getElementById('feedback');
var doneOverlay=document.getElementById('done-overlay');
var doneText=document.getElementById('done-text');
data.forEach(function(item){
  var wrapper=document.createElement('div');
  wrapper.className='bar-wrapper';
  var bar=document.createElement('div');
  bar.className='bar';
  bar.setAttribute('data-bar',item.key);
  bar.setAttribute('data-value',item.value);
  bar.style.backgroundColor=colors[item.key]||'#90A4AE';
  var hPct=(item.value/maxTick)*100;
  bar.style.height='0%';
  var valLabel=document.createElement('div');
  valLabel.className='bar-value';
  valLabel.textContent=item.value;
  var nameLabel=document.createElement('div');
  nameLabel.className='bar-label';
  nameLabel.textContent=Studio.t(item.key);
  bar.appendChild(valLabel);
  wrapper.appendChild(bar);
  wrapper.appendChild(nameLabel);
  barsLayer.appendChild(wrapper);
  bar.addEventListener('click',function(){
    if(finished)return;
    Studio.event('bar_tap',{key:item.key,value:item.value});
    if(selectedBar&&selectedBar!==bar){
      selectedBar.classList.remove('tapped','correct');
      selectedBar.querySelector('.bar-value').classList.remove('show');
    }
    selectedBar=bar;
    bar.classList.add('tapped');
    valLabel.classList.add('show');
    Studio.answer(item.key);
  });
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      bar.style.height=hPct+'%';
    });
  });
});
Studio.onVerdict(function(result){
  if(finished)return;
  if(result.correct){
    feedbackEl.textContent=Studio.t('right');
    feedbackEl.className='feedback right';
    feedbackEl.style.display='block';
    if(selectedBar)selectedBar.classList.add('correct');
    finished=true;
    setTimeout(function(){
      doneText.textContent=Studio.t('done');
      doneOverlay.style.display='flex';
      Studio.done();
    },900);
  }else{
    feedbackEl.textContent=Studio.t('wrong');
    feedbackEl.className='feedback wrong';
    feedbackEl.style.display='block';
    if(selectedBar)selectedBar.classList.add('shake');
    setTimeout(function(){
      feedbackEl.style.display='none';
      if(selectedBar){
        selectedBar.classList.remove('shake','tapped');
      }
    },1200);
  }
});
Studio.ready();
})();
</script>
