<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #e8f4f8; width: 100%; min-height: 640px; overflow-x: hidden; display: flex; justify-content: center; }
  #app { width: 360px; min-height: 640px; padding: 4px; position: relative; }
  svg { display: block; width: 100%; height: auto; }
  .controls { display: flex; flex-wrap: wrap; gap: 3px; padding: 3px 0; justify-content: center; align-items: center; }
  .ctrl-btn { background: #4b8bb5; border: none; border-radius: 22px; padding: 6px 10px; font-size: 11px; font-weight: 600; color: #fff; cursor: pointer; transition: transform 0.15s, background 0.2s; min-width: 44px; min-height: 44px; box-shadow: 0 2px 6px rgba(0,0,0,0.12); display: flex; align-items: center; justify-content: center; }
  .ctrl-btn:active { transform: scale(0.92); }
  .ctrl-btn.step { background: #6aa84f; min-width: 44px; padding: 6px 4px; font-size: 12px; }
  .ctrl-btn.step.active { background: #f1c40f; color: #1e3a5f; box-shadow: 0 0 0 2px #f39c12; }
  .caption { background: #fcf8e3; border-radius: 12px; padding: 5px 8px; margin: 3px 0; font-size: 11px; font-weight: 500; color: #1e3a5f; text-align: center; border: 1px solid #f0d58a; min-height: 28px; word-break: break-word; }
  .question-box { background: #fff; border-radius: 14px; padding: 6px 4px; margin: 3px 0; border: 2px solid #9b59b6; }
  .question-box .q { font-size: 12px; font-weight: 600; color: #2c3e50; margin-bottom: 4px; text-align: center; }
  .options { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
  .option-btn { background: #dfe6e9; border: 2px solid #b2bec3; border-radius: 18px; padding: 6px 12px; font-size: 12px; font-weight: 600; color: #2d3436; cursor: pointer; transition: 0.15s; min-width: 60px; min-height: 44px; }
  .option-btn:active { transform: scale(0.92); }
  .option-btn.selected { background: #74b9ff; border-color: #0984e3; color: #fff; }
  .feedback { font-size: 12px; text-align: center; padding: 4px; border-radius: 10px; margin-top: 3px; min-height: 24px; font-weight: 500; }
  .feedback.correct { background: #d4edda; color: #155724; }
  .feedback.wrong { background: #f8d7da; color: #721c24; }
  button:focus-visible { outline: 3px solid #f1c40f; }
  [data-entity] { transition: filter 0.2s; }
</style>
<div id="app">
  <svg viewBox="0 0 350 280" xmlns="http://www.w3.org/2000/svg" style="background: #b3d9ff; border-radius: 18px;">
    <!-- sun -->
    <circle cx="290" cy="40" r="26" fill="#f9e547" opacity="0.9"/>
    <line x1="264" y1="40" x2="238" y2="40" stroke="#f9e547" stroke-width="2" opacity="0.5"/>
    <line x1="316" y1="40" x2="342" y2="40" stroke="#f9e547" stroke-width="2" opacity="0.5"/>
    <line x1="290" y1="14" x2="290" y2="-2" stroke="#f9e547" stroke-width="2" opacity="0.5"/>
    <line x1="290" y1="66" x2="290" y2="82" stroke="#f9e547" stroke-width="2" opacity="0.5"/>
    <line x1="270" y1="20" x2="254" y2="6" stroke="#f9e547" stroke-width="2" opacity="0.5"/>
    <line x1="310" y1="20" x2="326" y2="6" stroke="#f9e547" stroke-width="2" opacity="0.5"/>
    <line x1="256" y1="54" x2="168" y2="100" stroke="#f9e547" stroke-width="1.5" opacity="0.3" class="sun-ray"/>
    <line x1="324" y1="54" x2="220" y2="100" stroke="#f9e547" stroke-width="1.5" opacity="0.3" class="sun-ray"/>
    <line x1="290" y1="66" x2="190" y2="104" stroke="#f9e547" stroke-width="1.5" opacity="0.3" class="sun-ray"/>
    <text x="290" y="46" text-anchor="middle" font-size="8" font-weight="bold" fill="#4a2c0a" data-label="sun">SUN</text>

    <!-- soil -->
    <rect x="50" y="230" width="250" height="50" rx="12" fill="#6d4c2a"/>
    <rect x="50" y="230" width="250" height="10" rx="5" fill="#8b5e3c"/>

    <!-- roots -->
    <g data-entity="roots">
      <path d="M150 220 Q140 240 130 260" stroke="#a0522d" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M160 218 Q168 245 180 260" stroke="#a0522d" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M145 222 Q130 230 110 245" stroke="#a0522d" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M165 218 Q180 230 195 240" stroke="#a0522d" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
    <text x="155" y="268" font-size="7" fill="#fff" text-anchor="middle" data-label="roots">ROOTS</text>

    <!-- stem -->
    <path d="M155 220 Q158 180 160 150 Q162 120 168 96" stroke="#2e7d32" stroke-width="8" fill="none" stroke-linecap="round"/>

    <!-- leaf -->
    <g data-entity="leaf">
      <ellipse cx="192" cy="86" rx="40" ry="22" fill="#43a047" transform="rotate(-10 192 86)" stroke="#2e7d32" stroke-width="1.5"/>
      <path d="M192 86 Q204 90 222 94" stroke="#2e7d32" stroke-width="1" fill="none"/>
    </g>
    <text x="192" y="72" text-anchor="middle" font-size="8" fill="#fff" font-weight="bold" data-label="leaf">LEAF</text>

    <!-- glucose -->
    <circle cx="188" cy="90" r="5" fill="#f1c40f" id="glucose-dot" opacity="0.3"/>
    <text x="168" y="96" font-size="6" fill="#f39c12" font-weight="bold" data-label="glucose">GLUCOSE</text>

    <!-- water label near roots left -->
    <text x="72" y="250" font-size="7" fill="#fff" text-anchor="middle" data-label="water">WATER</text>
    <!-- co2 label right top -->
    <text x="260" y="110" font-size="7" fill="#2c3e50" text-anchor="middle" data-label="co2">CO₂</text>
    <!-- o2 label left top -->
    <text x="50" y="110" font-size="7" fill="#2c3e50" text-anchor="middle" data-label="o2">O₂</text>
  </svg>

  <div class="controls">
    <button class="ctrl-btn" data-action="play" style="min-width:64px;">⏸ PAUSE</button>
    <button class="ctrl-btn step" data-action="step-1" style="min-width:44px;">1</button>
    <button class="ctrl-btn step" data-action="step-2" style="min-width:44px;">2</button>
    <button class="ctrl-btn step" data-action="step-3" style="min-width:44px;">3</button>
    <button class="ctrl-btn step" data-action="step-4" style="min-width:44px;">4</button>
    <button class="ctrl-btn step" data-action="step-5" style="min-width:44px;">5</button>
  </div>
  <div class="caption" data-caption="">Step 1</div>

  <div class="question-box">
    <div class="q" id="q-text"></div>
    <div class="options">
      <button class="option-btn" data-option="co2" style="min-height:44px;">CO₂</button>
      <button class="option-btn" data-option="o2" style="min-height:44px;">O₂</button>
      <button class="option-btn" data-option="water" style="min-height:44px;">WATER</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
</div>

<script>
(function() {
  const app = document.getElementById('app');
  const svg = app.querySelector('svg');
  const ns = 'http://www.w3.org/2000/svg';
  const captions = {1:'',2:'',3:'',4:'',5:''};

  let playing = true;
  let currentStep = 1;
  let animFrame = null;
  let lastTime = 0;

  let waterParticles = [];
  let co2Particles = [];
  let o2Particles = [];

  function makeParticles(count, type, color) {
    const arr = [];
    for (let i = 0; i < count; i++) {
      const c = document.createElementNS(ns, 'circle');
      c.setAttribute('r', '3.5');
      c.setAttribute('data-flow', type);
      c.setAttribute('fill', color);
      c.setAttribute('opacity', '0.8');
      c.setAttribute('cx', '-10');
      c.setAttribute('cy', '-10');
      svg.appendChild(c);
      arr.push({
        el: c,
        phase: Math.random() * Math.PI * 2,
        speed: 0.2 + Math.random() * 0.3,
        delay: Math.random() * 2
      });
    }
    return arr;
  }

  waterParticles = makeParticles(4, 'water', '#2196f3');
  co2Particles = makeParticles(4, 'co2', '#7f8c8d');
  o2Particles = makeParticles(4, 'o2', '#e74c3c');

  function setStep(n) {
    currentStep = n;
    const steps = app.querySelectorAll('[data-action^="step-"]');
    steps.forEach(b => b.classList.toggle('active', b.dataset.action === 'step-' + n));
    const cap = app.querySelector('[data-caption]');
    cap.textContent = Studio.t('step' + n) || 'Step ' + n;
    const sunRays = svg.querySelectorAll('.sun-ray');
    sunRays.forEach(r => r.setAttribute('opacity', (n === 1 || n === 4) ? '0.4' : '0.1'));
    const leaf = svg.querySelector('[data-entity="leaf"]');
    const roots = svg.querySelector('[data-entity="roots"]');
    leaf.style.filter = n >= 2 ? 'drop-shadow(0 0 4px #43a047)' : 'none';
    roots.style.filter = n === 2 ? 'drop-shadow(0 0 3px #8b5e3c)' : 'none';
  }

  function togglePlay() {
    playing = !playing;
    const btn = app.querySelector('[data-action="play"]');
    btn.textContent = playing ? '⏸ ' + (Studio.t('pause') || 'PAUSE') : '▶ ' + (Studio.t('play') || 'PLAY');
    if (playing) {
      lastTime = performance.now();
      animateParticles(lastTime);
    } else {
      if (animFrame) cancelAnimationFrame(animFrame);
    }
  }

  function animateParticles(now) {
    if (!playing) { animFrame = null; return; }
    if (!lastTime) lastTime = now;
    const dt = Math.min(now - lastTime, 40);
    lastTime = now;
    const elapsed = now / 1000;
    const step = currentStep;

    // water: from roots (155,220) up stem to leaf (192,86)
    if (step >= 2) {
      waterParticles.forEach(p => {
        const t = ((elapsed * 0.15 + p.phase + p.delay) % 4) / 4;
        let x = 155 + (192 - 155) * t + 3 * Math.sin(t * 8);
        let y = 220 - (220 - 86) * t;
        if (t > 0.9) { x = -10; y = -10; }
        p.el.setAttribute('cx', x);
        p.el.setAttribute('cy', y);
      });
    } else {
      waterParticles.forEach(p => { p.el.setAttribute('cx', -10); p.el.setAttribute('cy', -10); });
    }

    // co2: from right (310,100) to leaf (192,86)
    if (step >= 3) {
      co2Particles.forEach(p => {
        const t = ((elapsed * 0.12 + p.phase + p.delay) % 5) / 5;
        let x = 310 - (310 - 192) * t;
        let y = 100 + 15 * Math.sin(t * 5) - 10 * t;
        if (t > 0.9) { x = -10; y = -10; }
        p.el.setAttribute('cx', x);
        p.el.setAttribute('cy', y);
      });
    } else {
      co2Particles.forEach(p => { p.el.setAttribute('cx', -10); p.el.setAttribute('cy', -10); });
    }

    // o2: from leaf (192,86) to left (50,100)
    if (step >= 5) {
      o2Particles.forEach(p => {
        const t = ((elapsed * 0.12 + p.phase + p.delay) % 5) / 5;
        let x = 192 - (192 - 50) * t;
        let y = 86 + 15 * Math.sin(t * 5) - 5 * t;
        if (t > 0.9) { x = -10; y = -10; }
        p.el.setAttribute('cx', x);
        p.el.setAttribute('cy', y);
      });
    } else {
      o2Particles.forEach(p => { p.el.setAttribute('cx', -10); p.el.setAttribute('cy', -10); });
    }

    // glucose glow
    const gdot = svg.querySelector('#glucose-dot');
    if (step >= 4) {
      gdot.setAttribute('opacity', 0.4 + 0.6 * Math.sin(elapsed * 3));
      gdot.setAttribute('r', 5 + 2 * Math.sin(elapsed * 2));
    } else {
      gdot.setAttribute('opacity', 0.2);
      gdot.setAttribute('r', 5);
    }

    animFrame = requestAnimationFrame(animateParticles);
  }

  function init() {
    const labelKeys = ['sun','leaf','roots','water','co2','o2','glucose'];
    document.querySelectorAll('[data-label]').forEach(el => {
      const key = el.dataset.label;
      const txt = Studio.t(key);
      if (txt) el.textContent = txt;
    });

    const playBtn = app.querySelector('[data-action="play"]');
    playBtn.textContent = '⏸ ' + (Studio.t('pause') || 'PAUSE');

    const qText = document.getElementById('q-text');
    qText.textContent = Studio.t('ask') || 'Photosynthesis ke liye paudha kya andar leta hai?';

    const optBtns = app.querySelectorAll('.option-btn');
    optBtns.forEach(btn => {
      const txt = Studio.t(btn.dataset.option);
      if (txt) btn.textContent = txt;
    });

    for (let i = 1; i <= 5; i++) {
      captions[i] = Studio.t('step' + i) || 'Step ' + i;
    }

    playBtn.addEventListener('click', togglePlay);

    app.querySelectorAll('[data-action^="step-"]').forEach(btn => {
      btn.addEventListener('click', function() {
        const n = parseInt(this.dataset.action.split('-')[1]);
        setStep(n);
        if (!playing) togglePlay();
      });
    });

    let answered = false;
    optBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        if (answered) return;
        const val = this.dataset.option;
        optBtns.forEach(b => b.classList.remove('selected'));
        this.classList.add('selected');
        Studio.answer(val);
      });
    });

    Studio.onVerdict(function(result) {
      const fb = document.getElementById('feedback');
      if (result.correct) {
        fb.textContent = '✅ ' + 'Sahi! Shabash!';
        fb.className = 'feedback correct';
        optBtns.forEach(b => b.disabled = true);
        answered = true;
        Studio.done();
      } else {
        fb.textContent = '❌ ' + 'Galat, phir se koshish karo';
        fb.className = 'feedback wrong';
        optBtns.forEach(b => b.classList.remove('selected'));
      }
    });

    setStep(1);
    lastTime = performance.now();
    animateParticles(lastTime);
    Studio.ready();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
