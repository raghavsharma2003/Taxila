<style>
*{box-sizing:border-box}body{margin:0;background:#eef5e9;color:#243e35;font-family:system-ui,sans-serif}.activity{max-width:440px;margin:auto;padding:12px 14px;display:flex;flex-direction:column;gap:9px}h1{font-size:19px;margin:0;text-align:center;font-weight:750;line-height:1.25}.scene{width:100%;height:300px;background:linear-gradient(#e5f5ff,#f5fae7);border-radius:24px;display:block;border:1px solid #d5e6d7}.scene text{font-size:13px;font-weight:650;fill:#29473c}.scene .soiltext{fill:#fff5dc}.ray{stroke:#f5c954;stroke-width:5;stroke-linecap:round;opacity:.6}.process{transition:opacity .4s,filter .4s}.process.focus{filter:drop-shadow(0 0 5px #ffd25e)}.steps{display:flex;gap:7px;justify-content:center}button{font:inherit;border:0;cursor:pointer;min-height:44px;min-width:44px;border-radius:14px;transition:transform .15s,background .2s;touch-action:manipulation}button:active{transform:scale(.93)}button:focus-visible{outline:3px solid #eba73d;outline-offset:2px}.step{background:#e0eadc;color:#35513c;flex:1;font-weight:750}.step[aria-pressed=true]{background:#346b50;color:white;box-shadow:0 3px 0 #224d38}.controlrow{display:flex;align-items:center;gap:10px}.play{background:#fff1cb;color:#684d1e;padding:0 16px;flex-shrink:0}.caption{margin:0;font-size:13px;line-height:1.35;min-height:44px;display:flex;align-items:center}.check{background:#fff;border-radius:19px;padding:11px 12px;box-shadow:0 4px 16px #24452d0b}.ask{margin:0 0 8px;font-size:14px;font-weight:650;line-height:1.3}.options{display:flex;gap:7px}.option{flex:1;background:#eaf3f7;color:#244f63;font-size:13px;padding:6px;overflow-wrap:anywhere}.feedback{height:22px;text-align:center;font-size:20px;line-height:22px;color:#347153}.option.selected{box-shadow:inset 0 0 0 2px #6a9eb1}.completed{background:#dceedd}.glow{fill:#ffdc69;stroke:#eab846;stroke-width:1.5}.paused .ray{opacity:.3}@media(max-height:590px){.activity{gap:6px;padding:8px 12px}.scene{height:260px}h1{font-size:17px}.caption{font-size:12px}}
</style>

</main>
<script>
(()=>{
const count=Studio.params.steps;
const flowKeys=Object.keys(Studio.params.flows);
const scene=document.querySelector('.scene'),caption=document.querySelector('[data-caption]'),play=document.querySelector('[data-action="play"]'),feedback=document.querySelector('.feedback');
document.querySelectorAll('[data-word]').forEach(el=>el.textContent=Studio.t(el.dataset.word));
document.querySelectorAll('[data-label]').forEach(el=>el.textContent=Studio.t(el.dataset.label));
let playing=true,step=1,finished=false,time=0,last=null;
const stages=['light',...flowKeys.map(k=>k==='glucose'?'sugar':k+'Flow')];
function select(n){
step=n;caption.textContent=Studio.t('step'+n);
document.querySelectorAll('.step').forEach((b,i)=>b.setAttribute('aria-pressed',String(i+1===n)));
stages.forEach((id,i)=>{const el=document.getElementById(id);if(el){el.classList.toggle('focus',i===n-1);el.style.opacity=i===n-1?'1':'.65';}});
}
for(let n=1;n<=count;n++){
const b=document.createElement('button');b.className='step';b.dataset.action='step-'+n;b.textContent=String(n);b.onclick=()=>{select(n);Studio.event('step',{step:n});};document.querySelector('.steps').append(b);
}
function updatePlay(){play.textContent=Studio.t(playing?'pause':'play');play.setAttribute('aria-pressed',String(playing));scene.classList.toggle('paused',!playing);}
play.onclick=()=>{playing=!playing;updatePlay();Studio.event('play',{playing});};
document.querySelectorAll('[data-option]').forEach(b=>{
b.textContent=Studio.t(b.dataset.option);
b.onclick=()=>{if(finished)return;feedback.textContent='';document.querySelectorAll('.option').forEach(o=>o.classList.toggle('selected',o===b));Studio.answer(b.dataset.option);};
});
Studio.onVerdict(({correct})=>{
if(finished)return;
feedback.textContent=correct?'✓':'↻';
if(correct){finished=true;document.querySelector('.check').classList.add('completed');document.querySelectorAll('.option').forEach(b=>b.disabled=true);Studio.done();}
});
const particles={};
flowKeys.forEach(k=>particles[k]=Array.from(document.querySelectorAll('[data-flow="'+k+'"]')));
function frame(now){
if(last!==null&&playing)time+=Math.min(now-last,70);last=now;
flowKeys.forEach(k=>(particles[k]||[]).forEach((p,i,all)=>{
const t=(time/3200+i/all.length)%1;
let x,y;
if(k==='water'){y=276-132*t;x=t<.82?154:154+(t-.82)*170;}
else if(k==='co2'){x=28+158*t;y=109+37*t;}
else if(k==='o2'){x=220+88*t;y=148+51*t;}
else return;
p.setAttribute('cx',x);p.setAttribute('cy',y);p.style.opacity=String(.35+.65*Math.sin(Math.PI*t));
}));
document.getElementById('sugar').setAttribute('transform','translate(0 '+Math.sin(time/650)*1.2+')');
document.querySelectorAll('.glow').forEach(p=>p.style.opacity=String(.65+.35*Math.sin(time/600)));
requestAnimationFrame(frame);
}
select(step);updatePlay();Studio.ready();requestAnimationFrame(frame);
})();
</script>
