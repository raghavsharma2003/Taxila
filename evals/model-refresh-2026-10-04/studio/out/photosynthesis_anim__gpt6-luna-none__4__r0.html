<style>
*{box-sizing:border-box}
:root{color-scheme:light}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f0f7ee;color:#214638}
main{width:min(100%,420px);min-height:100vh;margin:0 auto;padding:10px 12px 14px;display:flex;flex-direction:column;gap:8px}
h1{font-size:20px;line-height:1.15;text-align:center;margin:0;color:#22533e}
.scene{width:100%;height:auto;max-height:390px;display:block;background:linear-gradient(#e5f5ff 0 69%,#eddfbd 69% 100%);border:2px solid #c5e2cf;border-radius:20px}
.controls{display:flex;align-items:center;justify-content:center;gap:7px}
button{font:inherit;color:#214638;background:#fff;border:2px solid #b7d8c1;border-radius:14px;min-width:46px;height:46px;padding:0 10px;cursor:pointer;transition:transform .15s,background .2s,border-color .2s,box-shadow .2s}
button:active{transform:scale(.94)}
button:focus-visible{outline:3px solid #e6a83c;outline-offset:2px}
.play{min-width:94px;font-weight:700}
.steps{display:flex;gap:6px;justify-content:center}
.steps button{width:46px;padding:0;font-weight:750}
button.selected{background:#d9f1dd;border-color:#4c9b65;box-shadow:0 0 0 2px #d9f1dd}
.caption{min-height:44px;padding:8px 12px;border-radius:14px;background:#fff;border:1px solid #d1e5d5;text-align:center;font-size:14px;line-height:1.25;display:flex;align-items:center;justify-content:center}
.question{padding:8px 10px 10px;background:#fff;border:1px solid #d1e5d5;border-radius:16px;text-align:center}
.question-title{font-size:14px;font-weight:700;line-height:1.2;margin:0 0 7px}
.options{display:flex;justify-content:center;gap:7px}
.options button{flex:1;max-width:100px;font-size:13px;font-weight:700}
.status{min-height:18px;font-size:13px;font-weight:700;color:#33764a;margin-top:5px}
svg text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.label{font-size:12px;font-weight:750;fill:#28513d;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.particle{filter:drop-shadow(0 1px 2px #426d5a66)}
.ray{stroke:#f4c45d;stroke-width:3;stroke-linecap:round;opacity:.64}
.leaf-shape{transition:filter .4s,stroke-width .4s}
.scene[data-step="1"] .ray{opacity:1;stroke-width:5}
.scene[data-step="2"] [data-flow="water"]{filter:drop-shadow(0 0 5px #35aee8)}
.scene[data-step="3"] [data-flow="co2"]{filter:drop-shadow(0 0 5px #8784d8)}
.scene[data-step="4"] [data-flow="o2"]{filter:drop-shadow(0 0 5px #47bd8c)}
.scene[data-step="5"] .leaf-shape{filter:drop-shadow(0 0 9px #f4d35e);stroke-width:4}
.scene[data-step="5"] .glucose-glow{animation:glow 1.1s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.45}to{opacity:1}}
@media(max-height:700px){main{gap:6px;padding-top:7px}.scene{max-height:350px}.caption{min-height:40px}.question{padding:6px 8px}}
</style>

<h1 id="title"></h1>
<svg class="scene" id="scene" viewBox="0 0 360 330" role="img" aria-label="">

</g>
<!-- carbon dioxide moves from air into leaf -->
<g fill="#8784d8">
<circle class="particle" data-flow="co2" r="5"><animate attributeName="cx" values="78;112;145;177;203" dur="2.5s" repeatCount="indefinite"/><animate attributeName="cy" values="130;133;138;137;128" dur="2.5s" repeatCount="indefinite"/></circle>
<circle class="particle" data-flow="co2" r="4"><animate attributeName="cx" values="92;120;153;180;213" dur="2.9s" begin="-1s" repeatCount="indefinite"/><animate attributeName="cy" values="161;155;145;139;126" dur="2.9s" begin="-1s" repeatCount="indefinite"/></circle>
<circle class="particle" data-flow="co2" r="4.5"><animate attributeName="cx" values="67;109;142;174;222" dur="3.1s" begin="-2s" repeatCount="indefinite"/><animate attributeName="cy" values="113;124;132;135;117" dur="3.1s" begin="-2s" repeatCount="indefinite"/></circle>
</g>
<!-- oxygen moves out from leaf to air -->
<g fill="#47bd8c">
<circle class="particle" data-flow="o2" r="5"><animate attributeName="cx" values="223;253;282;313;341" dur="2.6s" repeatCount="indefinite"/><animate attributeName="cy" values="117;126;138;147;157" dur="2.6s" repeatCount="indefinite"/></circle>
<circle class="particle" data-flow="o2" r="4"><animate attributeName="cx" values="222;251;278;310;340" dur="3s" begin="-1s" repeatCount="indefinite"/><animate attributeName="cy" values="130;118;120;133;141" dur="3s" begin="-1s" repeatCount="indefinite"/></circle>
<circle class="particle" data-flow="o2" r="4.5"><animate attributeName="cx" values="222;250;281;313;343" dur="2.8s" begin="-2s" repeatCount="indefinite"/><animate attributeName="cy" values="140;149;158;163;170" dur="2.8s" begin="-2s" repeatCount="indefinite"/></circle>
</g>
</svg>
<div class="controls">
<button class="play" id="play" data-action="play" type="button"></button>
<div class="steps" id="steps"></div>
</div>
<div class="caption" data-caption aria-live="polite"></div>
<section class="question">
<p class="question-title" id="ask"></p>
<div class="options">
<button type="button" data-option="co2"></button>
<button type="button" data-option="o2"></button>
<button type="button" data-option="water"></button>
</div>
<div class="status" id="status" aria-live="polite"></div>
</section>
</main>
<script>
(()=>{
const words={};
["title","sun","leaf","roots","water","co2","o2","glucose","play","pause","step1","step2","step3","step4","step5","ask"].forEach(k=>words[k]=Studio.t(k));
document.getElementById("title").textContent=words.title;
document.getElementById("ask").textContent=words.ask;
document.querySelectorAll("[data-label]").forEach(el=>el.textContent=words[el.getAttribute("data-label")]);
document.querySelectorAll("[data-option]").forEach(el=>el.textContent=words[el.getAttribute("data-option")]);
const scene=document.getElementById("scene"),caption=document.querySelector("[data-caption]"),play=document.getElementById("play");
let current=1,playing=true;
const n=Number(Studio.params.steps);
for(let i=1;i<=n;i++){
const b=document.createElement("button");b.type="button";b.dataset.action="step-"+i;b.textContent=String(i);b.setAttribute("aria-label",String(i));
b.addEventListener("click",()=>{setStep(i);Studio.event("step",{step:i})});
document.getElementById("steps").appendChild(b)
}
function setStep(i){current=i;scene.dataset.step=String(i);caption.textContent=words["step"+i];document.querySelectorAll(".steps button").forEach((b,j)=>b.classList.toggle("selected",j+1===i))}
function setPlaying(v){playing=v;play.textContent=words[v?"pause":"play"];play.setAttribute("aria-label",words[v?"pause":"play"]);scene.querySelectorAll("animate").forEach(a=>v?a.beginElement():a.endElement())}
play.addEventListener("click",()=>{setPlaying(!playing);Studio.event("play",{playing})});
setStep(1);
let feedback="";
Studio.onVerdict(({correct})=>{const status=document.getElementById("status");if(correct){status.textContent="✓";Studio.done()}else{status.textContent="";}});
document.querySelectorAll("[data-option]").forEach(b=>b.addEventListener("click",()=>{document.getElementById("status").textContent="";Studio.event("answer",{option:b.dataset.option});Studio.answer(b.dataset.option)}));
setPlaying(true);
Studio.ready()
})();
</script>
