<style>
  :root{
    --bg:#f6fbff; --card:#fff; --ink:#1f2a44; --muted:#6b7a99; --grid:#dbe7ff; --axis:#8aa0c8;
    --bar:#5b8def; --bar-dark:#3f73da; --ok:#20a464; --bad:#d64545;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}
  .wrap{min-height:100vh;padding:12px;display:flex;flex-direction:column;gap:10px;max-width:420px;margin:0 auto}
  .card{background:var(--card);border-radius:16px;box-shadow:0 6px 18px rgba(46,88,170,.14);padding:12px}
  h1{margin:2px 0 4px;font-size:22px;line-height:1.2}
  .ask{margin:0;min-height:24px;font-size:17px}
  .chart-box{position:relative}
  svg{width:100%;height:auto;display:block}
  .grid{stroke:var(--grid);stroke-width:1}
  .axis{stroke:var(--axis);stroke-width:2}
  .tick{fill:var(--muted);font-size:12px;dominant-baseline:middle;text-anchor:end}
  .ylabel{fill:var(--muted);font-size:12px;text-anchor:middle}
  .xlabel{fill:var(--ink);font-size:13px;text-anchor:middle}
  .bar{fill:var(--bar);transition:y .8s cubic-bezier(.2,.8,.2,1),height .8s cubic-bezier(.2,.8,.2,1),transform .15s ease,fill .2s ease;transform-origin:center bottom}
  .bar.tap{fill:var(--bar-dark);animation:pulse .35s ease}
  .bar-hit{fill:transparent;cursor:pointer}
  .bar-hit:active + .bar{transform:scale(.98)}
  @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
  .value-badge{
    position:absolute;top:8px;right:8px;min-width:44px;min-height:44px;border-radius:12px;background:#eef4ff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;opacity:0;transform:translateY(-4px);
    transition:opacity .2s ease,transform .2s ease;pointer-events:none
  }
  .value-badge.show{opacity:1;transform:translateY(0)}
  .feedback{min-height:26px;font-size:18px;font-weight:700;text-align:center}
  .ok{color:var(--ok)} .bad{color:var(--bad)}
</style>

<div class="wrap">
  <div class="card">
    <h1 id="title"></h1>
    <p id="ask" class="ask"></p>
  </div>

  <div class="card chart-box">
    <svg id="chart" viewBox="0 0 280 320" aria-hidden="true">
      <g id="gridLayer"></g>
      <line class="axis" x1="44" y1="20" x2="44" y2="270"></line>
      <line class="axis" x1="44" y1="270" x2="270" y2="270"></line>
      <text id="yAxisTitle" class="ylabel" transform="translate(14,145) rotate(-90)"></text>
      <g id="barsLayer"></g>
      <g id="xLabels"></g>
    </svg>
    <div id="valueBadge" class="value-badge"></div>
  </div>

  <div class="card"><div id="feedback" class="feedback"></div></div>
</div>

<script>
(function(){
  const data = Array.isArray(Studio.params.data) ? Studio.params.data : [];
  const titleEl = document.getElementById('title');
  const askEl = document.getElementById('ask');
  const yAxisTitle = document.getElementById('yAxisTitle');
  const gridLayer = document.getElementById('gridLayer');
  const barsLayer = document.getElementById('barsLayer');
  const xLabels = document.getElementById('xLabels');
  const feedback = document.getElementById('feedback');
  const valueBadge = document.getElementById('valueBadge');

  titleEl.textContent = Studio.t('title');
  askEl.textContent = Studio.t('ask');
  yAxisTitle.textContent = Studio.t('yaxis');

  const W=280,H=320,margin={left:44,right:10,top:20,bottom:50};
  const plotW=W-margin.left-margin.right, plotH=H-margin.top-margin.bottom, baselineY=margin.top+plotH;
  const maxVal = data.reduce((m,d)=>Math.max(m,Number(d.value)||0),0);

  function niceStep(maxValue){
    if(maxValue<=0) return 1;
    const raw=maxValue/5, pow=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/pow;
    return (n<=1?1:n<=2?2:n<=5?5:10)*pow;
  }

  const step=niceStep(maxVal);
  const maxTick=Math.max(step,Math.ceil(maxVal/step)*step);
  const ticks=[]; for(let v=0;v<=maxTick;v+=step) ticks.push(v);
  const yFor=v=>baselineY-(v/maxTick)*plotH;

  ticks.forEach(v=>{
    const y=yFor(v);
    const gl=document.createElementNS('http://www.w3.org/2000/svg','line');
    gl.setAttribute('class','grid'); gl.setAttribute('x1',margin.left); gl.setAttribute('x2',margin.left+plotW); gl.setAttribute('y1',y); gl.setAttribute('y2',y);
    gridLayer.appendChild(gl);

    const tx=document.createElementNS('http://www.w3.org/2000/svg','text');
    tx.setAttribute('class','tick'); tx.setAttribute('x',margin.left-8); tx.setAttribute('y',y); tx.setAttribute('data-tick',String(v)); tx.textContent=String(v);
    gridLayer.appendChild(tx);
  });

  const slot=plotW/Math.max(1,data.length);
  const barW=44;
  let awaitingVerdict=false, finished=false;

  data.forEach((d,i)=>{
    const cx=margin.left+i*slot+slot/2, x=cx-barW/2;
    const value=Number(d.value)||0;
    const targetY=yFor(value), targetH=baselineY-targetY;

    const hitH=Math.max(44,targetH), hitY=baselineY-hitH;
    const hit=document.createElementNS('http://www.w3.org/2000/svg','rect');
    hit.setAttribute('class','bar-hit'); hit.setAttribute('x',x); hit.setAttribute('y',hitY); hit.setAttribute('width',barW); hit.setAttribute('height',hitH);

    const bar=document.createElementNS('http://www.w3.org/2000/svg','rect');
    bar.setAttribute('class','bar'); bar.setAttribute('x',x); bar.setAttribute('y',baselineY); bar.setAttribute('width',barW); bar.setAttribute('height',0);
    bar.setAttribute('rx',10); bar.setAttribute('ry',10);
    bar.setAttribute('data-bar',d.key); bar.setAttribute('data-value',String(value));

    hit.addEventListener('click',function(){
      if(awaitingVerdict||finished) return;
      awaitingVerdict=true;
      bar.classList.add('tap'); setTimeout(()=>bar.classList.remove('tap'),360);
      valueBadge.textContent=String(value); valueBadge.classList.add('show');
      Studio.event('bar_tap',{key:d.key,value:value});
      Studio.answer(String(d.key));
    });

    barsLayer.appendChild(hit);
    barsLayer.appendChild(bar);

    const xl=document.createElementNS('http://www.w3.org/2000/svg','text');
    xl.setAttribute('class','xlabel'); xl.setAttribute('x',cx); xl.setAttribute('y',baselineY+24); xl.textContent=Studio.t(d.key);
    xLabels.appendChild(xl);

    requestAnimationFrame(()=>{ bar.setAttribute('y',targetY); bar.setAttribute('height',targetH); });
  });

  Studio.onVerdict(function(v){
    if(finished) return;
    if(v&&v.correct){
      feedback.className='feedback ok';
      feedback.textContent=Studio.t('right');
      askEl.textContent=Studio.t('done');
      finished=true; awaitingVerdict=false;
      Studio.done();
    }else{
      feedback.className='feedback bad';
      feedback.textContent=Studio.t('wrong');
      awaitingVerdict=false;
    }
  });

  Studio.ready();
})();
</script>
