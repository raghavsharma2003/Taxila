<style>
  *{box-sizing:border-box}
  .garden{width:100%;max-width:360px;height:640px;margin:auto;padding:10px 12px;overflow:hidden;background:#f7f7e9;color:#254b3b;font-family:system-ui,sans-serif;display:flex;flex-direction:column;gap:7px}
  .garden h1{height:35px;margin:0;text-align:center;font-size:20px;line-height:35px;font-weight:750}
  .scene{width:100%;height:286px;flex:none;border-radius:22px;background:linear-gradient(#d8f3ef 0%,#eef8dd 76%,#d7ad79 76%);overflow:hidden}
  .scene text{font:600 13px system-ui,sans-serif;fill:#294b42;paint-order:stroke;stroke:#f7f7e9;stroke-width:3px;stroke-linejoin:round}
  .sun-disc{fill:#ffcf63;filter:drop-shadow(0 0 9px #ffe18a)}
  .ray{stroke:#f8c958;stroke-width:3;stroke-linecap:round;stroke-dasharray:8 8;animation:shine 2s linear infinite}
  .leaf-shape{fill:#6dbb72;stroke:#388c63;stroke-width:3;transition:filter .3s,transform .3s;transform-origin:177px 137px}
  .glow{fill:#f9dc74;opacity:.55;animation:glimmer 2s ease-in-out infinite}
  .flow{transition:opacity .3s}
  .water{fill:#439ed2}.co2{fill:#a678c8}.o2{fill:#70c8b3}
  .garden.paused .ray,.garden.paused .glow{animation-play-state:paused}
  .controls{display:flex;gap:7px;height:48px;flex:none}
  button{font:700 15px system-ui,sans-serif;color:#254b3b;border:2px solid #b7d6bd;border-radius:14px;background:white;cursor:pointer;min-width:44px;min-height:44px;transition:transform .15s,background .2s,border-color .2s}
  button:active{transform:scale(.92)}
  button:focus-visible{outline:3px solid #e7a948;outline-offset:2px}
  [data-action="play"]{flex:1;background:#d8efcf}
  .steps{display:flex;gap:5px;flex:4}
  .steps button{flex:1;min-width:0;padding:0}
  .steps button.active{background:#f9df9a;border-color:#e3af52}
  [data-caption]{height:43px;flex:none;display:flex;align-items:center;justify-content:center;text-align:center;padding:3px 12px;border-radius:13px;background:#e6f1dc;font-size:14px;font-weight:650;line-height:1.2}
  .ask{height:51px;flex:none;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;font-weight:700;line-height:1.2;padding:2px 8px}
  .options{display:flex;gap:8px;height:49px;flex:none}
  .options button{flex:1;min-width:0;padding:2px;font-size:14px}
  .options button.wrong{border-color:#dc927b;background:#fce8df}
  .options button.right{border-color:#63af78;background:#dcf1d7}
  .garden[data-step="1"] .sun-disc,.garden[data-step="1"] .ray{filter:drop-shadow(0 0 8px #ffd04e)}
  .garden[data-step="2"] .water,.garden[data-step="3"] .co2,.garden[data-step="4"] .glow,.garden[data-step="5"] .o2{filter:drop-shadow(0 0 5px currentColor)}
  .garden[data-step="4"] .leaf-shape{filter:drop-shadow(0 0 8px #f5ce55)}
  @keyframes shine{to{stroke-dashoffset:-16}}
  @keyframes glimmer{50%{opacity:1;transform:scale(1.25)}}
</style>
<div class="garden" data-step="1">
  <h1 data-title></h1>
  <svg class="scene" viewBox="0 0 336 286" role="img" aria-label="">
    <g class="rays">
      <path class="ray" d="M74 53 Q119 70 151 116"/><path class="ray" d="M85 38 Q140 53 190 113"/>
    </g>
    <circle class="sun-disc" cx="54" cy="40" r="27"/>
    <path d="M0 219 Q85 209 165 220 T336 219 L336 286 H0Z" fill="#bd9167"/>
    <path d="M0 237 Q110 231 202 242 T336 235" fill="none" stroke="#a87a54" stroke-width="3"/>
    <path d="M174 238 Q173 202 175 141" fill="none" stroke="#428d5b" stroke-width="10" stroke-linecap="round"/>
    <path d="M174 207 Q142 196 129 177 M175 191 Q206 181 219 165" fill="none" stroke="#428d5b" stroke-width="5" stroke-linecap="round"/>
    <path data-entity="roots" d="M174 234 Q150 249 132 267 M174 235 Q181 257 201 275 M170 240 Q154 259 158 276 M180 241 Q202 247 219 260" fill="none" stroke="#75583e" stroke-width="6" stroke-linecap="round"/>
    <path data-entity="leaf" class="leaf-shape" d="M174 151 Q126 115 144 91 Q182 88 210 130 Q200 153 174 151Z"/>
    <path d="M174 150 Q174 122 151 101" fill="none" stroke="#3a945f" stroke-width="2"/>
    <circle class="glow" cx="173" cy="120" r="8"/>
    <g id="particles"></g>
    <text data-label="sun" x="17" y="86"></text>
    <text data-label="leaf" x="183" y="91"></text>
    <text data-label="roots" x="211" y="270"></text>
    <text data-label="water" x="42" y="208"></text>
    <text data-label="co2" x="241" y="111"></text>
    <text data-label="o2" x="261" y="159"></text>
    <text data-label="glucose" x="96" y="165"></text>
  </svg>
  <div class="controls">
    <button type="button" data-action="play"></button>
    <div class="steps"></div>
  </div>
  <div data-caption></div>
  <div class="ask" data-ask></div>
  <div class="options">
    <button type="button" data-option="co2"></button>
    <button type="button" data-option="o2"></button>
    <button type="button" data-option="water"></button>
  </div>
</div>
<script>
(() => {
  const root=document.querySelector('.garden'), svg=root.querySelector('svg'), layer=svg.querySelector('#particles');
  const count=Studio.params.steps;
  let step=1,playing=true,phase=0,last=0,finished=false;
  root.querySelector('[data-title]').textContent=Studio.t('title');
  root.querySelector('[data-ask]').textContent=Studio.t('ask');
  root.querySelectorAll('[data-label]').forEach(el=>el.textContent=Studio.t(el.dataset.label));
  root.querySelectorAll('[data-option]').forEach(el=>el.textContent=Studio.t(el.dataset.option));
  const play=root.querySelector('[data-action="play"]'), caption=root.querySelector('[data-caption]'), steps=root.querySelector('.steps');
  for(let i=1;i<=count;i++){
    const b=document.createElement('button');
    b.type='button';b.dataset.action='step-'+i;b.textContent=String(i);
    b.addEventListener('click',()=>{step=i;render();Studio.event('step',{step:i})});
    steps.append(b);
  }
  function render(){
    root.dataset.step=String(step);
    root.classList.toggle('paused',!playing);
    play.textContent=Studio.t(playing?'pause':'play');
    caption.textContent=Studio.t('step'+step);
    steps.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('active',i+1===step));
  }
  play.addEventListener('click',()=>{playing=!playing;render();Studio.event('play',{playing})});
  const flows={water:[[154,260],[171,226],[174,184],[174,139]],co2:[[302,119],[265,117],[222,119],[188,121]],o2:[[186,138],[219,150],[262,166],[312,178]]};
  const particles=[];
  Object.entries(flows).forEach(([name,points])=>{
    for(let i=0;i<4;i++){
      const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('data-flow',name);c.setAttribute('class','flow '+name);c.setAttribute('r','4');
      layer.append(c);particles.push({c,points,i,name});
    }
  });
  function animate(time){
    if(playing && last)phase+=(time-last)*.00022;
    last=time;
    for(const {c,points,i,name} of particles){
      const p=(phase+i/4)%1,scaled=p*(points.length-1),a=Math.floor(scaled),f=scaled-a;
      const start=points[a],end=points[Math.min(a+1,points.length-1)];
      c.setAttribute('cx',start[0]+(end[0]-start[0])*f);
      c.setAttribute('cy',start[1]+(end[1]-start[1])*f);
      c.style.opacity=step===({water:2,co2:3,o2:5}[name])?'1':'.65';
    }
    requestAnimationFrame(animate);
  }
  root.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>{
    if(finished)return;
    root.querySelectorAll('[data-option]').forEach(x=>x.classList.remove('wrong','right'));
    b.classList.add('right');
    Studio.answer(b.dataset.option);
    root._choice=b;
  }));
  Studio.onVerdict(({correct})=>{
    const b=root._choice;if(!b)return;
    b.classList.remove('right');
    b.classList.add(correct?'right':'wrong');
    if(correct&&!finished){finished=true;Studio.done()}
  });
  render();requestAnimationFrame(animate);Studio.ready();
})();
</script>
