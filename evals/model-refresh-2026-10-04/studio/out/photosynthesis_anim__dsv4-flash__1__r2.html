<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #e0f4e8; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 640px; width: 360px; overflow-x: hidden; overflow-y: auto; padding: 4px 2px; }
.scene { width: 348px; height: 260px; position: relative; margin-bottom: 2px; }
.scene svg { width: 100%; height: 100%; display: block; overflow: visible; }
.controls { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; width: 348px; margin: 2px 0; }
.controls button { background: #2d6a4f; color: #fff; border: none; border-radius: 20px; padding: 6px 10px; font-size: 12px; font-weight: 600; cursor: pointer; min-width: 44px; min-height: 44px; transition: transform 0.15s, background 0.2s; line-height: 1.2; }
.controls button:active { transform: scale(0.92); }
.controls button.active-step { background: #40916c; box-shadow: 0 0 0 3px #95d5b2; }
.caption-box { background: #f0f3eb; padding: 5px 8px; border-radius: 14px; font-size: 11px; color: #1b4332; width: 340px; min-height: 32px; text-align: center; margin: 2px 0 4px; border: 1px solid #b7e4c7; word-break: break-word; }
.quiz { width: 348px; display: flex; flex-direction: column; gap: 2px; margin-top: 2px; align-items: center; }
.quiz-question { font-size: 12px; font-weight: 600; color: #1b4332; text-align: center; padding: 3px 0; word-break: break-word; max-width: 340px; }
.quiz-options { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
.quiz-options button { background: #e9f5db; border: 2px solid #52b788; border-radius: 18px; padding: 6px 14px; font-size: 12px; color: #1b4332; cursor: pointer; min-width: 56px; min-height: 44px; transition: transform 0.12s, background 0.15s; font-weight: 500; }
.quiz-options button:active { transform: scale(0.90); background: #d8f3dc; }
.quiz-options button:disabled { opacity: 0.6; cursor: default; }
.feedback-text { font-size: 11px; margin-top: 2px; padding: 3px 10px; border-radius: 10px; background: #fff3cd; color: #856404; min-height: 20px; max-width: 340px; text-align: center; }
[data-entity] { transition: all 0.3s; }
.particle { transition: none; }
</style>
<div class="scene">
  <svg viewBox="0 0 348 260" xmlns="http://www.w3.org/2000/svg" style="overflow: visible;">
    <!-- sun -->
    <circle cx="270" cy="30" r="22" fill="#ffd166" opacity="0.9"/>
    <text x="270" y="22" text-anchor="middle" fill="#7f4f24" font-size="8" font-weight="bold" data-label="sun">Suraj</text>
    <!-- sun rays -->
    <g stroke="#ffd166" stroke-width="2" opacity="0.6" stroke-dasharray="4 3">
      <line x1="270" y1="7" x2="270" y2="0"/>
      <line x1="293" y1="13" x2="304" y2="7"/>
      <line x1="302" y1="30" x2="314" y2="30"/>
      <line x1="293" y1="47" x2="304" y2="53"/>
      <line x1="270" y1="53" x2="270" y2="60"/>
      <line x1="247" y1="47" x2="236" y2="53"/>
      <line x1="238" y1="30" x2="226" y2="30"/>
      <line x1="247" y1="13" x2="236" y2="7"/>
    </g>
    <!-- light rays from sun to leaf -->
    <g stroke="#ffe066" stroke-width="1.5" opacity="0.35" class="light-rays">
      <line x1="250" y1="45" x2="130" y2="120"/>
      <line x1="260" y1="48" x2="145" y2="118"/>
      <line x1="270" y1="50" x2="160" y2="115"/>
      <line x1="240" y1="42" x2="115" y2="122"/>
    </g>
    <!-- soil -->
    <ellipse cx="110" cy="225" rx="85" ry="22" fill="#5c4a3a"/>
    <ellipse cx="110" cy="220" rx="80" ry="16" fill="#7f5a3e"/>
    <!-- roots -->
    <g data-entity="roots" fill="#a0785a" stroke="#7f5a3e" stroke-width="1">
      <path d="M120 205 C115 215 105 228 98 238" stroke-width="3" fill="none"/>
      <path d="M120 205 C125 217 130 232 132 242" stroke-width="3" fill="none"/>
      <path d="M120 205 C110 213 90 222 80 232" stroke-width="2.5" fill="none"/>
      <path d="M120 205 C135 215 150 228 155 238" stroke-width="2.5" fill="none"/>
    </g>
    <!-- stem -->
    <path d="M120 205 L120 115" stroke="#2d6a4f" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- leaf -->
    <g data-entity="leaf">
      <ellipse cx="155" cy="120" rx="36" ry="18" fill="#52b788" transform="rotate(-20,155,120)"/>
      <ellipse cx="150" cy="116" rx="30" ry="14" fill="#74c69d" transform="rotate(-20,150,116)"/>
      <line x1="132" y1="126" x2="172" y2="110" stroke="#2d6a4f" stroke-width="1.5" opacity="0.5"/>
    </g>
    <!-- glucose glow (opacity controlled by script) -->
    <ellipse cx="155" cy="118" rx="14" ry="8" fill="#facc15" opacity="0" class="glucose-glow"/>
    <text x="155" y="121" text-anchor="middle" fill="#1b4332" font-size="7" font-weight="bold" opacity="0" class="glucose-text" data-label="glucose">Glucose</text>
    <!-- static labels (all inside view) -->
    <text x="90" y="245" text-anchor="middle" fill="#d8f3dc" font-size="6.5" data-label="water">Paani</text>
    <text x="40" y="25" text-anchor="middle" fill="#2d6a4f" font-size="6.5" data-label="co2">CO₂</text>
    <text x="310" y="70" text-anchor="middle" fill="#2d6a4f" font-size="6.5" data-label="o2">O₂</text>
    <text x="158" y="98" text-anchor="middle" fill="#1b4332" font-size="6.5" font-weight="bold" data-label="leaf">Patti</text>
    <text x="90" y="230" text-anchor="middle" fill="#e9c46a" font-size="6.5" font-weight="bold" data-label="roots">Jarr</text>
  </svg>
</div>
<div class="controls">
  <button data-action="play" id="playBtn">Ruk</button>
  <button data-action="step-1" class="step-btn active-step">1</button>
  <button data-action="step-2" class="step-btn">2</button>
  <button data-action="step-3" class="step-btn">3</button>
  <button data-action="step-4" class="step-btn">4</button>
  <button data-action="step-5" class="step-btn">5</button>
</div>
<div class="caption-box" data-caption>Step 1: Suraj ki roshni patti par padti hai</div>
<div class="quiz">
  <div class="quiz-question" id="askText">Sawaal: Photosynthesis mein kaun si gas andar jaati hai?</div>
  <div class="quiz-options" id="quizOpts">
    <button data-option="co2">CO₂</button>
    <button data-option="o2">O₂</button>
    <button data-option="water">Paani</button>
  </div>
  <div class="feedback-text" id="fb"></div>
</div>
<script>
(function() {
  const playing = { value: true };
  const currentStep = { value: 1 };
  const particles = [];
  const svg = document.querySelector('svg');
  const ns = 'http://www.w3.org/2000/svg';

  function makeParticle(type) {
    const circle = document.createElementNS(ns, 'circle');
    circle.setAttribute('r', 3);
    circle.setAttribute('data-flow', type);
    circle.classList.add('particle');
    let start, target;
    if (type === 'water') {
      circle.setAttribute('fill', '#90e0ef');
      start = { x: 115 + (Math.random() - 0.5) * 10, y: 215 + Math.random() * 15 };
      target = { x: 145 + (Math.random() - 0.5) * 18, y: 115 + (Math.random() - 0.5) * 15 };
    } else if (type === 'co2') {
      circle.setAttribute('fill', '#e76f51');
      start = { x: 35 + Math.random() * 18, y: 10 + Math.random() * 22 };
      target = { x: 145 + (Math.random() - 0.5) * 18, y: 115 + (Math.random() - 0.5) * 15 };
    } else { // o2
      circle.setAttribute('fill', '#2a9d8f');
      start = { x: 150 + (Math.random() - 0.5) * 18, y: 110 + (Math.random() - 0.5) * 15 };
      target = { x: 290 + Math.random() * 30, y: 50 + Math.random() * 35 };
    }
    circle._start = start;
    circle._target = target;
    circle._t = Math.random();
    circle.setAttribute('cx', start.x);
    circle.setAttribute('cy', start.y);
    svg.appendChild(circle);
    return circle;
  }

  function spawnParticles() {
    ['water', 'co2', 'o2'].forEach(t => {
      let count = document.querySelectorAll(`circle[data-flow="${t}"]`).length;
      while (count < 3) {
        particles.push(makeParticle(t));
        count++;
      }
    });
  }

  function animateParticles() {
    if (!playing.value) return;
    const speed = 0.012;
    particles.forEach(p => {
      if (!p._t) p._t = Math.random();
      p._t += speed;
      if (p._t >= 1) {
        p._t = 0;
        const type = p.getAttribute('data-flow');
        if (type === 'water') {
          p._start = { x: 115 + (Math.random() - 0.5) * 10, y: 215 + Math.random() * 15 };
          p._target = { x: 145 + (Math.random() - 0.5) * 18, y: 115 + (Math.random() - 0.5) * 15 };
        } else if (type === 'co2') {
          p._start = { x: 35 + Math.random() * 18, y: 10 + Math.random() * 22 };
          p._target = { x: 145 + (Math.random() - 0.5) * 18, y: 115 + (Math.random() - 0.5) * 15 };
        } else {
          p._start = { x: 150 + (Math.random() - 0.5) * 18, y: 110 + (Math.random() - 0.5) * 15 };
          p._target = { x: 290 + Math.random() * 30, y: 50 + Math.random() * 35 };
        }
      }
      const t = p._t;
      const cx = p._start.x + (p._target.x - p._start.x) * t;
      const cy = p._start.y + (p._target.y - p._start.y) * t;
      p.setAttribute('cx', cx);
      p.setAttribute('cy', cy);
    });
    requestAnimationFrame(animateParticles);
  }

  // Captions using Studio.t properly; fallback for safety
  const captions = [
    Studio.t('step1') || 'Step 1: Suraj ki roshni patti par padti hai',
    Studio.t('step2') || 'Step 2: Pani (H₂O) jarr se patti tak jaata hai',
    Studio.t('step3') || 'Step 3: CO₂ hawa se patti mein jaata hai',
    Studio.t('step4') || 'Step 4: Suraj ki roshni se glucose banta hai',
    Studio.t('step5') || 'Step 5: O₂ hawa mein chhod di jaati hai'
  ];

  function updateStepUi(s) {
    document.querySelectorAll('.step-btn').forEach((btn, idx) => {
      btn.classList.toggle('active-step', idx + 1 === s);
    });
    const capEl = document.querySelector('[data-caption]');
    if (capEl) capEl.textContent = captions[s - 1] || '';
    const glow = document.querySelector('.glucose-glow');
    const txt = document.querySelector('.glucose-text');
    if (s >= 4) {
      if (glow) glow.setAttribute('opacity', '0.7');
      if (txt) txt.setAttribute('opacity', '1');
    } else {
      if (glow) glow.setAttribute('opacity', '0');
      if (txt) txt.setAttribute('opacity', '0');
    }
  }

  document.getElementById('playBtn').addEventListener('click', function() {
    playing.value = !playing.value;
    this.textContent = playing.value ? (Studio.t('pause') || 'Ruk') : (Studio.t('play') || 'Chalu');
    Studio.event('play_toggle', { playing: playing.value });
    if (playing.value) {
      animateParticles();
      spawnParticles();
    }
  });

  document.querySelectorAll('.step-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const s = parseInt(this.getAttribute('data-action').split('-')[1]);
      currentStep.value = s;
      updateStepUi(s);
      Studio.event('step_change', { step: s });
      if (!playing.value) {
        playing.value = true;
        document.getElementById('playBtn').textContent = Studio.t('pause') || 'Ruk';
        animateParticles();
        spawnParticles();
      }
    });
  });

  // Quiz: always tappable until correct
  document.querySelectorAll('[data-option]').forEach(btn => {
    btn.addEventListener('click', function() {
      if (this.disabled) return; // prevent after correct
      const val = this.getAttribute('data-option');
      Studio.answer(val);
      Studio.event('quiz_answer', { answer: val });
    });
  });

  Studio.onVerdict(function(result) {
    const fb = document.getElementById('fb');
    if (result.correct) {
      fb.textContent = 'Sahi jawab! 🌿';
      fb.style.background = '#d4edda';
      fb.style.color = '#155724';
      document.querySelectorAll('[data-option]').forEach(b => b.disabled = true);
      Studio.done();
    } else {
      fb.textContent = 'Galat jawab, phir se try karo!';
      fb.style.background = '#fff3cd';
      fb.style.color = '#856404';
      // ensure buttons remain enabled
      document.querySelectorAll('[data-option]').forEach(b => b.disabled = false);
    }
  });

  // initialise
  spawnParticles();
  animateParticles();
  updateStepUi(1);
  // set correct play button text
  const playBtn = document.getElementById('playBtn');
  playBtn.textContent = Studio.t('pause') || 'Ruk';
  Studio.ready();
})();
</script>
