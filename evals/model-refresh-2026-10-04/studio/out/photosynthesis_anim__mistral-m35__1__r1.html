<style>
  :root {
    --bg: #f0f8ff;
    --soil: #5d4037;
    --stem: #8bc34a;
    --leaf: #4caf50;
    --sun: #ffeb3b;
    --water: #2196f3;
    --co2: #9c27b0;
    --o2: #00bcd4;
    --glucose: #ff9800;
    --text: #212121;
    --btn: #ffffff;
    --btn-text: #424242;
    --btn-active: #e3f2fd;
    --caption-bg: rgba(255,255,255,0.8);
    --flow-opacity: 0.7;
  }
  body {
    margin: 0;
    padding: 12px;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 640px;
    width: 360px;
    box-sizing: border-box;
  }
  .container {
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .scene {
    position: relative;
    flex: 1;
    overflow: hidden;
    background: linear-gradient(to bottom, #e3f2fd 0%, #f0f8ff 30%, var(--soil) 30%);
  }
  svg {
    width: 100%;
    height: 100%;
  }
  .sun {
    fill: var(--sun);
    filter: drop-shadow(0 0 6px rgba(255,235,59,0.6));
  }
  .leaf {
    fill: var(--leaf);
    stroke: #388e3c;
    stroke-width: 1.5;
  }
  .stem {
    fill: var(--stem);
    stroke: #689f38;
    stroke-width: 1.5;
  }
  .roots {
    fill: var(--soil);
    stroke: #4e342e;
    stroke-width: 1.5;
  }
  .soil {
    fill: var(--soil);
  }
  .light-ray {
    stroke: var(--sun);
    stroke-width: 2;
    stroke-opacity: 0.6;
    stroke-linecap: round;
  }
  .particle {
    transition: cx 0.6s linear, cy 0.6s linear, opacity 0.2s;
  }
  .water-particle { fill: var(--water); }
  .co2-particle { fill: var(--co2); }
  .o2-particle { fill: var(--o2); }
  .glucose-glow {
    fill: var(--glucose);
    filter: drop-shadow(0 0 4px var(--glucose));
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .glucose-glow.active { opacity: 1; }
  .controls {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 8px 0;
    background: var(--caption-bg);
    border-radius: 12px;
    margin-top: 8px;
  }
  .btn {
    min-width: 44px;
    min-height: 44px;
    border: none;
    border-radius: 50%;
    background: var(--btn);
    color: var(--btn-text);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s, background 0.2s;
    user-select: none;
  }
  .btn:active { transform: scale(0.95); }
  .btn.active { background: var(--btn-active); }
  .step-btn {
    width: 44px;
    height: 44px;
    font-size: 16px;
  }
  .caption {
    text-align: center;
    font-size: 14px;
    padding: 4px 8px;
    background: var(--caption-bg);
    border-radius: 8px;
    margin-top: 4px;
    min-height: 20px;
  }
  .question {
    background: var(--caption-bg);
    border-radius: 12px;
    padding: 8px;
    margin-top: 8px;
  }
  .question-text {
    font-size: 15px;
    text-align: center;
    margin-bottom: 8px;
  }
  .options {
    display: flex;
    justify-content: space-around;
    gap: 8px;
  }
  .option-btn {
    flex: 1;
    padding: 8px;
    border: none;
    border-radius: 8px;
    background: var(--btn);
    color: var(--btn-text);
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.1s, background 0.2s;
  }
  .option-btn:active { transform: scale(0.98); }
  .option-btn.correct { background: #c8e6c9; }
  .option-btn.incorrect { background: #ffcdd2; }
  .label {
    font-size: 12px;
    fill: var(--text);
    text-shadow: 1px 1px 2px white;
    pointer-events: none;
  }
  .label-bg {
    fill: rgba(255,255,255,0.6);
    stroke: none;
    rx: 4px;
    ry: 4px;
  }
</style>

<svg viewBox="0 0 360 400" class="scene">
  <rect x="0" y="280" width="360" height="120" class="soil"/>

  <!-- Sun -->
  <circle cx="180" cy="40" r="25" class="sun" data-entity="sun"/>
  <text x="180" y="40" text-anchor="middle" dy="-30" class="label" data-label="sun"></text>

  <!-- Light rays -->
  <line x1="180" y1="65" x2="120" y2="120" class="light-ray"/>
  <line x1="180" y1="65" x2="240" y2="120" class="light-ray"/>

  <!-- Plant -->
  <path d="M180 280 Q170 200 180 150 Q190 200 180 280" class="roots" data-entity="roots"/>
  <rect x="175" y="150" width="10" height="100" class="stem"/>
  <path d="M180 150 Q220 130 200 100 Q220 80 180 100 Q140 80 160 100 Q140 130 180 150" class="leaf" data-entity="leaf"/>

  <!-- Labels -->
  <text x="180" y="270" text-anchor="middle" class="label" data-label="roots"></text>
  <text x="180" y="110" text-anchor="middle" class="label" data-label="leaf"></text>

  <!-- Particles: Water (up stem) -->
  <circle cx="180" cy="260" r="4" class="particle water-particle" data-flow="water"/>
  <circle cx="180" cy="240" r="4" class="particle water-particle" data-flow="water"/>
  <circle cx="180" cy="220" r="4" class="particle water-particle" data-flow="water"/>

  <!-- Particles: CO2 (air to leaf) -->
  <circle cx="50" cy="80" r="4" class="particle co2-particle" data-flow="co2"/>
  <circle cx="100" cy="90" r="4" class="particle co2-particle" data-flow="co2"/>
  <circle cx="150" cy="85" r="4" class="particle co2-particle" data-flow="co2"/>

  <!-- Particles: O2 (leaf to air) -->
  <circle cx="200" cy="100" r="4" class="particle o2-particle" data-flow="o2"/>
  <circle cx="230" cy="90" r="4" class="particle o2-particle" data-flow="o2"/>
  <circle cx="280" cy="80" r="4" class="particle o2-particle" data-flow="o2"/>

  <!-- Glucose glow in leaf -->
  <circle cx="180" cy="110" r="8" class="glucose-glow" data-flow="glucose"/>

  <!-- Labels for flows -->
  <text x="180" y="250" text-anchor="middle" class="label" data-label="water"></text>
  <text x="80" y="70" text-anchor="middle" class="label" data-label="co2"></text>
  <text x="280" y="70" text-anchor="middle" class="label" data-label="o2"></text>
  <text x="180" y="110" text-anchor="middle" dy="-20" class="label" data-label="glucose"></text>
</svg>

<div class="controls">
  <button class="btn" data-action="play" data-label="play">▶</button>
  <button class="btn step-btn" data-action="step-1">1</button>
  <button class="btn step-btn" data-action="step-2">2</button>
  <button class="btn step-btn" data-action="step-3">3</button>
  <button class="btn step-btn" data-action="step-4">4</button>
  <button class="btn step-btn" data-action="step-5">5</button>
</div>
<div class="caption" data-caption></div>

<div class="question">
  <div class="question-text" data-label="ask"></div>
  <div class="options">
    <button class="option-btn" data-option="co2" data-label="co2"></button>
    <button class="option-btn" data-option="o2" data-label="o2"></button>
    <button class="option-btn" data-option="water" data-label="water"></button>
  </div>
</div>

<script>
  (function() {
    const t = Studio.t;
    const params = Studio.params;
    const totalSteps = params.steps;

    function updateText() {
      document.querySelectorAll('[data-label]').forEach(el => {
        const key = el.getAttribute('data-label');
        el.textContent = t(key);
      });
    }

    const waterParticles = document.querySelectorAll('[data-flow="water"]');
    const co2Particles = document.querySelectorAll('[data-flow="co2"]');
    const o2Particles = document.querySelectorAll('[data-flow="o2"]');
    const glucoseGlow = document.querySelector('[data-flow="glucose"]');

    let isPlaying = true;
    let currentStep = 1;
    let animationId = null;
    let stepInterval = null;
    let lastAnswer = null;

    function animateParticles() {
      if (!isPlaying) return;

      const now = Date.now() * 0.001;

      waterParticles.forEach((p, i) => {
        const progress = (i * 0.2 + now * 0.5) % 1;
        const y = 260 - (260 - 160) * progress;
        p.setAttribute('cy', y);
      });

      co2Particles.forEach((p, i) => {
        const progress = (i * 0.3 + now * 0.4) % 1;
        const x = 50 + i * 50 + (180 - (50 + i * 50)) * progress;
        const y = 80 + Math.sin(progress * Math.PI) * 10;
        p.setAttribute('cx', x);
        p.setAttribute('cy', y);
      });

      o2Particles.forEach((p, i) => {
        const progress = (i * 0.4 + now * 0.6) % 1;
        const x = 180 + (250 + i * 30 - 180) * progress;
        const y = 100 - Math.sin(progress * Math.PI) * 10;
        p.setAttribute('cx', x);
        p.setAttribute('cy', y);
      });

      animationId = requestAnimationFrame(animateParticles);
    }

    function highlightStep(step) {
      currentStep = step;
      document.querySelectorAll('.step-btn').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.textContent) === step);
      });

      document.querySelector('[data-caption]').textContent = t(`step${step}`);

      const activeFlow = {1:'water', 2:'co2', 3:'sun', 4:'o2', 5:'glucose'}[step] || '';

      [waterParticles, co2Particles, o2Particles].forEach(particles => {
        particles.forEach(p => {
          p.style.opacity = (p.getAttribute('data-flow') === activeFlow) ? '1' : '0.4';
        });
      });

      if (step === 5) {
        glucoseGlow.classList.add('active');
      } else {
        glucoseGlow.classList.remove('active');
      }
    }

    function togglePlayPause() {
      isPlaying = !isPlaying;
      const playBtn = document.querySelector('[data-action="play"]');
      playBtn.textContent = isPlaying ? '❚❚' : '▶';
      playBtn.setAttribute('data-label', isPlaying ? 'pause' : 'play');

      if (isPlaying) {
        animateParticles();
        stepInterval = setInterval(() => {
          currentStep = (currentStep % totalSteps) + 1;
          highlightStep(currentStep);
        }, 3000);
      } else {
        cancelAnimationFrame(animationId);
        clearInterval(stepInterval);
      }
    }

    function init() {
      updateText();

      document.querySelector('[data-action="play"]').addEventListener('click', () => {
        Studio.event('play_pause_toggle', {action: isPlaying ? 'pause' : 'play'});
        togglePlayPause();
      });

      for (let i = 1; i <= totalSteps; i++) {
        const btn = document.querySelector(`[data-action="step-${i}"]`);
        btn.addEventListener('click', () => {
          Studio.event('step_selected', {step: i});
          highlightStep(i);
        });
      }

      document.querySelectorAll('.option-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const option = btn.getAttribute('data-option');
          Studio.event('answer_selected', {option});
          Studio.answer(option);
          lastAnswer = option;
        });
      });

      Studio.onVerdict(({correct}) => {
        document.querySelectorAll('.option-btn').forEach(btn => {
          btn.classList.remove('correct', 'incorrect');
          if (btn.getAttribute('data-option') === lastAnswer) {
            btn.classList.add(correct ? 'correct' : 'incorrect');
          }
        });
        if (correct) {
          Studio.done();
        }
      });

      highlightStep(1);
      togglePlayPause();
      Studio.ready();
    }

    init();
  })();
</script>
