<style>
  * { box-sizing: border-box; }
  :root {
    color-scheme: light;
    --ink: #273b42;
    --muted: #6c7d7d;
    --paper: #fffdf8;
    --line: #e6e8dc;
    --green: #438c71;
  }
  body {
    margin: 0;
    font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif;
    background: #f5f3e9;
    color: var(--ink);
  }
  .activity {
    width: min(100%, 560px);
    min-height: 100vh;
    margin: 0 auto;
    padding: 16px 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .heading { display: flex; align-items: center; gap: 11px; }
  .fruit-mark {
    width: 45px; height: 45px; flex: 0 0 45px;
    border-radius: 16px; background: #e8f3e8;
    display: grid; place-items: center;
  }
  .fruit-mark svg { width: 31px; height: 31px; }
  h1 { margin: 0; font-size: clamp(21px, 6vw, 27px); line-height: 1.15; letter-spacing: -.4px; }
  .chart-card {
    background: var(--paper);
    border: 1px solid #eeece3;
    border-radius: 23px;
    box-shadow: 0 8px 22px #354b3e0c;
    padding: 10px 8px 6px;
  }
  .chart { display: block; width: 100%; height: auto; overflow: visible; }
  .grid { stroke: var(--line); stroke-width: 1; }
  .axis { stroke: #81918a; stroke-width: 1.5; }
  .tick-label {
    fill: var(--muted); font-size: 12px; font-weight: 650;
    text-anchor: end; dominant-baseline: middle;
  }
  .axis-title { fill: #526962; font-size: 12px; font-weight: 700; text-anchor: middle; }
  .fruit-label { fill: var(--ink); font-size: 11px; font-weight: 700; text-anchor: middle; }
  .bar-hit {
    cursor: pointer; outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  .bar-hit:focus-visible .bar-shape { stroke: #273b42; stroke-width: 2.5; }
  .bar-shape {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: grow .85s cubic-bezier(.2,.8,.2,1) both;
    transition: filter .18s;
  }
  .bar-hit:active .bar-shape { filter: brightness(.92); }
  .value-bubble { opacity: 0; transition: opacity .18s, transform .18s; transform: translateY(4px); }
  .value-bubble.visible { opacity: 1; transform: translateY(0); }
  .value-bubble rect { fill: #fff; stroke: #d9e6d9; stroke-width: 1.5; }
  .value-bubble text {
    fill: var(--ink); font-size: 13px; font-weight: 800;
    text-anchor: middle; dominant-baseline: middle;
  }
  .prompt-card {
    min-height: 88px; border-radius: 20px; padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    background: #eaf3ec; border: 1px solid #dceadd;
    transition: background .25s, border-color .25s;
  }
  .prompt-card.feedback-right { background: #e5f3e8; border-color: #b9ddbf; }
  .prompt-card.feedback-wrong { background: #fff1e7; border-color: #f1d1b7; }
  .prompt-icon {
    flex: 0 0 38px; width: 38px; height: 38px; border-radius: 14px;
    background: #fffdf8; display: grid; place-items: center; color: var(--green);
  }
  .prompt-icon svg { width: 23px; height: 23px; }
  .prompt-text { margin: 0; font-size: 17px; font-weight: 750; line-height: 1.32; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>

<main class="activity">
  <header class="heading">
    <div class="fruit-mark" aria-hidden="true">
      <svg viewBox="0 0 40 40" fill="none">
        <path d="M20 13c-1-5 1-8 5-10" stroke="#587c52" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M22 8c5-5 11-3 12-2-1 6-5 9-11 8" fill="#84b66c"/>
        <path d="M20 13c-7-5-15 0-15 9 0 8 6 14 15 14s15-6 15-14c0-9-8-14-15-9Z" fill="#ed8669"/>
        <path d="M8 23c2 7 6 10 12 10" stroke="#f6b19a" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <h1 id="title"></h1>
  </header>

  <section class="chart-card" aria-label="Bar chart">
    <svg id="chart" class="chart" viewBox="0 0 360 314" role="img">
      <g id="grid-layer"></g>
      <g id="bars-layer"></g>
      <g id="labels-layer"></g>
    </svg>
  </section>

  <section id="prompt-card" class="prompt-card" aria-live="polite">
    <div class="prompt-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M12 7.5v5l3.2 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16.5 3.5h4v4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <p id="prompt-text" class="prompt-text"></p>
  </section>
  <div id="announcement" class="sr-only" aria-live="polite"></div>
</main>

<script>
(() => {
  const data = Studio.params.data;
  const keys = ["mango", "banana", "apple", "guava", "orange"];
  const words = {};
  for (const key of ["title", ...keys, "yaxis", "ask", "right", "wrong", "done"]) words[key] = Studio.t(key);

  document.getElementById("title").textContent = words.title;
  document.getElementById("prompt-text").textContent = words.ask;

  const svgNS = "http://www.w3.org/2000/svg";
  const gridLayer = document.getElementById("grid-layer");
  const barsLayer = document.getElementById("bars-layer");
  const labelsLayer = document.getElementById("labels-layer");
  const left = 54, right = 348, top = 38, bottom = 242;
  const maxValue = Math.max(...data.map(d => Number(d.value)));
  const step = maxValue <= 10 ? 2 : maxValue <= 20 ? 5 : maxValue <= 50 ? 10 : Math.ceil(maxValue / 5 / 10) * 10;
  const ceiling = Math.ceil(maxValue / step) * step;
  const plotHeight = bottom - top;
  const yAt = value => bottom - (Number(value) / ceiling) * plotHeight;

  function node(tag, attrs, parent) {
    const el = document.createElementNS(svgNS, tag);
    for (const [name, value] of Object.entries(attrs)) el.setAttribute(name, String(value));
    parent.appendChild(el);
    return el;
  }

  for (let tick = 0; tick <= ceiling; tick += step) {
    const y = yAt(tick);
    node("line", { x1: left, y1: y, x2: right, y2: y, class: tick === 0 ? "axis" : "grid" }, gridLayer);
    const label = node("text", { x: left - 9, y, class: "tick-label", "data-tick": tick }, gridLayer);
    label.textContent = tick;
  }

  node("line", { x1: left, y1: top, x2: left, y2: bottom, class: "axis" }, gridLayer);
  const axisTitle = node("text", {
    x: 15, y: (top + bottom) / 2, class: "axis-title",
    transform: `rotate(-90 15 ${(top + bottom) / 2})`
  }, labelsLayer);
  axisTitle.textContent = words.yaxis;

  const barSpace = (right - left) / data.length;
  const barWidth = Math.min(42, barSpace * 0.72);

  data.forEach((item, index) => {
    const x = left + barSpace * index + (barSpace - barWidth) / 2;
    const y = yAt(item.value);
    const height = bottom - y;
    const group = node("g", {
      class: "bar-hit", tabindex: "0", role: "button",
      "aria-label": `${words[item.key]} ${item.value}`, "data-key": item.key,
      transform: `translate(0 0)`
    }, barsLayer);

    const hitRect = node("rect", {
      x: x - 7, y: top, width: barWidth + 14, height: bottom - top,
      fill: "transparent", "pointer-events": "all"
    }, group);

    const bar = node("rect", {
      x, y, width: barWidth, height,
      rx: 8, ry: 8, fill: "#668d7a",
      class: "bar-shape", "data-bar": item.key, "data-value": item.value,
      "pointer-events": "none"
    }, group);
    bar.style.animationDelay = `${index * 70}ms`;

    const bubble = node("g", {
      class: "value-bubble",
      transform: `translate(${x + barWidth / 2} ${Math.max(19, y - 15)})`,
      "pointer-events": "none"
    }, group);
    node("rect", { x: -17, y: -12, width: 34, height: 24, rx: 12 }, bubble);
    const valueText = node("text", { x: 0, y: 1 }, bubble);
    valueText.textContent = item.value;

    const fruitLabel = node("text", { x: x + barWidth / 2, y: bottom + 22, class: "fruit-label" }, labelsLayer);
    fruitLabel.textContent = words[item.key];

    const choose = () => {
      document.querySelectorAll(".value-bubble.visible").forEach(el => el.classList.remove("visible"));
      bubble.classList.add("visible");
      Studio.event("bar_tap", { key: item.key, value: item.value });
      Studio.answer(item.key);
    };
    group.addEventListener("click", choose);
    group.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        choose();
      }
    });
  });

  node("line", { x1: left, y1: bottom, x2: right, y2: bottom, class: "axis" }, gridLayer);

  const promptCard = document.getElementById("prompt-card");
  const promptText = document.getElementById("prompt-text");
  const announcement = document.getElementById("announcement");
  let completed = false;

  Studio.onVerdict(({ correct }) => {
    if (completed) return;
    promptCard.classList.remove("feedback-right", "feedback-wrong");
    if (correct) {
      promptCard.classList.add("feedback-right");
      promptText.textContent = words.right;
      announcement.textContent = words.right;
      completed = true;
      Studio.done();
      promptText.textContent = words.done;
      announcement.textContent = words.done;
    } else {
      promptCard.classList.add("feedback-wrong");
      promptText.textContent = words.wrong;
      announcement.textContent = words.wrong;
    }
  });

  Studio.ready();
})();
</script>
