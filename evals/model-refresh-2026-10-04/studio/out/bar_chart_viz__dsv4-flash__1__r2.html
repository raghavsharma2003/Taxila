<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Roboto, system-ui, sans-serif; background: #fef9ef; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 12px 8px; user-select: none; -webkit-tap-highlight-color: transparent; }
  h1 { font-size: 1.2rem; color: #3d2b1f; margin-bottom: 4px; text-align: center; }
  .chart-wrap { width: 100%; max-width: 340px; background: #fff8ec; border-radius: 24px; padding: 12px 8px 4px 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
  .chart-area { position: relative; width: 100%; overflow: visible; }
  .chart-inner { display: flex; margin-top: 8px; position: relative; }
  .y-axis-col { display: flex; flex-direction: column-reverse; width: 28px; min-width: 28px; pointer-events: none; }
  .tick-label { font-size: 0.6rem; color: #5d4037; width: 24px; text-align: right; padding-right: 4px; }
  .gridline { height: 1px; background: rgba(109,76,65,0.15); width: 100%; }
  .y-axis-wrap { position: relative; height: 200px; margin-bottom: 24px; }
  .bars-container { display: flex; align-items: flex-end; flex: 1; gap: 4px; height: 200px; position: relative; margin-bottom: 24px; }
  .bar-wrapper { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 0; cursor: pointer; position: relative; height: 100%; justify-content: flex-end; }
  .bar { width: 80%; min-width: 28px; max-width: 44px; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, #f9a825 0%, #f57f17 100%); transition: transform 0.15s ease, box-shadow 0.15s ease; box-shadow: 0 -2px 6px rgba(245,127,23,0.3); height: 0; }
  .bar.animate { animation: riseUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  @keyframes riseUp { from { height: 0 !important; } to { height: var(--h); } }
  .bar:active { transform: scale(0.92); box-shadow: 0 0 0 2px #bf360c; }
  .fruit-label { font-size: 0.7rem; color: #4e342e; margin-top: 4px; font-weight: 500; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 48px; }
  .value-tooltip { position: absolute; bottom: calc(100% - 4px); left: 50%; transform: translateX(-50%); background: #3d2b1f; color: white; font-size: 0.75rem; padding: 4px 8px; border-radius: 12px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 5; }
  .bar-wrapper.tapped .value-tooltip { opacity: 1; }
  .yaxis-title { font-size: 0.6rem; color: #5d4037; text-align: center; margin-top: -2px; letter-spacing: 0.3px; }
  .ask-text { font-size: 0.95rem; color: #3d2b1f; background: #fff3e0; padding: 10px 14px; border-radius: 20px; margin: 8px 0; text-align: center; font-weight: 500; border: 1px solid #ffe0b2; }
  .feedback { font-size: 1rem; text-align: center; padding: 10px; border-radius: 20px; margin: 6px 0; min-height: 44px; display: flex; align-items: center; justify-content: center; }
  .feedback.right { background: #e8f5e9; color: #2e7d32; }
  .feedback.wrong { background: #ffebee; color: #c62828; }
  .done-text { font-size: 1rem; color: #2e7d32; text-align: center; padding: 12px; font-weight: 600; }
  .chart-row { display: flex; position: relative; }
</style>

<h1 id="title-el"></h1>
<div class="chart-wrap">
  <div class="chart-area">
    <div class="chart-row">
      <div class="y-axis-wrap">
        <div class="y-axis-col" id="yAxisCol"></div>
      </div>
      <div class="bars-container" id="barsContainer"></div>
    </div>
    <div class="yaxis-title" id="yaxisTitle"></div>
  </div>
</div>
<div id="askEl" class="ask-text"></div>
<div id="feedbackEl" class="feedback"></div>
<div id="doneEl" class="done-text" style="display:none;"></div>

<script>
  (function() {
    const data = Studio.params.data;
    const maxVal = Math.max(...data.map(d => d.value));
    let step = 2;
    if (maxVal > 8) step = 3;
    if (maxVal > 15) step = 4;
    const maxTick = Math.ceil(maxVal / step) * step;
    const ticks = [];
    for (let t = 0; t <= maxTick; t += step) ticks.push(t);

    document.getElementById('title-el').textContent = Studio.t('title');
    document.getElementById('yaxisTitle').textContent = Studio.t('yaxis');
    document.getElementById('askEl').textContent = Studio.t('ask');

    const yAxisCol = document.getElementById('yAxisCol');
    const container = document.getElementById('barsContainer');

    yAxisCol.innerHTML = '';
    container.innerHTML = '';

    const maxH = 200;
    const tickPositions = ticks.map(t => (t / maxTick) * maxH);

    // Build ticks and gridlines
    ticks.forEach((t, i) => {
      const row = document.createElement('div');
      row.style.position = 'absolute';
      row.style.bottom = tickPositions[i] + 'px';
      row.style.left = '0';
      row.style.right = '0';
      row.style.display = 'flex';
      row.style.alignItems = 'center';
      row.style.pointerEvents = 'none';

      const label = document.createElement('span');
      label.className = 'tick-label';
      label.setAttribute('data-tick', t);
      label.textContent = t;
      row.appendChild(label);

      const grid = document.createElement('div');
      grid.className = 'gridline';
      grid.style.flex = '1';
      row.appendChild(grid);

      yAxisCol.appendChild(row);
    });

    // Build bars
    const barFrag = document.createDocumentFragment();

    data.forEach((item) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'bar-wrapper';
      wrapper.setAttribute('data-key', item.key);

      const bar = document.createElement('div');
      bar.className = 'bar';
      const barHeight = (item.value / maxTick) * maxH;
      bar.style.setProperty('--h', barHeight + 'px');
      bar.style.height = '0px';
      bar.setAttribute('data-bar', item.key);
      bar.setAttribute('data-value', item.value);

      const tooltip = document.createElement('div');
      tooltip.className = 'value-tooltip';
      tooltip.textContent = item.value;

      wrapper.appendChild(bar);
      wrapper.appendChild(tooltip);

      const label = document.createElement('div');
      label.className = 'fruit-label';
      label.textContent = Studio.t(item.key);
      wrapper.appendChild(label);

      let answered = false;
      wrapper.addEventListener('click', function(e) {
        if (answered) return;
        document.querySelectorAll('.bar-wrapper.tapped').forEach(el => el.classList.remove('tapped'));
        wrapper.classList.add('tapped');
        Studio.answer(item.key);
      });

      barFrag.appendChild(wrapper);
    });

    container.appendChild(barFrag);

    // Animate bars
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const bars = document.querySelectorAll('.bar');
        bars.forEach((bar, i) => {
          setTimeout(() => {
            bar.classList.add('animate');
            bar.style.height = bar.style.getPropertyValue('--h') || '0px';
          }, i * 70);
        });
      });
    });

    Studio.onVerdict(function(result) {
      const fb = document.getElementById('feedbackEl');
      const doneEl = document.getElementById('doneEl');
      if (result.correct) {
        fb.textContent = Studio.t('right');
        fb.className = 'feedback right';
        setTimeout(() => {
          fb.style.display = 'none';
          doneEl.textContent = Studio.t('done');
          doneEl.style.display = 'block';
          Studio.done();
        }, 800);
      } else {
        fb.textContent = Studio.t('wrong');
        fb.className = 'feedback wrong';
        document.querySelectorAll('.bar-wrapper.tapped').forEach(el => el.classList.remove('tapped'));
      }
    });

    Studio.ready();
  })();
</script>
