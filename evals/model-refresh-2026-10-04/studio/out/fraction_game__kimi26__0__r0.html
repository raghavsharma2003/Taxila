<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#fff8f0;font-family:system-ui,-apple-system,sans-serif;color:#4e342e;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:360px;padding:16px;display:flex;flex-direction:column;align-items:center}
.screen{width:100%}
h1{font-size:1.6rem;margin:0.6rem 0;text-align:center;color:#bf360c}
.instr{font-size:1rem;text-align:center;margin-bottom:0.8rem;line-height:1.4}
.fraction{display:flex;flex-direction:column;align-items:center;font-size:2.6rem;font-weight:700;margin:0.2rem 0 1rem;color:#bf360c}
.fraction .line{width:56px;height:4px;background:#bf360c;border-radius:2px;margin:3px 0}
#itemContainer{width:100%;display:flex;flex-direction:column;align-items:center;transition:opacity .3s ease}
#shapeSvg{width:280px;height:280px;overflow:visible;filter:drop-shadow(0 4px 6px rgba(0,0,0,.1));touch-action:manipulation}
.slice{fill:#fff3e0;stroke:#e65100;stroke-width:2;transition:fill .3s ease,transform .15s ease;cursor:pointer;transform-origin:100px 100px}
.slice.shaded{fill:#ffb74d}
.slice.tap-bump{transform:scale(.92)}
.bar-segment{fill:#fff3e0;stroke:#e65100;stroke-width:2;transition:fill .3s ease,transform .15s ease;cursor:pointer}
.bar-segment.shaded{fill:#ffb74d}
.bar-segment.tap-bump{transform:scale(.92)}
.feedback{min-height:2.4rem;margin:0.8rem 0;text-align:center;font-size:1.1rem;font-weight:600;opacity:0;transition:opacity .3s ease}
.feedback.right{color:#2e7d32;opacity:1}
.feedback.wrong{color:#c62828;opacity:1}
.check-btn{background:#ff7043;color:#fff;border:none;border-radius:50px;padding:14px 36px;font-size:1.25rem;font-weight:700;cursor:pointer;min-width:220px;min-height:52px;box-shadow:0 4px 0 #d84315;transition:transform .1s ease,box-shadow .1s ease;margin:0.5rem 0 2rem}
.check-btn:active{transform:translateY(4px);box-shadow:0 0 0 #d84315}
.celebrate{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.shake{animation:shake .4s ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.done-screen{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;min-height:100vh}
.done-screen svg{animation:pop .6s ease}
</style>
<div class="app">
  <div id="gameScreen" class="screen">
    <h1 id="title"></h1>
    <p id="instr" class="instr"></p>
    <div id="itemContainer" data-item="">
      <div class="fraction"><span id="num"></span><span class="line"></span><span id="den"></span></div>
      <svg id="shapeSvg" viewBox="0 0 200 200"></svg>
      <div id="feedback" class="feedback"></div>
    </div>
    <button id="checkBtn" class="check-btn" data-action="check"></button>
  </div>
  <div id="doneScreen" class="done-screen">
    <svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="55" fill="#81c784"/><path d="M35 62 L50 77 L85 42" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1 id="doneText"></h1>
  </div>
</div>
<script>
(function(){
'use strict';
var items=Studio.params.items||[];
var picture=Studio.params.picture||'pizza';
var current=0;
var ns='http://www.w3.org/2000/svg';
var els={
  gameScreen:document.getElementById('gameScreen'),
  doneScreen:document.getElementById('doneScreen'),
  container:document.getElementById('itemContainer'),
  title:document.getElementById('title'),
  instr:document.getElementById('instr'),
  num:document.getElementById('num'),
  den:document.getElementById('den'),
  svg:document.getElementById('shapeSvg'),
  feedback:document.getElementById('feedback'),
  checkBtn:document.getElementById('checkBtn'),
  doneText:document.getElementById('doneText')
};

function init(){
  els.title.textContent=Studio.t('title');
  els.instr.textContent=Studio.t('instr');
  els.checkBtn.textContent=Studio.t('check');
  els.doneText.textContent=Studio.t('done');
  els.svg.addEventListener('click',onSvgTap);
  els.checkBtn.addEventListener('click',onCheck);
  Studio.onVerdict(handleVerdict);
  if(items.length===0){showDone();return;}
  renderItem(0);
  Studio.ready();
}

function renderItem(idx){
  var item=items[idx];
  els.container.setAttribute('data-item',item.id);
  els.num.textContent=String(item.n);
  els.den.textContent=String(item.d);
  els.feedback.textContent='';
  els.feedback.className='feedback';
  els.svg.className='';
  els.svg.innerHTML='';
  if(String(picture).indexOf('pizza')!==-1){buildPizza(item.d);}else{buildBar(item.d);}
}

function buildPizza(d){
  var cx=100,cy=100,r=90;
  var step=2*Math.PI/d;
  var large=step>Math.PI?1:0;
  for(var i=0;i<d;i++){
    var a1=i*step-Math.PI/2;
    var a2=(i+1)*step-Math.PI/2;
    var x1=cx+r*Math.cos(a1);
    var y1=cy+r*Math.sin(a1);
    var x2=cx+r*Math.cos(a2);
    var y2=cy+r*Math.sin(a2);
    var dStr='M '+cx+' '+cy+' L '+x1+' '+y1+' A '+r+' '+r+' 0 '+large+' 1 '+x2+' '+y2+' Z';
    var path=document.createElementNS(ns,'path');
    path.setAttribute('d',dStr);
    path.setAttribute('data-part',String(i));
    path.setAttribute('data-shaded','false');
    path.setAttribute('class','slice');
    els.svg.appendChild(path);
  }
}

function buildBar(d){
  var totalW=200,h=120,gap=4;
  var w=(totalW-gap*(d+1))/d;
  var y0=(200-h)/2;
  for(var i=0;i<d;i++){
    var x=gap+i*(w+gap);
    var rect=document.createElementNS(ns,'rect');
    rect.setAttribute('x',x);
    rect.setAttribute('y',y0);
    rect.setAttribute('width',w);
    rect.setAttribute('height',h);
    rect.setAttribute('rx',6);
    rect.setAttribute('data-part',String(i));
    rect.setAttribute('data-shaded','false');
    rect.setAttribute('class','bar-segment');
    els.svg.appendChild(rect);
  }
}

function onSvgTap(e){
  var el=e.target.closest('[data-part]');
  if(!el)return;
  var shaded=el.getAttribute('data-shaded')==='true';
  var next=!shaded;
  el.setAttribute('data-shaded',String(next));
  el.classList.toggle('shaded',next);
  el.classList.add('tap-bump');
  setTimeout(function(){el.classList.remove('tap-bump');},180);
  Studio.event('part_toggle',{part:+el.getAttribute('data-part'),shaded:next});
}

function getShadedCount(){
  return els.svg.querySelectorAll('[data-shaded="true"]').length;
}

function onCheck(){
  if(current>=items.length)return;
  var count=getShadedCount();
  var d=items[current].d;
  Studio.event('check',{n:count,d:d});
  Studio.answer({n:count,d:d});
}

function handleVerdict(result){
  if(result.correct){
    els.feedback.textContent=Studio.t('right');
    els.feedback.className='feedback right';
    els.svg.classList.add('celebrate');
    setTimeout(function(){
      current++;
      if(current>=items.length){
        showDone();
      }else{
        els.container.style.opacity='0';
        setTimeout(function(){
          renderItem(current);
          els.container.style.opacity='1';
        },250);
      }
    },1200);
  }else{
    els.feedback.textContent=Studio.t('wrong')+' '+Studio.t('hint');
    els.feedback.className='feedback wrong';
    els.container.classList.add('shake');
    setTimeout(function(){els.container.classList.remove('shake');},400);
  }
}

function showDone(){
  els.gameScreen.style.display='none';
  els.doneScreen.style.display='flex';
  Studio.done();
}

init();
})();
</script>
