<style>
  *{box-sizing:border-box}
  :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#24324a}
  .wrap{width:100%;max-width:560px;min-height:100vh;margin:0 auto;padding:12px 8px 20px;background:linear-gradient(180deg,#fff8e9 0%,#eefaff 100%);overflow:hidden}
  .card{background:rgba(255,255,255,.96);border:2px solid #dcecf3;border-radius:24px;box-shadow:0 10px 28px rgba(44,86,110,.12);padding:14px 6px 12px}
  h1{margin:0 8px 6px;text-align:center;font-size:clamp(22px,7vw,30px);line-height:1.15;color:#183b56}
  .ask{min-height:48px;margin:2px 10px 8px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:18px;font-weight:750;line-height:1.3;color:#40566d}
  .chart-shell{position:relative;width:100%;border-radius:18px;background:#fbfdff;overflow:hidden}
  svg{display:block;width:100%;height:auto;touch-action:manipulation}
  .grid{stroke:#dbe8ee;stroke-width:1}
  .axis{stroke:#78909c;stroke-width:2}
  .tick{fill:#526778;font-size:12px;font-weight:650}
  .axis-title{fill:#40566d;font-size:13px;font-weight:750}
  .fruit{fill:#334e62;font-size:10px;font-weight:750}
  .bar{fill:#ef8b62;stroke:#d96f4d;stroke-width:2;cursor:pointer;transition:clip-path .7s cubic-bezier(.22,.85,.3,1),filter .18s ease,stroke-width .18s ease;outline:none;clip-path:inset(0 0 0 0 round 10px)}
  .bar.intro{clip-path:inset(100% 0 0 0 round 10px)}
  .bar:hover,.bar:focus-visible{filter:brightness(1.06) drop-shadow(0 4px 4px rgba(38,79,99,.2))}
  .bar:active{filter:brightness(.94) drop-shadow(0 2px 2px rgba(38,79,99,.18))}
  .bar.chosen{stroke:#183b56;stroke-width:4;filter:drop-shadow(0 5px 5px rgba(38,79,99,.22))}
  .value-label{fill:#183b56;font-size:15px;font-weight:850;text-anchor:middle;opacity:0;transform:translateY(5px);transition:opacity .18s ease,transform .18s ease;pointer-events:none}
  .value-label.show{opacity:1;transform:translateY(0)}
  .feedback{min-height:52px;margin:8px 8px 0;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;font-weight:850;line-height:1.2;opacity:0;transform:scale(.94);transition:opacity .2s ease,transform .25s cubic-bezier(.2,.9,.3,1.25),background .2s ease}
  .feedback.show{opacity:1;transform:scale(1)}
  .feedback.good{color:#176b48;background:#dff7e9}
  .feedback.try{color:#934522;background:#fff0df;animation:wobble .35s ease}
  .done{min-height:28px;margin:6px 8px 0;text-align:center;font-size:18px;font-weight:800;color:#176b48}
  @keyframes wobble{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
  @media(max-width:390px){.wrap{padding-top:8px}.card{padding-top:12px}}
  @media(prefers-reduced-motion:reduce){.bar,.value-label,.feedback{transition:none}.feedback.try{animation:none}}
</style>

<main class="wrap">
  <section class="card">
    <h1 id="title"></h1>
    <div class="ask" id="ask"></div>
    <div class="chart-shell">
      <svg id="chart" viewBox="0 0 340 380" role="img" aria-labelledby="title">
        <g id="grid"></g>
        <g id="axes"></g>
        <g id="bars"></g>
        <g id="labels"></g>
      </svg>
    </div>
    <div id="feedback" class="feedback" aria-live="polite"></div>
    <div id="done" class="done" aria-live="polite"></div>
  </section>
</main>

<script>
(() => {
  const data = Studio.params.data;
  const title = document.getElementById("title");
  const ask = document.getElementById("ask");
  const grid = document.getElementById("grid");
  const axes = document.getElementById("axes");
  const bars = document.getElementById("bars");
  const labels = document.getElementById("labels");
  const feedback = document.getElementById("feedback");
  const done = document.getElementById("done");
  const ns = "http://www.w3.org/2000/svg";

  title.textContent = Studio.t("title");
  ask.textContent = Studio.t("ask");

  const make = (name, attrs, text) => {
    const node = document.createElementNS(ns, name);
    Object.keys(attrs || {}).forEach(key => node.setAttribute(key, attrs[key]));
    if (text !== undefined) node.textContent = text;
    return node;
  };

  const maximum = Math.max(...data.map(item => item.value));
  const rough = maximum / data.length;
  const power = Math.pow(10, Math.floor(Math.log10(rough || 1)));
  const scaled = rough / power;
  const unit = scaled <= 1 ? 1 : scaled <= 2 ? 2 : scaled <= 5 ? 5 : 10;
  const step = unit * power;
  const scaleMax = Math.ceil(maximum / step) * step;

  const left = 58;
  const right = 328;
  const top = 28;
  const baseline = 294;
  const plotHeight = baseline - top;
  const band = (right - left) / data.length;
  const barWidth = Math.min(48, band - 4);
  const yFor = value => baseline - (value / scaleMax) * plotHeight;

  for (let tick = 0; tick <= scaleMax; tick += step) {
    const y = yFor(tick);
    grid.appendChild(make("line", {x1:left, y1:y, x2:right, y2:y, class:"grid"}));
    grid.appendChild(make("text", {
      x:left - 9,
      y:y,
      "text-anchor":"end",
      "dominant-baseline":"middle",
      class:"tick",
      "data-tick":String(tick)
    }, String(tick)));
  }

  axes.appendChild(make("line", {x1:left, y1:top, x2:left, y2:baseline, class:"axis"}));
  axes.appendChild(make("line", {x1:left, y1:baseline, x2:right, y2:baseline, class:"axis"}));
  axes.appendChild(make("text", {
    x:17,
    y:(top + baseline) / 2,
    transform:`rotate(-90 17 ${(top + baseline) / 2})`,
    "text-anchor":"middle",
    class:"axis-title"
  }, Studio.t("yaxis")));

  let waiting = false;
  let finished = false;
  let selected = null;

  const selectBar = (item, rect, valueText) => {
    if (waiting || finished) return;
    bars.querySelectorAll(".bar").forEach(node => node.classList.remove("chosen"));
    labels.querySelectorAll(".value-label").forEach(node => node.classList.remove("show"));
    rect.classList.add("chosen");
    valueText.classList.add("show");
    feedback.className = "feedback";
    feedback.textContent = "";
    selected = {item, rect, valueText};
    waiting = true;
    Studio.event("bar_tap", {key:item.key, value:item.value});
    Studio.answer(item.key);
  };

  data.forEach((item, index) => {
    const center = left + band * index + band / 2;
    const y = yFor(item.value);
    const height = baseline - y;

    const rect = make("rect", {
      x:center - barWidth / 2,
      y:y,
      width:barWidth,
      height:height,
      rx:10,
      class:"bar intro",
      tabindex:"0",
      role:"button",
      "aria-label":Studio.t(item.key),
      "data-bar":item.key,
      "data-value":String(item.value)
    });

    const valueText = make("text", {
      x:center,
      y:Math.max(top + 15, y - 9),
      class:"value-label"
    }, String(item.value));

    rect.addEventListener("click", () => selectBar(item, rect, valueText));
    rect.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        selectBar(item, rect, valueText);
      }
    });

    bars.appendChild(rect);
    labels.appendChild(valueText);
    labels.appendChild(make("text", {
      x:center,
      y:320,
      "text-anchor":"middle",
      class:"fruit"
    }, Studio.t(item.key)));
  });

  Studio.onVerdict(result => {
    if (!waiting || finished) return;
    waiting = false;

    if (result.correct) {
      finished = true;
      feedback.textContent = Studio.t("right");
      feedback.className = "feedback good show";
      done.textContent = Studio.t("done");
      bars.querySelectorAll(".bar").forEach(node => {
        node.setAttribute("tabindex", "-1");
        node.style.cursor = "default";
      });
      Studio.event("verdict", {correct:true, key:selected.item.key});
      Studio.done();
    } else {
      feedback.textContent = Studio.t("wrong");
      feedback.className = "feedback try show";
      Studio.event("verdict", {correct:false, key:selected.item.key});
    }
  });

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      bars.querySelectorAll(".bar").forEach(node => node.classList.remove("intro"));
    });
  });

  Studio.ready();
})();
</script>
