<style>
  :host, * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Trebuchet MS", system-ui, sans-serif;
    background: #fff7ec;
    color: #3a2a1d;
    overflow-x: hidden;
  }
  .app {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    padding: 12px 14px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 100vh;
  }
  .app-title {
    font-size: 1.25rem;
    font-weight: 800;
    color: #c2452d;
    text-align: center;
    letter-spacing: .3px;
  }
  .instr {
    font-size: .95rem;
    line-height: 1.35;
    text-align: center;
    color: #6b4a34;
    background: #fff1dd;
    border-radius: 14px;
    padding: 8px 12px;
  }
  .stage {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 240px;
    padding: 6px 0;
  }
  .stage svg { display: block; width: 100%; height: auto; max-width: 320px; touch-action: manipulation; }

  .fraction-card {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #ffffff;
    border: 3px solid #ffcf8a;
    border-radius: 18px;
    padding: 8px 16px;
    box-shadow: 0 4px 0 #f3dcc0;
  }
  .fraction-label { font-size: .9rem; color: #8a6a50; font-weight: 700; }
  .frac {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    font-weight: 800;
    font-size: 1.5rem;
    color: #2f7d5c;
    line-height: 1;
  }
  .frac .num { padding: 0 4px 2px; }
  .frac .bar { width: 100%; height: 4px; background: #2f7d5c; border-radius: 3px; }
  .frac .den { padding: 2px 4px 0; }

  .feedback {
    min-height: 26px;
    text-align: center;
    font-size: 1rem;
    font-weight: 700;
    transition: opacity .25s ease;
    opacity: 0;
  }
  .feedback.show { opacity: 1; }
  .feedback.good { color: #2f9d63; }
  .feedback.bad { color: #d15f3a; }

  .check-btn {
    align-self: center;
    min-width: 180px;
    min-height: 52px;
    padding: 12px 28px;
    border: none;
    border-radius: 26px;
    background: linear-gradient(#ffb347, #f38f1d);
    color: #fff;
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: .4px;
    cursor: pointer;
    box-shadow: 0 5px 0 #cf7311;
    transition: transform .12s ease, box-shadow .12s ease, opacity .2s ease;
  }
  .check-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #cf7311; }
  .check-btn[disabled] { opacity: .55; }

  .part { cursor: pointer; transition: fill .3s ease, transform .15s ease; transform-origin: center; }
  .part:active { transform: scale(.96); }
  .part-hot { animation: pop .35s ease; }
  @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.06); } 100% { transform: scale(1); } }

  .celebrate { animation: glow 1.1s ease; }
  @keyframes glow {
    0% { filter: drop-shadow(0 0 0 rgba(47,157,99,0)); }
    40% { filter: drop-shadow(0 0 14px rgba(47,157,99,.85)); }
    100% { filter: drop-shadow(0 0 0 rgba(47,157,99,0)); }
  }
  .shake { animation: wob .45s ease; }
  @keyframes wob {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .done-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 40px 16px;
    text-align: center;
  }
  .done-face { font-size: 4rem; animation: bob 2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .done-text { font-size: 1.5rem; font-weight: 800; color: #2f7d5c; }
</style>

<div class="app" id="app">
  <div class="app-title" id="title"></div>
  <div class="instr" id="instr"></div>

  <div id="itemArea">
    <div class="stage" id="stage"></div>
    <div class="fraction-card">
      <span class="fraction-label" id="hintLabel"></span>
      <span class="frac" id="targetFrac">
        <span class="num" id="fracNum"></span>
        <span class="bar"></span>
        <span class="den" id="fracDen"></span>
      </span>
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="check-btn" data-action="check" id="checkBtn"></button>
  </div>

  <div id="doneArea" style="display:none"></div>
</div>

<script>
(function () {
  var params = Studio.params || {};
  var items = (params.items || []).slice();
  var picture = params.picture || "pizza-or-bar";

  var titleEl = document.getElementById("title");
  var instrEl = document.getElementById("instr");
  var itemArea = document.getElementById("itemArea");
  var stageEl = document.getElementById("stage");
  var hintLabel = document.getElementById("hintLabel");
  var fracNum = document.getElementById("fracNum");
  var fracDen = document.getElementById("fracDen");
  var feedbackEl = document.getElementById("feedback");
  var checkBtn = document.getElementById("checkBtn");
  var doneArea = document.getElementById("doneArea");

  titleEl.textContent = Studio.t("title");
  instrEl.textContent = Studio.t("instr");
  checkBtn.textContent = Studio.t("check");
  hintLabel.textContent = Studio.t("hint");

  var NS = "http://www.w3.org/2000/svg";
  var current = 0;
  var parts = [];
  var locked = false;
  var complete = false;

  function makeSVG(d, usePizza) {
    var size = 260;
    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 " + size + " " + size);
    svg.setAttribute("role", "group");
    var cx = size / 2, cy = size / 2;

    parts = [];
    var R = size / 2 - 12;

    if (usePizza) {
      var bg = document.createElementNS(NS, "circle");
      bg.setAttribute("cx", cx); bg.setAttribute("cy", cy); bg.setAttribute("r", R + 6);
      bg.setAttribute("fill", "#f2c98a");
      svg.appendChild(bg);
      for (var i = 0; i < d; i++) {
        var a0 = (i / d) * 2 * Math.PI - Math.PI / 2;
        var a1 = ((i + 1) / d) * 2 * Math.PI - Math.PI / 2;
        var x0 = cx + R * Math.cos(a0), y0 = cy + R * Math.sin(a0);
        var x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
        var large = (a1 - a0) > Math.PI ? 1 : 0;
        var path = document.createElementNS(NS, "path");
        var dstr = "M " + cx + " " + cy +
          " L " + x0.toFixed(2) + " " + y0.toFixed(2) +
          " A " + R + " " + R + " 0 " + large + " 1 " + x1.toFixed(2) + " " + y1.toFixed(2) + " Z";
        path.setAttribute("d", dstr);
        path.setAttribute("stroke", "#b5651d");
        path.setAttribute("stroke-width", "2");
        path.setAttribute("stroke-linejoin", "round");
        path.setAttribute("class", "part");
        parts.push(path);
        svg.appendChild(path);
      }
      var rim = document.createElementNS(NS, "circle");
      rim.setAttribute("cx", cx); rim.setAttribute("cy", cy); rim.setAttribute("r", R + 4);
      rim.setAttribute("fill", "none");
      rim.setAttribute("stroke", "#c47a2e");
      rim.setAttribute("stroke-width", "6");
      svg.appendChild(rim);
    } else {
      var barW = size - 20, barH = 120;
      var bx = 10, by = (size - barH) / 2;
      var bw = barW / d;
      var frame = document.createElementNS(NS, "rect");
      frame.setAttribute("x", bx - 4); frame.setAttribute("y", by - 4);
      frame.setAttribute("width", barW + 8); frame.setAttribute("height", barH + 8);
      frame.setAttribute("rx", "14");
      frame.setAttribute("fill", "#f2c98a");
      svg.appendChild(frame);
      for (var j = 0; j < d; j++) {
        var rx = bx + j * bw;
        var rect = document.createElementNS(NS, "rect");
        rect.setAttribute("x", rx.toFixed(2));
        rect.setAttribute("y", by);
        rect.setAttribute("width", bw.toFixed(2));
        rect.setAttribute("height", barH);
        rect.setAttribute("stroke", "#b5651d");
        rect.setAttribute("stroke-width", "2");
        rect.setAttribute("class", "part");
        parts.push(rect);
        svg.appendChild(rect);
      }
      var fr2 = document.createElementNS(NS, "rect");
      fr2.setAttribute("x", bx - 2); fr2.setAttribute("y", by - 2);
      fr2.setAttribute("width", barW + 4); fr2.setAttribute("height", barH + 4);
      fr2.setAttribute("rx", "12");
      fr2.setAttribute("fill", "none");
      fr2.setAttribute("stroke", "#c47a2e");
      fr2.setAttribute("stroke-width", "4");
      svg.appendChild(fr2);
    }
    return svg;
  }

  function setShade(el, shaded) {
    el.setAttribute("data-shaded", shaded ? "true" : "false");
    el.setAttribute("fill", shaded ? "#2f9d63" : "#fff6e4");
  }

  function renderItem(idx) {
    var item = items[idx];
    stageEl.innerHTML = "";
    feedbackEl.textContent = "";
    feedbackEl.className = "feedback";
    locked = false;

    var wrap = document.createElement("div");
    wrap.setAttribute("data-item", item.id);
    wrap.style.display = "flex";
    wrap.style.justifyContent = "center";
    wrap.style.width = "100%";

    var usePizza = picture === "pizza" || (picture !== "bar" && idx % 2 === 0);
    var svg = makeSVG(item.d, usePizza);
    wrap.appendChild(svg);
    stageEl.appendChild(wrap);

    fracNum.textContent = String(item.n);
    fracDen.textContent = String(item.d);

    parts.forEach(function (p, i) {
      p.setAttribute("data-part", String(i));
      setShade(p, false);
      p.addEventListener("click", function () {
        if (locked) return;
        var shaded = p.getAttribute("data-shaded") === "true";
        setShade(p, !shaded);
        p.classList.remove("part-hot");
        void p.offsetWidth;
        p.classList.add("part-hot");
        Studio.event("part_toggle", { item: item.id, index: i });
      });
      p.addEventListener("animationend", function () { p.classList.remove("part-hot"); });
    });

    checkBtn.disabled = false;
    Studio.event("item_shown", { id: item.id });
  }

  checkBtn.addEventListener("click", function () {
    if (locked) return;
    var item = items[current];
    var count = parts.filter(function (p) { return p.getAttribute("data-shaded") === "true"; }).length;
    Studio.event("check", { id: item.id, n: count, d: item.d });
    Studio.answer({ n: count, d: item.d });
  });

  Studio.onVerdict(function (result) {
    var item = items[current];
    if (result && result.correct) {
      locked = true;
      checkBtn.disabled = true;
      feedbackEl.textContent = Studio.t("right");
      feedbackEl.className = "feedback show good";
      itemArea.classList.remove("shake");
      itemArea.classList.add("celebrate");
      Studio.event("correct", { id: item.id });
      setTimeout(function () {
        itemArea.classList.remove("celebrate");
        current++;
        if (current >= items.length) {
          showDone();
        } else {
          renderItem(current);
        }
      }, 1150);
    } else {
      feedbackEl.textContent = Studio.t("wrong");
      feedbackEl.className = "feedback show bad";
      itemArea.classList.remove("shake");
      void itemArea.offsetWidth;
      itemArea.classList.add("shake");
      Studio.event("wrong", { id: item.id });
      setTimeout(function () { itemArea.classList.remove("shake"); }, 500);
    }
  });

  function showDone() {
    if (complete) return;
    complete = true;
    itemArea.style.display = "none";
    instrEl.style.display = "none";
    doneArea.style.display = "block";
    doneArea.className = "done-screen";
    doneArea.innerHTML = "";
    var face = document.createElement("div");
    face.className = "done-face";
    face.textContent = "\uD83C\uDF55";
    var txt = document.createElement("div");
    txt.className = "done-text";
    txt.textContent = Studio.t("done");
    doneArea.appendChild(face);
    doneArea.appendChild(txt);
    Studio.event("complete", {});
    Studio.done();
  }

  if (items.length === 0) {
    showDone();
  } else {
    renderItem(0);
  }

  Studio.ready();
})();
</script>
