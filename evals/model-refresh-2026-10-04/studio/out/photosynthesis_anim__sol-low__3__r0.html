<style>
  *{box-sizing:border-box}
  :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#173b35}
  .app{width:100%;max-width:360px;height:640px;margin:0 auto;overflow:hidden;background:linear-gradient(#e9f8ff 0 55%,#fff9e8 100%);padding:8px;display:flex;flex-direction:column;gap:6px}
  .title{height:32px;margin:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;font-weight:800;color:#165c4e}
  .scene{display:block;width:100%;height:304px;border-radius:22px;background:linear-gradient(#dff6ff 0 72%,#f0c982 72% 100%);box-shadow:0 5px 16px #285f5530;overflow:hidden}
  .ray{stroke:#ffd84c;stroke-width:5;stroke-linecap:round;opacity:.72;animation:rayPulse 1.5s ease-in-out infinite}
  .sun-disc{fill:#ffd84c;stroke:#f5a927;stroke-width:4;transform-origin:59px 48px;animation:sunPulse 2.2s ease-in-out infinite}
  .stem{fill:none;stroke:#39965a;stroke-width:12;stroke-linecap:round}
  .leaf-shape{fill:#51bd68;stroke:#247c46;stroke-width:4;transition:filter .35s,transform .35s;transform-origin:190px 145px}
  .vein{fill:none;stroke:#23814b;stroke-width:3;stroke-linecap:round}
  .root-line{fill:none;stroke:#8c572d;stroke-width:6;stroke-linecap:round}
  .glow{fill:#ffe56a;opacity:.35;transform-origin:188px 146px;animation:glucoseGlow 1.5s ease-in-out infinite}
  .particle{stroke:#fff;stroke-width:1.5;filter:drop-shadow(0 1px 2px #17433c55)}
  [data-flow="water"]{fill:#38aef0}
  [data-flow="co2"]{fill:#7d69c5}
  [data-flow="o2"]{fill:#f7f7ff;stroke:#64a6bb}
  .label{font-size:12px;font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;fill:#174b43}
  .flow-label{font-size:11px}
  .scene.step-1 .sun-disc,.scene.step-1 .ray{filter:drop-shadow(0 0 8px #ffd84c)}
  .scene.step-2 [data-flow="water"]{filter:drop-shadow(0 0 5px #058cd8)}
  .scene.step-3 [data-flow="co2"]{filter:drop-shadow(0 0 5px #624bc5)}
  .scene.step-4 .leaf-shape,.scene.step-4 .glow{filter:drop-shadow(0 0 10px #ffe147)}
  .scene.step-5 [data-flow="o2"]{filter:drop-shadow(0 0 5px #42a4c7)}
  .scene:not(.step-2) [data-flow="water"],.scene:not(.step-3) [data-flow="co2"],.scene:not(.step-5) [data-flow="o2"]{opacity:.48}
  .controls{display:grid;grid-template-columns:56px 1fr;gap:6px;height:96px}
  button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  button:active{transform:scale(.94)}
  .play{min-width:44px;border-radius:16px;background:#176f61;color:#fff;font-size:12px;font-weight:800;box-shadow:0 4px 0 #0c5146;transition:transform .12s}
  .steps-wrap{display:flex;flex-direction:column;gap:5px;min-width:0}
  .steps{height:44px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
  .step{min-width:44px;min-height:44px;border-radius:14px;background:#fff;color:#28745e;font-weight:900;box-shadow:0 2px 7px #285f5530;transition:background .2s,color .2s,transform .12s}
  .step.active{background:#ffce4a;color:#5e4500;box-shadow:0 0 0 3px #fff,0 3px 8px #b07e2744;transform:translateY(-2px)}
  .caption{height:41px;border-radius:12px;background:#ffffffd9;padding:5px 9px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;font-weight:700;line-height:1.2;overflow:hidden}
  .check{flex:1;min-height:0;border-radius:18px;background:#fff;padding:7px 8px 8px;box-shadow:0 4px 13px #285f5526}
  .ask{height:31px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;font-weight:800;line-height:1.15}
  .options{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .option{height:48px;border-radius:15px;background:#eaf8f3;color:#176858;border:2px solid #84cbb8;font-size:14px;font-weight:900;transition:transform .12s,background .2s}
  .option:disabled{opacity:.65}
  .feedback{height:22px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900}
  .feedback.good{color:#198754;animation:pop .45s ease}
  .feedback.try{color:#d17b1d;animation:shake .35s ease}
  @keyframes sunPulse{50%{transform:scale(1.08)}}
  @keyframes rayPulse{50%{opacity:.35}}
  @keyframes glucoseGlow{50%{opacity:.8;transform:scale(1.18)}}
  @keyframes pop{50%{transform:scale(1.4)}}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  @media (prefers-reduced-motion:reduce){.ray,.sun-disc,.glow{animation:none}}
</style>

<main class="app">

    </g>

    <path class="stem" d="M172 242 C170 213 171 180 178 146"/>

      <circle data-flow="water" r="5" cx="164" cy="254"/>

      <circle data-flow="water" r="5" cx="174" cy="198"/>

      <circle data-flow="co2" r="6" cx="325" cy="104"/>
      <circle data-flow="co2" r="6" cx="306" cy="119"/>
      <circle data-flow="co2" r="6" cx="288" cy="133"/>
      <circle data-flow="co2" r="6" cx="270" cy="143"/>

      <circle data-flow="o2" r="6" cx="248" cy="126"/>
      <circle data-flow="o2" r="6" cx="270" cy="106"/>
      <circle data-flow="o2" r="6" cx="292" cy="86"/>
      <circle data-flow="o2" r="6" cx="314" cy="67"/>
    </g>

    <text class="label" data-label="sun" x="16" y="18"></text>
    <text class="label" data-label="leaf" x="213" y="190" text-anchor="middle"></text>
    <text class="label" data-label="roots" x="171" y="301" text-anchor="middle"></text>
    <text class="label flow-label" data-label="water" x="91" y="231"></text>
    <text class="label flow-label" data-label="co2" x="286" y="158"></text>
    <text class="label flow-label" data-label="o2" x="291" y="51"></text>
    <text class="label flow-label" data-label="glucose" x="202" y="108" text-anchor="middle"></text>
  </svg>

  <section class="controls">
    <button class="play" type="button" data-action="play"></button>
    <div class="steps-wrap">
      <div class="steps">
        <button class="step active" type="button" data-action="step-1"></button>
        <button class="step" type="button" data-action="step-2"></button>
        <button class="step" type="button" data-action="step-3"></button>
        <button class="step" type="button" data-action="step-4"></button>
        <button class="step" type="button" data-action="step-5"></button>
      </div>
      <div class="caption" data-caption></div>
    </div>
  </section>

  <section class="check">
    <div class="ask" data-i18n="ask"></div>
    <div class="options">
      <button class="option" type="button" data-option="co2"></button>
      <button class="option" type="button" data-option="o2"></button>
      <button class="option" type="button" data-option="water"></button>
    </div>
    <div class="feedback" aria-live="polite"></div>
  </section>
</main>

<script>
(() => {
  const params = Studio.params;
  const scene = document.querySelector(".scene");
  const playButton = document.querySelector('[data-action="play"]');
  const stepButtons = [...document.querySelectorAll(".step")];
  const caption = document.querySelector("[data-caption]");
  const options = [...document.querySelectorAll("[data-option]")];
  const feedback = document.querySelector(".feedback");
  const flowNodes = {
    water: [...document.querySelectorAll('[data-flow="water"]')],
    co2: [...document.querySelectorAll('[data-flow="co2"]')],
    o2: [...document.querySelectorAll('[data-flow="o2"]')]
  };

  document.querySelectorAll("[data-i18n]").forEach(node => {
    node.textContent = Studio.t(node.dataset.i18n);
  });
  document.querySelectorAll("[data-label]").forEach(node => {
    node.textContent = Studio.t(node.dataset.label);
  });
  options.forEach(node => {
    node.textContent = Studio.t(node.dataset.option);
  });

  const totalSteps = params.steps;
  let currentStep = 0;
  let playing = true;
  let lastStepChange = performance.now();
  let previousFrame = performance.now();
  let elapsed = 0;
  let pending = false;
  let completed = false;

  stepButtons.forEach((button, index) => {
    button.textContent = String(index + 1);
    if (index >= totalSteps) button.hidden = true;
    button.addEventListener("click", () => {
      setStep(index, true);
      Studio.event("step", {step:index + 1});
    });
  });

  function setStep(index, restartClock) {
    currentStep = ((index % totalSteps) + totalSteps) % totalSteps;
    scene.className.baseVal = "scene step-" + (currentStep + 1);
    stepButtons.forEach((button, buttonIndex) => {
      button.classList.toggle("active", buttonIndex === currentStep);
    });
    caption.textContent = Studio.t("step" + (currentStep + 1));
    if (restartClock) lastStepChange = performance.now();
  }

  function updatePlayLabel() {
    playButton.textContent = Studio.t(playing ? "pause" : "play");
  }

  playButton.addEventListener("click", () => {
    playing = !playing;
    previousFrame = performance.now();
    lastStepChange = previousFrame;
    updatePlayLabel();
    Studio.event("play_toggle", {playing});
  });

  const paths = {
    water: t => {
      const y = 278 - t * 142;
      const x = 151 + t * 29 + Math.sin(t * Math.PI * 2) * 3;
      return [x, y];
    },
    co2: t => [331 - t * 93, 93 + t * 49],
    o2: t => [238 + t * 99, 130 - t * 75]
  };

  function moveFlow(key, time) {
    flowNodes[key].forEach((node, index) => {
      const phase = (time * .00016 + index / flowNodes[key].length) % 1;
      const point = paths[key](phase);
      node.setAttribute("cx", point[0].toFixed(2));
      node.setAttribute("cy", point[1].toFixed(2));
      node.setAttribute("transform", "scale(" + (.78 + Math.sin(phase * Math.PI) * .28).toFixed(2) + ")");
    });
  }

  function animate(now) {
    const delta = Math.min(now - previousFrame, 40);
    previousFrame = now;
    if (playing) {
      elapsed += delta;
      moveFlow("water", elapsed);
      moveFlow("co2", elapsed);
      moveFlow("o2", elapsed);
      if (now - lastStepChange > 3300) {
        setStep(currentStep + 1, true);
      }
    }
    requestAnimationFrame(animate);
  }

  options.forEach(button => {
    button.addEventListener("click", () => {
      if (pending || completed) return;
      pending = true;
      feedback.textContent = "";
      feedback.className = "feedback";
      options.forEach(option => option.disabled = true);
      Studio.event("answer", {value:button.dataset.option});
      Studio.answer(button.dataset.option);
    });
  });

  Studio.onVerdict(result => {
    pending = false;
    if (result.correct) {
      completed = true;
      feedback.textContent = "✓";
      feedback.className = "feedback good";
      options.forEach(option => option.disabled = true);
      Studio.done();
    } else {
      feedback.textContent = "↻";
      feedback.className = "feedback try";
      options.forEach(option => option.disabled = false);
    }
  });

  setStep(0, true);
  updatePlayLabel();
  requestAnimationFrame(animate);
  Studio.ready();
})();
</script>
