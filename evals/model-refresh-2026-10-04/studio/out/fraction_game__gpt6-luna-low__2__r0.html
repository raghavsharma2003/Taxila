<style>
*{box-sizing:border-box}
:root{font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:#263747;background:#fff8ec}
body{margin:0}
.screen{min-height:100vh;max-width:520px;margin:auto;padding:22px 18px 26px;display:flex;flex-direction:column;gap:18px}
h1{font-size:clamp(23px,7vw,31px);line-height:1.15;margin:0;color:#304f6d}
p{margin:0;font-size:17px;line-height:1.45}
.card{background:#fff;border:2px solid #f1e3ce;border-radius:25px;padding:18px;box-shadow:0 7px 0 #efdfc9}
.fraction{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto;color:#304f6d;font-size:34px;font-weight:800}
.fraction span{min-width:42px;text-align:center}
.rule{width:3px;height:58px;border-radius:3px;background:#f2b85c}
.parts{display:grid;gap:9px;grid-template-columns:repeat(4,minmax(44px,1fr));margin-top:18px}
.part{border:2px solid #e5d7c4;border-radius:13px;min-width:44px;min-height:58px;background:#fff3df;cursor:pointer;transition:transform .16s,background .2s,border-color .2s,box-shadow .2s;touch-action:manipulation}
.part:active{transform:scale(.92)}
.part[data-shaded="true"]{background:#f5a65b;border-color:#dc8145;box-shadow:inset 0 -4px 0 #df854a}
.controls{display:flex;flex-direction:column;gap:10px;margin-top:auto}
button{font:inherit}
.check{width:100%;min-height:54px;border:0;border-radius:17px;background:#397b74;color:white;font-size:19px;font-weight:800;box-shadow:0 5px 0 #28635e;cursor:pointer;transition:transform .15s,filter .15s}
.check:active{transform:translateY(3px) scale(.99);box-shadow:0 2px 0 #28635e}
.message{min-height:28px;text-align:center;font-size:17px;font-weight:750;color:#397b74}
.message.bad{color:#b66a4d}
.doneCard{text-align:center;padding:34px 20px;font-size:24px;font-weight:800;color:#397b74}
.bounce{animation:bounce .45s ease}
@keyframes bounce{50%{transform:scale(1.035)}}
@media(max-width:390px){.screen{padding:18px 14px 22px;gap:15px}.card{padding:15px}.parts{gap:7px}}
</style>
<main class="screen">
  <h1 id="title"></h1>
  <p id="instruction"></p>
  <section class="card" id="item" data-item="">
    <div class="fraction" aria-hidden="true"><span id="numerator"></span><i class="rule"></i><span id="denominator"></span></div>
    <div class="parts" id="parts"></div>
  </section>
  <div class="controls" id="controls">
    <div class="message" id="message" aria-live="polite"></div>
    <button class="check" id="check" data-action="check"></button>
  </div>
</main>
<script>
(()=>{
  const items=Studio.params.items;
  const words={title:Studio.t("title"),instr:Studio.t("instr"),check:Studio.t("check"),right:Studio.t("right"),wrong:Studio.t("wrong"),done:Studio.t("done"),hint:Studio.t("hint")};
  const $=id=>document.getElementById(id);
  $("title").textContent=words.title;
  $("instruction").textContent=words.instr+" "+words.hint;
  $("check").textContent=words.check;
  let index=0,locked=false,finished=false;
  function showItem(){
    const item=items[index];
    $("item").dataset.item=item.id;
    $("numerator").textContent=item.n;
    $("denominator").textContent=item.d;
    const parts=$("parts");
    parts.replaceChildren();
    parts.style.gridTemplateColumns="repeat("+Math.min(4,item.d)+",minmax(44px,1fr))";
    for(let i=0;i<item.d;i++){
      const part=document.createElement("button");
      part.type="button";
      part.className="part";
      part.dataset.part=i;
      part.dataset.shaded="false";
      part.setAttribute("aria-pressed","false");
      part.addEventListener("click",()=>{
        if(locked)return;
        const shaded=part.dataset.shaded!=="true";
        part.dataset.shaded=String(shaded);
        part.setAttribute("aria-pressed",String(shaded));
        part.classList.remove("bounce");
        void part.offsetWidth;
        part.classList.add("bounce");
        Studio.event("part_toggle",{item:item.id,part:i,shaded});
      });
      parts.appendChild(part);
    }
    $("message").textContent="";
    $("message").className="message";
    $("check").hidden=false;
    $("controls").hidden=false;
    locked=false;
  }
  $("check").addEventListener("click",()=>{
    if(locked||finished)return;
    const item=items[index];
    const n=$("parts").querySelectorAll('[data-shaded="true"]').length;
    locked=true;
    Studio.event("check",{item:item.id,n,d:item.d});
    Studio.answer({n,d:item.d});
  });
  Studio.onVerdict(({correct})=>{
    if(finished)return;
    const message=$("message");
    if(correct){
      message.textContent=words.right;
      message.className="message bounce";
      $("item").classList.add("bounce");
      window.setTimeout(()=>{
        index++;
        if(index>=items.length){
          finished=true;
          $("item").hidden=true;
          $("instruction").hidden=true;
          $("controls").hidden=true;
          const done=document.createElement("section");
          done.className="card doneCard bounce";
          done.textContent=words.done;
          $("title").after(done);
          Studio.done();
        }else showItem();
      },650);
    }else{
      message.textContent=words.wrong;
      message.className="message bad";
      locked=false;
    }
  });
  showItem();
  Studio.ready();
})();
</script>
