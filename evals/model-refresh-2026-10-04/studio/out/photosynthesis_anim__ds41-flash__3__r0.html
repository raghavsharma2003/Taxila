<style>
  :root{
    --ink:#20343a;
    --sky:#dff2f7;
    --sky2:#c8ebf3;
    --soil:#8a5a3b;
    --soil2:#6f452c;
    --leaf:#4caf50;
    --leaf2:#2e8b3d;
    --leafGlow:#bdf06a;
    --sun:#ffcf47;
    --water:#3ba7e8;
    --co2:#8a7fd6;
    --o2:#f28a3d;
    --glu:#f6d34a;
    --card:#ffffff;
    --shadow:0 6px 0 rgba(0,0,0,.10), 0 10px 22px rgba(20,50,60,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  .ps-wrap{
    width:360px;max-width:100vw;margin:0 auto;
    font-family:"Trebuchet MS",Verdana,Geneva,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,#eafafd 0%,#dff2f7 55%,#e9f7ea 100%);
    padding:8px 8px 12px;
    border-radius:18px;
    overflow:hidden;
  }
  .ps-title{
    font-size:17px;font-weight:800;text-align:center;
    letter-spacing:.2px;
    padding:2px 4px 6px;
    line-height:1.15;
  }
  .ps-stage{
    position:relative;
    width:100%;
    border-radius:16px;
    background:linear-gradient(180deg,#cfeeff 0%,#ddf6ff 42%,#fdf1d8 42%,#f3e0bd 60%,#a9774f 60%,#8a5a3b 100%);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  svg.ps-svg{display:block;width:100%;height:auto;}
  .ps-cap{
    min-height:52px;
    margin:8px 2px 6px;
    background:var(--card);
    border-radius:14px;
    padding:8px 10px;
    font-size:13.5px;
    font-weight:700;
    line-height:1.28;
    text-align:center;
    box-shadow:0 3px 0 rgba(0,0,0,.07),0 6px 14px rgba(20,50,60,.10);
    display:flex;align-items:center;justify-content:center;
    transition:background .35s ease, transform .2s ease;
  }
  .ps-cap.pulse{animation:capPulse .5s ease;}
  @keyframes capPulse{0%{transform:scale(.97)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
  .ps-row{
    display:flex;gap:8px;align-items:stretch;justify-content:center;
    flex-wrap:wrap;
  }
  button.ps-btn{
    font-family:inherit;
    border:none;
    cursor:pointer;
    color:var(--ink);
    background:#ffffff;
    border-radius:14px;
    box-shadow:0 3px 0 rgba(0,0,0,.12),0 5px 12px rgba(20,50,60,.12);
    transition:transform .12s ease, background .2s ease, box-shadow .2s ease;
    min-height:44px;
  }
  button.ps-btn:active{transform:scale(.93);}
  button.ps-btn.ps-play{
    min-width:92px;height:48px;
    font-size:15px;font-weight:800;
    background:linear-gradient(180deg,#ffe07a,#ffcf47);
    box-shadow:0 4px 0 #d9a72f,0 8px 16px rgba(20,50,60,.18);
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  button.ps-btn.ps-play .ic{font-size:15px;}
  .ps-steps{display:flex;gap:7px;align-items:center;}
  button.ps-btn.ps-step{
    width:44px;height:44px;
    font-size:16px;font-weight:800;
    background:#ffffff;
    border:2px solid #cfe4ea;
  }
  button.ps-btn.ps-step.on{
    background:linear-gradient(180deg,#7fd77f,#4caf50);
    color:#fff;
    border-color:#2e8b3d;
    box-shadow:0 3px 0 #2e8b3d,0 6px 14px rgba(46,139,61,.35);
  }
  .ps-ask{
    margin-top:10px;
    background:var(--card);
    border-radius:16px;
    padding:10px 10px 12px;
    box-shadow:0 3px 0 rgba(0,0,0,.07),0 8px 18px rgba(20,50,60,.12);
  }
  .ps-ask-t{
    font-size:14px;font-weight:800;text-align:center;
    line-height:1.25;margin-bottom:8px;
  }
  .ps-opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  button.ps-btn.ps-opt{
    flex:1 1 96px;
    min-width:96px;height:48px;
    font-size:15px;font-weight:800;
    background:linear-gradient(180deg,#ffffff,#eef7fb);
    border:2px solid #cfe4ea;
    padding:0 6px;
  }
  button.ps-btn.ps-opt.good{
    background:linear-gradient(180deg,#8fe08f,#4caf50);
    color:#fff;border-color:#2e8b3d;
    animation:optPop .45s ease;
  }
  button.ps-btn.ps-opt.bad{
    background:linear-gradient(180deg,#ffd0c4,#ffab95);
    border-color:#e5765a;
    animation:optShake .4s ease;
  }
  @keyframes optPop{0%{transform:scale(.9)}55%{transform:scale(1.07)}100%{transform:scale(1)}}
  @keyframes optShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .ps-feed{
    text-align:center;font-size:13.5px;font-weight:800;
    min-height:18px;margin-top:8px;line-height:1.25;
  }
  .ps-feed.ok{color:#2e8b3d;}
  .ps-feed.no{color:#c9583b;}
  .ps-note{font-size:12.5px;font-weight:700;color:#4a6b73;text-align:center;margin-top:6px;}

  /* scene emphasis classes */
  #ps-sunGroup,#ps-leafGroup,#ps-rootsGroup,#ps-stemGroup{transition:filter .4s ease,opacity .4s ease,transform .4s ease;transform-box:fill-box;transform-origin:center;}
  .ps-dim{opacity:.38;filter:saturate(.5);}
  .ps-glow{filter:drop-shadow(0 0 6px rgba(255,214,80,.95)) saturate(1.25);}
  .ps-glow-green{filter:drop-shadow(0 0 7px rgba(140,240,110,.95)) saturate(1.2);}
  .ps-glow-blue{filter:drop-shadow(0 0 6px rgba(70,180,255,.95)) saturate(1.2);}
  #ps-gluce{transition:opacity .45s ease;}

  @keyframes sunPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  #ps-sunCore{animation:sunPulse 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
</style>

<div class="ps-wrap">
  <div class="ps-title" data-label="title" id="ps-title"></div>

  <div class="ps-stage">
    <svg class="ps-svg" viewBox="0 0 344 300" role="img" aria-label="photosynthesis scene">
      <defs>

        <path d="M234 151 L242 161" stroke="#2e8b3d" stroke-width="2" opacity=".55"/>
        <path d="M262 148 L269 157" stroke="#2e8b3d" stroke-width="2" opacity=".55"/>
        <text x="232" y="90" text-anchor="middle" font-size="12" font-weight="800" fill="#1f5f2c" data-label="leaf">leaf</text>
      </g>

      <!-- glucose inside leaf -->
      <g id="ps-gluce" opacity=".35">
        <circle cx="240" cy="134" r="13" fill="#ffe98a" opacity=".9"/>
        <circle cx="240" cy="134" r="13" fill="none" stroke="#f0b429" stroke-width="2"/>
        <text x="240" y="138" text-anchor="middle" font-size="10" font-weight="800" fill="#7a5600" data-label="glucose">glucose</text>
      </g>

        <animate attributeName="opacity" values="0;1;1;1;0" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle data-flow="water" cx="172" cy="240" r="5.5" fill="#3ba7e8" stroke="#1b6fa8" stroke-width="1.2">
        <animate attributeName="cy" values="240;216;192;164;140" dur="3.4s" begin="1.1s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="192;186;176;170;172" dur="3.4s" begin="1.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1;0" dur="3.4s" begin="1.1s" repeatCount="indefinite"/>
      </circle>
      <circle data-flow="water" cx="172" cy="240" r="5.5" fill="#3ba7e8" stroke="#1b6fa8" stroke-width="1.2">
        <animate attributeName="cy" values="236;212;190;166;146" dur="3.4s" begin="2.2s" repeatCount="indefinite"/>

        <animate attributeName="opacity" values="0;1;1;1;0" dur="3.4s" begin="2.2s" repeatCount="indefinite"/>
      </circle>

      <!-- CO2 particles: air -> leaf (3 circles) -->
      <circle data-flow="co2" cx="300" cy="40" r="5.5" fill="#8a7fd6" stroke="#5f54a8" stroke-width="1.2">

        <animate attributeName="opacity" values="0;1;1;1;0" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle data-flow="co2" cx="300" cy="40" r="5.5" fill="#8a7fd6" stroke="#5f54a8" stroke-width="1.2">
        <animate attributeName="cx" values="316;292;262;236;218" dur="3s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="48;72;96;116;130" dur="3s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1;0" dur="3s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle data-flow="co2" cx="300" cy="40" r="5.5" fill="#8a7fd6" stroke="#5f54a8" stroke-width="1.2">
        <animate attributeName="cx" values="312;286;256;230;212" dur="3s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="70;88;104;120;136" dur="3s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1;0" dur="3s" begin="2s" repeatCount="indefinite"/>
      </circle>

      <!-- O2 particles: leaf -> air (3 circles) -->
      <circle data-flow="o2" cx="250" cy="140" r="5.5" fill="#f28a3d" stroke="#c05f17" stroke-width="1.2">
        <animate attributeName="cx" values="236;212;180;146;116" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="132;112;88;66;44" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1;0" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle data-flow="o2" cx="250" cy="140" r="5.5" fill="#f28a3d" stroke="#c05f17" stroke-width="1.2">
        <animate attributeName="cx" values="252;230;200;168;134" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="140;120;98;76;52" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1;0" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
      </circle>
      <circle data-flow="o2" cx="250" cy="140" r="5.5" fill="#f28a3d" stroke="#c05f17" stroke-width="1.2">
        <animate attributeName="cx" values="266;244;214;184;152" dur="3.2s" begin="2.2s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="148;128;108;86;62" dur="3.2s" begin="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1;0" dur="3.2s" begin="2.2s" repeatCount="indefinite"/>

      <!-- water label near stem -->
      <g>
        <circle cx="120" cy="214" r="4" fill="#3ba7e8" stroke="#1b6fa8" stroke-width="1"/>

      </g>
      <!-- co2 label near air path -->
      <g>
        <circle cx="296" cy="152" r="4" fill="#8a7fd6" stroke="#5f54a8" stroke-width="1"/>
        <text x="296" y="170" text-anchor="middle" font-size="11" font-weight="800" fill="#3b2f7a" data-label="co2">co2</text>
      </g>
      <!-- o2 label near air -->
      <g>
        <circle cx="70" cy="104" r="4" fill="#f28a3d" stroke="#c05f17" stroke-width="1"/>

  <div class="ps-cap" id="ps-caption" data-caption></div>

  <div class="ps-row">
    <button class="ps-btn ps-play" id="ps-play" data-action="play" type="button">
      <span class="ic" id="ps-play-ic">&#9654;</span><span id="ps-play-txt" data-label="pause">pause</span>
    </button>
    <div class="ps-steps" id="ps-steps">
      <button class="ps-btn ps-step on" data-action="step-1" type="button">1</button>
      <button class="ps-btn ps-step" data-action="step-2" type="button">2</button>
      <button class="ps-btn ps-step" data-action="step-3" type="button">3</button>
      <button class="ps-btn ps-step" data-action="step-4" type="button">4</button>
      <button class="ps-btn ps-step" data-action="step-5" type="button">5</button>
    </div>
  </div>

  <div class="ps-ask">
    <div class="ps-ask-t" id="ps-ask" data-label="ask"></div>
    <div class="ps-opts">
      <button class="ps-btn ps-opt" data-option="co2" type="button" data-label="co2">co2</button>
      <button class="ps-btn ps-opt" data-option="o2" type="button" data-label="o2">o2</button>
      <button class="ps-btn ps-opt" data-option="water" type="button" data-label="water">water</button>
    </div>
    <div class="ps-feed" id="ps-feed"></div>
  </div>

  <div class="ps-note" id="ps-note"></div>
</div>

<script>
(function(){
  var P = (window.Studio && Studio.params) || {};
  var N = Number(P.steps) || 5;
  function t(k){ return (window.Studio && Studio.t) ? Studio.t(k) : k; }

  var el = function(id){ return document.getElementById(id); };
  var capEl = document.querySelector('[data-caption]');
  var stepBtns = Array.prototype.slice.call(document.querySelectorAll('[data-action^="step-"]'));
  var playBtn = document.querySelector('[data-action="play"]');
  var playTxt = el('ps-play-txt');
  var playIc = el('ps-play-ic');
  var feed = el('ps-feed');
  var note = el('ps-note');

  // bounds: only the ratios consent to be from params are numbers; steps count is params.steps
  var LAST = N;

  // ---- static labels ----
  var labelMap = {
    title:'ps-title',
    sun:null,leaf:null,roots:null,water:null,co2:null,o2:null,glucose:null,
    ask:'ps-ask'
  };
  ['title','ask'].forEach(function(k){
    var node = el(labelMap[k]);
    if(node) node.textContent = t(k);
  });
  // svg text labels (key == data-label)
  Array.prototype.slice.call(document.querySelectorAll('text[data-label]')).forEach(function(n){
    var k = n.getAttribute('data-label');
    n.textContent = t(k);
  });
  // option button text
  Array.prototype.slice.call(document.querySelectorAll('[data-option]')).forEach(function(b){
    var k = b.getAttribute('data-option');
    b.textContent = t(k);
  });
  // play/pause text (initial: playing -> show pause)
  playTxt.textContent = t('pause');
  playTxt.setAttribute('data-label','pause');

  // ---- captions ----
  var captions = [];
  for(var i=1;i<=LAST;i++){ captions.push(t('step'+i)); }

  // ---- animation control: svg <animate> driven via svg.pauseAnimations() ----
  var svg = document.querySelector('svg.ps-svg');
  var playing = true;

  function svgPause(){
    if(svg && svg.pauseAnimations) { try{ svg.pauseAnimations(); }catch(e){} }
  }
  function svgPlay(){
    if(svg && svg.unpauseAnimations) { try{ svg.unpauseAnimations(); }catch(e){} }
  }
  function setPlaying(v){
    playing = v;
    if(playing){ svgPlay(); playTxt.textContent = t('pause'); playTxt.setAttribute('data-label','pause'); playIc.innerHTML='&#10073;&#10073;'; }
    else { svgPause(); playTxt.textContent = t('play'); playTxt.setAttribute('data-label','play'); playIc.innerHTML='&#9654;'; }
  }

  // ---- step emphasis ----
  var groups = {
    water: ['ps-rootsGroup','ps-stemGroup'],
    co2: ['ps-leafGroup'],
    o2: ['ps-leafGroup'],
    glucose: ['ps-leafGroup']
  };
  var sunG = el('ps-sunGroup'), leafG = el('ps-leafGroup'), rootG = el('ps-rootsGroup'), stemG = el('ps-stemGroup');
  var glu = el('ps-gluce');

  function clearEmphasis(){
    [sunG,leafG,rootG,stemG].forEach(function(g){
      if(g) g.classList.remove('ps-dim','ps-glow','ps-glow-green','ps-glow-blue');
    });
    if(glu) glu.style.opacity = '.35';
  }

  // map step index (1-based) -> which process emphasised
  function emphasis(step){
    clearEmphasis();
    if(step===1){ if(sunG) sunG.classList.add('ps-glow'); }
    else if(step===2){ if(rootG) rootG.classList.add('ps-glow-blue'); if(stemG) stemG.classList.add('ps-glow-blue'); if(leafG) leafG.classList.add('ps-glow-green'); }
    else if(step===3){ if(leafG) leafG.classList.add('ps-glow'); if(sunG) sunG.classList.add('ps-glow'); if(glu) glu.style.opacity='.7'; }
    else if(step===4){ if(glu){ glu.style.opacity='1'; } if(leafG) leafG.classList.add('ps-glow-green'); }
    else if(step===5){ if(leafG) leafG.classList.add('ps-glow-green'); }
  }

  function showStep(n){
    n = Math.min(Math.max(1, n), LAST);
    capEl.textContent = captions[n-1] || '';
    capEl.classList.remove('pulse');
    void capEl.offsetWidth;
    capEl.classList.add('pulse');
    stepBtns.forEach(function(b){
      b.classList.toggle('on', b.getAttribute('data-action')==='step-'+n);
    });
    emphasis(n);
    if(window.Studio && Studio.event) Studio.event('step_view', {step:n});
  }

  // ---- start state ----
  setPlaying(true);
  showStep(1);

  playBtn.addEventListener('click', function(){
    setPlaying(!playing);
    if(window.Studio && Studio.event) Studio.event('toggle_flow', {playing:playing});
  });

  stepBtns.forEach(function(b){
    b.addEventListener('click', function(){
      var m = /step-(\d+)/.exec(b.getAttribute('data-action'));
      var n = m ? parseInt(m[1],10) : 1;
      showStep(n);
    });
  });

  // ---- question ----
  var answered = false;
  var optBtns = Array.prototype.slice.call(document.querySelectorAll('[data-option]'));
  function clearOpts(){
    optBtns.forEach(function(b){ b.classList.remove('good','bad'); b.disabled=false; });
  }
  optBtns.forEach(function(b){
    b.addEventListener('click', function(){
      if(answered) return;
      clearOpts();
      var key = b.getAttribute('data-option');
      if(window.Studio && Studio.answer) Studio.answer(key);
    });
  });

  if(window.Studio && Studio.onVerdict){
    Studio.onVerdict(function(v){
      var correct = v && v.correct;
      clearOpts();
      if(correct){
        answered = true;
        feed.className = 'ps-feed ok';
        var chosen = document.querySelector('[data-option].good') ||
                     document.querySelector('[data-option="o2"]');
        optBtns.forEach(function(b){ if(b.getAttribute('data-option')==='o2') b.classList.add('good'); });
        optBtns.forEach(function(b){ b.disabled = true; });
        feed.textContent = capEl.textContent ? '' : '';
        if(window.Studio && Studio.done) Studio.done();
      } else {
        // wrong: allow retry right away; mark the tapped one gently
        feed.className = 'ps-feed no';
        feed.textContent = '';
        // mark the last tapped option bad
      }
    });
  }

  if(window.Studio && Studio.ready) Studio.ready();
})();
</script>
