<style>
*{box-sizing:border-box}
:root{color-scheme:light;--ink:#25453d;--muted:#62766b;--green:#398358;--leaf:#65ad61;--sky:#eaf7f6;--cream:#fffaf0;--soil:#8b6246;--gold:#f4bd4d;--blue:#498fd0}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(160deg,#f5fbf8,#e8f3ed)}
button{font:inherit;color:inherit}
.app{width:min(100%,420px);height:100%;min-height:0;margin:auto;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
h1{font-size:clamp(18px,5vw,23px);line-height:1.1;text-align:center;margin:0;font-weight:800;letter-spacing:.01em}
.scene-card{position:relative;flex:1;min-height:230px;border-radius:22px;overflow:hidden;background:linear-gradient(#e5f6f8 0%,#f4fbef 78%,#e4c79e 78%,#d8b38a 100%);box-shadow:0 5px 16px #355e4818;border:1px solid #fff}
.scene{display:block;width:100%;height:100%}
.scene text{font:700 12px system-ui,sans-serif;fill:var(--ink);paint-order:stroke;stroke:#ffffffd9;stroke-width:3px;stroke-linejoin:round}
.plant-leaf{transform-box:fill-box;transform-origin:center;animation:sway 3.8s ease-in-out infinite}
.sun-glow{animation:glow 2.6s ease-in-out infinite}
.ray{animation:ray 2s ease-in-out infinite alternate}
@keyframes sway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(2deg)}}
@keyframes glow{50%{opacity:.55;transform:scale(1.08)}}
@keyframes ray{to{opacity:.42}}
.particle{filter:drop-shadow(0 0 2px #fff);transition:opacity .25s}
.scene-card[data-step="1"] .flow-water,.scene-card[data-step="2"] .flow-co2,.scene-card[data-step="3"] .flow-light,.scene-card[data-step="4"] .flow-o2,.scene-card[data-step="5"] .flow-glucose{filter:drop-shadow(0 0 5px #ffe08b);opacity:1}
.scene-card.paused .particle{animation-play-state:paused!important}
.playbar{display:flex;justify-content:center}
.play-btn,.step-btn,.option{min-height:44px;border:0;cursor:pointer;touch-action:manipulation;transition:transform .14s,box-shadow .14s,background .2s}
.play-btn:active,.step-btn:active,.option:active{transform:scale(.95)}
.play-btn{min-width:132px;border-radius:999px;padding:7px 18px;background:#398358;color:white;font-weight:750;box-shadow:0 3px 0 #286442}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.step-btn{border-radius:14px;background:#fff;color:#3f7055;border:1px solid #d5e8d9;font-weight:800;font-size:17px}
.step-btn.active{background:#4b9565;color:white;box-shadow:0 3px 0 #327049}
.caption{margin:0;min-height:40px;padding:6px 9px;display:grid;place-items:center;text-align:center;border-radius:13px;background:#fff9e9;color:#4d604b;font-size:13px;line-height:1.22;font-weight:650}
.check{border-radius:18px;background:#fff;padding:8px 10px 9px;box-shadow:0 3px 13px #355e4810}
.question{margin:0 0 7px;text-align:center;font-size:14px;line-height:1.2;font-weight:750}
.options{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.option{border-radius:13px;background:#edf5ee;color:#39684b;border:1px solid #d6e8d8;font-weight:750;font-size:13px;overflow-wrap:anywhere;padding:5px}
.option[aria-pressed="true"]{background:#e0f0e3;box-shadow:inset 0 0 0 2px #71ad7b}
.feedback{min-height:18px;margin:5px 0 0;text-align:center;font-size:12px;line-height:1.2;font-weight:700;color:#4c7857}
@media(max-height:700px){.app{padding:6px 10px;gap:5px}.scene-card{min-height:205px}.caption{min-height:36px}.check{padding:6px 9px}.question{margin-bottom:5px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
<main class="app">

  <div class="scene-card" id="sceneCard" data-step="1">

        <path d="M111 116 Q143 124 172 128 M137 121 L127 108 M147 124 L143 137 M159 126 L157 113" fill="none" stroke="#d2edaa" stroke-width="2" stroke-linecap="round"/>

      <g class="flow-water">
        <circle class="particle" data-flow="water" r="4" fill="#368bd1"><animate attributeName="cy" values="233;189;142;117" dur="2.4s" repeatCount="indefinite"/><animate attributeName="cx" values="166;177;174;162" dur="2.4s" repeatCount="indefinite"/></circle>
        <circle class="particle" data-flow="water" r="4" fill="#368bd1"><animate attributeName="cy" values="239;197;158;123" dur="2.8s" begin=".7s" repeatCount="indefinite"/><animate attributeName="cx" values="190;180;181;196" dur="2.8s" begin=".7s" repeatCount="indefinite"/></circle>
        <circle class="particle" data-flow="water" r="4" fill="#368bd1"><animate attributeName="cy" values="246;207;166;128" dur="2.5s" begin="1.3s" repeatCount="indefinite"/><animate attributeName="cx" values="158;173;178;170" dur="2.5s" begin="1.3s" repeatCount="indefinite"/></circle>
      </g>
      <g class="flow-co2">
        <circle class="particle" data-flow="co2" r="4.5" fill="#9d79c9"><animate attributeName="cx" values="311;271;231;207" dur="2.2s" repeatCount="indefinite"/><animate attributeName="cy" values="111;115;120;122" dur="2.2s" repeatCount="indefinite"/></circle>
        <circle class="particle" data-flow="co2" r="4.5" fill="#9d79c9"><animate attributeName="cx" values="333;288;246;219" dur="2.6s" begin=".8s" repeatCount="indefinite"/><animate attributeName="cy" values="135;129;124;120" dur="2.6s" begin=".8s" repeatCount="indefinite"/></circle>

      <g class="flow-o2">
        <circle class="particle" data-flow="o2" r="4.5" fill="#5ab7d5"><animate attributeName="cx" values="148;111;77;48" dur="2.4s" repeatCount="indefinite"/><animate attributeName="cy" values="121;116;109;101" dur="2.4s" repeatCount="indefinite"/></circle>
        <circle class="particle" data-flow="o2" r="4.5" fill="#5ab7d5"><animate attributeName="cx" values="199;237;273;311" dur="2.7s" begin=".6s" repeatCount="indefinite"/><animate attributeName="cy" values="112;106;100;91" dur="2.7s" begin=".6s" repeatCount="indefinite"/></circle>
        <circle class="particle" data-flow="o2" r="4.5" fill="#5ab7d5"><animate attributeName="cx" values="158;124;91;60" dur="2.5s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="cy" values="132;140;145;151" dur="2.5s" begin="1.2s" repeatCount="indefinite"/></circle>
      </g>
      <g class="flow-glucose">
        <circle cx="169" cy="123" r="5" fill="#ffd968" opacity=".85"><animate attributeName="r" values="3;6;3" dur="1.5s" repeatCount="indefinite"/></circle>

    </svg>
  </div>
  <div class="playbar"><button class="play-btn" type="button" data-action="play"></button></div>
  <nav class="steps" aria-label=""><button class="step-btn active" type="button" data-action="step-1"></button><button class="step-btn" type="button" data-action="step-2"></button><button class="step-btn" type="button" data-action="step-3"></button><button class="step-btn" type="button" data-action="step-4"></button><button class="step-btn" type="button" data-action="step-5"></button></nav>
  <p class="caption" data-caption></p>
  <section class="check">
    <p class="question" id="ask"></p>
    <div class="options">
      <button class="option" type="button" data-option="co2"></button>
      <button class="option" type="button" data-option="o2"></button>
      <button class="option" type="button" data-option="water"></button>
    </div>
    <p class="feedback" aria-live="polite"></p>
  </section>
</main>
<script>
(()=>{
 const t=k=>Studio.t(k);
 const params=Studio.params;
 const card=document.getElementById("sceneCard");
 const steps=[...document.querySelectorAll(".step-btn")];
 const play=document.querySelector('[data-action="play"]');
 const caption=document.querySelector("[data-caption]");
 const feedback=document.querySelector(".feedback");
 let current=1,playing=true,locked=false;
 document.getElementById("title").textContent=t("title");
 document.getElementById("ask").textContent=t("ask");
 document.querySelectorAll("[data-label]").forEach(el=>el.textContent=t(el.dataset.label));
 document.querySelectorAll("[data-option]").forEach(el=>el.textContent=t(el.dataset.option));
 const count=Number(params.steps)||5;
 steps.forEach((el,i)=>{el.textContent=String(i+1);el.hidden=i>=count});
 function setStep(n){
   current=n;card.dataset.step=String(n);
   steps.forEach((el,i)=>el.classList.toggle("active",i===n-1));
   caption.textContent=t("step"+n);
 }
 function setPlay(value){
   playing=value;card.classList.toggle("paused",!playing);
   play.textContent=t(playing?"pause":"play");
   play.setAttribute("aria-label",t(playing?"pause":"play"));
 }
 play.addEventListener("click",()=>{setPlay(!playing);Studio.event("play_toggle",{playing})});
 steps.forEach((el,i)=>el.addEventListener("click",()=>{setStep(i+1);Studio.event("step_select",{step:i+1})}));
 document.querySelectorAll("[data-option]").forEach(el=>el.addEventListener("click",()=>{
   if(locked)return;
   document.querySelectorAll("[data-option]").forEach(option=>option.setAttribute("aria-pressed",String(option===el)));
   feedback.textContent="";
   Studio.event("answer_select",{option:el.dataset.option});
   Studio.answer(el.dataset.option);
 }));
 Studio.onVerdict(({correct})=>{
   if(correct){locked=true;feedback.textContent="✓";Studio.done()}
   else{feedback.textContent="↻";document.querySelectorAll("[data-option]").forEach(option=>option.setAttribute("aria-pressed","false"))}
 });
 setStep(1);setPlay(true);Studio.ready();
})();
</script>
