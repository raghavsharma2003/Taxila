<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #FFFBF0 0%, #FFF3E0 100%);
    color: #4B2E19;
    width: 100%;
    height: 100vh;
    max-width: 360px;
    max-height: 640px;
    margin: 0 auto;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    width: 100%;
    height: 100%;
    padding: 16px;
    display: flex;
    flex-direction: column;
  }
  .header {
    text-align: center;
    margin-bottom: 10px;
    padding-top: 4px;
    flex-shrink: 0;
  }
  h1#title {
    font-size: 1.25rem;
    font-weight: 800;
    color: #92400E;
    letter-spacing: -0.01em;
  }
  .chart-container {
    position: relative;
    flex: 1 1 auto;
    background: #FFFFFF;
    border-radius: 20px;
    box-shadow: 0 6px 24px rgba(124, 45, 18, 0.08);
    margin-bottom: 12px;
    min-height: 280px;
    overflow: hidden;
  }
  .chart-container.completed {
    pointer-events: none;
  }
  .y-axis {
    position: absolute;
    top: 8px;
    left: 0;
    width: 44px;
    bottom: 36px;
    border-right: 1.5px solid #E5E7EB;
  }
  .plot-area {
    position: absolute;
    top: 8px;
    left: 44px;
    right: 0;
    bottom: 36px;
    border-bottom: 2px solid #9CA3AF;
  }
  .grid-line {
    position: absolute;
    left: 0;
    right: 0;
    height: 1px;
    background: #F3F4F6;
    pointer-events: none;
  }
  .tick-label {
    position: absolute;
    right: 6px;
    font-size: 11px;
    font-weight: 600;
    color: #6B7280;
    line-height: 1;
    transform: translateY(50%);
  }
  .bars {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: flex-end;
    justify-content: space-around;
    padding: 0 4px;
  }
  .bar-slot {
    position: relative;
    width: 48px;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
  }
  .bar {
    width: 48px;
    height: 0;
    border-radius: 10px 10px 0 0;
    background: #6366F1;
    cursor: pointer;
    transition: height 0.9s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease, transform 0.15s ease;
    position: relative;
    flex-shrink: 0;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    box-shadow: 0 4px 12px rgba(99,102,241,0.25);
  }
  .bar:active {
    filter: brightness(1.15) saturate(1.2);
    transform: scale(1.05);
  }
  .bar-tooltip {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%) translateY(4px);
    background: #1F2937;
    color: #FFFFFF;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 6px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    white-space: nowrap;
    z-index: 2;
  }
  .bar-tooltip.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .x-axis {
    position: absolute;
    left: 44px;
    right: 0;
    bottom: 0;
    height: 36px;
    display: flex;
    align-items: flex-start;
    justify-content: space-around;
    padding: 6px 4px 0;
  }
  .x-label {
    width: 48px;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: #374151;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .ask {
    background: #FFF7ED;
    border: 2px solid #FDE68A;
    border-radius: 14px;
    padding: 12px 14px;
    text-align: center;
    font-size: 1.05rem;
    font-weight: 700;
    color: #78350F;
    line-height: 1.35;
    margin-bottom: 10px;
    transition: background 0.3s, border-color 0.3s, color 0.3s;
    flex-shrink: 0;
  }
  .ask.done {
    background: #D1FAE5;
    border-color: #6EE7B7;
    color: #065F46;
  }
  .feedback {
    text-align: center;
    padding: 10px 12px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 1rem;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.35s ease, transform 0.35s ease;
    pointer-events: none;
    flex-shrink: 0;
  }
  .feedback.show {
    opacity: 1;
    transform: translateY(0);
  }
  .feedback.right {
    background: #D1FAE5;
    color: #065F46;
  }
  .feedback.wrong {
    background: #FEE2E2;
    color: #991B1B;
  }
</style>

<div id="app">
  <div class="header">
    <h1 id="title"></h1>
  </div>
  <div class="chart-container" id="chartContainer">
    <div class="y-axis" id="yAxis"></div>
    <div class="plot-area" id="plotArea">
      <div class="grid" id="grid"></div>
      <div class="bars" id="bars"></div>
    </div>
    <div class="x-axis" id="xAxis"></div>
  </div>
  <div class="ask" id="askEl"></div>
  <div class="feedback" id="feedbackEl"></div>
</div>

<script>
(function(){
  var data = Studio.params.data;
  var titleEl = document.getElementById('title');
  var askEl = document.getElementById('askEl');
  var feedbackEl = document.getElementById('feedbackEl');
  var chartContainer = document.getElementById('chartContainer');
  var yAxis = document.getElementById('yAxis');
  var plotArea = document.getElementById('plotArea');
  var grid = document.getElementById('grid');
  var bars = document.getElementById('bars');
  var xAxis = document.getElementById('xAxis');

  titleEl.textContent = Studio.t('title');
  askEl.textContent = Studio.t('ask');

  var maxVal = 0;
  for (var i = 0; i < data.length; i++) {
    if (data[i].value > maxVal) maxVal = data[i].value;
  }
  var tickStep = 2;
  var maxTick = Math.ceil(maxVal / tickStep) * tickStep;
  if (maxTick < maxVal) maxTick += tickStep;

  function buildChart() {
    var plotH = plotArea.clientHeight || 260;
    var pxPerUnit = plotH / maxTick;

    for (var v = 0; v <= maxTick; v += tickStep) {
      var line = document.createElement('div');
      line.className = 'grid-line';
      line.style.bottom = (v * pxPerUnit) + 'px';
      grid.appendChild(line);

      var tick = document.createElement('span');
      tick.className = 'tick-label';
      tick.setAttribute('data-tick', String(v));
      tick.textContent = String(v);
      tick.style.bottom = (v * pxPerUnit) + 'px';
      yAxis.appendChild(tick);
    }

    data.forEach(function(d, idx){
      var slot = document.createElement('div');
      slot.className = 'bar-slot';

      var tooltip = document.createElement('div');
      tooltip.className = 'bar-tooltip';
      tooltip.textContent = String(d.value);

      var bar = document.createElement('div');
      bar.className = 'bar';
      bar.setAttribute('data-bar', d.key);
      bar.setAttribute('data-value', String(d.value));

      var finalH = d.value * pxPerUnit;

      function onTap(e) {
        if (e && e.preventDefault) e.preventDefault();
        tooltip.classList.add('show');
        clearTimeout(tooltip._hide);
        tooltip._hide = setTimeout(function(){
          tooltip.classList.remove('show');
        }, 1400);
        Studio.answer(d.key);
      }

      bar.addEventListener('click', onTap);
      bar.addEventListener('touchstart', function(e){ e.preventDefault(); onTap(e); }, {passive:false});

      slot.appendChild(tooltip);
      slot.appendChild(bar);
      bars.appendChild(slot);

      var xLab = document.createElement('div');
      xLab.className = 'x-label';
      xLab.textContent = Studio.t(d.key);
      xAxis.appendChild(xLab);

      setTimeout(function(){
        bar.style.height = finalH + 'px';
      }, 60 + idx * 100);
    });

    Studio.ready();
  }

  setTimeout(buildChart, 0);

  Studio.onVerdict(function(result){
    if (result.correct) {
      feedbackEl.textContent = Studio.t('right');
      feedbackEl.className = 'feedback right show';
      askEl.textContent = Studio.t('done');
      askEl.classList.add('done');
      chartContainer.classList.add('completed');
      Studio.done();
    } else {
      feedbackEl.textContent = Studio.t('wrong');
      feedbackEl.className = 'feedback wrong show';
      clearTimeout(feedbackEl._hide);
      feedbackEl._hide = setTimeout(function(){
        feedbackEl.classList.remove('show');
      }, 1800);
    }
  });
})();
</script>
