<style>
*{box-sizing:border-box}
:root{--ink:#29443f;--green:#42aa8c;--green-dark:#257a68;--cream:#fff8e7;--grid:#cfe2dd}
.viz{width:100%;min-height:100vh;margin:0;padding:14px 10px 18px;overflow:hidden;background:linear-gradient(180deg,var(--cream),#edf9f4);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.card{width:100%;max-width:520px;margin:auto;padding:15px 8px 14px;border:2px solid #fff;border-radius:26px;background:rgba(255,255,255,.92);box-shadow:0 12px 28px rgba(43,82,73,.14)}
.title{margin:0 8px 6px;text-align:center;color:#285f54;font-size:clamp(21px,7vw,28px);font-weight:850;line-height:1.15}
.ask{min-height:48px;margin:6px 8px 9px;padding:10px 12px;border-radius:17px;background:#fff0b8;color:#704d20;text-align:center;font-size:17px;font-weight:750;line-height:1.35}
.chart-wrap{width:100%;overflow:hidden;border-radius:21px;background:linear-gradient(#f7fcff,#fff);box-shadow:inset 0 0 0 1px #dcebe7}
#chart{display:block;width:100%;height:auto;touch-action:manipulation}
.grid{stroke:var(--grid);stroke-width:1;stroke-dasharray:4 5}
.axis{stroke:#617873;stroke-width:2;stroke-linecap:round}
.tick-label{fill:#526a65;font-size:12px;font-weight:750;text-anchor:end;dominant-baseline:middle}
.fruit-label{fill:#354d49;font-size:11px;font-weight:750;text-anchor:middle}
.axis-title{fill:#49665f;font-size:12px;font-weight:800;text-anchor:middle}
.bar{fill:var(--green);stroke:var(--green-dark);stroke-width:2;cursor:pointer;outline:none;transform-box:fill-box;transform-origin:center;transition:transform 150ms ease,filter 180ms ease,fill 180ms ease;filter:drop-shadow(0 5px 4px rgba(36,110,94,.18))}
.bar:hover,.bar:focus-visible{fill:#36a184;filter:drop-shadow(0 7px 5px rgba(36,110,94,.25))}
.bar:active,.bar.picked{transform:scale(.94,1.025)}
.bar.grow{animation:reveal 850ms cubic-bezier(.2,.78,.25,1) both}
.value-pill{opacity:0;transform:translateY(5px);transform-box:fill-box;transform-origin:center;transition:opacity 180ms ease,transform 180ms ease;pointer-events:none}
.value-pill.show{opacity:1;transform:translateY(0)}
.value-pill rect{fill:#275b52}
.value-text{fill:#fff;font-size:13px;font-weight:850;text-anchor:middle;dominant-baseline:middle}
.feedback{display:flex;align-items:center;justify-content:center;min-height:52px;margin:9px 8px 0;padding:9px 12px;border-radius:18px;text-align:center;font-size:19px;font-weight:850;opacity:0;transform:translateY(6px);transition:opacity 220ms ease,transform 220ms ease}
.feedback.show{opacity:1;transform:translateY(0)}
.feedback.good{color:#176548;background:#dff7e7}
.feedback.try{color:#8a4d29;background:#ffe4d5}
.feedback.good.show{animation:pulse 560ms ease}
@keyframes reveal{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes pulse{0%{transform:scale(.96)}55%{transform:scale(1.025)}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.bar.grow{animation-duration:1ms}.bar,.value-pill,.feedback{transition-duration:1ms}}
</style>
<main class="viz">
  <section class="card">
    <h1 class="title" id="title"></h1>
    <div class="ask" id="ask"></div>
    <div class="chart-wrap">
      <svg id="chart" viewBox="0 0 360 390" role="img">
        <g id="gridLayer"></g>
        <g id="axisLayer"></g>
        <g id="barLayer"></g>
        <g id="labelLayer"></g>
        <g id="valueLayer"></g>
      </svg>
    </div>
    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
  </section>
</main>
<script>
(()=>{
const data=Studio.params.data,ns="http://www.w3.org/2000/svg";
const title=document.getElementById("title");
const ask=document.getElementById("ask");
const feedback=document.getElementById("feedback");
const gridLayer=document.getElementById("gridLayer");
const axisLayer=document.getElementById("axisLayer");
const barLayer=document.getElementById("barLayer");
const labelLayer=document.getElementById("labelLayer");
const valueLayer=document.getElementById("valueLayer");
title.textContent=Studio.t("title");
ask.textContent=Studio.t("ask");
const make=(tag,attrs,parent)=>{
 const node=document.createElementNS(ns,tag);
 Object.keys(attrs).forEach(key=>node.setAttribute(key,attrs[key]));
 parent.appendChild(node);
 return node;
};
const maxValue=Math.max.apply(null,data.map(item=>item.value));
const rough=maxValue/Math.max(data.length-1,1);
const power=Math.pow(10,Math.floor(Math.log10(rough)));
const fraction=rough/power;
const step=(fraction<=1?1:fraction<=2?2:fraction<=5?5:10)*power;
const scaleTop=Math.ceil(maxValue/step)*step;
const left=52,right=348,top=28,baseline=300;
const plotHeight=baseline-top;
const slot=(right-left)/data.length;
const barWidth=Math.min(56,slot-3);
for(let tick=0;tick<=scaleTop;tick+=step){
 const y=baseline-(tick/scaleTop)*plotHeight;
 make("line",{x1:left,y1:y,x2:right,y2:y,class:"grid"},gridLayer);
 const label=make("text",{x:left-8,y:y,class:"tick-label","data-tick":tick},axisLayer);
 label.textContent=tick;
}
make("line",{x1:left,y1:top,x2:left,y2:baseline,class:"axis"},axisLayer);
make("line",{x1:left,y1:baseline,x2:right,y2:baseline,class:"axis"},axisLayer);
const middle=(top+baseline)/2;
const yTitle=make("text",{x:16,y:middle,class:"axis-title",transform:"rotate(-90 16 "+middle+")"},axisLayer);
yTitle.textContent=Studio.t("yaxis");
let locked=false;
let active=null;
data.forEach((item,index)=>{
 const center=left+slot*index+slot/2;
 const barHeight=(item.value/scaleTop)*plotHeight;
 const barY=baseline-barHeight;
 const bar=make("rect",{
  x:center-barWidth/2,
  y:barY,
  width:barWidth,
  height:barHeight,
  rx:10,
  class:"bar grow",
  tabindex:0,
  role:"button",
  "data-bar":item.key,
  "data-value":item.value
 },barLayer);
 const fruit=make("text",{x:center,y:326,class:"fruit-label"},labelLayer);
 fruit.textContent=Studio.t(item.key);
 const pill=make("g",{class:"value-pill"},valueLayer);
 const pillY=Math.max(barY-29,top-4);
 make("rect",{x:center-20,y:pillY,width:40,height:24,rx:12},pill);
 const valueText=make("text",{x:center,y:pillY+12,class:"value-text"},pill);
 valueText.textContent=item.value;
 const choose=()=>{
  if(locked)return;
  if(active){
   active.bar.classList.remove("picked");
   active.pill.classList.remove("show");
  }
  active={bar:bar,pill:pill};
  bar.classList.add("picked");
  pill.classList.add("show");
  feedback.className="feedback";
  feedback.textContent="";
  locked=true;
  Studio.event("bar_tap",{key:item.key,value:item.value});
  Studio.answer(item.key);
 };
 bar.addEventListener("click",choose);
 bar.addEventListener("keydown",event=>{
  if(event.key==="Enter"||event.key===" "){
   event.preventDefault();
   choose();
  }
 });
});
Studio.onVerdict(result=>{
 if(result.correct){
  feedback.textContent=Studio.t("right")+" "+Studio.t("done");
  feedback.className="feedback good show";
  Studio.event("verdict",{correct:true});
  Studio.done();
 }else{
  feedback.textContent=Studio.t("wrong");
  feedback.className="feedback try show";
  Studio.event("verdict",{correct:false});
  locked=false;
  if(active)active.bar.classList.remove("picked");
 }
});
Studio.ready();
})();
</script>
