<style>
  :root{
    --bg:#f6fbff;
    --card:#ffffff;
    --ink:#1f2a44;
    --muted:#6b7a99;
    --axis:#8fa1c7;
    --grid:#dbe6fb;
    --bar:#5b8def;
    --bar2:#7aa6ff;
    --good:#1fa971;
    --bad:#d64545;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color:var(--ink);
  }
  #app{
    width:100%;
    max-width:420px;
    margin:0 auto;
    padding:12px;
  }
  #title{
    margin:6px 6px 10px;
    font-size:24px;
    line-height:1.2;
    text-align:center;
  }
  #card{
    background:var(--card);
    border-radius:20px;
    padding:12px 10px 14px;
    box-shadow:0 8px 24px rgba(43,72,128,0.12);
  }
  #chartWrap{
    position:relative;
    height:380px;
    border-radius:16px;
    background:linear-gradient(180deg,#f9fcff 0%, #f2f7ff 100%);
    overflow:hidden;
    padding:8px 8px 6px 8px;
  }
  #yTitle{
    position:absolute;
    left:4px;
    top:50%;
    transform:translateY(-50%) rotate(-90deg);
    transform-origin:left top;
    font-size:13px;
    color:var(--muted);
    white-space:nowrap;
    pointer-events:none;
  }
  #plot{
    position:absolute;
    left:38px;
    right:8px;
    top:10px;
    bottom:8px;
  }
  #gridLayer, #tickLayer, #barsLayer{
    position:absolute;
    inset:0;
  }
  .gridLine{
    position:absolute;
    left:0;
    right:0;
    height:1px;
    background:var(--grid);
  }
  .tickLabel{
    position:absolute;
    left:-34px;
    width:30px;
    text-align:right;
    transform:translateY(50%);
    font-size:12px;
    color:var(--muted);
  }
  #barsLayer{
    display:flex;
    align-items:flex-end;
    justify-content:space-around;
    gap:6px;
    padding:0 2px 0 2px;
  }
  .barCol{
    width:19%;
    min-width:48px;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    align-items:center;
    gap:6px;
  }
  .barBtn{
    width:100%;
    min-height:44px;
    height:82%;
    border:none;
    background:transparent;
    padding:0;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  .barBtn:active{
    transform:scale(0.98);
  }
  .bar{
    width:78%;
    min-width:28px;
    border-radius:12px 12px 4px 4px;
    background:linear-gradient(180deg,var(--bar2) 0%, var(--bar) 100%);
    box-shadow:0 4px 10px rgba(43,97,209,0.22);
    height:0;
    transition:height 900ms cubic-bezier(.2,.9,.2,1), transform 180ms ease;
    transform-origin:bottom center;
  }
  .bar.pop{
    transform:scaleY(1.03);
  }
  .xLabel{
    min-height:44px;
    width:100%;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    text-align:center;
    font-size:13px;
    color:var(--ink);
    line-height:1.1;
    padding-top:2px;
  }
  #ask{
    margin:12px 4px 2px;
    font-size:18px;
    text-align:center;
  }
  #feedback{
    margin:6px 4px 0;
    min-height:26px;
    font-size:18px;
    text-align:center;
    font-weight:700;
  }
  .good{color:var(--good)}
  .bad{color:var(--bad)}
</style>

<div id="app">
  <h1 id="title"></h1>
  <div id="card">
    <div id="chartWrap">
      <div id="yTitle"></div>
      <div id="plot">
        <div id="gridLayer"></div>
        <div id="tickLayer"></div>
        <div id="barsLayer"></div>
      </div>
    </div>
    <p id="ask"></p>
    <p id="feedback" aria-live="polite"></p>
  </div>
</div>

<script>
(function(){
  const data = (Studio.params && Studio.params.data) ? Studio.params.data.slice() : [];
  const titleEl = document.getElementById('title');
  const yTitleEl = document.getElementById('yTitle');
  const askEl = document.getElementById('ask');
  const fbEl = document.getElementById('feedback');
  const gridLayer = document.getElementById('gridLayer');
  const tickLayer = document.getElementById('tickLayer');
  const barsLayer = document.getElementById('barsLayer');

  titleEl.textContent = Studio.t('title');
  yTitleEl.textContent = Studio.t('yaxis');
  askEl.textContent = Studio.t('ask');

  const maxVal = Math.max.apply(null, data.map(d => d.value));
  function niceStep(max){
    const raw = Math.max(1, max / 5);
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const n = raw / p;
    let step;
    if (n <= 1) step = 1;
    else if (n <= 2) step = 2;
    else if (n <= 5) step = 5;
    else step = 10;
    return step * p;
  }
  const step = niceStep(maxVal);
  const top = Math.ceil(maxVal / step) * step;

  function yPct(v){ return (v / top) * 100; }

  for(let t=0; t<=top; t+=step){
    const g = document.createElement('div');
    g.className = 'gridLine';
    g.style.bottom = yPct(t) + '%';
    gridLayer.appendChild(g);

    const lab = document.createElement('div');
    lab.className = 'tickLabel';
    lab.setAttribute('data-tick', String(t));
    lab.style.bottom = yPct(t) + '%';
    lab.textContent = String(t);
    tickLayer.appendChild(lab);
  }

  let locked = false;
  let finished = false;

  data.forEach((d, i) => {
    const col = document.createElement('div');
    col.className = 'barCol';

    const btn = document.createElement('button');
    btn.className = 'barBtn';
    btn.type = 'button';

    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.setAttribute('data-bar', d.key);
    bar.setAttribute('data-value', String(d.value));
    bar.style.height = '0%';

    btn.appendChild(bar);

    const lbl = document.createElement('div');
    lbl.className = 'xLabel';
    lbl.textContent = Studio.t(d.key);

    btn.addEventListener('click', function(){
      if (locked || finished) return;
      locked = true;
      bar.classList.add('pop');
      setTimeout(() => bar.classList.remove('pop'), 180);
      fbEl.className = '';
      fbEl.textContent = String(d.value);
      Studio.event('bar_tap', { key: d.key, value: d.value });
      Studio.answer(String(d.key));
    });

    col.appendChild(btn);
    col.appendChild(lbl);
    barsLayer.appendChild(col);

    requestAnimationFrame(() => {
      setTimeout(() => {
        bar.style.height = yPct(d.value) + '%';
      }, 80 + i * 80);
    });
  });

  Studio.onVerdict(function(v){
    if (finished) return;
    if (v && v.correct){
      fbEl.className = 'good';
      fbEl.textContent = Studio.t('right') + ' ' + Studio.t('done');
      askEl.textContent = Studio.t('done');
      finished = true;
      Studio.done();
    }else{
      fbEl.className = 'bad';
      fbEl.textContent = Studio.t('wrong');
      locked = false;
    }
  });

  Studio.ready();
})();
</script>
