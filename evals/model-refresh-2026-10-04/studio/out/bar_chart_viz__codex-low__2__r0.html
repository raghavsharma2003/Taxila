<style>
  :root{
    --bg:#f6fbff;
    --card:#ffffff;
    --ink:#1f2d3d;
    --muted:#5b6b7a;
    --axis:#8aa0b6;
    --grid:#dbe7f3;
    --bar:#4f8cff;
    --bar-dark:#3b6fd1;
    --ok:#1f9d67;
    --bad:#d64545;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color:var(--ink);
  }
  #app{
    width:100%;
    max-width:420px;
    margin:0 auto;
    min-height:100vh;
    padding:14px 12px 18px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  #title{
    font-size:24px;
    font-weight:800;
    line-height:1.2;
    text-align:center;
  }
  #ask{
    font-size:18px;
    font-weight:700;
    text-align:center;
    color:#28435e;
    background:#eaf3ff;
    border-radius:14px;
    padding:10px 12px;
  }
  .card{
    background:var(--card);
    border-radius:18px;
    padding:12px 10px 14px;
    box-shadow:0 8px 24px rgba(47,83,130,.12);
  }
  .chart-wrap{
    display:grid;
    grid-template-columns:32px 1fr;
    gap:6px;
    align-items:stretch;
  }
  #yTitle{
    writing-mode:vertical-rl;
    transform:rotate(180deg);
    text-align:center;
    font-size:13px;
    font-weight:700;
    color:#47607a;
    display:flex;
    justify-content:center;
    align-items:center;
    user-select:none;
  }
  .chart-area{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  #plot{
    position:relative;
    height:min(50vh,340px);
    min-height:260px;
    border-left:2px solid var(--axis);
    border-bottom:2px solid var(--axis);
    border-radius:10px 0 0 0;
    overflow:visible;
    background:linear-gradient(to top, #f8fbff 0%, #ffffff 100%);
  }
  #grid,#ticksLayer,#barsLayer,#valueLayer{
    position:absolute; inset:0;
  }
  .gridline{
    position:absolute;
    left:0; right:0;
    border-top:1px solid var(--grid);
  }
  .tick{
    position:absolute;
    left:-40px;
    width:34px;
    text-align:right;
    font-size:12px;
    color:var(--muted);
    transform:translateY(50%);
    user-select:none;
  }
  #barsLayer{
    display:flex;
    align-items:flex-end;
    justify-content:space-around;
    padding:0 4px;
    gap:6px;
  }
  .bar-col{
    flex:1 1 0;
    min-width:48px;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    position:relative;
  }
  .bar-btn{
    width:100%;
    height:100%;
    border:0;
    background:transparent;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    padding:0 2px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .bar-btn:disabled{cursor:default}
  .bar{
    width:min(100%,52px);
    min-width:34px;
    border-radius:12px 12px 8px 8px;
    background:linear-gradient(180deg, #76a8ff 0%, var(--bar) 55%, var(--bar-dark) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 3px 8px rgba(59,111,209,.25);
    transform-origin:bottom center;
    transform:scaleY(0);
    transition:transform .75s cubic-bezier(.22,.85,.3,1), filter .18s ease;
  }
  .bar-btn:active .bar{filter:brightness(1.08)}
  .bar-btn.pop .bar{
    animation:pop .22s ease;
  }
  @keyframes pop{
    0%{transform:scaleY(var(--grown,1)) scaleX(1)}
    50%{transform:scaleY(var(--grown,1)) scaleX(1.06)}
    100%{transform:scaleY(var(--grown,1)) scaleX(1)}
  }
  .value-tag{
    position:absolute;
    bottom:0;
    transform:translateY(-6px);
    background:#1f2d3d;
    color:#fff;
    font-weight:800;
    font-size:14px;
    line-height:1;
    border-radius:999px;
    padding:6px 10px;
    opacity:0;
    transition:opacity .2s ease, transform .2s ease;
    pointer-events:none;
  }
  .value-tag.show{
    opacity:1;
    transform:translateY(-12px);
  }
  #xLabels{
    display:flex;
    justify-content:space-around;
    gap:6px;
    padding:0 4px;
  }
  .xlabel{
    flex:1 1 0;
    min-width:48px;
    text-align:center;
    font-size:13px;
    font-weight:700;
    color:#3d5268;
    word-break:break-word;
  }
  #feedback{
    min-height:44px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:800;
    transition:all .25s ease;
  }
  #feedback.ok{background:#e8f8f0;color:var(--ok)}
  #feedback.bad{background:#ffecec;color:var(--bad)}
</style>

<div id="app">
  <div id="title"></div>
  <div id="ask"></div>

  <div class="card">
    <div class="chart-wrap">
      <div id="yTitle"></div>
      <div class="chart-area">
        <div id="plot">
          <div id="grid"></div>
          <div id="ticksLayer"></div>
          <div id="barsLayer"></div>
          <div id="valueLayer"></div>
        </div>
        <div id="xLabels"></div>
      </div>
    </div>
  </div>

  <div id="feedback" aria-live="polite"></div>
</div>

<script>
(function(){
  const data = Array.isArray(Studio.params.data) ? Studio.params.data.slice() : [];
  const titleEl = document.getElementById('title');
  const askEl = document.getElementById('ask');
  const yTitleEl = document.getElementById('yTitle');
  const gridEl = document.getElementById('grid');
  const ticksEl = document.getElementById('ticksLayer');
  const barsEl = document.getElementById('barsLayer');
  const xLabelsEl = document.getElementById('xLabels');
  const feedbackEl = document.getElementById('feedback');

  titleEl.textContent = Studio.t('title');
  askEl.textContent = Studio.t('ask');
  yTitleEl.textContent = Studio.t('yaxis');

  function niceStep(max){
    if (max <= 5) return 1;
    const rough = max / 5;
    const pow = Math.pow(10, Math.floor(Math.log10(rough)));
    const n = rough / pow;
    let nice = 1;
    if (n <= 1) nice = 1;
    else if (n <= 2) nice = 2;
    else if (n <= 5) nice = 5;
    else nice = 10;
    return nice * pow;
  }

  const maxValue = data.reduce((m,d)=>Math.max(m, Number(d.value)||0), 0);
  const step = niceStep(maxValue || 1);
  const maxTick = Math.ceil((maxValue || step) / step) * step;
  const ticks = [];
  for(let t=0; t<=maxTick; t+=step){ ticks.push(t); }

  ticks.forEach(t=>{
    const y = (t/maxTick)*100;
    const line = document.createElement('div');
    line.className = 'gridline';
    line.style.bottom = y + '%';
    gridEl.appendChild(line);

    const label = document.createElement('div');
    label.className = 'tick';
    label.style.bottom = y + '%';
    label.setAttribute('data-tick', String(t));
    label.textContent = String(t);
    ticksEl.appendChild(label);
  });

  let selectedKey = null;
  let waitingVerdict = false;
  let finished = false;
  const barButtons = [];

  data.forEach((d, i)=>{
    const col = document.createElement('div');
    col.className = 'bar-col';

    const btn = document.createElement('button');
    btn.className = 'bar-btn';
    btn.type = 'button';

    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.setAttribute('data-bar', d.key);
    bar.setAttribute('data-value', String(d.value));
    const pct = ((Number(d.value)||0)/maxTick)*100;
    bar.style.height = pct + '%';
    bar.style.transitionDelay = (i*70) + 'ms';
    bar.style.setProperty('--grown','1');

    const tag = document.createElement('div');
    tag.className = 'value-tag';
    tag.textContent = String(d.value);

    btn.appendChild(bar);
    col.appendChild(btn);
    col.appendChild(tag);
    barsEl.appendChild(col);

    const xl = document.createElement('div');
    xl.className = 'xlabel';
    xl.textContent = Studio.t(d.key);
    xLabelsEl.appendChild(xl);

    btn.addEventListener('click', ()=>{
      if (finished || waitingVerdict) return;
      selectedKey = d.key;
      waitingVerdict = true;

      document.querySelectorAll('.value-tag').forEach(v=>v.classList.remove('show'));
      tag.classList.add('show');

      barButtons.forEach(b=>b.classList.remove('pop'));
      btn.classList.add('pop');

      Studio.event('bar_tap', { key:d.key, value:d.value });
      Studio.answer(d.key);
    });

    barButtons.push(btn);
  });

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      document.querySelectorAll('.bar').forEach(b=>{ b.style.transform = 'scaleY(1)'; });
    });
  });

  Studio.onVerdict(function(v){
    if (!waitingVerdict || finished) return;
    waitingVerdict = false;

    if (v && v.correct){
      feedbackEl.className = 'ok';
      feedbackEl.textContent = Studio.t('right') + ' ' + Studio.t('done');
      askEl.textContent = Studio.t('done');
      finished = true;
      barButtons.forEach(b=>b.disabled = true);
      Studio.done();
    }else{
      feedbackEl.className = 'bad';
      feedbackEl.textContent = Studio.t('wrong');
    }
  });

  Studio.ready();
})();
</script>
