<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #fff7ed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 16px;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    max-width: 360px;
    margin: 0 auto;
    width: 100%;
  }
  .header {
    text-align: center;
    width: 100%;
  }
  .title {
    font-size: 20px;
    font-weight: 700;
    color: #c2410c;
    margin-bottom: 4px;
  }
  .instr {
    font-size: 14px;
    color: #9a3412;
  }
  .fraction-display {
    font-size: 28px;
    font-weight: 800;
    color: #7c2d12;
    background: #fed7aa;
    padding: 12px 24px;
    border-radius: 16px;
    display: inline-block;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .picture-area {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    min-height: 200px;
    padding: 8px 0;
  }
  .part {
    cursor: pointer;
    transition: fill 0.2s ease, transform 0.15s;
  }
  .part:active {
    transform: scale(0.92);
  }
  .part.unshaded {
    fill: #fde68a;
    stroke: #b45309;
    stroke-width: 2;
  }
  .part.shaded {
    fill: #ea580c;
    stroke: #b45309;
    stroke-width: 2;
  }
  .check-btn {
    background: #ea580c;
    color: white;
    border: none;
    border-radius: 40px;
    padding: 14px 48px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(234,88,12,0.3);
    transition: transform 0.15s, box-shadow 0.15s;
    touch-action: manipulation;
    min-height: 48px;
  }
  .check-btn:active {
    transform: scale(0.94);
    box-shadow: 0 2px 6px rgba(234,88,12,0.3);
  }
  .check-btn:disabled {
    background: #ccc;
    box-shadow: none;
    cursor: default;
  }
  .feedback {
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    min-height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    border-radius: 12px;
    width: 100%;
    transition: opacity 0.3s;
  }
  .feedback.right {
    color: #166534;
    background: #dcfce7;
  }
  .feedback.wrong {
    color: #991b1b;
    background: #fee2e2;
  }
  .feedback.done {
    color: #7c2d12;
    background: #fed7aa;
    font-size: 20px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .feedback.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .done-emoji {
    font-size: 32px;
  }
  .progress {
    font-size: 13px;
    color: #9a3412;
    font-weight: 500;
    margin-top: 4px;
  }
  .hint {
    font-size: 12px;
    color: #c2410c;
    text-align: center;
    margin-top: 4px;
  }
  @media (max-width: 360px) {
    body { padding: 10px; }
  }
</style>
<div id="app">
  <div class="header">
    <div class="title" id="title"></div>
    <div class="instr" id="instr"></div>
  </div>
  <div class="fraction-display" id="fractionDisplay"></div>
  <div class="picture-area" id="pictureArea"></div>
  <button class="check-btn" data-action="check" id="checkBtn"></button>
  <div class="feedback hidden" id="feedback"></div>
  <div class="progress" id="progress"></div>
  <div class="hint" id="hint"></div>
</div>
<script>
  (function() {
    const app = document.getElementById('app');
    const titleEl = document.getElementById('title');
    const instrEl = document.getElementById('instr');
    const fractionDisplay = document.getElementById('fractionDisplay');
    const pictureArea = document.getElementById('pictureArea');
    const checkBtn = document.getElementById('checkBtn');
    const feedback = document.getElementById('feedback');
    const progress = document.getElementById('progress');
    const hint = document.getElementById('hint');

    const items = Studio.params.items;
    const pictureType = Studio.params.picture;
    const usePizza = true;

    let currentItemIndex = 0;
    let currentItem = null;
    let partsState = [];
    let waitingForVerdict = false;
    let isDone = false;

    function t(key) { return Studio.t(key); }

    function render() {
      titleEl.textContent = t('title');
      instrEl.textContent = t('instr');
      checkBtn.textContent = t('check');
      hint.textContent = t('hint');
      showCurrentItem();
    }

    function resetFeedback() {
      feedback.className = 'feedback hidden';
      feedback.textContent = '';
    }

    function showCurrentItem() {
      if (currentItemIndex >= items.length) {
        showDoneScreen();
        return;
      }
      currentItem = items[currentItemIndex];
      const { id, n, d } = currentItem;

      resetFeedback();
      fractionDisplay.textContent = `${n}/${d}`;

      // Remove old container
      const oldContainer = pictureArea.querySelector('[data-item]');
      if (oldContainer) oldContainer.remove();

      const container = document.createElement('div');
      container.setAttribute('data-item', id);
      container.style.width = '100%';
      container.style.display = 'flex';
      container.style.flexDirection = 'column';
      container.style.alignItems = 'center';
      container.style.gap = '8px';

      const picDiv = document.createElement('div');
      picDiv.style.display = 'flex';
      picDiv.style.justifyContent = 'center';
      picDiv.style.alignItems = 'center';
      picDiv.style.width = '240px';
      picDiv.style.height = '240px';

      partsState = [];
      for (let i = 0; i < d; i++) {
        partsState.push({ index: i, shaded: false });
      }

      let svg;
      if (usePizza) {
        svg = buildPizza(d);
      } else {
        svg = buildBar(d);
      }
      picDiv.appendChild(svg);
      container.appendChild(picDiv);
      pictureArea.appendChild(container);

      progress.textContent = `${currentItemIndex + 1}/${items.length}`;
      checkBtn.disabled = false;
      waitingForVerdict = false;
    }

    function buildPizza(parts) {
      const svgns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(svgns, 'svg');
      svg.setAttribute('viewBox', '0 0 200 200');
      svg.setAttribute('width', '200');
      svg.setAttribute('height', '200');
      svg.style.display = 'block';
      svg.style.margin = '0 auto';
      svg.style.filter = 'drop-shadow(0 4px 8px rgba(0,0,0,0.1))';

      const cx = 100, cy = 100, r = 85;
      const angleStep = (2 * Math.PI) / parts;

      // Draw slices
      for (let i = 0; i < parts; i++) {
        const startAngle = i * angleStep - Math.PI / 2;
        const endAngle = (i + 1) * angleStep - Math.PI / 2;
        const x1 = cx + r * Math.cos(startAngle);
        const y1 = cy + r * Math.sin(startAngle);
        const x2 = cx + r * Math.cos(endAngle);
        const y2 = cy + r * Math.sin(endAngle);
        const largeArc = angleStep > Math.PI ? 1 : 0;

        const path = document.createElementNS(svgns, 'path');
        const d = `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z`;
        path.setAttribute('d', d);
        path.setAttribute('data-part', i);
        path.setAttribute('data-shaded', 'false');
        path.setAttribute('class', 'part unshaded');
        path.style.cursor = 'pointer';
        path.addEventListener('click', makePartClickHandler(i));
        svg.appendChild(path);
      }

      // Crust circle
      const inner = document.createElementNS(svgns, 'circle');
      inner.setAttribute('cx', cx);
      inner.setAttribute('cy', cy);
      inner.setAttribute('r', 12);
      inner.setAttribute('fill', '#fed7aa');
      inner.setAttribute('stroke', '#b45309');
      inner.setAttribute('stroke-width', '2');
      svg.appendChild(inner);

      // Border circle
      const border = document.createElementNS(svgns, 'circle');
      border.setAttribute('cx', cx);
      border.setAttribute('cy', cy);
      border.setAttribute('r', r);
      border.setAttribute('fill', 'none');
      border.setAttribute('stroke', '#b45309');
      border.setAttribute('stroke-width', '2');
      svg.appendChild(border);

      return svg;
    }

    function buildBar(parts) {
      const svgns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(svgns, 'svg');
      svg.setAttribute('viewBox', '0 0 240 80');
      svg.setAttribute('width', '240');
      svg.setAttribute('height', '80');
      svg.style.display = 'block';
      svg.style.margin = '0 auto';
      svg.style.filter = 'drop-shadow(0 4px 8px rgba(0,0,0,0.1))';

      const totalWidth = 220;
      const barHeight = 60;
      const startX = 10;
      const startY = 10;
      const segWidth = totalWidth / parts;

      for (let i = 0; i < parts; i++) {
        const x = startX + i * segWidth;
        const rect = document.createElementNS(svgns, 'rect');
        rect.setAttribute('x', x);
        rect.setAttribute('y', startY);
        rect.setAttribute('width', segWidth);
        rect.setAttribute('height', barHeight);
        rect.setAttribute('rx', 4);
        rect.setAttribute('data-part', i);
        rect.setAttribute('data-shaded', 'false');
        rect.setAttribute('class', 'part unshaded');
        rect.style.cursor = 'pointer';
        rect.addEventListener('click', makePartClickHandler(i));
        svg.appendChild(rect);
      }

      const border = document.createElementNS(svgns, 'rect');
      border.setAttribute('x', startX);
      border.setAttribute('y', startY);
      border.setAttribute('width', totalWidth);
      border.setAttribute('height', barHeight);
      border.setAttribute('rx', 4);
      border.setAttribute('fill', 'none');
      border.setAttribute('stroke', '#b45309');
      border.setAttribute('stroke-width', '2');
      svg.appendChild(border);

      return svg;
    }

    function makePartClickHandler(idx) {
      return function(evt) {
        if (waitingForVerdict || isDone) return;
        const state = partsState[idx];
        state.shaded = !state.shaded;
        const el = evt.currentTarget;
        el.setAttribute('data-shaded', state.shaded ? 'true' : 'false');
        el.setAttribute('class', state.shaded ? 'part shaded' : 'part unshaded');
      };
    }

    checkBtn.addEventListener('click', function() {
      if (waitingForVerdict || isDone) return;
      if (currentItemIndex >= items.length) return;

      waitingForVerdict = true;
      checkBtn.disabled = true;
      resetFeedback();

      const coloredCount = partsState.filter(p => p.shaded).length;
      Studio.answer({ n: coloredCount, d: currentItem.d });
    });

    Studio.onVerdict(function(result) {
      waitingForVerdict = false;
      if (result.correct) {
        feedback.className = 'feedback right';
        feedback.textContent = t('right');
        setTimeout(() => {
          currentItemIndex++;
          if (currentItemIndex >= items.length) {
            showDoneScreen();
          } else {
            showCurrentItem();
          }
        }, 800);
      } else {
        feedback.className = 'feedback wrong';
        feedback.textContent = t('wrong');
        checkBtn.disabled = false;
      }
    });

    function showDoneScreen() {
      isDone = true;
      fractionDisplay.textContent = '🎉';
      const container = pictureArea.querySelector('[data-item]');
      if (container) container.remove();
      checkBtn.disabled = true;
      feedback.className = 'feedback done';
      feedback.innerHTML = `<span class="done-emoji">✨</span> ${t('done')} <span class="done-emoji">✨</span>`;
      progress.textContent = '';
      hint.textContent = '';
      Studio.done();
    }

    render();
    Studio.ready();
  })();
</script>
