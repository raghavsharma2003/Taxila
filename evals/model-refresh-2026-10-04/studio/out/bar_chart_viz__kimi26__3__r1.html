<style>
* { box-sizing: border-box; }
body { margin: 0; background: #F0F9FF; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: #0C4A6E; }
#app { width: 100%; max-width: 360px; margin: 0 auto; padding: 12px 0; display: flex; flex-direction: column; align-items: center; touch-action: manipulation; }
#title { font-size: 1.25rem; text-align: center; margin: 10px 16px 14px; font-weight: 800; line-height: 1.3; color: #0C4A6E; }
#chart-wrap { width: 100%; }
svg { width: 100%; height: auto; display: block; }
.axis { stroke: #94A3B8; stroke-width: 2; stroke-linecap: round; }
.gridline { stroke: #CBD5E1; stroke-width: 1; }
.tick-label { font-size: 12px; fill: #64748B; font-family: inherit; }
.axis-title { font-size: 13px; fill: #475569; font-weight: 600; font-family: inherit; }
.fruit-label { font-size: 13px; fill: #334155; font-weight: 700; font-family: inherit; }
.bar-value { font-size: 14px; fill: #0F172A; font-weight: 700; opacity: 0; transition: opacity 0.25s ease; pointer-events: none; font-family: inherit; }
.bar-value.visible { opacity: 1; }
.bar {
  fill: #38BDF8;
  transform-box: fill-box;
  transform-origin: bottom;
  transform: scaleY(0);
  transition: transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.15s ease;
  cursor: pointer;
}
.bar.grown { transform: scaleY(1); }
.bar.pressed { filter: brightness(0.92); }
#ask { text-align: center; font-size: 1.05rem; margin: 14px 16px 8px; color: #334155; font-weight: 500; line-height: 1.4; min-height: 44px; }
.feedback { margin: 8px 16px; padding: 12px 16px; border-radius: 14px; text-align: center; font-weight: 700; opacity: 0; transition: opacity 0.3s ease; min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 1rem; width: calc(100% - 32px); max-width: 320px; }
.feedback.visible { opacity: 1; }
.feedback.right { background: #DCFCE7; color: #166534; }
.feedback.wrong { background: #FEE2E2; color: #991B1B; }
#done { text-align: center; font-size: 1.15rem; margin: 16px; color: #0C4A6E; font-weight: 800; display: none; line-height: 1.4; }
</style>

<div id="app">
  <h1 id="title"></h1>
  <div id="chart-wrap">
    <svg id="chart" viewBox="0 0 360 395" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <p id="ask"></p>
  <div id="feedback" class="feedback"></div>
  <p id="done"></p>
</div>

<script>
(function() {
  const data = Studio.params.data || [];
  if (!data.length) return;

  const titleEl = document.getElementById('title');
  const askEl = document.getElementById('ask');
  const doneEl = document.getElementById('done');
  const feedbackEl = document.getElementById('feedback');
  const svg = document.getElementById('chart');

  titleEl.textContent = Studio.t('title');
  askEl.textContent = Studio.t('ask');
  doneEl.textContent = Studio.t('done');

  const ns = 'http://www.w3.org/2000/svg';
  function $svg(tag, attrs) {
    const e = document.createElementNS(ns, tag);
    for (const k in attrs) e.setAttribute(k, '' + attrs[k]);
    return e;
  }

  const chartLeft = 44;
  const chartRight = 332;
  const chartBottom = 340;
  const chartTop = 30;
  const chartH = chartBottom - chartTop;

  const maxVal = Math.max(...data.map(function(d) { return d.value; }));
  const rough = maxVal / 5 || 1;
  const pow10 = Math.pow(10, Math.floor(Math.log10(rough)));
  const d = rough / pow10;
  let step = pow10;
  if (d >= 5) step = 5 * pow10;
  else if (d >= 2) step = 2 * pow10;
  else step = pow10;
  if (step < 1) step = 1;
  let maxTick = Math.ceil(maxVal / step) * step;
  if (maxTick === 0) maxTick = step;
  const unit = chartH / maxTick;

  const yTitle = $svg('text', {
    x: 16,
    y: (chartTop + chartBottom) / 2,
    class: 'axis-title',
    transform: 'rotate(-90,16,' + ((chartTop + chartBottom) / 2) + ')',
    'text-anchor': 'middle'
  });
  yTitle.textContent = Studio.t('yaxis');
  svg.appendChild(yTitle);

  for (let t = 0; t <= maxTick; t += step) {
    const y = chartBottom - t * unit;
    svg.appendChild($svg('line', { x1: chartLeft, y1: y, x2: chartRight, y2: y, class: 'gridline' }));
    const tk = $svg('text', {
      x: chartLeft - 8,
      y: y + 4,
      class: 'tick-label',
      'data-tick': String(t),
      'text-anchor': 'end'
    });
    tk.textContent = String(t);
    svg.appendChild(tk);
  }

  svg.appendChild($svg('line', { x1: chartLeft, y1: chartBottom, x2: chartRight, y2: chartBottom, class: 'axis' }));
  svg.appendChild($svg('line', { x1: chartLeft, y1: chartBottom, x2: chartLeft, y2: chartTop, class: 'axis' }));

  const barWidth = 48;
  const chartW = chartRight - chartLeft;
  const totalBarW = data.length * barWidth;
  const gap = (chartW - totalBarW) / (data.length + 1);
  let x = chartLeft + gap;
  let isDone = false;

  data.forEach(function(item) {
    const h = item.value * unit;
    const y = chartBottom - h;

    const g = $svg('g', { class: 'bar-group' });

    const valText = $svg('text', {
      x: x + barWidth / 2,
      y: y - 10,
      class: 'bar-value',
      'text-anchor': 'middle'
    });
    valText.textContent = String(item.value);
    g.appendChild(valText);

    const bar = $svg('rect', {
      x: x,
      y: y,
      width: barWidth,
      height: h,
      rx: 4,
      class: 'bar',
      'data-bar': item.key,
      'data-value': String(item.value)
    });
    g.appendChild(bar);

    const label = $svg('text', {
      x: x + barWidth / 2,
      y: chartBottom + 24,
      class: 'fruit-label',
      'text-anchor': 'middle'
    });
    label.textContent = Studio.t(item.key);
    g.appendChild(label);

    svg.appendChild(g);

    bar.addEventListener('click', function(e) {
      if (isDone) return;
      e.stopPropagation();
      valText.classList.add('visible');
      bar.classList.add('pressed');
      clearTimeout(bar._pt);
      bar._pt = setTimeout(function() { bar.classList.remove('pressed'); }, 150);
      Studio.event('tap', { key: item.key });
      Studio.answer(item.key);
    });

    x += barWidth + gap;
  });

  requestAnimationFrame(function() {
    svg.querySelectorAll('.bar').forEach(function(b) {
      b.classList.add('grown');
    });
  });

  Studio.onVerdict(function(result) {
    if (isDone) return;
    feedbackEl.classList.remove('visible', 'right', 'wrong');
    void feedbackEl.offsetWidth;
    if (result.correct) {
      feedbackEl.textContent = Studio.t('right');
      feedbackEl.classList.add('right', 'visible');
      isDone = true;
      Studio.event('verdict', { correct: true });
      askEl.style.display = 'none';
      doneEl.style.display = 'block';
      Studio.done();
    } else {
      feedbackEl.textContent = Studio.t('wrong');
      feedbackEl.classList.add('wrong', 'visible');
      Studio.event('verdict', { correct: false });
      setTimeout(function() {
        feedbackEl.classList.remove('visible');
      }, 1600);
    }
  });

  Studio.ready();
})();
</script>
