<style>
  :root {
    --bg: #fdf6e3;
    --panel: #fffaf0;
    --ink: #4a3b32;
    --fruit-1: #f4b942;
    --fruit-2: #f5e56b;
    --fruit-3: #d94f4f;
    --fruit-4: #9bcc7a;
    --fruit-5: #f09a4a;
    --line: #d9c5a0;
    --tick: #8a7a6a;
    --correct-bg: #e0f2d0;
    --wrong-bg: #ffe0d0;
    --radius: 24px;
    --bar-w: 38px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 12px;
  }
  .app {
    background: var(--panel);
    border-radius: 32px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 400px;
    padding: 22px 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    text-align: center;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.3px;
    margin: 0 4px;
  }
  .chart-card {
    background: #fffdf7;
    border-radius: var(--radius);
    padding: 14px 10px 8px;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.02);
    border: 1px solid #f0e5d2;
  }
  .chart-wrap {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
  }
  .canvas {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 0 6px;
    min-height: 180px;
  }
  .y-axis {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: flex-end;
    height: 150px; /* matched to plotting area */
    margin-right: 2px;
    padding-right: 2px;
    color: var(--tick);
    font-size: 10px;
    font-weight: 500;
    line-height: 1;
    flex-shrink: 0;
    min-width: 18px;
  }
  .y-axis span {
    height: 0;
    display: flex;
    align-items: center;
    transform: translateY(3px);
  }
  .plot-area {
    display: flex;
    align-items: flex-end;
    justify-content: space-around;
    flex: 1;
    gap: 6px;
    height: 150px;
    position: relative;
  }
  .grid-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    border-bottom: 2px solid var(--line);
  }
  .grid-line {
    position: absolute;
    left: 0;
    right: 0;
    height: 0;
    border-top: 1px dashed #e2d3b8;
  }
  .bar-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
    width: var(--bar-w);
    position: relative;
    z-index: 2;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .bar-group:active {
    transform: scale(0.92);
  }
  .bar-value {
    background: #ffffffcc;
    border-radius: 20px;
    padding: 2px 8px;
    font-size: 10px;
    font-weight: 600;
    color: #4a3b32;
    margin-bottom: 4px;
    opacity: 0;
    transition: opacity 0.2s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    border: 1px solid var(--line);
    pointer-events: none;
  }
  .bar {
    width: 100%;
    border-radius: 12px 12px 4px 4px;
    background: var(--fruit-1);
    transition: height 0.7s cubic-bezier(0.2, 0.9, 0.25, 1), opacity 0.3s;
    min-height: 4px;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.04);
    border: 1px solid rgba(0,0,0,0.03);
  }
  .fruit-label {
    margin-top: 8px;
    font-size: 12px;
    font-weight: 600;
    color: #5b4a3e;
    letter-spacing: 0.2px;
    user-select: none;
  }
  .ask-section {
    background: #f3ecdf;
    padding: 10px 12px;
    border-radius: 30px;
    font-size: 1rem;
    font-weight: 500;
    border: 1px solid #e3d4bf;
    box-shadow: inset 0 1px 4px rgba(255,255,255,0.7);
  }
  .feedback-box {
    min-height: 38px;
    font-weight: 600;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #efe7d9;
    border-radius: 40px;
    padding: 8px 10px;
    transition: background 0.3s;
  }
  .feedback-box.correct {
    background: var(--correct-bg);
    color: #2f6b2f;
  }
  .feedback-box.wrong {
    background: var(--wrong-bg);
    color: #a63e3e;
  }
  .done-message {
    font-size: 1.1rem;
    font-weight: 600;
    color: #2f6b2f;
    background: #e5f2dd;
    padding: 6px 12px;
    border-radius: 40px;
  }
  .hidden { display: none; }
  .bar-group .bar[data-bar] {
    transition: height 0.6s cubic-bezier(0.2, 0.9, 0.25, 1);
  }
</style>

<div class="app">
  <h1 data-testid="title"></h1>
  <div class="chart-card">
    <div class="chart-wrap">
      <div style="display: flex; flex-direction: row;">
        <div class="y-axis" id="yAxis" style="justify-content: space-between; height: 150px;"></div>
        <div class="plot-area" id="plotArea">
          <div class="grid-layer" id="gridLayer"></div>
          <!-- bars will be generated -->
        </div>
      </div>
    </div>
  </div>
  <div class="ask-section" data-testid="ask"></div>
  <div class="feedback-box" id="feedbackBox"></div>
</div>

<script>
  (function() {
    const params = Studio.params;
    const data = params.data;
    // keys order from params
    const keys = data.map(d => d.key);
    const values = data.map(d => d.value);
    const maxVal = Math.max(...values);
    // tick step: nice step: 2, 5, 10, etc. we choose based on maxVal <= 12 -> step 2, max 12
    let step = 2;
    if (maxVal > 12) step = 5;
    if (maxVal > 25) step = 10;
    if (maxVal > 50) step = 20;
    const tickMax = Math.ceil(maxVal / step) * step;
    const ticks = [];
    for (let t = 0; t <= tickMax; t += step) ticks.push(t);

    // build y-axis ticks and gridlines
    const yAxisEl = document.getElementById('yAxis');
    const gridLayer = document.getElementById('gridLayer');
    const plotArea = document.getElementById('plotArea');
    // clear existing
    yAxisEl.innerHTML = '';
    gridLayer.innerHTML = '';

    ticks.forEach(t => {
      const span = document.createElement('span');
      span.textContent = t;
      span.setAttribute('data-tick', t);
      span.style.marginBottom = (t === 0) ? '0px' : 'auto';
      yAxisEl.appendChild(span);
    });

    // generate gridlines relative to plot height (150px)
    ticks.forEach(t => {
      const line = document.createElement('div');
      line.className = 'grid-line';
      const pos = (t / tickMax) * 150;
      line.style.bottom = pos + 'px';
      gridLayer.appendChild(line);
    });

    // assign colors
    const colorMap = {
      mango: 'var(--fruit-1)',
      banana: 'var(--fruit-2)',
      apple: 'var(--fruit-3)',
      guava: 'var(--fruit-4)',
      orange: 'var(--fruit-5)'
    };

    // Build bars
    data.forEach((item, idx) => {
      const group = document.createElement('div');
      group.className = 'bar-group';
      group.setAttribute('data-bar-group', item.key);

      const barValue = document.createElement('div');
      barValue.className = 'bar-value';
      barValue.id = 'val-' + item.key;

      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.setAttribute('data-bar', item.key);
      bar.setAttribute('data-value', item.value);
      bar.style.background = colorMap[item.key] || '#d4a247';
      // initial height 0 -> animation to final
      bar.style.height = '0%';

      const label = document.createElement('div');
      label.className = 'fruit-label';
      label.textContent = Studio.t(item.key); // localized fruit name

      group.appendChild(barValue);
      group.appendChild(bar);
      group.appendChild(label);

      group.addEventListener('click', () => {
        // show value on tap
        const valDiv = group.querySelector('.bar-value');
        valDiv.textContent = item.value;
        valDiv.style.opacity = '1';
        Studio.event('bar_tap', { key: item.key, value: item.value });
        // send answer
        Studio.answer(item.key);
      });

      plotArea.appendChild(group);
    });

    // set bars to final height after first paint
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const bars = document.querySelectorAll('.bar[data-bar]');
        bars.forEach(bar => {
          const key = bar.getAttribute('data-bar');
          const item = data.find(d => d.key === key);
          if (item) {
            const h = (item.value / tickMax) * 150; // plot height = 150px
            bar.style.height = h + 'px';
          }
        });
      });
    });

    // Set title & ask
    document.querySelector('h1').textContent = Studio.t('title');
    document.querySelector('.ask-section').textContent = Studio.t('ask');

    // feedback handling
    const feedbackBox = document.getElementById('feedbackBox');
    let answered = false;

    Studio.onVerdict((verdict) => {
      if (answered) return; // already done
      if (verdict.correct) {
        feedbackBox.textContent = Studio.t('right');
        feedbackBox.classList.add('correct');
        feedbackBox.classList.remove('wrong');
        // show done text
        const doneDiv = document.createElement('div');
        doneDiv.className = 'done-message';
        doneDiv.textContent = Studio.t('done');
        feedbackBox.appendChild(document.createElement('br'));
        feedbackBox.appendChild(doneDiv);
        answered = true;
        Studio.done();
      } else {
        feedbackBox.textContent = Studio.t('wrong');
        feedbackBox.classList.add('wrong');
        feedbackBox.classList.remove('correct');
        // optionally shake animation
        feedbackBox.style.animation = 'pulse 0.3s';
        setTimeout(() => { feedbackBox.style.animation = ''; }, 300);
      }
    });

    // mark ready after first paint
    window.addEventListener('load', () => {
      Studio.ready();
    });
    // also if already loaded
    if (document.readyState === 'complete') {
      Studio.ready();
    } else {
      window.addEventListener('load', () => Studio.ready());
    }

    // ensure no horizontal scroll
    document.body.style.overflowX = 'hidden';

    // hidden values? not needed but keep tidy
    Studio.event('chart_rendered', { ticks, maxVal: tickMax });

  })();
</script>
