<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #FFF8E7; color: #3E2723; }
#app { width: 360px; height: 640px; margin: 0 auto; position: relative; overflow: hidden; display: flex; flex-direction: column; }
.screen { width: 100%; height: 100%; display: flex; flex-direction: column; }
header { padding: 12px 16px 4px; text-align: center; flex-shrink: 0; }
h1 { font-size: 24px; margin: 0 0 6px; color: #E65100; font-weight: 800; line-height: 1.25; }
.instr { font-size: 15px; margin: 0 0 4px; color: #5D4037; line-height: 1.35; }
.hint { font-size: 12px; margin: 0; color: #8D6E63; font-style: italic; line-height: 1.3; }
.fraction-wrap { text-align: center; flex-shrink: 0; padding: 0 16px 4px; }
.fraction { display: inline-flex; flex-direction: column; align-items: center; font-weight: 800; }
.fraction .num, .fraction .den { font-size: 42px; line-height: 1; color: #E65100; }
.fraction .bar { width: 54px; height: 4px; background: #E65100; border-radius: 2px; margin: 4px 0; }
#shape { flex: 1; display: flex; justify-content: center; align-items: center; min-height: 120px; padding: 0 16px; position: relative; }
.shape-svg { width: 100%; height: 100%; display: block; }
.part { fill: #FFE0B2; stroke: #FFAB91; stroke-width: 3; cursor: pointer; transition: fill 0.18s ease, stroke 0.18s ease, transform 0.1s ease; transform-box: fill-box; transform-origin: center; }
.part:hover { filter: brightness(1.03); }
.part[data-shaded="true"] { fill: #FF8C42; stroke: #E65100; }
.part.tap { animation: tap 0.18s ease; }
@keyframes tap { 50% { transform: scale(0.92); } }
.controls { flex-shrink: 0; padding: 0 16px 16px; }
#feedback { min-height: 24px; text-align: center; font-size: 17px; font-weight: 700; margin: 0 0 8px; }
#feedback.right { color: #2E7D32; }
#feedback.wrong { color: #C62828; }
#check { width: 100%; min-height: 56px; padding: 14px; font-size: 20px; font-weight: 800; color: #fff; background: #FF8C42; border: none; border-radius: 16px; cursor: pointer; transition: transform 0.12s, background 0.2s, box-shadow 0.12s; box-shadow: 0 5px 0 #E65100; }
#check:active { transform: translateY(4px); box-shadow: 0 1px 0 #E65100; }
#check:disabled { background: #BDBDBD; box-shadow: 0 5px 0 #9E9E9E; cursor: not-allowed; }
.hidden { display: none !important; }
@keyframes celebrate { 0%, 100% { transform: scale(1) rotate(0); } 25% { transform: scale(1.05) rotate(1deg); } 75% { transform: scale(1.05) rotate(-1deg); } }
.celebrate .shape-svg { animation: celebrate 0.6s ease; }
#screen-done { justify-content: center; align-items: center; text-align: center; background: #FFF8E7; }
.done-card { display: flex; flex-direction: column; align-items: center; padding: 20px; }
.done-icon { width: 110px; height: 110px; margin-bottom: 14px; }
.done-icon circle { fill: #66BB6A; }
.done-icon path { fill: none; stroke: #fff; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
.done-title { font-size: 26px; color: #2E7D32; font-weight: 800; margin: 0; }
</style>
<div id="app">
  <div class="screen" id="screen-main">
    <header>
      <h1 id="title"></h1>
      <p class="instr" id="instr"></p>
      <p class="hint" id="hint"></p>
    </header>
    <div class="fraction-wrap">
      <div class="fraction" id="fraction">
        <span class="num"></span>
        <span class="bar"></span>
        <span class="den"></span>
      </div>
    </div>
    <div id="shape"></div>
    <div class="controls">
      <div id="feedback"></div>
      <button id="check" data-action="check"></button>
    </div>
  </div>
  <div class="screen hidden" id="screen-done">
    <div class="done-card">
      <svg class="done-icon" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="56"/>
        <path d="M34 62 L52 80 L86 42"/>
      </svg>
      <h1 class="done-title" id="done-text"></h1>
    </div>
  </div>
</div>
<script>
(function(){
  var items = Studio.params.items;
  var useBar = Studio.params.picture === 'bar';
  var currentIndex = 0;
  var waiting = false;

  var titleEl = document.getElementById('title');
  var instrEl = document.getElementById('instr');
  var hintEl = document.getElementById('hint');
  var numEl = document.querySelector('#fraction .num');
  var denEl = document.querySelector('#fraction .den');
  var shapeEl = document.getElementById('shape');
  var checkBtn = document.getElementById('check');
  var feedbackEl = document.getElementById('feedback');
  var mainScreen = document.getElementById('screen-main');
  var doneScreen = document.getElementById('screen-done');
  var doneTextEl = document.getElementById('done-text');

  function setTexts(){
    titleEl.textContent = Studio.t('title');
    instrEl.textContent = Studio.t('instr');
    hintEl.textContent = Studio.t('hint');
    checkBtn.textContent = Studio.t('check');
    doneTextEl.textContent = Studio.t('done');
  }

  function makePizza(d){
    var size = 300;
    var cx = size / 2;
    var cy = size / 2;
    var r = 130;
    var svg = '<svg viewBox="0 0 ' + size + ' ' + size + '" class="shape-svg" preserveAspectRatio="xMidYMid meet">';
    for (var i = 0; i < d; i++) {
      var a1 = -Math.PI / 2 + i * 2 * Math.PI / d;
      var a2 = -Math.PI / 2 + (i + 1) * 2 * Math.PI / d;
      var x1 = cx + r * Math.cos(a1);
      var y1 = cy + r * Math.sin(a1);
      var x2 = cx + r * Math.cos(a2);
      var y2 = cy + r * Math.sin(a2);
      var dpath = 'M ' + cx + ' ' + cy + ' L ' + x1 + ' ' + y1 + ' A ' + r + ' ' + r + ' 0 0 1 ' + x2 + ' ' + y2 + ' Z';
      svg += '<path d="' + dpath + '" class="part" data-part="' + i + '" data-shaded="false" />';
    }
    svg += '</svg>';
    return svg;
  }

  function makeBar(d){
    var W = 320;
    var H = 80;
    var gap = d > 6 ? 0 : 6;
    var segW = (W - gap * (d - 1)) / d;
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="shape-svg" preserveAspectRatio="xMidYMid meet">';
    for (var i = 0; i < d; i++) {
      var x = i * (segW + gap);
      svg += '<rect x="' + x + '" y="0" width="' + segW + '" height="' + H + '" rx="10" class="part" data-part="' + i + '" data-shaded="false" />';
    }
    svg += '</svg>';
    return svg;
  }

  function renderItem(index){
    var item = items[index];
    shapeEl.setAttribute('data-item', item.id);
    numEl.textContent = item.n;
    denEl.textContent = item.d;
    feedbackEl.textContent = '';
    feedbackEl.className = 'feedback';
    shapeEl.classList.remove('celebrate');
    checkBtn.disabled = false;
    waiting = false;

    shapeEl.innerHTML = useBar ? makeBar(item.d) : makePizza(item.d);

    var parts = shapeEl.querySelectorAll('.part');
    for (var i = 0; i < parts.length; i++) {
      parts[i].addEventListener('click', togglePart);
    }
  }

  function togglePart(e){
    if (waiting) return;
    var part = e.currentTarget;
    var shaded = part.getAttribute('data-shaded') === 'true';
    var next = !shaded;
    part.setAttribute('data-shaded', next ? 'true' : 'false');
    part.classList.add('tap');
    setTimeout(function(){ part.classList.remove('tap'); }, 180);
    Studio.event('part_tap', { part: part.getAttribute('data-part'), shaded: next });
  }

  function getColoredCount(){
    return shapeEl.querySelectorAll('.part[data-shaded="true"]').length;
  }

  function checkAnswer(){
    if (waiting) return;
    var item = items[currentIndex];
    Studio.answer({ n: getColoredCount(), d: item.d });
  }

  checkBtn.addEventListener('click', checkAnswer);

  Studio.onVerdict(function(result){
    if (result.correct) {
      feedbackEl.textContent = Studio.t('right');
      feedbackEl.className = 'feedback right';
      shapeEl.classList.add('celebrate');
      waiting = true;
      checkBtn.disabled = true;
      Studio.event('item_correct', { id: items[currentIndex].id });
      setTimeout(function(){
        currentIndex++;
        if (currentIndex >= items.length) {
          mainScreen.classList.add('hidden');
          doneScreen.classList.remove('hidden');
          Studio.done();
        } else {
          renderItem(currentIndex);
        }
      }, 1300);
    } else {
      feedbackEl.textContent = Studio.t('wrong');
      feedbackEl.className = 'feedback wrong';
      Studio.event('item_wrong', { id: items[currentIndex].id });
    }
  });

  setTexts();
  renderItem(0);
  Studio.ready();
})();
</script>
