<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
body { background: #FFF7ED; font-family: system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, sans-serif; overflow-x: hidden; }
.app { width: 100%; min-height: 100vh; padding: 24px 16px 48px; display: flex; flex-direction: column; align-items: center; }
.title { font-size: 20px; font-weight: 800; color: #292524; text-align: center; margin-bottom: 24px; line-height: 1.3; max-width: 100%; }
.chart-section { width: 100%; }
.chart-row { display: flex; align-items: stretch; }
.y-axis-title { width: 36px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #57534E; writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; letter-spacing: 0.5px; flex-shrink: 0; }
.chart-box { flex: 1; position: relative; height: 300px; border-left: 2px solid #57534E; border-bottom: 2px solid #57534E; background: rgba(255,255,255,0.5); border-radius: 0 10px 0 0; }
.grid-line { position: absolute; left: 0; right: 0; border-top: 1.5px dashed #D6D3D1; z-index: 1; }
.tick-label { position: absolute; right: calc(100% + 8px); transform: translateY(50%); font-size: 12px; font-weight: 700; color: #57534E; line-height: 1; white-space: nowrap; z-index: 2; }
.bars-wrap { position: absolute; inset: 0; display: flex; justify-content: space-around; align-items: flex-end; padding: 0 6px; z-index: 3; }
.bar-col { flex: 1; max-width: 64px; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
.bar-wrapper { position: relative; width: 48px; height: 100%; margin: 0 auto; }
.bar { position: absolute; bottom: 0; left: 4px; right: 4px; height: 0%; border-radius: 8px 8px 0 0; transition: height 1.2s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.12s ease, box-shadow 0.3s ease, filter 0.4s ease, opacity 0.4s ease; cursor: pointer; touch-action
