<style>
  .fruit-card{box-sizing:border-box;width:100%;max-width:440px;min-height:100vh;margin:auto;padding:22px 16px 28px;background:#fffaf0;color:#263d38;font-family:system-ui,sans-serif}
  .fruit-card *{box-sizing:border-box}
  .fruit-panel{background:#fff;border:2px solid #e9eee4;border-radius:28px;padding:19px 12px 16px;box-shadow:0 10px 28px #39564a12}
  .fruit-title{margin:0 8px 8px;font-size:1.5rem;line-height:1.25;font-weight:800}
  .fruit-ask{margin:0 8px 18px;font-size:1.08rem;line-height:1.4}
  .fruit-chart{display:block;width:100%;height:auto;overflow:visible}
  .fruit-grid{stroke:#dfe9e2;stroke-width:1}
  .fruit-axis{stroke:#748c80;stroke-width:2;stroke-linecap:round}
  .fruit-tick,.fruit-name,.fruit-ytitle{fill:#526a5f;font-family:system-ui,sans-serif}
  .fruit-tick{font-size:12px}
  .fruit-name{font-size:12px;font-weight:650}
  .fruit-ytitle{font-size:12px;font-weight:700}
  .fruit-bar{fill:#f3a85d;stroke:#dc8740;stroke-width:1.5;cursor:pointer;transform-box:fill-box;transform-origin:center bottom;animation:fruit-grow .75s cubic-bezier(.2,.75,.25,1) both;transition:fill .18s,filter .18s}
  .fruit-bar:hover,.fruit-bar:focus{fill:#e99448;filter:drop-shadow(0 3px 3px #9c633b55);outline:none}
  .fruit-bar:active{filter:brightness(.93)}
  .fruit-bar:focus-visible{stroke:#345f50;stroke-width:3}
  .fruit-value{fill:#263d38;font:800 14px system-ui,sans-serif;pointer-events:none}
  .fruit-feedback{min-height:52px;margin:15px 8px 0;padding:10px 14px;border-radius:16px;background:#f1f6ed;font-size:1.05rem;font-weight:700;line-height:1.5}
  .fruit-feedback:empty{background:transparent}
  .fruit-feedback[data-state="wrong"]{background:#fff0e7}
  .fruit-feedback[data-state="right"]{background:#e4f4e8}
  @keyframes fruit-grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @media(prefers-reduced-motion:reduce){.fruit-bar{animation:none;transition:none}}
</style>
<main class="fruit-card">
  <section class="fruit-panel">
    <h1 class="fruit-title" id="fruit-title"></h1>
    <p class="fruit-ask" id="fruit-ask"></p>
    <svg class="fruit-chart" id="fruit-chart" viewBox="0 0 340 350" role="img" aria-labelledby="fruit-title fruit-ask">
      <g id="fruit-grid"></g>
      <g id="fruit-bars"></g>
      <g id="fruit-labels"></g>
    </svg>
    <div class="fruit-feedback" id="fruit-feedback" role="status" aria-live="polite"></div>
  </section>
</main>
<script>
(() => {
  const data = Studio.params.data;
  const svgNS = "http://www.w3.org/2000/svg";
  const grid = document.getElementById("fruit-grid");
  const bars = document.getElementById("fruit-bars");
  const labels = document.getElementById("fruit-labels");
  const feedback = document.getElementById("fruit-feedback");
  document.getElementById("fruit-title").textContent = Studio.t("title");
  document.getElementById("fruit-ask").textContent = Studio.t("ask");
  const make = (tag, attrs, parent, text) => {
    const node = document.createElementNS(svgNS, tag);
    Object.entries(attrs).forEach(([key,value]) => node.setAttribute(key, value));
    if (text !== undefined) node.textContent = text;
    parent.appendChild(node);
    return node;
  };
  const maximum = Math.max(...data.map(item => item.value), 1);
  const raw = maximum / 4;
  const power = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,5,10].map(n => n * power).find(n => n >= raw);
  const top = Math.ceil(maximum / step) * step;
  const bottomY = 276, topY = 40, leftX = 55, rightX = 328;
  for (let value = 0; value <= top; value += step) {
    const y = bottomY - value / top * (bottomY - topY);
    make("line",{x1:leftX,y1:y,x2:rightX,y2:y,class:"fruit-grid"},grid);
    make("text",{x:46,y:y+4,"text-anchor":"end",class:"fruit-tick","data-tick":value},grid,String(value));
  }
  make("line",{x1:leftX,y1:topY,x2:leftX,y2:bottomY,class:"fruit-axis"},grid);
  make("line",{x1:leftX,y1:bottomY,x2:rightX,y2:bottomY,class:"fruit-axis"},grid);
  make("text",{x:16,y:157,transform:"rotate(-90 16 157)","text-anchor":"middle",class:"fruit-ytitle"},labels,Studio.t("yaxis"));
  let waiting = false, finished = false;
  const slot = (rightX-leftX)/data.length;
  data.forEach((item,index) => {
    const cx = leftX + slot*(index+.5);
    const height = item.value/top*(bottomY-topY);
    const width = Math.min(35,slot*.67);
    const bar = make("rect",{
      x:cx-width/2,y:bottomY-height,width,height,rx:7,
      class:"fruit-bar","data-bar":item.key,"data-value":item.value,
      role:"button",tabindex:"0","aria-label":Studio.t(item.key)
    },bars);
    make("text",{x:cx,y:310,"text-anchor":"middle",class:"fruit-name"},labels,Studio.t(item.key));
    const choose = () => {
      if (waiting || finished) return;
      waiting = true;
      feedback.textContent = "";
      feedback.removeAttribute("data-state");
      bars.querySelectorAll(".fruit-value").forEach(node => node.remove());
      make("text",{x:cx,y:Math.max(topY+15,bottomY-height-9),"text-anchor":"middle",class:"fruit-value"},bars,String(item.value));
      Studio.event("bar_tap",{key:item.key,value:item.value});
      Studio.answer(item.key);
    };
    bar.addEventListener("click",choose);
    bar.addEventListener("keydown",event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        choose();
      }
    });
  });
  Studio.onVerdict(({correct}) => {
    feedback.dataset.state = correct ? "right" : "wrong";
    feedback.textContent = Studio.t(correct ? "right" : "wrong");
    if (correct) {
      finished = true;
      feedback.textContent = Studio.t("right") + " " + Studio.t("done");
      Studio.done();
    } else {
      waiting = false;
    }
  });
  Studio.ready();
})();
</script>
