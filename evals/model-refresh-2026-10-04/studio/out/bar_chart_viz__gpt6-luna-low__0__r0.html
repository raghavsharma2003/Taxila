<style>
  *{box-sizing:border-box}
  :root{--ink:#263b4b;--muted:#617889;--paper:#fffdf8;--sky:#e8f4f5;--line:#d4e4e4;--bar:#f1a65b;--bar-dark:#df8740;--mint:#69b8a4;--pink:#f5d9cc}
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--sky)}
  .stage{width:min(100%,520px);min-height:100vh;margin:auto;padding:18px 14px 20px;display:flex;flex-direction:column;gap:12px}
  .card{background:var(--paper);border:1px solid #dce9e5;border-radius:24px;box-shadow:0 8px 24px #29495612}
  h1{font-size:clamp(23px,6vw,30px);line-height:1.15;margin:0;padding:19px 20px 5px;font-weight:800;letter-spacing:-.4px}
  .chart-card{padding:7px 7px 0;overflow:hidden}
  svg{display:block;width:100%;height:auto;overflow:visible}
  .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 5}
  .axis{stroke:#78909c;stroke-width:1.5}
  .tick-label{font-size:12px;fill:var(--muted);text-anchor:end;dominant-baseline:middle}
  .fruit-label{font-size:11px;fill:var(--ink);text-anchor:middle;font-weight:650}
  .axis-title{font-size:12px;fill:var(--muted);font-weight:700;text-anchor:middle}
  .bar{fill:var(--bar);stroke:#e8944d;stroke-width:1;transform-box:fill-box;transform-origin:center bottom;animation:grow .8s cubic-bezier(.2,.8,.25,1) both}
  .bar-tap{fill:transparent;cursor:pointer}
  .bar-tap:focus{outline:none}
  .bar-tap:focus-visible{stroke:#315e68;stroke-width:3;stroke-dasharray:4 3}
  .bar-group{transition:filter .18s,transform .18s;transform-box:fill-box;transform-origin:center}
  .bar-group:active{transform:scale(.96)}
  .bar-group.chosen .bar{fill:var(--bar-dark)}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .prompt{min-height:76px;padding:15px 18px;display:flex;align-items:center;gap:12px;font-size:17px;font-weight:700;line-height:1.3}
  .dot{width:13px;height:13px;flex:0 0 13px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 5px #69b8a421}
  .feedback{font-size:16px}
  .feedback.good .dot{background:#58a78e}
  .feedback.bad .dot{background:#df8b73;box-shadow:0 0 0 5px #df8b7321}
  .value{margin-left:auto;font-size:24px;font-weight:850;color:#a95f2c}
  @media(max-height:680px){.stage{padding-top:10px;gap:8px}h1{padding-top:14px}.chart-card{padding-top:2px}.prompt{min-height:66px}}
</style>

<main class="stage">
  <h1 id="title"></h1>
  <section class="card chart-card" aria-label="">
    <svg id="chart" viewBox="0 0 360 350" role="group" aria-label=""></svg>
  </section>
  <section id="prompt" class="card prompt">
    <span class="dot" aria-hidden="true"></span>
    <span id="message"></span>
    <span id="value" class="value"></span>
  </section>
</main>

<script>
(()=>{
  const data=Studio.params.data;
  const t=Studio.t;
  const title=document.getElementById("title");
  const svg=document.getElementById("chart");
  const message=document.getElementById("message");
  const valueBox=document.getElementById("value");
  const prompt=document.getElementById("prompt");
  title.textContent=t("title");
  const left=50,right=350,top=24,base=266,plotH=base-top;
  const max=Math.max(...data.map(d=>Number(d.value)));
  const raw=max/5;
  const power=Math.pow(10,Math.floor(Math.log10(raw||1)));
  const fraction=raw/power;
  const step=(fraction<=1?1:fraction<=2?2:fraction<=5?5:10)*power;
  const ceiling=Math.ceil(max/step)*step;
  const nice=(n)=>Number.isInteger(n)?String(n):String(Number(n.toFixed(2)));
  const ns="http://www.w3.org/2000/svg";
  const add=(tag,attrs,parent=svg,text)=>{
    const el=document.createElementNS(ns,tag);
    Object.entries(attrs||{}).forEach(([k,v])=>el.setAttribute(k,v));
    if(text!==undefined)el.textContent=text;
    parent.appendChild(el);return el;
  };
  for(let n=0;n<=ceiling+step/100;n+=step){
    const y=base-(n/ceiling)*plotH;
    add("line",{x1:left,y1:y,x2:right,y2:y,class:n===0?"axis":"grid"});
    const label=add("text",{x:left-9,y:y,class:"tick-label","data-tick":nice(n)},nice(n));
    if(n===0)label.setAttribute("dominant-baseline","auto");
  }
  add("line",{x1:left,y1:top,x2:left,y2:base,class:"axis"});
  add("text",{x:14,y:(top+base)/2,class:"axis-title",transform:`rotate(-90 14 ${(top+base)/2})`},t("yaxis"));
  const slot=(right-left)/data.length;
  data.forEach((item,i)=>{
    const cx=left+slot*(i+.5);
    const h=(Number(item.value)/ceiling)*plotH;
    const group=add("g",{class:"bar-group"});
    const bar=add("rect",{x:cx-16,y:base-h,width:32,height:h,rx:7,class:"bar","data-bar":item.key,"data-value":String(item.value)},group);
    bar.style.animationDelay=(i*.07)+"s";
    const hit=add("rect",{x:cx-26,y:top,width:52,height:base-top,class:"bar-tap",tabindex:"0",role:"button","aria-label":t(item.key)},group);
    add("text",{x:cx,y:base+24,class:"fruit-label"},t(item.key));
    const choose=()=>{
      document.querySelectorAll(".bar-group.chosen").forEach(el=>el.classList.remove("chosen"));
      group.classList.add("chosen");
      valueBox.textContent=String(item.value);
      Studio.event("bar_tap",{key:item.key,value:item.value});
      Studio.answer(item.key);
    };
    hit.addEventListener("click",choose);
    hit.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();choose()}});
  });
  message.textContent=t("ask");
  Studio.onVerdict(({correct})=>{
    prompt.classList.remove("good","bad");
    if(correct){
      prompt.classList.add("good");
      message.textContent=t("right");
      message.textContent+=" "+t("done");
      Studio.done();
    }else{
      prompt.classList.add("bad");
      message.textContent=t("wrong");
    }
  });
  Studio.ready();
})();
</script>
