<style>
  :root{
    --ink:#20343a;
    --sky:#dff2f7;
    --soil:#8a5a3b;
    --leaf:#4caf50;
    --sun:#ffcf47;
    --water:#3ba7e8;
    --co2:#8a7fd6;
    --o2:#f28a3d;
    --card:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  .ps-wrap{
    width:100%;max-width:360px;margin:0 auto;
    font-family:"Trebuchet MS",Verdana,Geneva,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,#eafafd 0%,#dff2f7 55%,#e9f7ea 100%);
    padding:8px 8px 12px;
    border-radius:16px;
    overflow:hidden;
  }
  .ps-title{
    font-size:16px;font-weight:800;text-align:center;
    padding:2px 2px 6px;
    line-height:1.15;
    overflow-wrap:break-word;
  }
  .ps-stage{
    position:relative;
    width:100%;
    border-radius:14px;
    box-shadow:0 6px 0 rgba(0,0,0,.10),0 10px 22px rgba(20,50,60,.16);
    overflow:hidden;
    line-height:0;
  }
  svg.ps-svg{display:block;width:100%;height:auto;}
  .ps-cap{
    min-height:50px;
    margin:8px 0 6px;
    background:var(--card);
    border-radius:14px;
    padding:8px 10px;
    font-size:13px;
    font-weight:700;
    line-height:1.28;
    text-align:center;
    box-shadow:0 3px 0 rgba(0,0,0,.07),0 6px 14px rgba(20,50,60,.10);
    display:flex;align-items:center;justify-content:center;
    overflow-wrap:break-word;
  }
  .ps-cap.pulse{animation:capPulse .5s ease;}
  @keyframes capPulse{0%{transform:scale(.97)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
  .ps-row{
    display:flex;gap:6px;align-items:center;justify-content:space-between;
  }
  button.ps-btn{
    font-family:inherit;
    border:none;
    cursor:pointer;
    color:var(--ink);
    background:#ffffff;
    border-radius:14px;
    box-shadow:0 3px 0 rgba(0,0,0,.12),0 5px 12px rgba(20,50,60,.12);
    transition:transform .12s ease, background .2s ease, box-shadow .2s ease;
    min-height:44px;
  }
  button.ps-btn:active{transform:scale(.93);}
  button.ps-btn.ps-play{
    flex:0 0 74px;
    min-width:74px;height:48px;
    font-size:14px;font-weight:800;
    background:linear-gradient(180deg,#ffe07a,#ffcf47);
    box-shadow:0 4px 0 #d9a72f,0 8px 16px rgba(20,50,60,.18);
    display:flex;align-items:center;justify-content:center;gap:4px;
    padding:0 6px;
    overflow-wrap:break-word;
  }
  button.ps-btn.ps-play .ic{font-size:13px;}
  .ps-steps{display:flex;gap:5px;align-items:center;}
  button.ps-btn.ps-step{
    width:44px;height:44px;
    font-size:16px;font-weight:800;
    background:#ffffff;
    border:2px solid #cfe4ea;
    padding:0;
  }
  button.ps-btn.ps-step.on{
    background:linear-gradient(180deg,#7fd77f,#4caf50);
    color:#fff;
    border-color:#2e8b3d;
    box-shadow:0 3px 0 #2e8b3d,0 6px 14px rgba(46,139,61,.35);
  }
  .ps-ask{
    margin-top:9px;
    background:var(--card);
    border-radius:14px;
    padding:9px 9px 11px;
    box-shadow:0 3px 0 rgba(0,0,0,.07),0 8px 18px rgba(20,50,60,.12);
  }
  .ps-ask-t{
    font-size:13.5px;font-weight:800;text-align:center;
    line-height:1.25;margin-bottom:8px;
    overflow-wrap:break-word;
  }
  .ps-opts{display:flex;gap:6px;justify-content:space-between;}
  button.ps-btn.ps-opt{
    flex:1 1 0;
    min-width:0;height:48px;
    font-size:13.5px;font-weight:800;
    background:linear-gradient(180deg,#ffffff,#eef7fb);
    border:2px solid #cfe4ea;
    padding:0 3px;
    overflow-wrap:break-word;
  }
  button.ps-btn.ps-opt.good{
    background:linear-gradient(180deg,#8fe08f,#4caf50);
    color:#fff;border-color:#2e8b3d;
    animation:optPop .45s ease;
  }
  button.ps-btn.ps-opt.bad{
    background:linear-gradient(180deg,#ffd0c4,#ffab95);
    border-color:#e5765a;
    animation:optShake .4s ease;
  }
  @keyframes optPop{0%{transform:scale(.9)}55%{transform:scale(1.07)}100%{transform:scale(1)}}
  @keyframes optShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .ps-feed{
    text-align:center;font-size:13px;font-weight:800;
    min-height:17px;margin-top:7px;line-height:1.25;
    overflow-wrap:break-word;
  }
  .ps-feed.ok{color:#2e8b3d;}
  .ps-feed.no{color:#c9583b;}

  #ps-sunGroup,#ps-leafGroup,#ps-rootsGroup,#ps-stemGroup{transition:filter .4s ease,opacity .4s ease;transform-box:fill-box;transform-origin:center;}
  .ps-glow{filter:drop-shadow(0 0 6px rgba(255,214,80,.95)) saturate(1.25);}
  .ps-glow-green{filter:drop-shadow(0 0 7px rgba(140,240,110,.95)) saturate(1.2);}
  .ps-glow-blue{filter:drop-shadow(0 0 6px rgba(70,180,255,.95)) saturate(1.2);}
  #ps-gluce{transition:opacity .45s ease;}
  @keyframes sunPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  #ps-sunCore{animation:sunPulse 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
</style>

  <div class="ps-cap" id="ps-caption" data-caption></div>

  <div class="ps-row">
    <button class="ps-btn ps-play" id="ps-play" data-action="play" type="button">
      <span class="ic" id="ps-play-ic">&#10073;&#10073;</span><span id="ps-play-txt" data-label="pause">pause</span>
    </button>
    <div class="ps-steps" id="ps-steps">
      <button class="ps-btn ps-step on" data-action="step-1" type="button">1</button>
      <button class="ps-btn ps-step" data-action="step-2" type="button">2</button>
      <button class="ps-btn ps-step" data-action="step-3" type="button">3</button>
      <button class="ps-btn ps-step" data-action="step-4" type="button">4</button>
      <button class="ps-btn ps-step" data-action="step-5" type="button">5</button>
    </div>
  </div>

  <div class="ps-ask">
    <div class="ps-ask-t" id="ps-ask" data-label="ask"></div>
    <div class="ps-opts">
      <button class="ps-btn ps-opt" data-option="co2" type="button">co2</button>
      <button class="ps-btn ps-opt" data-option="o2" type="button">o2</button>
      <button class="ps-btn ps-opt" data-option="water" type="button">water</button>
    </div>
    <div class="ps-feed" id="ps-feed"></div>

<script>
(function(){
  var P = (window.Studio && Studio.params) || {};
  var N = Number(P.steps) || 5;
  function t(k){ return (window.Studio && Studio.t) ? Studio.t(k) : k; }
  function el(id){ return document.getElementById(id); }

  var capEl = document.querySelector('[data-caption]');
  var stepBtns = Array.prototype.slice.call(document.querySelectorAll('[data-action^="step-"]'));
  var playBtn = document.querySelector('[data-action="play"]');
  var playTxt = el('ps-play-txt');
  var playIc = el('ps-play-ic');
  var feed = el('ps-feed');

  var LAST = N;

  el('ps-title').textContent = t('title');
  el('ps-ask').textContent = t('ask');
  Array.prototype.slice.call(document.querySelectorAll('text[data-label], #ps-play-txt')).forEach(function(n){
    var k = n.getAttribute('data-label');
    if(k) n.textContent = t(k);
  });
  Array.prototype.slice.call(document.querySelectorAll('[data-option]')).forEach(function(b){
    b.textContent = t(b.getAttribute('data-option'));
  });

  var captions = [];
  for(var i=1;i<=LAST;i++){ captions.push(t('step'+i)); }

  var svg = document.querySelector('svg.ps-svg');
  var playing = true;

  function svgPause(){ if(svg && svg.pauseAnimations){ try{ svg.pauseAnimations(); }catch(e){} } }
  function svgPlay(){ if(svg && svg.unpauseAnimations){ try{ svg.unpauseAnimations(); }catch(e){} } }

  function setPlaying(v){
    playing = v;
    if(playing){
      svgPlay();
      playTxt.textContent = t('pause');
      playTxt.setAttribute('data-label','pause');
      playIc.innerHTML = '&#10073;&#10073;';
    } else {
      svgPause();
      playTxt.textContent = t('play');
      playTxt.setAttribute('data-label','play');
      playIc.innerHTML = '&#9654;';
    }
  }

  var sunG = el('ps-sunGroup'), leafG = el('ps-leafGroup'), rootG = el('ps-rootsGroup'), stemG = el('ps-stemGroup');
  var glu = el('ps-gluce');

  function clearEmphasis(){
    [sunG,leafG,rootG,stemG].forEach(function(g){
      if(g) g.classList.remove('ps-glow','ps-glow-green','ps-glow-blue');
    });
    if(glu) glu.style.opacity = '.35';
  }

  function emphasis(step){
    clearEmphasis();
    if(step===1){ if(sunG) sunG.classList.add('ps-glow'); }
    else if(step===2){ if(rootG) rootG.classList.add('ps-glow-blue'); if(stemG) stemG.classList.add('ps-glow-blue'); if(leafG) leafG.classList.add('ps-glow-green'); }
    else if(step===3){ if(leafG) leafG.classList.add('ps-glow'); if(sunG) sunG.classList.add('ps-glow'); if(glu) glu.style.opacity='.7'; }
    else if(step===4){ if(glu){ glu.style.opacity='1'; } if(leafG) leafG.classList.add('ps-glow-green'); }
    else if(step===5){ if(leafG) leafG.classList.add('ps-glow-green'); }
  }

  function showStep(n){
    n = Math.min(Math.max(1, n), LAST);
    capEl.textContent = captions[n-1] || '';
    capEl.classList.remove('pulse');
    void capEl.offsetWidth;
    capEl.classList.add('pulse');
    stepBtns.forEach(function(b){
      b.classList.toggle('on', b.getAttribute('data-action')==='step-'+n);
    });
    emphasis(n);
    if(window.Studio && Studio.event) Studio.event('step_view', {step:n});
  }

  setPlaying(true);
  showStep(1);

  playBtn.addEventListener('click', function(){
    setPlaying(!playing);
    if(window.Studio && Studio.event) Studio.event('toggle_flow', {playing:playing});
  });

  stepBtns.forEach(function(b){
    b.addEventListener('click', function(){
      var m = /step-(\d+)/.exec(b.getAttribute('data-action'));
      showStep(m ? parseInt(m[1],10) : 1);
    });
  });

  var done = false;
  var optBtns = Array.prototype.slice.call(document.querySelectorAll('[data-option]'));
  function clearOpts(){
    optBtns.forEach(function(b){ b.classList.remove('good','bad'); });
  }
  optBtns.forEach(function(b){
    b.addEventListener('click', function(){
      if(done) return;
      clearOpts();
      b.classList.add('wait');
      if(window.Studio && Studio.answer) Studio.answer(b.getAttribute('data-option'));
    });
  });

  if(window.Studio && Studio.onVerdict){
    Studio.onVerdict(function(v){
      var correct = v && v.correct;
      if(correct){
        done = true;
        clearOpts();
        optBtns.forEach(function(b){
          if(b.getAttribute('data-option')==='o2') b.classList.add('good');
        });
        feed.className = 'ps-feed ok';
        feed.textContent = capEl.textContent;
        if(window.Studio && Studio.done) Studio.done();
      } else {
        clearOpts();
        feed.className = 'ps-feed no';
        feed.textContent = t('ask');
      }
    });
  }

  if(window.Studio && Studio.ready) Studio.ready();
})();
</script>
