<style>
  :root{
    --ink:#3d315b;
    --cream:#fff9ee;
    --peach:#ffb56b;
    --tomato:#f56f65;
    --cheese:#ffd95a;
    --basil:#58af7b;
    --purple:#7664bd;
    --panel:#ffffff;
    --shadow:0 10px 24px rgba(78,55,106,.16);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-width:320px;
    background:
      radial-gradient(circle at 12% 8%,#ffe4a7 0 3px,transparent 4px),
      radial-gradient(circle at 87% 16%,#d8c9ff 0 5px,transparent 6px),
      linear-gradient(160deg,#fff6dc,#f5edff);
    color:var(--ink);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  #app{
    min-height:640px;
    width:100%;
    overflow:hidden;
    position:relative;
    padding:18px 16px 20px;
  }
  .card{
    width:min(100%,390px);
    margin:0 auto;
    min-height:602px;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
  }
  .heading{
    text-align:center;
    font-size:25px;
    line-height:1.1;
    font-weight:850;
    letter-spacing:.1px;
    margin:4px 0 8px;
  }
  .instruction{
    text-align:center;
    font-size:15px;
    line-height:1.35;
    min-height:40px;
    margin:0 8px 8px;
    color:#66557e;
    font-weight:650;
  }
  .fraction{
    min-width:102px;
    padding:7px 17px 8px;
    border-radius:18px;
    background:var(--purple);
    color:#fff;
    box-shadow:0 5px 0 #55458e;
    text-align:center;
    font-size:25px;
    line-height:1;
    font-weight:900;
    margin:2px 0 10px;
  }
  .pizza-wrap{
    width:294px;
    height:294px;
    flex:none;
    position:relative;
    filter:drop-shadow(0 12px 10px rgba(91,61,68,.16));
  }
  #pizza{
    display:block;
    width:294px;
    height:294px;
    overflow:visible;
  }
  .plate{
    fill:#fff;
    stroke:#e8d9ca;
    stroke-width:9;
  }
  .crust{
    fill:#dc8a45;
    stroke:#b86637;
    stroke-width:3;
  }
  .base{
    fill:#ffe3a4;
  }
  .slice{
    fill:#fff2c9;
    stroke:#fffaf0;
    stroke-width:3;
    cursor:pointer;
    transform-box:fill-box;
    transform-origin:center;
    transition:fill .18s ease,transform .16s ease,filter .16s ease;
  }
  .slice:active{transform:scale(.96)}
  .slice.shaded{
    fill:var(--tomato);
    filter:brightness(1.04);
  }
  .slice.shaded:nth-of-type(3n){fill:#e85d66}
  .slice.shaded:nth-of-type(4n){fill:#f88156}
  .pepper{
    fill:#fff1b9;
    opacity:.9;
    pointer-events:none;
  }
  .center-dot{
    fill:#ffe9a7;
    stroke:#c7773c;
    stroke-width:2;
    pointer-events:none;
  }
  .feedback{
    min-height:38px;
    margin:4px auto 8px;
    padding:8px 15px;
    border-radius:16px;
    font-size:15px;
    line-height:1.2;
    font-weight:800;
    text-align:center;
    color:#66557e;
    transition:transform .2s ease,background .2s ease,color .2s ease;
  }
  .feedback.good{
    color:#187348;
    background:#dff7e8;
    transform:scale(1.04);
  }
  .feedback.bad{
    color:#a6455c;
    background:#ffe5e8;
    animation:wiggle .38s ease;
  }
  @keyframes wiggle{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-7px)}
    75%{transform:translateX(7px)}
  }
  .check{
    width:min(100%,270px);
    min-height:52px;
    border:0;
    border-radius:18px;
    background:var(--basil);
    box-shadow:0 6px 0 #37875a,0 10px 19px rgba(53,132,89,.22);
    color:#fff;
    font:800 18px/1 system-ui,sans-serif;
    cursor:pointer;
    transition:transform .14s ease,box-shadow .14s ease,opacity .18s ease;
  }
  .check:active{
    transform:translateY(5px) scale(.98);
    box-shadow:0 1px 0 #37875a;
  }
  .check:disabled{opacity:.58;cursor:default}
  .celebrate{
    animation:pop .72s ease both;
  }
  @keyframes pop{
    0%{transform:scale(1)}
    35%{transform:scale(1.09) rotate(2deg)}
    65%{transform:scale(.98) rotate(-1deg)}
    100%{transform:scale(1)}
  }
  .spark{
    position:absolute;
    width:12px;
    height:12px;
    border-radius:4px;
    background:var(--cheese);
    pointer-events:none;
    opacity:0;
  }
  .spark.go{
    animation:spark .7s ease-out forwards;
  }
  .spark:nth-child(1){left:22%;top:37%;background:#ff7670;--x:-33px;--y:-56px}
  .spark:nth-child(2){left:73%;top:38%;background:#745fc0;--x:38px;--y:-61px}
  .spark:nth-child(3){left:27%;top:58%;background:#58af7b;--x:-42px;--y:35px}
  .spark:nth-child(4){left:72%;top:61%;background:#ffbf56;--x:43px;--y:28px}
  @keyframes spark{
    0%{opacity:0;transform:scale(.2)}
    20%{opacity:1}
    100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(180deg) scale(1.3)}
  }
  #doneScreen{
    display:none;
    min-height:570px;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
  }
  #doneScreen.show{display:flex}
  .done-art{
    width:220px;
    height:190px;
    margin-bottom:18px;
    animation:floaty 2.8s ease-in-out infinite;
  }
  @keyframes floaty{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-9px)}
  }
  .done-text{
    max-width:290px;
    padding:15px 20px;
    border-radius:22px;
    background:#fff;
    box-shadow:var(--shadow);
    font-size:22px;
    line-height:1.2;
    font-weight:850;
  }
  .hidden{display:none!important}
</style>

<div id="app">
  <main class="card">
    <section id="playScreen" data-item="">
      <div id="title" class="heading"></div>
      <div id="instruction" class="instruction"></div>
      <div id="target" class="fraction"></div>
      <div class="pizza-wrap">
        <svg id="pizza" viewBox="0 0 300 300" role="img">
          <circle class="plate" cx="150" cy="150" r="139"></circle>
          <circle class="crust" cx="150" cy="150" r="122"></circle>
          <circle class="base" cx="150" cy="150" r="111"></circle>
          <g id="parts"></g>
          <circle class="center-dot" cx="150" cy="150" r="8"></circle>
        </svg>
        <i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i>
      </div>
      <div id="feedback" class="feedback"></div>
      <button id="check" class="check" data-action="check" type="button"></button>
    </section>
    <section id="doneScreen">
      <svg class="done-art" viewBox="0 0 220 190" aria-hidden="true">
        <circle cx="110" cy="96" r="77" fill="#fff" stroke="#e4d4c3" stroke-width="8"></circle>
        <circle cx="110" cy="96" r="66" fill="#dc8a45"></circle>
        <path d="M110 96 L110 30 A66 66 0 0 1 172.8 116.4 Z" fill="#f56f65" stroke="#fff7dd" stroke-width="3"></path>
        <path d="M110 96 L172.8 116.4 A66 66 0 0 1 77.2 153.3 Z" fill="#f56f65" stroke="#fff7dd" stroke-width="3"></path>
        <path d="M110 96 L77.2 153.3 A66 66 0 0 1 47.2 75.6 Z" fill="#f56f65" stroke="#fff7dd" stroke-width="3"></path>
        <path d="M110 96 L47.2 75.6 A66 66 0 0 1 110 30 Z" fill="#f56f65" stroke="#fff7dd" stroke-width="3"></path>
        <circle cx="110" cy="96" r="7" fill="#ffe9a7"></circle>
        <circle cx="53" cy="35" r="7" fill="#ffd95a"></circle>
        <circle cx="181" cy="45" r="6" fill="#58af7b"></circle>
        <circle cx="189" cy="138" r="7" fill="#7664bd"></circle>
      </svg>
      <div id="doneText" class="done-text"></div>
    </section>
  </main>
</div>

<script>
(function(){
  var items=Studio.params.items;
  var index=0, locked=false, finished=false;
  var play=document.getElementById('playScreen');
  var parts=document.getElementById('parts');
  var target=document.getElementById('target');
  var feedback=document.getElementById('feedback');
  var check=document.getElementById('check');
  var pizza=document.getElementById('pizza');
  var sparks=document.querySelectorAll('.spark');

  document.getElementById('title').textContent=Studio.t('title');
  document.getElementById('instruction').textContent=Studio.t('instr');
  check.textContent=Studio.t('check');
  document.getElementById('doneText').textContent=Studio.t('done');

  function point(a,r){
    return {x:150+Math.cos(a)*r,y:150+Math.sin(a)*r};
  }
  function sector(a,b){
    var p=point(a,110), q=point(b,110);
    var large=b-a>Math.PI?1:0;
    return 'M 150 150 L '+p.x+' '+p.y+' A 110 110 0 '+large+' 1 '+q.x+' '+q.y+' Z';
  }
  function loadItem(){
    var item=items[index];
    play.setAttribute('data-item',item.id);
    target.textContent=String(item.n)+'/'+String(item.d);
    parts.innerHTML='';
    feedback.textContent=Studio.t('hint');
    feedback.className='feedback';
    locked=false;
    check.disabled=false;
    for(var i=0;i<item.d;i++){
      var start=-Math.PI/2+(Math.PI*2*i/item.d);
      var end=-Math.PI/2+(Math.PI*2*(i+1)/item.d);
      var path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d',sector(start,end));
      path.setAttribute('class','slice');
      path.setAttribute('data-part',String(i));
      path.setAttribute('data-shaded','false');
      path.addEventListener('click',toggle);
      parts.appendChild(path);
    }
  }
  function toggle(e){
    if(locked)return;
    var el=e.currentTarget;
    var on=el.getAttribute('data-shaded')==='true';
    el.setAttribute('data-shaded',on?'false':'true');
    el.classList.toggle('shaded',!on);
    feedback.textContent=Studio.t('hint');
    feedback.className='feedback';
    Studio.event('part_toggle',{item:items[index].id,part:Number(el.getAttribute('data-part')),shaded:!on});
  }
  check.addEventListener('click',function(){
    if(locked)return;
    locked=true;
    check.disabled=true;
    var selected=parts.querySelectorAll('[data-shaded="true"]').length;
    Studio.event('check',{item:items[index].id,n:selected,d:items[index].d});
    Studio.answer({n:selected,d:items[index].d});
  });
  Studio.onVerdict(function(verdict){
    if(!locked||finished)return;
    if(verdict.correct){
      feedback.textContent=Studio.t('right');
      feedback.className='feedback good';
      pizza.classList.remove('celebrate');
      void pizza.offsetWidth;
      pizza.classList.add('celebrate');
      for(var s=0;s<sparks.length;s++){
        sparks[s].classList.remove('go');
        void sparks[s].offsetWidth;
        sparks[s].classList.add('go');
      }
      Studio.event('verdict',{item:items[index].id,correct:true});
      setTimeout(function(){
        index++;
        if(index>=items.length){
          finished=true;
          play.classList.add('hidden');
          document.getElementById('doneScreen').classList.add('show');
          Studio.done();
        }else{
          loadItem();
        }
      },850);
    }else{
      feedback.textContent=Studio.t('wrong');
      feedback.className='feedback bad';
      locked=false;
      check.disabled=false;
      Studio.event('verdict',{item:items[index].id,correct:false});
    }
  });
  loadItem();
  Studio.ready();
}());
</script>
