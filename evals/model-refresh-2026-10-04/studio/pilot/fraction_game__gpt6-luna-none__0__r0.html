<style>
  :root {
    color-scheme: light;
    --ink: #263b50;
    --muted: #62758a;
    --cream: #fff8ec;
    --paper: #ffffff;
    --coral: #f27b68;
    --coral-dark: #d95d50;
    --gold: #f2c66d;
    --mint: #8bcdb4;
    --line: #e8dfd1;
    font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  .stage {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 18px 16px 22px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 14% 9%, #fff0c9 0, transparent 34%),
      radial-gradient(ellipse at 92% 86%, #dff3e8 0, transparent 34%),
      var(--cream);
    color: var(--ink);
  }
  .card {
    position: relative;
    width: min(100%, 430px);
    min-height: min(600px, calc(100dvh - 36px));
    padding: 25px 21px 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    border: 1px solid rgba(232, 223, 209, .9);
    border-radius: 30px;
    background: rgba(255,255,255,.94);
    box-shadow: 0 16px 42px rgba(72, 78, 75, .11), 0 3px 8px rgba(72,78,75,.05);
    animation: arrive .55s cubic-bezier(.2,.8,.25,1) both;
  }
  .spark {
    position: absolute;
    width: 11px;
    height: 11px;
    border-radius: 4px;
    background: var(--gold);
    opacity: .8;
    transform: rotate(35deg);
    animation: drift 3.2s ease-in-out infinite alternate;
  }
  .spark.one { top: 30px; left: 24px; }
  .spark.two { top: 62px; right: 27px; width: 8px; height: 8px; background: var(--mint); animation-delay: .7s; }
  .spark.three { bottom: 43px; left: 30px; width: 8px; height: 8px; background: #f3a08d; animation-delay: 1.1s; }
  h1 {
    margin: 2px 24px 9px;
    text-align: center;
    font-size: clamp(23px, 7vw, 29px);
    line-height: 1.16;
    letter-spacing: -.55px;
    font-weight: 850;
  }
  .instruction {
    max-width: 310px;
    margin: 0 0 17px;
    color: var(--muted);
    text-align: center;
    font-size: 15px;
    line-height: 1.45;
  }
  .item-area {
    width: 100%;
    min-height: 295px;
    display: flex;
    flex: 1;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 24px;
    background: linear-gradient(145deg, #fffaf1, #fffdf9);
    border: 1px solid #f1e8da;
    transition: background .3s, transform .25s;
  }
  .fraction {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 58px;
    margin: 5px 0 10px;
    color: var(--ink);
    font-weight: 850;
    font-size: 25px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .fraction .rule {
    width: 100%;
    height: 3px;
    margin: 5px 0;
    border-radius: 3px;
    background: var(--coral);
  }
  .picture {
    width: min(78vw, 286px);
    height: 245px;
    display: block;
    overflow: visible;
    touch-action: manipulation;
  }
  .part {
    cursor: pointer;
    outline: none;
    transform-box: fill-box;
    transform-origin: center;
    transition: transform .16s cubic-bezier(.2,.8,.2,1), filter .18s;
    -webkit-tap-highlight-color: transparent;
  }
  .part:hover { filter: brightness(1.025); }
  .part:active { transform: scale(.94); }
  .part:focus-visible .slice-shape,
  .part:focus-visible .bar-shape { stroke: #243a50; stroke-width: 4; }
  .slice-shape, .bar-shape { transition: fill .24s, stroke .2s; }
  .hint {
    min-height: 27px;
    margin: 12px 0 2px;
    color: #748497;
    text-align: center;
    font-size: 13px;
    line-height: 1.35;
  }
  .feedback {
    min-height: 26px;
    margin: 1px 0 5px;
    color: var(--coral-dark);
    text-align: center;
    font-size: 15px;
    line-height: 1.35;
    font-weight: 750;
  }
  .feedback.good { color: #43866c; }
  .check {
    width: 100%;
    min-height: 54px;
    margin-top: 7px;
    border: 0;
    border-radius: 18px;
    background: var(--coral);
    color: #fff;
    font: inherit;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: .1px;
    box-shadow: 0 5px 0 #da6657, 0 9px 18px rgba(217, 93, 80, .19);
    cursor: pointer;
    transition: transform .14s, box-shadow .14s, background .2s, opacity .2s;
    touch-action: manipulation;
  }
  .check:hover { background: #ee715f; }
  .check:active { transform: translateY(3px) scale(.99); box-shadow: 0 2px 0 #da6657; }
  .check:focus-visible { outline: 3px solid #e9ba58; outline-offset: 4px; }
  .check:disabled { cursor: default; opacity: .72; }
  .card.celebrate .item-area { animation: celebrate .5s ease both; }
  .card.celebrate .spark { animation: pop .55s ease both; }
  .done-mark {
    width: 110px;
    height: 110px;
    margin: 28px 0 22px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: #e1f4e9;
    color: #43866c;
    font-size: 56px;
    box-shadow: inset 0 0 0 8px #f0faf3;
    animation: arrive .5s cubic-bezier(.2,.8,.25,1) both;
  }
  .done-copy { max-width: 290px; text-align: center; color: var(--muted); line-height: 1.5; }
  @keyframes arrive { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes drift { to { transform: translate(3px,-5px) rotate(95deg); } }
  @keyframes celebrate { 35% { transform: scale(1.025) rotate(-.5deg); } 70% { transform: scale(.995) rotate(.4deg); } }
  @keyframes pop { 50% { transform: scale(1.7) rotate(90deg); opacity: 1; } }
  @media (max-height: 690px) {
    .stage { padding: 10px 12px; }
    .card { min-height: calc(100dvh - 20px); padding: 17px 17px 16px; }
    .instruction { margin-bottom: 10px; }
    .item-area { min-height: 255px; }
    .picture { height: 210px; }
    .hint { margin-top: 7px; }
  }
</style>
<main class="stage">
  <section class="card" id="card" aria-live="polite">
    <span class="spark one" aria-hidden="true"></span>
    <span class="spark two" aria-hidden="true"></span>
    <span class="spark three" aria-hidden="true"></span>
    <h1 id="title"></h1>
    <p class="instruction" id="instruction"></p>
    <div class="item-area" id="item-area">
      <div class="fraction" id="fraction" aria-label="Target fraction">
        <span id="numerator"></span>
        <span class="rule"></span>
        <span id="denominator"></span>
      </div>
      <svg class="picture" id="picture" viewBox="0 0 300 260" role="group"></svg>
    </div>
    <p class="hint" id="hint"></p>
    <p class="feedback" id="feedback" aria-live="polite"></p>
    <button class="check" id="check" data-action="check" type="button"></button>
  </section>
</main>
<script>
(() => {
  const params = Studio.params;
  const items = params.items;
  const words = key => Studio.t(key);
  const card = document.getElementById('card');
  const title = document.getElementById('title');
  const instruction = document.getElementById('instruction');
  const area = document.getElementById('item-area');
  const fraction = document.getElementById('fraction');
  const numerator = document.getElementById('numerator');
  const denominator = document.getElementById('denominator');
  const picture = document.getElementById('picture');
  const hint = document.getElementById('hint');
  const feedback = document.getElementById('feedback');
  const check = document.getElementById('check');
  let current = 0;
  let shaded = [];
  let locked = false;
  let complete = false;

  title.textContent = words('title');
  instruction.textContent = words('instr');
  check.textContent = words('check');

  function renderPicture(item) {
    picture.replaceChildren();
    const d = item.d;
    const pizza = params.picture === 'pizza-or-bar' && d <= 10;
    if (pizza) {
      const cx = 150, cy = 130, r = 105;
      const crust = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      crust.setAttribute('cx', cx); crust.setAttribute('cy', cy); crust.setAttribute('r', r + 5);
      crust.setAttribute('fill', '#e7ad57');
      picture.appendChild(crust);
      for (let i = 0; i < d; i++) {
        const start = -Math.PI / 2 + i * Math.PI * 2 / d;
        const end = -Math.PI / 2 + (i + 1) * Math.PI * 2 / d;
        const x1 = cx + r * Math.cos(start), y1 = cy + r * Math.sin(start);
        const x2 = cx + r * Math.cos(end), y2 = cy + r * Math.sin(end);
        const large = d === 1 ? 1 : 0;
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z`);
        path.setAttribute('class', 'slice-shape');
        path.setAttribute('fill', '#ffd98b');
        path.setAttribute('stroke', '#fff8ec');
        path.setAttribute('stroke-width', '3');
        const group = makePart(i, path);
        picture.appendChild(group);
        const angle = (start + end) / 2;
        const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        dot.setAttribute('cx', cx + 65 * Math.cos(angle));
        dot.setAttribute('cy', cy + 65 * Math.sin(angle));
        dot.setAttribute('r', 5);
        dot.setAttribute('fill', '#d97c50');
        dot.setAttribute('pointer-events', 'none');
        group.appendChild(dot);
      }
      const center = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      center.setAttribute('cx', cx); center.setAttribute('cy', cy); center.setAttribute('r', 5);
      center.setAttribute('fill', '#e9b75e'); center.setAttribute('pointer-events', 'none');
      picture.appendChild(center);
    } else {
      const x = 19, y = 90, width = 262, height = 80, gap = 4;
      for (let i = 0; i < d; i++) {
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', x + i * width / d);
        rect.setAttribute('y', y);
        rect.setAttribute('width', Math.max(1, width / d - gap));
        rect.setAttribute('height', height);
        rect.setAttribute('rx', '11');
        rect.setAttribute('class', 'bar-shape');
        rect.setAttribute('fill', '#ffe2a4');
        rect.setAttribute('stroke', '#fff8ec');
        rect.setAttribute('stroke-width', '2');
        picture.appendChild(makePart(i, rect));
      }
    }
    picture.setAttribute('aria-label', `${item.n}/${item.d}`);
  }

  function makePart(index, shape) {
    const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    group.setAttribute('class', 'part');
    group.setAttribute('data-part', String(index));
    group.setAttribute('data-shaded', 'false');
    group.setAttribute('tabindex', '0');
    group.setAttribute('role', 'button');
    group.setAttribute('aria-pressed', 'false');
    group.appendChild(shape);
    const toggle = () => {
      if (locked || complete) return;
      shaded[index] = !shaded[index];
      group.setAttribute('data-shaded', String(shaded[index]));
      group.setAttribute('aria-pressed', String(shaded[index]));
      shape.setAttribute('fill', shaded[index] ? '#f27b68' : (shape.classList.contains('slice-shape') ? '#ffd98b' : '#ffe2a4'));
      Studio.event('part_toggle', {item: items[current].id, part: index, shaded: shaded[index]});
    };
    group.addEventListener('click', toggle);
    group.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        toggle();
      }
    });
    return group;
  }

  function showItem() {
    const item = items[current];
    shaded = Array(item.d).fill(false);
    locked = false;
    card.classList.remove('celebrate');
    card.setAttribute('data-item', String(item.id));
    numerator.textContent = String(item.n);
    denominator.textContent = String(item.d);
    hint.textContent = words('hint');
    feedback.textContent = '';
    feedback.className = 'feedback';
    check.textContent = words('check');
    check.disabled = false;
    check.setAttribute('data-action', 'check');
    area.hidden = false;
    fraction.hidden = false;
    hint.hidden = false;
    check.hidden = false;
    renderPicture(item);
  }

  check.addEventListener('click', () => {
    if (locked || complete) return;
    locked = true;
    check.disabled = true;
    const item = items[current];
    const n = shaded.filter(Boolean).length;
    Studio.event('check', {item: item.id, n: n, d: item.d});
    Studio.answer({n: n, d: item.d});
  });

  Studio.onVerdict(({correct}) => {
    if (complete) return;
    if (correct) {
      feedback.textContent = words('right');
      feedback.className = 'feedback good';
      card.classList.add('celebrate');
      window.setTimeout(() => {
        current++;
        if (current >= items.length) {
          complete = true;
          Studio.done();
          title.textContent = words('done');
          instruction.textContent = '';
          area.hidden = true;
          fraction.hidden = true;
          hint.hidden = true;
          feedback.textContent = '';
          check.hidden = true;
          const mark = document.createElement('div');
          mark.className = 'done-mark';
          mark.setAttribute('aria-hidden', 'true');
          mark.textContent = '✓';
          card.insertBefore(mark, feedback);
        } else {
          showItem();
        }
      }, 850);
    } else {
      locked = false;
      check.disabled = false;
      feedback.textContent = words('wrong');
      feedback.className = 'feedback';
    }
  });

  showItem();
  Studio.ready();
})();
</script>
