<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, #fff8e7 0%, #ffe8d6 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 12px; overflow: hidden;
  }
  .game {
    background: #fffdf7; border-radius: 32px; box-shadow: 0 8px 24px rgba(180,120,60,.18);
    padding: 20px 16px 16px; width: 100%; max-width: 360px; text-align: center;
    border: 3px solid #f5c9a8;
  }
  .header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; position: relative; }
  h1 { font-size: 20px; color: #7a4a2a; letter-spacing: .3px; line-height: 1.3; flex: 1; }
  .target {
    background: #7a4a2a; color: #fff; border-radius: 20px; padding: 6px 12px;
    font-size: 18px; font-weight: 700; min-width: 52px;
    box-shadow: 0 3px 0 #5c3520;
  }
  .instr {
    font-size: 15px; color: #9b6b4a; margin: 6px 0 14px; line-height: 1.4;
    background: #fff3e6; border-radius: 14px; padding: 8px 10px;
  }
  .picture-area { margin: 8px 0 12px; display: flex; justify-content: center; position: relative; }
  svg { width: 100%; overflow: visible; }
  .bar-wrap svg { height: 90px; max-width: 280px; }
  .pizza-wrap svg { height: 170px; max-width: 220px; }
  .part-btn { cursor: pointer; transition: transform .12s ease, opacity .15s; }
  .part-btn:active { transform: scale(.94); }
  .shaded-on { filter: drop-shadow(0 2px 4px rgba(122,74,42,.3)); }
  .check-row { margin: 14px 0 4px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .check-btn {
    background: #e07a3f; color: #fff; border: none; border-radius: 30px;
    font-size: 18px; font-weight: 700; padding: 12px 36px; cursor: pointer;
    box-shadow: 0 4px 0 #aa5a2e; transition: transform .12s, box-shadow .12s;
    letter-spacing: .5px; min-height: 48px;
  }
  .check-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #aa5a2e; }
  .check-btn:disabled { opacity: .5; pointer-events: none; }
  .feedback { font-size: 16px; font-weight: 600; min-height: 24px; color: #7a4a2a; }
  .feedback.right { color: #2e7d32; }
  .feedback.wrong { color: #c44536; }
  .done-card {
    padding: 20px 16px; font-size: 22px; color: #5c3520; background: #fff3e6;
    border-radius: 20px; border: 2px dashed #e07a3f; margin-top: 12px;
  }
  .done-icon { font-size: 40px; margin-bottom: 8px; }
  .hidden { display: none !important; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-8px); } 60% { transform: translateY(-4px); } }
  .celebrate { animation: pulse .5s ease; }
  .celebrate-img { animation: bounce .7s ease; }
</style>

<div class="game">
  <div class="header">
    <h1 data-i18n="title"></h1>
    <div class="target"><span id="targetNum"></span></div>
  </div>
  <div class="instr" data-i18n="instr"></div>
  <div class="picture-area" id="pictureArea"></div>
  <div class="check-row">
    <button class="check-btn" data-action="check" data-i18n="check"></button>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="done-card hidden" id="doneCard">
    <div class="done-icon">🎉</div>
    <div data-i18n="done"></div>
  </div>
</div>

<script>
(function(){
  const items = Studio.params.items || [];
  const pictureType = Studio.params.picture === 'bar' ? 'bar' : 'pizza';
  const state = { idx: 0, shaded: [], locked: false };

  const targetEl = document.getElementById('targetNum');
  const pictureArea = document.getElementById('pictureArea');
  const feedbackEl = document.getElementById('feedback');
  const checkBtn = document.querySelector('[data-action="check"]');
  const doneCard = document.getElementById('doneCard');
  const gameCard = document.body.querySelector('.game');

  checkBtn.disabled = true;

  function t(key){
    try { return Studio.t(key); } catch(e){ return ''; }
  }
  // fill i18n
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    el.textContent = t(k);
  });

  function buildPizza(n, d){
    const cx = 120, cy = 120, r = 95;
    const angleStep = (2 * Math.PI) / d;
    const startAngle = -Math.PI / 2;
    let svg = `<svg viewBox="0 0 240 240" role="img">`;
    for (let i=0; i<d; i++){
      const a1 = startAngle + i * angleStep;
      const a2 = startAngle + (i+1) * angleStep;
      const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
      const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
      const large = (a2 - a1) > Math.PI ? 1 : 0;
      const path = `M${cx} ${cy} L${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z`;
      svg += `<path class="part-btn" data-part="${i}" data-shaded="false" d="${path}"
        fill="#f7c981" stroke="#8a5a2a" stroke-width="2.5" stroke-linejoin="round"/>`;
    }
    svg += `</svg>`;
    return svg;
  }

  function buildBar(n, d){
    const segW = 280 / d;
    let svg = `<svg viewBox="0 0 280 80" role="img">`;
    for (let i=0; i<d; i++){
      const x = i * segW;
      svg += `<rect class="part-btn" data-part="${i}" data-shaded="false"
        x="${x.toFixed(2)}" y="4" width="${(segW-3).toFixed(2)}" height="72"
        rx="8" fill="#f7c981" stroke="#8a5a2a" stroke-width="2.5"/>`;
    }
    svg += `<rect x="2" y="4" width="276" height="72" rx="8" fill="none" stroke="#8a5a2a" stroke-width="3" opacity=".4"/>`;
    svg += `</svg>`;
    return svg;
  }

  function renderItem(){
    const item = items[state.idx];
    if (!item) return;
    const d = item.d, n = item.n;
    targetEl.textContent = n + '/' + d;
    state.shaded = new Array(d).fill(false);
    state.locked = false;
    checkBtn.disabled = (n === 0); // n from params, fine
    feedbackEl.textContent = ''; feedbackEl.className = 'feedback';
    pictureArea.innerHTML = '';
    pictureArea.className = 'picture-area ' + (pictureType === 'bar' ? 'bar-wrap' : 'pizza-wrap');
    pictureArea.innerHTML = pictureType === 'bar' ? buildBar(n, d) : buildPizza(n, d);
    pictureArea.setAttribute('data-item', item.id);
    bindParts();
    // reset check button enable: if n>0 always enabled but we keep disabled until something shaded? spec: child taps then check
    // we'll enable conditionally after first tap; but also allow if n=0? n from params so if n=0 then never
    // simpler: enable only if any shaded (or check n>0)
    checkBtn.disabled = true;
  }

  function bindParts(){
    const parts = pictureArea.querySelectorAll('.part-btn');
    parts.forEach((part, idx)=>{
      part.addEventListener('click', function(e){
        if (state.locked) return;
        const wasShaded = part.dataset.shaded === 'true';
        const newState = !wasShaded;
        part.dataset.shaded = newState ? 'true' : 'false';
        state.shaded[idx] = newState;
        part.setAttribute('fill', newState ? '#e07a3f' : '#f7c981');
        part.classList.toggle('shaded-on', newState);
        feedbackEl.textContent = ''; feedbackEl.className = 'feedback';
        // enable check if any shaded
        const hasAny = state.shaded.some(Boolean);
        checkBtn.disabled = !hasAny;
        Studio.event('tap_part', { part: idx, shaded: newState });
      });
    });
  }

  function showFeedback(text, type){
    feedbackEl.textContent = text;
    feedbackEl.className = 'feedback ' + (type || '');
  }

  checkBtn.addEventListener('click', function(){
    if (state.locked) return;
    const item = items[state.idx];
    if (!item) return;
    const count = state.shaded.filter(Boolean).length;
    state.locked = true;
    checkBtn.disabled = true;
    Studio.answer({ n: count, d: item.d });
    Studio.event('check', { item: item.id, n: count, d: item.d });
  });

  Studio.onVerdict(function(res){
    if (res.correct){
      showFeedback(t('right'), 'right');
      pictureArea.classList.add('celebrate');
      setTimeout(()=>{
        pictureArea.classList.remove('celebrate');
        state.idx++;
        if (state.idx >= items.length){
          // done
          pictureArea.classList.add('hidden');
          checkBtn.classList.add('hidden');
          doneCard.classList.remove('hidden');
          gameCard.style.background = '#fffdf7';
          Studio.done();
        } else {
          renderItem();
        }
      }, 900);
    } else {
      state.locked = false;
      checkBtn.disabled = !state.shaded.some(Boolean);
      showFeedback(t('wrong'), 'wrong');
      Studio.event('wrong', { item: items[state.idx].id });
    }
  });

  // hint string not used for display; but we make sure key exists at runtime (no-op)
  t('hint');

  renderItem();
  Studio.ready();
})();
</script>
