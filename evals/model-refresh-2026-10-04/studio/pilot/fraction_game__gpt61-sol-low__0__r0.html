<style>
*{box-sizing:border-box}
:root{color-scheme:light;font-family:system-ui,sans-serif;color:#44382d;background:#fff8ee}
body{margin:0}
.activity{width:100%;max-width:460px;margin:auto;padding:20px 20px 16px;min-height:100svh;display:flex;flex-direction:column;align-items:center;background:radial-gradient(ellipse at top,#ffedce,transparent 60%)}
h1{font-size:23px;line-height:1.2;margin:0 0 9px;text-align:center;color:#71432a}
.instruction{font-size:16px;line-height:1.4;text-align:center;margin:0;max-width:330px}
.play{width:100%;display:flex;flex-direction:column;align-items:center}
.fraction{display:flex;flex-direction:column;align-items:center;font-weight:750;font-size:27px;line-height:1.05;margin:15px 0 10px;min-width:48px}
.numerator{border-bottom:3px solid #71432a;padding:0 13px 5px}
.denominator{padding-top:5px}
.pizza{display:block;width:min(100%,290px);height:auto;overflow:visible;filter:drop-shadow(0 9px 8px #75402a1b)}
.part{fill:#fff0c7;stroke:#b7733d;stroke-width:2;stroke-linejoin:round;cursor:pointer;transition:fill .2s,filter .2s;outline:none}
.part[data-shaded="true"]{fill:#ee9347}
.part:hover{filter:brightness(1.04)}
.part:focus-visible{stroke:#286b65;stroke-width:5}
.part:active{filter:brightness(.9)}
.pizza.pop{animation:pop .45s ease}
.feedback{min-height:45px;padding:12px 0 5px;text-align:center;font-size:16px;color:#765442}
.feedback.good{color:#287165}
.check{min-height:52px;width:100%;max-width:290px;border:0;border-radius:18px;background:#337c70;color:white;font:700 18px system-ui;box-shadow:0 5px 0 #236055;cursor:pointer;transition:transform .15s,background .2s}
.check:active{transform:translateY(3px);box-shadow:0 2px 0 #236055}
.check:disabled{opacity:.65;cursor:default}
.hint{font-size:13px;text-align:center;color:#806959;line-height:1.35;margin:15px 0 0}
.finish{width:100%;margin:auto 0;text-align:center}
.finish svg{width:160px;height:160px;animation:pop .6s ease}
.finish h2{font-size:25px;color:#287165;margin:20px 0}
[hidden]{display:none!important}
@keyframes pop{0%{transform:scale(.94)}55%{transform:scale(1.035)}100%{transform:scale(1)}}
@media(max-height:610px){.activity{padding-top:12px}.pizza{width:240px}.fraction{margin:9px 0 6px}h1{font-size:21px}.hint{margin-top:10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<main class="activity">
<h1 id="title"></h1>
<p class="instruction" id="instr"></p>
<section class="play" id="item">
<div class="fraction" aria-live="polite"><span class="numerator" id="n"></span><span class="denominator" id="d"></span></div>
<svg class="pizza" id="pizza" viewBox="0 0 300 300">
<circle cx="150" cy="150" r="147" fill="#e8d6bd"/>
<circle cx="150" cy="150" r="141" fill="#fffdf8"/>
<circle cx="150" cy="150" r="132" fill="#d99850"/>
<g id="parts"></g>
<circle cx="150" cy="150" r="4" fill="#b7733d" pointer-events="none"/>
</svg>
<div class="feedback" id="feedback" role="status" aria-live="polite"></div>
<button class="check" id="check" data-action="check" type="button"></button>
<p class="hint" id="hint"></p>
</section>
<section class="finish" id="finish" hidden>
<svg viewBox="0 0 160 160" aria-hidden="true">
<circle cx="80" cy="80" r="66" fill="#dbefe1"/>
<circle cx="80" cy="80" r="52" fill="#337c70"/>
<path d="M53 80 L72 98 L109 61" fill="none" stroke="#fff8ee" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M21 26l4 9 9 4-9 4-4 9-4-9-9-4 9-4zM135 113l4 8 8 4-8 4-4 8-4-8-8-4 8-4z" fill="#ee9347"/>
</svg>
<h2 id="done"></h2>
</section>
</main>
<script>
(function(){
const items=Studio.params.items;
const $=id=>document.getElementById(id);
['title','instr','check','hint','done'].forEach(key=>$(key).textContent=Studio.t(key));
let current=0, shaded=[], waiting=false, complete=false;
const svgNS='http://www.w3.org/2000/svg';
function toggle(index){
if(waiting||complete)return;
shaded[index]=!shaded[index];
$('parts').children[index].setAttribute('data-shaded',String(shaded[index]));
$('parts').children[index].setAttribute('aria-pressed',String(shaded[index]));
$('feedback').textContent='';
$('feedback').classList.remove('good');
Studio.event('toggle',{item:items[current].id,part:index,shaded:shaded[index]});
}
function render(){
const item=items[current];
waiting=false;
shaded=Array(item.d).fill(false);
$('item').setAttribute('data-item',item.id);
$('n').textContent=item.n;
$('d').textContent=item.d;
$('feedback').textContent='';
$('feedback').classList.remove('good');
$('check').disabled=false;
$('parts').replaceChildren();
for(let index=0;index<item.d;index++){
const start=-Math.PI/2+index*Math.PI*2/item.d;
const end=start+Math.PI*2/item.d;
const x1=150+128*Math.cos(start),y1=150+128*Math.sin(start);
const x2=150+128*Math.cos(end),y2=150+128*Math.sin(end);
const part=document.createElementNS(svgNS,'path');
part.setAttribute('d',item.d===1
?'M150 22 A128 128 0 1 1 150 278 A128 128 0 1 1 150 22Z'
:`M150 150 L${x1} ${y1} A128 128 0 ${end-start>Math.PI?1:0} 1 ${x2} ${y2} Z`);
part.setAttribute('class','part');
part.setAttribute('data-part',index);
part.setAttribute('data-shaded','false');
part.setAttribute('role','button');
part.setAttribute('tabindex','0');
part.setAttribute('aria-label',Studio.t('hint'));
part.setAttribute('aria-pressed','false');
part.addEventListener('click',()=>toggle(index));
part.addEventListener('keydown',event=>{
if(event.key==='Enter'||event.key===' '){event.preventDefault();toggle(index);}
});
$('parts').appendChild(part);
}
}
$('check').addEventListener('click',()=>{
if(waiting||complete)return;
waiting=true;
$('check').disabled=true;
Studio.event('check',{item:items[current].id});
Studio.answer({n:shaded.filter(Boolean).length,d:items[current].d});
});
Studio.onVerdict(verdict=>{
if(!waiting||complete)return;
$('feedback').textContent=Studio.t(verdict.correct?'right':'wrong');
if(!verdict.correct){
waiting=false;
$('check').disabled=false;
return;
}
$('feedback').classList.add('good');
$('pizza').classList.remove('pop');
void $('pizza').getBoundingClientRect();
$('pizza').classList.add('pop');
setTimeout(()=>{
current++;
if(current<items.length){render();}
else{
complete=true;
$('item').hidden=true;
$('instr').hidden=true;
$('finish').hidden=false;
Studio.done();
}
},1000);
});
render();
Studio.ready();
})();
</script>
