<style>
  :root{
    --bg1:#fff7ed;
    --bg2:#ffe9d6;
    --ink:#3b2a1f;
    --soft:#8a6b57;
    --card:#ffffff;
    --accent:#f97316;
    --accent-dark:#c2410c;
    --crust:#e8b04b;
    --crust-dark:#c98a2e;
    --sauce:#e4572e;
    --cheese:#ffd166;
    --good:#2f9e44;
    --bad:#e0575b;
    --part:#f5e2c8;
    --part-edge:#d8b98e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  .wrap{
    font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    background:radial-gradient(120% 90% at 50% 0%,var(--bg1) 0%,var(--bg2) 100%);
    min-height:100vh;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:14px 14px 26px;
    gap:12px;
    overflow-x:hidden;
  }
  .title{
    font-size:1.18rem;
    font-weight:800;
    letter-spacing:.2px;
    color:var(--accent-dark);
    text-align:center;
    line-height:1.2;
  }
  .instr{
    font-size:.95rem;
    color:var(--soft);
    text-align:center;
    max-width:330px;
    line-height:1.35;
  }
  .stage{
    width:100%;
    max-width:340px;
    background:var(--card);
    border-radius:26px;
    padding:14px 12px 16px;
    box-shadow:0 10px 26px rgba(120,72,30,.16),0 2px 0 rgba(255,255,255,.7) inset;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    position:relative;
  }
  .fractionTag{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:800;
    font-size:1.55rem;
    color:var(--accent-dark);
    background:#fff2e2;
    border-radius:16px;
    padding:4px 16px;
    box-shadow:0 2px 0 rgba(196,124,60,.25) inset;
  }
  .fractionTag .frac{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    line-height:.92;
  }
  .fractionTag .num{color:var(--accent-dark)}
  .fractionTag .bar{
    width:100%;
    height:3px;
    background:var(--accent-dark);
    border-radius:2px;
    margin:2px 0;
  }
  .fractionTag .den{color:var(--soft)}
  .board{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  svg{display:block;touch-action:manipulation}
  .part{
    cursor:pointer;
    transition:fill .22s ease, transform .18s ease, filter .2s ease;
    transform-origin:50% 50%;
  }
  .part:active{filter:brightness(1.05)}
  .part.celebrate{
    animation:pop .5s ease;
  }
  @keyframes pop{
    0%{transform:scale(1)}
    45%{transform:scale(1.045)}
    100%{transform:scale(1)}
  }
  .hintRow{
    min-height:22px;
    font-size:.86rem;
    color:var(--soft);
    text-align:center;
    transition:opacity .2s ease, color .2s ease;
  }
  .feedback{
    min-height:26px;
    font-weight:800;
    font-size:1rem;
    text-align:center;
    transition:opacity .2s ease, transform .2s ease;
    opacity:0;
    transform:translateY(4px);
  }
  .feedback.show{opacity:1;transform:translateY(0)}
  .feedback.ok{color:var(--good)}
  .feedback.no{color:var(--bad)}
  .check{
    appearance:none;
    border:none;
    font:inherit;
    font-weight:800;
    font-size:1.08rem;
    color:#fff;
    background:linear-gradient(180deg,#fb923c,#ea580c);
    border-radius:20px;
    padding:14px 34px;
    min-height:52px;
    min-width:150px;
    box-shadow:0 6px 0 var(--accent-dark),0 10px 18px rgba(234,88,12,.3);
    transition:transform .12s ease, box-shadow .12s ease, filter .2s ease;
    cursor:pointer;
  }
  .check:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 var(--accent-dark),0 6px 12px rgba(234,88,12,.28);
  }
  .check[disabled]{
    filter:grayscale(.35) opacity(.7);
    cursor:default;
  }
  .check.bounce{animation:cb .45s ease}
  @keyframes cb{
    0%{transform:scale(1)}
    40%{transform:scale(1.06)}
    100%{transform:scale(1)}
  }
  .doneCard{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    padding:8px 6px 4px;
    text-align:center;
  }
  .doneCard .big{
    font-size:1.3rem;
    font-weight:800;
    color:var(--accent-dark);
  }
  .hidden{display:none !important}
  @media (max-width:360px){
    .title{font-size:1.08rem}
    .fractionTag{font-size:1.35rem}
  }
</style>

<div class="wrap" id="app">
  <div class="title" id="titleText"></div>
  <div class="instr" id="instrText"></div>
  <div class="stage" id="stage" data-item="">
    <div class="fractionTag" id="fracTag">
      <span class="frac">
        <span class="num" id="fracNum">0</span>
        <span class="bar"></span>
        <span class="den" id="fracDen">0</span>
      </span>
    </div>
    <div class="board" id="board"></div>
    <div class="hintRow" id="hintRow"></div>
    <div class="feedback" id="feedback"></div>
    <button class="check" id="checkBtn" data-action="check"></button>
  </div>
</div>

<script>
(function(){
  var P = (Studio && Studio.params) ? Studio.params : {};
  var items = Array.isArray(P.items) ? P.items.slice() : [];
  var picture = P.picture || "pizza-or-bar";

  var app = document.getElementById("app");
  var titleText = document.getElementById("titleText");
  var instrText = document.getElementById("instrText");
  var stage = document.getElementById("stage");
  var fracNum = document.getElementById("fracNum");
  var fracDen = document.getElementById("fracDen");
  var board = document.getElementById("board");
  var hintRow = document.getElementById("hintRow");
  var feedback = document.getElementById("feedback");
  var checkBtn = document.getElementById("checkBtn");

  titleText.textContent = Studio.t("title");
  instrText.textContent = Studio.t("instr");
  checkBtn.textContent = Studio.t("check");
  hintRow.textContent = Studio.t("hint");

  var SVGNS = "http://www.w3.org/2000/svg";
  var idx = 0;
  var shaded = [];
  var locked = false;

  function el(tag, attrs){
    var n = document.createElementNS(SVGNS, tag);
    for(var k in attrs){ n.setAttribute(k, attrs[k]); }
    return n;
  }

  function polar(cx, cy, r, a){
    return { x: cx + r*Math.cos(a), y: cy + r*Math.sin(a) };
  }

  function makePizza(d){
    var size = 250;
    var cx = size/2, cy = size/2, r = 104;
    var svg = el("svg", {viewBox:"0 0 "+size+" "+size, width:"100%", height:"100%", preserveAspectRatio:"xMidYMid meet", role:"group"});
    svg.style.width = "100%";
    svg.style.height = "auto";
    svg.style.aspectRatio = size + " / " + size;
    svg.appendChild(el("circle", {cx:cx, cy:cy, r:r+7, fill:"var(--crust)", stroke:"var(--crust-dark)", "stroke-width":2}));
    svg.appendChild(el("circle", {cx:cx, cy:cy, r:r, fill:"var(--cheese)"}));
    var gap = 0.018;
    for(var i=0;i<d;i++){
      var a0 = -Math.PI/2 + (i/d)*Math.PI*2 + gap;
      var a1 = -Math.PI/2 + ((i+1)/d)*Math.PI*2 - gap;
      var p0 = polar(cx, cy, r, a0);
      var p1 = polar(cx, cy, r, a1);
      var large = (a1-a0) > Math.PI ? 1 : 0;
      var dd = "M "+cx+" "+cy+" L "+p0.x.toFixed(2)+" "+p0.y.toFixed(2)+
               " A "+r+" "+r+" 0 "+large+" 1 "+p1.x.toFixed(2)+" "+p1.y.toFixed(2)+" Z";
      var path = el("path", {
        d: dd,
        fill: "var(--part)",
        stroke: "var(--part-edge)",
        "stroke-width": 1.4,
        "stroke-linejoin":"round",
        "data-part": String(i),
        "data-shaded": "false",
        class: "part"
      });
      svg.appendChild(path);
    }
    return svg;
  }

  function makeBar(d){
    var w = 300, h = 128;
    var pad = 8;
    var iw = w - pad*2, ih = h - pad*2;
    var svg = el("svg", {viewBox:"0 0 "+w+" "+h, width:"100%", height:"100%", preserveAspectRatio:"xMidYMid meet", role:"group"});
    svg.style.width = "100%";
    svg.style.height = "auto";
    svg.style.aspectRatio = w + " / " + h;
    svg.appendChild(el("rect", {x:pad, y:pad, width:iw, height:ih, rx:14, fill:"var(--crust)", stroke:"var(--crust-dark)", "stroke-width":2}));
    var seg = iw / d;
    var gapx = 3;
    for(var i=0;i<d;i++){
      var x = pad + i*seg + gapx/2;
      var rect = el("rect", {
        x: x.toFixed(2),
        y: (pad+4).toFixed(2),
        width: Math.max(0, seg-gapx).toFixed(2),
        height: (ih-8).toFixed(2),
        rx: 8,
        fill: "var(--part)",
        stroke: "var(--part-edge)",
        "stroke-width": 1.4,
        "data-part": String(i),
        "data-shaded": "false",
        class: "part"
      });
      svg.appendChild(rect);
    }
    return svg;
  }

  function buildBoard(item){
    board.textContent = "";
    var useBar;
    if(picture === "pizza-or-bar"){
      useBar = item.d >= 6;
    } else if(picture === "pizza"){
      useBar = false;
    } else if(picture === "bar"){
      useBar = true;
    } else {
      useBar = item.d >= 6;
    }
    var svg = useBar ? makeBar(item.d) : makePizza(item.d);
    board.appendChild(svg);
    return svg;
  }

  function paint(){
    var parts = board.querySelectorAll('[data-part]');
    for(var i=0;i<parts.length;i++){
      var p = parts[i];
      var on = !!shaded[i];
      p.setAttribute("data-shaded", on ? "true" : "false");
      p.setAttribute("fill", on ? "var(--sauce)" : "var(--part)");
      p.setAttribute("stroke", on ? "var(--accent-dark)" : "var(--part-edge)");
    }
  }

  function showFeedback(text, ok){
    feedback.textContent = text;
    feedback.className = "feedback show " + (ok ? "ok" : "no");
  }
  function clearFeedback(){
    feedback.className = "feedback";
  }

  function setCheckEnabled(v){
    if(v) checkBtn.removeAttribute("disabled");
    else checkBtn.setAttribute("disabled", "disabled");
  }

  function loadItem(){
    var item = items[idx];
    if(!item){ return; }
    locked = false;
    shaded = new Array(item.d).fill(false);
    stage.setAttribute("data-item", item.id);
    fracNum.textContent = String(item.n);
    fracDen.textContent = String(item.d);
    buildBoard(item);
    paint();
    clearFeedback();
    hintRow.textContent = Studio.t("hint");
    setCheckEnabled(true);
    Studio.event("item_shown", {id:item.id, n:item.n, d:item.d});
  }

  function correctCount(){
    var c = 0;
    for(var i=0;i<shaded.length;i++){ if(shaded[i]) c++; }
    return c;
  }

  checkBtn.addEventListener("click", function(){
    if(locked) return;
    var item = items[idx];
    if(!item) return;
    var n = correctCount();
    Studio.event("check", {id:item.id, selected:n, d:item.d});
    setCheckEnabled(false);
    Studio.answer({n:n, d:item.d});
  });

  board.addEventListener("click", function(e){
    if(locked) return;
    var t = e.target;
    if(!t || !t.getAttribute) return;
    var p = t.getAttribute("data-part");
    if(p === null || p === undefined) return;
    var i = parseInt(p, 10);
    if(isNaN(i) || i < 0 || i >= shaded.length) return;
    shaded[i] = !shaded[i];
    t.setAttribute("data-shaded", shaded[i] ? "true" : "false");
    t.setAttribute("fill", shaded[i] ? "var(--sauce)" : "var(--part)");
    t.setAttribute("stroke", shaded[i] ? "var(--accent-dark)" : "var(--part-edge)");
    t.classList.remove("celebrate");
    void t.getBoundingClientRect();
    t.classList.add("celebrate");
    clearFeedback();
    Studio.event("part_toggle", {id:items[idx].id, index:i, shaded:shaded[i]});
  });

  Studio.onVerdict(function(v){
    var item = items[idx];
    if(!item) return;
    if(v && v.correct){
      locked = true;
      showFeedback(Studio.t("right"), true);
      var parts = board.querySelectorAll('[data-part]');
      var k = 0;
      for(var i=0;i<parts.length;i++){
        if(parts[i].getAttribute("data-shaded") === "true"){
          (function(pp, delay){ setTimeout(function(){ pp.classList.add("celebrate"); }, delay); })(parts[i], k*45);
          k++;
        }
      }
      checkBtn.classList.remove("bounce");
      void checkBtn.getBoundingClientRect();
      checkBtn.classList.add("bounce");
      Studio.event("verdict", {id:item.id, correct:true});
      setTimeout(function(){
        idx++;
        if(idx < items.length){
          loadItem();
        } else {
          finish();
        }
      }, 1150);
    } else {
      locked = false;
      showFeedback(Studio.t("wrong"), false);
      setCheckEnabled(true);
      Studio.event("verdict", {id:item.id, correct:false});
    }
  });

  function finish(){
    stage.setAttribute("data-item", "done");
    board.textContent = "";
    fracNum.textContent = "";
    fracDen.textContent = "";
    document.getElementById("fracTag").classList.add("hidden");
    hintRow.textContent = "";
    clearFeedback();
    setCheckEnabled(false);

    var doneCard = document.createElement("div");
    doneCard.className = "doneCard";
    doneCard.setAttribute("data-done", "true");

    var svg = el("svg", {viewBox:"0 0 200 140", width:"180", height:"130", role:"group"});
    svg.appendChild(el("circle", {cx:100, cy:70, r:56, fill:"var(--cheese)", stroke:"var(--crust)", "stroke-width":6}));
    for(var i=0;i<6;i++){
      var a = -Math.PI/2 + (i/6)*Math.PI*2;
      var p2 = polar(100,70,56,a);
      svg.appendChild(el("line", {x1:100,y1:70,x2:p2.x.toFixed(1),y2:p2.y.toFixed(1),stroke:"var(--accent-dark)","stroke-width":2.4,"stroke-linecap":"round"}));
    }
    var star = el("path", {
      d:"M100 28 l7 15 16 2 -12 11 3 16 -14 -8 -14 8 3 -16 -12 -11 16 -2 z",
      fill:"var(--accent)", stroke:"var(--accent-dark)", "stroke-width":2, "stroke-linejoin":"round"
    });
    svg.appendChild(star);
    doneCard.appendChild(svg);

    var big = document.createElement("div");
    big.className = "big";
    big.textContent = Studio.t("done");
    doneCard.appendChild(big);

    stage.appendChild(doneCard);
    Studio.event("activity_done", {items:items.length});
    Studio.done();
  }

  if(items.length){
    loadItem();
    Studio.ready();
  } else {
    finish();
    Studio.ready();
  }
})();
</script>
