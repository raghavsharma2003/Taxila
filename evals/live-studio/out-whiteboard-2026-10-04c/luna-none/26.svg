<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="600" height="450"><rect width="100%" height="100%" fill="#26413c"/><text x="200" y="40" font-size="24" text-anchor="middle" fill="#f4f1e8" font-family="Comic Sans MS, cursive">2/7 × 3/4</text><text x="200" y="79" font-size="18" text-anchor="middle" fill="#f4f1e8" font-family="Comic Sans MS, cursive">numerators ×</text><text x="200" y="113" font-size="24" text-anchor="middle" fill="#f4f1e8" font-family="Comic Sans MS, cursive">2 × 3 = 6</text><text x="200" y="157" font-size="18" text-anchor="middle" fill="#f4f1e8" font-family="Comic Sans MS, cursive">denominators ×</text><text x="200" y="193" font-size="24" text-anchor="middle" fill="#f4f1e8" font-family="Comic Sans MS, cursive">7 × 4 = 28</text><text x="200" y="241" font-size="24" text-anchor="middle" fill="#f4f1e8" font-family="Comic Sans MS, cursive">6/28 = 3/14</text></svg>