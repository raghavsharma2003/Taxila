<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;background:#fff7eb;font-family:system-ui,sans-serif;color:#563e35}
  #card{width:360px;height:320px;padding:15px 18px;background:radial-gradient(circle at 92% 4%,#ffe4c2 0,#fff7eb 44%);overflow:hidden}
  #title{font-size:20px;font-weight:800;line-height:25px}
  #ask{font-size:14px;line-height:19px;margin-top:2px;color:#795b4d}
  #key{height:36px;display:flex;align-items:center;gap:7px;font-size:13px;color:#795b4d}
  #key svg,.symbol{width:25px;height:25px;flex:none}
  #rows{display:grid;gap:7px}
  .row{width:100%;height:56px;border:2px solid #efd8bd;border-radius:17px;background:#fffdf8;display:flex;align-items:center;padding:0 12px;gap:8px;cursor:pointer;transition:transform .18s,background .18s,border-color .18s,box-shadow .18s}
  .row:active{transform:scale(.97)}
  .row:focus-visible{outline:3px solid #d77d62;outline-offset:2px}
  .row.selected{background:#fff0dc;border-color:#dc9175;box-shadow:0 3px 0 #efd8bd}
  .name{width:58px;flex:none;text-align:left;font-size:16px;font-weight:750}
  .symbols{display:flex;align-items:center;gap:5px;min-width:0}
  .symbol{animation:bloom .4s both}
  #feedback{height:25px;margin-top:8px;text-align:center;font-size:14px;font-weight:750;color:#9b644c}
  @keyframes bloom{from{opacity:0;transform:scale(.55) rotate(-20deg)}to{opacity:1;transform:scale(1) rotate(0)}}
</style>
<div id="card">
  <div id="title"></div>
  <div id="ask"></div>
  <div id="key" data-key>
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 5c3 0 4 4 4 6 2-2 6-3 8 0s-1 6-4 7c3 2 4 6 1 8s-6-1-8-4c-2 3-6 5-8 2s0-6 2-8c-3-1-5-5-2-7s5-1 7 2c0-3 0-6 0-6Z" fill="#e88d72"/><circle cx="17" cy="16" r="4" fill="#ffcf70"/></svg>
    <span id="keytext"></span><span id="keynumber"></span>
  </div>
  <div id="rows"></div>
  <div id="feedback" aria-live="polite"></div>
</div>
<script>

(() => {
  const p=Studio.params;
  const title=document.getElementById('title');
  const ask=document.getElementById('ask');
  const keytext=document.getElementById('keytext');
  const keynumber=document.getElementById('keynumber');
  const rows=document.getElementById('rows');
  const feedback=document.getElementById('feedback');
  title.textContent=Studio.t('title');
  ask.textContent=Studio.t('ask');
  keytext.textContent=Studio.t('keytext');
  keynumber.textContent=p.symbolValue;
  let pending=null,complete=false;
  for(const item of p.rows){
    const row=document.createElement('button');
    row.type='button';
    row.className='row';
    row.setAttribute('data-row',item.key);
    const name=document.createElement('span');
    name.className='name';
    name.textContent=Studio.t(item.key);
    const symbols=document.createElement('span');
    symbols.className='symbols';
    for(let n=0;n<item.value/p.symbolValue;n++){
      const symbol=document.querySelector('#key svg').cloneNode(true);
      symbol.classList.add('symbol');
      symbol.setAttribute('data-symbol','');
      symbols.appendChild(symbol);
    }
    row.append(name,symbols);
    row.addEventListener('click',()=>{
      if(complete||pending!==null)return;
      pending=row;
      row.classList.add('selected');
      Studio.answer(item.key);
    });
    rows.appendChild(row);
  }
  Studio.onVerdict(({correct})=>{
    if(!pending||complete)return;
    if(correct){
      complete=true;
      feedback.textContent=Studio.t('right');
      ask.textContent=Studio.t('done');
      Studio.done();
    }else{
      pending.classList.remove('selected');
      pending=null;
      feedback.textContent=Studio.t('wrong');
    }
  });
  Studio.ready();
})();

</script>
