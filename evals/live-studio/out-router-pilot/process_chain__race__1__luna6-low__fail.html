<style>
*{box-sizing:border-box}
#lesson{width:360px;height:320px;overflow:hidden;position:relative;padding:10px 12px;background:#fff8eb;color:#493d38;font-family:system-ui,sans-serif;--coral:#ee876e;--teal:#64b7aa}
#lesson h1{height:28px;margin:0 0 6px;text-align:center;font-size:17px;line-height:28px;color:#795143}
#scene{height:174px;position:relative;border-radius:22px;background:#fff0d9;overflow:hidden}
#arrows{position:absolute;inset:0;width:100%;height:100%}
#arrows path{fill:none;stroke:#d4aa7d;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
#nodes{position:absolute;inset:0}
.stage{position:absolute;width:66px;height:68px;transform:translate(-50%,-50%);border:2px solid #f2c79e;border-radius:19px;background:#fffdf7;display:flex;align-items:center;justify-content:center;text-align:center;padding:5px;transition:background .3s,border-color .3s,box-shadow .3s,transform .3s}
.stage[data-lit="true"]{background:#ffe0c4;border-color:var(--coral);box-shadow:0 0 0 5px #ee876e22;transform:translate(-50%,-50%) scale(1.06)}
.stage span{font-size:12px;line-height:1.12;font-weight:750;overflow-wrap:anywhere}
#token{position:absolute;z-index:3;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50% 50% 50% 12%;background:var(--teal);border:3px solid #f8fffa;box-shadow:0 2px 6px #376d6570;transform:rotate(-45deg);transition:left .85s cubic-bezier(.2,.8,.2,1),top .85s cubic-bezier(.2,.8,.2,1)}
#controls{height:52px;display:flex;align-items:center;justify-content:center}
button{font:700 15px system-ui,sans-serif;color:white;background:var(--coral);border:0;border-radius:18px;min-width:112px;min-height:52px;padding:8px 18px;box-shadow:0 4px 0 #cb6854;cursor:pointer;transition:transform .12s,background .2s}
button:active{transform:scale(.94)}
button:focus-visible{outline:3px solid #5b9e94;outline-offset:2px}
#question{display:none;height:108px;text-align:center}
#prompt{font-size:14px;font-weight:750;min-height:28px;padding:2px}
#options{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}
#options button{min-width:76px;max-width:105px;min-height:52px;padding:5px 9px;font-size:12px;background:#65aa9e;box-shadow:0 4px 0 #48877d;overflow-wrap:anywhere}
#feedback{height:20px;text-align:center;font-size:13px;font-weight:700;color:#795143}
#lesson.is-question #controls{display:none}
#lesson.is-question #question{display:block}
</style>
<div id="lesson" aria-live="polite">
  <h1 id="title"></h1>
  <div id="scene">
    <svg id="arrows" aria-hidden="true"></svg>
    <div id="nodes"></div>
    <div id="token" data-token aria-hidden="true"></div>
  </div>
  <div id="controls"><button type="button" data-action="next" id="next"></button></div>
  <div id="question">
    <div id="prompt"></div>
    <div id="options"></div>
  </div>
  <div id="feedback"></div>
</div>
<script>

(()=>{const p=Studio.params,keys=p.stages,root=document.getElementById("lesson"),scene=document.getElementById("scene"),nodes=document.getElementById("nodes"),svg=document.getElementById("arrows"),token=document.getElementById("token"),feedback=document.getElementById("feedback"),t=k=>Studio.t(k),ns="http://";document.getElementById("title").textContent=t("title");const next=document.getElementById("next");next.textContent=t("next");const edges=keys.slice(0,-1).map((k,i)=>[k,keys[i+1]]);if(p.cycle&&keys.length>1)edges.push([keys[keys.length-1],keys[0]]);let index=0,answered=false;const points=[];function setActive(){root.dataset.active=keys[index];nodes.querySelectorAll(".stage").forEach((el,i)=>el.dataset.lit=String(i===index));token.style.left=points[index].x+"px";token.style.top=points[index].y+"px"}function showQuestion(){root.classList.add("is-question");document.getElementById("prompt").textContent=t("ask")+" "+t(p.askAfter)+"?";const opts=document.getElementById("options");p.options.forEach(key=>{const b=document.createElement("button");b.type="button";b.dataset.option=key;b.textContent=t(key);b.addEventListener("click",()=>{if(answered)return;feedback.textContent="";Studio.event("answer",{key});Studio.answer(key)});opts.append(b)});Studio.onVerdict(v=>{feedback.textContent=t(v.correct?"right":"wrong");if(v.correct&&!answered){answered=true;document.getElementById("prompt").textContent=t("done");Studio.done()}})}function layout(){const w=scene.clientWidth,h=scene.clientHeight,n=keys.length;keys.forEach((key,i)=>{let x,y;if(p.cycle&&n>2){const a=-Math.PI/2+2*Math.PI*i/n;x=w/2+Math.cos(a)*Math.min(105,w*.31);y=h/2+Math.sin(a)*Math.min(58,h*.34)}else{x=n===1?w/2:38+i*(w-76)/(n-1);y=h/2}points.push({x,y});const el=document.createElement("div");el.className="stage";el.dataset.stage=key;el.style.left=x+"px";el.style.top=y+"px";const label=document.createElement("span");label.dataset.label=key;label.textContent=t(key);el.append(label);nodes.append(el)});svg.setAttribute("viewBox",`0 0 ${w} ${h}`);const defs=document.createElementNS(ns,"defs"),marker=document.createElementNS(ns,"marker");marker.setAttribute("id","arrowhead");marker.setAttribute("markerWidth","8");marker.setAttribute("markerHeight","8");marker.setAttribute("refX","6");marker.setAttribute("refY","4");marker.setAttribute("orient","auto");marker.setAttribute("markerUnits","userSpaceOnUse");const tip=document.createElementNS(ns,"path");tip.setAttribute("d","M0 0 L8 4 L0 8 Z");tip.setAttribute("fill","#d4aa7d");marker.append(tip);defs.append(marker);svg.append(defs);edges.forEach(([from,to])=>{const a=points[keys.indexOf(from)],b=points[keys.indexOf(to)],dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len,sx=a.x+ux*39,sy=a.y+uy*39,ex=b.x-ux*43,ey=b.y-uy*43,path=document.createElementNS(ns,"path");path.setAttribute("d",p.cycle&&to===keys[0]?`M${sx} ${sy} Q${(sx+ex)/2+45} ${(sy+ey)/2} ${ex} ${ey}`:`M${sx} ${sy} L${ex} ${ey}`);path.setAttribute("marker-end","url(#arrowhead)");path.dataset.arrow=from+">"+to;svg.append(path)});setActive();Studio.ready()}next.addEventListener("click",()=>{if(root.classList.contains("is-question"))return;if(index<keys.length-1){index++;setActive();Studio.event("next",{stage:keys[index]})}else if(p.cycle&&keys.length>1){index=(index+1)%keys.length;setActive();Studio.event("next",{stage:keys[index]})}else showQuestion()});layout()})();

</script>
