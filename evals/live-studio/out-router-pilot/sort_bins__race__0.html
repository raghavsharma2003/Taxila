<style>
*{box-sizing:border-box}
html,body{width:360px;height:320px;margin:0;overflow:hidden}
body{font-family:system-ui,sans-serif;background:#fff8eb;color:#493d35}
#app{width:360px;height:320px;padding:10px;display:flex;flex-direction:column;gap:7px;overflow:hidden}
header{height:43px;flex:none;display:flex;align-items:center;gap:8px}
h1{font-size:19px;line-height:1.1;margin:0;color:#684b36}
.mark{width:34px;height:34px;flex:none}
#instr{height:35px;flex:none;margin:0;padding:5px 9px;border-radius:12px;background:#f4ead9;font-size:13px;line-height:1.2}
#cards{height:62px;flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;align-items:center}
.card{min-width:0;width:100%;height:56px;padding:3px;border:2px solid #e6bd7d;border-radius:13px;background:#fffdf8;color:#554537;font:600 12px/1.1 system-ui,sans-serif;box-shadow:0 3px 0 #e6d3b5;cursor:pointer;transition:transform .18s,box-shadow .18s,background .18s}
.card:active,.bin:active{transform:scale(.94)}
.card.selected{transform:translateY(-5px);background:#fff2c9;box-shadow:0 6px 0 #e9c56d,0 0 12px #f3cd72;border-color:#d99f39}
.card.shake{animation:shake .32s ease}
#bins{height:112px;flex:none;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bin{min-width:0;height:112px;padding:6px;border:2px solid #b9d7c5;border-radius:17px;background:#edf7ef;box-shadow:0 3px 0 #d5e6d7;cursor:pointer;transition:transform .16s,border-color .16s,background .16s}
.bin:nth-child(2){background:#f1f0e8;border-color:#d1cdb9;box-shadow:0 3px 0 #dfdccd}
.bin-name{height:25px;display:block;font-weight:700;font-size:13px;line-height:1.2;overflow:hidden}
.contents{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}
.placed{max-width:100%;padding:3px 7px;border-radius:9px;background:#fffefa;border:1px solid #d7e5d8;font-size:11px;line-height:1.2;overflow-wrap:anywhere;animation:arrive .3s ease}
#feedback{height:22px;flex:none;text-align:center;font-size:13px;font-weight:650;color:#7b6444;line-height:22px}
@keyframes shake{25%{transform:translateX(-5px)}60%{transform:translateX(4px)}85%{transform:translateX(-2px)}}
@keyframes arrive{from{transform:scale(.7);opacity:.3}to{transform:scale(1);opacity:1}}
</style>
<div id="app">
  <header>
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3c9 0 16 7 16 16S29 36 20 36 4 28 4 19 11 3 20 3Z" fill="#f6d88e"/><path d="M12 21c5-1 8-5 10-11 4 4 6 8 5 12-1 5-6 8-11 5-3-1-5-4-4-6Z" fill="#82ad79"/><path d="M14 27c4-5 7-9 12-13" fill="none" stroke="#fff8eb" stroke-width="2" stroke-linecap="round"/></svg>
    <h1 id="title"></h1>
  </header>
  <p id="instr"></p>
  <div id="cards"></div>
  <div id="bins"></div>
  <div id="feedback"></div>
</div>
<script>

(()=>{
  const p=Studio.params, cards=p.cards, bins=p.bins;
  const title=document.getElementById("title"), instr=document.getElementById("instr");
  const cardsBox=document.getElementById("cards"), binsBox=document.getElementById("bins");
  const feedback=document.getElementById("feedback");
  title.textContent=Studio.t("title");
  instr.textContent=Studio.t("instr");
  let selected=null, pending=false, finished=0, complete=false, pendingCard=null, pendingBin=null;
  const cardEls=new Map(), placed=new Map();
  cards.forEach(key=>{
    const el=document.createElement("button");
    el.type="button"; el.className="card"; el.dataset.card=key; el.dataset.selected="false";
    el.textContent=Studio.t(key);
    el.addEventListener("click",()=>{
      if(pending||complete||placed.has(key)) return;
      if(selected===key){selected=null;el.classList.remove("selected");el.dataset.selected="false";}
      else{
        if(selected!==null){const old=cardEls.get(selected);old.classList.remove("selected");old.dataset.selected="false";}
        selected=key;el.classList.add("selected");el.dataset.selected="true";
      }
      Studio.event("card_tap",{});
    });
    cardEls.set(key,el); cardsBox.appendChild(el);
  });
  bins.forEach(key=>{
    const area=document.createElement("button");
    area.type="button"; area.className="bin"; area.dataset.bin=key;
    const name=document.createElement("span");name.className="bin-name";name.textContent=Studio.t(key);
    const contents=document.createElement("span");contents.className="contents";
    area.append(name,contents);
    area.addEventListener("click",()=>{
      if(pending||complete||selected===null) return;
      pending=true;pendingCard=selected;pendingBin=key;
      Studio.event("bin_tap",{});
      Studio.answer({card:pendingCard,bin:pendingBin});
    });
    binsBox.appendChild(area);
  });
  Studio.onVerdict(({correct})=>{
    if(!pending||complete) return;
    const card=pendingCard, key=pendingBin, cardEl=cardEls.get(card);
    if(correct){
      placed.set(card,key);
      cardEl.remove();
      const chip=document.createElement("span");
      chip.className="placed";chip.textContent=Studio.t(card);chip.dataset.placed=key;
      binsBox.querySelector('[data-bin="'+key+'"] .contents').appendChild(chip);
      finished++;
      feedback.textContent=Studio.t("right");
      if(finished===cards.length){
        complete=true;
        feedback.textContent=Studio.t("done");
        Studio.done();
      }
    }else{
      cardEl.classList.add("shake");
      feedback.textContent=Studio.t("wrong");
      setTimeout(()=>cardEl.classList.remove("shake"),340);
      cardEl.classList.remove("selected");cardEl.dataset.selected="false";
    }
    selected=null;pending=false;pendingCard=null;pendingBin=null;
  });
  Studio.ready();
})();

</script>
