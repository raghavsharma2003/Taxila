<style>
*{box-sizing:border-box}
#app{width:360px;height:320px;position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(180deg,#fff8e8,#f3efff);font-family:Arial,sans-serif;color:#633f68;user-select:none}
#top{height:57px;display:flex;align-items:center;justify-content:center;padding:7px 16px 3px}
#title{margin:0;font-size:20px;line-height:24px;font-weight:800;text-align:center;color:#684069}
#card{position:absolute;left:10px;top:53px;width:340px;height:226px;overflow:hidden;border-radius:22px;background:#fffdf8;box-shadow:0 5px 0 rgba(112,74,128,.1),0 10px 22px rgba(98,67,115,.1)}
#garden{display:block;width:340px;height:226px}
#bottom{position:absolute;left:10px;right:10px;bottom:7px;height:29px;display:flex;align-items:center;justify-content:center}
#message{margin:0;min-height:25px;padding:3px 14px;border-radius:14px;background:rgba(255,255,255,.75);font-size:15px;font-weight:800;text-align:center;color:#694369}
.part{cursor:pointer;outline:none;transform-box:fill-box;transform-origin:center;transition:filter .2s ease,transform .2s ease,opacity .2s ease}
.part:hover{filter:brightness(1.06)}
.part:active{transform:scale(.94)}
.part.waiting{filter:brightness(.9);transform:scale(.97)}
.part.correct{filter:drop-shadow(0 0 7px #ffd85e) drop-shadow(0 0 12px #ff9b70);animation:happy .7s ease-in-out infinite alternate}
.part.dim{opacity:.54;pointer-events:none}
.hit{fill:transparent;pointer-events:all}
.leader{fill:none;stroke:#90718e;stroke-width:2;stroke-linecap:round}
.label{font-size:14px;font-weight:800;fill:#68406e;paint-order:stroke;stroke:#fffdf8;stroke-width:4px;stroke-linejoin:round}
@keyframes happy{from{transform:scale(1)}to{transform:scale(1.07)}}
@keyframes floaty{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.bee{animation:floaty 1.5s ease-in-out infinite alternate}
</style>

<script>

(function(){
  var params=Studio.params;
  var parts=params.parts;
  var locked=false;
  var finished=false;
  var message=document.getElementById('message');

  document.getElementById('title').textContent=Studio.t('title');
  message.textContent=Studio.t('ask');

  parts.forEach(function(key){
    var label=document.querySelector('[data-label="'+key+'"]');
    var shape=document.querySelector('[data-part="'+key+'"]');
    if(label){label.textContent=Studio.t(key);}
    if(shape){
      shape.addEventListener('click',function(){
        if(locked||finished){return;}
        locked=true;
        shape.classList.add('waiting');
        message.textContent='';
        Studio.event('tap',{part:key});
        Studio.answer(key);
      });
    }
  });

  Studio.onVerdict(function(result){
    var selected=document.querySelector('.waiting');
    if(selected){selected.classList.remove('waiting');}
    if(result.correct){
      finished=true;
      if(selected){selected.classList.add('correct');}
      parts.forEach(function(key){
        var part=document.querySelector('[data-part="'+key+'"]');
        if(part&&part!==selected){part.classList.add('dim');}
      });
      message.textContent=Studio.t('right');
      Studio.event('verdict',{correct:1});
      Studio.done();
    }else{
      locked=false;
      message.textContent=Studio.t('wrong');
      Studio.event('verdict',{correct:0});
    }
  });

  Studio.ready();
}());

</script>
