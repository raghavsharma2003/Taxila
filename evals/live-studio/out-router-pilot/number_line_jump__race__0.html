<style>
*{box-sizing:border-box}
body{margin:0;width:360px;height:320px;overflow:hidden;font-family:system-ui,sans-serif;color:#35434a;background:#fff8ed}
.stage{width:360px;height:320px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.top{height:60px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:18px;line-height:1.15;margin:0;font-weight:750;color:#425b55}
.target-card{min-width:74px;height:56px;border-radius:17px;background:#e6f3e9;display:grid;place-items:center;color:#355d4c;font-size:23px;font-weight:800;box-shadow:0 3px 0 #d1e5d5}
.board{position:relative;height:111px;border-radius:20px;background:#fff;box-shadow:0 3px 12px #72563316;overflow:hidden}
.track{position:absolute;left:20px;right:20px;top:49px;height:4px;background:#d7b779;border-radius:5px}
.tick{position:absolute;top:41px;width:2px;height:20px;background:#b58b4c;transform:translateX(-50%);border-radius:3px}
.tick-label{position:absolute;top:67px;transform:translateX(-50%);font-size:12px;color:#6b665e;white-space:nowrap}
.marker{position:absolute;top:19px;width:24px;height:24px;border:4px solid #fff;background:#ed8d61;border-radius:50%;transform:translateX(-50%);box-shadow:0 2px 7px #8e4f3690;transition:left .22s cubic-bezier(.2,.8,.25,1),top .2s}
.marker.hop{top:8px}
.controls{display:flex;gap:8px;height:58px}
button{font:inherit;font-weight:750;border:0;cursor:pointer;touch-action:manipulation;transition:transform .12s,filter .12s,background .2s}
button:active{transform:scale(.94)}
.move{height:58px;flex:1;border-radius:17px;background:#f6dfbd;color:#71532d;font-size:17px;box-shadow:0 3px 0 #e6c99f}
.check{height:58px;flex:1.3;border-radius:17px;background:#52806d;color:white;font-size:17px;box-shadow:0 3px 0 #3c6655}
.feedback{height:26px;text-align:center;font-size:15px;font-weight:750;color:#537761}
.feedback.wrong{color:#a66a56;animation:nudge .25s ease}
@keyframes nudge{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
button:focus-visible{outline:3px solid #e9a56f;outline-offset:2px}
</style>
<div class="stage">
  <div class="top">
    <h1 id="title"></h1>
    <div class="target-card" data-target></div>
  </div>
  <div class="board" id="board" aria-hidden="true">
    <div class="track"></div>
    <div id="ticks"></div>
    <div class="marker" data-marker data-value=""></div>
  </div>
  <div class="controls">
    <button class="move" data-action="left" type="button"></button>
    <button class="move" data-action="right" type="button"></button>
    <button class="check" data-action="check" type="button"></button>
  </div>
  <div class="feedback" id="feedback" aria-live="polite"></div>
  <div id="item" data-item=""></div>
</div>
<script>

(()=>{
 const p=Studio.params, t=Studio.t;
 const title=document.getElementById("title"), targetEl=document.querySelector("[data-target]");
 const marker=document.querySelector("[data-marker]"), ticks=document.getElementById("ticks");
 const itemEl=document.getElementById("item"), feedback=document.getElementById("feedback");
 const left=document.querySelector('[data-action="left"]'), right=document.querySelector('[data-action="right"]'), check=document.querySelector('[data-action="check"]');
 title.textContent=t("title");
 left.textContent=t("left"); right.textContent=t("right_btn"); check.textContent=t("check");
 const count=Math.round((p.max-p.min)/p.step), lineLeft=20, lineWidth=292;
 const val=k=>Number((p.min+k*p.step).toFixed(6));
 const show=v=>{
   if(p.format==="fraction") return Math.round(v*p.den)+"/"+p.den;
   return String(Number(v.toFixed(6)));
 };
 for(let k=0;k<=count;k++){
   const v=val(k), x=lineLeft+lineWidth*((v-p.min)/(p.max-p.min||1));
   const tick=document.createElement("div");
   tick.className="tick"; tick.dataset.tick=String(v);
   tick.style.left=x+"px"; ticks.appendChild(tick);
   if(k%p.labelEvery===0){
     const label=document.createElement("div"); label.className="tick-label";
     label.style.left=x+"px"; label.textContent=show(v); ticks.appendChild(label);
   }
 }
 let index=0, position=Math.round((p.start-p.min)/p.step), waiting=false, complete=false;
 function update(){
   const item=p.items[index];
   itemEl.dataset.item=item.id;
   targetEl.textContent=show(item.target);
   marker.dataset.value=String(val(position));
   marker.style.left=(lineLeft+lineWidth*((val(position)-p.min)/(p.max-p.min||1)))+"px";
 }
 function finish(){
   complete=true;
   targetEl.textContent=t("done");
   itemEl.dataset.item="";
   marker.hidden=true;
   left.disabled=right.disabled=check.disabled=true;
   Studio.done();
 }
 left.addEventListener("click",()=>{if(waiting||complete)return;position=Math.max(0,position-1);feedback.textContent="";update();Studio.event("move",{direction:"left"});});
 right.addEventListener("click",()=>{if(waiting||complete)return;position=Math.min(count,position+1);feedback.textContent="";update();Studio.event("move",{direction:"right"});});
 check.addEventListener("click",()=>{
   if(waiting||complete)return;
   waiting=true;
   Studio.answer({value:val(position)});
 });
 Studio.onVerdict(({correct})=>{
   if(complete)return;
   if(correct){
     feedback.className="feedback"; feedback.textContent=t("right");
     marker.classList.add("hop");
     setTimeout(()=>{
       marker.classList.remove("hop");
       index++;
       if(index>=p.items.length){finish();return;}
       position=Math.round((p.start-p.min)/p.step);
       waiting=false; feedback.textContent=""; update();
     },420);
   }else{
     feedback.className="feedback wrong"; feedback.textContent=t("wrong");
     waiting=false;
   }
 });
 update();
 Studio.ready();
})();

</script>
