<style>
*{box-sizing:border-box}
#lesson{width:360px;height:320px;overflow:hidden;background:#fff8e9;color:#354449;font-family:system-ui,sans-serif;padding:9px 10px;position:relative;--teal:#258f87;--coral:#ef8c68}
h1{height:25px;margin:0 0 4px;text-align:center;font-size:18px;line-height:25px;color:#315d5b}
#scene{height:156px;position:relative;border-radius:18px;background:#f2ead5;overflow:hidden}
#arrows{position:absolute;inset:0;width:100%;height:100%}
#arrows line{stroke:#9db6a7;stroke-width:3;stroke-linecap:round}
.stage{position:absolute;width:94px;height:54px;transform:translate(-50%,-50%);border:2px solid #e3c995;border-radius:16px;background:#fffdf7;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;font-size:12px;font-weight:700;line-height:14px;transition:box-shadow .25s,border-color .25s,transform .25s}
.stage[data-current="true"]{border-color:var(--teal);box-shadow:0 0 0 5px #258f8726,0 3px 10px #3c756033;transform:translate(-50%,-50%) scale(1.04)}
#token{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--coral);border:3px solid white;box-shadow:0 2px 7px #6b5748;transform:translate(-50%,-50%);transition:left .75s cubic-bezier(.2,.8,.25,1),top .75s cubic-bezier(.2,.8,.25,1);z-index:2;pointer-events:none}
button{font:inherit;color:#fff;background:var(--teal);border:0;border-radius:15px;min-height:52px;cursor:pointer;touch-action:manipulation;transition:transform .12s,background .2s}
button:active{transform:scale(.94)}
#next{display:block;width:100%;margin:5px 0 3px;font-weight:700}
#ask{height:20px;font-size:13px;line-height:20px;text-align:center;font-weight:700;margin:1px 0 3px}
#options{display:flex;gap:6px}
#options button{flex:1;min-width:0;padding:3px 4px;font-size:11px;line-height:13px;background:#578d75}
#feedback{height:18px;text-align:center;font-size:12px;font-weight:700;color:#557b66;margin-top:2px}
</style>
<div id="lesson">
  <h1 id="title"></h1>
  <div id="scene">
    <svg id="arrows" viewBox="0 0 360 156" aria-hidden="true"><defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9db6a7"/></marker></defs></svg>
    <div id="token" data-token></div>
  </div>
  <button id="next" data-action="next"></button>
  <div id="ask"></div>
  <div id="options"></div>
  <div id="feedback" aria-live="polite"></div>
</div>
<script>

(()=>{
 const p=Studio.params, keys=p.stages, root=document.getElementById("lesson"), scene=document.getElementById("scene"), svg=document.getElementById("arrows"), token=document.getElementById("token");
 document.getElementById("title").textContent=Studio.t("title");
 document.getElementById("next").textContent=Studio.t("next");
 document.getElementById("ask").textContent=Studio.t("ask");
 const points=keys.map((_,i)=>{
  if(keys.length===4)return [{x:95,y:43},{x:265,y:43},{x:265,y:113},{x:95,y:113}][i];
  const a=-Math.PI/2+2*Math.PI*i/keys.length;
  return {x:180+105*Math.cos(a),y:78+48*Math.sin(a)};
 });
 keys.forEach((key,i)=>{
  const el=document.createElement("div"); el.className="stage"; el.dataset.stage=key; el.dataset.label=key;
  const label=document.createElement("span"); label.textContent=Studio.t(key); el.appendChild(label);
  el.style.left=points[i].x+"px"; el.style.top=points[i].y+"px"; scene.appendChild(el);
 });
 const edgeCount=p.cycle?keys.length:keys.length-1;
 for(let i=0;i<edgeCount;i++){
  const j=(i+1)%keys.length,a=points[i],b=points[j],dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy),pad=51;
  const line=document.createElementNS("http://","line");
  line.dataset.arrow=keys[i]+">"+keys[j];
  line.setAttribute("x1",a.x+dx*pad/len); line.setAttribute("y1",a.y+dy*pad/len);
  line.setAttribute("x2",b.x-dx*pad/len); line.setAttribute("y2",b.y-dy*pad/len);
  line.setAttribute("marker-end","url(#arrowhead)"); svg.appendChild(line);
 }
 let current=0;
 function setActive(i){
  current=i; root.dataset.active=keys[i];
  scene.querySelectorAll(".stage").forEach((el,j)=>el.dataset.current=j===i?"true":"false");
  token.style.left=points[i].x+"px"; token.style.top=points[i].y+"px";
 }
 setActive(0);
 document.getElementById("next").addEventListener("click",()=>{
  if(current<keys.length-1)setActive(current+1);
  else if(p.cycle)setActive(0);
  Studio.event("next",{stage:keys[current]});
 });
 const feedback=document.getElementById("feedback"), options=document.getElementById("options");
 p.options.forEach(key=>{
  const button=document.createElement("button"); button.dataset.option=key; button.textContent=Studio.t(key);
  button.addEventListener("click",()=>{
   Studio.answer(key);
   Studio.onVerdict(v=>{
    feedback.textContent=Studio.t(v.correct?"right":"wrong");
    if(v.correct)Studio.done();
   });
  });
  options.appendChild(button);
 });
 Studio.ready();
})();

</script>
