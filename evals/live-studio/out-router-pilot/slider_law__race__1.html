<style>
*{box-sizing:border-box}
html,body{margin:0;width:360px;height:320px;overflow:hidden}
body{font-family:system-ui,sans-serif;color:#284650;background:#fff8ec}
#app{width:360px;height:320px;padding:10px 14px;display:flex;flex-direction:column;gap:7px}
header{height:28px;display:flex;align-items:center;justify-content:center;color:#714b30;font-size:17px;font-weight:800}
main{display:flex;gap:12px;min-height:122px;padding:6px 9px;background:#fff;border:1px solid #f0dfc9;border-radius:18px}
.controls{width:148px;display:flex;flex-direction:column;justify-content:center;gap:7px}
.reading{font-size:15px;font-weight:750;line-height:1.45}
.reading span{color:#b66d36;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;transition:transform .14s ease,filter .14s ease,background .2s ease}
button:active{transform:scale(.93)}
button:focus-visible{outline:3px solid #eaa85e;outline-offset:2px}
.stepper{display:flex;gap:7px}
.stepper button{width:68px;height:52px;border-radius:15px;background:#f9ddbd;color:#70452c;font-size:23px;font-weight:800;box-shadow:0 3px 0 #e9c397}
.stepper button:hover,.option:hover{filter:brightness(.97)}
.scene{flex:1;position:relative;display:flex;align-items:flex-end;justify-content:center;border-radius:13px;background:linear-gradient(#e6f5f2,#f6fbf8);overflow:hidden}
.scene:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to top,transparent 0 19px,#dcece7 20px);opacity:.8}
#visual{position:relative;z-index:1;width:54px;height:0;max-height:none;flex:none;border-radius:12px 12px 5px 5px;background:linear-gradient(90deg,#f2a85c,#ffd48d 48%,#e8914c);box-shadow:inset 0 0 0 2px #e4914b,0 3px 8px #bd8a5b55;transition:height .38s cubic-bezier(.2,.8,.25,1)}
.question{padding:7px 10px 8px;border-radius:16px;background:#fff;border:1px solid #f0dfc9}
.prompt{min-height:25px;text-align:center;font-size:14px;font-weight:750;color:#714b30}
.options{display:flex;justify-content:center;gap:10px;margin-top:5px}
.option{min-width:68px;height:52px;border-radius:15px;background:#d8eee7;color:#28594d;font-size:20px;font-weight:800;box-shadow:0 3px 0 #b6d9ce}
.feedback{height:24px;text-align:center;font-size:14px;font-weight:800;color:#537c58}
.feedback.bad{color:#ad6846}
</style>
<div id="app">
  <header id="title"></header>
  <main>
    <section class="controls">
      <div class="reading"><span id="xname"></span> = <span id="xread" data-x=""></span></div>
      <div class="reading"><span id="yname"></span> = <span id="output" data-output data-value=""></span></div>
      <div class="stepper">
        <button type="button" data-action="dec" id="dec"></button>
        <button type="button" data-action="inc" id="inc"></button>
      </div>
    </section>
    <div class="scene"><div id="visual" data-visual data-dim="h"></div></div>
  </main>
  <section class="question">
    <div class="prompt"><span id="ask"></span> <span id="askx"></span></div>
    <div class="options" id="options"></div>
  </section>
  <div class="feedback" id="feedback" aria-live="polite"></div>
</div>
<script>

(()=>{
  const p=Studio.params;
  const t=Studio.t;
  const fmt=n=>String(Number(Number(n).toFixed(10)));
  const app=document.getElementById("app");
  document.getElementById("title").textContent=t("title");
  document.getElementById("xname").textContent=t("xname");
  document.getElementById("yname").textContent=t("yname");
  document.getElementById("dec").textContent=t("less");
  document.getElementById("inc").textContent=t("more");
  document.getElementById("ask").textContent=t("ask");
  document.getElementById("askx").textContent=fmt(p.ask.x);
  const xread=document.getElementById("xread");
  const output=document.getElementById("output");
  const visual=document.getElementById("visual");
  const dec=document.getElementById("dec");
  const inc=document.getElementById("inc");
  let x=p.x.start;
  let completed=false;
  const update=()=>{
    const y=Number((p.law.k*x+p.law.b).toFixed(10));
    xread.textContent=fmt(x);
    xread.dataset.x=fmt(x);
    output.textContent=fmt(y);
    output.dataset.value=fmt(y);
    visual.style.height=(y*p.y.unitsPer)+"px";
    dec.disabled=x-p.x.step<p.x.min;
    inc.disabled=x+p.x.step>p.x.max;
    dec.style.opacity=dec.disabled?".48":"1";
    inc.style.opacity=inc.disabled?".48":"1";
  };
  dec.addEventListener("click",()=>{
    if(x-p.x.step>=p.x.min){x-=p.x.step;update();Studio.event("change",{x});}
  });
  inc.addEventListener("click",()=>{
    if(x+p.x.step<=p.x.max){x+=p.x.step;update();Studio.event("change",{x});}
  });
  const choices=document.getElementById("options");
  p.ask.options.forEach(value=>{
    const b=document.createElement("button");
    b.type="button";
    b.className="option";
    b.dataset.option=fmt(value);
    b.textContent=fmt(value);
    b.addEventListener("click",()=>{
      Studio.event("answer",{value:Number(value)});
      Studio.answer({value});
    });
    choices.appendChild(b);
  });
  const feedback=document.getElementById("feedback");
  Studio.onVerdict(({correct})=>{
    feedback.textContent=correct?t("right"):t("wrong");
    feedback.classList.toggle("bad",!correct);
    if(correct&&!completed){
      completed=true;
      feedback.textContent=t("done");
      Studio.done();
    }
  });
  update();
  Studio.ready();
})();

</script>
