<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;font-family:system-ui,sans-serif;background:#fff8ed;color:#514237}
  #game{width:360px;height:320px;padding:12px;overflow:hidden;position:relative;background:radial-gradient(circle at 92% 8%,#ffe5bc 0 42px,transparent 43px),#fff8ed}
  #title{height:29px;font-size:20px;font-weight:800;line-height:29px}
  #instr{height:25px;font-size:13px;line-height:22px;color:#75675b}
  #cards{height:112px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:7px;padding:3px 0}
  .card{border:2px solid #e5b778;border-radius:14px;background:#fffdf8;color:#514237;min-width:77px;height:52px;padding:0 12px;font:700 15px system-ui,sans-serif;box-shadow:0 4px 0 #e9d5b8;cursor:pointer;transition:transform .22s,box-shadow .22s,opacity .22s}
  .card:active,.bin:active{transform:scale(.96)}
  .card[data-selected="true"]{transform:translateY(-6px) scale(1.06);box-shadow:0 8px 0 #e9d5b8,0 0 0 4px #ffd988}
  #bins{height:111px;display:flex;gap:7px}
  .bin{flex:1;min-width:0;height:108px;border:2px solid #d7a979;border-radius:17px;background:#f8dfb9;padding:6px 3px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:transform .2s,background .2s}
  .bin:nth-child(2){background:#d9ece8;border-color:#94c8c0}
  .bin:nth-child(3){background:#e9def0;border-color:#c3a6d2}
  .bin-name{font-size:14px;font-weight:800;line-height:20px;text-align:center}
  .placed-area{width:100%;display:flex;flex-wrap:wrap;justify-content:center;gap:3px;overflow:hidden}
  .placed{max-width:100%;border-radius:8px;background:#fffdf8;padding:3px 6px;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:pop .28s both}
  #feedback{height:25px;text-align:center;font-size:14px;font-weight:700;line-height:25px;color:#755572}
  .shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
  @keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
</style>
<div id="game">
  <div id="title"></div>
  <div id="instr"></div>
  <div id="cards"></div>
  <div id="bins"></div>
  <div id="feedback" aria-live="polite"></div>
</div>
<script>

(()=>{
  const p=Studio.params;
  const cards=document.getElementById('cards');
  const bins=document.getElementById('bins');
  const feedback=document.getElementById('feedback');
  document.getElementById('title').textContent=Studio.t('title');
  document.getElementById('instr').textContent=Studio.t('instr');
  let selected=null,pending=false,remaining=p.cards.length;
  const binNodes=new Map();
  p.bins.forEach(key=>{
    const bin=document.createElement('div');
    bin.className='bin';
    bin.dataset.bin=key;
    const name=document.createElement('div');
    name.className='bin-name';
    name.textContent=Studio.t(key);
    const area=document.createElement('div');
    area.className='placed-area';
    bin.append(name,area);
    bins.append(bin);
    binNodes.set(key,{bin,area});
    bin.addEventListener('click',()=>{
      if(!selected||pending)return;
      pending=true;
      const card=selected;
      Studio.answer({card:card.dataset.card,bin:key});
    });
  });
  p.cards.forEach(key=>{
    const card=document.createElement('button');
    card.type='button';
    card.className='card';
    card.dataset.card=key;
    card.dataset.selected='false';
    card.textContent=Studio.t(key);
    cards.append(card);
    card.addEventListener('click',()=>{
      if(pending)return;
      if(selected)selected.dataset.selected='false';
      selected=card;
      card.dataset.selected='true';
      feedback.textContent='';
      Studio.event('pick',{card:key});
    });
  });
  Studio.onVerdict(({correct})=>{
    if(!pending||!selected)return;
    const card=selected;
    const key=card.dataset.card;
    const target=correct?binNodes.get(lastBin):null;
    if(correct&&target){
      feedback.textContent=Studio.t('right');
      const start=card.getBoundingClientRect();
      const end=target.area.getBoundingClientRect();
      card.style.transform=`translate(${end.left-start.left+(end.width-start.width)/2}px,${end.top-start.top}px) scale(.7)`;
      card.style.opacity='0';
      setTimeout(()=>{
        const placed=document.createElement('div');
        placed.className='placed';
        placed.dataset.placed=lastBin;
        placed.textContent=Studio.t(key);
        target.area.append(placed);
        card.remove();
        remaining--;
        if(!remaining){
          feedback.textContent=Studio.t('done');
          Studio.done();
        }
      },230);
    }else{
      feedback.textContent=Studio.t('wrong');
      card.dataset.selected='false';
      card.classList.add('shake');
      setTimeout(()=>card.classList.remove('shake'),360);
    }
    selected=null;
    pending=false;
  });
  let lastBin=null;
  bins.addEventListener('click',e=>{
    const bin=e.target.closest('[data-bin]');
    if(bin)lastBin=bin.dataset.bin;
  },true);
  Studio.ready();
})();

</script>
