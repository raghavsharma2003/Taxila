<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;background:#fff8ed;font-family:system-ui,sans-serif;color:#49372f}
  .card{width:360px;height:320px;padding:15px 18px 12px;overflow:hidden;background:radial-gradient(circle at 90% 8%,#ffe7c4 0 35px,transparent 36px),#fff8ed}
  .title{margin:0;font-size:20px;line-height:27px;font-weight:800}
  .ask{margin:2px 0 8px;font-size:15px;line-height:21px;font-weight:650}
  .key{height:40px;display:flex;align-items:center;gap:8px;padding:0 11px;border-radius:13px;background:#fff0d9;color:#684635;font-size:14px;font-weight:700}
  .key .symbol{margin-left:auto}
  .rows{display:flex;flex-direction:column;gap:7px;margin-top:10px}
  .row{width:100%;min-height:52px;display:flex;align-items:center;border:2px solid #e8d8c3;border-radius:15px;background:#fffdf8;padding:5px 10px;color:inherit;cursor:pointer;transition:transform .18s,background .18s,border-color .18s}
  .row:active{transform:scale(.97)}
  .row:focus-visible{outline:3px solid #a55d48;outline-offset:2px}
  .row.chosen{background:#fff0df;border-color:#e49a66;animation:bump .28s ease}
  .row:disabled{cursor:default}
  .name{width:65px;flex:none;text-align:left;font:700 16px system-ui,sans-serif}
  .symbols{display:flex;align-items:center;gap:7px;flex-wrap:nowrap}
  .symbol{display:block;width:25px;height:25px;flex:none}
  .feedback{height:25px;margin-top:7px;font-size:15px;font-weight:750;color:#9a543e}
  .feedback.good{color:#397c64}
  @keyframes bump{50%{transform:scale(1.025)}}
</style>
<div class="card">
  <h1 class="title" id="title"></h1>
  <p class="ask" id="ask"></p>
  <div class="key" data-key><span id="keytext"></span><svg class="symbol" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3.5c2.6 5.5 3.4 6.3 9.4 6.7-4.1 4.8-4.5 5.9-2.8 12-5.7-2.7-7.5-2.7-13.2 0 1.7-6.1 1.3-7.2-2.8-12 6-.4 6.8-1.2 9.4-6.7Z" fill="#ef9b62" stroke="#bb6d4e" stroke-width="1.5"/><circle cx="12" cy="15" r="1.2" fill="#794d3b"/><circle cx="20" cy="15" r="1.2" fill="#794d3b"/><path d="M13 19q3 2.5 6 0" fill="none" stroke="#794d3b" stroke-width="1.4" stroke-linecap="round"/></svg><span id="keynumber"></span></div>
  <div class="rows" id="rows"></div>
  <div class="feedback" id="feedback" aria-live="polite"></div>
</div>
<script>

(()=>{
  const p=Studio.params;
  const $=id=>document.getElementById(id);
  $('title').textContent=Studio.t('title');
  $('ask').textContent=Studio.t('ask');
  $('keytext').textContent=Studio.t('keytext');
  $('keynumber').textContent=p.symbolValue;
  const shape=document.querySelector('[data-key] .symbol');
  const buttons=[];
  let pending=false,complete=false;
  for(const item of p.rows){
    const button=document.createElement('button');
    button.type='button';
    button.className='row';
    button.setAttribute('data-row',item.key);
    const name=document.createElement('span');
    name.className='name';
    name.textContent=Studio.t(item.key);
    const symbols=document.createElement('span');
    symbols.className='symbols';
    for(let i=0;i<item.value/p.symbolValue;i++){
      const symbol=shape.cloneNode(true);
      symbol.setAttribute('data-symbol','');
      symbols.appendChild(symbol);
    }
    button.append(name,symbols);
    button.addEventListener('click',()=>{
      if(pending||complete)return;
      pending=true;
      buttons.forEach(b=>{b.disabled=true;b.classList.remove('chosen')});
      button.classList.add('chosen');
      $('feedback').textContent='';
      Studio.answer(item.key);
    });
    buttons.push(button);
    $('rows').appendChild(button);
  }
  Studio.onVerdict(({correct})=>{
    if(!pending||complete)return;
    $('feedback').classList.toggle('good',correct);
    if(correct){
      complete=true;
      $('feedback').textContent=Studio.t('right')+' '+Studio.t('done');
      Studio.done();
    }else{
      $('feedback').textContent=Studio.t('wrong');
      pending=false;
      buttons.forEach(b=>{b.disabled=false;b.classList.remove('chosen')});
    }
  });
  Studio.ready();
})();

</script>
