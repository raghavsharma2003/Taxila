<style>
*{box-sizing:border-box}
body{margin:0;width:360px;height:320px;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff8ed;color:#543b32}
#app{position:relative;width:360px;height:320px;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#fffdf8 0%,#fff8ed 75%)}
h1{position:absolute;left:16px;top:8px;margin:0;font-size:18px;line-height:24px;font-weight:800;color:#704b36}
#question{position:absolute;left:16px;right:16px;top:34px;min-height:42px;padding:8px 11px;border-radius:14px;background:#f7e7ce;color:#654a3c;font-size:14px;line-height:18px;font-weight:650}
#axis{position:absolute;left:20px;top:158px;width:320px;height:4px;border-radius:4px;background:#d9985f;box-shadow:0 2px 0 #f2d2a9}
#axis:before,#axis:after{content:"";position:absolute;top:-5px;width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent}
#axis:before{left:-2px;border-right:10px solid #d9985f}
#axis:after{right:-2px;border-left:10px solid #d9985f}
#connectors{position:absolute;inset:0;width:360px;height:320px;pointer-events:none}
.connector{stroke:#d9985f;stroke-width:2;stroke-linecap:round;opacity:.75}
.marker{position:absolute;top:152px;width:16px;height:16px;margin-left:-8px;border:3px solid #fff8ed;border-radius:50%;background:#d9824b;box-shadow:0 0 0 2px #b96d43;transition:transform .2s ease}
.event-card{position:absolute;width:94px;height:72px;padding:8px 6px;border:2px solid #eac99d;border-radius:15px;background:#fffdf8;box-shadow:0 3px 0 #efd9bb;color:#674832;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;touch-action:manipulation;transition:transform .16s ease,background .2s,border-color .2s,box-shadow .2s}
.event-card span:first-child{font-size:12px;line-height:15px;font-weight:750}
.event-card span:last-child{font-size:13px;line-height:16px;font-weight:800;color:#a15d37}
.event-card:active{transform:scale(.94)}
.event-card:focus-visible{outline:3px solid #e5a75c;outline-offset:2px}
#feedback{position:absolute;left:16px;right:16px;bottom:12px;min-height:44px;padding:9px 12px;border-radius:14px;background:#f7e7ce;color:#704b36;font-size:14px;line-height:18px;font-weight:750;text-align:center;opacity:0;transform:translateY(5px);transition:opacity .2s,transform .2s}
#feedback.show{opacity:1;transform:translateY(0)}
.event-card.chosen{background:#fff1d9;border-color:#d99454;box-shadow:0 3px 0 #e5bf8f}
.marker.chosen{transform:scale(1.35)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>
<div id="app">
  <h1 id="title"></h1>
  <div id="question"></div>
  <div id="axis" data-axis aria-label=""></div>
  <svg id="connectors" aria-hidden="true"></svg>
  <div id="events"></div>
  <div id="feedback" aria-live="polite"></div>
</div>
<script>

(function(){
  const p=Studio.params, app=document.getElementById("app"), events=p.events;
  document.getElementById("title").textContent=Studio.t("title");
  document.getElementById("question").textContent=Studio.t("ask");
  const axis=document.getElementById("axis");
  axis.setAttribute("aria-label",Studio.t("ask"));
  const sorted=events.slice().sort((a,b)=>a.year-b.year);
  const first=sorted[0].year,last=sorted[sorted.length-1].year;
  const xFor=e=>20+(last===first?160:(e.year-first)/(last-first)*320);
  const rows=document.getElementById("events"),svg=document.getElementById("connectors");
  sorted.forEach((e,i)=>{
    const x=xFor(e), upper=i%2===0, top=upper?48:180;
    const left=Math.max(2,Math.min(264,x-47));
    const center=left+47;
    const line=document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("x1",x);line.setAttribute("x2",center);
    line.setAttribute("y1",160);line.setAttribute("y2",upper?top+72:top);
    line.setAttribute("class","connector");svg.appendChild(line);
    const marker=document.createElement("div");
    marker.className="marker";marker.dataset.event=e.key;marker.dataset.year=e.year;
    marker.style.left=x+"px";rows.appendChild(marker);
    const card=document.createElement("button");
    card.type="button";card.className="event-card";card.dataset.card=e.key;
    card.style.left=left+"px";card.style.top=top+"px";
    const name=document.createElement("span");name.textContent=Studio.t(e.key);
    const year=document.createElement("span");year.textContent=e.year;
    card.append(name,year);
    card.addEventListener("click",()=>{
      if(card.disabled)return;
      document.querySelectorAll(".event-card").forEach(c=>{c.disabled=true});
      card.classList.add("chosen");marker.classList.add("chosen");
      Studio.event("event_tap",{key:e.key,year:e.year});
      Studio.answer(e.key);
    });
    rows.appendChild(card);
  });
  const feedback=document.getElementById("feedback");
  Studio.onVerdict(v=>{
    feedback.textContent=Studio.t(v.correct?"done":"wrong");
    feedback.classList.add("show");
    if(v.correct){
      Studio.event("complete",{});
      Studio.done();
    }else{
      document.querySelectorAll(".event-card").forEach(c=>{c.disabled=false;c.classList.remove("chosen")});
      document.querySelectorAll(".marker").forEach(m=>m.classList.remove("chosen"));
    }
  });
  Studio.ready();
})();

</script>
