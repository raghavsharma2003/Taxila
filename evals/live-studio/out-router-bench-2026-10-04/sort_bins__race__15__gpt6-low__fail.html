<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;background:#fff8ed;font-family:system-ui,sans-serif;color:#493b38}
  #game{position:relative;width:360px;height:320px;overflow:hidden;padding:12px;background:radial-gradient(circle at 95% 0%,#ffe4c7 0,transparent 43%),#fff8ed}
  #title{height:30px;font-size:21px;font-weight:800;letter-spacing:-.4px}
  #instr{height:29px;font-size:13px;color:#806b61}
  #cards{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:54px 54px;gap:9px;height:117px}
  .slot{height:54px}
  .card{width:100%;height:54px;border:2px solid #eac9a8;border-radius:17px;background:#fffdf8;color:#503d37;font:700 18px system-ui,sans-serif;box-shadow:0 4px 0 #e9d6c3,0 7px 14px #805c3820;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}
  .card:active{transform:scale(.96)}
  .card[data-selected="true"]{transform:translateY(-6px) scale(1.035);border-color:#ec8d62;box-shadow:0 8px 0 #edc5a4,0 12px 20px #d8775150}
  .card.shake{animation:shake .4s ease-in-out}
  @keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
  #bins{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px;height:96px}
  .bin{min-width:0;height:96px;border:2px solid #d9ad8b;border-radius:18px;background:#f8e5d1;cursor:pointer;padding:7px 4px;box-shadow:inset 0 -5px #efd0b4;transition:transform .18s,background .18s}
  .bin:active{transform:scale(.96)}
  .bin.bloom{animation:bloom .45s ease}
  @keyframes bloom{50%{transform:scale(1.05);background:#ffe9be}}
  .bin-name{display:block;text-align:center;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .inside{display:flex;flex-direction:column;align-items:stretch;gap:2px;margin-top:4px}
  .placed{height:16px;line-height:16px;border-radius:8px;background:#fffaf1;text-align:center;font-size:11px;font-weight:700;overflow:hidden;white-space:nowrap}
  #feedback{height:28px;padding-top:5px;text-align:center;font-size:14px;font-weight:700;color:#a45b46}
  .fly{position:absolute;z-index:5;pointer-events:none;margin:0}
  svg{position:absolute;right:13px;top:12px;width:34px;height:34px;pointer-events:none}
</style>
<div id="game">
  <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3c3 7 6 10 14 11-7 3-10 6-11 14-3-7-6-10-14-11 7-3 10-6 11-14Z" fill="#f3ae72"/><circle cx="32" cy="30" r="3" fill="#e6a887"/></svg>
  <div id="title"></div>
  <div id="instr"></div>
  <div id="cards"></div>
  <div id="bins"></div>
  <div id="feedback" aria-live="polite"></div>
</div>
<script>

(()=>{
  const p=Studio.params, game=document.getElementById('game'), cards=document.getElementById('cards'), bins=document.getElementById('bins'), feedback=document.getElementById('feedback');
  document.getElementById('title').textContent=Studio.t('title');
  document.getElementById('instr').textContent=Studio.t('instr');
  let selected=null,pending=null,busy=false,remaining=p.cards.length;
  const binMap=new Map();
  p.bins.forEach(key=>{
    const bin=document.createElement('div');
    bin.className='bin';bin.dataset.bin=key;
    const name=document.createElement('span');name.className='bin-name';name.textContent=Studio.t(key);
    const inside=document.createElement('div');inside.className='inside';
    bin.append(name,inside);bins.append(bin);binMap.set(key,bin);
    bin.addEventListener('click',()=>{
      if(!selected||busy)return;
      busy=true;pending={card:selected,bin:key};
      Studio.event('sort_try',{card:selected.dataset.card,bin:key});
      Studio.answer({card:selected.dataset.card,bin:key});
    });
  });
  p.cards.forEach(key=>{
    const slot=document.createElement('div');slot.className='slot';
    const card=document.createElement('button');card.type='button';card.className='card';
    card.dataset.card=key;card.dataset.selected='false';card.textContent=Studio.t(key);
    card.addEventListener('click',()=>{
      if(busy)return;
      if(selected)selected.dataset.selected='false';
      selected=selected===card?null:card;
      if(selected)selected.dataset.selected='true';
      feedback.textContent='';
      Studio.event('pick',{card:key});
    });
    slot.append(card);cards.append(slot);
  });
  Studio.onVerdict(({correct})=>{
    if(!pending)return;
    const {card,bin}=pending;pending=null;
    card.dataset.selected='false';selected=null;
    if(!correct){
      feedback.textContent=Studio.t('wrong');
      card.classList.add('shake');
      setTimeout(()=>{card.classList.remove('shake');busy=false},420);
      return;
    }
    feedback.textContent=Studio.t('right');
    const target=binMap.get(bin), start=card.getBoundingClientRect(), end=target.querySelector('.inside').getBoundingClientRect();
    const ghost=card.cloneNode(true), base=game.getBoundingClientRect();
    ghost.className='card fly';ghost.removeAttribute('data-card');ghost.removeAttribute('data-selected');
    ghost.style.left=(start.left-base.left)+'px';ghost.style.top=(start.top-base.top)+'px';
    ghost.style.width=start.width+'px';ghost.style.height=start.height+'px';
    game.append(ghost);card.remove();
    const placed=document.createElement('span');placed.className='placed';placed.dataset.placed=bin;placed.textContent=card.textContent;
    target.querySelector('.inside').append(placed);target.classList.add('bloom');
    ghost.animate([
      {transform:'translate(0,0) scale(1)',opacity:1},
      {transform:`translate(${end.left-start.left+8}px,${end.top-start.top+4}px) scale(.48)`,opacity:0}
    ],{duration:430,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>{ghost.remove();target.classList.remove('bloom');busy=false;remaining--;if(!remaining){feedback.textContent=Studio.t('done');Studio.done()}};
  });
  Studio.ready();
})();

</script>
