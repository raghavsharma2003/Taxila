<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;background:#fff8ed;font-family:system-ui,sans-serif;color:#493b39}
  .card{width:360px;height:320px;padding:7px 12px;background:radial-gradient(circle at 93% 4%,#ffe5c2 0 42px,transparent 43px),#fff8ed;overflow:hidden}
  h1{height:26px;margin:0;font-size:19px;line-height:26px;font-weight:800}
  #prompt{height:29px;line-height:29px;font-size:15px;font-weight:650;white-space:nowrap}
  .key{height:32px;display:flex;align-items:center;gap:7px;font-size:14px}
  .key-badge{height:29px;padding:2px 10px;display:flex;align-items:center;gap:6px;border-radius:15px;background:#ffebd7}
  .flower{width:24px;height:24px;flex:none;overflow:visible}
  .flower .petal{fill:#f4a34d}.flower .middle{fill:#8c584e}
  #rows{display:flex;flex-direction:column;gap:2px;margin-top:2px}
  .row{width:336px;min-height:52px;height:52px;border:2px solid #e9d9c8;border-radius:16px;background:#fffdf8;display:flex;align-items:center;padding:0 9px;cursor:pointer;transition:transform .18s,background .18s,border-color .18s}
  .row:active{transform:scale(.97)}
  .row:focus-visible{outline:3px solid #a76864;outline-offset:-3px}
  .label{width:61px;flex:none;font-size:16px;font-weight:750}
  .symbols{display:flex;align-items:center;gap:7px;min-width:0}
  .row.pulse{animation:pop .42s ease}
  .row.good{background:#e8f4df;border-color:#91b779}
  .row.again{background:#fff0e7;border-color:#dfad96}
  @keyframes pop{50%{transform:scale(1.025)}}
</style>
<div class="card">
  <h1 id="title"></h1>
  <div id="prompt" aria-live="polite"></div>
  <div class="key" data-key><span class="key-badge"><span id="key-symbol"></span><span id="key-number"></span></span><span id="key-text"></span></div>
  <div id="rows"></div>
</div>
<script>

(()=>{
  const p=Studio.params, rows=document.getElementById('rows'), prompt=document.getElementById('prompt');
  const flower=()=>'<svg class="flower" data-symbol viewBox="0 0 24 24" aria-hidden="true"><circle class="petal" cx="12" cy="5" r="4"/><circle class="petal" cx="19" cy="10" r="4"/><circle class="petal" cx="16.5" cy="18" r="4"/><circle class="petal" cx="7.5" cy="18" r="4"/><circle class="petal" cx="5" cy="10" r="4"/><circle class="middle" cx="12" cy="12" r="3.5"/></svg>';
  document.getElementById('title').textContent=Studio.t('title');
  prompt.textContent=Studio.t('ask');
  document.getElementById('key-symbol').innerHTML=flower();
  document.getElementById('key-number').textContent=p.symbolValue;
  document.getElementById('key-text').textContent=Studio.t('keytext');
  let waiting=false, finished=false;
  p.rows.forEach(item=>{
    const row=document.createElement('div');
    row.className='row';
    row.dataset.row=item.key;
    row.setAttribute('role','button');
    row.tabIndex=0;
    const label=document.createElement('span');
    label.className='label';
    label.textContent=Studio.t(item.key);
    const symbols=document.createElement('span');
    symbols.className='symbols';
    symbols.innerHTML=flower().repeat(item.value/p.symbolValue);
    row.append(label,symbols);
    const choose=()=>{
      if(waiting||finished)return;
      waiting=true;
      row.classList.remove('pulse','again');
      void row.offsetWidth;
      row.classList.add('pulse');
      Studio.answer(item.key);
    };
    row.addEventListener('click',choose);
    row.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}});
    rows.appendChild(row);
  });
  Studio.onVerdict(({correct})=>{
    waiting=false;
    const active=rows.querySelector('.pulse');
    if(correct){
      finished=true;
      if(active)active.classList.add('good');
      prompt.textContent=Studio.t('done');
      Studio.done();
    }else{
      if(active)active.classList.add('again');
      prompt.textContent=Studio.t('wrong');
    }
  });
  Studio.ready();
})();

</script>
