<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;font-family:system-ui,sans-serif;background:#fff8ed;color:#63442f}
  #app{position:relative;width:360px;height:320px;padding:10px 16px;overflow:hidden;background:radial-gradient(circle at 92% 8%,#ffe6b8,transparent 34%),#fff8ed}
  header{height:43px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  h1{margin:0;font-size:20px;line-height:1.1;color:#874b35}
  #target{min-width:64px;padding:5px 11px;border:2px solid #e9ba80;border-radius:16px;background:#fff;text-align:center;font-size:23px;font-weight:800;color:#a04d35}
  #instruction{height:20px;text-align:center;font-size:14px}
  #item{height:184px;display:flex;align-items:center;justify-content:center}
  svg{width:320px;height:181px}
  .part{cursor:pointer;stroke:#fff8ed;stroke-width:3;transition:fill .2s ease,filter .2s ease,transform .2s ease;transform-origin:center}
  .part:active{filter:brightness(1.1);transform:scale(.97)}
  .part[data-shaded="false"]{fill:#f5cf93}
  .part[data-shaded="true"]{fill:#dc7660}
  #bottom{position:absolute;left:16px;right:16px;bottom:12px;height:52px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  #feedback{flex:1;min-width:0;font-size:15px;font-weight:700;color:#a15746}
  button{border:0;border-radius:18px;background:#8d5847;color:white;font:700 17px system-ui,sans-serif;min-width:112px;height:52px;padding:8px 18px;cursor:pointer;box-shadow:0 4px 0 #694032;transition:transform .15s,box-shadow .15s}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #694032}
  button:disabled{opacity:.65}
  .celebrate svg{animation:joy .45s ease-in-out}
  @keyframes joy{50%{transform:rotate(5deg) scale(1.055)}}
  #finished{display:none;height:300px;align-items:center;justify-content:center;text-align:center;font-size:27px;font-weight:800;color:#9d5942}
  #app.complete header,#app.complete #instruction,#app.complete #item,#app.complete #bottom{display:none}
  #app.complete #finished{display:flex}
</style>
<div id="app">
  <header><h1 id="title"></h1><div id="target" data-target></div></header>
  <div id="instruction"></div>
  <div id="item" data-item="">
    <svg viewBox="0 0 320 181" aria-hidden="true">
      <circle id="backOuter" cx="160" cy="91" r="86" fill="#eac39b"/>
      <circle id="backInner" cx="160" cy="91" r="81" fill="#fff0d7"/>
      <g id="parts"></g>
    </svg>
  </div>
  <div id="bottom"><div id="feedback" aria-live="polite"></div><button type="button" data-action="check" id="check"></button></div>
  <div id="finished"></div>
</div>
<script>

(()=>{
  const app=document.getElementById('app');
  const holder=document.getElementById('item');
  const group=document.getElementById('parts');
  const target=document.getElementById('target');
  const feedback=document.getElementById('feedback');
  const check=document.getElementById('check');
  const svgNS='http://www.w3.org/2000/svg';
  let index=0,locked=false;
  document.getElementById('title').textContent=Studio.t('title');
  document.getElementById('instruction').textContent=Studio.t('instr');
  check.textContent=Studio.t('check');
  document.getElementById('finished').textContent=Studio.t('done');
  function render(){
    const item=Studio.params.items[index];
    holder.dataset.item=item.id;
    target.textContent=item.n+'/'+item.d;
    feedback.textContent='';
    group.replaceChildren();
    const pizza=Studio.params.picture==='pizza';
    document.getElementById('backOuter').style.display=pizza?'':'none';
    document.getElementById('backInner').style.display=pizza?'':'none';
    for(let i=0;i<item.d;i++){
      const shape=document.createElementNS(svgNS,'path');
      if(pizza){
        const a=-Math.PI/2+2*Math.PI*i/item.d;
        const b=-Math.PI/2+2*Math.PI*(i+1)/item.d;
        const x1=160+77*Math.cos(a),y1=91+77*Math.sin(a);
        const x2=160+77*Math.cos(b),y2=91+77*Math.sin(b);
        shape.setAttribute('d',`M 160 91 L ${x1} ${y1} A 77 77 0 ${b-a>Math.PI?1:0} 1 ${x2} ${y2} Z`);
      }else{
        const width=286/item.d,x=17+i*width;
        shape.setAttribute('d',`M ${x} 48 H ${x+width} V 134 H ${x} Z`);
      }
      shape.classList.add('part');
      shape.dataset.part=i;
      shape.dataset.shaded='false';
      shape.addEventListener('click',()=>{
        if(locked)return;
        shape.dataset.shaded=shape.dataset.shaded==='true'?'false':'true';
        feedback.textContent='';
        Studio.event('part',{index:i});
      });
      group.appendChild(shape);
    }
  }
  check.addEventListener('click',()=>{
    if(locked)return;
    locked=true;
    check.disabled=true;
    const item=Studio.params.items[index];
    const n=group.querySelectorAll('[data-shaded="true"]').length;
    Studio.event('check',{n,d:item.d});
    Studio.answer({n,d:item.d});
  });
  Studio.onVerdict(({correct})=>{
    feedback.textContent=Studio.t(correct?'right':'wrong');
    if(correct){
      app.classList.add('celebrate');
      setTimeout(()=>{
        app.classList.remove('celebrate');
        index++;
        if(index>=Studio.params.items.length){
          app.classList.add('complete');
          Studio.done();
        }else{
          render();
          locked=false;
          check.disabled=false;
        }
      },850);
    }else{
      locked=false;
      check.disabled=false;
    }
  });
  render();
  Studio.ready();
})();

</script>
