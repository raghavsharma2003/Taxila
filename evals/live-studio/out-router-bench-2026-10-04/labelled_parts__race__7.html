<style>
*{box-sizing:border-box}
html,body{margin:0;width:360px;height:320px;overflow:hidden}
body{font-family:system-ui,sans-serif;color:#36554a;background:#fff8e9}
.stage{width:360px;height:320px;padding:10px 12px;display:flex;flex-direction:column;align-items:center}
h1{font-size:18px;line-height:22px;margin:0;color:#39785d;font-weight:750}
.ask{width:100%;min-height:48px;margin:6px 0 1px;padding:7px 10px;border-radius:14px;background:#f1e7ce;text-align:center;font-size:15px;line-height:20px;font-weight:650}
svg{display:block;width:336px;height:216px;overflow:visible}
.label{font:600 12px system-ui,sans-serif;fill:#486257}
.leader{stroke:#829487;stroke-width:1.5;stroke-linecap:round}
.part{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:filter .22s,transform .16s}
.hit{fill:transparent;pointer-events:all}
.part:active{transform:scale(.94)}
.part.correct{filter:drop-shadow(0 0 7px #f7c947);animation:glow .7s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 2px #f7c947)}to{filter:drop-shadow(0 0 10px #f7c947)}}
.feedback{height:22px;margin-top:-2px;font-size:14px;font-weight:700;color:#39785d;text-align:center}
.feedback.wrong{color:#a45d47}
</style>
<div class="stage">
  <h1 id="title"></h1>
  <div class="ask" id="ask" data-ask></div>
  <svg viewBox="0 0 336 216" role="img" aria-label="">
    <g class="part" data-part="petal" tabindex="0" role="button" aria-label="">
      <rect class="hit" x="134" y="17" width="68" height="58"/>
      <ellipse cx="168" cy="46" rx="34" ry="25" fill="#ee9d9a" stroke="#d77a7d" stroke-width="2"/>
    </g>
    <g class="part" data-part="centre" tabindex="0" role="button" aria-label="">
      <rect class="hit" x="139" y="44" width="58" height="58"/>
      <circle cx="168" cy="73" r="25" fill="#f4c952" stroke="#d5a832" stroke-width="2"/>
    </g>
    <g class="part" data-part="stem" tabindex="0" role="button" aria-label="">
      <rect class="hit" x="140" y="88" width="56" height="72"/>
      <rect x="143" y="89" width="50" height="70" rx="18" fill="#6ba66b" stroke="#4d8955" stroke-width="2"/>
    </g>
    <g class="part" data-part="leaf" tabindex="0" role="button" aria-label="">
      <rect class="hit" x="72" y="98" width="66" height="56"/>
      <ellipse cx="105" cy="126" rx="33" ry="21" transform="rotate(-25 105 126)" fill="#8bbf77" stroke="#629b60" stroke-width="2"/>
    </g>
    <g class="part" data-part="root" tabindex="0" role="button" aria-label="">
      <rect class="hit" x="140" y="150" width="56" height="60"/>
      <path d="M143 157 Q168 149 193 157 L191 171 Q181 178 183 198 L174 205 L168 181 L160 205 L151 198 Q153 178 143 171Z" fill="#bd8960" stroke="#986b4a" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <path class="leader" d="M202 39 L225 34 M193 73 L225 73 M193 112 L225 112 M76 126 L51 126 M192 174 L225 181"/>
    <text class="label" data-label="petal" x="229" y="38"></text>
    <text class="label" data-label="centre" x="229" y="77"></text>
    <text class="label" data-label="stem" x="229" y="116"></text>
    <text class="label" data-label="leaf" x="8" y="130"></text>
    <text class="label" data-label="root" x="229" y="185"></text>
  </svg>
  <div class="feedback" id="feedback" aria-live="polite"></div>
</div>
<script>

(()=>{
  const parts=Studio.params.parts;
  document.getElementById('title').textContent=Studio.t('title');
  document.getElementById('ask').textContent=Studio.t('ask');
  const feedback=document.getElementById('feedback');
  document.querySelectorAll('[data-label]').forEach(el=>{
    el.textContent=Studio.t(el.getAttribute('data-label'));
  });
  const targets=[...document.querySelectorAll('[data-part]')];
  targets.forEach(el=>el.setAttribute('aria-label',Studio.t(el.getAttribute('data-part'))));
  Studio.ready();
  let locked=false;
  function choose(key,el){
    if(locked||!parts.includes(key))return;
    el.style.transform='scale(.96)';
    setTimeout(()=>{el.style.transform='';},140);
    Studio.event('tap',{part:key});
    Studio.answer(key);
  }
  targets.forEach(el=>{
    el.addEventListener('click',()=>choose(el.getAttribute('data-part'),el));
    el.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(el.getAttribute('data-part'),el);}
    });
  });
  Studio.onVerdict(({correct})=>{
    feedback.textContent=Studio.t(correct?'right':'wrong');
    feedback.classList.toggle('wrong',!correct);
    if(correct){
      locked=true;
      const found=targets.find(el=>el.getAttribute('data-part')===Studio.params.ask);
      if(found)found.classList.add('correct');
      feedback.textContent=Studio.t('done');
      Studio.done();
    }
  });
})();

</script>
