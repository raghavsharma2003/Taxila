<style>
  *{box-sizing:border-box}
  body{margin:0}
  #card{width:360px;height:320px;overflow:hidden;padding:10px 14px;background:#fff7e9;color:#573b36;font-family:system-ui,sans-serif;display:flex;flex-direction:column;gap:4px}
  #title{height:28px;font-size:20px;font-weight:800;line-height:28px}
  #ask{height:26px;font-size:15px;font-weight:650;line-height:26px}
  #key{height:34px;display:flex;align-items:center;gap:7px;padding:2px 10px;border-radius:13px;background:#fce8d4;align-self:flex-start;font-size:14px}
  #rows{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px}
  .row{flex:1;min-height:52px;width:100%;border:2px solid #ebd6bf;border-radius:16px;background:#fffdf8;display:flex;align-items:center;padding:0 10px;cursor:pointer;transition:transform .18s,background .18s,border-color .18s;touch-action:manipulation}
  .row:active{transform:scale(.97)}
  .row:focus-visible{outline:3px solid #a96553;outline-offset:-3px}
  .name{width:72px;flex:none;font-size:16px;font-weight:750}
  .symbols{display:flex;align-items:center;gap:3px;flex:1}
  .symbol{width:var(--unit);height:var(--unit);flex:none;display:block}
  .row.selected{border-color:#c87960;background:#fff0df;transform:scale(.985)}
  .row.correct{border-color:#75a68b;background:#eaf5e7}
  #message{height:24px;line-height:24px;font-size:14px;font-weight:750;color:#8a5548}
  #message.good{color:#437c60}
  @media(prefers-reduced-motion:no-preference){.row.correct .symbol{animation:bob .45s ease-in-out alternate 2}@keyframes bob{to{transform:translateY(-4px) rotate(8deg)}}}
</style>
<div id="card">
  <div id="title"></div>
  <div id="ask"></div>
  <div id="key" data-key></div>
  <div id="rows"></div>
  <div id="message" aria-live="polite"></div>
</div>
<script>

(() => {
  const p=Studio.params;
  const title=document.getElementById('title'), ask=document.getElementById('ask');
  const key=document.getElementById('key'), rows=document.getElementById('rows'), message=document.getElementById('message');
  title.textContent=Studio.t('title');
  ask.textContent=Studio.t('ask');
  const counts=p.rows.map(r=>r.value/p.symbolValue);
  const unit=Math.min(30,Math.max(8,(224-3*Math.max(...counts,1))/Math.max(...counts,1)));
  document.getElementById('card').style.setProperty('--unit',unit+'px');
  function symbol(){
    const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('viewBox','0 0 32 32');s.setAttribute('class','symbol');s.setAttribute('data-symbol','');
    s.innerHTML='<path d="M16 27C12 23 4 18 4 11a6 6 0 0 1 11-3 6 6 0 0 1 11 3c0 7-8 12-10 16Z" fill="#e89073" stroke="#ac6656" stroke-width="1.5"/><circle cx="11" cy="12" r="2" fill="#fff0dd"/>';
    return s;
  }
  key.append(symbol());
  const keyWords=document.createElement('span');
  keyWords.textContent=Studio.t('keytext')+' = '+p.symbolValue;
  key.append(keyWords);
  let pending=false, finished=false, chosen=null;
  p.rows.forEach((r,i)=>{
    const row=document.createElement('button');
    row.type='button';row.className='row';row.setAttribute('data-row',r.key);
    const name=document.createElement('span');name.className='name';name.textContent=Studio.t(r.key);
    const icons=document.createElement('span');icons.className='symbols';
    for(let j=0;j<counts[i];j++)icons.append(symbol());
    row.append(name,icons);rows.append(row);
    row.addEventListener('click',()=>{
      if(pending||finished)return;
      pending=true;chosen=row;row.classList.add('selected');
      Studio.event('row_tap',{row:r.key});
      Studio.answer(r.key);
    });
  });
  Studio.onVerdict(({correct})=>{
    if(!pending)return;
    pending=false;
    chosen.classList.remove('selected');
    if(correct){
      finished=true;chosen.classList.add('correct');
      message.classList.add('good');
      message.textContent=Studio.t('right')+' '+Studio.t('done');
      Studio.done();
    }else{
      message.textContent=Studio.t('wrong');
    }
  });
  Studio.ready();
})();

</script>
