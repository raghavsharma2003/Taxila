<style>
*{box-sizing:border-box}html,body{margin:0;width:360px;height:320px;overflow:hidden;font-family:system-ui,sans-serif;color:#38545a}#app{position:relative;width:360px;height:320px;overflow:hidden;background:linear-gradient(180deg,#fff9ec,#fff2db);border-radius:18px;padding:10px 14px}.heading{height:48px;text-align:center}.title{font-size:17px;font-weight:800;line-height:21px;color:#34545a}.instr{font-size:12px;line-height:17px;color:#71837e}.scene{position:relative;height:166px}.balance{position:absolute;inset:0;width:100%;height:166px;overflow:visible}.beam{transform-box:fill-box;transform-origin:50% 50%;transition:transform .65s cubic-bezier(.2,.8,.25,1)}.beam line{stroke:#e18b4c;stroke-width:10;stroke-linecap:round}.balance .stand{fill:#efb35f}.balance .pivot{fill:#d77945;stroke:#fff3dc;stroke-width:3}.pan{position:absolute;top:112px;width:112px;height:48px;border:3px solid #dc9b57;border-top:0;border-radius:0 0 26px 26px;background:#ffe6b7;display:flex;align-items:flex-end;justify-content:center;padding:2px 5px 4px;gap:3px;transition:transform .65s cubic-bezier(.2,.8,.25,1)}.pan:before{content:"";position:absolute;left:50%;top:-24px;width:2px;height:25px;background:#c88f55}.pan.left{left:12px}.pan.right{right:12px}.weights{display:flex;align-items:flex-end;justify-content:center;gap:3px;width:100%;height:100%}.weight{min-width:24px;height:29px;padding:3px 4px;border-radius:8px 8px 5px 5px;background:#69b5a5;color:white;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #428f83;line-height:1}.options{height:62px;display:flex;align-items:center;justify-content:center;gap:12px}.option{width:68px;height:58px;border:0;border-radius:15px;background:#f1c36e;color:#654b26;font:800 18px system-ui;box-shadow:0 4px 0 #d7a24d;cursor:pointer;transition:transform .15s,background .2s,opacity .2s}.option:active{transform:scale(.92)}.option:disabled{opacity:.38;cursor:default}.option .weight{margin:auto;width:31px;height:34px;background:#69b5a5;box-shadow:0 3px 0 #428f83;color:white}.feedback{position:absolute;left:14px;right:14px;bottom:8px;height:28px;text-align:center;font-size:15px;font-weight:800;color:#528b76;opacity:0;transition:opacity .2s}.feedback.show{opacity:1}.celebrate{animation:pop .48s ease-in-out 2}@keyframes pop{50%{transform:scale(1.06)}}.done{position:absolute;inset:0;background:#fff5df;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:22px;font-weight:800;color:#528b76;opacity:0;pointer-events:none;transition:opacity .35s}.done.show{opacity:1;pointer-events:auto}
</style>
<div id="app">
  <header class="heading"><div class="title"></div><div class="instr"></div></header>
  <div class="scene">
    <svg class="balance" viewBox="0 0 332 166" aria-hidden="true">
      <path class="stand" d="M151 151 L166 73 L181 151 Z"></path>
      <g class="beam" data-beam data-tilt="level"><line x1="39" y1="73" x2="293" y2="73"></line></g>
      <circle class="pivot" cx="166" cy="73" r="11"></circle>
    </svg>
    <div class="pan left" data-pan="left" data-total="0"><div class="weights"></div></div>
    <div class="pan right" data-pan="right" data-total="0"><div class="weights"></div></div>
  </div>
  <div class="options"></div>
  <div class="feedback"></div>
  <div class="done"></div>
</div>
<script>

(()=>{const items=Studio.params.items,app=document.getElementById('app'),beam=app.querySelector('[data-beam]'),left=app.querySelector('[data-pan="left"]'),right=app.querySelector('[data-pan="right"]'),choices=app.querySelector('.options'),feedback=app.querySelector('.feedback'),done=app.querySelector('.done');app.querySelector('.title').textContent=Studio.t('title');app.querySelector('.instr').textContent=Studio.t('instr');let index=0,locked=false,chosen=null;function weight(v){const el=document.createElement('span');el.className='weight';el.dataset.weight=String(v);el.textContent=String(v);return el}function fillPan(p,values){const box=p.querySelector('.weights');box.replaceChildren(...values.map(weight));p.dataset.total=String(values.reduce((a,b)=>a+b,0))}function tilt(l,r){const side=l>r?'left':r>l?'right':'level';beam.dataset.tilt=side;beam.style.transform='rotate('+(side==='left'?'6':side==='right'?'-6':'0')+'deg)'}function render(){const item=items[index];fillPan(left,item.left);fillPan(right,item.right);tilt(item.left.reduce((a,b)=>a+b,0),item.right.reduce((a,b)=>a+b,0));choices.replaceChildren(...item.options.map(v=>{const b=document.createElement('button');b.className='option';b.dataset.option=String(v);b.append(weight(v));b.addEventListener('click',()=>pick(v,b));return b}));feedback.classList.remove('show');feedback.textContent='';locked=false;chosen=null}function pick(v,button){if(locked)return;locked=true;chosen={v,button};button.disabled=true;right.querySelector('.weights').append(weight(v));const item=items[index],l=item.left.reduce((a,b)=>a+b,0),r=item.right.reduce((a,b)=>a+b,0)+v;right.dataset.total=String(r);tilt(l,r);Studio.event('choose',{value:v});Studio.answer({value:v})}Studio.onVerdict(({correct})=>{if(!chosen)return;feedback.textContent=Studio.t(correct?'right':'wrong');feedback.classList.add('show');if(!correct){setTimeout(()=>{if(!chosen)return;const v=chosen.v;const w=[...right.querySelectorAll('[data-weight]')].find(x=>x.textContent===String(v));if(w)w.remove();const item=items[index];right.dataset.total=String(item.right.reduce((a,b)=>a+b,0));tilt(item.left.reduce((a,b)=>a+b,0),Number(right.dataset.total));chosen.button.disabled=false;locked=false;chosen=null;feedback.classList.remove('show')},900);return}app.classList.add('celebrate');tilt(Number(left.dataset.total),Number(left.dataset.total));setTimeout(()=>{app.classList.remove('celebrate');chosen=null;index++;if(index<items.length)render();else{done.textContent=Studio.t('done');done.classList.add('show');Studio.done()}},850)});render();Studio.ready()})();

</script>
