<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;background:#fff8ed;font-family:system-ui,sans-serif;color:#51372e}
  #activity{position:relative;width:360px;height:320px;overflow:hidden;background:radial-gradient(circle at 90% 5%,#ffe2ba,transparent 42%),#fff8ed}
  #title{position:absolute;top:13px;left:18px;right:18px;margin:0;font-size:21px;font-weight:800}
  #instr{position:absolute;top:47px;left:18px;right:112px;margin:0;font-size:14px;line-height:19px}
  [data-target]{position:absolute;top:43px;right:18px;min-width:75px;padding:5px 10px;border-radius:16px;background:#fff;border:2px solid #efbd85;text-align:center;font-size:21px;font-weight:800;color:#a54e34}
  #picture{position:absolute;left:40px;top:82px;width:280px;height:174px;overflow:visible}
  [data-part]{fill:#f9d89e;stroke:#a95f42;stroke-width:3;cursor:pointer;transition:fill .22s,filter .22s,transform .22s;transform-box:fill-box;transform-origin:center}
  [data-part="0"]{} 
  [data-shaded="true"]{fill:#e97652;filter:drop-shadow(0 2px 2px #a95f4255)}
  [data-part]:active{transform:scale(.94)}
  #status{position:absolute;top:75px;left:18px;right:18px;height:22px;text-align:center;font-size:15px;font-weight:750;color:#a54e34;pointer-events:none}
  #check{position:absolute;left:91px;top:259px;width:178px;height:54px;border:0;border-radius:19px;background:#3f947e;color:white;font:800 19px system-ui,sans-serif;box-shadow:0 5px 0 #26745f;cursor:pointer;transition:transform .15s,background .2s}
  #check:active{transform:translateY(4px) scale(.97)}
  #check:disabled{opacity:.7;cursor:default}
  .celebrate #picture{animation:bounce .55s ease}
  .celebrate #status{animation:pop .55s ease}
  .try-again #status{animation:pop .4s ease}
  @keyframes bounce{50%{transform:translateY(-8px) scale(1.04)}}
  @keyframes pop{50%{transform:scale(1.15)}}
  #finished{display:none;position:absolute;inset:0;place-items:center;text-align:center;padding:24px;font-size:29px;font-weight:800;color:#a54e34}
  .complete #finished{display:grid}
  .complete #title,.complete #instr,.complete [data-target],.complete #picture,.complete #status,.complete #check{display:none}
</style>
<div id="activity" data-item="">
  <h1 id="title"></h1>
  <p id="instr"></p>
  <div data-target></div>
  <svg id="picture" viewBox="0 0 280 174" aria-hidden="true"></svg>
  <div id="status" aria-live="polite"></div>
  <button id="check" data-action="check" type="button"></button>
  <div id="finished"></div>
</div>
<script>

(()=>{
  const p=Studio.params, root=document.getElementById('activity');
  const svg=document.getElementById('picture'), status=document.getElementById('status');
  const check=document.getElementById('check'), target=root.querySelector('[data-target]');
  let index=0, waiting=false, finished=false;
  document.getElementById('title').textContent=Studio.t('title');
  document.getElementById('instr').textContent=Studio.t('instr');
  document.getElementById('finished').textContent=Studio.t('done');
  check.textContent=Studio.t('check');
  function render(){
    const item=p.items[index];
    root.dataset.item=item.id;
    target.textContent=item.n+'/'+item.d;
    status.textContent='';
    root.classList.remove('celebrate','try-again');
    svg.replaceChildren();
    for(let i=0;i<item.d;i++){
      let shape;
      if(p.picture==='pizza'){
        const cx=140,cy=87,r=76,a=-Math.PI/2+i*2*Math.PI/item.d,b=-Math.PI/2+(i+1)*2*Math.PI/item.d;
        shape=document.createElementNS('http://www.w3.org/2000/svg','path');
        if(item.d===1){
          shape.setAttribute('d',`M ${cx-r} ${cy} a ${r} ${r} 0 1 0 ${2*r} 0 a ${r} ${r} 0 1 0 ${-2*r} 0`);
        }else{
          shape.setAttribute('d',`M ${cx} ${cy} L ${cx+r*Math.cos(a)} ${cy+r*Math.sin(a)} A ${r} ${r} 0 ${b-a>Math.PI?1:0} 1 ${cx+r*Math.cos(b)} ${cy+r*Math.sin(b)} Z`);
        }
      }else{
        shape=document.createElementNS('http://www.w3.org/2000/svg','rect');
        const w=270/item.d;
        shape.setAttribute('x',5+i*w);
        shape.setAttribute('y',37);
        shape.setAttribute('width',w);
        shape.setAttribute('height',100);
        shape.setAttribute('rx',Math.min(9,w/5));
      }
      shape.setAttribute('data-part',i);
      shape.setAttribute('data-shaded','false');
      shape.addEventListener('click',()=>{
        if(waiting)return;
        shape.dataset.shaded=shape.dataset.shaded==='true'?'false':'true';
        status.textContent='';
        root.classList.remove('try-again');
        Studio.event('part',{index:i,shaded:shape.dataset.shaded});
      });
      svg.appendChild(shape);
    }
  }
  check.addEventListener('click',()=>{
    if(waiting||finished)return;
    waiting=true;check.disabled=true;
    const item=p.items[index];
    const n=svg.querySelectorAll('[data-shaded="true"]').length;
    Studio.event('check',{n:n,d:item.d});
    Studio.answer({n:n,d:item.d});
  });
  Studio.onVerdict(({correct})=>{
    if(!waiting||finished)return;
    status.textContent=Studio.t(correct?'right':'wrong');
    root.classList.remove('celebrate','try-again');
    void root.offsetWidth;
    root.classList.add(correct?'celebrate':'try-again');
    if(correct){
      setTimeout(()=>{
        index++;
        if(index>=p.items.length){
          finished=true;
          root.classList.add('complete');
          Studio.done();
        }else{
          waiting=false;check.disabled=false;render();
        }
      },650);
    }else{
      waiting=false;check.disabled=false;
    }
  });
  render();
  Studio.ready();
})();

</script>
