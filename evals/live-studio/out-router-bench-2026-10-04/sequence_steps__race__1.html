<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;background:#fff7e8;font-family:Arial,sans-serif;color:#563d31}
  #app{width:360px;height:320px;position:relative;overflow:hidden;background:
    radial-gradient(circle at 18% 10%,#ffe1a9 0 18px,transparent 19px),
    radial-gradient(circle at 89% 17%,#ffd1a8 0 12px,transparent 13px),
    linear-gradient(180deg,#fff4dc 0%,#fffaf0 100%)}
  .top{height:69px;padding:13px 18px 6px;position:relative;z-index:2}
  h1{margin:0;color:#9a563d;font-size:21px;line-height:24px;font-weight:800;letter-spacing:.1px}
  .instruction{margin:4px 0 0;font-size:13px;line-height:16px;color:#765c4b;font-weight:700}
  .sun{position:absolute;right:15px;top:12px;width:37px;height:37px;border-radius:50%;background:#ffc95d;box-shadow:0 0 0 5px #fff0c9;animation:bob 2.8s ease-in-out infinite}
  .sun:before,.sun:after{content:"";position:absolute;background:#f5a646;border-radius:5px}
  .sun:before{width:5px;height:11px;left:16px;top:-12px;box-shadow:0 50px #f5a646}
  .sun:after{width:11px;height:5px;top:16px;left:-12px;box-shadow:50px 0 #f5a646}
  .track{height:105px;padding:8px 14px 10px;display:flex;gap:7px;position:relative}
  .slot{flex:1;min-width:0;height:84px;border:2px dashed #d9ae84;border-radius:18px;background:#fffdf6;position:relative;display:flex;align-items:center;justify-content:center;transition:all .35s ease}
  .slotnum{position:absolute;top:6px;left:9px;width:20px;height:20px;border-radius:50%;background:#f6d7af;color:#8e6047;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
  .slot.filled{border-style:solid;border-color:#efb46d;background:#fff4dd}
  .slot .step{width:calc(100% - 12px);height:52px;margin-top:16px}
  .divider{height:2px;margin:0 18px;background:linear-gradient(90deg,transparent,#edc797,transparent)}
  #feedback{height:33px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#a76143;opacity:0;transform:translateY(-4px);transition:opacity .22s,transform .22s}
  #feedback.show{opacity:1;transform:translateY(0)}
  #cards{height:101px;padding:0 14px;display:flex;gap:7px;align-items:center;justify-content:center}
  .step{border:0;position:relative;overflow:hidden;min-width:52px;flex:1;height:72px;border-radius:17px;background:linear-gradient(145deg,#f6b867,#ee8c58);box-shadow:0 5px 0 #c96e4e,0 9px 15px rgba(144,74,48,.18);color:#fffdf5;font-size:15px;font-weight:800;line-height:18px;padding:7px 5px;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,opacity .25s ease}
  .step:before{content:"";position:absolute;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.17);top:-18px;right:-10px}
  .step:after{content:"";position:absolute;width:19px;height:19px;border-radius:50%;border:2px solid rgba(255,255,255,.35);bottom:-9px;left:10px}
  .step span{position:relative;z-index:1;display:block}
  .step:not(:disabled):active{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 #c96e4e,0 3px 7px rgba(144,74,48,.16)}
  .step.pending{transform:scale(.96);opacity:.7}
  .step.shake{animation:shake .46s ease}
  .slot .step{font-size:13px;box-shadow:0 3px 0 #c96e4e,0 5px 8px rgba(144,74,48,.13);cursor:default}
  .done{position:absolute;left:14px;right:14px;bottom:10px;height:53px;border-radius:18px;background:#dfeecb;color:#557243;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px 16px;font-size:15px;font-weight:800;opacity:0;transform:translateY(12px) scale(.96);pointer-events:none;transition:all .4s cubic-bezier(.2,.9,.25,1)}
  .done.show{opacity:1;transform:translateY(0) scale(1)}
  .done:before,.done:after{content:"✦";font-size:19px;color:#e7a548;margin:0 9px}
  @keyframes shake{0%,100%{transform:translateX(0)}22%{transform:translateX(-7px) rotate(-1deg)}48%{transform:translateX(7px) rotate(1deg)}72%{transform:translateX(-4px)}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(4px) rotate(4deg)}}
</style>
<div id="app">
  <div class="sun" aria-hidden="true"></div>
  <section class="top">
    <h1 id="title"></h1>
    <p class="instruction" id="instr"></p>
  </section>
  <section class="track" id="track"></section>
  <div class="divider"></div>
  <div id="feedback" aria-live="polite"></div>
  <section id="cards"></section>
  <div class="done" id="done" aria-live="polite"></div>
</div>
<script>

(function(){
  var shown=Studio.params.shown.slice();
  var order=shown.slice().sort();
  var next=0, pending=null, finished=false;
  var title=document.getElementById("title");
  var instr=document.getElementById("instr");
  var track=document.getElementById("track");
  var cards=document.getElementById("cards");
  var feedback=document.getElementById("feedback");
  var done=document.getElementById("done");

  title.textContent=Studio.t("title");
  instr.textContent=Studio.t("instr");

  shown.forEach(function(key,index){
    var slot=document.createElement("div");
    slot.className="slot";
    slot.setAttribute("data-slot",String(index+1));
    var num=document.createElement("div");
    num.className="slotnum";
    num.textContent=String(index+1);
    slot.appendChild(num);
    track.appendChild(slot);
  });

  function makeCard(key){
    var card=document.createElement("button");
    card.type="button";
    card.className="step";
    card.setAttribute("data-step",key);
    var label=document.createElement("span");
    label.textContent=Studio.t(key);
    card.appendChild(label);
    card.addEventListener("click",function(){
      if(pending||finished||card.disabled)return;
      pending=card;
      card.classList.add("pending");
      feedback.classList.remove("show");
      Studio.event("tap",{key:key});
      Studio.answer({key:key});
    });
    return card;
  }

  shown.forEach(function(key){cards.appendChild(makeCard(key));});

  Studio.onVerdict(function(result){
    if(!pending)return;
    var card=pending;
    pending=null;
    card.classList.remove("pending");
    if(result.correct){
      feedback.textContent=Studio.t("right");
      feedback.classList.add("show");
      var slot=track.children[next];
      card.disabled=true;
      card.setAttribute("data-placed",String(next+1));
      slot.classList.add("filled");
      slot.appendChild(card);
      next++;
      Studio.event("placed",{position:next});
      if(next===order.length){
        finished=true;
        setTimeout(function(){
          feedback.classList.remove("show");
          done.textContent=Studio.t("done");
          done.classList.add("show");
          Studio.done();
        },420);
      }
    }else{
      feedback.textContent=Studio.t("wrong");
      feedback.classList.add("show");
      card.classList.remove("shake");
      void card.offsetWidth;
      card.classList.add("shake");
      Studio.event("retry",{});
    }
  });
  Studio.ready();
}());

</script>
