<style>
  *{box-sizing:border-box}
  #sort-game{width:360px;height:320px;padding:10px;display:grid;grid-template-rows:48px 108px 108px 24px;gap:4px;overflow:hidden;background:#fff5e8;color:#493b35;font-family:system-ui,sans-serif}
  #title{font-size:21px;font-weight:800;line-height:27px}
  #instr{font-size:13px;line-height:18px;color:#766258}
  #cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:52px;gap:4px;align-content:start}
  .card{min-width:0;min-height:52px;border:2px solid #e7b991;border-radius:15px;background:#fffdfa;color:#493b35;font:700 14px system-ui,sans-serif;box-shadow:0 3px 0 #dfc2a7;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s;overflow:hidden;text-overflow:ellipsis}
  .card:active{transform:scale(.94)}
  .card[data-selected="true"]{transform:translateY(-5px) rotate(-2deg);background:#fff0bc;box-shadow:0 8px 15px #b57d4560,0 0 0 3px #f3c766}
  #bins{display:flex;gap:6px;min-width:0}
  .bin{flex:1;min-width:0;height:108px;padding:5px;border:2px solid #cba987;border-radius:16px;background:#f4dfc8;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .2s,background .2s}
  .bin:active{transform:scale(.96)}
  .bin.pulse{animation:pulse .4s ease}
  .bin-name{width:100%;min-height:25px;border-radius:10px;background:#fff7eb;text-align:center;padding:3px 2px;font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .placed-list{width:100%;display:flex;flex-wrap:wrap;justify-content:center;align-content:start;gap:3px;overflow:hidden}
  .placed{max-width:100%;padding:3px 6px;border-radius:8px;background:#fffdfa;border:1px solid #e7b991;font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;animation:arrive .38s ease-out both}
  #message{align-self:center;text-align:center;font-size:14px;font-weight:800;color:#795649}
  .shake{animation:shake .4s ease}
  @keyframes shake{25%,75%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
  @keyframes pulse{50%{transform:scale(1.04);background:#f9e9b7}}
  @keyframes arrive{from{opacity:0;transform:translateY(-20px) scale(.7)}to{opacity:1;transform:translateY(0) scale(1)}}
</style>
<div id="sort-game">
  <div id="heading"><div id="title"></div><div id="instr"></div></div>
  <div id="cards"></div>
  <div id="bins"></div>
  <div id="message" aria-live="polite"></div>
</div>
<script>

(() => {
  const p=Studio.params;
  const cards=document.getElementById('cards');
  const bins=document.getElementById('bins');
  const message=document.getElementById('message');
  document.getElementById('title').textContent=Studio.t('title');
  document.getElementById('instr').textContent=Studio.t('instr');

  let selected=null, pending=null, remaining=p.cards.length, finished=false;

  Studio.onVerdict(({correct})=>{
    if(!pending || finished)return;
    const {card,bin,list,key}=pending;
    pending=null;
    if(correct){
      const placed=document.createElement('div');
      placed.className='placed';
      placed.dataset.placed=key;
      placed.textContent=card.textContent;
      list.appendChild(placed);
      card.remove();
      bin.classList.remove('pulse');
      void bin.offsetWidth;
      bin.classList.add('pulse');
      selected=null;
      remaining--;
      if(remaining===0){
        finished=true;
        message.textContent=Studio.t('done');
        Studio.done();
      }else{
        message.textContent=Studio.t('right');
      }
    }else{
      message.textContent=Studio.t('wrong');
      card.classList.add('shake');
      card.dataset.selected='false';
      selected=null;
      setTimeout(()=>card.classList.remove('shake'),400);
    }
  });

  p.bins.forEach(key=>{
    const bin=document.createElement('div');
    bin.className='bin';
    bin.dataset.bin=key;
    const name=document.createElement('div');
    name.className='bin-name';
    name.textContent=Studio.t(key);
    const list=document.createElement('div');
    list.className='placed-list';
    bin.append(name,list);
    bin.addEventListener('click',()=>{
      if(finished||pending||!selected)return;
      const card=selected;
      pending={card,bin,list,key};
      Studio.answer({card:card.dataset.card,bin:key});
    });
    bins.appendChild(bin);
  });

  p.cards.forEach(key=>{
    const card=document.createElement('button');
    card.type='button';
    card.className='card';
    card.dataset.card=key;
    card.dataset.selected='false';
    card.textContent=Studio.t(key);
    card.addEventListener('click',()=>{
      if(finished||pending)return;
      if(selected)selected.dataset.selected='false';
      selected=card;
      card.dataset.selected='true';
      message.textContent='';
    });
    cards.appendChild(card);
  });
  Studio.ready();
})();

</script>
