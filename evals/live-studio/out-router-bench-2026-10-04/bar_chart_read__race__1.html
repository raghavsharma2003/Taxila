<style>
*{box-sizing:border-box}
html,body{margin:0;width:360px;height:320px;overflow:hidden}
#app{width:360px;height:320px;padding:10px 12px;background:#fff8ed;color:#493b32;font-family:system-ui,sans-serif;overflow:hidden}
#title{height:30px;margin:0;text-align:center;font-size:20px;line-height:26px;font-weight:750;color:#704d38}
#ask{height:34px;margin:0;text-align:center;font-size:15px;line-height:22px;font-weight:650;color:#665246}
#chart{display:block;width:336px;height:222px;overflow:visible}
.axis{stroke:#a9927e;stroke-width:1.3}
.grid{stroke:#eadfce;stroke-width:1}
.tick-label{fill:#78695c;font-size:10px;text-anchor:end;dominant-baseline:middle}
.axis-title{fill:#78695c;font-size:11px;font-weight:650;text-anchor:middle}
.bar{fill:#e89a55;transform-box:fill-box;transform-origin:center bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.bar-face{fill:#f0ad6b;opacity:.55}
.name-label{fill:#5f4d3e;font-size:10px;font-weight:650;text-anchor:middle;dominant-baseline:hanging}
.column-hit{fill:transparent;cursor:pointer}
.column-hit:focus{outline:none}
.column-hit:focus-visible{stroke:#79532e;stroke-width:2;stroke-dasharray:4 3}
.column-hit:active{fill:#e89a5522}
#feedback{height:24px;margin:0;text-align:center;font-size:14px;line-height:22px;font-weight:700;color:#64804d}
#feedback.wrong{color:#a65e49}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
</style>
<div id="app">
  <h1 id="title"></h1>
  <p id="ask"></p>
  <svg id="chart" viewBox="0 0 336 222" role="img" aria-label="">
    <g id="grid-layer"></g>
    <g id="bar-layer"></g>
    <g id="hit-layer"></g>
    <g id="label-layer"></g>
  </svg>
  <p id="feedback" aria-live="polite"></p>
</div>
<script>

(()=>{
  const p=Studio.params;
  const t=key=>Studio.t(key);
  const title=document.getElementById("title");
  const ask=document.getElementById("ask");
  const svg=document.getElementById("chart");
  const grid=document.getElementById("grid-layer");
  const bars=document.getElementById("bar-layer");
  const hits=document.getElementById("hit-layer");
  const labels=document.getElementById("label-layer");
  const feedback=document.getElementById("feedback");
  title.textContent=t("title");
  ask.textContent=t("ask");
  const data=p.data;
  const left=38, right=331, top=10, base=178, plotHeight=base-top;
  const maxValue=Math.max(...data.map(d=>Number(d.value)));
  const step=Math.max(1,Math.ceil(maxValue/5));
  const topTick=Math.ceil(maxValue/step)*step;
  const scale=plotHeight/topTick;
  const ns="http://www.w3.org/2000/svg";
  const el=(tag,attrs,parent,text)=>{
    const node=document.createElementNS(ns,tag);
    for(const [k,v] of Object.entries(attrs)) node.setAttribute(k,String(v));
    if(text!==undefined) node.textContent=text;
    parent.appendChild(node);
    return node;
  };
  for(let value=0;value<=topTick;value+=step){
    const y=base-value*scale;
    el("line",{x1:left,y1:y,x2:right,y2:y,class:value===0?"axis":"grid"},grid);
    el("text",{x:left-6,y:y,class:"tick-label","data-tick":value},grid,String(value));
  }
  el("line",{x1:left,y1:top,x2:left,y2:base,class:"axis"},grid);
  el("text",{x:10,y:(top+base)/2,class:"axis-title",transform:`rotate(-90 10 ${(top+base)/2})`},grid,t("yaxis"));
  const slot=(right-left)/data.length;
  const barWidth=Math.min(34,slot*.62);
  data.forEach((d,i)=>{
    const value=Number(d.value);
    const cx=left+slot*(i+.5);
    const height=value*scale;
    const y=base-height;
    el("rect",{x:cx-barWidth/2,y:y,width:barWidth,height:height,rx:5,class:"bar","data-bar":d.key,"data-value":d.value},bars);
    el("rect",{x:cx-barWidth/2,y:y,width:barWidth,height:Math.min(10,height),rx:5,class:"bar-face"},bars);
    el("rect",{x:cx-slot/2,y:top,width:slot,height:base-top+34,class:"column-hit","data-column":d.key,tabindex:0,role:"button"},hits);
    el("text",{x:cx,y:base+8,class:"name-label"},labels,t(d.key));
  });
  let locked=false;
  const answerFor=key=>{
    if(locked)return;
    Studio.event("column_tap",{key});
    Studio.answer(key);
  };
  hits.addEventListener("click",e=>{
    const target=e.target.closest("[data-column]");
    if(target)answerFor(target.getAttribute("data-column"));
  });
  hits.addEventListener("keydown",e=>{
    const target=e.target.closest("[data-column]");
    if(target&&(e.key==="Enter"||e.key===" ")){
      e.preventDefault();
      answerFor(target.getAttribute("data-column"));
    }
  });
  Studio.onVerdict(result=>{
    feedback.textContent=t(result.correct?"right":"wrong");
    feedback.classList.toggle("wrong",!result.correct);
    if(result.correct){
      locked=true;
      window.setTimeout(()=>{
        feedback.textContent=t("done");
        Studio.done();
      },450);
    }
  });
  Studio.ready();
})();

</script>
