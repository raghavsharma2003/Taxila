<style>
*{box-sizing:border-box}
html,body{width:360px;height:320px;margin:0;overflow:hidden}
body{font-family:system-ui,sans-serif;color:#344b3d;background:#fff8e9}
#app{width:360px;height:320px;padding:7px;display:flex;flex-direction:column;gap:4px}
header{height:24px;display:flex;align-items:center;justify-content:center;color:#32634a;font-weight:800;font-size:17px;letter-spacing:.2px}
#scene{width:346px;height:132px;display:block;border-radius:22px;background:#eef7dc}
#caption{height:24px;border-radius:12px;background:#fff0c9;text-align:center;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#75542d}
.controls{height:52px;display:flex;justify-content:center;gap:9px}
button{font:inherit;border:0;cursor:pointer;touch-action:manipulation;transition:transform .14s,filter .14s,background .2s}
button:active{transform:scale(.92)}
.control{height:52px;min-width:90px;padding:0 12px;border-radius:17px;background:#d8edcd;color:#315e43;font-weight:750;font-size:14px;box-shadow:0 3px 0 #b7d4a8}
#play{min-width:104px;background:#f6d886;color:#674d20;box-shadow:0 3px 0 #dfbe67}
#ask{height:23px;text-align:center;font-size:13px;font-weight:750;color:#455847;white-space:nowrap;overflow:hidden}
.options{height:52px;display:flex;justify-content:center;gap:8px}
.option{height:52px;min-width:94px;flex:1;max-width:108px;border-radius:16px;background:#d9edf0;color:#315b64;font-weight:750;font-size:14px;box-shadow:0 3px 0 #b8d8dc}
.option.selected{background:#f5d99a}
#feedback{position:absolute;left:0;right:0;bottom:3px;height:16px;text-align:center;font-size:12px;font-weight:750;color:#47734a}
svg text{font-family:system-ui,sans-serif;font-weight:750;paint-order:stroke;stroke:#eef7dc;stroke-width:3px;stroke-linejoin:round}
.flowdot{filter:drop-shadow(0 1px 2px #68844c)}
#hubshape{transform-box:fill-box;transform-origin:center;transition:filter .3s,transform .3s}
.entity-shape{transition:filter .3s}
.emphasis{filter:drop-shadow(0 0 5px #edaa43)}
</style>
<div id="app">
  <header id="title"></header>
  <svg id="scene" viewBox="0 0 346 132" role="img" aria-label="">
    <g id="art"></g>
  </svg>
  <div id="caption" data-caption></div>
  <div class="controls">
    <button id="play" class="control" data-action="play"></button>
    <button id="next" class="control" data-action="next"></button>
  </div>
  <div id="ask"></div>
  <div class="options" id="options"></div>
  <div id="feedback"></div>
</div>
<script>

(()=> {
  const p=Studio.params, t=Studio.t, ns="http://www.w3.org/2000/svg";
  const art=document.getElementById("art"), scene=document.getElementById("scene");
  document.getElementById("title").textContent=t("title");
  document.getElementById("ask").textContent=t("ask");
  const caption=document.querySelector("[data-caption]"), play=document.getElementById("play");
  const next=document.getElementById("next"), feedback=document.getElementById("feedback");
  let playing=true, step=0, completed=false, chosen=null;
  const make=(name,attrs={},parent=art)=>{
    const el=document.createElementNS(ns,name);
    Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));
    parent.appendChild(el); return el;
  };
  const text=(key,x,y,attrs={})=>{
    const el=make("text",{x,y,"text-anchor":"middle","font-size":"10",...attrs});
    el.dataset.label=key; el.textContent=t(key); return el;
  };
  make("rect",{x:0,y:0,width:346,height:132,rx:22,fill:"#eef7dc"});
  const positions={};
  const center={x:173,y:67};
  (p.entities||[]).forEach((key,i)=>{
    const pos=i%2===0?{x:44,y:29}:{x:302,y:105};
    positions[key]=pos;
    if(i%2===0){
      make("circle",{cx:pos.x,cy:pos.y,r:13,fill:"#f7ca68",class:"entity-shape", "data-entity":key});
      make("path",{d:`M ${pos.x-22} ${pos.y} Q ${pos.x-12} ${pos.y-4} ${pos.x-14} ${pos.y-15} Q ${pos.x-3} ${pos.y-10} ${pos.x} ${pos.y-22} Q ${pos.x+4} ${pos.y-10} ${pos.x+15} ${pos.y-14} Q ${pos.x+12} ${pos.y-3} ${pos.x+22} ${pos.y} Q ${pos.x+10} ${pos.y+4} ${pos.x+14} ${pos.y+15} Q ${pos.x+3} ${pos.y+10} ${pos.x} ${pos.y+22} Q ${pos.x-4} ${pos.y+10} ${pos.x-15} ${pos.y+14} Q ${pos.x-12} ${pos.y+3} ${pos.x-22} ${pos.y}`,fill:"#f7ca68",class:"entity-shape","data-entity":key});
    }else{
      make("path",{d:`M ${pos.x-21} ${pos.y+5} Q ${pos.x-16} ${pos.y-15} ${pos.x} ${pos.y-10} Q ${pos.x+15} ${pos.y-8} ${pos.x+20} ${pos.y+5} Q ${pos.x+5} ${pos.y+13} ${pos.x-21} ${pos.y+5}`,fill:"#9b7552",class:"entity-shape","data-entity":key});
      make("path",{d:`M ${pos.x-16} ${pos.y+1} Q ${pos.x-3} ${pos.y-2} ${pos.x+16} ${pos.y+3} M ${pos.x-8} ${pos.y+3} l-5 9 M ${pos.x+1} ${pos.y+3} l1 10 M ${pos.x+8} ${pos.y+3} l7 8`,fill:"none",stroke:"#e8c99b","stroke-width":"2",class:"entity-shape"});
    }
    text(key,pos.x,pos.y+(i%2===0?30:-18),{"font-size":"10"});
  });
  const hub=make("path",{d:"M 173 94 C 130 76 136 33 173 32 C 210 33 216 76 173 94 Z",fill:"#69ae68",stroke:"#3e8053","stroke-width":"3","data-entity":p.hub,id:"hubshape"});
  make("path",{d:"M 173 86 Q 173 60 173 39 M 173 66 Q 159 52 148 50 M 173 59 Q 187 48 198 46",fill:"none",stroke:"#d4ed9a","stroke-width":"3","stroke-linecap":"round"});
  text(p.hub,173,112,{"font-size":"11"});
  const flows=p.flows||[], particleGroups=[];
  flows.forEach((f,i)=>{
    const flow=f.key, dir=f.dir;
    let lx=173,ly=15;
    if(dir==="up_in"){lx=173;ly=124}
    else if(dir==="in"){lx=107;ly=57}
    else {lx=238;ly=57}
    text(flow,lx,ly,{"font-size":"10"});
    const dots=[];
    for(let j=0;j<3;j++){
      const dot=make("circle",{r:3.3,fill:["#4c9eb1","#63a6d1","#e5a64f"][i%3],class:"flowdot","data-flow":flow});
      dots.push(dot);
    }
    particleGroups.push({dir,dots,index:i});
  });
  const optionBox=document.getElementById("options");
  (p.options||[]).forEach(key=>{
    const b=document.createElement("button");
    b.className="option"; b.dataset.option=key; b.textContent=t(key);
    b.addEventListener("click",()=>{
      chosen=key; document.querySelectorAll(".option").forEach(x=>x.classList.toggle("selected",x===b));
      feedback.textContent=""; Studio.answer(key); Studio.event("answer",{option:key});
    });
    optionBox.appendChild(b);
  });
  function setPlaying(v){playing=v;play.textContent=t(playing?"pause":"play");play.setAttribute("aria-label",play.textContent)}
  function showStep(){
    caption.textContent=t("step"+(step+1));
    document.getElementById("hubshape").classList.toggle("emphasis",step===0);
    document.querySelectorAll(".entity-shape").forEach(el=>el.classList.toggle("emphasis",step===1));
    document.querySelectorAll(".flowdot").forEach(el=>el.classList.toggle("emphasis",step===2));
  }
  setPlaying(true); next.textContent=t("next"); showStep();
  play.addEventListener("click",()=>{setPlaying(!playing);Studio.event("play",{playing:playing?1:0})});
  next.addEventListener("click",()=>{step=(step+1)%p.steps;showStep();Studio.event("step",{step:step+1})});
  let start=performance.now();
  function animate(now){
    const elapsed=playing?(now-start)/1900:0;
    particleGroups.forEach((g,gi)=>g.dots.forEach((dot,j)=>{
      const q=((elapsed+j/3+gi/5)%1);
      let x,y;
      if(g.dir==="up_in"){x=173+Math.sin(q*6.28)*3;y=126-q*43}
      else if(g.dir==="in"){x=83+q*72;y=59+Math.sin(q*6.28)*5}
      else{x=191+q*78;y=65+Math.sin(q*6.28)*5}
      dot.setAttribute("cx",x);dot.setAttribute("cy",y);
    }));
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
  Studio.onVerdict(({correct})=>{
    feedback.textContent=t(correct?"right":"wrong");
    if(correct&&!completed){completed=true;Studio.done()}
  });
  Studio.ready();
})();

</script>
