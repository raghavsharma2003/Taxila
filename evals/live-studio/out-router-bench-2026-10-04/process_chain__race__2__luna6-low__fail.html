<style>
*{box-sizing:border-box}
#lesson{width:360px;height:320px;overflow:hidden;position:relative;background:#fff8ed;color:#31495a;font-family:system-ui,sans-serif;padding:10px 12px}
#lesson h1{height:30px;margin:0;text-align:center;font-size:20px;line-height:30px;color:#315c56}
#board{height:190px;position:relative;margin-top:2px}
#arrows{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.flow{fill:none;stroke:#a6c9bd;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.arrowhead{fill:#a6c9bd}
.stage{position:absolute;width:104px;height:54px;border:2px solid #c3d9cc;border-radius:17px;background:#fff;display:flex;align-items:center;justify-content:center;padding:4px;text-align:center;font-size:13px;line-height:16px;font-weight:700;box-shadow:0 3px 0 #e9ddca;transition:background .25s,border-color .25s,box-shadow .25s,transform .25s}
.stage[data-active="true"]{background:#fff0bd;border-color:#edae52;box-shadow:0 0 0 5px #f8dfaa,0 4px 0 #e9ddca;transform:scale(1.04)}
#token{position:absolute;left:0;top:0;width:18px;height:18px;border:3px solid #fff;background:#ef805b;border-radius:50%;box-shadow:0 2px 7px #74504a80;z-index:3;pointer-events:none;transform:translate(-50%,-50%);transition:opacity .2s}
#controls{height:68px;display:flex;align-items:flex-start;justify-content:center;padding-top:3px}
button{font:700 15px system-ui,sans-serif;color:#fff;background:#438a78;border:0;border-radius:17px;min-width:100px;height:54px;padding:0 19px;box-shadow:0 4px 0 #286759;cursor:pointer;transition:transform .12s,background .2s}
button:active{transform:scale(.94)}
#question{display:none;height:68px}
#questionText{height:30px;text-align:center;font-size:15px;font-weight:700;color:#315c56}
#options{display:flex;justify-content:center;gap:8px}
#options button{height:52px;min-width:96px;padding:0 8px;font-size:13px;background:#e9a24d;box-shadow:0 4px 0 #bd7831}
#message{position:absolute;bottom:2px;left:0;width:100%;height:18px;text-align:center;font-size:13px;font-weight:700;color:#438a78}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div id="lesson">
  <h1 id="title"></h1>
  <div id="board">
    <svg id="arrows" viewBox="0 0 336 190" aria-hidden="true"></svg>
    <div id="stages"></div>
    <div id="token" data-token></div>
  </div>
  <div id="controls"><button id="next" data-action="next"></button></div>
  <div id="question">
    <div id="questionText"></div>
    <div id="options"></div>
  </div>
  <div id="message" aria-live="polite"></div>
</div>
<script>

(function(){
  const p=Studio.params, keys=p.stages, root=document.getElementById("lesson");
  const spots=[[58,42],[278,42],[278,142],[58,142]];
  const centers=[[110,69],[226,69],[226,127],[110,127]];
  document.getElementById("title").textContent=Studio.t("title");
  const stageWrap=document.getElementById("stages"), svg=document.getElementById("arrows");
  const pairs=keys.slice(0,-1).map((k,i)=>[k,keys[i+1]]);
  if(p.cycle)pairs.push([keys[keys.length-1],keys[0]]);
  pairs.forEach(([from,to],i)=>{
    const a=centers[i], b=centers[(i+1)%keys.length];
    let d;
    if(i===0)d=`M ${a[0]+52} ${a[1]} L ${b[0]-58} ${b[1]}`;
    else if(i===1)d=`M ${a[0]} ${a[1]+29} L ${b[0]} ${b[1]-29}`;
    else if(i===2)d=`M ${a[0]-52} ${a[1]} L ${b[0]+58} ${b[1]}`;
    else d=`M ${a[0]} ${a[1]-29} L ${b[0]} ${b[1]+29}`;
    const path=document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d",d);path.setAttribute("class","flow");path.setAttribute("data-arrow",from+">"+to);svg.appendChild(path);
    const end=document.createElementNS("http://www.w3.org/2000/svg","path");
    const angle=Math.atan2(b[1]-a[1],b[0]-a[0]), x=b[0]-(i===0?58:i===2?58:29)*Math.cos(angle), y=b[1]-(i===0?58:i===2?58:29)*Math.sin(angle), size=8;
    end.setAttribute("d",`M ${x} ${y} l ${-size*Math.cos(angle-0.55)} ${-size*Math.sin(angle-0.55)} l ${size*Math.cos(angle)} ${size*Math.sin(angle)} l ${-size*Math.cos(angle+0.55)} ${-size*Math.sin(angle+0.55)} Z`);
    end.setAttribute("class","arrowhead");svg.appendChild(end);
  });
  keys.forEach((key,i)=>{
    const box=document.createElement("div");box.className="stage";box.setAttribute("data-stage",key);
    box.style.left=spots[i][0]+"px";box.style.top=spots[i][1]+"px";
    const label=document.createElement("span");label.setAttribute("data-label",key);label.textContent=Studio.t(key);box.appendChild(label);stageWrap.appendChild(box);
  });
  let index=0,busy=false;
  root.setAttribute("data-active",keys[0]);
  document.querySelector(`[data-stage="${keys[0]}"]`).setAttribute("data-active","true");
  const token=document.getElementById("token");
  function placeToken(i,animate){
    const spot=centers[i], x=spot[0]+12,y=spot[1];
    if(!animate){token.style.left=x+"px";token.style.top=y+"px";return}
    busy=true;
    const startX=parseFloat(token.style.left),startY=parseFloat(token.style.top);
    const targetX=x,targetY=y,begin=performance.now(),duration=850;
    function frame(now){
      const t=Math.min(1,(now-begin)/duration), eased=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
      token.style.left=(startX+(targetX-startX)*eased)+"px";
      token.style.top=(startY+(targetY-startY)*eased)+"px";
      if(t<1)requestAnimationFrame(frame);
      else{busy=false;activate(index)}
    }
    requestAnimationFrame(frame);
  }
  function activate(i){
    document.querySelectorAll(".stage").forEach((el,n)=>el.setAttribute("data-active",n===i?"true":"false"));
    root.setAttribute("data-active",keys[i]);
  }
  placeToken(0,false);
  const next=document.getElementById("next");next.textContent=Studio.t("next");
  next.addEventListener("click",()=>{
    if(busy)return;
    index=(index+1)%keys.length;
    Studio.event("next",{stage:index});
    placeToken(index,true);
    if(index===keys.length-1){
      setTimeout(()=>{
        document.getElementById("controls").style.display="none";
        const q=document.getElementById("question");q.style.display="block";
        document.getElementById("questionText").textContent=Studio.t("ask")+" "+Studio.t(p.askAfter)+"?";
        const options=document.getElementById("options");
        p.options.forEach(key=>{
          const b=document.createElement("button");b.setAttribute("data-option",key);b.textContent=Studio.t(key);
          b.addEventListener("click",()=>{document.getElementById("message").textContent="";Studio.answer(key);Studio.event("answer",{option:key});});
          options.appendChild(b);
        });
      },900);
    }
  });
  Studio.onVerdict(({correct})=>{
    document.getElementById("message").textContent=Studio.t(correct?"right":"wrong");
    if(correct){document.getElementById("questionText").textContent=Studio.t("done");Studio.done();}
  });
  Studio.ready();
})();

</script>
