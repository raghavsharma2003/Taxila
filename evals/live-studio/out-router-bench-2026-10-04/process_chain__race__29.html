<style>
  *{box-sizing:border-box}
  #activity{width:360px;height:320px;overflow:hidden;position:relative;background:#fff8ec;color:#553b38;font-family:system-ui,sans-serif;border-radius:20px}
  #title{position:absolute;top:10px;left:16px;right:16px;text-align:center;font-size:19px;font-weight:750}
  #scene{position:absolute;top:38px;left:0;width:360px;height:180px;overflow:visible}
  .arrow{fill:none;stroke:#d59a70;stroke-width:3;stroke-linecap:round}
  .stage-box{fill:#fff;stroke:#e8c9aa;stroke-width:2;transition:fill .3s,stroke .3s,filter .3s}
  .stage.active .stage-box{fill:#fff0a9;stroke:#df9d47;filter:drop-shadow(0 0 7px #ffc967)}
  .stage-label{fill:#553b38;font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
  #token{fill:#e98072;stroke:white;stroke-width:3;filter:drop-shadow(0 2px 3px #af7963)}
  #next{position:absolute;left:148px;top:99px;width:64px;height:54px;border:0;border-radius:18px;background:#ed8e70;color:#fff;font-size:16px;font-weight:750;box-shadow:0 4px 0 #c66c55;cursor:pointer}
  #next:active,.option:active{transform:scale(.94)}
  #next:disabled{opacity:.6}
  #question{position:absolute;top:220px;left:12px;width:336px;text-align:center;font-size:15px;font-weight:700}
  #options{position:absolute;top:249px;left:10px;right:10px;display:flex;gap:7px;justify-content:center}
  .option{flex:1;min-width:0;height:54px;border:2px solid #ddb5a0;border-radius:15px;background:#fff;color:#553b38;font:700 13px system-ui,sans-serif;cursor:pointer;transition:transform .15s,background .2s}
  .option:disabled{opacity:.7}
  #feedback{position:absolute;bottom:2px;left:0;width:100%;height:15px;text-align:center;font-size:12px;font-weight:700;color:#a45c49}
</style>
<div id="activity">
  <div id="title"></div>
  <svg id="scene" viewBox="0 0 360 180" aria-hidden="true">
    <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#d59a70" stroke-width="2"/></marker></defs>
    <g id="arrows"></g><g id="stages"></g>
    <circle id="token" data-token r="9" cx="0" cy="0"></circle>
  </svg>
  <button id="next" data-action="next" type="button"></button>
  <div id="question"></div>
  <div id="options"></div>
  <div id="feedback" aria-live="polite"></div>
</div>
<script>

(() => {
  const p=Studio.params, keys=p.stages, root=document.getElementById('activity');
  const svgNS='http://www.w3.org/2000/svg';
  const make=(tag,attrs,parent)=>{
    const el=document.createElementNS(svgNS,tag);
    for(const [k,v] of Object.entries(attrs)) el.setAttribute(k,v);
    parent.appendChild(el); return el;
  };
  const n=keys.length;
  const positions=keys.map((_,i)=>{
    const a=-Math.PI*3/4+i*2*Math.PI/n;
    return {x:180+125*Math.cos(a),y:90+65*Math.sin(a)};
  });
  const arrows=document.getElementById('arrows'), stages=document.getElementById('stages');
  const paths=[];
  for(let i=0;i<n-(p.cycle?0:1);i++){
    const j=(i+1)%n, a=positions[i],b=positions[j];
    const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;
    const ux=dx/len,uy=dy/len;
    const path=make('path',{
      d:`M ${a.x+ux*44} ${a.y+uy*29} L ${b.x-ux*49} ${b.y-uy*32}`,
      class:'arrow','marker-end':'url(#tip)','data-arrow':keys[i]+'>'+keys[j]
    },arrows);
    paths[i]=path;
  }
  const groups=keys.map((key,i)=>{
    const {x,y}=positions[i];
    const g=make('g',{'class':'stage','data-stage':key},stages);
    make('rect',{x:x-40,y:y-25,width:80,height:50,rx:17,class:'stage-box'},g);
    const label=make('text',{x,y,class:'stage-label','data-label':key},g);
    label.textContent=Studio.t(key);
    return g;
  });
  document.getElementById('title').textContent=Studio.t('title');
  document.getElementById('question').textContent=Studio.t('ask')+' '+Studio.t(p.askAfter)+'?';
  const next=document.getElementById('next');
  next.textContent=Studio.t('next');
  const token=document.getElementById('token'),feedback=document.getElementById('feedback');
  let current=0,moving=false,finished=false;
  function place(point){token.setAttribute('cx',point.x);token.setAttribute('cy',point.y)}
  function activate(i){
    current=i;root.setAttribute('data-active',keys[i]);
    groups.forEach((g,j)=>g.classList.toggle('active',i===j));
  }
  place(positions[0]);activate(0);
  next.addEventListener('click',()=>{
    if(moving||finished)return;
    const index=current;
    if(!paths[index])return;
    moving=true;next.disabled=true;
    Studio.event('next',{stage:keys[index]});
    const path=paths[index],length=path.getTotalLength(),start=performance.now(),duration=650;
    function frame(now){
      const t=Math.min(1,(now-start)/duration);
      const ease=t*t*(3-2*t);
      const pt=path.getPointAtLength(length*ease);
      place(pt);
      if(t<1)requestAnimationFrame(frame);
      else{
        const target=(index+1)%n;
        place(positions[target]);activate(target);
        moving=false;next.disabled=false;
      }
    }
    requestAnimationFrame(frame);
  });
  const options=document.getElementById('options');
  p.options.forEach(key=>{
    const button=document.createElement('button');
    button.type='button';button.className='option';
    button.setAttribute('data-option',key);
    button.textContent=Studio.t(key);
    button.addEventListener('click',()=>{
      if(finished)return;
      Studio.event('answer',{option:key});
      Studio.answer(key);
    });
    options.appendChild(button);
  });
  Studio.onVerdict(({correct})=>{
    feedback.textContent=Studio.t(correct?'right':'wrong');
    if(correct){
      finished=true;next.disabled=true;
      options.querySelectorAll('button').forEach(b=>b.disabled=true);
      feedback.textContent=Studio.t('done');
      Studio.done();
    }
  });
  Studio.ready();
})();

</script>
