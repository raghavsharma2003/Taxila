<style>
*{box-sizing:border-box}
html,body{width:360px;height:320px;margin:0;overflow:hidden}
body{font-family:system-ui,sans-serif;color:#493c35;background:#fff8ed}
#app{position:relative;width:360px;height:320px;overflow:hidden;padding:11px 14px}
h1{height:29px;margin:0;text-align:center;font-size:19px;line-height:29px;font-weight:750;color:#754837}
#question{height:27px;margin:2px 0 0;text-align:center;font-size:15px;line-height:24px;color:#65534a}
#stage{position:absolute;inset:0}
#axisSvg{position:absolute;inset:0;width:360px;height:320px;overflow:visible;pointer-events:none}
#axisSvg line[data-axis]{stroke:#d48d54;stroke-width:4;stroke-linecap:round}
.connector{stroke:#d9b18d;stroke-width:2;stroke-linecap:round}
.event-marker{fill:#f5b34d;stroke:#fff8ed;stroke-width:3;transition:transform .18s ease}
.event-card{position:absolute;width:100px;height:68px;padding:8px 5px;border:2px solid #e8c7a7;border-radius:15px;background:#fffdf8;color:#493c35;box-shadow:0 3px 0 #ead9c8;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:transform .16s ease,background .2s ease,border-color .2s ease;z-index:2}
.event-card:active{transform:scale(.95)}
.event-card:hover{border-color:#d48d54}
.event-name{font-size:14px;line-height:17px;font-weight:700;white-space:nowrap}
.event-year{font-size:13px;line-height:16px;color:#876b58}
.event-card:focus-visible{outline:3px solid #edab50;outline-offset:2px}
#feedback{position:absolute;left:12px;right:12px;bottom:8px;height:40px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;line-height:19px;font-weight:700;color:#754837;opacity:0;transform:translateY(5px);transition:opacity .2s ease,transform .2s ease;pointer-events:none}
#feedback.show{opacity:1;transform:translateY(0)}
.event-card.chosen{background:#fff1d8;border-color:#e9a34f}
.event-card:disabled{cursor:default}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
<div id="app">
  <h1 id="title"></h1>
  <p id="question"></p>
  <div id="stage" aria-label="">
    <svg id="axisSvg" viewBox="0 0 360 320" aria-hidden="true">
      <line data-axis x1="20" y1="160" x2="340" y2="160"></line>
      <g id="connectors"></g>
      <g id="markers"></g>
    </svg>
    <div id="cards"></div>
  </div>
  <div id="feedback" aria-live="polite"></div>
</div>
<script>

(()=> {
  const events=Studio.params.events;
  const title=document.getElementById("title");
  const question=document.getElementById("question");
  const cards=document.getElementById("cards");
  const markers=document.getElementById("markers");
  const connectors=document.getElementById("connectors");
  const feedback=document.getElementById("feedback");
  title.textContent=Studio.t("title");
  question.textContent=Studio.t("ask");

  const sorted=[...events].sort((a,b)=>a.year-b.year);
  const minYear=Math.min(...events.map(e=>e.year));
  const maxYear=Math.max(...events.map(e=>e.year));
  const xFor=e=>maxYear===minYear?180:20+(e.year-minYear)*320/(maxYear-minYear);
  const axisY=160, cardW=100, cardH=68;
  const placed=[];
  sorted.forEach((e,index)=>{
    const x=xFor(e);
    const lane=index%2===0?0:1;
    let cx=Math.max(cardW/2+5,Math.min(355-cardW/2,x));
    const sameLane=placed.filter(p=>p.lane===lane).sort((a,b)=>a.cx-b.cx);
    for(const p of sameLane){
      if(Math.abs(cx-p.cx)<cardW+6) cx=p.cx+(cx>=p.cx?1:-1)*(cardW+6);
    }
    cx=Math.max(cardW/2+5,Math.min(355-cardW/2,cx));
    placed.push({event:e,x,cx,lane});
  });

  placed.forEach(({event:e,x,cx,lane})=>{
    const cy=lane===0?109:211;
    const edgeY=lane===0?143:177;
    const connector=document.createElementNS("http://www.w3.org/2000/svg","line");
    connector.setAttribute("class","connector");
    connector.setAttribute("x1",x);
    connector.setAttribute("y1",axisY);
    connector.setAttribute("x2",cx);
    connector.setAttribute("y2",edgeY);
    connectors.appendChild(connector);

    const marker=document.createElementNS("http://www.w3.org/2000/svg","circle");
    marker.setAttribute("class","event-marker");
    marker.setAttribute("cx",x);
    marker.setAttribute("cy",axisY);
    marker.setAttribute("r","9");
    marker.setAttribute("data-event",e.key);
    marker.setAttribute("data-year",e.year);
    markers.appendChild(marker);

    const card=document.createElement("button");
    card.type="button";
    card.className="event-card";
    card.dataset.card=e.key;
    card.style.left=(cx-cardW/2)+"px";
    card.style.top=(cy-cardH/2)+"px";
    const name=document.createElement("span");
    name.className="event-name";
    name.textContent=Studio.t(e.key);
    const year=document.createElement("span");
    year.className="event-year";
    year.textContent=e.year;
    card.append(name,year);
    cards.appendChild(card);
    card.addEventListener("click",()=>{
      if(card.disabled)return;
      card.classList.add("chosen");
      Studio.event("event_tap",{key:e.key});
      Studio.answer(e.key);
    });
  });

  Studio.onVerdict(({correct})=>{
    feedback.textContent=Studio.t(correct?"right":"wrong");
    feedback.classList.add("show");
    if(correct){
      cards.querySelectorAll("button").forEach(button=>button.disabled=true);
      feedback.textContent=Studio.t("done");
      Studio.done();
    }
  });
  Studio.ready();
})();

</script>
