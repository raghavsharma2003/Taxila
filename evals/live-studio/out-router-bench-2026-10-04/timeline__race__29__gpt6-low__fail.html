<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;background:#fff8ed;font-family:system-ui,sans-serif;color:#493a35}
  .scene{position:relative;width:360px;height:320px;overflow:hidden;background:radial-gradient(circle at 85% 12%,#ffe4bb 0 42px,transparent 43px),#fff8ed}
  .title{position:absolute;top:15px;left:20px;right:20px;margin:0;font-size:20px;line-height:1.2;font-weight:800}
  .ask{position:absolute;top:42px;left:20px;right:20px;margin:0;font-size:14px;line-height:1.25}
  .drawing{position:absolute;inset:0;width:360px;height:320px;pointer-events:none}
  [data-axis]{stroke:#a77462;stroke-width:5;stroke-linecap:round}
  .join{stroke:#c59679;stroke-width:2;stroke-linecap:round}
  [data-event]{fill:#fff8ed;stroke:#a65e58;stroke-width:4;transition:transform .3s,fill .3s;transform-box:fill-box;transform-origin:center}
  .card{position:absolute;width:100px;height:68px;border:2px solid #dcaa88;border-radius:17px;background:#fff1db;color:#493a35;box-shadow:0 4px 0 #e5c5a8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:inherit;cursor:pointer;transition:transform .2s,background .2s,box-shadow .2s}
  .card:active{transform:translateY(3px) scale(.95);box-shadow:0 1px 0 #e5c5a8}
  .card:focus-visible{outline:3px solid #8b635b;outline-offset:2px}
  .name{font-size:16px;font-weight:750;line-height:1.1;text-align:center}
  .year{font-size:13px;font-weight:650;color:#805f53}
  .card.chosen{background:#ffdbb8;transform:scale(1.04)}
  .card.correct{background:#d8efce;border-color:#78a274}
  .feedback{position:absolute;top:274px;left:20px;right:20px;min-height:30px;text-align:center;font-size:17px;font-weight:750;color:#71534b}
  .feedback.pop{animation:pop .35s ease-out}
  @keyframes pop{from{transform:scale(.88);opacity:.3}to{transform:scale(1);opacity:1}}
</style>
<div class="scene">
  <h1 class="title" id="title"></h1>
  <p class="ask" id="ask"></p>
  <svg class="drawing" viewBox="0 0 360 320" aria-hidden="true">
    <line data-axis x1="38" y1="166" x2="322" y2="166"></line>
    <g id="joins"></g><g id="markers"></g>
  </svg>
  <div id="cards"></div>
  <div class="feedback" id="feedback" aria-live="polite"></div>
</div>
<script>

(() => {
  const events = [...Studio.params.events].sort((a,b) => a.year-b.year);
  const first = events[0].year, last = events[events.length-1].year;
  const svgNS = "http://www.w3.org/2000/svg";
  const joins = document.getElementById("joins");
  const markers = document.getElementById("markers");
  const cards = document.getElementById("cards");
  const feedback = document.getElementById("feedback");
  document.getElementById("title").textContent = Studio.t("title");
  document.getElementById("ask").textContent = Studio.t("ask");
  let selected = null, finished = false;
  const slots = [
    {left:8,top:76},
    {left:206,top:76},
    {left:250,top:199}
  ];
  events.forEach((event,index) => {
    const x = first === last ? 180 : 38+(event.year-first)*284/(last-first);
    const slot = slots[index] || {left:Math.max(8,Math.min(252,x-50)),top:index%2?199:76};
    const endX = Math.max(slot.left+15,Math.min(slot.left+85,x));
    const endY = slot.top < 166 ? slot.top+68 : slot.top;
    const join = document.createElementNS(svgNS,"line");
    join.setAttribute("class","join");
    join.setAttribute("x1",x); join.setAttribute("y1",166);
    join.setAttribute("x2",endX); join.setAttribute("y2",endY);
    joins.appendChild(join);
    const dot = document.createElementNS(svgNS,"circle");
    dot.setAttribute("data-event",event.key);
    dot.setAttribute("data-year",event.year);
    dot.setAttribute("cx",x); dot.setAttribute("cy",166); dot.setAttribute("r",7);
    markers.appendChild(dot);
    const card = document.createElement("button");
    card.type = "button";
    card.className = "card";
    card.setAttribute("data-card",event.key);
    card.style.left = slot.left+"px";
    card.style.top = slot.top+"px";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = Studio.t(event.key);
    const year = document.createElement("span");
    year.className = "year";
    year.textContent = event.year;
    card.append(name,year);
    card.addEventListener("click",() => {
      if (finished || selected) return;
      selected = card;
      card.classList.add("chosen");
      Studio.event("tap",{key:event.key});
      Studio.answer(event.key);
    });
    cards.appendChild(card);
  });
  Studio.onVerdict(({correct}) => {
    if (!selected || finished) return;
    feedback.classList.remove("pop");
    void feedback.offsetWidth;
    feedback.classList.add("pop");
    if (correct) {
      finished = true;
      selected.classList.add("correct");
      feedback.textContent = Studio.t("right");
      document.getElementById("ask").textContent = Studio.t("done");
      Studio.done();
    } else {
      feedback.textContent = Studio.t("wrong");
      selected.classList.remove("chosen");
      selected = null;
    }
  });
  Studio.ready();
})();

</script>
