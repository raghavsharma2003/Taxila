<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;background:#fff8e9;font-family:system-ui,sans-serif;color:#53483c}
  .card{width:360px;height:320px;overflow:hidden;border:3px solid #f0ddbf;border-radius:24px;background:radial-gradient(circle at 50% 40%,#fffdf7,#fff6e5)}
  header{height:60px;padding:8px 12px 0;text-align:center}
  h1{margin:0;color:#79584d;font-size:17px;line-height:21px}
  [data-ask]{margin:2px 0 0;color:#416b55;font-size:19px;font-weight:750;line-height:24px}
  svg{display:block;width:354px;height:220px}
  .ground{fill:#f1e6d0}
  .leader{fill:none;stroke:#aa9b83;stroke-width:1.7;stroke-linecap:round}
  .name{fill:#554b40;font-size:14px;font-weight:750}
  .part{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .2s ease,filter .3s ease}
  .part:active{transform:scale(.94)}
  .part.glow{filter:drop-shadow(0 0 9px #f4b844) drop-shadow(0 0 4px #fff0aa);transform:scale(1.06)}
  .part .hit{fill:transparent;pointer-events:all}
  .part .art{pointer-events:none}
  footer{height:34px;text-align:center;font-size:16px;font-weight:700;line-height:29px;color:#a26859}
  footer.good{color:#408263}
</style>
<div class="card">
  <header><h1 id="title"></h1><p data-ask></p></header>
  <svg viewBox="0 0 354 220" role="img">
    <ellipse class="ground" cx="171" cy="204" rx="103" ry="10"/>
    <g class="leader">
      <path d="M83 43 L117 53"/>
      <path d="M242 96 L198 85"/>
      <path d="M242 144 L215 144"/>
      <path d="M67 149 L91 149"/>
      <path d="M241 196 L207 196"/>
    </g>
    <g class="part" data-part="">
      <path class="art" fill="#ee9c9e" d="M151 65 C119 65 111 42 129 30 C142 21 159 34 169 49 C177 29 194 22 207 34 C221 49 207 66 190 69 C213 73 218 92 203 101 C188 110 174 95 168 82 C157 102 138 108 126 94 C116 81 130 68 151 65Z"/>
      <rect class="hit" x="113" y="25" width="102" height="78"/>
    </g>
    <g class="part" data-part="">
      <circle class="art" cx="174" cy="78" r="27" fill="#f4c66a"/>
      <g class="art" fill="#b88749"><circle cx="165" cy="72" r="2"/><circle cx="183" cy="73" r="2"/><circle cx="174" cy="87" r="2"/></g>
      <circle class="hit" cx="174" cy="78" r="27"/>
    </g>
    <g class="part" data-part="">
      <path class="art" d="M174 105 Q183 139 174 180" fill="none" stroke="#72a36d" stroke-width="17" stroke-linecap="round"/>
      <rect class="hit" x="150" y="110" width="54" height="70"/>
    </g>
    <g class="part" data-part="">
      <path class="art" d="M164 140 Q121 109 94 134 Q109 172 164 151Z" fill="#82b77b"/>
      <path class="art" d="M102 137 Q128 143 158 146" fill="none" stroke="#609966" stroke-width="3"/>
      <rect class="hit" x="94" y="116" width="70" height="56"/>
    </g>
    <g class="part" data-part="">
      <path class="art" d="M174 177 L174 191 M174 187 Q155 188 145 207 M174 187 Q192 188 205 207 M164 192 L157 211 M185 192 L193 211" fill="none" stroke="#ae8266" stroke-width="8" stroke-linecap="round"/>
      <rect class="hit" x="143" y="165" width="64" height="54"/>
    </g>
    <g class="name">
      <text data-label="" x="18" y="42"></text>
      <text data-label="" x="244" y="101"></text>
      <text data-label="" x="244" y="141"></text>
      <text data-label="" x="17" y="146"></text>
      <text data-label="" x="243" y="193"></text>
    </g>
  </svg>
  <footer id="feedback" aria-live="polite"></footer>
</div>
<script>

(() => {
  const shapes = [...document.querySelectorAll('[data-part]')];
  const labels = [...document.querySelectorAll('[data-label]')];
  document.getElementById('title').textContent = Studio.t('title');
  document.querySelector('[data-ask]').textContent = Studio.t('ask');
  shapes.forEach((shape, i) => {
    const key = Studio.params.parts[i];
    if (!key) {
      shape.style.display = 'none';
      labels[i].style.display = 'none';
      return;
    }
    shape.setAttribute('data-part', key);
    labels[i].setAttribute('data-label', key);
    labels[i].textContent = Studio.t(key);
  });
  const feedback = document.getElementById('feedback');
  let pending = false, finished = false, chosen;
  shapes.forEach(shape => shape.addEventListener('click', () => {
    if (pending || finished || !shape.getAttribute('data-part')) return;
    pending = true;
    chosen = shape;
    Studio.answer(shape.getAttribute('data-part'));
  }));
  Studio.onVerdict(({correct}) => {
    if (!pending) return;
    pending = false;
    feedback.textContent = Studio.t(correct ? 'right' : 'wrong');
    feedback.classList.toggle('good', correct);
    if (correct) {
      finished = true;
      chosen.classList.add('glow');
      setTimeout(() => {
        feedback.textContent = Studio.t('done');
        Studio.done();
      }, 650);
    }
  });
  Studio.ready();
})();

</script>
