<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;font-family:system-ui,sans-serif}
  #card{width:360px;height:320px;overflow:hidden;padding:10px 16px;background:#fff7e9;color:#493b39;position:relative}
  #title{height:30px;font-size:20px;font-weight:800;line-height:30px}
  #ask{height:34px;font-size:16px;font-weight:650;line-height:34px}
  #key{height:42px;display:flex;align-items:center;gap:7px;padding:0 11px;border-radius:14px;background:#ffe8c8;font-size:14px;font-weight:700}
  #key [data-key]{display:flex;align-items:center;gap:7px}
  #rows{height:180px;padding-top:5px;display:flex;flex-direction:column;gap:5px}
  [data-row]{width:100%;min-height:55px;border:2px solid #eadbc9;border-radius:17px;background:#fffdf8;color:inherit;display:flex;align-items:center;text-align:left;padding:0 12px;cursor:pointer;transition:transform .18s,background .18s,border-color .18s}
  [data-row]:active{transform:scale(.97)}
  [data-row]:focus-visible{outline:3px solid #ad684e;outline-offset:1px}
  [data-row].chosen{border-color:#cf8065;background:#fff0dc}
  [data-row].correct{border-color:#6eae86;background:#e6f5e8}
  .name{flex:0 0 72px;font-size:17px;font-weight:750}
  .symbols{display:flex;align-items:center;gap:5px;flex-wrap:nowrap}
  [data-symbol],.key-symbol{width:25px;height:25px;flex:0 0 25px;display:block}
  #feedback{height:24px;line-height:24px;font-weight:750;font-size:15px;color:#985844}
  #feedback.good{color:#397853}
  svg{display:block}
</style>
<div id="card">
  <div id="title"></div>
  <div id="ask"></div>
  <div id="key"><span id="keytext"></span><span data-key></span></div>
  <div id="rows"></div>
  <div id="feedback" aria-live="polite"></div>
</div>
<script>

  const p=Studio.params;
  const flower='<svg viewBox="0 0 26 26" aria-hidden="true"><path d="M13 3c2.4 0 3.8 2.2 3.2 4.5 2-1.3 4.5-.7 5.5 1.4 1 2.1-.2 4.3-2.6 4.8 2.4.5 3.6 2.7 2.6 4.8-1 2.1-3.5 2.7-5.5 1.4.6 2.3-.8 4.5-3.2 4.5s-3.8-2.2-3.2-4.5c-2 1.3-4.5.7-5.5-1.4-1-2.1.2-4.3 2.6-4.8C2.8 12.6 1.6 10.4 2.6 8.3c1-2.1 3.5-2.7 5.5-1.4C7.5 4.6 8.9 3 13 3Z" fill="#e99870"/><circle cx="13" cy="13" r="4" fill="#ffe5a2"/></svg>';
  document.getElementById('title').textContent=Studio.t('title');
  document.getElementById('ask').textContent=Studio.t('ask');
  document.getElementById('keytext').textContent=Studio.t('keytext');
  const key=document.querySelector('[data-key]');
  const ks=document.createElement('span');
  ks.className='key-symbol';
  ks.innerHTML=flower;
  key.append(ks,document.createTextNode(' = '+p.symbolValue));
  const rows=document.getElementById('rows');
  const feedback=document.getElementById('feedback');
  let waiting=false,complete=false,selected=null;
  p.rows.forEach(item=>{
    const row=document.createElement('button');
    row.type='button';
    row.dataset.row=item.key;
    const name=document.createElement('span');
    name.className='name';
    name.textContent=Studio.t(item.key);
    const symbols=document.createElement('span');
    symbols.className='symbols';
    for(let i=0;i<item.value/p.symbolValue;i++){
      const symbol=document.createElement('span');
      symbol.setAttribute('data-symbol','');
      symbol.innerHTML=flower;
      symbols.append(symbol);
    }
    row.append(name,symbols);
    row.addEventListener('click',()=>{
      if(waiting||complete)return;
      waiting=true;
      selected=row;
      row.classList.add('chosen');
      feedback.textContent='';
      Studio.answer(item.key);
    });
    rows.append(row);
  });
  Studio.onVerdict(({correct})=>{
    if(!waiting||complete)return;
    waiting=false;
    if(correct){
      complete=true;
      selected.classList.add('correct');
      feedback.classList.add('good');
      feedback.textContent=Studio.t('right');
      setTimeout(()=>{feedback.textContent=Studio.t('done');Studio.done()},450);
    }else{
      feedback.classList.remove('good');
      feedback.textContent=Studio.t('wrong');
      selected.classList.remove('chosen');
    }
  });
  Studio.ready();

</script>
