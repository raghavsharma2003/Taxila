<style>
*{box-sizing:border-box}
html,body{margin:0;width:360px;height:320px;overflow:hidden}
#app{width:360px;height:320px;position:relative;overflow:hidden;padding:12px;background:#fff7e8;color:#49352d;font-family:system-ui,sans-serif}
#title{height:28px;text-align:center;font-size:18px;font-weight:800;line-height:24px;color:#704832}
#instr{height:32px;text-align:center;font-size:13px;line-height:16px;color:#785f4e}
#scene{height:145px;position:relative}
#support{position:absolute;left:165px;top:31px;width:30px;height:100px;background:#d19a56;clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:4px}
#beam{position:absolute;left:36px;top:31px;width:264px;height:10px;border-radius:10px;background:#a66b3d;transform-origin:50% 50%;transition:transform .75s cubic-bezier(.2,.8,.25,1);z-index:2}
#beam[data-tilt="left"]{transform:rotate(12deg)}
#beam[data-tilt="right"]{transform:rotate(-12deg)}
#beam[data-tilt="level"]{transform:rotate(0deg)}
#pivot{position:absolute;left:159px;top:23px;width:42px;height:42px;border-radius:50%;background:#efbc69;border:5px solid #fff1cf;z-index:3}
.pan{position:absolute;top:75px;width:108px;height:62px;border-bottom:6px solid #a66b3d;border-radius:0 0 50% 50%;display:flex;align-items:flex-end;justify-content:center;gap:4px;padding:0 4px 8px;transition:top .75s cubic-bezier(.2,.8,.25,1);z-index:1}
#leftPan{left:9px}
#rightPan{right:9px}
#leftPan.down,#rightPan.down{top:87px}
.weight{min-width:28px;height:27px;padding:3px 5px;border-radius:9px 9px 5px 5px;background:#f2b85f;border:2px solid #d48d3b;color:#533e2e;text-align:center;font-size:13px;font-weight:800;line-height:17px;box-shadow:0 3px 0 #c88335}
.weight.option{width:64px;height:56px;min-width:64px;padding:0;border-radius:14px;background:#ffd477;border:2px solid #e6a544;color:#533e2e;font-size:17px;font-weight:800;line-height:52px;text-align:center;cursor:pointer;transition:transform .16s,background .2s,box-shadow .2s;box-shadow:0 4px 0 #c88335}
.weight.option:active{transform:scale(.91)}
.weight.option:hover{background:#ffe09a}
#options{height:64px;display:flex;justify-content:center;align-items:center;gap:12px}
#feedback{height:24px;text-align:center;font-size:14px;font-weight:700;color:#795343}
#decoration{position:absolute;left:6px;top:7px;width:22px;height:22px}
#options[aria-disabled="true"] .option{pointer-events:none;opacity:.72}
</style>
<div id="app">
  <div id="title"></div>
  <div id="instr"></div>
  <svg id="decoration" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8 8 5 11 5 15a7 7 0 0 0 14 0c0-4-3-7-7-13Z" fill="#f3bd70"/><path d="M9 16c0 2 1 3 3 3" fill="none" stroke="#fff2d3" stroke-width="2" stroke-linecap="round"/></svg>
  <div id="scene" aria-label="">
    <div id="support"></div>
    <div id="beam" data-beam data-tilt="level"></div>
    <div id="pivot"></div>
    <div id="leftPan" class="pan" data-pan="left" data-total="0"></div>
    <div id="rightPan" class="pan" data-pan="right" data-total="0"></div>
  </div>
  <div id="options"></div>
  <div id="feedback"></div>
</div>
<script>

(function(){
  const items=Studio.params.items;
  const title=document.getElementById("title");
  const instr=document.getElementById("instr");
  const leftPan=document.getElementById("leftPan");
  const rightPan=document.getElementById("rightPan");
  const beam=document.getElementById("beam");
  const optionsEl=document.getElementById("options");
  const feedback=document.getElementById("feedback");
  title.textContent=Studio.t("title");
  instr.textContent=Studio.t("instr");
  let index=0,chosen=null,locked=false,completed=false;
  const total=values=>values.reduce((sum,value)=>sum+value,0);
  const tiltFor=(left,right)=>left>right?"left":right>left?"right":"level";
  function makeWeight(value,option){
    const element=document.createElement(option?"button":"div");
    element.className=option?"weight option":"weight";
    element.dataset.weight=String(value);
    element.textContent=String(value);
    if(option){
      element.type="button";
      element.dataset.option=String(value);
    }
    return element;
  }
  function setTilt(tilt){
    beam.dataset.tilt=tilt;
    leftPan.classList.toggle("down",tilt==="left");
    rightPan.classList.toggle("down",tilt==="right");
  }
  function finish(){
    if(completed)return;
    completed=true;
    title.textContent=Studio.t("done");
    instr.textContent="";
    feedback.textContent="";
    leftPan.replaceChildren();
    rightPan.replaceChildren();
    optionsEl.replaceChildren();
    leftPan.dataset.total="0";
    rightPan.dataset.total="0";
    setTilt("level");
    Studio.done();
  }
  function render(){
    if(index>=items.length){finish();return}
    chosen=null;
    locked=false;
    feedback.textContent="";
    optionsEl.setAttribute("aria-disabled","false");
    const item=items[index];
    leftPan.replaceChildren(...item.left.map(value=>makeWeight(value,false)));
    rightPan.replaceChildren(...item.right.map(value=>makeWeight(value,false)));
    const left=total(item.left),right=total(item.right);
    leftPan.dataset.total=String(left);
    rightPan.dataset.total=String(right);
    setTilt(tiltFor(left,right));
    optionsEl.replaceChildren();
    item.options.forEach(value=>{
      const button=makeWeight(value,true);
      const choose=()=>{
        if(locked)return;
        locked=true;
        chosen={value,button};
        optionsEl.setAttribute("aria-disabled","true");
        button.remove();
        rightPan.appendChild(makeWeight(value,false));
        const newRight=right+value;
        rightPan.dataset.total=String(newRight);
        setTilt(tiltFor(left,newRight));
        Studio.event("choose",{value});
        Studio.answer({value});
      };
      button.addEventListener("click",choose);
      optionsEl.appendChild(button);
    });
  }
  Studio.onVerdict(result=>{
    if(completed||!chosen)return;
    const selected=chosen;
    if(result.correct){
      feedback.textContent=Studio.t("right");
      setTilt("level");
      Studio.event("verdict",{result:"correct"});
      window.setTimeout(()=>{
        if(completed)return;
        index++;
        if(index>=items.length)finish();
        else render();
      },850);
    }else{
      feedback.textContent=Studio.t("wrong");
      Studio.event("verdict",{result:"wrong"});
      window.setTimeout(()=>{
        if(completed)return;
        const item=items[index];
        const right=total(item.right);
        const carried=Array.from(rightPan.children).find(element=>element.dataset.weight===String(selected.value));
        if(carried)carried.remove();
        rightPan.dataset.total=String(right);
        setTilt(tiltFor(total(item.left),right));
        optionsEl.appendChild(selected.button);
        chosen=null;
        locked=false;
        optionsEl.setAttribute("aria-disabled","false");
        feedback.textContent="";
      },850);
    }
  });
  render();
  Studio.ready();
})();

</script>
