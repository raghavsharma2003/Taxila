<style>
  *{box-sizing:border-box}
  body{margin:0}
  #game{width:360px;height:320px;overflow:hidden;padding:14px;background:#fff8ed;color:#493b35;font-family:system-ui,sans-serif;display:flex;flex-direction:column;gap:9px}
  #title{margin:0;font-size:21px;line-height:25px;font-weight:800}
  #instr{margin:0;font-size:13px;line-height:18px;color:#79675c}
  #cards{height:112px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:8px}
  .card{width:100px;height:52px;border:2px solid #e7d3b9;border-radius:17px;background:#fff;color:#493b35;font:700 16px system-ui,sans-serif;box-shadow:0 3px 0 #e7d3b9;cursor:pointer;transition:transform .22s ease,box-shadow .22s ease,opacity .22s ease;touch-action:manipulation}
  .card:active,.bin:active{transform:scale(.96)}
  .card[data-selected="true"]{transform:translateY(-7px) scale(1.04);box-shadow:0 8px 0 #e7d3b9,0 0 0 4px #ffe4a7}
  .card.wrong{animation:shake .38s ease}
  @keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
  #feedback{height:19px;text-align:center;font-size:13px;font-weight:700;color:#91704d}
  #bins{display:flex;gap:10px;flex:1;min-height:0}
  .bin{flex:1;min-width:0;border:2px solid #d8bda4;border-radius:19px;background:#f5e8d8;padding:8px;cursor:pointer;transition:transform .18s,background .2s;touch-action:manipulation}
  .bin:nth-child(2){background:#e9eee5;border-color:#bed0b8}
  .bin.pulse{animation:pulse .35s ease}
  @keyframes pulse{50%{transform:scale(1.045)}}
  .bin-name{text-align:center;font-size:15px;font-weight:800}
  .placed{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:6px}
  .placed-card{padding:3px 7px;border-radius:9px;background:#fff;font-size:12px;font-weight:700;animation:arrive .3s ease both}
  @keyframes arrive{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
</style>
<div id="game">
  <div>
    <h1 id="title"></h1>
    <p id="instr"></p>
  </div>
  <div id="cards"></div>
  <div id="feedback" aria-live="polite"></div>
  <div id="bins"></div>
</div>
<script>

  const p=Studio.params;
  const cards=document.getElementById('cards');
  const bins=document.getElementById('bins');
  const feedback=document.getElementById('feedback');
  document.getElementById('title').textContent=Studio.t('title');
  document.getElementById('instr').textContent=Studio.t('instr');
  let selected=null, pending=null, placed=0;
  p.cards.forEach(key=>{
    const card=document.createElement('button');
    card.type='button';
    card.className='card';
    card.dataset.card=key;
    card.dataset.selected='false';
    card.textContent=Studio.t(key);
    card.addEventListener('click',()=>{
      if(pending)return;
      if(selected)selected.dataset.selected='false';
      selected=card;
      card.dataset.selected='true';
      feedback.textContent='';
      Studio.event('pick',{card:key});
    });
    cards.append(card);
  });
  p.bins.forEach(key=>{
    const bin=document.createElement('div');
    bin.className='bin';
    bin.dataset.bin=key;
    bin.setAttribute('role','button');
    bin.tabIndex=0;
    const name=document.createElement('div');
    name.className='bin-name';
    name.textContent=Studio.t(key);
    const contents=document.createElement('div');
    contents.className='placed';
    bin.append(name,contents);
    const choose=()=>{
      if(!selected||pending)return;
      pending={card:selected,bin,key};
      Studio.event('sort',{card:selected.dataset.card,bin:key});
      Studio.answer({card:selected.dataset.card,bin:key});
    };
    bin.addEventListener('click',choose);
    bin.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}
    });
    bins.append(bin);
  });
  Studio.onVerdict(({correct})=>{
    if(!pending)return;
    const {card,bin,key}=pending;
    pending=null;
    card.dataset.selected='false';
    selected=null;
    if(correct){
      feedback.textContent=Studio.t('right');
      const a=card.getBoundingClientRect(),b=bin.getBoundingClientRect();
      card.style.transform=`translate(${b.left+b.width/2-a.left-a.width/2}px,${b.top+b.height/2-a.top-a.height/2}px) scale(.7)`;
      card.style.opacity='0';
      bin.classList.remove('pulse');
      void bin.offsetWidth;
      bin.classList.add('pulse');
      setTimeout(()=>{
        const chip=document.createElement('span');
        chip.className='placed-card';
        chip.dataset.placed=key;
        chip.textContent=card.textContent;
        bin.querySelector('.placed').append(chip);
        card.remove();
        placed++;
        if(placed===p.cards.length){
          feedback.textContent=Studio.t('done');
          Studio.done();
        }
      },260);
    }else{
      feedback.textContent=Studio.t('wrong');
      card.classList.remove('wrong');
      void card.offsetWidth;
      card.classList.add('wrong');
      setTimeout(()=>card.classList.remove('wrong'),400);
    }
  });
  Studio.ready();

</script>
