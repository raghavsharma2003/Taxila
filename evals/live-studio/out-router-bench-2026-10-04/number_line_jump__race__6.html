<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;background:#fff7eb;font-family:system-ui,sans-serif;color:#493c48}
  #game{width:360px;height:320px;padding:14px 16px;display:flex;flex-direction:column;align-items:center;gap:8px}
  h1{font-size:19px;line-height:24px;margin:0;color:#774b65;text-align:center}
  #instruction{font-size:13px;line-height:18px;text-align:center;min-height:18px}
  #item{width:100%;height:45px;display:flex;align-items:center;justify-content:center;gap:10px;background:#ffe8cc;border-radius:16px}
  #target{font-size:24px;font-weight:800;color:#7b4465}
  #lineWrap{position:relative;width:328px;height:105px;margin-top:2px}
  svg{display:block;width:328px;height:105px;overflow:visible}
  #axis{stroke:#b68d85;stroke-width:4;stroke-linecap:round}
  .tick line{stroke:#9e7980;stroke-width:2.5;stroke-linecap:round}
  .tick text{fill:#604b56;font-size:13px;font-weight:700;text-anchor:middle}
  #marker{position:absolute;top:5px;width:30px;height:40px;transform:translateX(-50%);transition:left .24s ease,transform .24s ease}
  #marker svg{width:30px;height:40px;filter:drop-shadow(0 3px 2px #885a5933)}
  #marker.hop{animation:hop .55s ease}
  @keyframes hop{50%{transform:translate(-50%,-19px) scale(1.13)}}
  #feedback{height:20px;font-size:14px;font-weight:700;text-align:center;color:#86516a}
  #controls{display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
  button{border:0;border-radius:17px;min-width:67px;height:55px;padding:0 12px;background:#eed6c9;color:#573f50;font:700 15px system-ui,sans-serif;cursor:pointer;box-shadow:0 4px 0 #d7b7ae;transition:transform .14s,box-shadow .14s}
  button:active{transform:translateY(3px) scale(.96);box-shadow:0 1px 0 #d7b7ae}
  button[data-action="check"]{min-width:104px;background:#a85e7a;color:white;box-shadow:0 4px 0 #87465f}
  button[data-action="check"]:active{box-shadow:0 1px 0 #87465f}
  button:disabled{opacity:.45;cursor:default}
  #game.finished #item,#game.finished #lineWrap,#game.finished #controls{display:none}
  #game.finished #feedback{margin:auto;font-size:22px;height:auto}
</style>
<div id="game">
  <h1 id="title"></h1>
  <div id="instruction"></div>
  <div id="item" data-item=""><span id="target" data-target></span></div>
  <div id="lineWrap">
    <svg viewBox="0 0 328 105" aria-hidden="true">
      <line id="axis" x1="22" y1="61" x2="306" y2="61"></line>
      <g id="ticks"></g>
    </svg>
    <div id="marker" data-marker data-value=""><svg viewBox="0 0 30 40" aria-hidden="true"><path d="M15 38 C12 32 2 22 2 15 A13 13 0 1 1 28 15 C28 22 18 32 15 38Z" fill="#e57b83"/><circle cx="15" cy="15" r="5" fill="#fff7eb"/></svg></div>
  </div>
  <div id="feedback" aria-live="polite"></div>
  <div id="controls">
    <button type="button" data-action="left"></button>
    <button type="button" data-action="check"></button>
    <button type="button" data-action="right"></button>
  </div>
</div>
<script>

(()=>{
  const p=Studio.params, game=document.querySelector('#game'), ticks=document.querySelector('#ticks');
  const marker=document.querySelector('#marker'), item=document.querySelector('#item');
  const target=document.querySelector('#target'), feedback=document.querySelector('#feedback');
  const buttons={
    left:document.querySelector('[data-action="left"]'),
    right:document.querySelector('[data-action="right"]'),
    check:document.querySelector('[data-action="check"]')
  };
  const round=n=>Math.round(n*1000000)/1000000;
  const count=Math.round((p.max-p.min)/p.step);
  const value=k=>round(p.min+k*p.step);
  const x=k=>22+284*k/count;
  const fmt=n=>{
    if(p.format==='fraction') return String(Math.round(n*p.den))+'/'+String(p.den);
    return String(round(n));
  };
  document.querySelector('#title').textContent=Studio.t('title');
  document.querySelector('#instruction').textContent=Studio.t('instr');
  buttons.left.textContent=Studio.t('left');
  buttons.right.textContent=Studio.t('right_btn');
  buttons.check.textContent=Studio.t('check');
  for(let k=0;k<=count;k++){
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','tick');
    g.setAttribute('data-tick',String(value(k)));
    g.setAttribute('transform',`translate(${x(k)} 0)`);
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1','0');line.setAttribute('x2','0');
    line.setAttribute('y1','52');line.setAttribute('y2','70');
    g.append(line);
    if(k%p.labelEvery===0){
      const text=document.createElementNS('http://www.w3.org/2000/svg','text');
      text.setAttribute('x','0');text.setAttribute('y','91');
      text.textContent=fmt(value(k));g.append(text);
    }
    ticks.append(g);
  }
  let index=0,k=Math.max(0,Math.min(count,Math.round((p.start-p.min)/p.step))),busy=false;
  function place(){
    marker.style.left=x(k)+'px';
    marker.dataset.value=String(value(k));
    buttons.left.disabled=busy||k===0;
    buttons.right.disabled=busy||k===count;
    buttons.check.disabled=busy;
  }
  function showItem(){
    item.dataset.item=String(p.items[index].id);
    target.textContent=fmt(p.items[index].target);
    k=Math.max(0,Math.min(count,Math.round((p.start-p.min)/p.step)));
    feedback.textContent='';
    busy=false;place();
  }
  buttons.left.addEventListener('click',()=>{if(busy||k===0)return;k--;feedback.textContent='';place();Studio.event('move',{direction:'left'});});
  buttons.right.addEventListener('click',()=>{if(busy||k===count)return;k++;feedback.textContent='';place();Studio.event('move',{direction:'right'});});
  buttons.check.addEventListener('click',()=>{if(busy)return;busy=true;place();Studio.answer({value:value(k)});});
  Studio.onVerdict(({correct})=>{
    if(correct){
      feedback.textContent=Studio.t('right');
      marker.classList.remove('hop');void marker.offsetWidth;marker.classList.add('hop');
      setTimeout(()=>{
        marker.classList.remove('hop');
        index++;
        if(index>=p.items.length){
          game.classList.add('finished');
          feedback.textContent=Studio.t('done');
          Studio.done();
        }else showItem();
      },650);
    }else{
      feedback.textContent=Studio.t('wrong');
      busy=false;place();
    }
  });
  showItem();
  Studio.ready();
})();

</script>
