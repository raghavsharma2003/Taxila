<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;background:#fff8ed;font-family:system-ui,sans-serif;color:#593c31}
  .card{width:360px;height:320px;padding:15px 18px;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden}
  .card:before,.card:after{content:"";position:absolute;border-radius:50%;background:#ffe9cd;pointer-events:none}
  .card:before{width:110px;height:110px;left:-66px;top:-48px}
  .card:after{width:85px;height:85px;right:-45px;bottom:-42px}
  h1{font-size:20px;line-height:24px;margin:0 0 3px;font-weight:800;text-align:center}
  .instruction{font-size:13px;line-height:18px;text-align:center;min-height:18px}
  .target{margin:8px 0 2px;min-height:37px;font-size:31px;line-height:37px;font-weight:850;color:#b34e38;letter-spacing:1px}
  .picture{width:320px;height:145px;flex:none;overflow:visible}
  [data-part]{cursor:pointer;transition:fill .2s,transform .18s;transform-box:fill-box;transform-origin:center;stroke:#fff8ed;stroke-width:4}
  [data-part]:active{transform:scale(.94)}
  .controls{display:flex;align-items:center;justify-content:center;width:100%;gap:10px;margin-top:2px}
  button{min-width:142px;min-height:52px;border:0;border-radius:18px;background:#d86d49;color:white;font:800 17px system-ui,sans-serif;box-shadow:0 5px 0 #a84330;cursor:pointer;transition:transform .15s,box-shadow .15s}
  button:active{transform:translateY(4px) scale(.97);box-shadow:0 1px 0 #a84330}
  button:disabled{opacity:.65}
  .message{height:22px;margin-top:8px;font-size:14px;font-weight:700;text-align:center;color:#a54c38}
  .celebrate .picture{animation:bounce .55s ease}
  .celebrate .message{color:#35836a}
  .shake .picture{animation:wiggle .35s ease}
  .finished{justify-content:center;gap:20px}
  .finished h1{font-size:27px}
  .finished .instruction,.finished .target,.finished .picture,.finished .controls{display:none}
  .finished .message{font-size:19px;color:#35836a;height:auto}
  @keyframes bounce{50%{transform:translateY(-9px) scale(1.04)}}
  @keyframes wiggle{25%,75%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
</style>
<div class="card" id="card" data-item="">
  <h1 id="title"></h1>
  <div class="instruction" id="instruction"></div>
  <div class="target" data-target></div>
  <svg class="picture" viewBox="0 0 320 145" aria-hidden="true">
    <g id="parts"></g>
  </svg>
  <div class="controls"><button type="button" data-action="check" id="check"></button></div>
  <div class="message" id="message" aria-live="polite"></div>
</div>
<script>

(() => {
  const items=Studio.params.items;
  const card=document.getElementById('card');
  const title=document.getElementById('title');
  const instruction=document.getElementById('instruction');
  const target=card.querySelector('[data-target]');
  const parts=document.getElementById('parts');
  const check=document.getElementById('check');
  const message=document.getElementById('message');
  const ns='http://www.w3.org/2000/svg';
  let index=0, waiting=false, finished=false;
  title.textContent=Studio.t('title');
  instruction.textContent=Studio.t('instr');
  check.textContent=Studio.t('check');
  function shape(tag,attributes){
    const el=document.createElementNS(ns,tag);
    for(const [key,value] of Object.entries(attributes)) el.setAttribute(key,String(value));
    return el;
  }
  function paint(el,on){
    el.setAttribute('data-shaded',String(on));
    el.setAttribute('fill',on?'#e98156':'#f4dcb9');
  }
  function render(){
    const item=items[index];
    card.dataset.item=item.id;
    card.classList.remove('celebrate','shake');
    target.textContent=item.n+'/'+item.d;
    message.textContent='';
    parts.replaceChildren();
    for(let i=0;i<item.d;i++){
      let el;
      if(Studio.params.picture==='pizza'){
        const cx=160,cy=72,r=67;
        const a=-Math.PI/2+2*Math.PI*i/item.d;
        const b=-Math.PI/2+2*Math.PI*(i+1)/item.d;
        const x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a);
        const x2=cx+r*Math.cos(b),y2=cy+r*Math.sin(b);
        el=shape('path',{d:`M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${b-a>Math.PI?1:0} 1 ${x2} ${y2} Z`});
      }else{
        const columns=Math.min(item.d,4);
        const rows=Math.ceil(item.d/columns);
        const gap=5, width=(306-gap*(columns-1))/columns;
        const height=Math.min(60,(135-gap*(rows-1))/rows);
        const row=Math.floor(i/columns),col=i%columns;
        const rowCount=Math.min(columns,item.d-row*columns);
        const start=(320-(rowCount*width+(rowCount-1)*gap))/2;
        const y=(145-(rows*height+(rows-1)*gap))/2+row*(height+gap);
        el=shape('rect',{x:start+col*(width+gap),y,width,height,rx:12});
      }
      el.dataset.part=String(i);
      paint(el,false);
      el.addEventListener('click',()=>{
        if(waiting||finished)return;
        paint(el,el.dataset.shaded!=='true');
        message.textContent='';
        card.classList.remove('shake');
        Studio.event('part',{part:i,shaded:el.dataset.shaded});
      });
      parts.append(el);
    }
  }
  check.addEventListener('click',()=>{
    if(waiting||finished)return;
    waiting=true;
    check.disabled=true;
    const count=parts.querySelectorAll('[data-shaded="true"]').length;
    Studio.event('check',{n:count,d:items[index].d});
    Studio.answer({n:count,d:items[index].d});
  });
  Studio.onVerdict(({correct})=>{
    if(!waiting||finished)return;
    if(correct){
      message.textContent=Studio.t('right');
      card.classList.add('celebrate');
      setTimeout(()=>{
        if(index+1<items.length){
          index++;
          waiting=false;
          check.disabled=false;
          render();
        }else{
          finished=true;
          card.classList.remove('celebrate');
          card.classList.add('finished');
          card.removeAttribute('data-item');
          title.textContent=Studio.t('done');
          message.textContent=Studio.t('done');
          Studio.done();
        }
      },650);
    }else{
      waiting=false;
      check.disabled=false;
      message.textContent=Studio.t('wrong')+' '+Studio.t('hint');
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
    }
  });
  render();
  Studio.ready();
})();

</script>
