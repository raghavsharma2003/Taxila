<style>
*{box-sizing:border-box}
html,body{width:360px;height:320px;margin:0;overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff8ec;color:#493d32}
.card{width:360px;height:320px;padding:10px 12px;background:radial-gradient(ellipse at 50% 75%,#fff0d7 0%,#fff8ec 67%);position:relative;display:flex;flex-direction:column;align-items:center}
h1{font-size:18px;line-height:23px;margin:0 0 2px;font-weight:750;color:#65503b}
.question{font-size:15px;line-height:20px;text-align:center;min-height:22px;color:#775a42}
svg{display:block;width:336px;height:246px;flex:none}
.part{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:filter .22s ease,transform .18s ease}
.part:active{transform:scale(.94)}
.part:focus{outline:none}
.part:focus-visible{filter:drop-shadow(0 0 4px #d78a39)}
.hit{fill:transparent;pointer-events:all}
.petalshape{fill:#f28e78;stroke:#d87363;stroke-width:2}
.centreshape{fill:#f4c452;stroke:#dc9f32;stroke-width:2}
.stemshape{fill:none;stroke:#559267;stroke-width:12;stroke-linecap:round}
.leafshape{fill:#80bd75;stroke:#559267;stroke-width:2}
.rootshape{fill:none;stroke:#9a704c;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.leader{fill:none;stroke:#b59c7f;stroke-width:1.6;stroke-linecap:round}
.label{font-size:13px;font-weight:650;fill:#65503b}
.feedback{position:absolute;left:12px;right:12px;bottom:3px;min-height:19px;font-size:13px;font-weight:700;color:#56835c;text-align:center;line-height:17px;white-space:nowrap;overflow:hidden}
.glow{filter:drop-shadow(0 0 8px #f1bb48)!important}
</style>

<script>

(()=>{
const params=Studio.params;
const keys=params.parts;
const title=document.getElementById("title");
const question=document.getElementById("question");
const parts=[...document.querySelectorAll("[data-part]")];
const labels=[...document.querySelectorAll("[data-label]")];
title.textContent=Studio.t("title");
question.textContent=Studio.t("ask");
parts.forEach((part,i)=>{
const key=keys[i];
part.setAttribute("data-part",key);
part.setAttribute("aria-label",Studio.t(key));
});
labels.forEach((label,i)=>{
const key=keys[i];
label.setAttribute("data-label",key);
label.textContent=Studio.t(key);
});
let chosen=null,finished=false;
const feedback=document.getElementById("feedback");
const commit=part=>{
if(finished)return;
chosen=part.getAttribute("data-part");
feedback.textContent="";
Studio.event("tap",{part:chosen});
Studio.answer(chosen);
};
parts.forEach(part=>{
part.addEventListener("click",()=>commit(part));
part.addEventListener("keydown",event=>{
if(event.key==="Enter"||event.key===" "){event.preventDefault();commit(part)}
});
});
Studio.onVerdict(result=>{
if(finished||!chosen)return;
if(result.correct){
finished=true;
parts.find(part=>part.getAttribute("data-part")===chosen).classList.add("glow");
feedback.textContent=Studio.t("right")+" "+Studio.t("done");
Studio.event("verdict",{result:"correct"});
Studio.done();
}else{
feedback.textContent=Studio.t("wrong");
Studio.event("verdict",{result:"wrong"});
}
});
Studio.ready();
})();

</script>
