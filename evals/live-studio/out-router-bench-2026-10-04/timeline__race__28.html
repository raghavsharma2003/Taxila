<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;background:#fff7e9;font-family:system-ui,sans-serif;color:#543d37}
  #scene{position:relative;width:360px;height:320px;overflow:hidden;background:radial-gradient(circle at 92% 5%,#ffe4c4 0,transparent 38%),#fff7e9}
  #title{position:absolute;top:8px;left:16px;right:16px;font-size:21px;font-weight:800}
  #ask{position:absolute;top:39px;left:16px;right:16px;font-size:14px;font-weight:650}
  svg{position:absolute;inset:0;width:360px;height:320px;pointer-events:none}
  [data-axis]{stroke:#b78369;stroke-width:5;stroke-linecap:round}
  .join{stroke:#d4a78a;stroke-width:2.5;stroke-linecap:round}
  [data-event]{fill:#e28d69;stroke:#fff7e9;stroke-width:3}
  .card{position:absolute;width:100px;height:64px;border:2px solid #eac3a5;border-radius:18px;background:#fffdf7;color:#543d37;box-shadow:0 4px 0 #e8d5be;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:5px;text-align:center;cursor:pointer;transition:transform .2s,background .2s,box-shadow .2s}
  .card:active{transform:scale(.93)}
  .card:focus-visible{outline:3px solid #936a92;outline-offset:2px}
  .card .name{font-size:13px;font-weight:750;line-height:1.1}
  .card .year{font-size:12px;color:#87645a}
  .card.chosen{background:#ffe4c9;transform:scale(1.05);box-shadow:0 5px 0 #d9a98c}
  #feedback{position:absolute;top:268px;left:16px;right:16px;min-height:42px;display:grid;place-items:center;text-align:center;font-size:17px;font-weight:800;color:#765074}
  #feedback.pop{animation:pop .35s ease-out}
  @keyframes pop{50%{transform:scale(1.08)}}
</style>
<div id="scene">
  <div id="title"></div>
  <div id="ask"></div>
  <svg viewBox="0 0 360 320" aria-hidden="true">
    <line data-axis x1="35" y1="165" x2="325" y2="165"></line>
    <g id="joins"></g>
    <g id="markers"></g>
  </svg>
  <div id="cards"></div>
  <div id="feedback" aria-live="polite"></div>
</div>
<script>

(() => {
  const events = [...Studio.params.events].sort((a,b) => a.year-b.year);
  const slots = [{x:4,y:75},{x:110,y:75},{x:164,y:190},{x:256,y:75}];
  const min = events[0].year, max = events[events.length-1].year;
  const ns = "http://www.w3.org/2000/svg";
  const cards = document.getElementById("cards");
  const markers = document.getElementById("markers");
  const joins = document.getElementById("joins");
  const feedback = document.getElementById("feedback");
  document.getElementById("title").textContent = Studio.t("title");
  document.getElementById("ask").textContent = Studio.t("ask");
  let waiting = false, finished = false;
  events.forEach((event,i) => {
    const slot = slots[i] || {x:Math.min(256,4+(i%4)*84),y:i%2?190:75};
    const x = min===max ? 180 : 35+(event.year-min)*290/(max-min);
    const join = document.createElementNS(ns,"line");
    join.setAttribute("class","join");
    join.setAttribute("x1",x);
    join.setAttribute("y1",165);
    join.setAttribute("x2",slot.x+50);
    join.setAttribute("y2",slot.y<165?139:190);
    joins.appendChild(join);
    const marker = document.createElementNS(ns,"circle");
    marker.setAttribute("data-event",event.key);
    marker.setAttribute("data-year",String(event.year));
    marker.setAttribute("cx",x);
    marker.setAttribute("cy",165);
    marker.setAttribute("r",8);
    markers.appendChild(marker);
    const card = document.createElement("button");
    card.type="button";
    card.className="card";
    card.setAttribute("data-card",event.key);
    card.style.left=slot.x+"px";
    card.style.top=slot.y+"px";
    const name=document.createElement("span");
    name.className="name";
    name.textContent=Studio.t(event.key);
    const year=document.createElement("span");
    year.className="year";
    year.textContent=String(event.year);
    card.append(name,year);
    card.addEventListener("click",() => {
      if(waiting||finished)return;
      waiting=true;
      card.classList.add("chosen");
      Studio.answer(event.key);
    });
    cards.appendChild(card);
  });
  Studio.onVerdict(({correct}) => {
    feedback.textContent=Studio.t(correct?"right":"wrong");
    feedback.classList.remove("pop");
    void feedback.offsetWidth;
    feedback.classList.add("pop");
    if(correct){
      finished=true;
      setTimeout(() => {
        feedback.textContent=Studio.t("done");
        Studio.done();
      },650);
    }else{
      waiting=false;
      cards.querySelectorAll(".card").forEach(card => card.classList.remove("chosen"));
    }
  });
  Studio.ready();
})();

</script>
