<style>
*{box-sizing:border-box}
body{margin:0;width:360px;height:320px;overflow:hidden;font-family:system-ui,sans-serif;background:#fff8ec;color:#49352d}
#app{width:360px;height:320px;padding:12px 16px;display:flex;flex-direction:column;align-items:center;gap:7px}
h1{font-size:19px;line-height:23px;margin:0;color:#754a32}
#instr{font-size:13px;line-height:17px;margin:0;text-align:center;color:#735e50}
#item{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:0}
#target{font-size:28px;font-weight:800;line-height:34px;color:#b65336;background:#ffead8;border-radius:14px;padding:1px 15px;letter-spacing:1px}
#whole{width:100%;display:grid;justify-content:center;align-content:center;gap:6px;max-height:144px;overflow:hidden}
.part{min-width:52px;min-height:52px;border:2px solid #c89563;border-radius:9px;background:#ffe7bd;box-shadow:inset 0 -3px 0 #ebcf9e;cursor:pointer;transition:transform .16s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease;padding:0}
.part:hover{transform:translateY(-2px)}
.part:active{transform:scale(.92)}
.part[aria-pressed="true"]{background:#ed7955;border-color:#bb563b;box-shadow:inset 0 -3px 0 #d25f43;animation:pop .25s ease}
#check{min-height:52px;min-width:120px;border:0;border-radius:17px;background:#52866a;color:white;font:700 17px system-ui,sans-serif;box-shadow:0 4px 0 #37654e;cursor:pointer;transition:transform .15s ease}
#check:active{transform:translateY(3px) scale(.97);box-shadow:0 1px 0 #37654e}
#feedback{min-height:22px;font-size:14px;font-weight:700;color:#52866a;text-align:center}
#feedback.bad{color:#a45d4e}
#doneScreen{display:none;width:100%;height:100%;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center}
#doneScreen h1{font-size:25px}
#confetti{font-size:44px;animation:bob 1s ease-in-out infinite alternate}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes bob{to{transform:translateY(-7px) rotate(5deg)}}
</style>
<div id="app">
  <section id="play">
    <h1 id="title"></h1>
    <p id="instr"></p>
    <div id="item" data-item="">
      <div id="target" data-target></div>
      <div id="whole"></div>
    </div>
    <button id="check" data-action="check" type="button"></button>
    <div id="feedback" aria-live="polite"></div>
  </section>
  <section id="doneScreen">
    <div id="confetti" aria-hidden="true">✦</div>
    <h1 id="doneText"></h1>
    <p id="hintText"></p>
  </section>
</div>
<script>

(function(){
  const items=Studio.params.items;
  const play=document.getElementById('play');
  const itemBox=document.getElementById('item');
  const whole=document.getElementById('whole');
  const target=document.getElementById('target');
  const check=document.getElementById('check');
  const feedback=document.getElementById('feedback');
  let current=0, parts=[];
  document.getElementById('title').textContent=Studio.t('title');
  document.getElementById('instr').textContent=Studio.t('instr');
  check.textContent=Studio.t('check');
  function draw(){
    const item=items[current];
    itemBox.dataset.item=item.id;
    target.textContent=item.n+'/'+item.d;
    whole.replaceChildren();
    parts=[];
    const cols=Math.min(item.d,4);
    whole.style.gridTemplateColumns='repeat('+cols+', minmax(52px, 72px))';
    for(let i=0;i<item.d;i++){
      const part=document.createElement('button');
      part.type='button';
      part.className='part';
      part.dataset.part=String(i);
      part.dataset.shaded='false';
      part.setAttribute('aria-pressed','false');
      part.setAttribute('aria-label',Studio.t('hint'));
      part.addEventListener('click',function(){
        const shaded=part.dataset.shaded!=='true';
        part.dataset.shaded=String(shaded);
        part.setAttribute('aria-pressed',String(shaded));
        Studio.event('tap',{part:i,shaded:shaded?'yes':'no'});
      });
      parts.push(part);
      whole.appendChild(part);
    }
    feedback.textContent='';
    feedback.className='';
  }
  check.addEventListener('click',function(){
    const n=parts.filter(p=>p.dataset.shaded==='true').length;
    Studio.event('check',{n:n});
    Studio.answer({n:n,d:items[current].d});
  });
  Studio.onVerdict(function(result){
    if(result.correct){
      feedback.className='';
      feedback.textContent=Studio.t('right');
      if(current+1<items.length){
        current++;
        window.setTimeout(draw,700);
      }else{
        window.setTimeout(function(){
          play.style.display='none';
          document.getElementById('doneText').textContent=Studio.t('done');
          document.getElementById('hintText').textContent=Studio.t('hint');
          document.getElementById('doneScreen').style.display='flex';
          Studio.done();
        },700);
      }
    }else{
      feedback.className='bad';
      feedback.textContent=Studio.t('wrong');
    }
  });
  draw();
  Studio.ready();
})();

</script>
