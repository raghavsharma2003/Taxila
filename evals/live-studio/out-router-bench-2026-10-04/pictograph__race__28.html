<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;background:#fff7e9;font-family:system-ui,sans-serif;color:#503d39}
  #activity{width:360px;height:320px;padding:7px 12px;overflow:hidden;background:radial-gradient(circle at 92% 4%,#ffe2bc 0,transparent 42%),#fff7e9}
  #title{height:29px;font-size:20px;font-weight:800;line-height:29px}
  #prompt{height:32px;font-size:15px;font-weight:650;line-height:32px}
  #key{height:35px;display:flex;align-items:center;gap:7px;font-size:13px}
  #keyIcon{width:28px;height:28px;flex:none}
  #keyNumber{font-weight:800}
  #rows{display:flex;flex-direction:column;gap:3px}
  .row{width:100%;height:52px;min-height:52px;border:2px solid #edcfb2;border-radius:15px;background:#fffdfa;display:flex;align-items:center;padding:0 9px;cursor:pointer;transition:transform .18s,background .2s,border-color .2s,box-shadow .2s;box-shadow:0 2px 0 #e9d0b9}
  .row:active{transform:scale(.97)}
  .row:focus-visible{outline:3px solid #8b6655;outline-offset:1px}
  .name{width:58px;flex:none;font-weight:750;font-size:16px}
  .symbols{display:flex;align-items:center;gap:5px;white-space:nowrap}
  .symbols svg{width:27px;height:27px;flex:none}
  .row.chosen{background:#ffe9cb;border-color:#d99565}
  .row.celebrate{background:#e6f4d9;border-color:#83ab72;animation:bloom .5s ease}
  @keyframes bloom{50%{transform:scale(1.025)}}
  #prompt.pop{animation:bloom .4s ease}
</style>
<div id="activity">
  <div id="title"></div>
  <div id="prompt" aria-live="polite"></div>
  <div id="key" data-key>
    <span id="keyIcon"><svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><path d="M16 17v11" stroke="#67946d" stroke-width="2.5" stroke-linecap="round"/><path d="M16 24c-5-5-8-2-7 0 2 3 5 3 7 1m0-3c5-5 8-2 7 0-2 3-5 3-7 1" fill="#8abf85"/><circle cx="16" cy="9" r="6" fill="#f0a46d"/><circle cx="16" cy="9" r="2.5" fill="#fff1bf"/></svg></span>
    <span id="keyLabel"></span><span>=</span><span id="keyNumber"></span>
  </div>
  <div id="rows"></div>
</div>
<script>

(()=>{
  const p=Studio.params;
  const title=document.getElementById('title'), prompt=document.getElementById('prompt');
  title.textContent=Studio.t('title');
  prompt.textContent=Studio.t('ask');
  document.getElementById('keyLabel').textContent=Studio.t('keytext');
  document.getElementById('keyNumber').textContent=p.symbolValue;
  const holder=document.getElementById('rows');
  const icon=document.querySelector('#keyIcon svg');
  let locked=false, finished=false;
  p.rows.forEach(item=>{
    const row=document.createElement('button');
    row.type='button';
    row.className='row';
    row.setAttribute('data-row',item.key);
    const name=document.createElement('span');
    name.className='name';
    name.textContent=Studio.t(item.key);
    const symbols=document.createElement('span');
    symbols.className='symbols';
    for(let i=0;i<item.value/p.symbolValue;i++){
      const symbol=icon.cloneNode(true);
      symbol.setAttribute('data-symbol','');
      symbols.appendChild(symbol);
    }
    row.append(name,symbols);
    row.addEventListener('click',()=>{
      if(locked||finished)return;
      locked=true;
      row.classList.add('chosen');
      Studio.answer(item.key);
    });
    holder.appendChild(row);
  });
  Studio.onVerdict(({correct})=>{
    const chosen=holder.querySelector('.chosen');
    if(correct){
      finished=true;
      if(chosen)chosen.classList.add('celebrate');
      prompt.textContent=Studio.t('done');
      Studio.done();
    }else{
      prompt.textContent=Studio.t('wrong');
      prompt.classList.remove('pop');
      void prompt.offsetWidth;
      prompt.classList.add('pop');
      if(chosen)chosen.classList.remove('chosen');
      locked=false;
    }
  });
  Studio.ready();
})();

</script>
