<style>
*{box-sizing:border-box}html,body{margin:0;width:360px;height:320px;overflow:hidden}body{font-family:system-ui,sans-serif;color:#3f5143;background:#fff8e9}.stage{width:360px;height:320px;padding:7px 10px;display:flex;flex-direction:column;gap:3px}.title{height:24px;text-align:center;font-size:17px;line-height:24px;font-weight:800;color:#49684b}.scene{width:340px;height:139px;border-radius:20px;background:#eef7df;display:block;overflow:hidden}.scene text{font-family:system-ui,sans-serif;font-size:11px;font-weight:700;fill:#405640;text-anchor:middle}.hub{fill:#f2b953;stroke:#d99439;stroke-width:3;transition:opacity .25s,stroke-width .25s}.entity-shape{fill:#ffd46e;stroke:#e4a83c;stroke-width:2}.root-shape{fill:none;stroke:#9a704e;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.flow-label{fill:#526e92!important}.part{fill:#5b9bc3;stroke:#fff;stroke-width:1.5;transition:opacity .2s}.flow-out{fill:#73a88a}.flow-water{fill:#4d9cc5}.focus{stroke-width:5!important;opacity:1!important}.dim{opacity:.42}.controls{height:52px;display:flex;justify-content:center;gap:10px;align-items:center}button{font:700 15px system-ui,sans-serif;color:#fff;background:#56845b;border:0;border-radius:16px;min-width:84px;height:52px;padding:0 12px;box-shadow:0 3px 0 #3f6845;cursor:pointer;transition:transform .12s,filter .12s}button:active{transform:scale(.94);filter:brightness(1.1)}button:focus-visible{outline:3px solid #e7a847;outline-offset:2px}.caption{height:23px;text-align:center;font-size:14px;font-weight:750;color:#536d48;line-height:23px}.ask{height:20px;text-align:center;font-size:13px;font-weight:700;line-height:20px;color:#596452}.options{height:52px;display:flex;gap:7px;justify-content:center}.options button{min-width:0;flex:1;height:52px;padding:0 5px;background:#648eaa;box-shadow:0 3px 0 #456d85;font-size:13px}.feedback{height:17px;text-align:center;font-size:12px;font-weight:700;line-height:17px;color:#56845b}
</style>
<div class="stage">
  <div class="title" id="title"></div>
  <svg class="scene" id="scene" viewBox="0 0 340 139" aria-label="">
    <path d="M30 116 Q170 138 310 116" fill="none" stroke="#d7e8c4" stroke-width="3"/>
    <g id="art"></g>
    <g id="labels"></g>
    <g id="particles"></g>
  </svg>
  <div class="controls"><button id="play" data-action="play"></button><button id="next" data-action="next"></button></div>
  <div class="caption" data-caption></div>
  <div class="ask" id="ask"></div>
  <div class="options" id="options"></div>
  <div class="feedback" id="feedback"></div>
</div>
<script>

(()=>{const p=Studio.params,t=Studio.t,ns="http://www.w3.org/2000/svg",scene=document.getElementById("scene"),art=document.getElementById("art"),labels=document.getElementById("labels"),particles=document.getElementById("particles");let playing=true,step=1,done=false;const title=document.getElementById("title"),play=document.getElementById("play"),caption=document.querySelector("[data-caption]"),feedback=document.getElementById("feedback");title.textContent=t("title");document.getElementById("ask").textContent=t("ask");const el=(name,attrs,parent)=>{const e=document.createElementNS(ns,name);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e};const htmlBtn=(text,key)=>{const b=document.createElement("button");b.textContent=text;b.dataset.option=key;document.getElementById("options").appendChild(b);b.addEventListener("click",()=>{Studio.event("answer",{option:key});Studio.answer(key)});return b};const hub=el("circle",{cx:170,cy:67,r:36,class:"hub", "data-entity":p.hub},art);const hubLabel=el("text",{x:170,y:111,"data-label":p.hub},labels);hubLabel.textContent=t(p.hub);const entityPos=[{x:49,y:36,labelX:49,labelY:17},{x:291,y:101,labelX:291,labelY:129}];p.entities.forEach((key,i)=>{const q=entityPos[i%2];if(i===0){el("circle",{cx:q.x,cy:q.y,r:14,class:"entity-shape","data-entity":key},art);for(let a=0;a<8;a++){const ang=a*Math.PI/4;el("line",{x1:q.x+17*Math.cos(ang),y1:q.y+17*Math.sin(ang),x2:q.x+22*Math.cos(ang),y2:q.y+22*Math.sin(ang),stroke:"#e4a83c","stroke-width":3,"stroke-linecap":"round","data-entity":key},art)}}else{el("path",{d:`M${q.x} ${q.y-8} l-10 18 m10-18 10 18 m-10-7 -9 11 m9-11 9 11`,class:"root-shape","data-entity":key},art)}const l=el("text",{x:q.labelX,y:q.labelY,"data-label":key},labels);l.textContent=t(key)});const paths=[];p.flows.forEach((f,i)=>{let a,b,c,d;if(f.dir==="in"){a=105;b=59;c=134;d=66}else if(f.dir==="out"){a=206;b=66;c=250;d=66}else{a=190;b=125;c=176;d=103}const lx=f.dir==="in"?116:f.dir==="out"?248:207,ly=f.dir==="up_in"?128:49;const lab=el("text",{x:lx,y:ly,class:"flow-label","data-label":f.key},labels);lab.textContent=t(f.key);const group=[];for(let j=0;j<3;j++){const dot=el("circle",{cx:a,cy:b,r:4,class:"part "+(f.key==="water"?"flow-water":f.dir==="out"?"flow-out":""),"data-flow":f.key},particles);group.push({dot,a,b,c,d,phase:j/3,dir:f.dir})}paths.push(...group)});function render(){caption.textContent=t("step"+step);play.textContent=t(playing?"pause":"play");document.querySelectorAll(".hub").forEach(e=>e.classList.toggle("focus",step===1));document.querySelectorAll(".part").forEach(e=>e.classList.toggle("dim",!playing));}play.addEventListener("click",()=>{playing=!playing;Studio.event("play",{playing:playing?1:0});render()});document.getElementById("next").textContent=t("next");document.getElementById("next").addEventListener("click",()=>{step=step%p.steps+1;Studio.event("step",{step});render()});p.options.forEach(k=>htmlBtn(t(k),k));Studio.onVerdict(v=>{feedback.textContent=t(v.correct?"right":"wrong");if(v.correct&&!done){done=true;Studio.done()}});let start=performance.now();function animate(now){const phase=(now-start)/1800;paths.forEach(o=>{const u=(phase+o.phase)%1;let x,y;if(o.dir==="in"){x=o.a+(o.c-o.a)*u;y=o.b+(o.d-o.b)*u}else if(o.dir==="out"){x=o.a+(o.c-o.a)*u;y=o.b+(o.d-o.b)*u}else{x=o.a+(o.c-o.a)*u;y=o.b+(o.d-o.b)*u}if(playing){o.dot.setAttribute("cx",x);o.dot.setAttribute("cy",y)} });requestAnimationFrame(animate)}render();requestAnimationFrame(animate);Studio.ready()})();

</script>
