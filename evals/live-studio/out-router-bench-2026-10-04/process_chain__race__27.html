<style>
  *{box-sizing:border-box}#activity{width:360px;height:320px;overflow:hidden;position:relative;background:#fff8ed;color:#514039;font-family:system-ui,sans-serif;text-align:center}#heading{height:31px;padding-top:5px;font-size:19px;font-weight:750;color:#8b5344}#scene{display:block;width:360px;height:155px} .stage rect{fill:#fffaf2;stroke:#d8a990;stroke-width:2;transition:fill .3s,stroke .3s,filter .3s}.stage.active rect{fill:#ffdf99;stroke:#e69452;filter:drop-shadow(0 0 7px #ffd17a)}.stage text{font-size:13px;font-weight:700;fill:#694a3b;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.arrow{fill:none;stroke:#cf9c80;stroke-width:3;stroke-linecap:round}#traveller{fill:#e87560;stroke:#fff8ed;stroke-width:3;filter:drop-shadow(0 2px 2px #9b665488)}#next{position:absolute;top:186px;left:143px;width:74px;height:53px;border:0;border-radius:18px;background:#e88769;color:white;font:700 17px system-ui;box-shadow:0 5px 0 #bd674e;cursor:pointer;transition:transform .16s,box-shadow .16s}#next:active,.option:active{transform:translateY(3px) scale(.96);box-shadow:none}#next:disabled{opacity:.65}#prompt{position:absolute;top:242px;width:100%;height:22px;font-size:15px;font-weight:700;color:#805541}#options{position:absolute;top:265px;left:6px;width:348px;height:53px;display:flex;gap:5px;justify-content:center}.option{min-width:52px;flex:1;height:53px;border:2px solid #d9aa84;border-radius:15px;background:#fff1d9;color:#694a3b;font:700 13px system-ui;cursor:pointer;transition:transform .16s,background .2s}.option:active{transform:scale(.95)}#feedback{position:absolute;top:164px;left:4px;width:352px;height:20px;font-size:14px;font-weight:750;color:#9d6451;pointer-events:none}
</style>
<div id="activity">
  <div id="heading"></div>
  <svg id="scene" viewBox="0 0 360 155" aria-hidden="true"><defs><marker id="arrowhead" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#cf9c80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g id="arrows"></g><g id="stages"></g><circle id="traveller" data-token r="9"/></svg>
  <div id="feedback" aria-live="polite"></div>
  <button id="next" data-action="next" type="button"></button>
  <div id="prompt"></div>
  <div id="options"></div>
</div>
<script>

(() => {
  const p=Studio.params, keys=p.stages, root=document.getElementById('activity');
  const svgNS='http://www.w3.org/2000/svg';
  const make=(tag,attrs,parent)=>{const e=document.createElementNS(svgNS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e};
  const text=(id,key)=>document.getElementById(id).textContent=Studio.t(key);
  text('heading','title');text('next','next');text('prompt','ask');
  const positions=keys.map((_,i)=>{const a=-3*Math.PI/4+i*2*Math.PI/keys.length;return {x:180+112*Math.cos(a),y:76+49*Math.sin(a)}});
  const arrows=document.getElementById('arrows'), stages=document.getElementById('stages');
  const count=keys.length-(p.cycle?0:1);
  for(let i=0;i<count;i++){
    const j=(i+1)%keys.length,a=positions[i],b=positions[j],dx=b.x-a.x,dy=b.y-a.y;
    const scale=Math.max(Math.abs(dx)/43,Math.abs(dy)/29,1);
    make('line',{x1:a.x+dx/scale,y1:a.y+dy/scale,x2:b.x-dx/scale,y2:b.y-dy/scale,'class':'arrow','marker-end':'url(#arrowhead)','data-arrow':keys[i]+'>'+keys[j]},arrows);
  }
  const groups=keys.map((key,i)=>{
    const pos=positions[i],g=make('g',{'class':'stage','data-stage':key},stages);
    make('rect',{x:pos.x-39,y:pos.y-23,width:78,height:46,rx:16},g);
    const label=make('text',{x:pos.x,y:pos.y,'data-label':key},g);label.textContent=Studio.t(key);
    return g;
  });
  const token=document.getElementById('traveller'),next=document.getElementById('next'),feedback=document.getElementById('feedback');
  let index=0,moving=false,finished=false;
  function activate(){root.setAttribute('data-active',keys[index]);groups.forEach((g,i)=>g.classList.toggle('active',i===index));token.setAttribute('cx',positions[index].x);token.setAttribute('cy',positions[index].y);next.disabled=moving||!p.cycle&&index===keys.length-1}
  activate();
  next.addEventListener('click',()=>{
    if(moving||finished||!p.cycle&&index===keys.length-1)return;
    moving=true;next.disabled=true;feedback.textContent='';
    const from=positions[index],to=positions[(index+1)%keys.length],start=performance.now(),duration=700;
    Studio.event('next',{stage:keys[index]});
    function frame(now){
      const t=Math.min(1,(now-start)/duration),ease=t*t*(3-2*t);
      token.setAttribute('cx',from.x+(to.x-from.x)*ease);
      token.setAttribute('cy',from.y+(to.y-from.y)*ease);
      if(t<1)requestAnimationFrame(frame);
      else{index=(index+1)%keys.length;moving=false;activate()}
    }
    requestAnimationFrame(frame);
  });
  const options=document.getElementById('options');
  p.options.forEach(key=>{
    const b=document.createElement('button');b.type='button';b.className='option';b.setAttribute('data-option',key);b.textContent=Studio.t(key);
    b.addEventListener('click',()=>{if(!finished)Studio.answer(key)});
    options.appendChild(b);
  });
  Studio.onVerdict(({correct})=>{
    feedback.textContent=Studio.t(correct?'right':'wrong');
    if(correct){finished=true;next.disabled=true;options.querySelectorAll('button').forEach(b=>b.disabled=true);Studio.done()}
  });
  Studio.ready();
})();

</script>
