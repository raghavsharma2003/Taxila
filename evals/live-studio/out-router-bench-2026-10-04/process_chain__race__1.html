<style>
  *{box-sizing:border-box}
  #activity{width:360px;height:320px;overflow:hidden;position:relative;background:#fff5e8;color:#593d39;font-family:system-ui,sans-serif;text-align:center}
  #activity h1{margin:8px 12px 0;font-size:19px;line-height:28px;font-weight:750}
  #scene{display:block;width:360px;height:146px;margin-top:2px}
  .stage rect{fill:#fffdf7;stroke:#dcaa86;stroke-width:2.5;rx:17;transition:fill .25s,stroke .25s,filter .25s}
  .stage text{fill:#593d39;font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
  .stage.active rect{fill:#ffe3a4;stroke:#f08a56;filter:drop-shadow(0 0 7px #f5aa69)}
  .arrow{fill:none;stroke:#b78577;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  #traveller{fill:#f27860;stroke:#fffdf7;stroke-width:3;filter:drop-shadow(0 2px 3px #a86b5780)}
  button{font:700 15px system-ui,sans-serif;color:#593d39;border:2px solid #dda78a;border-radius:17px;background:#fffdf7;cursor:pointer;transition:transform .16s,background .16s}
  button:active{transform:scale(.93)}
  button:disabled{opacity:.6;cursor:default}
  #controls{height:52px;display:flex;align-items:center;justify-content:center;gap:12px}
  #next{width:112px;height:52px;background:#ffd896}
  #feedback{min-width:105px;font-size:14px;font-weight:700;color:#a65043}
  #question{height:26px;line-height:26px;font-size:15px;font-weight:700}
  #options{height:60px;display:flex;align-items:flex-start;justify-content:center;gap:7px;padding:0 8px}
  #options button{height:54px;min-width:74px;flex:1;max-width:112px}
</style>
<div id="activity">
  <h1 id="title"></h1>
  <svg id="scene" viewBox="0 0 360 146" aria-hidden="true">
    <g id="arrows"></g>
    <g id="stages"></g>
    <circle id="traveller" data-token r="10"></circle>
  </svg>
  <div id="controls"><button id="next" data-action="next"></button><span id="feedback" aria-live="polite"></span></div>
  <div id="question"></div>
  <div id="options"></div>
</div>
<script>

(()=>{
  const p=Studio.params, keys=p.stages, root=document.getElementById('activity');
  const svgNS='http://www.w3.org/2000/svg', stageLayer=document.getElementById('stages');
  const arrowLayer=document.getElementById('arrows'), token=document.getElementById('traveller');
  const next=document.getElementById('next'), feedback=document.getElementById('feedback');
  const make=(tag,attrs,parent)=>{
    const el=document.createElementNS(svgNS,tag);
    for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);
    parent.appendChild(el);return el;
  };
  document.getElementById('title').textContent=Studio.t('title');
  document.getElementById('question').textContent=Studio.t('ask')+' '+Studio.t(p.askAfter);
  next.textContent=Studio.t('next');
  const positions=keys.map((_,i)=>{
    if(p.cycle){
      const a=(-135+i*360/keys.length)*Math.PI/180;
      return {x:180+121*Math.cos(a),y:73+51*Math.sin(a)};
    }
    if(keys.length<=4)return {x:keys.length===1?180:43+i*274/(keys.length-1),y:73};
    const col=i%4,row=Math.floor(i/4);
    return {x:43+col*91,y:36+row*73};
  });
  const links=p.cycle?keys.length:keys.length-1;
  for(let i=0;i<links;i++){
    const j=(i+1)%keys.length,a=positions[i],b=positions[j];
    const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;
    const ux=dx/len,uy=dy/len;
    const start={x:a.x+ux*37,y:a.y+uy*25},end={x:b.x-ux*39,y:b.y-uy*26};
    const tip={x:b.x-ux*35,y:b.y-uy*23};
    const base={x:tip.x-ux*9,y:tip.y-uy*9};
    make('path',{class:'arrow','data-arrow':keys[i]+'>'+keys[j],
      d:`M ${start.x} ${start.y} L ${end.x} ${end.y} M ${tip.x} ${tip.y} L ${base.x-uy*5} ${base.y+ux*5} M ${tip.x} ${tip.y} L ${base.x+uy*5} ${base.y-ux*5}`},arrowLayer);
  }
  keys.forEach((key,i)=>{
    const {x,y}=positions[i];
    const g=make('g',{class:'stage','data-stage':key},stageLayer);
    make('rect',{x:x-34,y:y-23,width:68,height:46},g);
    const label=make('text',{x,y:y+1,'data-label':key},g);
    label.textContent=Studio.t(key);
  });
  let index=0,moving=false,finished=false;
  function place(x,y){token.setAttribute('cx',x);token.setAttribute('cy',y)}
  function activate(){
    root.setAttribute('data-active',keys[index]);
    stageLayer.querySelectorAll('.stage').forEach((g,i)=>g.classList.toggle('active',i===index));
  }
  place(positions[0].x,positions[0].y);activate();
  next.addEventListener('click',()=>{
    if(moving||finished||(!p.cycle&&index===keys.length-1))return;
    const target=(index+1)%keys.length,a=positions[index],b=positions[target];
    moving=true;next.disabled=true;Studio.event('next',{stage:keys[target]});
    const start=performance.now(),duration=660;
    function frame(now){
      const t=Math.min(1,(now-start)/duration);
      const smooth=t*t*(3-2*t);
      place(a.x+(b.x-a.x)*smooth,a.y+(b.y-a.y)*smooth-9*Math.sin(Math.PI*t));
      if(t<1)requestAnimationFrame(frame);
      else{
        index=target;moving=false;activate();
        next.disabled=!p.cycle&&index===keys.length-1;
      }
    }
    requestAnimationFrame(frame);
  });
  p.options.forEach(key=>{
    const button=document.createElement('button');
    button.setAttribute('data-option',key);
    button.textContent=Studio.t(key);
    button.addEventListener('click',()=>{if(!finished)Studio.answer(key)});
    document.getElementById('options').appendChild(button);
  });
  Studio.onVerdict(({correct})=>{
    feedback.textContent=Studio.t(correct?'right':'wrong');
    if(correct){
      finished=true;next.disabled=true;
      document.querySelectorAll('#options button').forEach(b=>b.disabled=true);
      Studio.done();
    }
  });
  Studio.ready();
})();

</script>
