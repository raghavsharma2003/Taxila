<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;background:#fff7e9;font-family:Arial,sans-serif;color:#49352d}
  #app{width:360px;height:320px;position:relative;overflow:hidden;padding:10px 14px 8px}
  .sun{position:absolute;right:-24px;top:-24px;width:108px;height:108px;border-radius:50%;background:#ffd879;opacity:.5}
  .leaf{position:absolute;left:-18px;bottom:12px;width:78px;height:78px;border-radius:70% 30% 70% 30%;background:#c9e7bb;transform:rotate(22deg);opacity:.7}
  header{height:51px;position:relative;z-index:1;padding:2px 7px 0}
  h1{margin:0;font-size:21px;line-height:25px;letter-spacing:.1px;color:#754f3d}
  #instr{margin:3px 0 0;font-size:13px;line-height:17px;color:#765f50}
  #track{height:66px;display:flex;align-items:center;justify-content:center;gap:6px;position:relative;z-index:1}
  .slot{height:60px;flex:1;max-width:104px;border:2px dashed #e5b976;border-radius:16px;background:#fffdf7;position:relative;display:flex;align-items:center;justify-content:center;transition:background .25s,border .25s,transform .25s}
  .slot:before{content:attr(data-number);position:absolute;top:5px;left:8px;width:17px;height:17px;border-radius:50%;background:#f8d895;color:#805e46;font-size:11px;font-weight:bold;line-height:17px;text-align:center}
  .slot.filled{border-style:solid;border-color:#a6cfa3;background:#f1faed}
  #deck{height:171px;position:relative;z-index:2;display:flex;flex-direction:column;gap:5px;padding-top:4px}
  .card{width:100%;min-height:52px;border:0;border-radius:16px;background:#fffdf8;box-shadow:0 3px 0 #dfb67f,0 7px 13px rgba(112,76,47,.12);color:#553c31;font-size:16px;font-weight:bold;letter-spacing:.1px;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,opacity .25s;position:relative;overflow:hidden}
  .card:after{content:"";position:absolute;width:58px;height:58px;border-radius:50%;right:-17px;top:-25px;background:#f9db9f;opacity:.45}
  .card span{position:relative;z-index:1}
  .card:active{transform:scale(.96);box-shadow:0 1px 0 #dfb67f}
  .card.wait{pointer-events:none;opacity:.68;transform:scale(.98)}
  .card.shake{animation:shake .45s ease}
  .placed{width:calc(100% - 10px);min-height:42px;height:42px;border-radius:12px;box-shadow:0 2px 0 #9ec89c;font-size:12px;cursor:default;background:#dff1d9;animation:land .42s cubic-bezier(.2,1.35,.45,1)}
  .placed:after{background:#b9dfac;right:-18px;top:-28px}
  #feedback{height:18px;text-align:center;font-size:13px;font-weight:bold;color:#8b6549;position:relative;z-index:3;transition:transform .2s,opacity .2s}
  #feedback.good{color:#4e8b58;animation:pop .35s ease}
  #feedback.bad{color:#b26b57;animation:pop .35s ease}
  #finish{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(255,247,233,.9);padding:38px}
  #finish.show{display:flex;animation:fade .35s ease}
  #finish div{background:#fffdf8;border-radius:25px;padding:23px 18px;min-width:230px;text-align:center;box-shadow:0 5px 0 #e4b774;font-size:21px;font-weight:bold;color:#6b513e;animation:pop .45s cubic-bezier(.2,1.35,.45,1)}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}55%{transform:translateX(7px)}75%{transform:translateX(-3px)}}
  @keyframes land{0%{transform:scale(.55) translateY(15px);opacity:.2}100%{transform:scale(1) translateY(0);opacity:1}}
  @keyframes pop{0%{transform:scale(.82);opacity:.2}100%{transform:scale(1);opacity:1}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
</style>
<div id="app">
  <div class="sun"></div>
  <div class="leaf"></div>
  <header>
    <h1 id="title"></h1>
    <p id="instr"></p>
  </header>
  <div id="track"></div>
  <div id="deck"></div>
  <div id="feedback"></div>
  <div id="finish"><div id="done"></div></div>
</div>
<script>

(function(){
  var shown=Studio.params.shown;
  var track=document.getElementById('track');
  var deck=document.getElementById('deck');
  var feedback=document.getElementById('feedback');
  var placed=0;
  var waiting=false;
  var completed=false;

  document.getElementById('title').textContent=Studio.t('title');
  document.getElementById('instr').textContent=Studio.t('instr');
  document.getElementById('done').textContent=Studio.t('done');

  shown.forEach(function(key,index){
    var slot=document.createElement('div');
    slot.className='slot';
    slot.setAttribute('data-number',index+1);
    track.appendChild(slot);

    var card=document.createElement('button');
    card.type='button';
    card.className='card';
    card.setAttribute('data-step',key);
    var words=document.createElement('span');
    words.textContent=Studio.t(key);
    card.appendChild(words);
    card.addEventListener('click',function(){
      if(waiting||completed){return;}
      waiting=true;
      card.classList.add('wait');
      Studio.event('step_tap',{position:placed+1});
      Studio.answer({key:key});
    });
    deck.appendChild(card);
  });

  Studio.onVerdict(function(result){
    var chosen=document.querySelector('.card.wait');
    if(!chosen||completed){return;}
    if(result.correct){
      chosen.classList.remove('wait');
      chosen.classList.add('placed');
      chosen.disabled=true;
      chosen.setAttribute('data-placed',placed+1);
      var slot=track.children[placed];
      slot.classList.add('filled');
      slot.appendChild(chosen);
      placed++;
      feedback.textContent=Studio.t('right');
      feedback.className='good';
      Studio.event('step_right',{position:placed});
      if(placed===shown.length){
        completed=true;
        setTimeout(function(){
          document.getElementById('finish').classList.add('show');
          Studio.done();
        },420);
      }
    }else{
      chosen.classList.remove('wait');
      chosen.classList.add('shake');
      feedback.textContent=Studio.t('wrong');
      feedback.className='bad';
      Studio.event('step_try',{position:placed+1});
      setTimeout(function(){chosen.classList.remove('shake');},470);
    }
    waiting=false;
  });

  Studio.ready();
}());

</script>
