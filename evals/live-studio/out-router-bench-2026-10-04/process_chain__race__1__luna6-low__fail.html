<style>
*{box-sizing:border-box}#lesson{width:360px;height:320px;overflow:hidden;position:relative;padding:12px;background:#fff8e9;color:#493b35;font-family:system-ui,sans-serif;border-radius:18px;--accent:#e98b55;--ink:#493b35}#lesson h1{height:30px;margin:0;text-align:center;font-size:18px;line-height:30px;color:#754c3f}.path{position:absolute;inset:52px 0 auto;width:360px;height:100px;overflow:visible}.path line{stroke:#d9b78f;stroke-width:4;stroke-linecap:round}.path marker path{fill:#d9b78f}.stages{position:absolute;top:66px;left:0;width:360px;height:78px}.stage{position:absolute;top:0;height:68px;border:2px solid #e8cba8;border-radius:17px;background:#fffdf6;display:flex;align-items:center;justify-content:center;padding:5px;text-align:center;box-shadow:0 3px 0 #f1dfc7;transition:transform .25s,border-color .25s,box-shadow .25s,background .25s;font-size:13px;font-weight:700;line-height:1.15}.stage[data-current=true]{border-color:var(--accent);background:#fff1df;box-shadow:0 0 0 4px #f8ddbd,0 4px 0 #edc9a4;transform:translateY(-3px)}.token{position:absolute;width:18px;height:18px;border:3px solid #fff;background:#e97950;border-radius:50%;box-shadow:0 2px 8px #a7563b88;z-index:3;transition:left .72s cubic-bezier(.2,.8,.25,1),top .72s cubic-bezier(.2,.8,.25,1);pointer-events:none}.controls{position:absolute;left:12px;right:12px;bottom:12px;height:64px;display:flex;align-items:center;justify-content:center}.btn{min-width:88px;min-height:52px;padding:8px 16px;border:0;border-radius:17px;background:#e98b55;color:white;font:700 16px system-ui,sans-serif;box-shadow:0 4px 0 #c96d43;cursor:pointer;transition:transform .15s,filter .15s}.btn:active,.option:active{transform:scale(.94)}.question{position:absolute;left:12px;right:12px;bottom:86px;min-height:88px;padding:8px 10px 10px;background:#fffdf6;border:1px solid #f0d8b9;border-radius:16px;text-align:center}.question[hidden],.feedback[hidden]{display:none}.prompt{font-size:14px;font-weight:700;line-height:18px;min-height:20px}.options{display:flex;justify-content:center;gap:7px;margin-top:5px}.option{min-width:70px;min-height:52px;padding:6px;border:2px solid #edcba7;border-radius:14px;background:#fff2df;color:#65483a;font:700 13px system-ui,sans-serif;cursor:pointer;transition:transform .15s,background .2s}.feedback{height:18px;margin-top:3px;font-size:13px;font-weight:700;color:#57835a}.feedback.bad{color:#b8664b}
</style>
<div id="lesson">
  <h1 id="heading"></h1>
  <svg class="path" id="path" aria-hidden="true"></svg>
  <div class="stages" id="stages"></div>
  <div class="token" data-token aria-hidden="true"></div>
  <section class="question" id="question" hidden>
    <div class="prompt" id="prompt"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback" hidden></div>
  </section>
  <div class="controls"><button class="btn" id="next" data-action="next" type="button"></button></div>
</div>
<script>

(()=>{const p=Studio.params,root=document.getElementById('lesson'),heading=document.getElementById('heading'),stageBox=document.getElementById('stages'),svg=document.getElementById('path'),token=document.querySelector('[data-token]'),next=document.getElementById('next'),question=document.getElementById('question'),prompt=document.getElementById('prompt'),options=document.getElementById('options'),feedback=document.getElementById('feedback');heading.textContent=Studio.t('title');next.textContent=Studio.t('next');let keys=p.stages,positions=[],active=0,journeys=0,asking=false;root.dataset.active=keys[0];function build(){let n=keys.length,w=Math.min(74,(330-(n-1)*8)/n),gap=n>1?(330-n*w)/(n-1):0,start=(360-(n*w+(n-1)*gap))/2;stageBox.replaceChildren();svg.replaceChildren();positions=[];let ns='http://www.w3.org/2000/svg',defs=document.createElementNS(ns,'defs'),marker=document.createElementNS(ns,'marker');marker.setAttribute('id','tip');marker.setAttribute('markerWidth','8');marker.setAttribute('markerHeight','8');marker.setAttribute('refX','6');marker.setAttribute('refY','4');marker.setAttribute('orient','auto');let tip=document.createElementNS(ns,'path');tip.setAttribute('d','M0,0 L8,4 L0,8 Z');marker.append(tip);defs.append(marker);svg.append(defs);keys.forEach((key,i)=>{let x=start+i*(w+gap);positions.push({x:x+w/2,y:100});let card=document.createElement('div');card.className='stage';card.dataset.stage=key;card.style.left=x+'px';card.style.width=w+'px';let label=document.createElement('span');label.dataset.label=key;label.textContent=Studio.t(key);card.append(label);stageBox.append(card)});let edges=[];for(let i=0;i<keys.length-1;i++)edges.push([i,i+1]);if(p.cycle&&keys.length>1)edges.push([keys.length-1,0]);edges.forEach(([a,b])=>{let l=document.createElementNS(ns,'line'),from=positions[a],to=positions[b];l.setAttribute('x1',from.x);l.setAttribute('y1',from.y);l.setAttribute('x2',to.x);l.setAttribute('y2',to.y);l.setAttribute('marker-end','url(#tip)');l.dataset.arrow=keys[a]+'>'+keys[b];svg.append(l)});placeToken();mark()}function mark(){root.dataset.active=keys[active];document.querySelectorAll('.stage').forEach((el,i)=>el.dataset.current=String(i===active))}function placeToken(){let q=positions[active];token.style.left=(q.x-9)+'px';token.style.top=(q.y-9)+'px'}function ask(){asking=true;question.hidden=false;next.hidden=true;prompt.textContent=Studio.t('ask');options.replaceChildren();p.options.forEach(key=>{let b=document.createElement('button');b.type='button';b.className='option';b.dataset.option=key;b.textContent=Studio.t(key);b.addEventListener('click',()=>{feedback.hidden=true;Studio.answer(key);Studio.onVerdict(v=>{feedback.textContent=Studio.t(v.correct?'right':'wrong');feedback.classList.toggle('bad',!v.correct);feedback.hidden=false;if(v.correct){next.hidden=false;next.textContent=Studio.t('done');next.dataset.finish='true'}})});options.append(b)});Studio.event('question',{})}next.addEventListener('click',()=>{if(next.dataset.finish==='true'){next.disabled=true;Studio.done();return}let last=keys.length-1;if(active<last){active++;journeys++}else if(p.cycle){active=0;journeys++}else{ask();return}mark();placeToken();Studio.event('advance',{stage:keys[active]});let complete=p.cycle?journeys>=keys.length:active===last;if(complete){window.setTimeout(ask,760)}});build();Studio.ready()})();

</script>
