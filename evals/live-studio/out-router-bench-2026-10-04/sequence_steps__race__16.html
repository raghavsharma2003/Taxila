<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;background:#fff8ed;font-family:system-ui,sans-serif;color:#50382e}
  .scene{position:relative;width:360px;height:320px;overflow:hidden;padding:16px}
  .glow{position:absolute;right:-24px;top:-32px;width:148px;height:148px;border-radius:50%;background:#ffe9c7;pointer-events:none}
  .heading{position:relative;height:69px;padding-right:72px}
  h1{margin:0;font-size:21px;line-height:1.15;font-weight:800}
  #message{margin:6px 0 0;font-size:13px;line-height:1.25;min-height:17px}
  .picture{position:absolute;right:17px;top:12px;width:66px;height:66px;pointer-events:none}
  #cards{position:relative;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,55px);gap:10px;margin-top:7px;height:120px}
  .card{display:flex;align-items:center;justify-content:center;width:100%;height:55px;border:2px solid #d99a73;border-radius:16px;background:#fff1db;color:#50382e;font:700 16px system-ui,sans-serif;box-shadow:0 4px 0 #e7c5aa;cursor:pointer;transition:transform .2s,background .2s,box-shadow .2s}
  .card:active{transform:scale(.94);box-shadow:0 1px 0 #e7c5aa}
  .card:focus-visible{outline:3px solid #55877b;outline-offset:2px}
  .card:disabled{cursor:default}
  .card.shake{animation:shake .36s ease}
  @keyframes shake{25%,75%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
  #track{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:19px}
  .slot{position:relative;display:flex;align-items:center;justify-content:center;height:66px;border:2px dashed #d7baa2;border-radius:17px;background:#fffdf8;color:#9b765d;font-size:20px;font-weight:800}
  .slot .card{height:100%;border-color:#77a294;background:#e5f3e8;box-shadow:none;font-size:12px;padding:16px 3px 3px;animation:pop .3s ease-out}
  .slot .badge{position:absolute;z-index:1;top:3px;left:50%;transform:translateX(-50%);display:none;font-size:12px;color:#416c5e;pointer-events:none}
  .slot.filled .badge{display:block}
  @keyframes pop{from{transform:scale(.75)}to{transform:scale(1)}}
</style>
<div class="scene">
  <div class="glow"></div>
  <svg class="picture" viewBox="0 0 66 66" aria-hidden="true">
    <path d="M20 12c-5 6 5 8 0 14M34 8c-5 6 5 8 0 14" fill="none" stroke="#d99a73" stroke-width="3" stroke-linecap="round"/>
    <path d="M11 31h39v16a15 15 0 0 1-15 15h-9a15 15 0 0 1-15-15Z" fill="#e6ae86" stroke="#935c48" stroke-width="2"/>
    <path d="M50 35h5a7 7 0 0 1 0 14h-5" fill="none" stroke="#935c48" stroke-width="3"/>
    <path d="M16 34h29" stroke="#fff2df" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <div class="heading"><h1 id="title"></h1><p id="message" aria-live="polite"></p></div>
  <div id="cards"></div>
  <div id="track"></div>
</div>
<script>

  const shown=Studio.params.shown;
  const cards=document.getElementById('cards');
  const track=document.getElementById('track');
  const message=document.getElementById('message');
  document.getElementById('title').textContent=Studio.t('title');
  message.textContent=Studio.t('instr');
  let placed=0, waiting=null;
  shown.forEach((key,i)=>{
    const card=document.createElement('button');
    card.type='button';
    card.className='card';
    card.dataset.step=key;
    card.textContent=Studio.t(key);
    card.addEventListener('click',()=>{
      if(waiting!==null || card.dataset.placed)return;
      waiting=card;
      card.style.transform='scale(.94)';
      Studio.answer({key});
    });
    cards.appendChild(card);
    const slot=document.createElement('div');
    slot.className='slot';
    const position=i+1;
    slot.textContent=position;
    const badge=document.createElement('span');
    badge.className='badge';
    badge.textContent=position;
    slot.appendChild(badge);
    track.appendChild(slot);
  });
  Studio.onVerdict(({correct})=>{
    if(waiting===null)return;
    const card=waiting;
    waiting=null;
    card.style.transform='';
    if(correct){
      placed++;
      const slot=track.children[placed-1];
      slot.classList.add('filled');
      slot.insertBefore(card,slot.querySelector('.badge'));
      card.dataset.placed=placed;
      card.disabled=true;
      message.textContent=Studio.t(placed===shown.length?'done':'right');
      if(placed===shown.length)Studio.done();
    }else{
      message.textContent=Studio.t('wrong');
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
    }
  });
  Studio.ready();

</script>
