<style>
*{box-sizing:border-box}
html,body{margin:0;width:360px;height:320px;overflow:hidden}
#app{width:360px;height:320px;padding:10px 14px;background:#fff8eb;color:#3c3443;font-family:system-ui,sans-serif;position:relative;overflow:hidden}
h1{font-size:17px;line-height:21px;margin:0;color:#514260}
#instruction{font-size:13px;line-height:17px;margin:2px 0 6px;color:#71657a}
#item{height:232px;position:relative}
#target-row{height:34px;display:flex;align-items:center;justify-content:center;gap:7px}
#target{font-size:22px;font-weight:750;color:#b75667;min-width:35px;text-align:center}
#board{height:100px;position:relative}
#numberline{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tick{stroke:#786c82;stroke-width:2}
.axis{stroke:#786c82;stroke-width:3;stroke-linecap:round}
.tick-label{font:12px system-ui,sans-serif;fill:#574d60;text-anchor:middle}
#marker{position:absolute;top:29px;width:20px;height:25px;transform:translateX(-50%);transition:left .22s cubic-bezier(.2,.8,.25,1),transform .22s ease;z-index:2}
#marker circle{fill:#ef9877;stroke:#fff;stroke-width:2}
#marker path{fill:#ef9877}
#marker.hop{transform:translateX(-50%) translateY(-13px) scale(1.12)}
#controls{display:flex;gap:8px;justify-content:center;margin-top:2px}
button{font:700 15px system-ui,sans-serif;color:#514260;background:#f2dfc8;border:0;border-radius:16px;min-width:68px;height:54px;box-shadow:0 3px 0 #dfc5a7;cursor:pointer;touch-action:manipulation;transition:transform .1s,background .15s}
button:active{transform:scale(.94)}
#check{background:#b9d9c5;box-shadow:0 3px 0 #8fb99f;min-width:90px}
#feedback{height:25px;text-align:center;font-size:14px;font-weight:700;color:#627c68;padding-top:6px}
#feedback.bad{color:#aa6870}
#done-screen{display:none;position:absolute;inset:0;background:#fff8eb;align-items:center;justify-content:center;text-align:center;font-size:23px;font-weight:750;color:#514260;padding:24px}
</style>
<div id="app">
  <h1 id="title"></h1>
  <div id="instruction"></div>
  <section id="item" data-item="">
    <div id="target-row"><span id="target"></span></div>
    <div id="board">
      <svg id="numberline" viewBox="0 0 332 100" aria-hidden="true">
        <line class="axis" x1="12" y1="54" x2="320" y2="54"></line>
        <g id="ticks"></g>
      </svg>
      <svg id="marker" data-marker data-value="" viewBox="0 0 20 25" aria-hidden="true">
        <path d="M10 23 2 11a9 9 0 1 1 16 0z"></path>
        <circle cx="10" cy="9" r="3.5"></circle>
      </svg>
    </div>
    <div id="controls">
      <button id="left" data-action="left"></button>
      <button id="right" data-action="right"></button>
      <button id="check" data-action="check"></button>
    </div>
    <div id="feedback" aria-live="polite"></div>
  </section>
  <div id="done-screen"></div>
</div>
<script>

(function(){
  const p=Studio.params;
  const t=Studio.t;
  const title=document.getElementById("title");
  const instruction=document.getElementById("instruction");
  const targetEl=document.getElementById("target");
  const itemEl=document.getElementById("item");
  const marker=document.getElementById("marker");
  const ticksEl=document.getElementById("ticks");
  const feedback=document.getElementById("feedback");
  const doneScreen=document.getElementById("done-screen");
  document.getElementById("left").textContent=t("left");
  document.getElementById("right").textContent=t("right_btn");
  document.getElementById("check").textContent=t("check");
  title.textContent=t("title");
  instruction.textContent=t("instr");

  const count=Math.round((p.max-p.min)/p.step);
  const lo=12, hi=320, span=hi-lo;
  function valueAt(k){return Number((p.min+k*p.step).toFixed(6))}
  function showValue(v){
    if(p.format==="fraction") return String(Math.round(v*p.den))+"/"+String(p.den);
    return String(Number(v.toFixed(6)));
  }
  for(let k=0;k<=count;k++){
    const v=valueAt(k);
    const x=lo+span*k/count;
    const line=document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("class","tick");
    line.setAttribute("x1",x); line.setAttribute("x2",x);
    line.setAttribute("y1","46"); line.setAttribute("y2","62");
    line.setAttribute("data-tick",String(v));
    ticksEl.appendChild(line);
    if(k%p.labelEvery===0){
      const label=document.createElementNS("http://www.w3.org/2000/svg","text");
      label.setAttribute("class","tick-label");
      label.setAttribute("x",x); label.setAttribute("y","83");
      label.textContent=showValue(v);
      ticksEl.appendChild(label);
    }
  }
  let index=0, markerK=Math.round((p.start-p.min)/p.step), waiting=false;
  function setMarker(){
    const v=valueAt(markerK);
    marker.setAttribute("data-value",String(v));
    marker.style.left=(lo+span*markerK/count)+"px";
  }
  function render(){
    const item=p.items[index];
    itemEl.setAttribute("data-item",String(item.id));
    targetEl.textContent=showValue(item.target);
    targetEl.setAttribute("data-target",String(item.target));
    feedback.textContent="";
    feedback.className="";
    waiting=false;
    setMarker();
  }
  render();
  document.getElementById("left").addEventListener("click",function(){
    if(waiting)return;
    markerK=Math.max(0,markerK-1); setMarker();
    Studio.event("move",{direction:"left"});
  });
  document.getElementById("right").addEventListener("click",function(){
    if(waiting)return;
    markerK=Math.min(count,markerK+1); setMarker();
    Studio.event("move",{direction:"right"});
  });
  document.getElementById("check").addEventListener("click",function(){
    if(waiting)return;
    waiting=true;
    const answer={value:valueAt(markerK)};
    Studio.answer(answer);
  });
  Studio.onVerdict(function(result){
    if(!waiting)return;
    if(result.correct){
      feedback.textContent=t("right");
      feedback.className="";
      marker.classList.add("hop");
      setTimeout(function(){
        marker.classList.remove("hop");
        index++;
        if(index>=p.items.length){
          itemEl.style.display="none";
          doneScreen.style.display="flex";
          doneScreen.textContent=t("done");
          Studio.done();
        }else{
          markerK=Math.round((p.start-p.min)/p.step);
          render();
        }
      },360);
    }else{
      waiting=false;
      feedback.textContent=t("wrong");
      feedback.className="bad";
    }
  });
  Studio.ready();
})();

</script>
