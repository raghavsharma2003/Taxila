<style>
*{box-sizing:border-box}
html,body{width:360px;height:320px;margin:0;overflow:hidden}
body{font-family:system-ui,sans-serif;background:#fff8ec;color:#493c34}
#app{width:360px;height:320px;padding:4px 12px;display:flex;flex-direction:column;gap:0}
h1{height:18px;flex:none;font-size:16px;line-height:18px;margin:0;text-align:center;color:#754b36}
#ask{height:20px;flex:none;text-align:center;font-size:14px;line-height:20px;color:#5b4b40}
#key{height:36px;flex:none;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;background:#f8e9cf;color:#584936;font-size:14px}
.symbol{width:20px;height:20px;flex:none;color:#dd864a;transition:transform .18s ease}
.row{width:100%;height:52px;min-height:52px;flex:none;padding:0 8px;border:2px solid #ead9c5;border-radius:14px;background:#fffdf8;color:#493c34;display:grid;grid-template-columns:64px minmax(0,1fr);align-items:center;text-align:left;cursor:pointer;transition:transform .14s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease}
.row:active{transform:scale(.975)}
.row:hover{border-color:#e6b77e;box-shadow:0 2px 8px #7655361c}
.row-name{font-size:14px;font-weight:650;white-space:nowrap}
.symbols{display:flex;align-items:center;gap:2px;white-space:nowrap}
.row:disabled{cursor:default}
#feedback{height:20px;flex:none;text-align:center;font-size:13px;line-height:20px;font-weight:650;color:#49785e}
#feedback.bad{color:#a65b42}
.done{animation:pop .38s ease}
@keyframes pop{50%{transform:scale(1.04)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
<main id="app">
  <h1 id="title"></h1>
  <div id="ask"></div>
  <div id="key" data-key=""></div>
  <div id="rows"></div>
  <div id="feedback"></div>
</main>
<script>

(()=>{
const p=Studio.params;
const title=document.getElementById("title");
const ask=document.getElementById("ask");
const keyBox=document.getElementById("key");
const rowsBox=document.getElementById("rows");
const feedback=document.getElementById("feedback");
title.textContent=Studio.t("title");
ask.textContent=Studio.t("ask");
const makeSymbol=()=>{
 const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
 svg.setAttribute("viewBox","0 0 24 24");
 svg.setAttribute("aria-hidden","true");
 svg.classList.add("symbol");
 svg.innerHTML='<path fill="currentColor" d="M12 2.3c1.4 2.1 7.2 7.1 7.2 12.1a7.2 7.2 0 1 1-14.4 0C4.8 9.4 10.6 4.4 12 2.3Z"/><path fill="#fff2d9" d="M8 14.5c.1-1.6 1.2-3.2 2.3-4.4-.2 2.4.2 3.5 1.1 4.4.6.6.5 1.9-.2 2.5-1.4 1.3-3.4.1-3.2-2.5Z"/>';
 return svg;
};
keyBox.append(makeSymbol());
const keyText=document.createElement("span");
keyText.textContent=Studio.t("keytext")+" "+p.symbolValue;
keyBox.append(keyText);
p.rows.forEach(row=>{
 const button=document.createElement("button");
 button.type="button";
 button.className="row";
 button.dataset.row=row.key;
 const name=document.createElement("span");
 name.className="row-name";
 name.textContent=Studio.t(row.key);
 const symbols=document.createElement("span");
 symbols.className="symbols";
 for(let i=0;i<row.value/p.symbolValue;i++){
  const symbol=makeSymbol();
  symbol.dataset.symbol="";
  symbols.append(symbol);
 }
 button.append(name,symbols);
 button.addEventListener("click",()=>{
  if(button.disabled)return;
  Studio.event("row_tap",{key:row.key});
  Studio.answer(row.key);
 });
 rowsBox.append(button);
});
Studio.onVerdict(({correct})=>{
 feedback.textContent=correct?Studio.t("right"):Studio.t("wrong");
 feedback.classList.toggle("bad",!correct);
 if(correct){
  rowsBox.querySelectorAll(".row").forEach(button=>button.disabled=true);
  ask.textContent=Studio.t("done");
  ask.classList.add("done");
  Studio.done();
 }
});
Studio.ready();
})();

</script>
