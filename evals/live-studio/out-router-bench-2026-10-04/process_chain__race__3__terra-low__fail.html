<style>
  *{box-sizing:border-box}
  #app{width:360px;height:320px;position:relative;overflow:hidden;background:linear-gradient(145deg,#fff7df,#e8f7ee);font-family:Arial,sans-serif;color:#384a55}
  #sky{position:absolute;inset:0;background:
    radial-gradient(circle at 12% 12%,rgba(255,202,104,.32) 0 22px,transparent 23px),
    radial-gradient(circle at 88% 18%,rgba(112,202,184,.22) 0 30px,transparent 31px)}
  #title{position:absolute;top:14px;left:18px;right:18px;text-align:center;font-size:22px;font-weight:800;letter-spacing:.2px;color:#80552e}
  #map{position:absolute;left:0;top:42px;width:360px;height:190px}
  #paths{position:absolute;inset:0;width:360px;height:190px;overflow:visible}
  .arrow{fill:none;stroke:#e3aa54;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .stage{position:absolute;width:64px;height:64px;border-radius:21px;background:#fffdf7;border:3px solid #e7c36e;box-shadow:0 5px 0 rgba(142,99,38,.12),0 8px 15px rgba(104,77,39,.12);display:flex;align-items:center;justify-content:center;transition:transform .34s ease,background .34s ease,border-color .34s ease,box-shadow .34s ease;z-index:3}
  .stage[data-hot="yes"]{transform:scale(1.12);background:#fff0ae;border-color:#e58e45;box-shadow:0 0 0 7px rgba(255,204,96,.31),0 7px 0 rgba(160,91,36,.16),0 10px 17px rgba(104,77,39,.16)}
  .stage[data-hot="yes"] .label{color:#954a28}
  .label{max-width:57px;text-align:center;line-height:1.05;font-size:12px;font-weight:800;color:#52715f;overflow-wrap:anywhere}
  #token{position:absolute;width:32px;height:32px;z-index:6;pointer-events:none;filter:drop-shadow(0 3px 2px rgba(76,79,74,.22));transition:none}
  #token svg{width:100%;height:100%;display:block}
  #next{position:absolute;left:154px;top:174px;width:52px;height:52px;border:0;border-radius:18px;background:#ee9156;color:white;font-size:23px;font-weight:900;box-shadow:0 5px 0 #c86a40,0 8px 13px rgba(136,78,38,.2);cursor:pointer;transition:transform .16s ease,opacity .25s ease;z-index:8}
  #next:active,.option:active{transform:scale(.92)}
  #next[disabled]{opacity:.35;cursor:default}
  #question{position:absolute;left:14px;right:14px;bottom:8px;height:96px;border-radius:22px;background:rgba(255,255,255,.92);box-shadow:0 6px 18px rgba(70,98,83,.14);padding:9px 10px;opacity:0;transform:translateY(15px);pointer-events:none;transition:opacity .35s ease,transform .35s ease;z-index:9}
  #question.show{opacity:1;transform:translateY(0);pointer-events:auto}
  #askline{height:27px;text-align:center;font-size:14px;font-weight:800;color:#51655a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #options{display:flex;gap:7px;justify-content:center}
  .option{width:100%;min-width:52px;height:52px;border:2px solid #9fd2b6;border-radius:16px;background:#effaf2;color:#35664f;font-size:12px;font-weight:800;cursor:pointer;transition:transform .16s ease,background .2s ease,border-color .2s ease}
  .option.pick{background:#fff0c4;border-color:#e9a74b;transform:translateY(-2px)}
  #feedback{position:absolute;top:48px;left:84px;right:84px;text-align:center;font-size:18px;font-weight:900;color:#418365;opacity:0;transform:translateY(-8px);transition:opacity .24s ease,transform .24s ease;z-index:12}
  #feedback.show{opacity:1;transform:translateY(0)}
  .pulse{animation:pulse .48s ease}
  @keyframes pulse{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
</style>
<div id="app" data-active="">
  <div id="sky"></div>
  <div id="title"></div>
  <div id="feedback"></div>
  <div id="map">
    <svg id="paths" viewBox="0 0 360 190" aria-hidden="true">
      <defs><marker id="tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e3aa54"></path></marker></defs>
    </svg>
    <div id="token" data-token>
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 C11 9 7 13 7 19a9 9 0 0 0 18 0c0-6-4-10-9-17Z" fill="#55b9b0"></path><circle cx="12" cy="18" r="2" fill="#fffdf4"></circle><circle cx="20" cy="18" r="2" fill="#fffdf4"></circle><path d="M13 23q3 2 6 0" fill="none" stroke="#fffdf4" stroke-width="1.6" stroke-linecap="round"></path></svg>
    </div>
  </div>
  <button id="next" data-action="next" type="button"></button>
  <div id="question">
    <div id="askline"></div>
    <div id="options"></div>
  </div>
</div>
<script>

(function(){
  var p=Studio.params, stages=p.stages, app=document.getElementById('app'), map=document.getElementById('map');
  var paths=document.getElementById('paths'), token=document.getElementById('token');
  var next=document.getElementById('next'), question=document.getElementById('question');
  var options=document.getElementById('options'), feedback=document.getElementById('feedback');
  var title=document.getElementById('title'), askline=document.getElementById('askline');
  var ns='http://www.w3.org/2000/svg', pos=[], boxes=[], active=0, moving=false, complete=false;

  title.textContent=Studio.t('title');
  next.textContent=Studio.t('next');

  function point(i){
    var n=stages.length;
    if(p.cycle){
      var a=(-Math.PI/2)+(Math.PI*2*i/n);
      return {x:180+Math.cos(a)*112,y:96+Math.sin(a)*70};
    }
    return {x:32+(296*(n===1?0:i/(n-1))),y:73};
  }
  for(var i=0;i<stages.length;i++) pos.push(point(i));

  function addPath(from,to,last){
    var path=document.createElementNS(ns,'path');
    path.setAttribute('class','arrow');
    path.setAttribute('data-arrow',stages[from]+'>'+stages[to]);
    var a=pos[from],b=pos[to], dx=b.x-a.x,dy=b.y-a.y, len=Math.sqrt(dx*dx+dy*dy)||1;
    var sx=a.x+dx/len*36,sy=a.y+dy/len*36,ex=b.x-dx/len*38,ey=b.y-dy/len*38;
    if(last && p.cycle){
      var mx=(sx+ex)/2,my=(sy+ey)/2;
      var cx=mx+(mx<180?58:-58),cy=my+25;
      path.setAttribute('d','M '+sx+' '+sy+' Q '+cx+' '+cy+' '+ex+' '+ey);
    }else path.setAttribute('d','M '+sx+' '+sy+' L '+ex+' '+ey);
    path.setAttribute('marker-end','url(#tip)');
    paths.appendChild(path);
  }
  for(i=0;i<stages.length-1;i++) addPath(i,i+1,false);
  if(p.cycle && stages.length>1) addPath(stages.length-1,0,true);

  for(i=0;i<stages.length;i++){
    var box=document.createElement('div');
    box.className='stage';
    box.setAttribute('data-stage',stages[i]);
    box.style.left=(pos[i].x-32)+'px';
    box.style.top=(pos[i].y-32)+'px';
    var label=document.createElement('div');
    label.className='label';
    label.setAttribute('data-label',stages[i]);
    label.textContent=Studio.t(stages[i]);
    box.appendChild(label); map.appendChild(box); boxes.push(box);
  }

  askline.textContent=Studio.t('ask')+' '+Studio.t(p.askAfter);
  for(i=0;i<p.options.length;i++){
    (function(key){
      var b=document.createElement('button');
      b.className='option'; b.type='button'; b.setAttribute('data-option',key);
      b.textContent=Studio.t(key);
      b.addEventListener('click',function(){
        b.classList.add('pick'); setTimeout(function(){b.classList.remove('pick')},250);
        Studio.event('option',{key:key});
        Studio.answer(key);
      });
      options.appendChild(b);
    })(p.options[i]);
  }

  function place(q){token.style.left=(q.x-16)+'px';token.style.top=(q.y-16)+'px'}
  function setActive(i){
    active=i; app.setAttribute('data-active',stages[i]);
    for(var j=0;j<boxes.length;j++) boxes[j].setAttribute('data-hot',j===i?'yes':'no');
    place(pos[i]);
    if(stages[i]===p.askAfter){
      question.classList.add('show'); next.style.opacity='0'; next.style.pointerEvents='none';
    }
  }
  function travel(from,to){
    moving=true; next.disabled=true;
    var start=pos[from], end=pos[to], began=null, duration=680;
    function frame(now){
      if(!began) began=now;
      var r=Math.min(1,(now-began)/duration), e=1-Math.pow(1-r,3);
      var x=start.x+(end.x-start.x)*e, y=start.y+(end.y-start.y)*e;
      place({x:x,y:y});
      if(r<1) requestAnimationFrame(frame);
      else{
        moving=false; setActive(to); next.disabled=false;
        boxes[to].classList.add('pulse'); setTimeout(function(){boxes[to].classList.remove('pulse')},500);
      }
    }
    requestAnimationFrame(frame);
  }
  next.addEventListener('click',function(){
    if(moving||complete)return;
    var to=active+1;
    if(to>=stages.length){if(p.cycle)to=0;else return}
    Studio.event('next',{stage:active});
    travel(active,to);
  });
  Studio.onVerdict(function(v){
    feedback.textContent=Studio.t(v.correct?'right':'wrong');
    feedback.classList.add('show');
    setTimeout(function(){feedback.classList.remove('show')},900);
    if(v.correct&&!complete){
      complete=true;
      setTimeout(function(){Studio.done()},350);
    }
  });
  setActive(0);
  Studio.ready();
})();

</script>
