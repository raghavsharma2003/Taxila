<style>
*{box-sizing:border-box}
html,body{margin:0;width:360px;height:320px;overflow:hidden}
body{font-family:system-ui,sans-serif;background:#fff8eb;color:#374c3b}
.card{width:360px;height:320px;padding:10px 14px;background:linear-gradient(155deg,#fffaf0,#f2f8e8);overflow:hidden}
h1{height:32px;margin:0;text-align:center;font-size:20px;line-height:28px;color:#356447}
.question{height:40px;display:flex;justify-content:center;align-items:center;gap:5px;text-align:center;font-size:14px;font-weight:650;color:#604e36}
svg{display:block;width:332px;height:214px;overflow:visible}
.part{cursor:pointer;transition:filter .25s,transform .18s;transform-box:fill-box;transform-origin:center}
.part:active{transform:scale(.95)}
.part:focus{outline:none;filter:drop-shadow(0 0 5px #edb844)}
.part.glow{filter:drop-shadow(0 0 10px #f2b72e);animation:pulse .75s ease-in-out 2}
.leader{fill:none;stroke:#8b947c;stroke-width:1.5;stroke-linecap:round}
.label{font-size:12px;font-weight:650;fill:#4a5d44}
.feedback{height:22px;text-align:center;font-size:13px;font-weight:650;color:#527345}
.hit{fill:transparent;stroke:transparent;pointer-events:all}
@keyframes pulse{50%{filter:drop-shadow(0 0 15px #f2b72e)}}
</style>
<div class="card">
  <h1 id="title"></h1>
  <div class="question" data-ask><span id="ask"></span><span id="asked-part"></span></div>
  <svg viewBox="0 0 332 214" aria-hidden="true">
    <path class="leader" d="M96 24 L139 43"/>
    <path class="leader" d="M214 57 L195 57"/>
    <path class="leader" d="M107 129 L134 123"/>
    <path class="leader" d="M218 145 L180 137"/>
    <path class="leader" d="M213 185 L186 178"/>
    <g class="part" tabindex="0" role="button" aria-label="">
      <ellipse cx="150" cy="39" rx="30" ry="24" fill="#f49b79"/>
      <ellipse cx="191" cy="39" rx="30" ry="24" fill="#f49b79"/>
      <ellipse cx="132" cy="69" rx="30" ry="24" transform="rotate(-42 132 69)" fill="#f49b79"/>
      <ellipse cx="209" cy="69" rx="30" ry="24" transform="rotate(42 209 69)" fill="#f49b79"/>
      <ellipse cx="170" cy="82" rx="30" ry="24" fill="#f49b79"/>
      <ellipse class="hit" cx="170" cy="57" rx="52" ry="42"/>
    </g>
    <g class="part" tabindex="0" role="button" aria-label="">
      <circle cx="170" cy="57" r="25" fill="#f2c84b"/>
      <circle cx="170" cy="57" r="17" fill="#f7d96e"/>
      <circle class="hit" cx="170" cy="57" r="29"/>
    </g>
    <g class="part" tabindex="0" role="button" aria-label="">
      <path d="M160 79 Q165 119 160 157 L181 157 Q176 119 181 79Z" fill="#579456"/>
      <rect class="hit" x="142" y="78" width="56" height="82" rx="16"/>
    </g>
    <g class="part" tabindex="0" role="button" aria-label="">
      <path d="M164 117 Q121 88 102 116 Q122 148 164 135Z" fill="#79b95c"/>
      <path d="M110 116 Q137 126 160 132" fill="none" stroke="#4e8a4b" stroke-width="2"/>
      <ellipse class="hit" cx="133" cy="118" rx="33" ry="27"/>
    </g>
    <g class="part" tabindex="0" role="button" aria-label="">
      <path d="M160 153 Q153 170 141 195 M169 154 Q170 175 165 201 M179 153 Q191 170 202 193 M155 171 L137 184 M174 174 L190 187" fill="none" stroke="#a97a4d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse class="hit" cx="170" cy="177" rx="34" ry="31"/>
    </g>
    <text class="label" x="55" y="27"></text>
    <text class="label" x="218" y="61"></text>
    <text class="label" x="57" y="133"></text>
    <text class="label" x="222" y="149"></text>
    <text class="label" x="215" y="189"></text>
  </svg>
  <div class="feedback" id="feedback" aria-live="polite"></div>
</div>
<script>

(()=>{
  const p=Studio.params;
  const $=s=>document.querySelector(s);
  $('#title').textContent=Studio.t('title');
  $('#ask').textContent=Studio.t('ask');
  $('#asked-part').textContent=Studio.t(p.ask);
  const parts=[...document.querySelectorAll('.part')];
  const labels=[...document.querySelectorAll('.label')];
  p.parts.forEach((key,i)=>{
    parts[i].dataset.part=key;
    parts[i].setAttribute('aria-label',Studio.t(key));
    labels[i].dataset.label=key;
    labels[i].textContent=Studio.t(key);
  });
  let pending=false,finished=false;
  Studio.ready();
  function choose(el){
    if(pending||finished)return;
    pending=true;
    Studio.event('part_tap',{part:el.dataset.part});
    Studio.answer(el.dataset.part);
  }
  parts.forEach(el=>{
    el.addEventListener('click',()=>choose(el));
    el.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(el)}
    });
  });
  Studio.onVerdict(({correct})=>{
    pending=false;
    if(correct){
      finished=true;
      const chosen=parts.find(el=>el.dataset.part===p.ask);
      if(chosen)chosen.classList.add('glow');
      $('#feedback').textContent=Studio.t('right')+' '+Studio.t('done');
      Studio.done();
    }else{
      $('#feedback').textContent=Studio.t('wrong');
    }
  });
})();

</script>
