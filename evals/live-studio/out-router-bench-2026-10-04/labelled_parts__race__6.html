<style>
*{box-sizing:border-box}
html,body{width:360px;height:320px;margin:0;overflow:hidden}
body{background:#fff8eb;color:#35463b;font-family:system-ui,sans-serif}
.scene{width:360px;height:320px;padding:8px 14px;overflow:hidden;background:radial-gradient(ellipse at 50% 72%,#f2f6d9 0%,#fff8eb 65%)}
h1{height:28px;margin:0;text-align:center;font-size:20px;line-height:28px;font-weight:750;color:#365a45}
.question{height:28px;margin:1px 0 0;text-align:center;font-size:16px;line-height:26px;font-weight:650;color:#76533f}
svg{display:block;width:332px;height:218px;overflow:hidden}
.leader{fill:none;stroke:#8d9b79;stroke-width:1.8;stroke-linecap:round}
.label{font:600 13px system-ui,sans-serif;fill:#435544}
.part{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:filter .22s,transform .18s}
.part:active{transform:scale(.94)}
.part.correct{filter:drop-shadow(0 0 7px #f3b922);animation:glow .65s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 3px #f3b922)}to{filter:drop-shadow(0 0 10px #f3b922)}}
.feedback{height:20px;text-align:center;font-size:13px;line-height:18px;font-weight:700;color:#47744c;overflow:hidden}
.hit{fill:transparent;pointer-events:all}
</style>
<main class="scene">
  <h1 id="title"></h1>
  <div class="question" id="question" data-ask></div>
  <svg viewBox="0 0 332 245" preserveAspectRatio="none" role="img" aria-label="">
    <path class="leader" d="M112 45L140 61M220 45L193 61M94 117L143 116M222 117L189 119M166 186L166 202"/>
    <g class="part" data-part="petal" tabindex="0" role="button">
      <path d="M166 31C156 13 134 20 139 39C121 35 115 57 135 63C123 78 139 92 155 79C160 98 180 98 177 78C197 89 211 70 192 61C212 49 201 30 183 38C184 19 165 14 166 31Z" fill="#f28a78" stroke="#dc705f" stroke-width="2"/>
    </g>
    <g class="part" data-part="centre" tabindex="0" role="button">
      <circle cx="166" cy="57" r="29" fill="#f6c84d" stroke="#dba934" stroke-width="2"/>
      <circle cx="166" cy="57" r="17" fill="#ffdf75"/>
    </g>
    <g class="part" data-part="stem" tabindex="0" role="button">
      <rect x="139" y="91" width="54" height="78" rx="18" fill="#5c9c58" stroke="#477f49" stroke-width="2"/>
    </g>
    <g class="part" data-part="leaf" tabindex="0" role="button">
      <rect class="hit" x="78" y="94" width="64" height="62" rx="20"/>
      <path d="M139 125C119 100 83 101 79 124C98 147 122 149 139 125Z" fill="#80b95f" stroke="#5d984d" stroke-width="2"/>
      <path d="M87 119L131 129" fill="none" stroke="#5d984d" stroke-width="2"/>
    </g>
    <g class="part" data-part="root" tabindex="0" role="button">
      <path d="M140 171C149 182 148 196 137 210L126 229L151 221L165 238L179 220L202 228L190 207C180 194 181 182 192 171Z" fill="#c98a59" stroke="#a86f48" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <text class="label" data-label="petal" x="85" y="43" text-anchor="end"></text>
    <text class="label" data-label="centre" x="229" y="43"></text>
    <text class="label" data-label="leaf" x="74" y="121" text-anchor="end"></text>
    <text class="label" data-label="stem" x="229" y="121"></text>
    <text class="label" data-label="root" x="166" y="239" text-anchor="middle"></text>
  </svg>
  <div class="feedback" id="feedback" aria-live="polite"></div>
</main>
<script>

(()=>{
  const p=Studio.params;
  const title=document.getElementById("title");
  const question=document.getElementById("question");
  const feedback=document.getElementById("feedback");
  title.textContent=Studio.t("title");
  question.textContent=Studio.t("ask");
  document.querySelectorAll("[data-label]").forEach(el=>{
    const key=el.getAttribute("data-label");
    if(p.parts.includes(key)) el.textContent=Studio.t(key);
  });
  let pending=null, complete=false;
  const choose=el=>{
    if(complete)return;
    pending=el.getAttribute("data-part");
    Studio.event("tap",{part:pending});
    Studio.answer(pending);
  };
  document.querySelectorAll("[data-part]").forEach(el=>{
    if(!p.parts.includes(el.getAttribute("data-part")))return;
    el.addEventListener("click",()=>choose(el));
    el.addEventListener("keydown",e=>{
      if(e.key==="Enter"||e.key===" "){e.preventDefault();choose(el);}
    });
  });
  Studio.onVerdict(result=>{
    if(complete||pending===null)return;
    if(result.correct){
      document.querySelector('[data-part="'+pending+'"]').classList.add("correct");
      feedback.textContent=Studio.t("right")+" "+Studio.t("done");
      complete=true;
      Studio.done();
    }else{
      feedback.textContent=Studio.t("wrong");
      pending=null;
    }
  });
  Studio.ready();
})();

</script>
