<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;background:#fff7e9;color:#493b35;font-family:system-ui,sans-serif}
  .game{width:360px;height:320px;padding:15px 18px;background:radial-gradient(circle at 90% 8%,#ffe4bb 0 48px,transparent 49px),#fff7e9}
  h1{font-size:20px;line-height:26px;margin:0 0 2px;font-weight:800}
  .instr{font-size:13px;line-height:18px;margin:0;color:#75635a}
  .card{height:65px;margin-top:10px;border-radius:18px;background:#fff;box-shadow:0 4px 0 #f0dfcb;display:flex;align-items:center;justify-content:center}
  [data-target]{font-size:36px;font-weight:850;color:#b44e45}
  .line{height:105px;position:relative;margin:8px 10px 0}
  .rail{position:absolute;left:18px;right:18px;top:53px;height:5px;border-radius:8px;background:#b99d83}
  [data-tick]{position:absolute;top:-8px;width:2px;height:21px;transform:translateX(-50%);background:#806d60;border-radius:2px}
  [data-tick] span{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;white-space:nowrap;color:#685850}
  [data-marker]{position:absolute;top:15px;left:0;transform:translateX(-50%);width:36px;height:36px;border-radius:50% 50% 48% 48%;background:#f09a68;border:4px solid #fff;box-shadow:0 3px 0 #bd674c,0 5px 10px #8a594744;transition:left .22s ease,transform .22s ease;z-index:2}
  [data-marker].hop{animation:hop .45s ease}
  @keyframes hop{50%{transform:translate(-50%,-20px) rotate(12deg)}}
  .controls{display:flex;gap:10px;margin-top:0}
  button{height:58px;min-width:72px;border:0;border-radius:17px;background:#f4d9ba;color:#493b35;font:800 16px system-ui,sans-serif;box-shadow:0 4px 0 #d8b997;cursor:pointer;transition:transform .15s,background .15s}
  button:active{transform:translateY(3px) scale(.96);box-shadow:0 1px 0 #d8b997}
  button:disabled{opacity:.55;cursor:default}
  [data-action=left],[data-action=right]{flex:1}
  [data-action=check]{flex:1.25;background:#72b6a0;box-shadow:0 4px 0 #488c78;color:#173f36}
  .feedback{height:24px;text-align:center;padding-top:6px;font-size:14px;font-weight:750;color:#9b5a50}
  .feedback.good{color:#36846e}
  .finished{display:none;height:245px;align-items:center;justify-content:center;text-align:center;font-size:28px;font-weight:850;color:#36846e}
</style>
<div class="game">
  <h1 id="title"></h1>
  <p class="instr" id="instr"></p>
  <div id="item" data-item="">
    <div class="card"><span data-target></span></div>
    <div class="line">
      <div class="rail" id="rail"><div data-marker data-value=""></div></div>
    </div>
    <div class="controls">
      <button type="button" data-action="left"></button>
      <button type="button" data-action="right"></button>
      <button type="button" data-action="check"></button>
    </div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
  </div>
  <div class="finished" id="finished"></div>
</div>
<script>

(()=>{
  const p=Studio.params, round=n=>Math.round(n*1e6)/1e6;
  const count=Math.round((p.max-p.min)/p.step);
  const value=k=>round(p.min+k*p.step);
  const gcd=(a,b)=>b?gcd(b,a%b):a;
  function format(n){
    if(p.format==='fraction'){
      let den=1;
      while(den<1000000 && Math.abs(Math.round(n*den)-n*den)>1e-7) den*=10;
      let num=Math.round(n*den), g=gcd(Math.abs(num),den);
      return (num/g)+'/'+(den/g);
    }
    if(p.format==='integer') return String(Math.round(n));
    const decimals=Math.min(6,Math.max(0,(String(p.step).split('.')[1]||'').length));
    return String(Number(n.toFixed(decimals)));
  }
  const rail=document.getElementById('rail'), marker=document.querySelector('[data-marker]');
  const item=document.getElementById('item'), target=document.querySelector('[data-target]');
  const feedback=document.getElementById('feedback');
  const buttons=[...document.querySelectorAll('button')];
  document.getElementById('title').textContent=Studio.t('title');
  document.getElementById('instr').textContent=Studio.t('instr');
  for(const key of ['left','right','check']){
    document.querySelector('[data-action="'+key+'"]').textContent=Studio.t(key==='right'?'right_btn':key);
  }
  for(let i=0;i<=count;i++){
    const tick=document.createElement('div');
    tick.dataset.tick=String(value(i));
    tick.style.left=(i/count*100)+'%';
    if(i%p.labelEvery===0){
      const label=document.createElement('span');
      label.textContent=format(value(i));
      tick.appendChild(label);
    }
    rail.appendChild(tick);
  }
  let index=0,k=Math.max(0,Math.min(count,Math.round((p.start-p.min)/p.step))),busy=false;
  function update(){
    marker.style.left=(k/count*100)+'%';
    marker.dataset.value=String(value(k));
  }
  function show(){
    item.dataset.item=String(p.items[index].id);
    target.textContent=format(p.items[index].target);
    k=Math.max(0,Math.min(count,Math.round((p.start-p.min)/p.step)));
    feedback.textContent='';
    feedback.className='feedback';
    update();
  }
  buttons.forEach(button=>button.addEventListener('click',()=>{
    if(busy)return;
    const action=button.dataset.action;
    if(action==='check'){
      busy=true;
      Studio.event('check',{value:value(k)});
      Studio.answer({value:value(k)});
    }else{
      k=Math.max(0,Math.min(count,k+(action==='left'?-1:1)));
      update();
      Studio.event('move',{value:value(k)});
    }
  }));
  Studio.onVerdict(({correct})=>{
    if(correct){
      feedback.textContent=Studio.t('right');
      feedback.className='feedback good';
      marker.classList.remove('hop');
      void marker.offsetWidth;
      marker.classList.add('hop');
      setTimeout(()=>{
        marker.classList.remove('hop');
        index++;
        if(index>=p.items.length){
          item.style.display='none';
          const finished=document.getElementById('finished');
          finished.textContent=Studio.t('done');
          finished.style.display='flex';
          Studio.done();
        }else{show();busy=false}
      },550);
    }else{
      feedback.textContent=Studio.t('wrong');
      feedback.className='feedback';
      busy=false;
    }
  });
  show();
  Studio.ready();
})();

</script>
