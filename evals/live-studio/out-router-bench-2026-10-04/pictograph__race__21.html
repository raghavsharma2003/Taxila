<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;font-family:system-ui,sans-serif;background:#fff8ec;color:#493a38}
  #card{width:360px;height:320px;padding:16px 18px;background:radial-gradient(circle at 92% 5%,#ffe3bc 0 54px,transparent 55px),#fff8ec;display:flex;flex-direction:column}
  #title{font-size:21px;font-weight:800;line-height:26px}
  #ask{font-size:15px;line-height:20px;margin:3px 0 8px}
  #rows{display:flex;flex-direction:column;gap:7px;min-height:0;flex:1}
  .row{width:100%;min-height:56px;border:2px solid #edd7c2;border-radius:17px;background:#fffdf8;display:flex;align-items:center;padding:5px 10px;gap:10px;color:inherit;font:inherit;cursor:pointer;text-align:left;transition:transform .18s,background .18s,border-color .18s}
  .row:active{transform:scale(.97)}
  .row:focus-visible{outline:3px solid #8f665e;outline-offset:2px}
  .name{width:48px;flex:none;font-weight:750;font-size:15px}
  .symbols{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  .symbol{width:30px;height:30px;flex:none;filter:drop-shadow(0 2px 1px #d7a99a55)}
  #key{height:39px;flex:none;display:flex;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:650}
  #key .symbol{width:25px;height:25px}
  #feedback{height:23px;flex:none;text-align:center;font-size:15px;font-weight:750;color:#80534e}
  .row.pulse{animation:pulse .45s ease}
  @keyframes pulse{50%{transform:scale(1.025);background:#fff0da}}
</style>
<div id="card">
  <div id="title"></div>
  <div id="ask"></div>
  <div id="rows"></div>
  <div id="key" data-key>
    <span id="keytext"></span>
    <svg class="symbol" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="8" r="6" fill="#f5a897"/>
      <circle cx="24" cy="14" r="6" fill="#f5a897"/>
      <circle cx="21" cy="23" r="6" fill="#f5a897"/>
      <circle cx="11" cy="23" r="6" fill="#f5a897"/>
      <circle cx="8" cy="14" r="6" fill="#f5a897"/>
      <circle cx="16" cy="16" r="5" fill="#f4ce70"/>
    </svg>
    <span id="keynumber"></span>
  </div>
  <div id="feedback" aria-live="polite"></div>
</div>
<script>

  const p=Studio.params;
  const rows=document.getElementById('rows');
  const feedback=document.getElementById('feedback');
  const flower=document.querySelector('#key svg');
  document.getElementById('title').textContent=Studio.t('title');
  document.getElementById('ask').textContent=Studio.t('ask');
  document.getElementById('keytext').textContent=Studio.t('keytext');
  document.getElementById('keynumber').textContent=p.symbolValue;
  let pending=false,finished=false,selected=null;
  p.rows.forEach(item=>{
    const row=document.createElement('button');
    row.type='button';
    row.className='row';
    row.setAttribute('data-row',item.key);
    const name=document.createElement('span');
    name.className='name';
    name.textContent=Studio.t(item.key);
    const symbols=document.createElement('span');
    symbols.className='symbols';
    for(let i=0;i<item.value/p.symbolValue;i++){
      const symbol=flower.cloneNode(true);
      symbol.removeAttribute('id');
      symbol.setAttribute('data-symbol','');
      symbols.appendChild(symbol);
    }
    row.append(name,symbols);
    row.addEventListener('click',()=>{
      if(pending||finished)return;
      pending=true;
      selected=row;
      row.classList.remove('pulse');
      void row.offsetWidth;
      row.classList.add('pulse');
      Studio.event('row_tap',{key:item.key});
      Studio.answer(item.key);
    });
    rows.appendChild(row);
  });
  Studio.onVerdict(({correct})=>{
    if(!pending||finished)return;
    pending=false;
    feedback.textContent=Studio.t(correct?'right':'wrong');
    if(correct){
      finished=true;
      feedback.textContent=Studio.t('done');
      Studio.done();
    }else if(selected){
      selected.classList.remove('pulse');
    }
  });
  Studio.ready();

</script>
