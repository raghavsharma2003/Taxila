<style>
  *{box-sizing:border-box}
  #app{
    width:360px;height:320px;overflow:hidden;position:relative;
    background:linear-gradient(180deg,#fff7e7 0%,#ffe9bd 100%);
    color:#5b3827;font-family:Arial,sans-serif;
  }
  #title{
    position:absolute;top:8px;left:14px;right:14px;text-align:center;
    font-size:21px;font-weight:800;color:#914c2c;line-height:25px;
  }
  #instruction{
    position:absolute;top:38px;left:18px;right:18px;text-align:center;
    font-size:13px;font-weight:700;color:#7b6047;line-height:17px;
  }
  #balance{
    position:absolute;left:0;top:57px;width:360px;height:166px;
  }
  #beamSvg{
    position:absolute;left:20px;top:35px;width:320px;height:110px;overflow:visible;
  }
  #beamArm{
    transform-origin:160px 42px;
    transition:transform 650ms cubic-bezier(.25,1.45,.45,1);
  }
  .pan{
    position:absolute;top:69px;width:124px;height:92px;
    transition:transform 650ms cubic-bezier(.25,1.45,.45,1);
  }
  #leftPan{left:16px}
  #rightPan{right:16px}
  .dish{
    position:absolute;bottom:0;left:6px;width:112px;height:31px;
    border:4px solid #bb6b3d;border-top:0;
    border-radius:0 0 56px 56px;
    background:linear-gradient(180deg,#ffd68c,#f7a950);
    box-shadow:0 5px 0 rgba(144,74,38,.18);
  }
  .dish:before{
    content:"";position:absolute;left:-4px;top:-9px;width:112px;height:14px;
    border-radius:50%;background:#ffdda0;border:4px solid #bb6b3d;
  }
  .weights{
    position:absolute;bottom:18px;left:12px;width:100px;min-height:34px;
    display:flex;flex-wrap:wrap-reverse;justify-content:center;align-content:flex-end;
    gap:2px;z-index:2;
  }
  .weight{
    width:36px;height:32px;border-radius:9px 9px 7px 7px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#7bc6c0,#398c91);
    border:2px solid #286e76;color:#fffdf3;font-size:15px;font-weight:800;
    box-shadow:inset 0 2px rgba(255,255,255,.38),0 3px 0 #236a70;
    animation:land .34s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes land{from{transform:translateY(-18px) scale(.65)}to{transform:translateY(0) scale(1)}}
  #feedback{
    position:absolute;top:218px;left:34px;right:34px;height:22px;text-align:center;
    font-size:15px;font-weight:800;color:#9a4b2b;
    opacity:0;transform:translateY(-5px);transition:.25s;
  }
  #feedback.show{opacity:1;transform:translateY(0)}
  #feedback.good{color:#277c65;animation:cheer .65s ease-in-out}
  @keyframes cheer{50%{transform:translateY(-7px) scale(1.12)}}
  #options{
    position:absolute;bottom:10px;left:42px;width:276px;height:60px;
    display:flex;justify-content:space-between;gap:10px;
  }
  .option{
    width:82px;height:58px;border:0;border-radius:16px;
    background:linear-gradient(135deg,#fc8562,#df4d45);
    border:3px solid #ae4039;box-shadow:0 5px 0 #a53b37;
    color:#fffaf0;font-size:20px;font-weight:800;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:transform .16s,filter .16s,opacity .16s;
    user-select:none;
  }
  .option:nth-child(2){background:linear-gradient(135deg,#ffb956,#e67a31);border-color:#b65a27;box-shadow:0 5px 0 #a95025}
  .option:nth-child(3){background:linear-gradient(135deg,#8ccf84,#469967);border-color:#347452;box-shadow:0 5px 0 #296346}
  .option:active{transform:translateY(4px) scale(.94);box-shadow:0 1px 0 #934039}
  .option.chosen{transform:translateY(-8px) scale(1.08);filter:brightness(1.1)}
  .option.off{opacity:.38;pointer-events:none}
  #done{
    position:absolute;left:26px;right:26px;bottom:30px;text-align:center;
    font-size:20px;font-weight:800;color:#39735c;opacity:0;
    transform:scale(.8);transition:.4s;
  }
  #done.show{opacity:1;transform:scale(1)}
  .spark{
    position:absolute;width:9px;height:9px;border-radius:50%;background:#ffbd4a;
    opacity:0;pointer-events:none;
  }
  #app.celebrate .spark{animation:spark .75s ease-out}
  @keyframes spark{20%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.3)}}
</style>
<div id="app">
  <div id="title"></div>
  <div id="instruction"></div>
  <div id="balance">
    <svg id="beamSvg" viewBox="0 0 320 110" aria-hidden="true">
      <g id="beamArm" data-beam data-tilt="level">
        <rect x="19" y="36" width="282" height="12" rx="6" fill="#b8663e"></rect>
        <rect x="25" y="38" width="270" height="5" rx="3" fill="#e6a061"></rect>
        <path d="M41 48 L49 65 M279 48 L271 65" stroke="#965132" stroke-width="4" stroke-linecap="round"></path>
      </g>
      <path d="M160 42 L138 94 L182 94 Z" fill="#d77b42" stroke="#984d30" stroke-width="4" stroke-linejoin="round"></path>
      <rect x="128" y="93" width="64" height="11" rx="5" fill="#a95131"></rect>
      <circle cx="160" cy="42" r="10" fill="#ffca68" stroke="#984d30" stroke-width="4"></circle>
    </svg>
    <div id="leftPan" class="pan" data-pan="left" data-total="">
      <div class="weights"></div><div class="dish"></div>
    </div>
    <div id="rightPan" class="pan" data-pan="right" data-total="">
      <div class="weights"></div><div class="dish"></div>
    </div>
  </div>
  <div id="feedback"></div>
  <div id="options"></div>
  <div id="done"></div>
  <i class="spark" style="left:116px;top:116px;--x:-38px;--y:-41px"></i>
  <i class="spark" style="left:238px;top:119px;--x:39px;--y:-38px"></i>
  <i class="spark" style="left:180px;top:90px;--x:0px;--y:-38px"></i>
</div>
<script>

(function(){
  var p=Studio.params, items=p.items, index=0, chosen=null, waiting=false;
  var app=document.getElementById("app");
  var leftPan=document.getElementById("leftPan");
  var rightPan=document.getElementById("rightPan");
  var beam=document.getElementById("beamArm");
  var options=document.getElementById("options");
  var feedback=document.getElementById("feedback");
  var done=document.getElementById("done");

  document.getElementById("title").textContent=Studio.t("title");
  document.getElementById("instruction").textContent=Studio.t("instr");

  function sum(a){
    var n=0;
    for(var i=0;i<a.length;i++) n+=a[i];
    return n;
  }
  function weight(value){
    var w=document.createElement("div");
    w.className="weight";
    w.setAttribute("data-weight",value);
    w.textContent=value;
    return w;
  }
  function tilt(forceLevel){
    var item=items[index];
    var l=sum(item.left), r=sum(item.right)+(chosen===null?0:chosen);
    leftPan.setAttribute("data-total",l);
    rightPan.setAttribute("data-total",r);
    var side=forceLevel ? "level" : (l>r ? "left" : (r>l ? "right" : "level"));
    beam.setAttribute("data-tilt",side);
    var angle=side==="left" ? -8 : side==="right" ? 8 : 0;
    beam.style.transform="rotate("+angle+"deg)";
    leftPan.style.transform="translateY("+(side==="left"?15:side==="right"?-3:6)+"px)";
    rightPan.style.transform="translateY("+(side==="right"?15:side==="left"?-3:6)+"px)";
  }
  function showWeights(){
    var item=items[index];
    var lw=leftPan.querySelector(".weights"), rw=rightPan.querySelector(".weights");
    lw.innerHTML="";rw.innerHTML="";
    for(var i=0;i<item.left.length;i++) lw.appendChild(weight(item.left[i]));
    for(var j=0;j<item.right.length;j++) rw.appendChild(weight(item.right[j]));
    if(chosen!==null) rw.appendChild(weight(chosen));
  }
  function message(key, good){
    feedback.textContent=Studio.t(key);
    feedback.className="show"+(good?" good":"");
  }
  function render(){
    var item=items[index];
    chosen=null; waiting=false; feedback.className=""; feedback.textContent="";
    showWeights();tilt(false);
    options.innerHTML="";
    for(var i=0;i<item.options.length;i++){
      (function(v){
        var o=document.createElement("div");
        o.className="option";
        o.setAttribute("data-option",v);
        o.textContent=v;
        o.setAttribute("role","button");
        o.setAttribute("tabindex","0");
        function choose(){
          if(waiting)return;
          waiting=true;chosen=v;o.classList.add("chosen");
          var all=options.querySelectorAll(".option");
          for(var k=0;k<all.length;k++) if(all[k]!==o) all[k].classList.add("off");
          showWeights();tilt(false);
          Studio.event("choose",{value:v});
          Studio.answer({value:v});
        }
        o.addEventListener("click",choose);
        o.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();choose();}});
        options.appendChild(o);
      })(item.options[i]);
    }
  }
  Studio.onVerdict(function(v){
    if(!waiting)return;
    if(v.correct){
      message("right",true);
      app.classList.add("celebrate");
      tilt(true);
      setTimeout(function(){
        app.classList.remove("celebrate");
        index++;
        if(index>=items.length){
          options.innerHTML="";
          feedback.className="";
          done.textContent=Studio.t("done");
          done.className="show";
          Studio.done();
        }else{
          render();
        }
      },900);
    }else{
      message("wrong",false);
      setTimeout(function(){
        chosen=null;waiting=false;
        showWeights();tilt(false);
        feedback.className="";
        var all=options.querySelectorAll(".option");
        for(var i=0;i<all.length;i++)all[i].classList.remove("chosen","off");
      },700);
    }
  });
  render();
  Studio.ready();
})();

</script>
