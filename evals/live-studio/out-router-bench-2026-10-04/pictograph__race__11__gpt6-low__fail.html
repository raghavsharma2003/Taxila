<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;font-family:system-ui,sans-serif;background:#fff7e9;color:#493729}
  .card{position:relative;width:360px;height:320px;overflow:hidden;background:radial-gradient(circle at 92% 4%,#ffe1ad 0 48px,transparent 49px),#fff7e9}
  .title{position:absolute;top:8px;left:16px;right:16px;height:32px;margin:0;font-size:21px;font-weight:800;line-height:32px}
  .ask{position:absolute;top:43px;left:16px;right:16px;height:35px;margin:0;font-size:16px;font-weight:650;line-height:35px}
  .keyline{position:absolute;top:82px;left:16px;right:16px;height:39px;display:flex;align-items:center;gap:9px;padding:0 12px;border-radius:14px;background:#fce7ca;font-size:14px;font-weight:700}
  [data-key]{display:flex;align-items:center;gap:6px;margin-left:auto;white-space:nowrap}
  .flower{width:32px;height:32px;flex:none;overflow:visible}
  .keyline .flower{width:25px;height:25px}
  .rows{position:absolute;top:126px;left:12px;right:12px;bottom:35px;display:flex;flex-direction:column;gap:3px}
  [data-row]{width:100%;flex:1;min-height:0;display:flex;align-items:center;border:2px solid #efd9bd;border-radius:15px;background:#fffdf8;padding:0 8px;text-align:left;color:inherit;cursor:pointer;transition:transform .2s,background .2s,border-color .2s}
  [data-row]:active{transform:scale(.97)}
  [data-row]:focus-visible{outline:3px solid #c77953;outline-offset:1px}
  .name{width:68px;flex:none;font-size:17px;font-weight:800}
  .symbols{display:flex;align-items:center;gap:5px;min-width:0}
  [data-row].picked{background:#ffedce;border-color:#df9364;transform:scale(1.015)}
  [data-row].celebrate{background:#e6f3d9;border-color:#88ae76}
  .status{position:absolute;left:16px;right:16px;bottom:5px;height:25px;margin:0;text-align:center;font-size:15px;font-weight:750;line-height:25px;color:#785747}
  .status.pop{animation:pop .35s ease-out}
  @keyframes pop{50%{transform:scale(1.08)}}
</style>
<div class="card">
  <h1 class="title" id="title"></h1>
  <p class="ask" id="ask"></p>
  <div class="keyline"><span id="keytext"></span><span data-key id="key"></span></div>
  <div class="rows" id="rows"></div>
  <p class="status" id="status" aria-live="polite"></p>
</div>
<script>

(() => {
  const p=Studio.params;
  const flower=() => {
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 32 32');
    svg.setAttribute('class','flower');
    svg.setAttribute('aria-hidden','true');
    svg.innerHTML='<g fill="#e8a17b"><ellipse cx="16" cy="7" rx="5" ry="6"/><ellipse cx="16" cy="25" rx="5" ry="6"/><ellipse cx="7" cy="16" rx="6" ry="5"/><ellipse cx="25" cy="16" rx="6" ry="5"/></g><circle cx="16" cy="16" r="6" fill="#f5c85d"/>';
    return svg;
  };
  document.getElementById('title').textContent=Studio.t('title');
  document.getElementById('ask').textContent=Studio.t('ask');
  document.getElementById('keytext').textContent=Studio.t('keytext');
  const key=document.getElementById('key');
  key.append(flower(),document.createTextNode(' = '+String(p.symbolValue)));
  const rows=document.getElementById('rows');
  const status=document.getElementById('status');
  let pending=false,complete=false,selected=null;
  p.rows.forEach(entry=>{
    const row=document.createElement('button');
    row.type='button';
    row.setAttribute('data-row',entry.key);
    const name=document.createElement('span');
    name.className='name';
    name.textContent=Studio.t(entry.key);
    const symbols=document.createElement('span');
    symbols.className='symbols';
    for(let i=0;i<entry.value/p.symbolValue;i++){
      const symbol=flower();
      symbol.setAttribute('data-symbol','');
      symbols.append(symbol);
    }
    row.append(name,symbols);
    row.addEventListener('click',()=>{
      if(pending||complete)return;
      pending=true;
      selected=row;
      row.classList.add('picked');
      Studio.event('row_tap',{row:entry.key});
      Studio.answer(entry.key);
    });
    rows.append(row);
  });
  Studio.onVerdict(({correct})=>{
    if(!pending||complete)return;
    pending=false;
    status.classList.remove('pop');
    void status.offsetWidth;
    status.classList.add('pop');
    if(correct){
      complete=true;
      selected.classList.add('celebrate');
      status.textContent=Studio.t('done');
      Studio.done();
    }else{
      selected.classList.remove('picked');
      status.textContent=Studio.t('wrong');
    }
  });
  Studio.ready();
})();

</script>
