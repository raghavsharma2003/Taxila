<style>
  *{box-sizing:border-box}
  html,body{width:360px;height:320px;margin:0;overflow:hidden}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff8ed;color:#493b35}
  .scene{position:relative;width:360px;height:320px;padding:14px 16px;background:radial-gradient(ellipse at 50% 0%,#fffdf8 0%,#fff8ed 72%)}
  h1{height:28px;margin:0;text-align:center;font-size:19px;line-height:28px;font-weight:750;color:#744d3d}
  .ask{height:28px;margin:1px 0 0;text-align:center;font-size:13px;line-height:20px;color:#796b61}
  .timeline{position:absolute;left:0;top:0;width:360px;height:320px}
  [data-axis]{position:absolute;left:32px;right:32px;top:218px;height:5px;border-radius:5px;background:#d99a66}
  [data-axis]::before,[data-axis]::after{content:"";position:absolute;top:-4px;width:13px;height:13px;border-radius:50%;background:#d99a66}
  [data-axis]::before{left:-2px}
  [data-axis]::after{right:-2px}
  .event{position:absolute;inset:0;pointer-events:none}
  [data-event]{position:absolute;top:211px;width:19px;height:19px;margin-left:-9px;border:4px solid #fff8ed;border-radius:50%;background:#e98258;box-shadow:0 0 0 2px #cf704e;z-index:2}
  [data-card]{position:absolute;width:112px;height:54px;padding:5px 7px;border:2px solid #edc49c;border-radius:14px;background:#fffdf8;color:#59453a;box-shadow:0 3px 0 #ead8c5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;pointer-events:auto;transition:transform .16s ease,background .2s,border-color .2s,box-shadow .2s}
  [data-card]:active{transform:scale(.95)}
  [data-card] .name{font-size:14px;font-weight:750;line-height:18px;white-space:nowrap}
  [data-card] .year{font-size:12px;line-height:14px;color:#93735e}
  .connector{position:absolute;inset:0;width:360px;height:320px;pointer-events:none;overflow:visible}
  .connector line{stroke:#cbb6a3;stroke-width:2;stroke-linecap:round}
  .feedback{position:absolute;left:16px;right:16px;top:258px;min-height:34px;text-align:center;font-size:15px;font-weight:700;color:#65846a}
  .feedback.wrong{color:#b56d56}
  .done{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:28px;text-align:center;background:#fff8edee;color:#65846a;font-size:22px;font-weight:800;z-index:5}
  .done.show{display:flex;animation:appear .35s ease both}
  @keyframes appear{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
<div class="scene">
  <h1 id="title"></h1>
  <p class="ask" id="ask"></p>
  <div class="timeline" id="timeline">
    <div data-axis></div>
    <svg class="connector" aria-hidden="true"></svg>
  </div>
  <div class="feedback" id="feedback" aria-live="polite"></div>
  <div class="done" id="done"></div>
</div>
<script>

(() => {
  const p = Studio.params;
  const t = key => Studio.t(key);
  document.getElementById("title").textContent = t("title");
  document.getElementById("ask").textContent = t("ask");

  const timeline = document.getElementById("timeline");
  const svg = timeline.querySelector("svg");
  const events = p.events;
  const years = events.map(event => Number(event.year));
  const minYear = Math.min(...years);
  const maxYear = Math.max(...years);
  const left = 32, right = 328;
  const xFor = year => maxYear === minYear ? (left + right) / 2 :
    left + (Number(year) - minYear) / (maxYear - minYear) * (right - left);
  const lanes = [36, 94, 152];
  const cards = [];

  events.forEach((event, index) => {
    const x = xFor(event.year);
    const cardCenter = Math.max(56, Math.min(304, x));
    const top = lanes[index % lanes.length];
    const node = document.createElement("div");
    node.className = "event";
    node.innerHTML = '<div data-event="' + event.key + '" data-year="' + event.year + '"></div>' +
      '<button type="button" data-card="' + event.key + '"><span class="name"></span><span class="year"></span></button>';
    const marker = node.querySelector("[data-event]");
    marker.style.left = x + "px";
    const button = node.querySelector("button");
    button.style.left = (cardCenter - 56) + "px";
    button.style.top = top + "px";
    button.querySelector(".name").textContent = t(event.key);
    button.querySelector(".year").textContent = event.year;
    timeline.appendChild(node);
    cards.push({x, center: cardCenter, top, button, key: event.key});
  });

  cards.forEach(card => {
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", card.center);
    line.setAttribute("y1", card.top + 54);
    line.setAttribute("x2", card.x);
    line.setAttribute("y2", 218);
    svg.appendChild(line);
  });

  Studio.ready();
  const feedback = document.getElementById("feedback");
  const done = document.getElementById("done");
  let submitted = false;
  cards.forEach(card => {
    card.button.addEventListener("click", () => {
      if (submitted) return;
      submitted = true;
      cards.forEach(item => { item.button.disabled = true; });
      Studio.event("event_tap", {key: card.key});
      Studio.answer(card.key);
    });
  });
  Studio.onVerdict(({correct}) => {
    if (correct) {
      feedback.textContent = t("right");
      done.textContent = t("done");
      done.classList.add("show");
      Studio.done();
    } else {
      feedback.textContent = t("wrong");
      feedback.classList.add("wrong");
      submitted = false;
      cards.forEach(item => { item.button.disabled = false; });
    }
  });
})();

</script>
