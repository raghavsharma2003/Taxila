<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;font-family:system-ui,sans-serif;background:#fff8ed;color:#493b39}
  #game{position:relative;width:360px;height:320px;overflow:hidden;background:radial-gradient(circle at 92% 5%,#ffe6b5 0 55px,transparent 56px),#fff8ed}
  .top{height:78px;padding:13px 18px 0}
  h1{margin:0;font-size:21px;line-height:27px;font-weight:800}
  #message{margin:3px 0 0;font-size:13px;line-height:19px;color:#79615b;min-height:19px}
  #cards{height:128px;padding:3px 34px 7px;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,52px);gap:9px 12px}
  .slot{min-width:0}
  .card{width:100%;height:52px;border:2px solid #e7b98c;border-radius:16px;background:#fffdf8;color:#493b39;font:700 17px system-ui,sans-serif;box-shadow:0 4px 0 #e9d5bf,0 7px 15px #795b3820;cursor:pointer;transition:transform .2s,box-shadow .2s,opacity .2s}
  .card:active{transform:scale(.95)}
  .card[data-selected="true"]{transform:translateY(-6px) rotate(-2deg);box-shadow:0 8px 0 #e9d5bf,0 12px 22px #df984e80;border-color:#e89d55}
  .card.shake{animation:shake .42s ease}
  @keyframes shake{20%,60%{transform:translateX(-6px) rotate(-3deg)}40%,80%{transform:translateX(6px) rotate(3deg)}}
  #bins{height:114px;padding:7px 10px 9px;display:flex;gap:7px;align-items:stretch}
  .bin{min-width:0;flex:1;border:2px solid #c9a994;border-bottom:6px solid #b98d73;border-radius:15px 15px 20px 20px;background:#f6e9db;cursor:pointer;padding:5px 3px 3px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .18s,background .18s}
  .bin:active{transform:scale(.96)}
  .bin.ready{background:#ffe8ca}
  .bin-name{font-size:14px;font-weight:800;line-height:19px;text-align:center;overflow-wrap:anywhere}
  .inside{width:100%;display:flex;flex-direction:column;align-items:center;gap:3px}
  .placed{width:94%;min-height:25px;padding:2px;border-radius:9px;background:#fffdf8;border:1px solid #e7b98c;text-align:center;font-size:13px;font-weight:700;line-height:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .placed.arrive{animation:arrive .4s ease both}
  @keyframes arrive{from{transform:translateY(-26px) scale(.8);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
  .spark{position:absolute;right:13px;top:21px;width:19px;height:19px;fill:#e9aa6a;pointer-events:none}
</style>
<div id="game">
  <div class="top"><h1 id="title"></h1><p id="message"></p></div>
  <svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0l2.5 8.5L23 12l-8.5 2.5L12 23l-2.5-8.5L1 12l8.5-3.5z"/></svg>
  <div id="cards"></div>
  <div id="bins"></div>
</div>
<script>

(() => {
  const p=Studio.params, cards=document.getElementById('cards'), bins=document.getElementById('bins');
  const message=document.getElementById('message');
  document.getElementById('title').textContent=Studio.t('title');
  message.textContent=Studio.t('instr');
  let selected=null, busy=false, remaining=p.cards.length;
  const binNodes=new Map();
  p.bins.forEach(key=>{
    const bin=document.createElement('div');
    bin.className='bin';
    bin.dataset.bin=key;
    const name=document.createElement('div');
    name.className='bin-name';
    name.textContent=Studio.t(key);
    const inside=document.createElement('div');
    inside.className='inside';
    bin.append(name,inside);
    bins.append(bin);
    binNodes.set(key,{bin,inside});
    bin.addEventListener('click',()=>{
      if(busy||!selected)return;
      busy=true;
      const card=selected, cardKey=card.dataset.card;
      Studio.answer({card:cardKey,bin:key});
      Studio.onVerdict(({correct})=>{
        if(correct){
          message.textContent=Studio.t('right');
          card.removeAttribute('data-card');
          card.removeAttribute('data-selected');
          const placed=document.createElement('div');
          placed.className='placed arrive';
          placed.dataset.placed=key;
          placed.textContent=Studio.t(cardKey);
          binNodes.get(key).inside.append(placed);
          card.remove();
          remaining--;
          selected=null;
          bins.querySelectorAll('.bin').forEach(b=>b.classList.remove('ready'));
          busy=false;
          if(remaining===0){message.textContent=Studio.t('done');Studio.done();}
        }else{
          message.textContent=Studio.t('wrong');
          card.classList.add('shake');
          card.dataset.selected='false';
          selected=null;
          bins.querySelectorAll('.bin').forEach(b=>b.classList.remove('ready'));
          setTimeout(()=>{card.classList.remove('shake');busy=false;},430);
        }
      });
    });
  });
  p.cards.forEach(key=>{
    const slot=document.createElement('div');
    slot.className='slot';
    const card=document.createElement('button');
    card.type='button';
    card.className='card';
    card.dataset.card=key;
    card.dataset.selected='false';
    card.textContent=Studio.t(key);
    card.addEventListener('click',()=>{
      if(busy)return;
      if(selected)selected.dataset.selected='false';
      selected=card;
      card.dataset.selected='true';
      message.textContent=Studio.t('instr');
      bins.querySelectorAll('.bin').forEach(b=>b.classList.add('ready'));
    });
    slot.append(card);
    cards.append(slot);
  });
  Studio.ready();
})();

</script>
