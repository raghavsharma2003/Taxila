<style>
*{box-sizing:border-box}
html,body{width:360px;height:320px;margin:0;overflow:hidden}
body{font-family:system-ui,sans-serif;background:#fff8eb;color:#44382f}
#app{width:360px;height:320px;padding:12px;display:flex;flex-direction:column;gap:7px}
header{height:42px;display:flex;align-items:center;justify-content:center;border-radius:15px;background:#ffe2b8;color:#704b30;font-size:19px;font-weight:800}
#prompt{min-height:34px;text-align:center;font-size:14px;font-weight:650;display:flex;align-items:center;justify-content:center}
#item{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
#target{height:28px;min-width:72px;padding:2px 12px;border-radius:12px;background:#fff;border:2px solid #f0d4a7;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#704b30}
#picture{width:220px;height:180px;overflow:visible}
.part{cursor:pointer;stroke:#fff8eb;stroke-width:3;stroke-linejoin:round;fill:#f3c96f;transition:fill .2s,transform .16s;transform-box:fill-box;transform-origin:center}
.part[data-shaded="true"]{fill:#ec805c}
.part:active{transform:scale(.94)}
#bar .part{stroke:#fff8eb;stroke-width:4}
#feedback{height:25px;text-align:center;font-size:14px;font-weight:750;color:#ad6546}
#controls{height:56px;display:flex;justify-content:center;align-items:center}
button{height:52px;min-width:150px;border:0;border-radius:17px;background:#e97851;color:white;font:800 17px system-ui,sans-serif;box-shadow:0 4px 0 #c65f3f;cursor:pointer;transition:transform .15s,background .2s}
button:active{transform:scale(.95)}
button:disabled{opacity:.65}
#doneScreen{flex:1;display:none;align-items:center;justify-content:center;text-align:center}
#doneScreen span{padding:18px 24px;border-radius:20px;background:#ffe2b8;color:#704b30;font-size:22px;font-weight:850;animation:bob .7s ease-in-out infinite alternate}
#app.celebrate #item{animation:pop .55s ease}
#app.celebrate #feedback{animation:bob .55s ease-in-out}
@keyframes pop{50%{transform:scale(1.06)}}
@keyframes bob{to{transform:translateY(-3px)}}
</style>
<main id="app">
  <header id="title"></header>
  <div id="prompt"></div>
  <section id="item">
    <div id="target" data-target></div>
    <svg id="picture" viewBox="0 0 240 200" role="img" aria-label=""></svg>
  </section>
  <div id="feedback" aria-live="polite"></div>
  <div id="controls"><button id="check" data-action="check" type="button"></button></div>
  <div id="doneScreen"><span id="doneText"></span></div>
</main>
<script>

(()=>{
  const p=Studio.params,items=p.items;
  const app=document.getElementById('app'), title=document.getElementById('title'),
    prompt=document.getElementById('prompt'), itemBox=document.getElementById('item'),
    target=document.querySelector('[data-target]'), svg=document.getElementById('picture'),
    feedback=document.getElementById('feedback'), check=document.getElementById('check'),
    doneScreen=document.getElementById('doneScreen'),doneText=document.getElementById('doneText');
  title.textContent=Studio.t('title');
  prompt.textContent=Studio.t('instr');
  check.textContent=Studio.t('check');
  let index=0,parts=[],locked=false,finished=false;
  const ns='http://www.w3.org/2000/svg';
  function draw(){
    const it=items[index];
    itemBox.dataset.item=it.id;
    target.textContent=it.n+'/'+it.d;
    svg.replaceChildren();
    svg.setAttribute('viewBox',p.picture==='bar'?'0 0 240 120':'0 0 240 200');
    svg.id=p.picture==='bar'?'bar':'picture';
    parts=[];
    for(let i=0;i<it.d;i++){
      const shape=document.createElementNS(ns,p.picture==='bar'?'rect':'path');
      shape.classList.add('part');
      shape.dataset.part=String(i);
      shape.dataset.shaded='false';
      if(p.picture==='bar'){
        shape.setAttribute('x',String(i*240/it.d));
        shape.setAttribute('y','18');
        shape.setAttribute('width',String(240/it.d));
        shape.setAttribute('height','84');
      }else{
        const a=-Math.PI/2+i*2*Math.PI/it.d,b=-Math.PI/2+(i+1)*2*Math.PI/it.d;
        const x1=120+94*Math.cos(a),y1=100+94*Math.sin(a);
        const x2=120+94*Math.cos(b),y2=100+94*Math.sin(b);
        shape.setAttribute('d','M120 100 L'+x1+' '+y1+' A94 94 0 0 1 '+x2+' '+y2+' Z');
      }
      shape.addEventListener('click',()=>{
        if(locked||finished)return;
        shape.dataset.shaded=shape.dataset.shaded==='true'?'false':'true';
        Studio.event('part_tap',{part:i});
      });
      svg.appendChild(shape);parts.push(shape);
    }
    feedback.textContent=Studio.t('hint');
  }
  check.addEventListener('click',()=>{
    if(locked||finished)return;
    locked=true;check.disabled=true;
    const n=parts.reduce((sum,part)=>sum+(part.dataset.shaded==='true'?1:0),0);
    Studio.event('check',{item:index});
    Studio.answer({n:n,d:items[index].d});
  });
  Studio.onVerdict(({correct})=>{
    if(finished)return;
    locked=false;check.disabled=false;
    feedback.textContent=Studio.t(correct?'right':'wrong');
    if(!correct)return;
    app.classList.add('celebrate');
    parts.forEach(part=>part.style.pointerEvents='none');
    const advance=()=>{
      app.classList.remove('celebrate');
      if(index+1<items.length){index++;draw();}
      else{
        finished=true;itemBox.style.display='none';prompt.style.display='none';
        feedback.style.display='none';check.parentElement.style.display='none';
        doneText.textContent=Studio.t('done');doneScreen.style.display='flex';Studio.done();
      }
    };
    feedback.addEventListener('animationend',advance,{once:true});
  });
  draw();
  Studio.ready();
})();

</script>
