<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;font-family:system-ui,sans-serif;background:#fff7e9;color:#483829}
  .card{width:360px;height:320px;padding:16px 18px;background:radial-gradient(circle at 90% 0%,#ffe1b8,transparent 45%),#fff7e9}
  h1{margin:0;font-size:19px;line-height:24px;font-weight:800}
  .instruction{margin:3px 0 0;font-size:13px;line-height:18px;color:#765c47}
  .targetRow{display:flex;align-items:center;justify-content:center;gap:10px;height:55px}
  .target{min-width:64px;padding:5px 15px;border-radius:18px;background:#ffcf83;color:#563718;text-align:center;font-size:26px;font-weight:800}
  .lineBox{height:90px}
  svg{display:block;width:324px;height:90px;overflow:visible}
  .rail{stroke:#b58b69;stroke-width:5;stroke-linecap:round}
  .tick{stroke:#725a48;stroke-width:2.5;stroke-linecap:round}
  .label{fill:#66503e;font-size:12px;font-weight:700;text-anchor:middle}
  .marker{transition:transform .25s cubic-bezier(.2,1.4,.4,1);filter:drop-shadow(0 3px 2px #77503744)}
  .marker.hop{animation:hop .45s ease}
  @keyframes hop{50%{translate:0 -13px}}
  .feedback{height:22px;text-align:center;font-size:14px;font-weight:700;color:#9b6043}
  .feedback.good{color:#347867}
  .controls{display:flex;gap:9px}
  button{border:0;border-radius:18px;height:57px;min-width:70px;padding:0 10px;font:800 15px system-ui,sans-serif;cursor:pointer;transition:transform .13s,background .2s;touch-action:manipulation}
  button:active{transform:scale(.92)}
  button:disabled{opacity:.48;cursor:default}
  .move{flex:1;background:#f5dfc1;color:#573d2b}
  .check{flex:1.2;background:#328576;color:white;box-shadow:0 4px 0 #21675b}
  .finished{display:none;align-items:center;justify-content:center;height:246px;text-align:center;font-size:24px;font-weight:800;color:#328576}
  .card.complete .activity{display:none}
  .card.complete .finished{display:flex}
</style>
<div class="card" id="card">
  <h1 id="title"></h1>
  <div class="activity" id="activity">
    <p class="instruction" id="instr"></p>
    <div class="targetRow" id="item"><span class="target" data-target></span></div>
    <div class="lineBox">
      <svg viewBox="0 0 324 90" aria-hidden="true">
        <line class="rail" x1="15" y1="40" x2="309" y2="40"></line>
        <g id="ticks"></g>
        <g class="marker" id="marker" data-marker data-value="">
          <circle cy="16" r="12" fill="#e68159"></circle>
          <path d="M-6 25 L0 37 L6 25Z" fill="#e68159"></path>
          <circle cy="13" r="3" fill="#fff4df"></circle>
        </g>
      </svg>
    </div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div class="controls">
      <button class="move" data-action="left" id="left"></button>
      <button class="move" data-action="right" id="rightBtn"></button>
      <button class="check" data-action="check" id="check"></button>
    </div>
  </div>
  <div class="finished" id="done"></div>
</div>
<script>

(()=>{
  const p=Studio.params, $=s=>document.querySelector(s);
  const round=n=>Math.round(n*1e6)/1e6;
  const count=Math.round((p.max-p.min)/p.step);
  const value=k=>round(p.min+k*p.step);
  const number=v=>String(round(v));
  const decimals=String(p.step).split(".")[1]?.length||0;
  function format(v){
    if(p.format==="fraction"){
      for(let d=1;d<=1000;d++){
        const n=Math.round(v*d);
        if(Math.abs(n/d-v)<1e-6){
          const gcd=(a,b)=>b?gcd(b,a%b):a;
          const g=gcd(Math.abs(n),d);
          return (n/g)+"/"+(d/g);
        }
      }
    }
    return p.format==="integer"?String(Math.round(v)):round(v).toFixed(Math.min(6,decimals));
  }
  const x=k=>15+294*k/count;
  const svgNS="http://www.w3.org/2000/svg", ticks=$("#ticks");
  for(let k=0;k<=count;k++){
    const g=document.createElementNS(svgNS,"g");
    g.setAttribute("data-tick",number(value(k)));
    g.setAttribute("transform",`translate(${x(k)} 0)`);
    const line=document.createElementNS(svgNS,"line");
    line.setAttribute("class","tick");
    line.setAttribute("x1","0");line.setAttribute("x2","0");
    line.setAttribute("y1","31");line.setAttribute("y2",k%p.labelEvery===0?"49":"46");
    g.append(line);
    if(k%p.labelEvery===0){
      const text=document.createElementNS(svgNS,"text");
      text.setAttribute("class","label");text.setAttribute("y","69");
      text.textContent=format(value(k));g.append(text);
    }
    ticks.append(g);
  }
  $("#title").textContent=Studio.t("title");
  $("#instr").textContent=Studio.t("instr");
  $("#left").textContent=Studio.t("left");
  $("#rightBtn").textContent=Studio.t("right_btn");
  $("#check").textContent=Studio.t("check");
  $("#done").textContent=Studio.t("done");
  let itemIndex=0, k=Math.max(0,Math.min(count,Math.round((p.start-p.min)/p.step))), busy=false;
  const marker=$("#marker"), feedback=$("#feedback");
  function draw(){
    marker.setAttribute("transform",`translate(${x(k)} 0)`);
    marker.setAttribute("data-value",number(value(k)));
    $("#left").disabled=busy||k===0;
    $("#rightBtn").disabled=busy||k===count;
    $("#check").disabled=busy;
  }
  function showItem(){
    $("#item").setAttribute("data-item",p.items[itemIndex].id);
    $("[data-target]").textContent=format(p.items[itemIndex].target);
    k=Math.max(0,Math.min(count,Math.round((p.start-p.min)/p.step)));
    feedback.textContent="";feedback.classList.remove("good");
    draw();
  }
  for(const [dir,delta] of [["left",-1],["right",1]]){
    $(`[data-action="${dir}"]`).addEventListener("click",()=>{
      if(busy)return;
      k=Math.max(0,Math.min(count,k+delta));
      feedback.textContent="";
      draw();
      Studio.event("move",{direction:dir,value:number(value(k))});
    });
  }
  $("[data-action=check]").addEventListener("click",()=>{
    if(busy)return;
    busy=true;draw();
    Studio.answer({value:value(k)});
  });
  Studio.onVerdict(({correct})=>{
    feedback.textContent=Studio.t(correct?"right":"wrong");
    feedback.classList.toggle("good",correct);
    if(correct){
      marker.classList.remove("hop");
      void marker.getBoundingClientRect();
      marker.classList.add("hop");
      setTimeout(()=>{
        marker.classList.remove("hop");
        if(++itemIndex<p.items.length){busy=false;showItem();}
        else{$("#card").classList.add("complete");Studio.done();}
      },550);
    }else{busy=false;draw();}
  });
  showItem();
  Studio.ready();
})();

</script>
