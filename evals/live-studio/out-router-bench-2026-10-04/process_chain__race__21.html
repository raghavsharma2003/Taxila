<style>
  *{box-sizing:border-box}
  body{margin:0}
  #activity{position:relative;width:360px;height:320px;overflow:hidden;background:#fff8ed;color:#543d52;font-family:system-ui,sans-serif;text-align:center}
  h1{position:absolute;top:7px;left:12px;width:336px;margin:0;font-size:20px;line-height:28px;font-weight:800}
  #scene{position:absolute;top:35px;left:12px;width:336px;height:132px}
  .stage circle{fill:#ffe5b7;stroke:#e6ac70;stroke-width:2;transition:fill .25s,stroke .25s,filter .25s}
  .stage.active circle{fill:#fff1a5;stroke:#ed9868;stroke-width:3;filter:drop-shadow(0 0 7px #ffbd66)}
  .stage text{fill:#543d52;font-size:11px;font-weight:750;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
  .arrow{fill:none;stroke:#bc8692;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  #traveller{fill:#ef7781;stroke:white;stroke-width:2.5;filter:drop-shadow(0 2px 3px #b87d7d)}
  button{border:0;border-radius:18px;background:#ed7980;color:#fff;font:750 15px system-ui,sans-serif;min-height:52px;cursor:pointer;transition:transform .16s,background .16s}
  button:active{transform:scale(.93)}
  button:disabled{opacity:.55;cursor:default}
  #next{position:absolute;top:170px;left:125px;width:110px;background:#a46788}
  #question{position:absolute;top:225px;left:12px;width:336px;height:25px;font-size:15px;line-height:25px;font-weight:750}
  #choices{position:absolute;top:255px;left:12px;width:336px;height:52px;display:flex;gap:8px}
  #choices button{flex:1;min-width:0;padding:4px}
</style>
<div id="activity">
  <h1 id="title"></h1>
  <svg id="scene" viewBox="0 0 336 145" aria-hidden="true">
    <defs><marker id="tip" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#bc8692"/></marker></defs>
    <g id="arrows"></g><g id="stages"></g>
    <circle id="traveller" data-token r="8"/>
  </svg>
  <button id="next" data-action="next"></button>
  <div id="question" aria-live="polite"></div>
  <div id="choices"></div>
</div>
<script>

(()=>{
  const p=Studio.params,keys=p.stages,root=document.getElementById('activity');
  const ns='http://www.w3.org/2000/svg',arrows=document.getElementById('arrows'),stages=document.getElementById('stages'),token=document.getElementById('traveller');
  const make=(tag,attrs,parent)=>{const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e};
  const n=keys.length;
  const positions=keys.map((_,i)=>{
    if(p.cycle){const angle=-Math.PI/2+i*2*Math.PI/n;return{x:168+112*Math.cos(angle),y:72+48*Math.sin(angle)}}
    return{x:n===1?168:30+i*276/(n-1),y:72};
  });
  const paths=[];
  for(let i=0;i<(p.cycle?n:n-1);i++){
    const a=positions[i],b=positions[(i+1)%n],dx=b.x-a.x,dy=b.y-a.y,length=Math.hypot(dx,dy)||1,ux=dx/length,uy=dy/length;
    const start={x:a.x+ux*29,y:a.y+uy*29},end={x:b.x-ux*32,y:b.y-uy*32};
    paths.push({start,end});
    make('path',{d:`M${start.x} ${start.y} L${end.x} ${end.y}`,class:'arrow','marker-end':'url(#tip)','data-arrow':keys[i]+'>'+keys[(i+1)%n]},arrows);
  }
  const nodes=keys.map((key,i)=>{
    const pos=positions[i],g=make('g',{class:'stage','data-stage':key},stages);
    make('circle',{cx:pos.x,cy:pos.y,r:26},g);
    make('text',{x:pos.x,y:pos.y,'data-label':key},g).textContent=Studio.t(key);
    return g;
  });
  let index=0,moving=false,finished=false;
  function activate(){root.setAttribute('data-active',keys[index]);nodes.forEach((g,i)=>g.classList.toggle('active',i===index))}
  function place(x,y){token.setAttribute('cx',x);token.setAttribute('cy',y)}
  activate();place(positions[0].x,positions[0].y);
  document.getElementById('title').textContent=Studio.t('title');
  const question=document.getElementById('question');question.textContent=Studio.t('ask');
  const next=document.getElementById('next');next.textContent=Studio.t('next');
  next.addEventListener('click',()=>{
    if(moving||finished||(!p.cycle&&index>=n-1))return;
    const from=index,to=(index+1)%n,path=paths[from];moving=true;next.disabled=true;
    const origin=positions[from],destination=positions[to],start=performance.now(),duration=650;
    function frame(now){
      const t=Math.min(1,(now-start)/duration);
      let x,y;
      if(t<.16){const q=t/.16;x=origin.x+(path.start.x-origin.x)*q;y=origin.y+(path.start.y-origin.y)*q}
      else if(t<.84){const q=(t-.16)/.68;x=path.start.x+(path.end.x-path.start.x)*q;y=path.start.y+(path.end.y-path.start.y)*q}
      else{const q=(t-.84)/.16;x=path.end.x+(destination.x-path.end.x)*q;y=path.end.y+(destination.y-path.end.y)*q}
      place(x,y);
      if(t<1)requestAnimationFrame(frame);
      else{index=to;activate();moving=false;next.disabled=!p.cycle&&index===n-1;Studio.event('next',{stage:keys[index]})}
    }
    requestAnimationFrame(frame);
  });
  const choices=document.getElementById('choices');
  p.options.forEach(key=>{
    const b=document.createElement('button');b.setAttribute('data-option',key);b.textContent=Studio.t(key);
    b.addEventListener('click',()=>{if(!finished)Studio.answer(key)});
    choices.appendChild(b);
  });
  Studio.onVerdict(({correct})=>{
    question.textContent=Studio.t(correct?'right':'wrong');
    if(correct&&!finished){finished=true;next.disabled=true;question.textContent=Studio.t('done');Studio.done()}
  });
  Studio.ready();
})();

</script>
