<style>
*{box-sizing:border-box}
body{margin:0;width:360px;height:320px;overflow:hidden;font-family:Arial,sans-serif;background:#fff8e9;color:#57412e}
#scene{position:relative;width:360px;height:320px;overflow:hidden;background:linear-gradient(180deg,#fff9ee 0%,#fff1d8 100%)}
#sun{position:absolute;right:-18px;top:-23px;width:86px;height:86px;border-radius:50%;background:#ffd86e;opacity:.48;pointer-events:none}
#ground{position:absolute;left:-25px;bottom:-38px;width:410px;height:92px;border-radius:50% 50% 0 0;background:#dcecb8;pointer-events:none}
#title{position:absolute;left:18px;top:11px;font-size:19px;font-weight:800;color:#765039}
#question{position:absolute;left:18px;top:38px;right:16px;min-height:26px;font-size:15px;font-weight:700;color:#594535}
#message{position:absolute;left:14px;right:14px;bottom:5px;height:22px;text-align:center;font-size:14px;font-weight:800;color:#5e914e;opacity:0;transform:translateY(5px);transition:opacity .22s,transform .22s}
#message.show{opacity:1;transform:translateY(0)}
svg{position:absolute;left:0;top:66px;width:360px;height:235px;overflow:visible}
.leader{fill:none;stroke:#a77c5a;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.label{font-size:13px;font-weight:800;fill:#72533d;paint-order:stroke;stroke:#fff8e9;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.part{cursor:pointer;outline:none;transform-box:fill-box;transform-origin:center;transition:transform .16s ease,filter .22s ease}
.part:active{transform:scale(.93)}
.part.pulse{animation:tap .36s ease-out}
.part.correct{filter:drop-shadow(0 0 5px #ffd553) drop-shadow(0 0 11px #ffd553)}
.part.correct .shape{animation:glow 1s ease-in-out infinite}
.hit{fill:#ffffff;opacity:.002}
.vein{fill:none;stroke:#47934e;stroke-width:2;stroke-linecap:round;pointer-events:none}
.rootline{fill:none;stroke:#9b6845;stroke-width:7;stroke-linecap:round;pointer-events:none}
@keyframes tap{0%{transform:scale(1)}45%{transform:scale(.91)}100%{transform:scale(1)}}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.2)}}
</style>

<script>

(function(){
  var p=Studio.params;
  var parts=p.parts;
  var targets=document.querySelectorAll('.part');
  var labels=document.querySelectorAll('[data-label]');
  var title=document.getElementById('title');
  var ask=document.querySelector('[data-ask]');
  var message=document.getElementById('message');
  var pending='';
  var locked=false;
  var finished=false;
  var hide=0;

  title.textContent=Studio.t('title');
  ask.textContent=Studio.t('ask')+' '+Studio.t(p.ask);
  ask.setAttribute('data-ask',p.ask);

  for(var i=0;i<targets.length;i++){
    var key=parts[i];
    targets[i].setAttribute('data-part',key);
    labels[i].setAttribute('data-label',key);
    labels[i].textContent=Studio.t(key);
  }

  function show(key){
    clearTimeout(hide);
    message.textContent=Studio.t(key);
    message.classList.add('show');
  }

  function choose(target){
    if(locked||finished)return;
    locked=true;
    pending=target.getAttribute('data-part');
    target.classList.remove('pulse');
    void target.getBoundingClientRect();
    target.classList.add('pulse');
    Studio.event('tap',{part:pending});
    Studio.answer(pending);
  }

  for(var j=0;j<targets.length;j++){
    (function(target){
      target.addEventListener('click',function(){choose(target);});
      target.addEventListener('keydown',function(e){
        if(e.key==='Enter'||e.key===' '){
          e.preventDefault();
          choose(target);
        }
      });
    })(targets[j]);
  }

  Studio.onVerdict(function(result){
    if(!pending||finished)return;
    var target=document.querySelector('[data-part="'+pending+'"]');
    if(result.correct){
      finished=true;
      if(target)target.classList.add('correct');
      show('right');
      Studio.event('verdict',{correct:1});
      Studio.done();
    }else{
      if(target)target.classList.remove('pulse');
      show('wrong');
      Studio.event('verdict',{correct:0});
      pending='';
      hide=setTimeout(function(){
        message.classList.remove('show');
        locked=false;
      },850);
    }
  });

  Studio.ready();
})();

</script>
