<style>
*{box-sizing:border-box}
body{margin:0;width:360px;height:320px;overflow:hidden;background:#fff8ea;font-family:Arial,sans-serif}
#card{position:relative;width:360px;height:320px;overflow:hidden;background:linear-gradient(180deg,#fffaf0 0%,#fff1d2 100%);color:#513a2e}
#card:before{content:"";position:absolute;width:185px;height:185px;left:-76px;top:104px;border-radius:50%;background:#ffe49b;opacity:.42}
#card:after{content:"";position:absolute;width:150px;height:150px;right:-65px;bottom:-48px;border-radius:50%;background:#cce9bd;opacity:.65}
#top{position:absolute;z-index:3;left:14px;right:14px;top:9px;height:48px;display:flex;align-items:center;gap:10px}
#sun{width:42px;height:42px;flex:none;border-radius:50%;background:#ffd762;box-shadow:0 0 0 5px #fff0b9;position:relative}
#sun:after{content:"";position:absolute;inset:10px;border-radius:50%;background:#ffb856}
#heading{min-width:0}
#title{font-size:13px;font-weight:800;line-height:16px;letter-spacing:.25px;color:#94643c}
#ask{font-size:18px;font-weight:800;line-height:22px;color:#4a372c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scene{position:absolute;z-index:1;left:0;top:57px;width:360px;height:226px;overflow:visible}
#ground{fill:#d9b57c;opacity:.42}
.leader{fill:none;stroke:#9c795f;stroke-width:2;stroke-linecap:round}
.label{font-size:13px;font-weight:800;fill:#674938;stroke:#fff9ea;stroke-width:4px;paint-order:stroke;stroke-linejoin:round}
.piece{cursor:pointer;outline:none;transform-box:fill-box;transform-origin:center;transition:transform .16s ease,filter .2s ease}
.piece:hover,.piece:focus{filter:brightness(1.06) drop-shadow(0 2px 2px rgba(80,52,31,.2))}
.piece.pressed{transform:scale(.94)}
.piece.correct{animation:glow .75s ease-in-out infinite alternate}
.piece.wiggle{animation:wiggle .4s ease}
@keyframes glow{from{filter:drop-shadow(0 0 4px #ffcf48)}to{filter:drop-shadow(0 0 13px #ffc33d) brightness(1.13)}}
@keyframes wiggle{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#feedback{position:absolute;z-index:4;left:15px;right:15px;bottom:9px;height:30px;display:flex;align-items:center;justify-content:center;border:2px solid #efd8b2;border-radius:16px;background:#fffdf6;color:#80614b;font-size:14px;font-weight:800;opacity:0;transform:translateY(6px);transition:opacity .2s ease,transform .2s ease}
#feedback.show{opacity:1;transform:translateY(0)}
#feedback.good{background:#edf8e1;border-color:#b6dca3;color:#4d803c}
#feedback.no{background:#fff0e7;border-color:#edc4ac;color:#a15f40}
</style>
<div id="card">
  <div id="top">
    <div id="sun"></div>
    <div id="heading">
      <div id="title"></div>
      <div id="ask" data-ask></div>
    </div>
  </div>
  <svg id="scene" viewBox="0 0 360 226">
    <ellipse id="ground" cx="181" cy="217" rx="111" ry="7"></ellipse>

    <line class="leader" x1="109" y1="43" x2="120" y2="48"></line>
    <text class="label" id="l0" x="42" y="42"></text>

    <line class="leader" x1="228" y1="75" x2="212" y2="76"></line>
    <text class="label" id="l1" x="234" y="78"></text>

    <line class="leader" x1="130" y1="139" x2="155" y2="139"></line>
    <text class="label" id="l2" x="82" y="143"></text>

    <line class="leader" x1="255" y1="145" x2="237" y2="148"></line>
    <text class="label" id="l3" x="260" y="148"></text>

    <line class="leader" x1="121" y1="199" x2="135" y2="194"></line>
    <text class="label" id="l4" x="78" y="204"></text>

    <ellipse id="p0" class="piece" cx="150" cy="52" rx="38" ry="28" fill="#f58c9c" transform="rotate(-25 150 52)"></ellipse>
    <circle id="p1" class="piece" cx="181" cy="76" r="29" fill="#ffca4c"></circle>
    <path id="p2" class="piece" d="M155 99 L207 99 L207 178 Q181 187 155 178 Z" fill="#70b96b"></path>
    <path id="p3" class="piece" d="M200 128 C248 106 278 124 273 156 C269 188 229 182 199 155 Z" fill="#82c970"></path>
    <path id="p4" class="piece" d="M157 169 C151 184 143 197 128 211 L103 218 L132 222 C151 216 164 205 173 191 C181 207 195 217 219 222 L246 216 L218 210 C202 201 197 188 196 171 C185 181 169 181 157 169 Z" fill="#c98f59"></path>
  </svg>
  <div id="feedback"></div>
</div>
<script>

(function(){
  var params=Studio.params;
  var parts=params.parts||[];
  var pieces=[document.getElementById('p0'),document.getElementById('p1'),document.getElementById('p2'),document.getElementById('p3'),document.getElementById('p4')];
  var labels=[document.getElementById('l0'),document.getElementById('l1'),document.getElementById('l2'),document.getElementById('l3'),document.getElementById('l4')];
  var feedback=document.getElementById('feedback');
  var chosen=null,locked=false,finished=false;

  document.getElementById('title').textContent=Studio.t('title');
  document.getElementById('ask').textContent=Studio.t('ask');

  function say(key,kind){
    feedback.textContent=Studio.t(key);
    feedback.className='show '+kind;
  }

  parts.forEach(function(key,i){
    var piece=pieces[i],label=labels[i];
    if(!piece||!label)return;
    piece.setAttribute('data-part',key);
    piece.setAttribute('tabindex','0');
    label.setAttribute('data-label',key);
    label.textContent=Studio.t(key);

    function choose(){
      if(locked||finished)return;
      pieces.forEach(function(item){item.classList.remove('pressed');});
      chosen=piece;
      chosen.classList.add('pressed');
      Studio.event('tap',{part:i});
      Studio.answer(key);
    }

    piece.addEventListener('click',choose);
    piece.addEventListener('keydown',function(event){
      if(event.key==='Enter'||event.key===' '){
        event.preventDefault();
        choose();
      }
    });
  });

  Studio.onVerdict(function(result){
    if(!chosen||finished)return;
    if(result.correct){
      locked=true;
      chosen.classList.remove('pressed');
      chosen.classList.add('correct');
      say('right','good');
      Studio.event('verdict',{correct:1});
      setTimeout(function(){
        if(finished)return;
        finished=true;
        say('done','good');
        Studio.done();
      },650);
    }else{
      chosen.classList.remove('pressed');
      chosen.classList.remove('wiggle');
      void chosen.getBoundingClientRect();
      chosen.classList.add('wiggle');
      say('wrong','no');
      Studio.event('verdict',{correct:0});
      setTimeout(function(){
        if(chosen)chosen.classList.remove('wiggle');
      },430);
    }
  });

  Studio.ready();
}());

</script>
