<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;font-family:system-ui,sans-serif;background:#fff8ec;color:#49392f}
  #card{width:360px;height:320px;overflow:hidden;padding:10px 16px;background:radial-gradient(circle at 90% 8%,#ffe8bc,transparent 42%),#fff8ec}
  #title{height:26px;font-size:20px;font-weight:800;line-height:26px}
  #scene{position:relative;height:68px;border-radius:19px;background:#e7f3e6;overflow:hidden}
  #scene svg{position:absolute;inset:0;width:100%;height:100%}
  #track{position:absolute;left:56px;top:25px;width:226px;height:21px;border-radius:20px;background:#c9dfca;box-shadow:inset 0 2px 4px #91b39466}
  [data-visual]{height:21px;width:0;border-radius:20px;background:linear-gradient(90deg,#ef9b61,#f7c271);box-shadow:0 2px 5px #ad694055;transition:width .38s cubic-bezier(.2,.8,.2,1)}
  #readouts{height:39px;display:flex;align-items:center;justify-content:space-around}
  .readout{display:flex;align-items:baseline;gap:6px;font-size:15px;font-weight:650}
  .number{font-size:23px;font-weight:850;color:#a95437;min-width:24px}
  #controls{height:55px;display:flex;gap:12px}
  button{font:inherit;cursor:pointer;touch-action:manipulation;transition:transform .16s,background .2s,box-shadow .2s}
  button:active{transform:scale(.93)}
  #controls button{height:52px;flex:1;border:0;border-radius:17px;background:#f6d8bb;color:#653c29;font-weight:800;box-shadow:0 3px 0 #d9ae8c}
  #controls button:disabled{opacity:.48;cursor:default}
  #question{height:27px;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:750;font-size:15px}
  #askX{color:#a95437;font-size:19px}
  #options{height:54px;display:flex;gap:10px}
  #options button{height:52px;flex:1;border:2px solid #e8c5a7;border-radius:16px;background:#fff;color:#70452e;font-size:21px;font-weight:800}
  #options button.chosen{background:#ffe4cb;transform:scale(.96)}
  #feedback{height:18px;line-height:18px;text-align:center;font-size:15px;font-weight:800;color:#a95437}
  #feedback.good{color:#39856c}
</style>
<div id="card">
  <div id="title"></div>
  <div id="scene">
    <svg viewBox="0 0 328 68" aria-hidden="true">
      <circle cx="300" cy="16" r="13" fill="#ffdb91"/>
      <path d="M0 59 Q70 42 138 59 T328 56 V68 H0Z" fill="#cce7cf"/>
      <path d="M21 48V24m-8 11 8-11 8 11M308 50V34m-8 8 8-8 8 8" fill="none" stroke="#88b895" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div id="track"><div data-visual data-dim="w"></div></div>
  </div>
  <div id="readouts">
    <div class="readout"><span id="xname"></span><span class="number" data-x></span></div>
    <div class="readout"><span id="yname"></span><span class="number" data-output data-value></span></div>
  </div>
  <div id="controls"><button type="button" data-action="dec"></button><button type="button" data-action="inc"></button></div>
  <div id="question"><span id="ask"></span><span id="askX"></span></div>
  <div id="options"><button type="button" data-option></button><button type="button" data-option></button><button type="button" data-option></button></div>
  <div id="feedback" aria-live="polite"></div>
</div>
<script>

(()=>{
  const p=Studio.params, $=s=>document.querySelector(s);
  for(const key of ['title','xname','yname','ask']) $('#'+key).textContent=Studio.t(key);
  $('[data-action="dec"]').textContent=Studio.t('less');
  $('[data-action="inc"]').textContent=Studio.t('more');
  $('#askX').textContent=p.ask.x;
  const format=n=>Number(n.toPrecision(12)).toString();
  let x=p.x.start, finished=false;
  function render(){
    const y=p.law.k*x+p.law.b;
    $('[data-x]').dataset.x=format(x);
    $('[data-x]').textContent=format(x);
    $('[data-output]').dataset.value=format(y);
    $('[data-output]').textContent=format(y);
    $('[data-visual]').style.width=format(y*p.y.unitsPer)+'px';
    $('[data-action="dec"]').disabled=x-p.x.step<p.x.min;
    $('[data-action="inc"]').disabled=x+p.x.step>p.x.max;
  }
  document.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>{
    const next=x+(button.dataset.action==='inc'?p.x.step:-p.x.step);
    if(next<p.x.min||next>p.x.max)return;
    x=Number(next.toPrecision(12));
    render();
    Studio.event('change',{x:format(x)});
  }));
  document.querySelectorAll('[data-option]').forEach((button,i)=>{
    const value=p.ask.options[i];
    button.dataset.option=format(value);
    button.textContent=format(value);
    button.addEventListener('click',()=>{
      if(finished)return;
      document.querySelectorAll('[data-option]').forEach(b=>b.classList.remove('chosen'));
      button.classList.add('chosen');
      Studio.answer({value});
    });
  });
  Studio.onVerdict(({correct})=>{
    $('#feedback').textContent=Studio.t(correct?'right':'wrong');
    $('#feedback').classList.toggle('good',correct);
    if(correct&&!finished){finished=true;Studio.done();}
  });
  render();
  Studio.ready();
})();

</script>
