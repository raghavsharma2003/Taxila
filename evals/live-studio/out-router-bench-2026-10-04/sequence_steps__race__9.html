<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;font-family:system-ui,sans-serif;background:#fff7e9;color:#503a36}
  #activity{width:360px;height:320px;padding:15px 16px;display:flex;flex-direction:column;gap:9px;background:radial-gradient(circle at 95% 0%,#ffe2ad 0,transparent 42%),#fff7e9}
  h1{font-size:19px;line-height:1.2;margin:0;font-weight:800}
  #instr{font-size:13px;line-height:1.3;margin:0;color:#795d53}
  #cards,#track{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  #cards{height:82px;align-items:stretch}
  .card{width:100%;min-height:70px;border:2px solid #df967a;border-radius:16px;background:#fff;box-shadow:0 5px 0 #edc7aa;color:#503a36;font:700 15px/1.15 system-ui,sans-serif;padding:7px;overflow-wrap:anywhere;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s}
  .card:not(:disabled):active{transform:scale(.94);box-shadow:0 2px 0 #edc7aa}
  .card:disabled{cursor:default}
  .card.shake{animation:shake .36s ease}
  @keyframes shake{25%,75%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
  #track{flex:1;min-height:91px}
  .slot{min-width:0;border:2px dashed #d9ae92;border-radius:18px;background:#fffaf2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:5px}
  .slot .number{font-size:15px;font-weight:800;color:#9c6756}
  .slot .card{min-height:52px;border-color:#89aa83;background:#edf6e9;box-shadow:none;animation:arrive .35s ease both}
  @keyframes arrive{from{transform:translateY(-14px) scale(.9);opacity:.4}to{transform:translateY(0) scale(1);opacity:1}}
  #feedback{height:24px;margin:0;text-align:center;font-size:15px;font-weight:750;color:#647f61}
  #feedback.wrong{color:#ad6559}
</style>
<div id="activity">
  <h1 id="title"></h1>
  <p id="instr"></p>
  <div id="cards"></div>
  <div id="track"></div>
  <p id="feedback" aria-live="polite"></p>
</div>
<script>

(() => {
  const shown = Studio.params.shown;
  const cards = document.getElementById('cards');
  const track = document.getElementById('track');
  const feedback = document.getElementById('feedback');
  document.getElementById('title').textContent = Studio.t('title');
  document.getElementById('instr').textContent = Studio.t('instr');

  shown.forEach((key, index) => {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'card';
    card.dataset.step = key;
    card.textContent = Studio.t(key);
    card.addEventListener('click', () => choose(card));
    cards.append(card);

    const slot = document.createElement('div');
    slot.className = 'slot';
    const number = document.createElement('span');
    number.className = 'number';
    number.textContent = String(index + 1);
    slot.append(number);
    track.append(slot);
  });

  let placed = 0;
  let pending = null;
  function choose(card) {
    if (pending || card.hasAttribute('data-placed')) return;
    pending = card;
    card.classList.remove('shake');
    feedback.textContent = '';
    Studio.answer({key: card.dataset.step});
  }
  Studio.onVerdict(({correct}) => {
    if (!pending) return;
    const card = pending;
    pending = null;
    if (correct) {
      placed++;
      card.dataset.placed = String(placed);
      card.disabled = true;
      track.children[placed - 1].append(card);
      feedback.classList.remove('wrong');
      feedback.textContent = Studio.t(placed === shown.length ? 'done' : 'right');
      if (placed === shown.length) Studio.done();
    } else {
      feedback.classList.add('wrong');
      feedback.textContent = Studio.t('wrong');
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
    }
  });
  Studio.ready();
})();

</script>
