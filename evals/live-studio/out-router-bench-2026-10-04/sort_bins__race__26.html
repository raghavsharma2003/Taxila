<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;font-family:system-ui,sans-serif;background:#fff7e9;color:#503b35}
  #game{width:360px;height:320px;padding:12px;overflow:hidden;background:radial-gradient(circle at 90% 5%,#ffe6bc 0,transparent 38%),#fff7e9}
  #title{height:27px;font-size:21px;font-weight:800;line-height:27px}
  #message{height:27px;font-size:13px;line-height:27px;color:#755e53}
  #cards{height:138px;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:8px;padding:4px 0}
  .card{width:104px;height:54px;border:2px solid #e4b98d;border-radius:16px;background:#fffdf8;color:#503b35;box-shadow:0 4px 0 #e9d3b8;font:700 16px system-ui,sans-serif;cursor:pointer;transition:transform .22s ease,box-shadow .22s ease,opacity .22s ease}
  .card:active,.bin:active{transform:scale(.96)}
  .card[data-selected="true"]{transform:translateY(-6px) scale(1.04);box-shadow:0 8px 18px #d6915070,0 0 0 3px #ffc575}
  .card.shake{animation:shake .38s ease}
  @keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
  #bins{display:flex;gap:10px;height:112px}
  .bin{flex:1;min-width:0;height:112px;padding:8px;border:2px solid #d6ad83;border-radius:20px;background:#f6dfc3;box-shadow:inset 0 -5px 0 #e9cba8;cursor:pointer;transition:transform .2s,background .2s}
  .bin:hover{background:#f2d3aa}
  .bin-name{display:block;font-size:15px;font-weight:800;text-align:center}
  .placed-list{display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:4px;margin-top:7px}
  [data-placed]{max-width:100%;padding:3px 8px;border-radius:10px;background:#fffdf8;border:1px solid #d6ad83;font-size:12px;font-weight:700;white-space:nowrap}
  .flying{position:fixed;z-index:5;pointer-events:none;transition:transform .34s ease,opacity .34s ease}
</style>
<div id="game">
  <div id="title"></div>
  <div id="message"></div>
  <div id="cards"></div>
  <div id="bins"></div>
</div>
<script>

(()=>{
  const p=Studio.params, cards=document.getElementById('cards'), bins=document.getElementById('bins'), message=document.getElementById('message');
  document.getElementById('title').textContent=Studio.t('title');
  message.textContent=Studio.t('instr');
  let selected=null, pending=null, busy=false, remaining=p.cards.length, finished=false;
  const binNodes=new Map();
  p.cards.forEach(key=>{
    const button=document.createElement('button');
    button.type='button';
    button.className='card';
    button.dataset.card=key;
    button.dataset.selected='false';
    button.textContent=Studio.t(key);
    button.addEventListener('click',()=>{
      if(busy||finished)return;
      if(selected)selected.dataset.selected='false';
      selected=selected===button?null:button;
      if(selected)selected.dataset.selected='true';
      Studio.event('card_tap',{card:key});
    });
    cards.appendChild(button);
  });
  p.bins.forEach(key=>{
    const bin=document.createElement('button');
    bin.type='button';
    bin.className='bin';
    bin.dataset.bin=key;
    const name=document.createElement('span');
    name.className='bin-name';
    name.textContent=Studio.t(key);
    const list=document.createElement('span');
    list.className='placed-list';
    bin.append(name,list);
    bin.addEventListener('click',()=>{
      if(!selected||busy||finished)return;
      pending={card:selected,bin,key:selected.dataset.card};
      busy=true;
      Studio.event('bin_tap',{bin:key});
      Studio.answer({card:pending.key,bin:key});
    });
    bins.appendChild(bin);
    binNodes.set(key,list);
  });
  Studio.onVerdict(({correct})=>{
    if(!pending)return;
    const {card,bin,key}=pending;
    pending=null;
    if(correct){
      message.textContent=Studio.t('right');
      const from=card.getBoundingClientRect(), to=bin.getBoundingClientRect();
      const ghost=card.cloneNode(true);
      ghost.removeAttribute('data-card');
      ghost.removeAttribute('data-selected');
      ghost.className='card flying';
      ghost.style.left=from.left+'px';
      ghost.style.top=from.top+'px';
      document.body.appendChild(ghost);
      card.style.visibility='hidden';
      requestAnimationFrame(()=>{ghost.style.transform=`translate(${to.left+to.width/2-from.left-from.width/2}px,${to.top+to.height/2-from.top-from.height/2}px) scale(.55)`;ghost.style.opacity='.4'});
      setTimeout(()=>{
        ghost.remove();
        card.remove();
        const placed=document.createElement('span');
        placed.dataset.placed=bin.dataset.bin;
        placed.textContent=Studio.t(key);
        binNodes.get(bin.dataset.bin).appendChild(placed);
        selected=null;
        busy=false;
        remaining--;
        if(remaining===0&&!finished){
          finished=true;
          message.textContent=Studio.t('done');
          Studio.done();
        }
      },360);
    }else{
      message.textContent=Studio.t('wrong');
      card.dataset.selected='false';
      card.classList.add('shake');
      selected=null;
      setTimeout(()=>{card.classList.remove('shake');busy=false},390);
    }
  });
  Studio.ready();
})();

</script>
