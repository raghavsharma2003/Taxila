<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;font-family:system-ui,sans-serif;color:#493628;background:#fff7e9}
  .card{width:100%;height:100%;padding:12px 16px;display:flex;flex-direction:column;align-items:center;gap:7px;background:radial-gradient(ellipse at 50% 15%,#fffdf5 0,#fff7e9 70%)}
  .title{margin:0;font-size:18px;line-height:24px;font-weight:800;color:#71452d;text-align:center}
  .instruction{margin:0;min-height:20px;font-size:13px;line-height:18px;text-align:center;color:#765943}
  .target{min-width:64px;min-height:34px;padding:4px 12px;border-radius:18px;background:#ffe4a8;color:#71452d;font-size:18px;font-weight:800;text-align:center;box-shadow:inset 0 -2px #f3cb7c}
  .whole{width:238px;height:184px;display:block;overflow:visible;touch-action:manipulation}
  .part{fill:#ffd57b;stroke:#fff8eb;stroke-width:3;stroke-linejoin:round;cursor:pointer;transform-box:fill-box;transform-origin:center;transition:fill .2s ease,transform .16s ease,filter .2s ease}
  .part:hover{filter:brightness(1.04)}
  .part:active{transform:scale(.95)}
  .part[data-shaded="true"]{fill:#ee8a53}
  .bar-part{stroke:#fff8eb;stroke-width:4;rx:9;cursor:pointer;transition:fill .2s ease,transform .16s ease}
  .bar-part:active{transform:scale(.96)}
  .controls{display:flex;justify-content:center;align-items:center;min-height:56px}
  button{min-width:112px;min-height:52px;padding:8px 20px;border:0;border-radius:18px;background:#5e9b76;color:#fff;font:700 16px system-ui,sans-serif;box-shadow:0 4px 0 #397553;cursor:pointer;transition:transform .15s ease,background .2s ease}
  button:active{transform:translateY(2px) scale(.97);box-shadow:0 2px 0 #397553}
  button:focus-visible{outline:3px solid #d78345;outline-offset:2px}
  .feedback{min-height:20px;font-size:14px;font-weight:700;color:#5c865f;text-align:center}
  .feedback.wrong{color:#b5674b}
  .celebrate{animation:pop .5s ease}
  @keyframes pop{50%{transform:scale(1.08) rotate(-2deg)}}
  .done-screen{margin:auto;text-align:center;font-size:22px;line-height:1.3;font-weight:800;color:#71452d;animation:pop .55s ease}
  [hidden]{display:none!important}
</style>
<main class="card" id="screen">
  <h1 class="title" id="title"></h1>
  <p class="instruction" id="instruction"></p>
  <div class="target" data-target aria-label="target"></div>
  <svg class="whole" id="whole" viewBox="0 0 240 200" role="group" aria-label=""></svg>
  <div class="controls"><button id="check" data-action="check" type="button"></button></div>
  <div class="feedback" id="feedback" aria-live="polite"></div>
  <div class="done-screen" id="done" hidden></div>
</main>
<script>

(function(){
  const items=Studio.params.items;
  const picture=Studio.params.picture;
  const screen=document.getElementById("screen");
  const title=document.getElementById("title");
  const instruction=document.getElementById("instruction");
  const target=document.querySelector("[data-target]");
  const whole=document.getElementById("whole");
  const check=document.getElementById("check");
  const feedback=document.getElementById("feedback");
  const done=document.getElementById("done");
  title.textContent=Studio.t("title");
  instruction.textContent=Studio.t("instr");
  check.textContent=Studio.t("check");
  let current=0;
  let parts=[];
  let busy=false;

  function draw(){
    const item=items[current];
    screen.dataset.item=item.id;
    target.textContent=item.n+"/"+item.d;
    feedback.textContent="";
    feedback.className="feedback";
    whole.replaceChildren();
    parts=[];
    for(let i=0;i<item.d;i++){
      let part;
      if(picture==="pizza"){
        const cx=120,cy=100,r=88;
        const a1=(i/item.d)*Math.PI*2-Math.PI/2;
        const a2=((i+1)/item.d)*Math.PI*2-Math.PI/2;
        const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
        const x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
        const large=(a2-a1)>Math.PI?1:0;
        part=document.createElementNS("http://www.w3.org/2000/svg","path");
        part.setAttribute("d","M "+cx+" "+cy+" L "+x1+" "+y1+" A "+r+" "+r+" 0 "+large+" 1 "+x2+" "+y2+" Z");
        part.setAttribute("class","part");
      }else{
        const width=216/item.d;
        part=document.createElementNS("http://www.w3.org/2000/svg","rect");
        part.setAttribute("x",12+i*width);
        part.setAttribute("y",68);
        part.setAttribute("width",width);
        part.setAttribute("height",64);
        part.setAttribute("class","bar-part");
        part.setAttribute("fill","#ffd57b");
      }
      part.dataset.part=String(i);
      part.dataset.shaded="false";
      part.setAttribute("role","button");
      part.setAttribute("tabindex","0");
      part.setAttribute("aria-label",Studio.t("hint"));
      const toggle=()=>{
        if(busy)return;
        const shaded=part.dataset.shaded!=="true";
        part.dataset.shaded=String(shaded);
        if(picture!=="pizza")part.setAttribute("fill",shaded?"#ee8a53":"#ffd57b");
        part.setAttribute("aria-pressed",String(shaded));
        Studio.event("part_tap",{index:i,shaded:shaded?"true":"false"});
      };
      part.addEventListener("click",toggle);
      part.addEventListener("keydown",e=>{
        if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle();}
      });
      whole.appendChild(part);
      parts.push(part);
    }
    check.disabled=false;
    busy=false;
  }
  function complete(){
    check.disabled=true;
    whole.classList.remove("celebrate");
    void whole.getBoundingClientRect();
    whole.classList.add("celebrate");
    feedback.textContent=Studio.t("right");
    feedback.className="feedback";
    setTimeout(()=>{
      current++;
      if(current<items.length)draw();
      else{
        screen.dataset.item="";
        target.hidden=true;
        whole.hidden=true;
        check.hidden=true;
        instruction.hidden=true;
        feedback.hidden=true;
        done.hidden=false;
        done.textContent=Studio.t("done");
        Studio.done();
      }
    },650);
  }
  check.addEventListener("click",()=>{
    if(busy)return;
    const n=parts.filter(p=>p.dataset.shaded==="true").length;
    busy=true;
    check.disabled=true;
    Studio.event("check",{n:n,d:items[current].d});
    Studio.answer({n:n,d:items[current].d});
  });
  Studio.onVerdict(({correct})=>{
    if(correct)complete();
    else{
      busy=false;
      check.disabled=false;
      feedback.textContent=Studio.t("wrong");
      feedback.className="feedback wrong";
    }
  });
  draw();
  Studio.ready();
})();

</script>
