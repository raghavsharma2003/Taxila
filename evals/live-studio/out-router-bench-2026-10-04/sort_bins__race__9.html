<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:360px;height:320px;overflow:hidden}
  body{font-family:system-ui,sans-serif;background:#fff8ec;color:#493c35}
  .game{width:360px;height:320px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;overflow:hidden;background:radial-gradient(circle at 93% 5%,#ffe9bf 0 14%,transparent 15%),#fff8ec}
  .head{height:51px;flex:none;display:flex;align-items:center;gap:10px}
  .art{width:44px;height:44px;flex:none}
  .heading{min-width:0}
  h1{margin:0;font-size:19px;line-height:1.15;color:#634634}
  .instruction{margin:3px 0 0;font-size:12px;color:#806c5d}
  .cards{height:96px;flex:none;display:flex;align-content:flex-start;justify-content:center;flex-wrap:wrap;gap:7px;overflow:hidden;padding:3px 0}
  .card{min-width:52px;min-height:52px;flex:0 1 76px;border:2px solid #e8c99d;border-radius:16px;background:#fff;box-shadow:0 4px 0 #e8c99d,0 6px 12px #795b3920;color:#594738;font:700 13px system-ui,sans-serif;cursor:pointer;transition:transform .22s,box-shadow .22s,border-color .22s;overflow-wrap:anywhere;padding:4px}
  .card:active,.bin:active{transform:scale(.94)}
  .card[data-selected="true"]{transform:translateY(-6px) rotate(-3deg);border-color:#e89d5b;box-shadow:0 8px 0 #e8c99d,0 10px 18px #dc914b88}
  .card.shake{animation:shake .38s ease}
  @keyframes shake{25%{transform:translateX(-6px) rotate(-3deg)}50%{transform:translateX(5px) rotate(3deg)}75%{transform:translateX(-3px)}}
  .bins{height:104px;flex:none;display:flex;gap:7px;align-items:stretch}
  .bin{min-width:0;min-height:52px;flex:1;border:2px solid #bfa994;border-bottom:6px solid #ad9078;border-radius:16px 16px 19px 19px;background:#f4e8d7;color:#634b3a;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 3px 4px;transition:transform .2s,background .2s}
  .bin:nth-child(2){background:#e6f1e9;border-color:#9ebca9}
  .bin:nth-child(3){background:#e9edf8;border-color:#a5b3d1}
  .bin-name{font-size:13px;font-weight:750;overflow-wrap:anywhere;text-align:center}
  .placed{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-content:flex-start;overflow:hidden;width:100%}
  .placed-card{border-radius:8px;background:#fff;padding:3px 5px;font-size:11px;font-weight:650;overflow-wrap:anywhere;max-width:100%;animation:arrive .32s ease both}
  @keyframes arrive{from{transform:translateY(-12px) scale(.7);opacity:0}to{transform:none;opacity:1}}
  .feedback{height:20px;flex:none;text-align:center;font-size:14px;line-height:20px;font-weight:750;color:#816045}
  .fly{position:fixed;z-index:10;pointer-events:none;margin:0;transition:transform .42s cubic-bezier(.3,.7,.25,1),opacity .42s}
</style>
<div class="game">
  <div class="head">
    <svg class="art" viewBox="0 0 48 48" aria-hidden="true"><rect x="4" y="12" width="40" height="31" rx="12" fill="#edb879"/><path d="M4 22h40" stroke="#fff4dd" stroke-width="3"/><circle cx="17" cy="13" r="7" fill="#e8a6a1"/><circle cx="30" cy="10" r="6" fill="#a9c9ac"/><circle cx="37" cy="17" r="5" fill="#aebde0"/></svg>
    <div class="heading"><h1 id="title"></h1><p class="instruction" id="instr"></p></div>
  </div>
  <div class="cards" id="cards"></div>
  <div class="bins" id="bins"></div>
  <div class="feedback" id="feedback" aria-live="polite"></div>
</div>
<script>

(() => {
  const p=Studio.params, cards=document.getElementById('cards'), bins=document.getElementById('bins'), feedback=document.getElementById('feedback');
  document.getElementById('title').textContent=Studio.t('title');
  document.getElementById('instr').textContent=Studio.t('instr');
  let selected=null, pending=null, finished=0;
  p.cards.forEach(key=>{
    const b=document.createElement('button');
    b.type='button'; b.className='card'; b.dataset.card=key; b.dataset.selected='false'; b.textContent=Studio.t(key);
    b.addEventListener('click',()=>{
      if(pending)return;
      if(selected)selected.dataset.selected='false';
      selected=b;b.dataset.selected='true';feedback.textContent='';
      Studio.event('pick',{card:key});
    });
    cards.appendChild(b);
  });
  p.bins.forEach(key=>{
    const b=document.createElement('button');
    b.type='button';b.className='bin';b.dataset.bin=key;
    const label=document.createElement('span');label.className='bin-name';label.textContent=Studio.t(key);
    const contents=document.createElement('span');contents.className='placed';
    b.append(label,contents);bins.appendChild(b);
    b.addEventListener('click',()=>{
      if(!selected||pending)return;
      pending={card:selected,bin:b,cardKey:selected.dataset.card,binKey:key};
      Studio.event('sort',{card:pending.cardKey,bin:key});
      Studio.answer({card:pending.cardKey,bin:key});
    });
  });
  Studio.onVerdict(({correct})=>{
    if(!pending)return;
    const {card,bin,cardKey,binKey}=pending;
    pending=null;selected=null;card.dataset.selected='false';
    feedback.textContent=Studio.t(correct?'right':'wrong');
    if(!correct){
      card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
      card.addEventListener('animationend',()=>card.classList.remove('shake'),{once:true});
      return;
    }
    const start=card.getBoundingClientRect(),end=bin.querySelector('.placed').getBoundingClientRect();
    const ghost=card.cloneNode(true);
    ghost.removeAttribute('data-card');ghost.removeAttribute('data-selected');
    ghost.className='card fly';
    Object.assign(ghost.style,{left:start.left+'px',top:start.top+'px',width:start.width+'px',height:start.height+'px'});
    document.body.appendChild(ghost);
    card.remove();
    const placed=document.createElement('span');placed.className='placed-card';placed.dataset.placed=binKey;placed.textContent=Studio.t(cardKey);
    requestAnimationFrame(()=>{ghost.style.transform=`translate(${end.left-start.left+end.width/2-start.width/2}px,${end.top-start.top+10}px) scale(.7)`;ghost.style.opacity='0'});
    setTimeout(()=>{ghost.remove();bin.querySelector('.placed').appendChild(placed);finished++;if(finished===p.cards.length){feedback.textContent=Studio.t('done');Studio.done()}},430);
  });
  Studio.ready();
})();

</script>
