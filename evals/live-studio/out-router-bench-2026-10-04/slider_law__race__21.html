<style>
  *{box-sizing:border-box}
  #activity{position:relative;width:360px;height:320px;overflow:hidden;border-radius:20px;background:#fff4df;color:#49362e;font-family:system-ui,sans-serif}
  #title{position:absolute;top:10px;left:18px;right:18px;font-size:19px;font-weight:800}
  #picture{position:absolute;left:18px;top:39px;width:150px;height:180px;border-radius:18px;background:#f9e5c7;overflow:hidden}
  #picture:after{content:"";position:absolute;left:12px;right:12px;bottom:9px;height:4px;border-radius:4px;background:#bc9273}
  #visual{position:absolute;bottom:13px;left:49px;width:52px;height:0;background:linear-gradient(90deg,#ed956b,#f6bb78);border:3px solid #ce755b;border-radius:12px 12px 4px 4px;transition:height .38s cubic-bezier(.2,.8,.2,1)}
  #visual:before{content:"";position:absolute;top:12px;left:10px;width:7px;height:7px;border-radius:50%;background:#714638;box-shadow:19px 0 #714638}
  #visual:after{content:"";position:absolute;top:24px;left:19px;width:10px;height:5px;border-bottom:2px solid #714638;border-radius:50%}
  #panel{position:absolute;left:181px;top:42px;width:161px}
  .readout{height:37px;font-size:16px;font-weight:700}
  .readout strong{font-size:23px;color:#aa533f}
  #controls{display:flex;gap:9px;margin-top:4px}
  button{font:inherit;font-weight:800;border:0;cursor:pointer;touch-action:manipulation;transition:transform .16s,background .2s}
  button:active{transform:scale(.91)}
  #controls button{width:76px;height:58px;border-radius:17px;background:#df7961;color:white;font-size:15px}
  #controls button:disabled{opacity:.4;cursor:default}
  #question{position:absolute;left:18px;right:18px;top:222px;height:29px;font-size:15px;font-weight:750}
  #feedback{float:right;color:#a45343}
  #options{position:absolute;left:18px;right:18px;bottom:10px;display:flex;gap:10px}
  #options button{flex:1;height:55px;border-radius:17px;background:#fff;border:2px solid #e9b997;color:#804934;font-size:21px;box-shadow:0 3px 0 #e9b997}
  #options button.pulse{animation:pulse .35s ease}
  @keyframes pulse{50%{transform:scale(1.08)}}
</style>
<div id="activity">
  <div id="title"></div>
  <div id="picture"><div id="visual" data-visual data-dim="h"></div></div>
  <div id="panel">
    <div class="readout"><span id="xname"></span> <strong id="xvalue" data-x=""></strong></div>
    <div class="readout"><span id="yname"></span> <strong id="yvalue" data-output data-value=""></strong></div>
    <div id="controls"><button type="button" data-action="dec"></button><button type="button" data-action="inc"></button></div>
  </div>
  <div id="question"><span id="prompt"></span> <span id="askx"></span><span id="feedback" aria-live="polite"></span></div>
  <div id="options"></div>
</div>
<script>

(()=>{
  const p=Studio.params, $=s=>document.querySelector(s);
  const fmt=n=>String(Number(n.toFixed(10)));
  let x=p.x.start, finished=false;
  $('#title').textContent=Studio.t('title');
  $('#xname').textContent=Studio.t('xname');
  $('#yname').textContent=Studio.t('yname');
  $('[data-action="dec"]').textContent=Studio.t('less');
  $('[data-action="inc"]').textContent=Studio.t('more');
  $('#prompt').textContent=Studio.t('ask');
  $('#askx').textContent=fmt(p.ask.x);
  function update(){
    const y=p.law.k*x+p.law.b;
    $('#xvalue').textContent=fmt(x);
    $('#xvalue').dataset.x=fmt(x);
    $('#yvalue').textContent=fmt(y);
    $('#yvalue').dataset.value=fmt(y);
    $('#visual').style.height=fmt(y*p.y.unitsPer)+'px';
    $('[data-action="dec"]').disabled=x-p.x.step<p.x.min;
    $('[data-action="inc"]').disabled=x+p.x.step>p.x.max;
  }
  $('[data-action="dec"]').addEventListener('click',()=>{x=Math.max(p.x.min,Number((x-p.x.step).toFixed(10)));update()});
  $('[data-action="inc"]').addEventListener('click',()=>{x=Math.min(p.x.max,Number((x+p.x.step).toFixed(10)));update()});
  p.ask.options.forEach(value=>{
    const button=document.createElement('button');
    button.type='button';
    button.dataset.option=fmt(value);
    button.textContent=fmt(value);
    button.addEventListener('click',()=>{
      if(finished)return;
      button.classList.remove('pulse');
      void button.offsetWidth;
      button.classList.add('pulse');
      Studio.answer({value});
    });
    $('#options').append(button);
  });
  Studio.onVerdict(({correct})=>{
    $('#feedback').textContent=Studio.t(correct?'right':'wrong');
    if(correct&&!finished){finished=true;Studio.done()}
  });
  update();
  Studio.ready();
})();

</script>
