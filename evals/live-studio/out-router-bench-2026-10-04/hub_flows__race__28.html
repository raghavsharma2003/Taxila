<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;font-family:Arial,sans-serif;background:#fff7df;color:#3d542f}
  #app{width:360px;height:320px;position:relative;overflow:hidden;background:linear-gradient(#fff8e6 0%,#f7efd4 100%)}
  svg{display:block;width:360px;height:176px}
  .title{font-size:15px;font-weight:700;fill:#596b35;text-anchor:middle}
  .label{font-size:11px;font-weight:700;fill:#526139;paint-order:stroke;stroke:#fff8e6;stroke-width:3px;stroke-linejoin:round}
  .flowlabel{font-size:11px;font-weight:700;fill:#587157;paint-order:stroke;stroke:#fff8e6;stroke-width:3px;stroke-linejoin:round}
  .ground{stroke:#d9c98e;stroke-width:2}
  .rootline{fill:none;stroke:#9a6943;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  .leaf{fill:#78bd56;stroke:#427f3b;stroke-width:3;stroke-linejoin:round;filter:drop-shadow(0 3px 2px rgba(75,92,41,.18))}
  .vein{fill:none;stroke:#e4f3ad;stroke-width:2;stroke-linecap:round}
  .sun{fill:#ffd65c;stroke:#e8a538;stroke-width:3}
  .ray{stroke:#f1b53e;stroke-width:3;stroke-linecap:round}
  .particle{filter:drop-shadow(0 1px 1px rgba(48,70,47,.2));transition:opacity .25s}
  .water{fill:#4daed4}
  .co2{fill:#7c9a91}
  .o2{fill:#f18c6a}
  .emph{animation:glow 1s ease-in-out infinite alternate}
  @keyframes glow{from{filter:drop-shadow(0 0 1px #fff)}to{filter:drop-shadow(0 0 7px #f1bd47)}}
  .controls{height:54px;display:flex;align-items:center;justify-content:space-between;padding:1px 6px 1px 7px}
  button{border:0;font-family:inherit;font-weight:700;cursor:pointer;touch-action:manipulation}
  .round{width:52px;height:52px;border-radius:18px;background:#79984f;color:#fffaf0;box-shadow:0 3px 0 #577437;font-size:12px;transition:transform .14s,box-shadow .14s}
  .round:active,.option:active{transform:scale(.92);box-shadow:0 1px 0 rgba(57,76,35,.45)}
  #caption{width:224px;min-height:36px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;font-weight:700;color:#60783f;padding:2px 5px}
  #ask{height:28px;padding:2px 12px 0;text-align:center;font-size:12px;font-weight:700;color:#526339;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #options{height:58px;display:flex;gap:6px;padding:2px 6px}
  .option{height:52px;flex:1;min-width:0;border-radius:16px;background:#fffdf3;color:#4c673b;border:2px solid #b5cc83;box-shadow:0 3px 0 #a4bc73;font-size:12px;transition:transform .14s,background .2s}
  .option.chosen{background:#e7f3bc;transform:scale(.96)}
  .wrong{color:#b45e49!important}
  .right{color:#4f8645!important}
</style>
<div id="app">
  <svg viewBox="0 0 360 176" aria-label="">
    <text id="title" class="title" x="180" y="15"></text>
    <line class="ground" x1="120" y1="157" x2="250" y2="157"></line>

    <g id="sunGroup">
      <line class="ray" x1="43" y1="22" x2="43" y2="17"></line>
      <line class="ray" x1="25" y1="39" x2="19" y2="39"></line>
      <line class="ray" x1="61" y1="39" x2="67" y2="39"></line>
      <line class="ray" x1="29" y1="26" x2="24" y2="21"></line>
      <line class="ray" x1="57" y1="26" x2="62" y2="21"></line>
      <circle class="sun" data-entity="sun" cx="43" cy="39" r="14"></circle>
    </g>
    <text class="label" data-label="sun" x="12" y="68"></text>

    <path class="rootline" data-entity="roots" d="M181 126 C180 141 178 147 166 157 M180 140 C189 148 200 151 207 160 M175 148 C170 151 165 154 160 162 M185 146 C185 154 181 160 177 165"></path>
    <text class="label" data-label="roots" x="211" y="166"></text>

    <path class="leaf" data-entity="leaf" d="M181 126 C143 116 136 78 157 54 C175 34 210 43 223 64 C237 89 216 120 181 126 Z"></path>
    <path class="vein" d="M181 120 C184 97 187 76 205 57 M184 100 C168 88 158 77 153 66 M185 91 C201 84 211 77 218 68"></path>
    <text class="label" data-label="leaf" x="194" y="48"></text>

    <circle class="particle water" data-flow="water" data-i="0" r="4"></circle>
    <circle class="particle water" data-flow="water" data-i="1" r="4"></circle>
    <circle class="particle water" data-flow="water" data-i="2" r="4"></circle>
    <circle class="particle co2" data-flow="co2" data-i="0" r="4"></circle>
    <circle class="particle co2" data-flow="co2" data-i="1" r="4"></circle>
    <circle class="particle co2" data-flow="co2" data-i="2" r="4"></circle>
    <circle class="particle o2" data-flow="o2" data-i="0" r="4"></circle>
    <circle class="particle o2" data-flow="o2" data-i="1" r="4"></circle>
    <circle class="particle o2" data-flow="o2" data-i="2" r="4"></circle>

    <text class="flowlabel" data-label="water" x="213" y="145"></text>
    <text class="flowlabel" data-label="co2" x="8" y="120"></text>
    <text class="flowlabel" data-label="o2" x="291" y="113"></text>
  </svg>

  <div class="controls">
    <button class="round" data-action="play" id="play"></button>
    <div data-caption id="caption"></div>
    <button class="round" data-action="next" id="next"></button>
  </div>
  <div id="ask"></div>
  <div id="options"></div>
</div>
<script>

(function(){
  var p=Studio.params, playing=true, step=1, completed=false, phase=0;
  var play=document.getElementById('play'), next=document.getElementById('next');
  var caption=document.getElementById('caption'), ask=document.getElementById('ask');
  document.getElementById('title').textContent=Studio.t('title');
  document.querySelectorAll('[data-label]').forEach(function(el){el.textContent=Studio.t(el.getAttribute('data-label'));});
  function text(){
    play.textContent=Studio.t(playing?'pause':'play');
    next.textContent=Studio.t('next');
    caption.textContent=Studio.t('step'+step);
    ask.textContent=Studio.t('ask');
    ask.className='';
  }
  text();
  p.options.forEach(function(key){
    var b=document.createElement('button');
    b.className='option';
    b.setAttribute('data-option',key);
    b.textContent=Studio.t(key);
    b.addEventListener('click',function(){
      document.querySelectorAll('.option').forEach(function(x){x.classList.remove('chosen');});
      b.classList.add('chosen');
      Studio.event('option',{key:key});
      Studio.answer(key);
    });
    document.getElementById('options').appendChild(b);
  });
  function emphasis(){
    document.querySelectorAll('.emph').forEach(function(x){x.classList.remove('emph');});
    var target=step===1?'[data-entity="'+p.hub+'"]':step===2?'[data-flow="water"]':step===3?'[data-flow="co2"]':'[data-flow="o2"]';
    document.querySelectorAll(target).forEach(function(x){x.classList.add('emph');});
  }
  emphasis();
  play.addEventListener('click',function(){
    playing=!playing; play.textContent=Studio.t(playing?'pause':'play');
    Studio.event('play',{on:playing?1:0});
  });
  next.addEventListener('click',function(){
    step=step%p.steps+1; caption.textContent=Studio.t('step'+step); emphasis();
    Studio.event('next',{step:step});
  });
  var routes={
    water:[[180,154],[181,124]],
    co2:[[18,103],[144,91]],
    o2:[[217,90],[340,103]]
  };
  function frame(){
    if(playing) phase=(phase+.008)%1;
    document.querySelectorAll('.particle').forEach(function(dot){
      var key=dot.getAttribute('data-flow'), i=Number(dot.getAttribute('data-i'));
      var t=(phase+i/3)%1, r=routes[key], x=r[0][0]+(r[1][0]-r[0][0])*t, y=r[0][1]+(r[1][1]-r[0][1])*t;
      dot.setAttribute('cx',x); dot.setAttribute('cy',y);
    });
    requestAnimationFrame(frame);
  }
  frame();
  Studio.onVerdict(function(v){
    if(v.correct){
      ask.textContent=Studio.t('right'); ask.className='right';
      if(!completed){completed=true;Studio.done();}
    }else{
      ask.textContent=Studio.t('wrong'); ask.className='wrong';
    }
  });
  Studio.ready();
})();

</script>
