<style>
  *{box-sizing:border-box}body{margin:0;width:360px;height:320px;overflow:hidden;font-family:system-ui,sans-serif;background:#fff8ed;color:#49382f}
  .scene{position:relative;width:360px;height:320px;overflow:hidden;background:radial-gradient(circle at 90% 5%,#ffe8c7,transparent 42%),#fff8ed}
  h1{position:absolute;top:12px;left:18px;right:18px;margin:0;font-size:20px;line-height:25px;color:#864b37}
  .ask{position:absolute;top:43px;left:18px;right:18px;min-height:32px;font-size:15px;line-height:19px}
  svg{position:absolute;inset:0;width:360px;height:320px;overflow:visible}
  [data-axis]{stroke:#be8765;stroke-width:5;stroke-linecap:round}
  .join{stroke:#c69a79;stroke-width:2;stroke-linecap:round}
  [data-event]{fill:#d97956;stroke:#fff8ed;stroke-width:3;transition:fill .25s,transform .25s;transform-box:fill-box;transform-origin:center}
  .card{position:absolute;width:94px;height:64px;padding:5px;border:2px solid #e9b999;border-radius:16px;background:#fffdf8;box-shadow:0 4px 0 #e9d5bf;color:#633e31;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;cursor:pointer;touch-action:manipulation;transition:transform .18s,background .2s,box-shadow .2s}
  .card:active{transform:scale(.93)}.card:focus-visible{outline:3px solid #865bbc;outline-offset:2px}
  .card .name{font-size:13px;font-weight:700;line-height:15px;max-height:30px;overflow:hidden}.card .year{font-size:12px;color:#98634b}
  .card.chosen{background:#ffe1b7;transform:scale(1.06);box-shadow:0 5px 0 #dca575}
  .feedback{position:absolute;left:15px;right:15px;top:274px;min-height:36px;text-align:center;font-size:16px;font-weight:700;color:#87533d;display:grid;place-items:center}
  .feedback.pop{animation:pop .35s ease-out}@keyframes pop{50%{transform:scale(1.08)}}
</style>
<div class="scene">
  <h1 id="title"></h1>
  <div class="ask" id="ask"></div>
  <svg id="timeline" viewBox="0 0 360 320" aria-hidden="true">
    <line data-axis x1="38" y1="175" x2="322" y2="175"></line>
    <g id="joins"></g><g id="markers"></g>
  </svg>
  <div id="cards"></div>
  <div class="feedback" id="feedback" aria-live="polite"></div>
</div>
<script>

(()=>{
  const p=Studio.params, events=[...p.events].sort((a,b)=>a.year-b.year);
  const title=document.getElementById('title'),ask=document.getElementById('ask');
  const cards=document.getElementById('cards'),markers=document.getElementById('markers');
  const joins=document.getElementById('joins'),feedback=document.getElementById('feedback');
  title.textContent=Studio.t('title');ask.textContent=Studio.t('ask');
  const ns='http://www.w3.org/2000/svg', low=events[0].year,high=events[events.length-1].year;
  const xOf=y=>38+(high===low?0.5:(y-low)/(high-low))*284;
  const lanes=[[],[]];let waiting=false,finished=false;
  events.forEach(e=>{
    const x=xOf(e.year);
    let best=null;
    for(let lane=0;lane<2;lane++){
      const left=Math.max(4,Math.min(262,x-47));
      const positions=[left,4,262,...lanes[lane].map(v=>Math.max(4,Math.min(262,v+100)))];
      for(const pos of positions){
        if(lanes[lane].every(v=>Math.abs(v-pos)>=100)){
          const cost=Math.abs(pos+47-x)+(lane?8:0);
          if(!best||cost<best.cost)best={lane,pos,cost};
        }
      }
    }
    const lane=best?best.lane:lanes[0].length<=lanes[1].length?0:1;
    const pos=best?best.pos:Math.max(4,Math.min(262,x-47));
    lanes[lane].push(pos);
    const top=lane?205:91,cy=lane?205:155;
    const line=document.createElementNS(ns,'line');
    line.setAttribute('class','join');line.setAttribute('x1',x);line.setAttribute('y1',175);
    line.setAttribute('x2',pos+47);line.setAttribute('y2',cy);joins.append(line);
    const dot=document.createElementNS(ns,'circle');
    dot.setAttribute('data-event',e.key);dot.setAttribute('data-year',String(e.year));
    dot.setAttribute('cx',x);dot.setAttribute('cy',175);dot.setAttribute('r',7);markers.append(dot);
    const card=document.createElement('button');card.type='button';card.className='card';
    card.setAttribute('data-card',e.key);card.style.left=pos+'px';card.style.top=top+'px';
    const name=document.createElement('span');name.className='name';name.textContent=Studio.t(e.key);
    const year=document.createElement('span');year.className='year';year.textContent=String(e.year);
    card.append(name,year);cards.append(card);
    card.addEventListener('click',()=>{
      if(waiting||finished)return;
      waiting=true;card.classList.add('chosen');
      Studio.event('tap',{key:e.key});Studio.answer(e.key);
    });
  });
  Studio.onVerdict(({correct})=>{
    waiting=false;
    feedback.classList.remove('pop');void feedback.offsetWidth;feedback.classList.add('pop');
    if(correct){
      finished=true;feedback.textContent=Studio.t('right')+' · '+Studio.t('done');
      Studio.done();
    }else{
      feedback.textContent=Studio.t('wrong');
      cards.querySelectorAll('.chosen').forEach(c=>c.classList.remove('chosen'));
    }
  });
  Studio.ready();
})();

</script>
