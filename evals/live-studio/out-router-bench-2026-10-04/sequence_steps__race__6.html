<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;font-family:system-ui,sans-serif;background:#fff6e8;color:#553b32}
  #app{width:360px;height:320px;padding:14px 16px;position:relative;overflow:hidden}
  .blob{position:absolute;width:132px;height:132px;right:-48px;top:-58px;border-radius:50%;background:#ffe3b6;pointer-events:none}
  h1{position:relative;margin:0;font-size:22px;line-height:28px;font-weight:800}
  #instr{position:relative;margin:3px 0 11px;font-size:13px;line-height:18px;color:#775e52}
  #cards{height:116px;display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:52px;gap:10px}
  .card{min-width:0;min-height:52px;border:2px solid #e9aa73;border-radius:16px;background:#fffaf2;color:#553b32;font:700 17px system-ui,sans-serif;box-shadow:0 4px 0 #f2d7bd;cursor:pointer;transition:transform .2s,background .2s,box-shadow .2s}
  .card:not(:disabled):active{transform:scale(.94);box-shadow:0 1px 0 #f2d7bd}
  .card:disabled{cursor:default}
  .card.shake{animation:shake .36s ease}
  @keyframes shake{25%,75%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
  #track{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:15px}
  .slot{height:70px;min-width:0;border:2px dashed #d9bba5;border-radius:17px;background:#fffaf3;display:flex;align-items:center;justify-content:center;position:relative;color:#ab8067;font-size:20px;font-weight:800}
  .slot.filled{border-style:solid;border-color:#83ae88;background:#edf6e9}
  .slot .card{width:100%;height:100%;border-color:#83ae88;background:#edf6e9;box-shadow:none;font-size:14px;padding:17px 2px 2px;animation:arrive .35s ease-out}
  .slot .num{position:absolute;top:3px;left:8px;font-size:13px;line-height:16px;z-index:1}
  @keyframes arrive{from{transform:scale(.7);opacity:.4}to{transform:scale(1);opacity:1}}
  #feedback{height:32px;margin-top:8px;text-align:center;font-size:16px;font-weight:750;color:#648469}
  #feedback.wrong{color:#b46c55}
</style>
<div id="app">
  <div class="blob" aria-hidden="true"></div>
  <h1 id="title"></h1>
  <div id="instr"></div>
  <div id="cards"></div>
  <div id="track"></div>
  <div id="feedback" aria-live="polite"></div>
</div>
<script>

  const p=Studio.params;
  const shown=p.shown;
  const cards=document.getElementById('cards');
  const track=document.getElementById('track');
  const feedback=document.getElementById('feedback');
  document.getElementById('title').textContent=Studio.t('title');
  document.getElementById('instr').textContent=Studio.t('instr');
  const slots=shown.map((_,i)=>{
    const slot=document.createElement('div');
    slot.className='slot';
    slot.textContent=String(i+1);
    track.appendChild(slot);
    return slot;
  });
  let placed=0,waiting=false,active=null;
  shown.forEach(key=>{
    const card=document.createElement('button');
    card.type='button';
    card.className='card';
    card.dataset.step=key;
    card.textContent=Studio.t(key);
    card.addEventListener('click',()=>{
      if(waiting||card.dataset.placed)return;
      waiting=true;
      active=card;
      card.style.transform='scale(.95)';
      setTimeout(()=>{card.style.transform=''},150);
      Studio.answer({key});
    });
    cards.appendChild(card);
  });
  Studio.onVerdict(({correct})=>{
    if(!waiting||!active)return;
    const card=active;
    active=null;
    waiting=false;
    feedback.classList.toggle('wrong',!correct);
    feedback.textContent=Studio.t(correct?'right':'wrong');
    if(correct){
      placed++;
      card.dataset.placed=String(placed);
      card.disabled=true;
      const slot=slots[placed-1];
      slot.textContent='';
      slot.classList.add('filled');
      const num=document.createElement('span');
      num.className='num';
      num.textContent=String(placed);
      slot.appendChild(num);
      slot.appendChild(card);
      if(placed===shown.length){
        feedback.textContent=Studio.t('done');
        Studio.done();
      }
    }else{
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
    }
  });
  Studio.ready();

</script>
