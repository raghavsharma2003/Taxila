<style>
*{box-sizing:border-box}
html,body{margin:0;width:360px;height:320px;overflow:hidden}
body{font-family:system-ui,sans-serif;color:#503d32;background:#fff8ec}
.stage{width:360px;height:320px;padding:10px 14px;display:flex;flex-direction:column;gap:7px}
h1{font-size:18px;line-height:22px;margin:0;text-align:center;color:#794f38}
.readings{height:38px;display:flex;justify-content:center;align-items:center;gap:20px;background:#fff;border-radius:14px;font-size:15px;font-weight:700}
.scene{height:185px;position:relative;display:flex;align-items:flex-end;justify-content:center;border-radius:18px;background:linear-gradient(#e6f5f4,#fff3db);overflow:hidden}
.sun{position:absolute;width:35px;height:35px;right:24px;top:16px}
.ground{position:absolute;bottom:10px;width:86%;height:4px;border-radius:4px;background:#9c7658}
.visual{position:relative;z-index:1;width:72px;min-height:1px;border-radius:12px 12px 4px 4px;background:linear-gradient(90deg,#ef9c56,#f4bd68);transition:height .35s cubic-bezier(.2,.8,.2,1);box-shadow:inset -9px 0 rgba(177,99,53,.14),0 3px 8px #8a593333}
.visual:after{content:"";position:absolute;left:12px;right:12px;top:12px;height:5px;border-radius:5px;background:#ffe2ae88}
.controls{height:56px;display:flex;justify-content:center;gap:12px}
button{font:700 16px system-ui,sans-serif;border:0;border-radius:16px;background:#e9a35c;color:#fff;min-width:92px;height:56px;padding:0 15px;cursor:pointer;box-shadow:0 3px 0 #c98243;transition:transform .12s,background .2s}
button:active{transform:scale(.94)}
button:disabled{opacity:.48;cursor:default}
.question{font-size:14px;font-weight:700;text-align:center;line-height:18px}
.options{height:52px;display:flex;justify-content:center;gap:10px}
.options button{min-width:72px;width:72px;height:52px;padding:0;background:#78aaa3;box-shadow:0 3px 0 #56867f;font-size:18px}
.feedback{height:19px;text-align:center;font-size:14px;font-weight:700;color:#56867f}
</style>
<main class="stage">
  <h1 id="title"></h1>
  <div class="readings">
    <span><span id="xname"></span> = <span id="xread" data-x=""></span></span>
    <span><span id="yname"></span> = <span data-output data-value=""></span></span>
  </div>
  <div class="scene" aria-hidden="true">
    <svg class="sun" viewBox="0 0 40 40"><circle cx="20" cy="20" r="9" fill="#f3c45f"/><path d="M20 2v6M20 32v6M2 20h6M32 20h6M7.3 7.3l4.2 4.2m17 17 4.2 4.2m0-25.4-4.2 4.2m-17 17-4.2 4.2" stroke="#e6a84c" stroke-width="3" stroke-linecap="round"/></svg>
    <div class="ground"></div>
    <div class="visual" data-visual data-dim="h"></div>
  </div>
  <div class="controls">
    <button type="button" data-action="dec" id="less"></button>
    <button type="button" data-action="inc" id="more"></button>
  </div>
  <div class="question" id="question"></div>
  <div class="options" id="options"></div>
  <div class="feedback" id="feedback" aria-live="polite"></div>
</main>
<script>

(()=>{
  const p=Studio.params;
  let x=p.x.start;
  let completed=false;
  const el=id=>document.getElementById(id);
  el("title").textContent=Studio.t("title");
  el("xname").textContent=Studio.t("xname");
  el("yname").textContent=Studio.t("yname");
  el("less").textContent=Studio.t("less");
  el("more").textContent=Studio.t("more");
  el("question").textContent=Studio.t("ask")+" "+p.ask.x;
  function update(){
    const y=p.law.k*x+p.law.b;
    el("xread").textContent=String(x);
    el("xread").setAttribute("data-x",String(x));
    const out=document.querySelector("[data-output]");
    out.textContent=String(y);
    out.setAttribute("data-value",String(y));
    document.querySelector("[data-visual]").style.height=(y*p.y.unitsPer)+"px";
    el("less").disabled=x<=p.x.min;
    el("more").disabled=x>=p.x.max;
  }
  el("less").addEventListener("click",()=>{
    if(x>p.x.min){x=Math.max(p.x.min,x-p.x.step);update();Studio.event("change",{x});}
  });
  el("more").addEventListener("click",()=>{
    if(x<p.x.max){x=Math.min(p.x.max,x+p.x.step);update();Studio.event("change",{x});}
  });
  p.ask.options.forEach(option=>{
    const b=document.createElement("button");
    b.type="button";
    b.textContent=String(option);
    b.setAttribute("data-option",String(option));
    b.addEventListener("click",()=>{
      if(!completed)Studio.answer({value:option});
    });
    el("options").appendChild(b);
  });
  Studio.onVerdict(({correct})=>{
    el("feedback").textContent=Studio.t(correct?"right":"wrong");
    if(correct&&!completed){
      completed=true;
      el("feedback").textContent=Studio.t("done");
      Studio.done();
    }
  });
  update();
  Studio.ready();
})();

</script>
