<style>
*{box-sizing:border-box}
html,body{width:360px;height:320px;margin:0;overflow:hidden}
body{font-family:system-ui,sans-serif;color:#543d35;background:#fff7e9}
#app{width:360px;height:320px;padding:12px;display:flex;flex-direction:column;gap:8px}
header{display:flex;align-items:center;justify-content:center;min-height:32px;color:#875033;font-weight:800;font-size:18px}
#card{flex:1;min-height:0;border-radius:22px;background:#fff;box-shadow:0 4px 0 #efd9bd;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
#instruction{font-size:14px;text-align:center;min-height:36px;display:flex;align-items:center;justify-content:center}
#target{font-size:28px;font-weight:850;color:#a84e37;letter-spacing:1px;min-height:36px}
#parts{width:100%;height:140px;display:grid;gap:6px;align-content:center;justify-content:center}
.part{min-width:52px;min-height:52px;border:2px solid #d89b55;border-radius:9px;background:#ffe3a8;box-shadow:inset 0 -3px 0 #f2ca84;cursor:pointer;transition:transform .16s,background .2s,box-shadow .2s;padding:0}
.part:active,#check:active{transform:scale(.94)}
.part[data-shaded="true"]{background:#ed8d58;box-shadow:inset 0 -3px 0 #cf6845}
#check{min-width:120px;min-height:52px;border:0;border-radius:17px;background:#548f68;color:white;font:700 17px system-ui;box-shadow:0 4px 0 #39724f;cursor:pointer;transition:transform .16s}
#message{min-height:22px;font-size:14px;font-weight:700;color:#88523b;text-align:center}
#card.celebrate{animation:pop .45s ease}
@keyframes pop{50%{transform:scale(1.035)}}
#doneScreen{flex:1;border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:22px;font-weight:800;color:#875033;box-shadow:0 4px 0 #efd9bd;animation:pop .45s ease}
</style>
<div id="app">
  <header id="title"></header>
  <section id="card" data-item="">
    <div id="instruction"></div>
    <div id="target" data-target></div>
    <div id="parts"></div>
    <button id="check" data-action="check"></button>
    <div id="message" aria-live="polite"></div>
  </section>
</div>
<script>

(()=>{const items=Studio.params.items;const picture=Studio.params.picture;const title=document.getElementById("title");const card=document.getElementById("card");const instruction=document.getElementById("instruction");const target=document.getElementById("target");const parts=document.getElementById("parts");const check=document.getElementById("check");const message=document.getElementById("message");title.textContent=Studio.t("title");instruction.textContent=Studio.t("instr");check.textContent=Studio.t("check");let index=0,shaded=[];function render(){if(index>=items.length){const done=document.createElement("div");done.id="doneScreen";done.textContent=Studio.t("done");card.replaceWith(done);Studio.done();return}const item=items[index];shaded=Array(item.d).fill(false);card.dataset.item=item.id;target.textContent=item.n+"/"+item.d;parts.replaceChildren();const cols=Math.min(item.d,4);parts.style.gridTemplateColumns="repeat("+cols+", minmax(52px, 1fr))";parts.style.gridTemplateRows="repeat("+Math.ceil(item.d/cols)+", minmax(52px, 1fr))";for(let i=0;i<item.d;i++){const part=document.createElement("button");part.type="button";part.className="part";part.dataset.part=i;part.dataset.shaded="false";part.setAttribute("aria-label",Studio.t("hint"));part.addEventListener("click",()=>{shaded[i]=!shaded[i];part.dataset.shaded=String(shaded[i]);part.style.transform="scale(.94)";setTimeout(()=>part.style.transform="",160);Studio.event("part",{index:i,shaded:shaded[i]?1:0})});parts.append(part)}message.textContent=Studio.t("hint");Studio.ready()}check.addEventListener("click",()=>{const item=items[index];const n=shaded.reduce((sum,value)=>sum+(value?1:0),0);Studio.event("check",{item:index,n:n});Studio.answer({n:n,d:item.d})});Studio.onVerdict(({correct})=>{message.textContent=Studio.t(correct?"right":"wrong");if(correct){card.classList.remove("celebrate");void card.offsetWidth;card.classList.add("celebrate");setTimeout(()=>{index++;render()},550)}});render()})();

</script>
