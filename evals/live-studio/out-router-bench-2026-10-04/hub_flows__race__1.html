<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;background:#fff8ed;color:#493b35;font-family:system-ui,sans-serif}
  .card{width:360px;height:320px;overflow:hidden;background:linear-gradient(#fff8ed,#fff1dc)}
  .title{height:27px;padding:3px 14px;font-size:16px;font-weight:750;color:#72513d}
  svg{display:block;width:360px;height:166px}
  svg text{font:600 12px system-ui,sans-serif;fill:#614c40}
  .controls{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 7px;gap:5px}
  button{border:0;font:700 13px system-ui,sans-serif;cursor:pointer;transition:transform .16s,background .2s}
  button:active{transform:scale(.92)}
  .control{width:55px;height:52px;border-radius:17px;background:#e5d5b8;color:#4f4337}
  .caption{flex:1;text-align:center;font-size:13px;font-weight:650;color:#755140;line-height:1.2}
  .question{height:21px;padding:1px 12px;font-size:13px;font-weight:700}
  .options{height:54px;display:flex;gap:6px;padding:0 7px 2px}
  .option{flex:1;min-width:0;height:52px;border-radius:16px;background:#dcebd7;color:#305747;box-shadow:0 3px 0 #b8d2b3}
  .option:focus-visible,.control:focus-visible{outline:3px solid #ba7851;outline-offset:-3px}
  .feedback{position:absolute;top:246px;right:10px;font-size:12px;font-weight:700;color:#326750;background:#fff8ed;padding-left:4px}
  .glow{animation:breathe 1.6s ease-in-out infinite alternate}
  @keyframes breathe{to{filter:drop-shadow(0 0 8px #f8b95f);transform:scale(1.055)}}
</style>
<div class="card">
  <div class="title" id="title"></div>
  <svg id="scene" viewBox="0 0 360 166" aria-hidden="true">
    <path d="M22 72 Q83 24 136 66" fill="none" stroke="#f6d48b" stroke-width="5" stroke-linecap="round"/>
    <path d="M168 137 L168 91" fill="none" stroke="#8cbad4" stroke-width="5" stroke-linecap="round"/>
    <path d="M294 100 L211 74" fill="none" stroke="#a1b8a4" stroke-width="5" stroke-linecap="round"/>
    <path d="M213 51 L302 38" fill="none" stroke="#b8d9c4" stroke-width="5" stroke-linecap="round"/>
    <g id="particles"></g>
    <circle id="entity0" cx="57" cy="51" r="22" fill="#ffcf70" stroke="#f3a94b" stroke-width="4"/>
    <path id="entity1" d="M168 119 L168 139 M168 128 L150 142 M168 129 L187 143 M150 142 L144 151 M187 143 L194 151" fill="none" stroke="#a77754" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="hub" d="M170 90 C117 76 132 33 190 42 C227 49 230 87 170 90Z" fill="#76b987" stroke="#418c69" stroke-width="4"/>
    <path d="M153 80 Q178 68 205 57" fill="none" stroke="#e0f2be" stroke-width="3" stroke-linecap="round"/>
    <text id="labelEntity0" x="13" y="91"></text>
    <text id="labelEntity1" x="100" y="163"></text>
    <text id="labelHub" x="146" y="30"></text>
    <text id="labelFlow0" x="184" y="128"></text>
    <text id="labelFlow1" x="257" y="121"></text>
    <text id="labelFlow2" x="270" y="27"></text>
  </svg>
  <div class="controls">
    <button class="control" data-action="play" id="play"></button>
    <div class="caption" data-caption id="caption"></div>
    <button class="control" data-action="next" id="next"></button>
  </div>
  <div class="question" id="ask"></div>
  <div class="options" id="options"></div>
</div>
<script>

(()=>{
  const p=Studio.params, t=k=>Studio.t(k), svg=document.getElementById('scene');
  const hub=document.getElementById('hub'), dots=document.getElementById('particles');
  hub.setAttribute('data-entity',p.hub);
  document.getElementById('labelHub').setAttribute('data-label',p.hub);
  document.getElementById('labelHub').textContent=t(p.hub);
  p.entities.forEach((key,i)=>{
    const shape=document.getElementById('entity'+i), label=document.getElementById('labelEntity'+i);
    if(shape&&label){shape.setAttribute('data-entity',key);label.setAttribute('data-label',key);label.textContent=t(key)}
  });
  document.getElementById('title').textContent=t('title');
  document.getElementById('ask').textContent=t('ask');
  const routes={up_in:[[168,137],[168,91]],in:[[294,100],[211,74]],out:[[213,51],[302,38]]};
  const colors={up_in:'#55a8d1',in:'#719b79',out:'#8acaaa'};
  const moving=[];
  p.flows.forEach((flow,i)=>{
    const label=document.getElementById('labelFlow'+i);
    if(label){label.setAttribute('data-label',flow.key);label.textContent=t(flow.key)}
    const route=routes[flow.dir]||routes.in;
    for(let j=0;j<4;j++){
      const circle=document.createElementNS('http://www.w3.org/2000/svg','circle');
      circle.setAttribute('data-flow',flow.key);
      circle.setAttribute('r',j%2?4:5);
      circle.setAttribute('fill',colors[flow.dir]||colors.in);
      dots.appendChild(circle);
      moving.push({circle,route,phase:j/4,group:i});
    }
  });
  let playing=true,step=0,finished=false,last=0;
  const play=document.getElementById('play'),caption=document.getElementById('caption');
  const steps=['step1','step2','step3'];
  function refresh(){
    play.textContent=t(playing?'pause':'play');
    caption.textContent=t(steps[step%steps.length]);
    hub.classList.toggle('glow',step===0&&playing);
    moving.forEach(item=>item.circle.setAttribute('opacity',item.group===step?'1':'.48'));
  }
  function frame(time){
    const dt=last?Math.min(time-last,50):0;last=time;
    if(playing)moving.forEach(item=>item.phase=(item.phase+dt/1900)%1);
    moving.forEach(({circle,route,phase})=>{
      circle.setAttribute('cx',route[0][0]+(route[1][0]-route[0][0])*phase);
      circle.setAttribute('cy',route[0][1]+(route[1][1]-route[0][1])*phase);
    });
    requestAnimationFrame(frame);
  }
  play.addEventListener('click',()=>{playing=!playing;refresh();Studio.event('play',{playing:playing?1:0})});
  document.getElementById('next').addEventListener('click',()=>{
    step=(step+1)%Math.min(p.steps,steps.length);refresh();Studio.event('step',{step:step+1});
  });
  const options=document.getElementById('options');
  p.options.forEach(key=>{
    const b=document.createElement('button');
    b.className='option';b.setAttribute('data-option',key);b.textContent=t(key);
    b.addEventListener('click',()=>Studio.answer(key));
    options.appendChild(b);
  });
  Studio.onVerdict(({correct})=>{
    const old=document.querySelector('.feedback');if(old)old.remove();
    const feedback=document.createElement('div');
    feedback.className='feedback';feedback.textContent=t(correct?'right':'wrong');
    document.querySelector('.card').appendChild(feedback);
    if(correct&&!finished){finished=true;Studio.done()}
  });
  refresh();requestAnimationFrame(frame);Studio.ready();
})();

</script>
