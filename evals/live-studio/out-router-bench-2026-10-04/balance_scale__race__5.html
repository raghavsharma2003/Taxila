<style>
*{box-sizing:border-box}
html,body{margin:0;width:360px;height:320px;overflow:hidden}
body{font-family:system-ui,sans-serif;color:#483d35;background:#fff8ec}
#app{width:360px;height:320px;padding:10px 14px;position:relative;overflow:hidden}
#title{height:27px;text-align:center;font-size:18px;font-weight:800;color:#80552f}
#instr{height:30px;text-align:center;font-size:12px;color:#725f50}
#stage{height:157px;position:relative}
#beam{position:absolute;z-index:2;left:43px;top:38px;width:246px;height:12px;border-radius:9px;background:#b97743;transform-origin:50% 50%;transition:transform .65s cubic-bezier(.2,.8,.25,1);box-shadow:0 3px 0 #8d5835}
#beam:after{content:"";position:absolute;left:118px;top:5px;width:10px;height:10px;border-radius:50%;background:#80552f}
#pivot{position:absolute;left:164px;top:50px;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:45px solid #e5b95b}
.pan{position:absolute;top:82px;width:116px;height:58px;border-bottom:6px solid #bd7d4b;border-radius:0 0 48% 48%;background:#f8e2bd;display:flex;justify-content:center;align-items:flex-end;gap:3px;padding:4px 4px 6px;transition:transform .65s cubic-bezier(.2,.8,.25,1)}
.pan:before{content:"";position:absolute;width:2px;height:26px;top:-32px;background:#9c7959}
#leftPan{left:16px}
#rightPan{right:16px}
.weight{min-width:29px;height:34px;padding:0 4px;border-radius:8px 8px 5px 5px;background:#70b6a0;border:2px solid #478a79;color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #478a79}
#options{height:72px;display:flex;justify-content:center;align-items:center;gap:12px}
.option{width:72px;height:60px;border:0;border-radius:15px;background:#ffe1a5;box-shadow:0 4px 0 #d7a950;color:#664c32;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s,background .2s}
.option .weight{pointer-events:none}
.option:active{transform:scale(.92)}
.option:disabled{opacity:.55;cursor:default}
#message{height:24px;text-align:center;font-size:13px;font-weight:700;color:#80552f}
#stage.celebrate{animation:happy .5s ease-in-out 2}
@keyframes happy{50%{transform:scale(1.035)}}
</style>
<div id="app">
  <div id="title"></div>
  <div id="instr"></div>
  <div id="stage">
    <div id="beam" data-beam data-tilt="level"></div>
    <div id="pivot"></div>
    <div class="pan" id="leftPan" data-pan="left" data-total="0"></div>
    <div class="pan" id="rightPan" data-pan="right" data-total="0"></div>
  </div>
  <div id="options"></div>
  <div id="message"></div>
</div>
<script>

(function(){
  const items=Studio.params.items;
  const title=document.getElementById("title");
  const instr=document.getElementById("instr");
  const stage=document.getElementById("stage");
  const beam=document.getElementById("beam");
  const leftPan=document.getElementById("leftPan");
  const rightPan=document.getElementById("rightPan");
  const optionsBox=document.getElementById("options");
  const message=document.getElementById("message");
  title.textContent=Studio.t("title");
  instr.textContent=Studio.t("instr");
  let index=0,locked=false,pending=null,leftValues=[],rightValues=[];
  function weight(value){
    const el=document.createElement("div");
    el.className="weight";
    el.dataset.weight=String(value);
    el.textContent=String(value);
    return el;
  }
  function updateBalance(){
    const lt=leftValues.reduce((a,b)=>a+b,0);
    const rt=rightValues.reduce((a,b)=>a+b,0);
    leftPan.dataset.total=String(lt);
    rightPan.dataset.total=String(rt);
    const tilt=lt>rt?"left":rt>lt?"right":"level";
    beam.dataset.tilt=tilt;
    beam.style.transform=tilt==="left"?"rotate(-9deg)":tilt==="right"?"rotate(9deg)":"rotate(0deg)";
    leftPan.style.transform=tilt==="left"?"translateY(12px)":tilt==="right"?"translateY(-7px)":"";
    rightPan.style.transform=tilt==="right"?"translateY(12px)":tilt==="left"?"translateY(-7px)":"";
  }
  function addOption(value,optionIndex){
    const button=document.createElement("button");
    button.className="option";
    button.type="button";
    button.dataset.option=String(value);
    button.appendChild(weight(value));
    button.addEventListener("click",function(){
      if(locked)return;
      locked=true;
      pending={value:value,optionIndex:optionIndex};
      button.remove();
      rightValues.push(value);
      rightPan.appendChild(weight(value));
      updateBalance();
      Studio.event("choose",{value:value});
      Studio.answer({value:value});
    });
    return button;
  }
  function drawItem(){
    locked=false;
    pending=null;
    message.textContent="";
    stage.classList.remove("celebrate");
    leftPan.replaceChildren();
    rightPan.replaceChildren();
    optionsBox.replaceChildren();
    const item=items[index];
    leftValues=item.left.slice();
    rightValues=item.right.slice();
    leftValues.forEach(v=>leftPan.appendChild(weight(v)));
    rightValues.forEach(v=>rightPan.appendChild(weight(v)));
    item.options.forEach((value,i)=>optionsBox.appendChild(addOption(value,i)));
    updateBalance();
  }
  Studio.onVerdict(function(verdict){
    if(!pending)return;
    if(verdict.correct){
      message.textContent=Studio.t("right");
      updateBalance();
      stage.classList.add("celebrate");
      window.setTimeout(function(){
        index++;
        if(index>=items.length){
          message.textContent=Studio.t("done");
          Studio.done();
        }else drawItem();
      },900);
    }else{
      message.textContent=Studio.t("wrong");
      window.setTimeout(function(){
        const chosen=pending;
        if(!chosen)return;
        const pos=rightValues.lastIndexOf(chosen.value);
        if(pos>=0)rightValues.splice(pos,1);
        const last=rightPan.lastElementChild;
        if(last)last.remove();
        const buttons=Array.from(optionsBox.children);
        const button=addOption(chosen.value,chosen.optionIndex);
        if(chosen.optionIndex>=buttons.length)optionsBox.appendChild(button);
        else optionsBox.insertBefore(button,buttons[chosen.optionIndex]);
        updateBalance();
        message.textContent="";
        pending=null;
        locked=false;
      },800);
    }
  });
  drawItem();
  Studio.ready();
})();

</script>
