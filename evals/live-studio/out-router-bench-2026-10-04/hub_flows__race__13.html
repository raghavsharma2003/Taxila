<style>
  *{box-sizing:border-box}body{margin:0;width:360px;height:320px;overflow:hidden;background:#fff7df;font-family:Arial,sans-serif;color:#24483d}
  #stage{position:relative;width:360px;height:320px;overflow:hidden;background:linear-gradient(180deg,#fff9e9 0%,#fff1c9 100%)}
  #title{position:absolute;top:6px;left:16px;right:16px;text-align:center;font-size:18px;font-weight:800;color:#315a45;letter-spacing:.2px}
  #scene{position:absolute;left:0;top:24px;width:360px;height:158px;overflow:visible}
  .label{font-size:12px;font-weight:800;fill:#315a45;paint-order:stroke;stroke:#fff9e9;stroke-width:3px;stroke-linejoin:round}
  .flowline{fill:none;stroke-linecap:round;stroke-width:3px;stroke-dasharray:5 6;opacity:.52}
  .waterline{stroke:#438fc0}.co2line{stroke:#8c8069}.o2line{stroke:#e77b54}
  .particle{filter:drop-shadow(0 1px 1px rgba(40,70,50,.2));transition:opacity .25s}
  .water{fill:#52a8dc}.co2{fill:#9b907c}.o2{fill:#f0805b}
  .hub{fill:#69b85b;stroke:#347749;stroke-width:3;transform-origin:center;transition:filter .3s,transform .3s}
  .vein{fill:none;stroke:#d9f09a;stroke-width:2.2;stroke-linecap:round}
  .sun{fill:#ffd45b;stroke:#e9a93e;stroke-width:2.5}.ray{stroke:#e9a93e;stroke-width:3;stroke-linecap:round}
  .root{fill:none;stroke:#a97045;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .rootfine{fill:none;stroke:#c58d5b;stroke-width:2.5;stroke-linecap:round}
  .glow{fill:#fff3a8;opacity:.56}
  .focus{filter:drop-shadow(0 0 6px #f3b84d);transform:scale(1.05)}
  #caption{position:absolute;left:72px;top:187px;width:216px;height:43px;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px 8px;border-radius:16px;background:#fffdf4;color:#315a45;font-size:13px;font-weight:800;box-shadow:0 3px 0 #efdba7;transition:transform .22s,background .22s}
  button{border:0;font-family:inherit;font-weight:800;color:#315a45;cursor:pointer;touch-action:manipulation;transition:transform .14s,filter .14s,background .14s}
  button:active{transform:scale(.91)}button:hover{filter:brightness(1.04)}
  #play{position:absolute;left:10px;top:182px;width:52px;height:52px;border-radius:18px;background:#bce4a9;box-shadow:0 3px 0 #84bd76;font-size:11px}
  #next{position:absolute;right:10px;top:182px;width:52px;height:52px;border-radius:18px;background:#ffd68a;box-shadow:0 3px 0 #e7ae54;font-size:10px}
  #ask{position:absolute;left:10px;right:10px;top:239px;height:24px;text-align:center;font-size:13px;font-weight:800;color:#315a45}
  #options{position:absolute;left:8px;right:8px;top:268px;height:52px;display:flex;gap:8px;justify-content:center}
  .option{height:52px;min-width:52px;flex:1;border-radius:16px;background:#fffdf4;box-shadow:0 3px 0 #e9cb88;font-size:12px;padding:3px 4px}
  .option.wait{transform:scale(.96);background:#e9f4dc}.option.bad{background:#ffe3d7;animation:wobble .35s ease}
  #feedback{position:absolute;top:235px;left:0;right:0;text-align:center;font-size:12px;font-weight:800;color:#b05c44;pointer-events:none;opacity:0;transition:opacity .2s}
  #feedback.show{opacity:1}
  @keyframes wobble{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
</style>
<div id="stage">
  <div id="title"></div>
  <svg id="scene" viewBox="0 0 360 158" aria-hidden="true">
    <path class="flowline waterline" d="M177 151 C177 138 179 125 181 113"></path>
    <path class="flowline co2line" d="M330 104 C284 104 245 104 207 100"></path>
    <path class="flowline o2line" d="M207 77 C245 59 282 47 331 43"></path>

    <circle class="glow" cx="55" cy="44" r="30"></circle>
    <line class="ray" x1="55" y1="9" x2="55" y2="16"></line><line class="ray" x1="55" y1="72" x2="55" y2="79"></line>
    <line class="ray" x1="20" y1="44" x2="27" y2="44"></line><line class="ray" x1="83" y1="44" x2="90" y2="44"></line>
    <line class="ray" x1="30" y1="19" x2="35" y2="24"></line><line class="ray" x1="75" y1="64" x2="80" y2="69"></line>
    <circle id="sunShape" class="sun" cx="55" cy="44" r="18"></circle>

    <path id="leafShape" class="hub" d="M183 54 C145 57 128 82 139 105 C148 125 170 130 185 116 C202 100 208 75 183 54 Z"></path>
    <path class="vein" d="M146 105 C158 95 169 84 184 64 M160 95 L151 84 M166 87 L181 89 M173 78 L167 69"></path>

    <path id="rootShape" class="root" d="M181 117 C181 132 179 143 171 153 M180 134 L160 148 M179 140 L190 154 M171 153 L165 157"></path>
    <path class="rootfine" d="M175 143 L184 147 M168 148 L155 154 M187 148 L199 156"></path>

    <circle class="particle water" data-p="0" r="4"></circle><circle class="particle water" data-p="1" r="4"></circle><circle class="particle water" data-p="2" r="4"></circle>
    <circle class="particle co2" data-p="3" r="4"></circle><circle class="particle co2" data-p="4" r="4"></circle><circle class="particle co2" data-p="5" r="4"></circle>
    <circle class="particle o2" data-p="6" r="4"></circle><circle class="particle o2" data-p="7" r="4"></circle><circle class="particle o2" data-p="8" r="4"></circle>

    <text class="label" data-label="hub" x="145" y="130"></text>
    <text class="label" data-label="entity0" x="18" y="91"></text>
    <text class="label" data-label="entity1" x="202" y="153"></text>
    <text class="label" data-label="flow0" x="104" y="146"></text>
    <text class="label" data-label="flow1" x="268" y="121"></text>
    <text class="label" data-label="flow2" x="274" y="31"></text>
  </svg>

  <button id="play" data-action="play"></button>
  <div id="caption" data-caption></div>
  <button id="next" data-action="next"></button>
  <div id="ask"></div>
  <div id="feedback"></div>
  <div id="options"></div>
</div>
<script>

(function(){
  var p=Studio.params, playing=true, step=0, completed=false, selected=null;
  var title=document.getElementById('title'), play=document.getElementById('play'), caption=document.getElementById('caption');
  var hub=document.getElementById('leafShape'), sun=document.getElementById('sunShape'), roots=document.getElementById('rootShape');
  title.textContent=Studio.t('title');
  hub.setAttribute('data-entity',p.hub);
  sun.setAttribute('data-entity',p.entities[0]);
  roots.setAttribute('data-entity',p.entities[1]);
  document.querySelector('[data-label="hub"]').setAttribute('data-label',p.hub);
  document.querySelector('[data-label="'+p.hub+'"]').textContent=Studio.t(p.hub);
  for(var e=0;e<p.entities.length;e++){
    var el=document.querySelector('[data-label="entity'+e+'"]');
    el.setAttribute('data-label',p.entities[e]);
    el.textContent=Studio.t(p.entities[e]);
  }
  for(var f=0;f<p.flows.length;f++){
    var fl=p.flows[f], lab=document.querySelector('[data-label="flow'+f+'"]');
    lab.setAttribute('data-label',fl.key); lab.textContent=Studio.t(fl.key);
    var dots=document.querySelectorAll('[data-p="'+(f*3)+'"],[data-p="'+(f*3+1)+'"],[data-p="'+(f*3+2)+'"]');
    for(var d=0;d<dots.length;d++)dots[d].setAttribute('data-flow',fl.key);
  }
  function showStep(){
    caption.textContent=Studio.t('step'+(step+1));
    caption.style.transform='scale(.96)';
    setTimeout(function(){caption.style.transform='scale(1)'},90);
    hub.classList.toggle('focus',step===0);
    roots.classList.toggle('focus',step===1);
    sun.classList.toggle('focus',step===2);
  }
  showStep();
  play.textContent=Studio.t('pause');
  play.addEventListener('click',function(){
    playing=!playing; play.textContent=Studio.t(playing?'pause':'play');
    Studio.event('play',{on:playing?1:0});
  });
  document.getElementById('next').textContent=Studio.t('next');
  document.getElementById('next').addEventListener('click',function(){
    step=(step+1)%p.steps; showStep(); Studio.event('step',{n:step+1});
  });
  document.getElementById('ask').textContent=Studio.t('ask');
  var options=document.getElementById('options');
  for(var i=0;i<p.options.length;i++){
    (function(key){
      var b=document.createElement('button');
      b.className='option'; b.setAttribute('data-option',key); b.textContent=Studio.t(key);
      b.addEventListener('click',function(){
        selected=b;
        var all=options.querySelectorAll('button');
        for(var q=0;q<all.length;q++)all[q].classList.remove('wait','bad');
        b.classList.add('wait'); Studio.answer(key); Studio.event('answer',{n:p.options.indexOf(key)});
      });
      options.appendChild(b);
    })(p.options[i]);
  }
  var feedback=document.getElementById('feedback');
  Studio.onVerdict(function(v){
    if(!selected)return;
    selected.classList.remove('wait');
    feedback.classList.add('show');
    if(v.correct){
      feedback.textContent=Studio.t('right');
      if(!completed){completed=true;Studio.done();}
    }else{
      selected.classList.add('bad'); feedback.textContent=Studio.t('wrong');
      setTimeout(function(){selected&&selected.classList.remove('bad');feedback.classList.remove('show')},700);
    }
  });
  var dots=document.querySelectorAll('.particle'), start=performance.now();
  function pos(flow,t){
    if(flow.dir==='up_in')return [177+(t-.5)*5,151-(t*38)];
    if(flow.dir==='out')return [207+t*124,77-t*34];
    return [330-t*123,104-t*4];
  }
  function animate(now){
    if(playing){
      var time=(now-start)/2100;
      for(var j=0;j<dots.length;j++){
        var fi=Math.floor(j/3), flow=p.flows[fi], t=(time+j*.34)%1, xy=pos(flow,t);
        dots[j].setAttribute('cx',xy[0]);dots[j].setAttribute('cy',xy[1]);
      }
    }
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
  Studio.ready();
})();

</script>
