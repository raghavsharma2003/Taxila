<style>
*{box-sizing:border-box}
html,body{margin:0;width:360px;height:320px;overflow:hidden}
body{font-family:system-ui,sans-serif;background:#fff8ed;color:#51392e}
#app{width:360px;height:320px;padding:12px 16px;display:flex;flex-direction:column;align-items:center;gap:7px}
h1{font-size:19px;line-height:24px;margin:0;color:#75452f;text-align:center}
#instruction{font-size:14px;line-height:18px;margin:0;text-align:center;color:#765f50}
#target{font-size:30px;line-height:38px;font-weight:800;color:#a84932;background:#ffead5;border-radius:15px;min-width:76px;text-align:center;padding:0 12px}
#whole{width:100%;height:98px;display:flex;align-items:center;justify-content:center}
svg{width:100%;height:90px;overflow:visible}
.part{fill:#fffdf8;stroke:#b8764e;stroke-width:2;cursor:pointer;transition:fill .2s ease,transform .16s ease,filter .2s ease;transform-box:fill-box;transform-origin:center}
.part:hover{filter:brightness(.97)}
.part:active{transform:scale(.94)}
.part.shaded{fill:#f3a34a}
#check{border:0;border-radius:17px;background:#de704b;color:white;font:700 18px system-ui,sans-serif;min-width:150px;height:56px;padding:0 24px;cursor:pointer;box-shadow:0 4px 0 #b9583b;transition:transform .15s,box-shadow .15s}
#check:active{transform:translateY(3px) scale(.97);box-shadow:0 1px 0 #b9583b}
#feedback{min-height:25px;font-size:15px;line-height:20px;text-align:center;font-weight:700;color:#53865c}
#feedback.wrong{color:#a84932}
#feedback.pop{animation:pop .45s ease}
@keyframes pop{50%{transform:scale(1.16)}}
</style>
<main id="app">
  <h1 id="title"></h1>
  <p id="instruction"></p>
  <div id="target" data-target></div>
  <div id="whole" aria-label="">
    <svg id="parts" viewBox="0 0 320 90" role="group"></svg>
  </div>
  <button id="check" data-action="check" type="button"></button>
  <div id="feedback" aria-live="polite"></div>
</main>
<script>

(()=>{
  const params=Studio.params, items=params.items;
  const title=document.getElementById('title');
  const instruction=document.getElementById('instruction');
  const target=document.getElementById('target');
  const svg=document.getElementById('parts');
  const check=document.getElementById('check');
  const feedback=document.getElementById('feedback');
  title.textContent=Studio.t('title');
  instruction.textContent=Studio.t('instr');
  check.textContent=Studio.t('check');
  let current=0, shades=[];
  function render(){
    if(current>=items.length){
      document.getElementById('app').innerHTML='';
      const end=document.createElement('h1');
      end.textContent=Studio.t('done');
      end.style.cssText='margin:auto;text-align:center;font-size:24px';
      document.getElementById('app').appendChild(end);
      Studio.done();
      return;
    }
    const item=items[current];
    document.getElementById('app').setAttribute('data-item',item.id);
    shades=Array(item.d).fill(false);
    target.textContent=item.n+'/'+item.d;
    feedback.textContent='';
    feedback.className='';
    svg.replaceChildren();
    const gap=item.d>1?3:0, width=(320-gap*(item.d-1))/item.d;
    for(let i=0;i<item.d;i++){
      const shape=document.createElementNS('http://www.w3.org/2000/svg','rect');
      shape.setAttribute('x',String(i*(width+gap)));
      shape.setAttribute('y','14');
      shape.setAttribute('width',String(width));
      shape.setAttribute('height','62');
      shape.setAttribute('rx','7');
      shape.setAttribute('class','part');
      shape.setAttribute('data-part',String(i));
      shape.setAttribute('data-shaded','false');
      shape.addEventListener('click',()=>{
        shades[i]=!shades[i];
        shape.setAttribute('data-shaded',String(shades[i]));
        shape.classList.toggle('shaded',shades[i]);
        shape.classList.remove('pop');
        void shape.getBoundingClientRect();
        shape.classList.add('pop');
        Studio.event('part',{index:i,shaded:shades[i]?'yes':'no'});
      });
      svg.appendChild(shape);
    }
    check.disabled=false;
  }
  check.addEventListener('click',()=>{
    if(check.disabled)return;
    const n=shades.filter(Boolean).length;
    check.disabled=true;
    Studio.answer({n,d:items[current].d});
  });
  Studio.onVerdict(({correct})=>{
    if(correct){
      feedback.textContent=Studio.t('right');
      feedback.className='pop';
      Studio.event('verdict',{result:'right'});
      setTimeout(()=>{current++;render()},850);
    }else{
      feedback.textContent=Studio.t('wrong');
      feedback.className='wrong';
      check.disabled=false;
      Studio.event('verdict',{result:'wrong'});
    }
  });
  render();
  Studio.ready();
})();

</script>
