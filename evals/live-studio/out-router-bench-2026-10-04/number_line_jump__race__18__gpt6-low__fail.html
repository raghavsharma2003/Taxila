<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;font-family:system-ui,sans-serif;background:#fff8ed;color:#503c39}
  .game{width:360px;height:320px;padding:14px 18px;background:radial-gradient(circle at 90% 5%,#ffe4c4 0,transparent 42%),#fff8ed}
  h1{margin:0;font-size:20px;line-height:26px;font-weight:800}
  .prompt{display:flex;align-items:center;gap:12px;height:58px;font-size:14px}
  .target{min-width:58px;padding:5px 12px;border-radius:16px;background:#fff;border:2px solid #f2ba87;text-align:center;font-size:23px;font-weight:800;color:#a4513b}
  .line-wrap{position:relative;height:98px;margin:4px 0 7px}
  .track{position:absolute;left:18px;right:18px;top:44px;height:5px;border-radius:9px;background:#d9a885}
  .ticks{position:absolute;inset:0}
  .tick{position:absolute;top:35px;width:2px;height:20px;transform:translateX(-50%);background:#986d62}
  .tick.major{height:25px;top:32px}
  .tick-label{position:absolute;top:29px;left:50%;transform:translate(-50%,20px);font-size:13px;font-weight:700;white-space:nowrap}
  .marker{position:absolute;top:8px;width:34px;height:34px;margin-left:-17px;border-radius:50% 50% 48% 48%;background:#ea795f;border:3px solid #fff;box-shadow:0 3px 0 #b95648,0 5px 12px #a45b4b45;transition:left .28s cubic-bezier(.2,1.5,.4,1),transform .2s}
  .marker:after{content:"";position:absolute;left:10px;bottom:-8px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:8px solid #ea795f}
  .marker.hop{animation:hop .5s ease-in-out}
  @keyframes hop{50%{transform:translateY(-18px) scale(1.12)}}
  .controls{display:flex;justify-content:space-between;gap:10px}
  button{min-width:72px;height:56px;border:0;border-radius:18px;background:#f6d8b5;color:#503c39;font:800 16px system-ui,sans-serif;box-shadow:0 4px 0 #d5aa84;cursor:pointer;transition:transform .15s,box-shadow .15s}
  button:active{transform:translateY(3px) scale(.96);box-shadow:0 1px 0 #d5aa84}
  button.check{flex:1;background:#77bda4;color:#173e36;box-shadow:0 4px 0 #4a927b}
  button.check:active{box-shadow:0 1px 0 #4a927b}
  button:disabled{opacity:.55;cursor:default}
  .feedback{height:29px;padding-top:9px;text-align:center;font-size:15px;font-weight:800;color:#a4513b}
  .feedback.good{color:#358267}
  .finished{display:none;height:100%;align-items:center;justify-content:center;text-align:center;font-size:26px;font-weight:800;color:#358267}
</style>
<div class="game">
  <div id="play" data-item="">
    <h1 id="title"></h1>
    <div class="prompt"><span id="instr"></span><span class="target" data-target></span></div>
    <div class="line-wrap">
      <div class="track"></div>
      <div class="ticks" id="ticks"></div>
      <div class="marker" data-marker data-value=""></div>
    </div>
    <div class="controls">
      <button type="button" data-action="left"></button>
      <button type="button" data-action="right"></button>
      <button type="button" class="check" data-action="check"></button>
    </div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
  </div>
  <div class="finished" id="finished"></div>
</div>
<script>

(()=>{
  const p=Studio.params, q=s=>document.querySelector(s), round=n=>Math.round(n*1000000)/1000000;
  const count=Math.round((p.max-p.min)/p.step), at=k=>round(p.min+k*p.step);
  const fmt=v=>{
    if(p.format==="fraction"){
      const numerator=Math.round(v*p.den);
      return numerator+"/"+p.den;
    }
    return String(round(v));
  };
  const x=k=>18+324*k/count;
  let item=0,k=Math.max(0,Math.min(count,Math.round((p.start-p.min)/p.step))),waiting=false,complete=false;
  q("#title").textContent=Studio.t("title");
  q("#instr").textContent=Studio.t("instr");
  q('[data-action="left"]').textContent=Studio.t("left");
  q('[data-action="right"]').textContent=Studio.t("right_btn");
  q('[data-action="check"]').textContent=Studio.t("check");
  q("#finished").textContent=Studio.t("done");
  const ticks=q("#ticks");
  for(let i=0;i<=count;i++){
    const tick=document.createElement("div");
    tick.className="tick"+(i%p.labelEvery===0?" major":"");
    tick.dataset.tick=String(at(i));
    tick.style.left=x(i)+"px";
    if(i%p.labelEvery===0){
      const label=document.createElement("span");
      label.className="tick-label";
      label.textContent=fmt(at(i));
      tick.appendChild(label);
    }
    ticks.appendChild(tick);
  }
  const marker=q("[data-marker]");
  function place(){marker.style.left=x(k)+"px";marker.dataset.value=String(at(k))}
  function showItem(){q("#play").dataset.item=String(p.items[item].id);q("[data-target]").textContent=fmt(p.items[item].target);k=Math.max(0,Math.min(count,Math.round((p.start-p.min)/p.step)));place();q("#feedback").textContent="";q("#feedback").classList.remove("good")}
  function lock(v){waiting=v;document.querySelectorAll("button").forEach(b=>b.disabled=v)}
  for(const direction of ["left","right"]){
    q('[data-action="'+direction+'"]').addEventListener("click",()=>{
      if(waiting||complete)return;
      k=Math.max(0,Math.min(count,k+(direction==="left"?-1:1)));
      place();q("#feedback").textContent="";
      Studio.event("move",{direction,value:at(k)});
    });
  }
  q('[data-action="check"]').addEventListener("click",()=>{
    if(waiting||complete)return;
    lock(true);
    Studio.answer({value:at(k)});
  });
  Studio.onVerdict(({correct})=>{
    if(!waiting||complete)return;
    q("#feedback").textContent=Studio.t(correct?"right":"wrong");
    q("#feedback").classList.toggle("good",correct);
    if(!correct){lock(false);return}
    marker.classList.remove("hop");void marker.offsetWidth;marker.classList.add("hop");
    setTimeout(()=>{
      marker.classList.remove("hop");
      item++;
      if(item<p.items.length){showItem();lock(false)}
      else{complete=true;q("#play").style.display="none";q("#finished").style.display="flex";Studio.done()}
    },520);
  });
  showItem();
  Studio.ready();
})();

</script>
