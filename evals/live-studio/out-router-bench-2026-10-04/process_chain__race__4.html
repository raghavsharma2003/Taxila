<style>
  *{box-sizing:border-box}
  #activity{position:relative;width:360px;height:320px;overflow:hidden;background:#fff7e9;color:#493c52;font-family:system-ui,sans-serif}
  #title{position:absolute;top:7px;left:12px;width:336px;text-align:center;font-size:20px;font-weight:800}
  #map{position:absolute;inset:38px 0 99px}
  #paths{position:absolute;inset:0;width:360px;height:183px;overflow:visible}
  .stage{position:absolute;width:140px;height:54px;border:2px solid #dcbea4;border-radius:19px;background:#fffdf7;display:flex;align-items:center;justify-content:center;text-align:center;padding:5px 8px;box-shadow:0 3px 0 #ead9c6;transition:background .25s,box-shadow .25s,transform .25s}
  .stage.glow{background:#ffe1a9;border-color:#ed9968;box-shadow:0 0 0 5px #ffdca987,0 4px 0 #e8ae80;transform:scale(1.035)}
  .stage span{font-size:14px;font-weight:750;line-height:1.1}
  button{border:0;cursor:pointer;font:inherit;font-weight:750;transition:transform .15s,background .2s}
  button:active{transform:scale(.92)}
  #next{position:absolute;left:147px;top:64px;width:66px;height:56px;border-radius:20px;background:#ee8d69;color:#fff;box-shadow:0 4px 0 #c86452;font-size:14px}
  #question{position:absolute;top:219px;left:10px;width:340px;text-align:center;font-size:16px;font-weight:750}
  #feedback{position:absolute;top:242px;left:10px;width:340px;height:18px;text-align:center;font-size:13px;font-weight:750;color:#a44f60}
  #options{position:absolute;top:263px;left:8px;width:344px;display:flex;gap:6px;justify-content:center}
  #options button{min-width:52px;min-height:52px;flex:1;padding:3px;border-radius:15px;background:#dcece1;color:#324c48;font-size:12px;line-height:1.1}
  #options button:active{background:#b5dcc5}
  #token{fill:#e56c67;stroke:#fff;stroke-width:3;filter:drop-shadow(0 2px 2px #a3655b88)}
</style>
<div id="activity">
  <div id="title"></div>
  <div id="map">
    <svg id="paths" viewBox="0 0 360 183" aria-hidden="true">
      <defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#b88070" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
      <g id="arrows"></g>
      <circle id="token" data-token r="9"/>
    </svg>
    <div id="stages"></div>
    <button id="next" data-action="next" type="button"></button>
  </div>
  <div id="question"></div>
  <div id="feedback" aria-live="polite"></div>
  <div id="options"></div>
</div>
<script>

(() => {
  const p=Studio.params, keys=p.stages, root=document.getElementById('activity');
  const stageLayer=document.getElementById('stages'), arrows=document.getElementById('arrows');
  const token=document.getElementById('token'), feedback=document.getElementById('feedback');
  const slots=[[88,42],[272,42],[272,138],[88,138]];
  const positions=keys.map((_,i)=>{
    if(keys.length===3) return [[88,42],[272,42],[180,138]][i];
    return slots[i%4];
  });
  const boxes=[];
  keys.forEach((key,i)=>{
    const box=document.createElement('div'), label=document.createElement('span');
    box.className='stage'; box.dataset.stage=key;
    box.style.left=(positions[i][0]-70)+'px';
    box.style.top=(positions[i][1]-27)+'px';
    label.dataset.label=key; label.textContent=Studio.t(key);
    box.append(label); stageLayer.append(box); boxes.push(box);
  });
  const count=p.cycle?keys.length:keys.length-1;
  for(let i=0;i<count;i++){
    const j=(i+1)%keys.length, a=positions[i], b=positions[j];
    const dx=b[0]-a[0],dy=b[1]-a[1];
    const horizontal=Math.abs(dx)>Math.abs(dy);
    const trim=horizontal?72:29;
    const length=Math.hypot(dx,dy), ux=dx/length,uy=dy/length;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',`M ${a[0]+ux*trim} ${a[1]+uy*trim} L ${b[0]-ux*trim} ${b[1]-uy*trim}`);
    path.setAttribute('fill','none');path.setAttribute('stroke','#b88070');
    path.setAttribute('stroke-width','3');path.setAttribute('stroke-linecap','round');
    path.setAttribute('marker-end','url(#tip)');
    path.setAttribute('data-arrow',keys[i]+'>'+keys[j]);
    arrows.append(path);
  }
  let active=0,moving=false,finished=false;
  function place(x,y){token.setAttribute('cx',x);token.setAttribute('cy',y)}
  function highlight(){
    root.dataset.active=keys[active];
    boxes.forEach((box,i)=>box.classList.toggle('glow',i===active));
  }
  place(...positions[0]);highlight();
  document.getElementById('title').textContent=Studio.t('title');
  document.getElementById('question').textContent=Studio.t('ask')+' '+Studio.t(p.askAfter);
  const next=document.getElementById('next');
  next.textContent=Studio.t('next');
  next.addEventListener('click',()=>{
    if(moving||finished)return;
    if(active===keys.length-1&&!p.cycle)return;
    moving=true;
    const from=positions[active], target=(active+1)%keys.length, to=positions[target];
    const start=performance.now(), duration=650;
    Studio.event('next',{stage:target});
    function frame(now){
      const t=Math.min(1,(now-start)/duration);
      const eased=t<.5?2*t*t:1-2*(1-t)*(1-t);
      place(from[0]+(to[0]-from[0])*eased,from[1]+(to[1]-from[1])*eased);
      if(t<1)requestAnimationFrame(frame);
      else{active=target;highlight();moving=false}
    }
    requestAnimationFrame(frame);
  });
  p.options.forEach(key=>{
    const button=document.createElement('button');
    button.type='button';button.dataset.option=key;button.textContent=Studio.t(key);
    button.addEventListener('click',()=>{
      if(finished)return;
      Studio.event('answer',{option:key});
      Studio.answer(key);
    });
    document.getElementById('options').append(button);
  });
  Studio.onVerdict(({correct})=>{
    feedback.textContent=Studio.t(correct?'right':'wrong');
    if(correct&&!finished){
      finished=true;
      next.disabled=true;
      document.querySelectorAll('#options button').forEach(b=>b.disabled=true);
      Studio.done();
    }
  });
  Studio.ready();
})();

</script>
