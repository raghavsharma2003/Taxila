<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;font-family:system-ui,sans-serif;background:#fff7e9;color:#49382f}
  #game{width:360px;height:320px;padding:12px 14px;position:relative;overflow:hidden;background:radial-gradient(circle at 92% 8%,#ffe2b8 0,#fff7e9 45%)}
  h1{margin:0;text-align:center;font-size:21px;line-height:27px;color:#684334}
  #instruction{height:23px;text-align:center;font-size:13px;color:#806657}
  #cards{height:128px;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:54px;gap:8px;align-content:start;padding-top:5px}
  .card{min-width:0;min-height:52px;border:2px solid #e7ad70;border-radius:16px;background:#fffdf8;color:#543c31;font:700 16px system-ui,sans-serif;box-shadow:0 4px 0 #e8d0b3;cursor:pointer;transition:transform .22s,box-shadow .22s,opacity .22s}
  .card:active,.bin:active{transform:scale(.96)}
  .card[data-selected="true"]{transform:translateY(-7px) rotate(-2deg);box-shadow:0 8px 0 #e8d0b3,0 0 0 5px #ffcf83}
  .card.shake{animation:shake .36s ease}
  @keyframes shake{25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
  #bins{display:flex;gap:10px;height:113px}
  .bin{flex:1;min-width:0;border:2px solid #ccae83;border-radius:19px;background:#f6e9cc;padding:8px 5px;cursor:pointer;text-align:center;transition:transform .2s,background .2s}
  .bin:nth-child(2){background:#e7e7d4;border-color:#aab392}
  .bin.pop{animation:pop .35s ease}
  @keyframes pop{50%{transform:scale(1.045)}}
  .bin-name{display:block;font-weight:750;font-size:15px;line-height:20px}
  .placed{display:flex;flex-wrap:wrap;justify-content:center;align-content:start;gap:4px;margin-top:5px}
  .placed-card{border-radius:9px;background:#fffdf8;border:1px solid #d5b892;padding:3px 6px;font-weight:650;font-size:12px;line-height:17px;animation:arrive .3s ease}
  @keyframes arrive{from{transform:translateY(-12px) scale(.8);opacity:0}to{transform:none;opacity:1}}
  #feedback{height:26px;text-align:center;font-weight:700;font-size:15px;color:#85594a}
  #fly{position:absolute;pointer-events:none;z-index:4;transition:transform .32s ease-in-out,opacity .32s}
</style>
<div id="game">
  <h1 id="title"></h1>
  <div id="instruction"></div>
  <div id="cards"></div>
  <div id="bins"></div>
  <div id="feedback" aria-live="polite"></div>
</div>
<script>

(() => {
  const p=Studio.params, cards=document.getElementById('cards'), bins=document.getElementById('bins');
  const feedback=document.getElementById('feedback'), instruction=document.getElementById('instruction');
  document.getElementById('title').textContent=Studio.t('title');
  instruction.textContent=Studio.t('instr');
  let selected=null, waiting=false, sorted=0;
  const cardNodes=new Map(), binNodes=new Map();
  p.cards.forEach(key=>{
    const el=document.createElement('button');
    el.type='button'; el.className='card'; el.dataset.card=key; el.dataset.selected='false';
    el.textContent=Studio.t(key);
    el.addEventListener('click',()=>{
      if(waiting)return;
      if(selected)selected.dataset.selected='false';
      selected=el; el.dataset.selected='true'; feedback.textContent='';
      Studio.event('pick',{card:key});
    });
    cards.appendChild(el); cardNodes.set(key,el);
  });
  p.bins.forEach(key=>{
    const el=document.createElement('button');
    el.type='button';el.className='bin';el.dataset.bin=key;
    const name=document.createElement('span');name.className='bin-name';name.textContent=Studio.t(key);
    const contents=document.createElement('span');contents.className='placed';
    el.append(name,contents);bins.appendChild(el);binNodes.set(key,el);
    el.addEventListener('click',()=>{
      if(!selected||waiting)return;
      waiting=true;
      Studio.answer({card:selected.dataset.card,bin:key});
    });
  });
  Studio.onVerdict(({correct})=>{
    if(!waiting||!selected)return;
    const el=selected;
    if(correct){
      feedback.textContent=Studio.t('right');
      const bin=binNodes.get(lastBinFromVerdictTarget());
      const chip=document.createElement('span');
      chip.className='placed-card';chip.dataset.placed=bin.dataset.bin;chip.textContent=el.textContent;
      el.remove();bin.querySelector('.placed').appendChild(chip);
      bin.classList.remove('pop');void bin.offsetWidth;bin.classList.add('pop');
      sorted++;
      selected=null;waiting=false;
      if(sorted===p.cards.length){instruction.textContent=Studio.t('done');feedback.textContent='';Studio.done()}
    }else{
      feedback.textContent=Studio.t('wrong');
      el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');
      el.dataset.selected='false';selected=null;waiting=false;
    }
  });
  let targetBin=null;
  function lastBinFromVerdictTarget(){return targetBin}
  bins.addEventListener('click',e=>{
    const bin=e.target.closest('[data-bin]');
    if(bin&&selected&&!waiting)targetBin=bin.dataset.bin;
  },true);
  Studio.ready();
})();

</script>
