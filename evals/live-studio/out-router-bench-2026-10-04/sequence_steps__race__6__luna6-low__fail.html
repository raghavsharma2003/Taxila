<style>
*{box-sizing:border-box}
html,body{width:360px;height:320px;margin:0;overflow:hidden}
body{font-family:system-ui,sans-serif;background:#fff8ed;color:#543e32}
#app{width:360px;height:320px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
h1{font-size:19px;line-height:24px;margin:0;color:#704b35}
#instr{font-size:13px;line-height:17px;margin:0;color:#785f4e}
#track{height:62px;display:flex;gap:6px;align-items:stretch}
.slot{position:relative;flex:1;min-width:0;border:2px dashed #e0b987;border-radius:13px;background:#fffdf8;display:flex;align-items:center;justify-content:center;padding:9px 2px 2px;transition:background .25s,border-color .25s}
.slot:before{content:attr(data-number);position:absolute;top:1px;left:0;right:0;text-align:center;font-size:10px;color:#a67b58}
.slot.filled{border-style:solid;border-color:#8bb69a;background:#edf7ed}
.card{min-height:54px;border:0;border-radius:14px;background:#f4d8aa;color:#543e32;font:600 14px system-ui,sans-serif;padding:7px 9px;box-shadow:0 3px 0 #d5ad7d;cursor:pointer;transition:transform .16s,background .2s,box-shadow .2s;overflow-wrap:anywhere}
.card:active{transform:scale(.96)}
.card:focus-visible{outline:3px solid #79a99a;outline-offset:2px}
#cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#cards .card{width:100%}
.slot .card{width:100%;height:100%;min-height:0;padding:12px 2px 2px;font-size:11px;box-shadow:none;background:#d9edda;cursor:default}
#feedback{min-height:20px;margin:0;text-align:center;font-size:14px;font-weight:600;color:#6a8c66}
.shake{animation:shake .32s ease-in-out}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
<main id="app">
  <h1 id="title"></h1>
  <p id="instr"></p>
  <section id="track" aria-label=""></section>
  <section id="cards"></section>
  <p id="feedback" aria-live="polite"></p>
</main>
<script>

(()=>{const p=Studio.params,keys=p.shown,track=document.getElementById("track"),cards=document.getElementById("cards"),feedback=document.getElementById("feedback");document.getElementById("title").textContent=Studio.t("title");document.getElementById("instr").textContent=Studio.t("instr");const slots=keys.map((_,i)=>{const s=document.createElement("div");s.className="slot";s.dataset.number=String(i+1);track.appendChild(s);return s});keys.forEach(key=>{const b=document.createElement("button");b.type="button";b.className="card";b.dataset.step=key;b.textContent=Studio.t(key);b.addEventListener("click",()=>{if(b.disabled)return;b.disabled=true;Studio.answer({key});Studio.onVerdict(({correct})=>{b.disabled=false;if(correct){const n=slots.findIndex(s=>!s.classList.contains("filled"));if(n>=0){b.dataset.placed=String(n+1);slots[n].classList.add("filled");slots[n].appendChild(b);b.disabled=true;feedback.textContent=Studio.t("right");if(n===keys.length-1){feedback.textContent=Studio.t("done");Studio.done()}}}else{feedback.textContent=Studio.t("wrong");b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake")}})});cards.appendChild(b)});Studio.ready()})();

</script>
