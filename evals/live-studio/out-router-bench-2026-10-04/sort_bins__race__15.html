<style>
*{box-sizing:border-box}
html,body{margin:0;width:360px;height:320px;overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#443b35;background:#fff8ed}
#app{width:360px;height:320px;padding:10px 12px;overflow:hidden;background:radial-gradient(ellipse at 85% 0%,#fff0d4 0,transparent 46%),#fff8ed}
h1{font-size:18px;line-height:22px;margin:0 0 2px;font-weight:800;color:#674a36}
#instr{height:24px;font-size:12px;line-height:16px;color:#806c5c}
#cards{height:112px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:52px 52px;gap:6px 8px;align-content:start}
.card{width:100%;height:52px;border:2px solid #e8d9c8;border-radius:15px;background:linear-gradient(150deg,#fff,#fffaf3);box-shadow:0 3px 0 #e9dbc9,0 5px 9px #745a3515;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:750;color:#604b3c;cursor:pointer;user-select:none;transition:transform .2s,box-shadow .2s,border-color .2s,opacity .2s;touch-action:manipulation}
.card:active,.bin:active{transform:scale(.96)}
.card.selected{transform:translateY(-4px) scale(1.03);border-color:#e5a64e;box-shadow:0 5px 0 #d7913f,0 8px 16px #b8793633;background:#fff3d9}
.card.shake{animation:shake .32s ease}
@keyframes shake{25%{transform:translateX(-5px)}55%{transform:translateX(5px)}80%{transform:translateX(-2px)}}
#feedback{height:22px;text-align:center;font-size:13px;line-height:19px;font-weight:750;color:#43856b}
#feedback.bad{color:#b56a51}
#bins{height:125px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.bin{min-width:0;height:122px;border:2px solid #e4cda9;border-radius:17px;background:#fff4df;box-shadow:0 4px 0 #e2c99f;display:flex;flex-direction:column;align-items:center;cursor:pointer;touch-action:manipulation;overflow:hidden;transition:transform .17s,border-color .17s,background .17s}
.bin:nth-child(2){background:#edf8f4;border-color:#b9ddd0;box-shadow:0 4px 0 #b9ddd0}
.bin:nth-child(3){background:#f2efff;border-color:#cec5eb;box-shadow:0 4px 0 #cec5eb}
.bin:active{transform:scale(.97)}
.binname{width:100%;height:37px;flex:0 0 37px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#71583c;border-bottom:1px solid #ead8bd}
.bin:nth-child(2) .binname{color:#477b68;border-color:#cfe7dd}
.bin:nth-child(3) .binname{color:#6e6396;border-color:#ddd6f1}
.contents{width:100%;padding:4px;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:4px}
.card.placed{width:auto;height:30px;min-width:36px;padding:0 7px;border-width:1px;border-radius:10px;font-size:11px;box-shadow:0 2px 0 #e9dbc9;cursor:default;transform:none;animation:pop .28s ease}
@keyframes pop{from{transform:scale(.7);opacity:.5}to{transform:scale(1);opacity:1}}
#done{display:none;position:absolute;inset:0;background:#fff8edee;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:21px;font-weight:850;color:#537d64}
#done.show{display:flex;animation:pop .3s ease}
.decoration{position:absolute;right:18px;top:8px;width:24px;height:24px;pointer-events:none;opacity:.8}
</style>
<div id="app">
  <svg class="decoration" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1.2 5.1 3.9 7.8 9 9-5.1 1.2-7.8 3.9-9 9-1.2-5.1-3.9-7.8-9-9 5.1-1.2 7.8-3.9 9-9Z" fill="#efc16c"/></svg>
  <h1 id="title"></h1>
  <div id="instr"></div>
  <div id="cards"></div>
  <div id="feedback" aria-live="polite"></div>
  <div id="bins"></div>
  <div id="done"></div>
</div>
<script>

(()=>{
  const p=Studio.params, t=Studio.t;
  const cardsEl=document.getElementById("cards"), binsEl=document.getElementById("bins");
  const feedback=document.getElementById("feedback"), doneEl=document.getElementById("done");
  document.getElementById("title").textContent=t("title");
  document.getElementById("instr").textContent=t("instr");
  const cardNodes=new Map(), binNodes=new Map();
  let selected=null, pending=null, finished=false;
  p.bins.forEach(key=>{
    const bin=document.createElement("div");
    bin.className="bin"; bin.dataset.bin=key;
    const name=document.createElement("div");
    name.className="binname"; name.textContent=t(key);
    const contents=document.createElement("div"); contents.className="contents";
    bin.append(name,contents); binsEl.append(bin);
    binNodes.set(key,{bin,contents});
  });
  p.cards.forEach(key=>{
    const card=document.createElement("div");
    card.className="card"; card.dataset.card=key; card.dataset.selected="false";
    card.textContent=t(key); cardNodes.set(key,card); cardsEl.append(card);
  });
  function clearSelection(){
    if(selected){selected.classList.remove("selected");selected.dataset.selected="false";selected=null;}
  }
  cardsEl.addEventListener("click",e=>{
    const card=e.target.closest("[data-card]");
    if(!card||pending||finished)return;
    if(selected===card){clearSelection();return;}
    clearSelection(); selected=card; card.classList.add("selected"); card.dataset.selected="true";
    Studio.event("card_pick",{card:card.dataset.card});
  });
  binsEl.addEventListener("click",e=>{
    const bin=e.target.closest("[data-bin]");
    if(!bin||!selected||pending||finished)return;
    pending={card:selected,bin:bin.dataset.bin};
    Studio.event("bin_pick",{bin:pending.bin});
    Studio.answer({card:selected.dataset.card,bin:pending.bin});
  });
  Studio.onVerdict(({correct})=>{
    if(!pending)return;
    const {card,bin}=pending; pending=null;
    if(correct){
      feedback.textContent=t("right"); feedback.classList.remove("bad");
      card.classList.remove("selected"); card.removeAttribute("data-card");
      card.dataset.selected="false"; card.dataset.placed=bin; card.classList.add("placed");
      binNodes.get(bin).contents.append(card);
      selected=null;
      Studio.event("sorted",{card:card.textContent,bin});
      if(p.cards.every(key=>!cardNodes.get(key).hasAttribute("data-card"))){
        finished=true; doneEl.textContent=t("done"); doneEl.classList.add("show"); Studio.done();
      }
    }else{
      feedback.textContent=t("wrong"); feedback.classList.add("bad");
      card.classList.remove("selected"); card.dataset.selected="false";
      card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
      selected=null;
    }
  });
  Studio.ready();
})();

</script>
