<style>
*{box-sizing:border-box}
.stage{width:360px;height:320px;overflow:hidden;position:relative;background:#fff8ee;color:#563e35;font-family:system-ui,sans-serif;padding:11px 12px}
h1{font-size:17px;line-height:22px;margin:0 0 4px;font-weight:750;color:#704b38}
.ask{font-size:12px;line-height:16px;margin:0;color:#765d4e}
svg{display:block;width:336px;height:256px;margin-top:2px;overflow:visible}
.grid{stroke:#eadfD1;stroke-width:1}
.axis{stroke:#967865;stroke-width:1.4}
.tick{fill:#745e50;font-size:10px;text-anchor:end}
.axis-title{fill:#704b38;font-size:11px;font-weight:650}
.bar{fill:#e99b52;transform-box:fill-box;transform-origin:center bottom;animation:grow .8s cubic-bezier(.2,.85,.25,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.column{fill:transparent;cursor:pointer}
.column:active{fill:#e99b5225}
.name{fill:#59483e;font-size:9px;font-weight:600;text-anchor:middle;pointer-events:none}
.feedback{position:absolute;left:14px;right:14px;bottom:8px;min-height:25px;border-radius:12px;background:#fff0d9;color:#704b38;padding:4px 9px;font-size:12px;line-height:17px;text-align:center}
.feedback:empty{display:none}
</style>
<div class="stage">
  <h1 id="title"></h1>
  <p class="ask" id="ask"></p>
  <svg id="chart" viewBox="0 0 336 256" role="img"></svg>
  <div class="feedback" id="feedback" aria-live="polite"></div>
</div>
<script>

(()=>{
  const p=Studio.params, data=p.data, svg=document.getElementById("chart");
  const NS="http://www.w3.org/2000/svg";
  const el=(tag,attrs={},text)=>{
    const n=document.createElementNS(NS,tag);
    for(const [k,v] of Object.entries(attrs)) n.setAttribute(k,String(v));
    if(text!==undefined)n.textContent=text;
    return n;
  };
  document.getElementById("title").textContent=Studio.t("title");
  document.getElementById("ask").textContent=Studio.t("ask");
  const left=39,right=330,top=24,base=187,plotH=base-top;
  const maxValue=Math.max(...data.map(d=>d.value));
  const magnitude=Math.pow(10,Math.floor(Math.log10(maxValue||1)));
  const choices=[1,2,5,10].map(v=>v*magnitude);
  const step=choices.find(v=>v>=maxValue/5)||choices[choices.length-1];
  const maxTick=Math.ceil(maxValue/step)*step;
  const scaleMax=Math.max(maxTick,step);
  for(let v=0;v<=maxTick;v+=step){
    const y=base-(v/scaleMax)*plotH;
    svg.append(el("line",{x1:left,y1:y,x2:right,y2:y,class:v===0?"axis":"grid"}));
    svg.append(el("text",{x:left-5,y:y+3.5,class:"tick","data-tick":v},String(v)));
  }
  svg.append(el("line",{x1:left,y1:top,x2:left,y2:base,class:"axis"}));
  const title=el("text",{x:9,y:(top+base)/2,class:"axis-title",transform:`rotate(-90 9 ${(top+base)/2})`},Studio.t("yaxis"));
  svg.append(title);
  const slot=(right-left)/data.length;
  data.forEach((d,i)=>{
    const cx=left+slot*(i+.5), bw=Math.min(34,slot-10);
    const h=(d.value/scaleMax)*plotH, y=base-h;
    const bar=el("rect",{x:cx-bw/2,y,width:bw,height:h,rx:5,class:"bar","data-bar":d.key,"data-value":d.value});
    bar.style.animationDelay=(i*65)+"ms";
    svg.append(bar);
    const hit=el("rect",{x:cx-slot/2,y:top,width:slot,height:base+37-top,class:"column","data-column":d.key});
    hit.addEventListener("click",()=>{if(!finished)Studio.answer(d.key)});
    svg.append(hit);
    svg.append(el("text",{x:cx,y:base+17,class:"name"},Studio.t(d.key)));
  });
  let finished=false,doneSent=false;
  const feedback=document.getElementById("feedback");
  Studio.onVerdict(({correct})=>{
    if(correct){
      finished=true;
      feedback.textContent=Studio.t("right")+" "+Studio.t("done");
      if(!doneSent){doneSent=true;Studio.done()}
    }else{
      feedback.textContent=Studio.t("wrong");
    }
  });
  Studio.ready();
})();

</script>
