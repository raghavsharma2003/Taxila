<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;height:320px;overflow:hidden;font-family:system-ui,sans-serif;background:#fff6e9;color:#513b35}
  #activity{width:360px;height:320px;padding:14px 16px;background:radial-gradient(circle at 92% 4%,#ffe4ba 0 44px,transparent 45px),#fff6e9}
  h1{margin:0;font-size:21px;line-height:27px}
  #instruction{margin:2px 0 10px;font-size:13px;line-height:18px}
  #cards{height:132px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:60px 60px;gap:10px}
  .card{min-width:0;min-height:52px;width:100%;height:60px;border:2px solid #d88f6c;border-radius:16px;background:#fff0d5;color:#513b35;font:700 17px system-ui,sans-serif;box-shadow:0 4px 0 #e9c5a6;cursor:pointer;transition:transform .22s,background .22s,box-shadow .22s}
  .card:active{transform:scale(.94)}
  .card:focus-visible{outline:3px solid #6656a6;outline-offset:2px}
  #track{display:flex;gap:6px;margin-top:12px;height:76px}
  .slot{position:relative;flex:1;min-width:0;height:76px;border:2px dashed #d4bbaa;border-radius:17px;background:#fffaf2}
  .slot .number{position:absolute;top:5px;left:8px;font-size:12px;font-weight:800;color:#906e5e}
  .slot .card{position:absolute;left:4px;top:19px;width:calc(100% - 8px);height:52px;min-height:52px;font-size:12px;padding:2px;border-color:#83aa91;background:#e2f1dc;box-shadow:none;cursor:default;animation:arrive .35s ease-out}
  #message{height:20px;margin-top:5px;text-align:center;font-size:14px;font-weight:700;color:#7a594b}
  .shake{animation:shake .35s ease-in-out}
  @keyframes shake{25%,75%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
  @keyframes arrive{from{transform:translateY(-12px) scale(.85);opacity:.45}to{transform:translateY(0) scale(1);opacity:1}}
</style>
<div id="activity">
  <h1 id="title"></h1>
  <p id="instruction"></p>
  <div id="cards"></div>
  <div id="track"></div>
  <div id="message" aria-live="polite"></div>
</div>
<script>

(()=>{
  const keys=Studio.params.shown;
  const cards=document.getElementById('cards');
  const track=document.getElementById('track');
  const message=document.getElementById('message');
  document.getElementById('title').textContent=Studio.t('title');
  document.getElementById('instruction').textContent=Studio.t('instr');
  let placed=0,pending=null;
  keys.forEach((key,index)=>{
    const slot=document.createElement('div');
    slot.className='slot';
    const number=document.createElement('span');
    number.className='number';
    number.textContent=String(index+1);
    slot.appendChild(number);
    track.appendChild(slot);
    const card=document.createElement('button');
    card.type='button';
    card.className='card';
    card.dataset.step=key;
    card.textContent=Studio.t(key);
    card.addEventListener('click',()=>{
      if(pending!==null||card.dataset.placed)return;
      pending=card;
      Studio.answer({key});
    });
    cards.appendChild(card);
  });
  Studio.onVerdict(({correct})=>{
    if(!pending)return;
    const card=pending;
    pending=null;
    if(correct){
      placed++;
      card.dataset.placed=String(placed);
      card.disabled=true;
      track.children[placed-1].appendChild(card);
      message.textContent=placed===keys.length?Studio.t('done'):Studio.t('right');
      if(placed===keys.length)Studio.done();
    }else{
      message.textContent=Studio.t('wrong');
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
    }
  });
  Studio.ready();
})();

</script>
