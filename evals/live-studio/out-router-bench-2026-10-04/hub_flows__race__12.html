<style>
  *{box-sizing:border-box}body{margin:0;width:360px;height:320px;overflow:hidden;background:#fff7e9;font-family:system-ui,sans-serif;color:#354b3c}#activity{width:360px;height:320px;overflow:hidden;position:relative}h1{height:25px;margin:0;padding:3px 12px 0;font-size:16px;font-weight:750;color:#42614c;white-space:nowrap}svg{display:block;width:360px;height:158px}svg text{font:700 13px system-ui,sans-serif;fill:#354b3c;paint-order:stroke;stroke:#fff7e9;stroke-width:3px;stroke-linejoin:round}.route{fill:none;stroke-width:5;stroke-linecap:round;opacity:.42;transition:opacity .3s,stroke-width .3s}.route.focus{opacity:1;stroke-width:7}.particle{transition:opacity .25s}.controls{height:54px;display:flex;align-items:center;gap:7px;padding:1px 9px}.controls button{height:52px;min-width:65px;border:0;border-radius:17px;background:#e6ad5e;color:#332d22;font:700 14px system-ui,sans-serif;cursor:pointer;transition:transform .16s,background .2s}.controls button:active,.options button:active{transform:scale(.93)}[data-caption]{flex:1;min-width:0;text-align:center;font-size:13px;font-weight:700;line-height:1.15;color:#42614c}#question{height:27px;padding:3px 12px;font-size:14px;font-weight:700;white-space:nowrap}.options{height:56px;display:flex;gap:7px;padding:1px 9px 2px}.options button{flex:1;min-width:0;height:52px;border:2px solid #80af91;border-radius:16px;background:#e5f2df;color:#314c3c;font:700 14px system-ui,sans-serif;cursor:pointer;transition:transform .16s,background .2s}.options button.chosen{background:#b9dfbc}
</style>
<div id="activity">
  <h1 id="title"></h1>
  <svg viewBox="0 0 360 170" preserveAspectRatio="none" aria-hidden="true">
    <path id="sunRay" d="M59 43 Q105 50 143 65" class="route" stroke="#eebc55"/>
    <path id="waterRoute" d="M158 130 Q165 108 174 86" class="route" stroke="#65a9c2"/>
    <path id="co2Route" d="M307 102 Q257 91 210 79" class="route" stroke="#aaa0c9"/>
    <path id="o2Route" d="M208 59 Q257 40 307 40" class="route" stroke="#89c5ab"/>
    <circle id="sunShape" cx="42" cy="35" r="24" fill="#f7c869" stroke="#e7a848" stroke-width="3"/>
    <path id="rootShape" d="M166 125 Q166 137 151 145 M166 134 Q176 141 184 151 M166 136 Q166 149 163 155 M166 125 L166 119" fill="none" stroke="#936a54" stroke-width="7" stroke-linecap="round"/>
    <path id="leafShape" d="M140 77 Q153 31 211 58 Q215 105 171 105 Q149 100 140 77Z" fill="#8cc88e" stroke="#539d72" stroke-width="4"/>
    <path d="M149 82 Q176 72 203 63" fill="none" stroke="#579e72" stroke-width="2"/>
    <g id="particles"></g>
    <text id="sunLabel" x="13" y="77"></text>
    <text id="leafLabel" x="148" y="29"></text>
    <text id="rootLabel" x="104" y="165"></text>
    <text id="waterLabel" x="78" y="115"></text>
    <text id="co2Label" x="262" y="125"></text>
    <text id="o2Label" x="266" y="28"></text>
  </svg>
  <div class="controls"><button type="button" data-action="play"></button><div data-caption></div><button type="button" data-action="next"></button></div>
  <div id="question"></div>
  <div class="options" id="options"></div>
</div>
<script>

(()=>{
  const p=Studio.params, $=s=>document.querySelector(s), svgNS="http://www.w3.org/2000/svg";
  const labels=[
    [$("#leafShape"),$("#leafLabel"),p.hub],
    [$("#sunShape"),$("#sunLabel"),p.entities[0]],
    [$("#rootShape"),$("#rootLabel"),p.entities[1]]
  ];
  labels.forEach(([shape,label,key])=>{shape.setAttribute("data-entity",key);label.setAttribute("data-label",key);label.textContent=Studio.t(key)});
  const routes=[$("#waterRoute"),$("#co2Route"),$("#o2Route")];
  const flowLabels=[$("#waterLabel"),$("#co2Label"),$("#o2Label")];
  const paths=[
    {a:[158,130],b:[174,86],color:"#53a7c4"},
    {a:[307,102],b:[210,79],color:"#9285b5"},
    {a:[208,59],b:[307,40],color:"#67b69a"}
  ];
  const dots=[];
  p.flows.forEach((flow,i)=>{
    flowLabels[i].setAttribute("data-label",flow.key);
    flowLabels[i].textContent=Studio.t(flow.key);
    for(let j=0;j<4;j++){
      const dot=document.createElementNS(svgNS,"circle");
      dot.setAttribute("data-flow",flow.key);
      dot.setAttribute("r",j%2?4:5);
      dot.setAttribute("fill",paths[i].color);
      $("#particles").appendChild(dot);
      dots.push({dot,i,j});
    }
  });
  $("#title").textContent=Studio.t("title");
  $("#question").textContent=Studio.t("ask");
  const play=$('[data-action="play"]'), next=$('[data-action="next"]'), caption=$("[data-caption]");
  let playing=true,step=0,phase=0,last=0,finished=false;
  function display(){
    play.textContent=Studio.t(playing?"pause":"play");
    next.textContent=Studio.t("next");
    caption.textContent=Studio.t("step"+(step+1));
    routes.forEach((route,i)=>route.classList.toggle("focus",step===i+1));
    $("#sunRay").classList.toggle("focus",step===0);
  }
  display();
  play.addEventListener("click",()=>{playing=!playing;display();Studio.event("play",{on:playing?1:0})});
  next.addEventListener("click",()=>{step=(step+1)%p.steps;display();Studio.event("step",{number:step+1})});
  p.options.forEach(key=>{
    const button=document.createElement("button");
    button.type="button";button.setAttribute("data-option",key);button.textContent=Studio.t(key);
    button.addEventListener("click",()=>{if(finished)return;document.querySelectorAll(".options button").forEach(b=>b.classList.remove("chosen"));button.classList.add("chosen");Studio.answer(key)});
    $("#options").appendChild(button);
  });
  Studio.onVerdict(({correct})=>{
    $("#question").textContent=Studio.t(correct?"right":"wrong");
    if(correct&&!finished){finished=true;Studio.done()}
    else if(!correct){setTimeout(()=>{$("#question").textContent=Studio.t("ask")},1300)}
  });
  function animate(time){
    if(last&&playing)phase+=(time-last)*.00034;
    last=time;
    dots.forEach(({dot,i,j})=>{
      const v=(phase+j/4)%1,{a,b}=paths[i];
      dot.setAttribute("cx",a[0]+(b[0]-a[0])*v);
      dot.setAttribute("cy",a[1]+(b[1]-a[1])*v);
      dot.style.opacity=(.45+.5*Math.sin(Math.PI*v)).toFixed(2);
    });
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
  Studio.ready();
})();

</script>
