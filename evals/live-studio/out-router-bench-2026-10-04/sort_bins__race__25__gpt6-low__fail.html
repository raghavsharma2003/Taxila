<style>
  *{box-sizing:border-box}
  html,body{width:360px;height:320px;margin:0;overflow:hidden}
  #game{width:360px;height:320px;overflow:hidden;position:relative;background:#fff7e9;color:#493b35;font-family:system-ui,sans-serif;padding:12px}
  #heading{height:45px;text-align:center}
  #title{font-size:19px;font-weight:800;line-height:23px}
  #hint{font-size:12px;line-height:18px;color:#79685e}
  #cards{height:116px;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,54px);gap:6px 10px;padding:0 14px}
  .card{min-width:0;min-height:52px;border:2px solid #e9b985;border-radius:16px;background:#ffdfad;color:#493b35;font:700 16px system-ui,sans-serif;box-shadow:0 4px 0 #cf9e70;cursor:pointer;transition:transform .22s,box-shadow .22s,background .22s;touch-action:manipulation}
  .card:active,.bin:active{transform:scale(.96)}
  .card[data-selected="true"]{transform:translateY(-5px) scale(1.04);background:#ffe9bd;box-shadow:0 7px 0 #cf9e70,0 0 0 4px #f8cf82}
  #bins{height:119px;display:flex;gap:7px;margin-top:8px}
  .bin{flex:1;min-width:0;min-height:119px;border:2px solid #b9d1c2;border-radius:18px;background:#e8f2e8;display:flex;flex-direction:column;align-items:center;padding:7px 3px;cursor:pointer;transition:transform .2s,background .2s;touch-action:manipulation}
  .bin:hover{background:#dff0df}
  .bin-name{font-size:13px;font-weight:800;line-height:20px;white-space:nowrap}
  .contents{width:100%;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:4px;margin-top:4px}
  .placed{min-width:52px;min-height:52px;max-width:100%;padding:3px 5px;border-radius:12px;background:#ffdfad;border:2px solid #e9b985;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;animation:arrive .42s ease-out both}
  #message{height:20px;text-align:center;font-size:13px;font-weight:700;line-height:20px;color:#6b7f65}
  .shake{animation:shake .35s ease-in-out}
  @keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
  @keyframes arrive{from{opacity:.4;transform:translate(var(--from-x),var(--from-y)) scale(1.12)}to{opacity:1;transform:translate(0,0) scale(1)}}
</style>
<div id="game">
  <div id="heading"><div id="title"></div><div id="hint"></div></div>
  <div id="cards"></div>
  <div id="bins"></div>
  <div id="message" aria-live="polite"></div>
</div>
<script>

(() => {
  const t = key => Studio.t(key);
  const cards = document.getElementById('cards');
  const bins = document.getElementById('bins');
  const message = document.getElementById('message');
  document.getElementById('title').textContent = t('title');
  document.getElementById('hint').textContent = t('instr');
  let selected = null;
  let pending = null;
  let sorted = 0;

  Studio.params.bins.forEach(key => {
    const bin = document.createElement('div');
    bin.className = 'bin';
    bin.dataset.bin = key;
    const name = document.createElement('div');
    name.className = 'bin-name';
    name.textContent = t(key);
    const contents = document.createElement('div');
    contents.className = 'contents';
    bin.append(name, contents);
    bin.addEventListener('click', () => {
      if (!selected || pending) return;
      pending = {card: selected, bin: key, element: bin};
      Studio.event('sort', {card: selected.dataset.card, bin: key});
      Studio.answer({card: selected.dataset.card, bin: key});
    });
    bins.append(bin);
  });

  Studio.params.cards.forEach(key => {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'card';
    card.dataset.card = key;
    card.dataset.selected = 'false';
    card.textContent = t(key);
    card.addEventListener('click', () => {
      if (pending) return;
      if (selected) selected.dataset.selected = 'false';
      selected = card;
      card.dataset.selected = 'true';
      message.textContent = '';
      Studio.event('pick', {card: key});
    });
    cards.append(card);
  });

  Studio.onVerdict(({correct}) => {
    if (!pending) return;
    const {card, bin, element} = pending;
    pending = null;
    selected = null;
    card.dataset.selected = 'false';
    if (correct) {
      const start = card.getBoundingClientRect();
      const placed = document.createElement('div');
      placed.className = 'placed';
      placed.dataset.placed = bin;
      placed.textContent = card.textContent;
      element.querySelector('.contents').append(placed);
      const end = placed.getBoundingClientRect();
      placed.style.setProperty('--from-x', `${start.left - end.left}px`);
      placed.style.setProperty('--from-y', `${start.top - end.top}px`);
      card.remove();
      sorted += 1;
      message.textContent = sorted === Studio.params.cards.length ? t('done') : t('right');
      if (sorted === Studio.params.cards.length) Studio.done();
    } else {
      message.textContent = t('wrong');
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
      card.addEventListener('animationend', () => card.classList.remove('shake'), {once:true});
    }
  });
  Studio.ready();
})();

</script>
