<style>
  :root { --bg:#FFF8E7; --accent:#FF9F1C; --stroke:#E85D04; --green:#4CAF50; }
  .container { width:360px; height:640px; margin:0 auto; background:#FFF8E7; font-family:system-ui,-apple-system,sans-serif; display:flex; flex-direction:column; padding:16px; box-sizing:border-box; }
  h1 { font-size:28px; margin:0 0 8px; color:#5D4037; text-align:center; }
  .instr { font-size:18px; color:#5D4037; text-align:center; margin-bottom:12px; line-height:1.3; }
  .frac-display { font-size:42px; font-weight:700; color:#E85D04; text-align:center; margin:12px 0 16px; letter-spacing:2px; }
  .visual { display:flex; justify-content:center; margin:12px 0; }
  .visual svg { border-radius:16px; box-shadow:0 4px 12px rgba(232,93,4,.15); background:#FFF; }
  .visual rect { transition:fill .2s ease, transform .1s ease; }
  .visual rect:active { transform:scale(0.96); }
  .feedback { min-height:48px; font-size:20px; font-weight:600; text-align:center; margin:8px 0; padding:8px; }
  button[data-action="check"] { width:100%; height:60px; background:#FF6B35; color:white; border:none; border-radius:30px; font-size:22px; font-weight:700; margin-top:auto; box-shadow:0 6px 0 #E85D04; transition:transform .1s ease; }
  button[data-action="check"]:active { transform:translateY(3px); box-shadow:0 3px 0 #E85D04; }
  .done { display:flex; align-items:center; justify-content:center; height:100%; font-size:28px; color:#5D4037; text-align:center; }
</style>
<div class="container">
  <h1 data-key="title"></h1>
  <p class="instr" data-key="instr"></p>
  <div class="frac-display"><span id="numer"></span>/<span id="denom"></span></div>
  <div class="visual" data-item="i1">
    <svg width="352" height="140" viewBox="0 0 352 140">
      <rect data-part="0" data-shaded="false" x="0" y="10" width="88" height="120" fill="#FFF8E7" stroke="#E85D04" stroke-width="3"/>
      <rect data-part="1" data-shaded="false" x="88" y="10" width="88" height="120" fill="#FFF8E7" stroke="#E85D04" stroke-width="3"/>
      <rect data-part="2" data-shaded="false" x="176" y="10" width="88" height="120" fill="#FFF8E7" stroke="#E85D04" stroke-width="3"/>
      <rect data-part="3" data-shaded="false" x="264" y="10" width="88" height="120" fill="#FFF8E7" stroke="#E85D04" stroke-width="3"/>
    </svg>
  </div>
  <div class="feedback"></div>
  <button data-action="check"></button>
</div>
<script>
const params=Studio.params;let idx=0;let item=params.items[0];
function setText(k){const el=document.querySelector(`[data-key="${k}"]`);if(el)el.textContent=Studio.t(k);}
function initTexts(){["title","instr","check"].forEach(setText);}
function makeSVG(d){const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("width","352");svg.setAttribute("height","140");svg.setAttribute("viewBox","0 0 352 140");const w=352/d;for(let i=0;i<d;i++){const r=document.createElementNS("http://www.w3.org/2000/svg","rect");r.setAttribute("x",i*w);r.setAttribute("y","10");r.setAttribute("width",w);r.setAttribute("height","120");r.setAttribute("fill","#FFF8E7");r.setAttribute("stroke","#E85D04");r.setAttribute("stroke-width","3");r.setAttribute("data-part",i);r.setAttribute("data-shaded","false");r.style.cursor="pointer";r.addEventListener("click",()=>toggle(r));svg.appendChild(r);}return svg;}
function setup(it){const v=document.querySelector(".visual");v.innerHTML="";v.dataset.item=it.id;v.appendChild(makeSVG(it.d));document.getElementById("numer").textContent=it.n;document.getElementById("denom").textContent=it.d;document.querySelector(".feedback").textContent="";}
function toggle(r){const sh=r.getAttribute("data-shaded")==="true";const ns=!sh;r.setAttribute("data-shaded",ns);r.setAttribute("fill",ns?"#FF9F1C":"#FFF8E7");}
function countShaded(){let c=0;document.querySelectorAll(".visual rect[data-part]").forEach(r=>{if(r.getAttribute("data-shaded")==="true")c++;});return c;}
function check(){const n=countShaded();const d=item.d;Studio.event("check",{n,d});Studio.answer({n,d});}
function celebrate(cb){const v=document.querySelector(".visual svg");if(v){v.style.transition="transform .25s";v.style.transform="scale(1.12)";setTimeout(()=>{v.style.transform="scale(1)";setTimeout(cb,300)},600)}else cb();}
function next(){idx++;if(idx>=params.items.length){done();}else{item=params.items[idx];setup(item);}}
function showVerdict(ok){const fb=document.querySelector(".feedback");if(ok){fb.style.color="var(--green)";fb.textContent=Studio.t("right");celebrate(()=>{fb.textContent="";next();});}else{fb.style.color="#D32F2F";fb.textContent=Studio.t("wrong");setTimeout(()=>{if(fb.textContent===Studio.t("wrong"))fb.textContent=Studio.t("hint");},1400);}}
function done(){const c=document.querySelector(".container");c.innerHTML=`<div class="done"><div><p data-key="done"></p></div></div>`;setText("done");Studio.done();}
document.querySelector('[data-action="check"]').addEventListener("click",check);
Studio.onVerdict(showVerdict);
initTexts();setup(item);Studio.ready();
</script>
