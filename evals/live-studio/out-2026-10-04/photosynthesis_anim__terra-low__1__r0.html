<style>
  *{box-sizing:border-box}
  :root{--sky:#dff5ff;--deep:#17465a;--leaf:#47a85a;--leaf2:#83cf68;--soil:#8d5941;--sun:#ffc943;--water:#3d9ee8;--co:#78869b;--oxy:#77cddd;--glow:#ffe66d;--card:#ffffff}
  body{margin:0;background:linear-gradient(180deg,#ccefff 0%,#edfaff 62%,#ffeecb 100%);font-family:system-ui,sans-serif;color:var(--deep);overflow:hidden}
  #app{width:100%;height:100vh;max-width:520px;margin:auto;padding:12px 14px 10px;display:flex;flex-direction:column;gap:8px}
  h1{font-size:clamp(20px,6vw,27px);line-height:1.1;text-align:center;margin:1px 0 0;color:#17465a}
  #sceneWrap{position:relative;flex:1;min-height:300px;max-height:440px;background:rgba(255,255,255,.55);border:3px solid rgba(255,255,255,.8);border-radius:27px;overflow:hidden;box-shadow:0 7px 20px rgba(41,112,135,.14)}
  svg{width:100%;height:100%;display:block}
  .label{font-size:13px;font-weight:800;fill:#17465a;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
  .ray{stroke:#ffd452;stroke-width:5;stroke-linecap:round;opacity:.65;transition:opacity .4s}
  .particle{transition:transform .65s cubic-bezier(.36,.02,.2,1),opacity .35s;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
  .waterP{fill:var(--water)}.coP{fill:var(--co)}.oP{fill:var(--oxy)}
  #glucoseGlow{transition:opacity .35s,transform .35s;transform-origin:205px 173px}
  .focus{transition:opacity .35s}
  .muted{opacity:.18}
  #controls{display:flex;gap:8px;justify-content:center;align-items:center;min-height:48px}
  button{border:0;font:inherit;font-weight:800;color:var(--deep);background:#fff;box-shadow:0 3px 0 rgba(20,66,83,.17),0 4px 13px rgba(29,102,123,.12);cursor:pointer;transition:transform .13s,background .2s,box-shadow .13s;touch-action:manipulation}
  button:active{transform:scale(.91);box-shadow:0 1px 0 rgba(20,66,83,.15)}
  #play{min-width:92px;height:46px;padding:0 13px;border-radius:15px;background:#ffe275}
  #steps{display:flex;gap:7px}
  .step{width:44px;height:44px;border-radius:50%;font-size:17px}
  .step.active{background:var(--leaf);color:white;transform:translateY(-2px);box-shadow:0 5px 0 #2c7e41,0 7px 13px rgba(29,102,72,.19)}
  #caption{min-height:48px;margin:0;border-radius:16px;background:rgba(255,255,255,.9);padding:11px 14px;text-align:center;font-size:15px;font-weight:750;line-height:1.35;box-shadow:0 3px 11px rgba(35,94,110,.09);transition:transform .25s,background .25s}
  #caption.bump{transform:scale(1.025);background:#fff7c8}
  #question{display:none;background:#fff;border-radius:19px;padding:10px;box-shadow:0 3px 13px rgba(35,94,110,.13);text-align:center}
  #ask{font-weight:800;font-size:15px;margin:0 0 8px}
  #options{display:flex;justify-content:center;gap:8px}
  .option{min-width:76px;height:44px;border-radius:14px;padding:0 11px;background:#e7f8fc}
  .option.wait{opacity:.55;pointer-events:none}
  .option.good{background:#9de4a7;transform:scale(1.04)}
  .option.retry{background:#ffd7cf;animation:shake .34s ease-in-out}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  @keyframes twinkle{50%{opacity:.4;transform:scale(.85)}}
  .spark{animation:twinkle 1.4s infinite}
</style>

<div id="app">
  <h1 id="title"></h1>
  <div id="sceneWrap">
    <svg viewBox="0 0 340 390" role="img">
      <defs>
        <linearGradient id="leafFill" x1="0" x2="1"><stop stop-color="#8bd76b"/><stop offset="1" stop-color="#339f57"/></linearGradient>
        <linearGradient id="stemFill" x1="0" x2="1"><stop stop-color="#4ca95b"/><stop offset="1" stop-color="#267f48"/></linearGradient>
      </defs>
      <circle cx="57" cy="55" r="29" fill="#ffc943"/>
      <g id="rays">
        <line class="ray" x1="82" y1="76" x2="165" y2="143"/>
        <line class="ray" x1="70" y1="83" x2="145" y2="166"/>
        <line class="ray" x1="91" y1="60" x2="171" y2="116"/>
      </g>
      <text class="label" data-label="sun" x="33" y="104"></text>
      <path d="M0 302 Q50 286 101 301 T205 296 T340 302 L340 390 L0 390Z" fill="#8d5941"/>
      <path d="M0 306 Q56 292 103 306 T208 301 T340 307" fill="none" stroke="#6d412e" stroke-width="7"/>
      <path d="M196 304 C196 264 198 216 199 180" fill="none" stroke="url(#stemFill)" stroke-width="13" stroke-linecap="round"/>
      <g data-entity="roots" id="roots">
        <path d="M197 296 C180 317 167 335 154 359 M198 301 C211 321 221 338 240 356 M193 303 C184 327 182 345 176 371 M202 303 C209 330 211 351 214 373" fill="none" stroke="#f4d18a" stroke-width="6" stroke-linecap="round"/>
      </g>
      <text class="label" data-label="roots" x="226" y="350"></text>
      <g data-entity="leaf" id="leaf">
        <path d="M198 185 C203 116 267 102 299 126 C285 192 238 211 198 185Z" fill="url(#leafFill)" stroke="#267f48" stroke-width="3"/>
        <path d="M204 181 Q241 158 284 132 M235 164 L239 186 M251 153 L258 174" fill="none" stroke="#d6f28c" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <text class="label" data-label="leaf" x="267" y="213"></text>
      <g id="glucoseGlow">
        <circle cx="236" cy="163" r="22" fill="#ffe66d" opacity=".4"/>
        <circle class="spark" cx="236" cy="163" r="9" fill="#ffcf35"/>
        <path d="M232 160h8m-4-4v8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      </g>
      <text class="label" data-label="glucose" x="220" y="108"></text>
      <g id="waterFlow">
        <circle class="particle waterP" data-flow="water" cx="188" cy="331" r="5"/>
        <circle class="particle waterP" data-flow="water" cx="202" cy="351" r="5"/>
        <circle class="particle waterP" data-flow="water" cx="211" cy="321" r="5"/>
      </g>
      <text class="label" data-label="water" x="87" y="334"></text>
      <g id="co2Flow">
        <circle class="particle coP" data-flow="co2" cx="323" cy="139" r="5"/>
        <circle class="particle coP" data-flow="co2" cx="315" cy="165" r="5"/>
        <circle class="particle coP" data-flow="co2" cx="323" cy="190" r="5"/>
      </g>
      <text class="label" data-label="co2" x="294" y="109"></text>
      <g id="o2Flow">
        <circle class="particle oP" data-flow="o2" cx="175" cy="139" r="5"/>
        <circle class="particle oP" data-flow="o2" cx="151" cy="120" r="5"/>
        <circle class="particle oP" data-flow="o2" cx="127" cy="101" r="5"/>
      </g>
      <text class="label" data-label="o2" x="92" y="130"></text>
    </svg>
  </div>
  <div id="controls">
    <button id="play" data-action="play"></button>
    <div id="steps">
      <button class="step" data-action="step-1"></button>
      <button class="step" data-action="step-2"></button>
      <button class="step" data-action="step-3"></button>
      <button class="step" data-action="step-4"></button>
      <button class="step" data-action="step-5"></button>
    </div>
  </div>
  <p id="caption" data-caption></p>
  <div id="question">
    <p id="ask"></p>
    <div id="options">
      <button class="option" data-option="co2"></button>
      <button class="option" data-option="o2"></button>
      <button class="option" data-option="water"></button>
    </div>
  </div>
</div>

<script>
(function(){
  var P=Studio.params, playing=true, step=1, tick=0, locked=false;
  var title=document.getElementById('title'), play=document.getElementById('play');
  var cap=document.getElementById('caption'), question=document.getElementById('question');
  var glow=document.getElementById('glucoseGlow'), rays=document.getElementById('rays');
  var water=[].slice.call(document.querySelectorAll('[data-flow="water"]'));
  var co2=[].slice.call(document.querySelectorAll('[data-flow="co2"]'));
  var o2=[].slice.call(document.querySelectorAll('[data-flow="o2"]'));
  var steps=[].slice.call(document.querySelectorAll('.step'));
  title.textContent=Studio.t('title');
  document.querySelectorAll('[data-label]').forEach(function(x){x.textContent=Studio.t(x.getAttribute('data-label'));});
  document.getElementById('ask').textContent=Studio.t('ask');
  document.querySelectorAll('[data-option]').forEach(function(x){x.textContent=Studio.t(x.getAttribute('data-option'));});
  steps.forEach(function(b,i){b.textContent=String(i+1);});
  function setVisual(){
    play.textContent=Studio.t(playing?'pause':'play');
    cap.textContent=Studio.t('step'+step);
    cap.classList.remove('bump'); void cap.offsetWidth; cap.classList.add('bump');
    steps.forEach(function(b,i){b.classList.toggle('active',i===step-1);});
    var active=step;
    document.getElementById('waterFlow').classList.toggle('muted',active!==2);
    document.getElementById('co2Flow').classList.toggle('muted',active!==3);
    document.getElementById('o2Flow').classList.toggle('muted',active!==4);
    glow.classList.toggle('muted',active!==5);
    rays.classList.toggle('muted',active!==1);
  }
  function move(){
    if(playing){
      tick++;
      water.forEach(function(p,i){p.setAttribute('transform','translate('+(Math.sin((tick+i*5)/8)*4)+','+(-((tick*3+i*35)%154))+')');});
      co2.forEach(function(p,i){p.setAttribute('transform','translate('+(-((tick*3+i*38)%105))+','+(Math.sin((tick+i*4)/7)*5)+')');});
      o2.forEach(function(p,i){p.setAttribute('transform','translate('+(-((tick*3+i*36)%111))+','+(-((tick*2+i*21)%49))+')');});
      glow.style.transform='scale('+(1+Math.sin(tick/7)*.09)+')';
    }
    requestAnimationFrame(move);
  }
  play.addEventListener('click',function(){playing=!playing;setVisual();Studio.event('play',{playing:playing});});
  steps.forEach(function(b,i){b.addEventListener('click',function(){
    step=i+1; playing=true; setVisual(); Studio.event('step',{step:step});
    if(step===P.steps){question.style.display='block';}
  });});
  document.querySelectorAll('[data-option]').forEach(function(b){
    b.addEventListener('click',function(){
      if(locked)return;
      locked=true;
      document.querySelectorAll('.option').forEach(function(x){x.classList.add('wait');});
      Studio.event('answer',{option:b.getAttribute('data-option')});
      Studio.answer(b.getAttribute('data-option'));
    });
  });
  Studio.onVerdict(function(v){
    var chosen=document.querySelector('.option.wait');
    if(chosen)chosen.classList.add(v.correct?'good':'retry');
    if(v.correct){Studio.done();}
    else{locked=false;setTimeout(function(){document.querySelectorAll('.option').forEach(function(x){x.classList.remove('wait','retry');});},500);}
  });
  setVisual(); move(); Studio.ready();
}());
</script>
