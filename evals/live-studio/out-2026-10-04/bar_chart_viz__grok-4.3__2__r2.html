<style>
.main{background:#FFF8E1;border-radius:24px;padding:12px 8px;box-sizing:border-box;box-shadow:0 8px 24px rgba(0,0,0,0.1);width:360px;height:640px;margin:0 auto;font-family:system-ui;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.title{font-size:22px;font-weight:700;color:#E65100;text-align:center;margin:2px 0}
.ask{font-size:16px;color:#5D4037;text-align:center;padding:0 6px;line-height:1.3}
#chart{background:#E8F5E9;border-radius:16px;box-shadow:inset 0 2px 8px rgba(0,0,0,0.06)}
.bar{transition:all 820ms cubic-bezier(0.34,1.56,0.64,1),transform 140ms ease;transform-origin:bottom;cursor:pointer}
.bar:active{transform:scale(1.06)}
.tick-label{font-size:11px;fill:#5D4037;font-weight:600}
.fruit-label{font-size:13px;fill:#3E2723;font-weight:600}
.grid{stroke:#A5D6A7;stroke-width:1.6}
.axis{stroke:#66BB6A;stroke-width:3}
.feedback{font-size:17px;font-weight:700;text-align:center;padding:5px;border-radius:12px;min-height:30px}
.feedback.correct{color:#2E7D32;background:#C8E6C9}
.feedback.wrong{color:#C62828;background:#FFCDD2}
#done{font-size:19px;font-weight:700;color:#1565C0;text-align:center;margin-top:6px}
</style>
<div class="main">
<div class="title" id="title"></div>
<div class="ask" id="ask"></div>
<svg id="chart" width="344" height="450" viewBox="0 0 344 450"></svg>
<div class="feedback" id="feedback"></div>
<div id="done"></div>
</div>
<script>
const params=Studio.params;
const data=params.data;
const svg=document.getElementById('chart');
const barFill='#FF8F00';
const baselineY=350;
const chartTop=50;
const maxTick=12;
const unit=25;
const leftX=55;
const barW=46;
const gap=10;
const startX=leftX+18;
function make(el,attrs){
  const n=document.createElementNS('http://www.w3.org/2000/svg',el);
  for(const k in attrs)n.setAttribute(k,attrs[k]);
  return n;
}
const axis=make('line',{x1:leftX-8,y1:chartTop-4,x2:leftX-8,y2:baselineY+6,class:'axis'});
svg.appendChild(axis);
const base=make('line',{x1:leftX-14,y1:baselineY+2,x2:328,y2:baselineY+2,class:'axis'});
svg.appendChild(base);
const ticks=[0,3,6,9,12];
ticks.forEach(t=>{
  const y=baselineY-t*unit;
  const line=make('line',{x1:leftX-8,y1:y,x2:328,y2:y,class:'grid'});
  svg.appendChild(line);
  const lbl=make('text',{x:leftX-22,y:y+4,class:'tick-label','data-tick':t});
  lbl.textContent=t;
  svg.appendChild(lbl);
});
const ytitle=make('text',{x:18,y:200,class:'tick-label',transform:'rotate(-90,18,200)'});
ytitle.textContent=Studio.t('yaxis');
svg.appendChild(ytitle);
data.forEach((d,i)=>{
  const x=startX+i*(barW+gap);
  const r=make('rect',{x:x,y:baselineY,width:barW,height:0,rx:8,class:'bar',fill:barFill,'data-bar':d.key,'data-value':d.value});
  r.style.filter='drop-shadow(2px 3px 3px rgba(0,0,0,0.16))';
  svg.appendChild(r);
  const lbl=make('text',{x:x+barW/2,y:baselineY+22,class:'fruit-label',textAnchor:'middle'});
  lbl.textContent=Studio.t(d.key);
  svg.appendChild(lbl);
  r.addEventListener('click',()=>{
    r.classList.add('bar');
    const h=d.value*unit;
    const valLbl=make('text',{x:x+barW/2,y:baselineY-h-14,class:'tick-label',textAnchor:'middle',fill:'#E65100'});
    valLbl.textContent=d.value;
    svg.appendChild(valLbl);
    setTimeout(()=>{valLbl.remove();},900);
    Studio.answer(d.key);
  });
});
setTimeout(()=>{
  Array.from(svg.querySelectorAll('rect.bar')).forEach(r=>{
    const v=parseInt(r.getAttribute('data-value'));
    const h=v*unit;
    r.setAttribute('y',baselineY-h);
    r.setAttribute('height',h);
  });
},60);
document.getElementById('title').textContent=Studio.t('title');
document.getElementById('ask').textContent=Studio.t('ask');
Studio.onVerdict(v=>{
  const fb=document.getElementById('feedback');
  if(v.correct){
    fb.textContent=Studio.t('right');
    fb.className='feedback correct';
    setTimeout(()=>{
      document.getElementById('done').textContent=Studio.t('done');
      Studio.done();
    },620);
  }else{
    fb.textContent=Studio.t('wrong');
    fb.className='feedback wrong';
    setTimeout(()=>{fb.textContent='';fb.className='feedback';},1200);
  }
});
Studio.ready();
</script>
