<style>
*{box-sizing:border-box}
:root{--ink:#17453d;--deep:#16754d;--leaf:#69ca72;--sky:#e8f8ff;--soil:#96613f;--water:#34a8ed;--co2:#8c70d4;--o2:#ff846c;--sun:#ffd45b;--glucose:#ffe566;--paper:#fffdf7}
body{margin:0;background:linear-gradient(#dcf4ff,#f6fff0);font-family:system-ui,sans-serif;color:var(--ink);overflow-x:hidden}
#app{width:100%;max-width:540px;min-height:100vh;margin:auto;padding:8px;display:flex;flex-direction:column;gap:7px}
h1{margin:2px 0;text-align:center;font-size:clamp(20px,6vw,27px);line-height:1.1;color:var(--deep)}
.scene-card{overflow:hidden;border:2px solid rgba(22,117,77,.16);border-radius:23px;background:rgba(255,255,255,.86);box-shadow:0 8px 22px rgba(23,69,61,.11)}
svg{display:block;width:100%;height:auto}
text{font-family:system-ui,sans-serif;font-size:12px;font-weight:800;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.guide{stroke:var(--ink);stroke-width:1.4;opacity:.5}
.sun{fill:var(--sun);filter:drop-shadow(0 0 8px rgba(255,194,45,.7));transform-origin:54px 47px;animation:sunPulse 2.3s ease-in-out infinite}
.sun-ray{stroke:var(--sun);stroke-width:4;stroke-linecap:round}
.light-ray{fill:none;stroke:#ffd346;stroke-width:4;stroke-linecap:round;stroke-dasharray:10 9;animation:lightMove 1.3s linear infinite}
.stem{fill:none;stroke:var(--deep);stroke-width:11;stroke-linecap:round}
.branch{fill:none;stroke:var(--deep);stroke-width:7;stroke-linecap:round}
[data-entity="leaf"]{fill:var(--leaf);stroke:var(--deep);stroke-width:3;transition:filter .3s,stroke-width .3s}
.vein{fill:none;stroke:var(--deep);stroke-width:2;opacity:.65}
[data-entity="roots"]{fill:none;stroke:#70442e;stroke-width:5;stroke-linecap:round;transition:filter .3s}
.soil{fill:var(--soil)}
.soil-top{fill:#b77b4e}
.particle{stroke:#fff;stroke-width:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18));animation-duration:3s;animation-timing-function:linear;animation-iteration-count:infinite}
[data-flow="water"]{fill:var(--water);animation-name:waterFlow}
[data-flow="co2"]{fill:var(--co2);animation-name:co2Flow}
[data-flow="o2"]{fill:var(--o2);animation-name:o2Flow}
.delay-2{animation-delay:-1s}
.delay-3{animation-delay:-2s}
.delay-4{animation-delay:-2.5s}
.glucose{fill:var(--glucose);stroke:#fff;stroke-width:2;transform-origin:center;animation:glucoseGlow 1.5s ease-in-out infinite}
.glucose.delay-2{animation-delay:-.5s}
.glucose.delay-3{animation-delay:-1s}
#app.paused .particle,#app.paused .light-ray,#app.paused .sun,#app.paused .glucose{animation-play-state:paused}
#app.step-1 .light-ray,
#app.step-2 [data-flow="water"],
#app.step-3 [data-flow="co2"],
#app.step-4 [data-flow="o2"],
#app.step-5 .glucose{filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 9px currentColor)}
#app.step-2 [data-entity="roots"],
#app.step-3 [data-entity="leaf"],
#app.step-4 [data-entity="leaf"],
#app.step-5 [data-entity="leaf"]{filter:drop-shadow(0 0 7px rgba(255,255,255,.9))}
.controls{display:grid;grid-template-columns:1.55fr repeat(5,1fr);gap:5px}
button{position:relative;min-width:44px;min-height:44px;border:0;border-radius:14px;background:#fff;color:var(--ink);font:inherit;font-weight:850;box-shadow:0 3px 0 rgba(23,69,61,.17);cursor:pointer;transition:transform .14s,background .2s,color .2s}
button:active{transform:scale(.92)}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
[data-action="play"]{padding:0 8px;background:var(--deep);color:#fff}
.step.active{background:var(--sun);color:#493800;transform:translateY(-2px)}
[data-caption]{min-height:52px;margin:0;padding:9px 13px;display:grid;place-items:center;border:2px solid rgba(48,157,95,.2);border-radius:17px;background:var(--paper);text-align:center;font-size:15px;font-weight:750;line-height:1.25}
#check{display:none;padding:10px;border:2px solid rgba(140,112,212,.2);border-radius:19px;background:#fff}
#check.show{display:block;animation:rise .35s ease-out}
#ask{margin:0 0 8px;text-align:center;font-weight:850;line-height:1.25}
.options{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.option{background:#edf9f1;padding:4px 22px 4px 8px}
.option.pending{animation:tapPulse .55s ease}
.option.correct{background:var(--leaf)}
.option.incorrect{background:#ffdcd4}
.option.correct::after,.option.incorrect::after{position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:20px}
.option.correct::after{content:"✓"}
.option.incorrect::after{content:"×"}
.option:disabled{opacity:1}
@keyframes sunPulse{50%{transform:scale(1.08)}}
@keyframes lightMove{to{stroke-dashoffset:-38}}
@keyframes waterFlow{0%{transform:translate(0,75px);opacity:0}14%,86%{opacity:1}100%{transform:translate(82px,-78px);opacity:0}}
@keyframes co2Flow{0%{transform:translate(65px,-18px);opacity:0}14%,86%{opacity:1}100%{transform:translate(-43px,23px);opacity:0}}
@keyframes o2Flow{0%{transform:translate(-5px,7px);opacity:0}14%,86%{opacity:1}100%{transform:translate(75px,-48px);opacity:0}}
@keyframes glucoseGlow{50%{transform:scale(1.8);filter:drop-shadow(0 0 8px #fff06a)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes tapPulse{50%{transform:scale(1.06)}}
@media(max-height:680px){
#app{padding:6px;gap:5px}
h1{font-size:20px}
.scene-card svg{max-height:330px}
[data-caption]{min-height:46px;padding:7px}
}
@media(prefers-reduced-motion:reduce){
.particle,.light-ray,.sun,.glucose{animation-duration:7s}
}
</style>

<script>
(() => {
  const app = document.getElementById('app');
  const playButton = document.getElementById('playButton');
  const caption = document.getElementById('caption');
  const check = document.getElementById('check');
  const stepButtons = Array.from(document.querySelectorAll('.step'));
  const optionButtons = Array.from(document.querySelectorAll('[data-option]'));
  const total = Studio.params.steps;
  let step = 1;
  let playing = true;
  let pending = null;
  let complete = false;
  let timer = null;

  document.getElementById('title').textContent = Studio.t('title');
  document.getElementById('ask').textContent = Studio.t('ask');

  document.querySelectorAll('[data-label]').forEach(element => {
    const key = element.getAttribute('data-label');
    element.textContent = Studio.t(key);
  });

  stepButtons.forEach((button, index) => {
    const value = index + 1;
    button.textContent = String(value);
    button.setAttribute('aria-label', Studio.t('step' + value));
  });

  optionButtons.forEach(button => {
    const key = button.getAttribute('data-option');
    button.textContent = Studio.t(key);
    button.setAttribute('aria-label', Studio.t(key));
  });

  function updatePlay() {
    app.classList.toggle('paused', !playing);
    const key = playing ? 'pause' : 'play';
    playButton.textContent = Studio.t(key);
    playButton.setAttribute('aria-label', Studio.t(key));
  }

  function revealCheck() {
    check.classList.add('show');
  }

  function schedule() {
    clearTimeout(timer);
    if (!playing || complete) return;
    timer = setTimeout(() => {
      if (step < total) {
        setStep(step + 1, 'auto');
      } else {
        playing = false;
        updatePlay();
        revealCheck();
      }
    }, 3800);
  }

  function setStep(next, source) {
    step = next;
    for (let value = 1; value <= total; value += 1) {
      app.classList.remove('step-' + value);
    }
    app.classList.add('step-' + step);
    caption.textContent = Studio.t('step' + step);
    stepButtons.forEach((button, index) => {
      button.classList.toggle('active', index + 1 === step);
    });
    if (step === total) revealCheck();
    Studio.event('step', {step, source});
    schedule();
  }

  playButton.addEventListener('click', () => {
    playing = !playing;
    updatePlay();
    Studio.event('play', {playing, step});
    schedule();
  });

  stepButtons.forEach((button, index) => {
    button.addEventListener('click', () => {
      setStep(index + 1, 'tap');
    });
  });

  optionButtons.forEach(button => {
    button.addEventListener('click', () => {
      if (pending || complete) return;
      pending = button;
      const value = button.getAttribute('data-option');
      optionButtons.forEach(option => {
        option.classList.remove('correct', 'incorrect', 'pending');
        option.disabled = true;
      });
      button.classList.add('pending');
      Studio.event('answer', {value});
      Studio.answer(value);
    });
  });

  Studio.onVerdict(verdict => {
    if (!pending || complete) return;
    const selected = pending;
    selected.classList.remove('pending');
    selected.classList.add(verdict.correct ? 'correct' : 'incorrect');

    if (verdict.correct) {
      complete = true;
      playing = false;
      clearTimeout(timer);
      updatePlay();
      Studio.done();
    } else {
      pending = null;
      setTimeout(() => {
        selected.classList.remove('incorrect');
        optionButtons.forEach(option => {
          option.disabled = false;
        });
      }, 700);
    }
  });

  updatePlay();
  setStep(1, 'start');
  Studio.ready();
})();
</script>
