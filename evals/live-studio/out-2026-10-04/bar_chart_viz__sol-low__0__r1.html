<style>
*{box-sizing:border-box}
:root{
  color-scheme:light;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  --ink:#273653;
  --muted:#65728a;
  --paper:#fffaf0;
  --card:#fff;
  --grid:#dce7e8;
  --axis:#78869a;
  --bar:#39aa9b;
  --bar-dark:#268c80;
  --sun:#ffc95c;
  --good:#23865f;
  --bad:#c64f60
}
.lesson{
  width:100%;
  min-height:640px;
  padding:14px 12px 18px;
  overflow:hidden;
  color:var(--ink);
  background:
    radial-gradient(circle at 5% 4%,rgba(255,201,92,.28),transparent 23%),
    radial-gradient(circle at 96% 18%,rgba(57,170,155,.16),transparent 27%),
    var(--paper)
}
.heading{
  min-height:36px;
  margin:0 8px 9px;
  font-size:23px;
  line-height:1.2;
  font-weight:850;
  letter-spacing:-.02em
}
.chart-card{
  position:relative;
  width:100%;
  height:424px;
  overflow:hidden;
  border:1px solid rgba(39,54,83,.08);
  border-radius:24px;
  background:var(--card);
  box-shadow:0 12px 30px rgba(55,72,96,.11)
}
#chart{
  display:block;
  width:100%;
  height:100%
}
.grid-line{
  stroke:var(--grid);
  stroke-width:1;
  vector-effect:non-scaling-stroke
}
.axis-line{
  stroke:var(--axis);
  stroke-width:1.5;
  vector-effect:non-scaling-stroke
}
.tick-label,.fruit-label,.axis-title,.value-label{
  font-family:inherit
}
.tick-label{
  fill:var(--muted);
  font-size:11px
}
.fruit-label{
  fill:var(--ink);
  font-size:10px;
  font-weight:750
}
.axis-title{
  fill:var(--muted);
  font-size:11px;
  font-weight:750
}
.bar{
  fill:var(--bar);
  stroke:rgba(25,107,99,.2);
  stroke-width:1;
  cursor:pointer;
  outline:none;
  transform-box:fill-box;
  transform-origin:center bottom;
  transition:y .85s cubic-bezier(.2,.76,.25,1),height .85s cubic-bezier(.2,.76,.25,1),fill .18s,transform .14s
}
.bar:hover,.bar:focus{fill:var(--bar-dark)}
.bar:active{transform:scale(.94,.98)}
.bar.picked{animation:barPulse .34s ease}
.value-pill,.value-label{
  pointer-events:none;
  opacity:0;
  transform:translateY(5px);
  transition:opacity .2s,transform .2s
}
.value-pill{fill:var(--ink)}
.value-label{
  fill:#fff;
  font-size:12px;
  font-weight:850
}
.value-group.show .value-pill,.value-group.show .value-label{
  opacity:1;
  transform:translateY(0)
}
.prompt{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:62px;
  margin:11px 4px 0;
  padding:9px 15px;
  border-radius:18px;
  background:rgba(255,201,92,.24);
  text-align:center;
  font-size:17px;
  line-height:1.3;
  font-weight:780
}
.feedback{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:44px;
  margin:6px 4px 0;
  border-radius:14px;
  text-align:center;
  font-size:16px;
  font-weight:850;
  opacity:0;
  transform:translateY(5px);
  transition:opacity .22s,transform .22s,background .22s,color .22s
}
.feedback.show{opacity:1;transform:translateY(0)}
.feedback.good{color:var(--good);background:rgba(35,134,95,.1)}
.feedback.try{color:var(--bad);background:rgba(198,79,96,.1)}
@keyframes barPulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.07,.97)}
  100%{transform:scale(1)}
}
@media(max-height:620px){
  .lesson{min-height:100vh;padding-top:9px}
  .heading{font-size:21px;margin-bottom:6px}
  .chart-card{height:392px}
  .prompt{min-height:54px;margin-top:7px}
}
@media(prefers-reduced-motion:reduce){
  .bar,.value-pill,.value-label,.feedback{transition-duration:.01ms}
  .bar.picked{animation:none}
}
</style>

<main class="lesson">
  <h1 class="heading" id="title"></h1>
  <section class="chart-card">
    <svg id="chart" viewBox="0 0 336 424" role="img">
      <g id="grid"></g>
      <g id="axes"></g>
      <g id="bars"></g>
      <g id="labels"></g>
      <g id="values"></g>
    </svg>
  </section>
  <div class="prompt" id="ask"></div>
  <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
</main>

<script>
(() => {
  const data = Studio.params.data;
  const ns = "http://www.w3.org/2000/svg";
  const title = document.getElementById("title");
  const ask = document.getElementById("ask");
  const feedback = document.getElementById("feedback");
  const grid = document.getElementById("grid");
  const axes = document.getElementById("axes");
  const barsLayer = document.getElementById("bars");
  const labels = document.getElementById("labels");
  const valuesLayer = document.getElementById("values");

  title.textContent = Studio.t("title");
  ask.textContent = Studio.t("ask");

  const make = (name, attrs, parent) => {
    const node = document.createElementNS(ns, name);
    Object.keys(attrs).forEach(key => node.setAttribute(key, attrs[key]));
    parent.appendChild(node);
    return node;
  };

  const maximum = Math.max.apply(null, data.map(item => item.value));
  const rough = maximum / 4;
  const power = Math.pow(10, Math.floor(Math.log10(rough || 1)));
  const scaled = rough / power;
  const factor = scaled <= 1 ? 1 : scaled <= 2 ? 2 : scaled <= 5 ? 5 : 10;
  const step = factor * power;
  const scaleMax = Math.ceil(maximum / step) * step;

  const left = 50;
  const right = 326;
  const top = 40;
  const baseline = 352;
  const plotHeight = baseline - top;
  const plotWidth = right - left;
  const band = plotWidth / data.length;
  const barWidth = Math.max(44, Math.min(48, band * .82));
  const yAt = value => baseline - value / scaleMax * plotHeight;

  for (let tick = 0; tick <= scaleMax; tick += step) {
    const y = yAt(tick);
    make("line", {x1:left,y1:y,x2:right,y2:y,class:"grid-line"}, grid);
    const text = make("text", {
      x:left - 8,
      y:y + 4,
      "text-anchor":"end",
      class:"tick-label",
      "data-tick":String(tick)
    }, labels);
    text.textContent = String(tick);
  }

  make("line", {x1:left,y1:top,x2:left,y2:baseline,class:"axis-line"}, axes);
  make("line", {x1:left,y1:baseline,x2:right,y2:baseline,class:"axis-line"}, axes);

  const middle = (top + baseline) / 2;
  const axisTitle = make("text", {
    x:16,
    y:middle,
    transform:"rotate(-90 16 " + middle + ")",
    "text-anchor":"middle",
    class:"axis-title"
  }, labels);
  axisTitle.textContent = Studio.t("yaxis");

  let waiting = false;
  let finished = false;
  const animated = [];

  data.forEach((item, index) => {
    const center = left + band * index + band / 2;
    const finalY = yAt(item.value);
    const finalHeight = baseline - finalY;

    const bar = make("rect", {
      x:center - barWidth / 2,
      y:baseline,
      width:barWidth,
      height:0,
      rx:10,
      class:"bar",
      tabindex:"0",
      role:"button",
      "data-bar":item.key,
      "data-value":String(item.value)
    }, barsLayer);

    animated.push({bar, finalY, finalHeight});

    const fruit = make("text", {
      x:center,
      y:378,
      "text-anchor":"middle",
      class:"fruit-label"
    }, labels);
    fruit.textContent = Studio.t(item.key);

    const valueGroup = make("g", {
      class:"value-group",
      "data-value-group":item.key
    }, valuesLayer);
    const pillY = Math.max(7, finalY - 33);
    make("rect", {
      x:center - 19,
      y:pillY,
      width:38,
      height:26,
      rx:13,
      class:"value-pill"
    }, valueGroup);
    const valueText = make("text", {
      x:center,
      y:pillY + 18,
      "text-anchor":"middle",
      class:"value-label"
    }, valueGroup);
    valueText.textContent = String(item.value);

    const choose = () => {
      if (waiting || finished) return;
      valuesLayer.querySelectorAll(".value-group").forEach(group => group.classList.remove("show"));
      valueGroup.classList.add("show");
      bar.classList.remove("picked");
      void bar.getBoundingClientRect();
      bar.classList.add("picked");
      feedback.className = "feedback";
      feedback.textContent = "";
      waiting = true;
      Studio.event("bar_tap", {key:item.key,value:item.value});
      Studio.answer(item.key);
    };

    bar.addEventListener("click", choose);
    bar.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        choose();
      }
    });
  });

  Studio.onVerdict(result => {
    waiting = false;
    feedback.className = "feedback show " + (result.correct ? "good" : "try");
    feedback.textContent = Studio.t(result.correct ? "right" : "wrong");
    if (result.correct && !finished) {
      finished = true;
      ask.textContent = Studio.t("done");
      Studio.done();
    }
  });

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      animated.forEach(entry => {
        entry.bar.setAttribute("y", entry.finalY);
        entry.bar.setAttribute("height", entry.finalHeight);
      });
    });
  });

  Studio.ready();
})();
</script>
