<style>
  :root{
    --bg:#f6f4ff;
    --card:#ffffff;
    --ink:#2f2850;
    --muted:#7a7299;
    --grid:#e7e1fa;
    --axis:#b8afda;
    --bar:#7b5cff;
    --bar2:#6447e8;
    --good:#1f9d68;
    --bad:#d64545;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    font-family:ui-rounded, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    color:var(--ink);
  }
  .app{
    width:100%;
    max-width:420px;
    min-height:640px;
    margin:0 auto;
    padding:14px;
  }
  .card{
    background:var(--card);
    border-radius:18px;
    box-shadow:0 8px 24px rgba(61,36,124,.1);
    padding:14px 12px 12px;
  }
  h1{
    margin:2px 6px 6px;
    font-size:24px;
    line-height:1.2;
    text-align:center;
  }
  .ask{
    margin:0 6px 10px;
    color:var(--muted);
    font-size:16px;
    text-align:center;
    min-height:22px;
  }
  .chartBlock{
    display:grid;
    grid-template-columns:34px 1fr;
    gap:6px;
  }
  .yTitle{
    writing-mode:vertical-rl;
    transform:rotate(180deg);
    text-align:center;
    color:var(--muted);
    font-size:13px;
    user-select:none;
    padding:6px 0;
  }
  .chartArea{position:relative}
  .plot{
    position:relative;
    height:320px;
    border-left:2px solid var(--axis);
    border-bottom:2px solid var(--axis);
    border-radius:8px 0 0 0;
    background:linear-gradient(180deg,#fcfbff 0%,#ffffff 100%);
    overflow:visible;
  }
  .gridLine{
    position:absolute;
    left:0; right:0;
    border-top:1px solid var(--grid);
    pointer-events:none;
  }
  .tickLabel{
    position:absolute;
    left:-34px;
    width:30px;
    transform:translateY(50%);
    text-align:right;
    color:var(--muted);
    font-size:12px;
    line-height:1;
    user-select:none;
  }
  .bars{
    position:absolute;
    inset:0;
    display:flex;
    align-items:stretch;
    justify-content:space-evenly;
    padding:0 4px;
  }
  .slot{
    width:19%;
    min-width:48px;
    height:100%;
    display:flex;
    align-items:stretch;
    justify-content:center;
  }
  .barBtn{
    width:100%;
    height:100%;
    min-width:44px;
    min-height:44px;
    border:none;
    background:transparent;
    padding:0;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    position:relative;
  }
  .barHit{
    width:44px;
    min-width:44px;
    height:100%;
    min-height:44px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    position:relative;
  }
  .barFill{
    width:34px;
    border-radius:12px 12px 0 0;
    background:linear-gradient(180deg,var(--bar) 0%,var(--bar2) 100%);
    box-shadow:0 6px 10px rgba(99,77,230,.24);
    height:0%;
    transform-origin:bottom;
    transition:height .85s cubic-bezier(.2,.8,.2,1), transform .16s ease, filter .2s ease;
  }
  .barBtn:active .barFill{transform:scale(.97); filter:brightness(1.05)}
  .barBtn.selected .barFill{transform:scale(1.03)}
  .valueTag{
    position:absolute;
    left:50%;
    bottom:0;
    transform:translate(-50%,-8px) scale(.9);
    background:#2f2850;
    color:#fff;
    min-width:32px;
    text-align:center;
    padding:4px 8px;
    border-radius:999px;
    font-size:13px;
    opacity:0;
    transition:opacity .2s ease, transform .2s ease, bottom .2s ease;
    pointer-events:none;
  }
  .valueTag.show{
    opacity:1;
    transform:translate(-50%,-8px) scale(1);
  }
  .xLabels{
    display:flex;
    justify-content:space-evenly;
    margin-top:8px;
    padding-left:4px;
  }
  .xLab{
    width:19%;
    min-width:48px;
    text-align:center;
    font-size:13px;
    line-height:1.15;
  }
  .feedback{
    margin-top:10px;
    min-height:24px;
    text-align:center;
    font-size:17px;
    font-weight:700;
    transition:transform .2s ease;
  }
  .feedback.good{color:var(--good)}
  .feedback.bad{color:var(--bad)}
  .feedback.pop{transform:scale(1.04)}
</style>

<div class="app">
  <div class="card">
    <h1 id="title"></h1>
    <div class="ask" id="ask"></div>

    <div class="chartBlock">
      <div class="yTitle" id="yTitle"></div>
      <div class="chartArea">
        <div class="plot" id="plot">
          <div class="bars" id="bars"></div>
        </div>
        <div class="xLabels" id="xLabels"></div>
      </div>
    </div>

    <div class="feedback" id="feedback"></div>
  </div>
</div>

<script>
(function(){
  const data = (Studio.params && Studio.params.data) ? Studio.params.data.slice() : [];
  const el = {
    title: document.getElementById('title'),
    ask: document.getElementById('ask'),
    yTitle: document.getElementById('yTitle'),
    plot: document.getElementById('plot'),
    bars: document.getElementById('bars'),
    xLabels: document.getElementById('xLabels'),
    feedback: document.getElementById('feedback')
  };

  el.title.textContent = Studio.t('title');
  el.ask.textContent = Studio.t('ask');
  el.yTitle.textContent = Studio.t('yaxis');

  const maxVal = Math.max.apply(null, data.map(d => d.value).concat([1]));
  function niceStep(max){
    const rough = max / 5;
    const p = Math.pow(10, Math.floor(Math.log10(rough)));
    const n = rough / p;
    if (n <= 1) return 1 * p;
    if (n <= 2) return 2 * p;
    if (n <= 5) return 5 * p;
    return 10 * p;
  }
  const step = niceStep(maxVal);
  const topTick = Math.ceil(maxVal / step) * step;
  const yFor = v => (v / topTick) * 100;

  for(let t = 0; t <= topTick; t += step){
    const line = document.createElement('div');
    line.className = 'gridLine';
    line.style.bottom = yFor(t) + '%';
    el.plot.appendChild(line);

    const tick = document.createElement('div');
    tick.className = 'tickLabel';
    tick.setAttribute('data-tick', String(t));
    tick.style.bottom = yFor(t) + '%';
    tick.textContent = String(t);
    el.plot.appendChild(tick);
  }

  const bars = [];
  let locked = false;

  data.forEach((d, i) => {
    const slot = document.createElement('div');
    slot.className = 'slot';

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'barBtn';

    const hit = document.createElement('div');
    hit.className = 'barHit';
    hit.setAttribute('data-bar', d.key);
    hit.setAttribute('data-value', String(d.value));

    const fill = document.createElement('div');
    fill.className = 'barFill';

    const tag = document.createElement('div');
    tag.className = 'valueTag';
    tag.textContent = String(d.value);

    hit.appendChild(fill);
    btn.appendChild(hit);
    btn.appendChild(tag);
    slot.appendChild(btn);
    el.bars.appendChild(slot);

    const xl = document.createElement('div');
    xl.className = 'xLab';
    xl.textContent = Studio.t(d.key);
    el.xLabels.appendChild(xl);

    btn.addEventListener('click', function(){
      if (locked) return;
      bars.forEach(b => {
        b.btn.classList.remove('selected');
        b.tag.classList.remove('show');
      });
      btn.classList.add('selected');
      tag.classList.add('show');
      tag.style.bottom = 'calc(' + yFor(d.value) + '% + 6px)';
      Studio.event('bar_tap', {key:d.key, value:d.value});
      Studio.answer(d.key);
    });

    bars.push({btn:btn, fill:fill, tag:tag, value:d.value, delay:i});
  });

  requestAnimationFrame(function(){
    bars.forEach(function(b){
      setTimeout(function(){
        b.fill.style.height = yFor(b.value) + '%';
      }, b.delay * 80);
    });
  });

  Studio.onVerdict(function(v){
    el.feedback.classList.remove('good','bad','pop');
    if (v && v.correct){
      locked = true;
      el.feedback.textContent = Studio.t('right') + ' ' + Studio.t('done');
      el.feedback.classList.add('good','pop');
      bars.forEach(b => b.btn.disabled = true);
      Studio.event('completed', {});
      Studio.done();
    } else {
      el.feedback.textContent = Studio.t('wrong');
      el.feedback.classList.add('bad','pop');
      setTimeout(function(){ el.feedback.classList.remove('pop'); }, 220);
    }
  });

  Studio.ready();
})();
</script>
