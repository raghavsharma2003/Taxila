<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(180deg, #fff8e7 0%, #ffe4b5 100%); color: #4a3b2a; }
#app { width: 100%; max-width: 100vw; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; overflow-x: hidden; }
header { text-align: center; margin-bottom: 16px; }
h1 { font-size: 1.6rem; color: #d35400; margin-bottom: 6px; }
.instr { font-size: 1rem; color: #6d5638; line-height: 1.4; }
.card { width: 100%; max-width: 360px; background: #fff; border-radius: 28px; padding: 22px 18px; box-shadow: 0 10px 28px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; gap: 16px; transition: transform .2s ease; }
.fraction-wrap { display: flex; flex-direction: column; align-items: center; font-size: 2.4rem; font-weight: 800; color: #c0392b; line-height: 1; }
.fraction-wrap .bar { width: 64px; height: 5px; background: #c0392b; border: none; margin: 5px 0; border-radius: 3px; }
.shape-area { width: 100%; display: flex; justify-content: center; align-items: center; animation: float 4s ease-in-out infinite; }
svg { max-width: 100%; height: auto; display: block; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.08)); }
.part { fill: #fbebd6; stroke: #fff; stroke-width: 3; cursor: pointer; transform-box: fill-box; transform-origin: center; transition: fill .2s ease, transform .12s ease; }
.part:hover { filter: brightness(1.04); }
.part:active { transform: scale(0.94); filter: brightness(0.96); }
.part.shaded { fill: #ff9f43; }
#check-btn { width: 100%; max-width: 280px; padding: 15px 26px; font-size: 1.15rem; font-weight: 700; color: #fff; background: linear-gradient(90deg, #27ae60, #2ecc71); border: none; border-radius: 18px; box-shadow: 0 5px 14px rgba(39,174,96,0.3); cursor: pointer; transition: transform .1s, box-shadow .2s; }
#check-btn:active { transform: scale(0.97); box-shadow: 0 3px 10px rgba(39,174,96,0.25); }
#check-btn:disabled { opacity: .65; cursor: not-allowed; }
.feedback { min-height: 1.6rem; font-size: 1.1rem; font-weight: 700; text-align: center; }
.feedback.right { color: #27ae60; }
.feedback.wrong { color: #e74c3c; }
.hint { font-size: .86rem; color: #8c7b65; text-align: center; line-height: 1.35; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
@keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.06); } 100% { transform: scale(1); } }
.shake { animation: shake .42s ease-in-out; }
.pop { animation: pop .36s ease-in-out; }
.done-screen { text-align: center; gap: 14px; padding: 40px 24px; }
.done-icon { font-size: 3.6rem; line-height: 1; animation: float 2.2s ease-in-out infinite; }
.done-screen h2 { font-size: 1.45rem; color: #27ae60; }
</style>

<div id="app">
  <header>
    <h1 id="title"></h1>
    <p id="instr" class="instr"></p>
  </header>
  <main class="card" id="item-card">
    <div class="fraction-wrap">
      <span id="num"></span>
      <hr class="bar">
      <span id="den"></span>
    </div>
    <div id="shape-area" class="shape-area"></div>
    <button id="check-btn" data-action="check"><span id="check-text"></span></button>
    <div id="feedback" class="feedback" aria-live="polite"></div>
    <p id="hint" class="hint"></p>
  </main>
</div>

<script>
(function () {
  var items = Studio.params.items;
  var picture = Studio.params.picture || 'pizza';
  var card = document.getElementById('item-card');
  var shapeArea = document.getElementById('shape-area');
  var numEl = document.getElementById('num');
  var denEl = document.getElementById('den');
  var feedback = document.getElementById('feedback');
  var checkBtn = document.getElementById('check-btn');
  var titleEl = document.getElementById('title');
  var instrEl = document.getElementById('instr');
  var checkText = document.getElementById('check-text');
  var hintEl = document.getElementById('hint');
  var index = 0;
  var locked = false;
  var ns = 'http://www.w3.org/2000/svg';

  function setTexts() {
    titleEl.textContent = Studio.t('title');
    instrEl.textContent = Studio.t('instr');
    checkText.textContent = Studio.t('check');
    hintEl.textContent = Studio.t('hint');
  }

  function makePizza(d) {
    var r = 130;
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '-140 -140 280 280');
    svg.setAttribute('width', '100%');
    var start = -Math.PI / 2;
    for (var i = 0; i < d; i++) {
      var a1 = start + (2 * Math.PI * i) / d;
      var a2 = start + (2 * Math.PI * (i + 1)) / d;
      var x1 = Math.cos(a1) * r;
      var y1 = Math.sin(a1) * r;
      var x2 = Math.cos(a2) * r;
      var y2 = Math.sin(a2) * r;
      var path = document.createElementNS(ns, 'path');
      path.setAttribute('d', 'M0,0 L' + x1.toFixed(2) + ',' + y1.toFixed(2) + ' A' + r + ',' + r + ' 0 0,1 ' + x2.toFixed(2) + ',' + y2.toFixed(2) + ' Z');
      path.setAttribute('class', 'part');
      path.setAttribute('data-part', String(i));
      path.setAttribute('data-shaded', 'false');
      svg.appendChild(path);
    }
    return svg;
  }

  function makeBar(d) {
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 360 80');
    svg.setAttribute('width', '100%');
    var gap = 4;
    var totalGap = gap * (d - 1);
    var segW = (360 - totalGap) / d;
    for (var i = 0; i < d; i++) {
      var rect = document.createElementNS(ns, 'rect');
      rect.setAttribute('x', String(i * (segW + gap)));
      rect.setAttribute('y', '0');
      rect.setAttribute('width', String(segW));
      rect.setAttribute('height', '80');
      rect.setAttribute('rx', '8');
      rect.setAttribute('class', 'part');
      rect.setAttribute('data-part', String(i));
      rect.setAttribute('data-shaded', 'false');
      svg.appendChild(rect);
    }
    return svg;
  }

  function render() {
    locked = false;
    var item = items[index];
    card.setAttribute('data-item', item.id);
    numEl.textContent = String(item.n);
    denEl.textContent = String(item.d);
    feedback.textContent = '';
    feedback.className = 'feedback';
    card.classList.remove('shake', 'pop');
    shapeArea.innerHTML = '';
    var svg = String(picture).toLowerCase() === 'bar' ? makeBar(item.d) : makePizza(item.d);
    shapeArea.appendChild(svg);
    var parts = svg.querySelectorAll('.part');
    for (var i = 0; i < parts.length; i++) {
      parts[i].addEventListener('click', toggle);
    }
  }

  function toggle(e) {
    if (locked) return;
    var p = e.currentTarget;
    var shaded = p.getAttribute('data-shaded') !== 'true';
    p.setAttribute('data-shaded', String(shaded));
    p.classList.toggle('shaded', shaded);
    feedback.textContent = '';
    Studio.event('part_toggle', { item: items[index].id, part: p.getAttribute('data-part'), shaded: shaded });
  }

  function check() {
    if (locked) return;
    var item = items[index];
    var parts = shapeArea.querySelectorAll('.part');
    var count = 0;
    for (var i = 0; i < parts.length; i++) {
      if (parts[i].getAttribute('data-shaded') === 'true') count++;
    }
    Studio.answer({ n: count, d: item.d });
  }

  Studio.onVerdict(function (v) {
    if (v.correct) {
      feedback.textContent = Studio.t('right');
      feedback.className = 'feedback right';
      locked = true;
      card.classList.add('pop');
      Studio.event('correct', { item: items[index].id });
      setTimeout(function () {
        index++;
        if (index >= items.length) {
          showDone();
        } else {
          render();
        }
      }, 900);
    } else {
      feedback.textContent = Studio.t('wrong');
      feedback.className = 'feedback wrong';
      card.classList.add('shake');
      setTimeout(function () { card.classList.remove('shake'); }, 420);
      Studio.event('wrong', { item: items[index].id });
    }
  });

  function showDone() {
    card.setAttribute('data-item', '');
    var app = document.getElementById('app');
    app.innerHTML = '<div class="card done-screen"><div class="done-icon">🎉</div><h2>' + escapeHTML(Studio.t('done')) + '</h2></div>';
    Studio.done();
  }

  function escapeHTML(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  checkBtn.addEventListener('click', check);
  setTexts();
  render();
  Studio.ready();
})();
</script>
