<style>
  *{box-sizing:border-box}
  :root{
    --ink:#24334a;
    --muted:#66758a;
    --paper:#fffdf8;
    --cream:#fff3d7;
    --sky:#dff3ff;
    --blue:#4b91d1;
    --blue-dark:#276cae;
    --grid:#bfd8e6;
    --coral:#f47c62;
    --green:#4fa979;
    --shadow:0 10px 24px rgba(43,82,112,.13);
  }
  body{
    margin:0;
    min-width:320px;
    background:linear-gradient(180deg,var(--sky) 0%,#f8fcff 43%,var(--cream) 100%);
    color:var(--ink);
    font-family:Arial,sans-serif;
  }
  .page{
    width:min(100%,420px);
    min-height:640px;
    margin:0 auto;
    padding:18px 16px 24px;
    overflow:hidden;
  }
  .top{
    text-align:center;
    margin-bottom:12px;
    animation:rise .55s ease both;
  }
  h1{
    margin:0;
    font-size:25px;
    line-height:1.2;
    font-weight:800;
    letter-spacing:-.4px;
  }
  .fruit-row{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:9px;
  }
  .fruit{
    width:27px;
    height:27px;
    border-radius:50% 50% 48% 48%;
    display:block;
    position:relative;
  }
  .fruit:after{
    content:"";
    position:absolute;
    width:9px;
    height:5px;
    border-radius:8px 1px 8px 1px;
    background:#55a86f;
    top:-4px;
    left:15px;
    transform:rotate(-28deg);
  }
  .fruit.a{background:#f6b734}.fruit.b{background:#ffe265}.fruit.c{background:#ed6452}
  .chart-card{
    background:var(--paper);
    border:2px solid rgba(75,145,209,.18);
    box-shadow:var(--shadow);
    border-radius:24px;
    padding:12px 7px 6px;
    animation:rise .65s .08s ease both;
  }
  .chart-wrap{
    width:100%;
    position:relative;
  }
  svg{
    display:block;
    width:100%;
    height:auto;
    overflow:visible;
  }
  .grid{stroke:var(--grid);stroke-width:1}
  .axis{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
  .tick-text,.fruit-label,.axis-title,.value-label{
    font-family:Arial,sans-serif;
    fill:var(--muted);
    font-weight:700;
  }
  .tick-text{font-size:12px}
  .fruit-label{font-size:12px;fill:var(--ink)}
  .axis-title{font-size:12px;fill:var(--blue-dark)}
  .bar{
    fill:var(--blue);
    stroke:var(--blue-dark);
    stroke-width:1.4;
    cursor:pointer;
    transition:y .8s cubic-bezier(.2,.8,.25,1),height .8s cubic-bezier(.2,.8,.25,1),fill .2s ease,filter .2s ease;
  }
  .bar:active{fill:var(--coral)}
  .bar.selected{
    fill:var(--coral);
    filter:drop-shadow(0 3px 2px rgba(103,45,37,.22));
  }
  .value-label{
    font-size:17px;
    fill:var(--blue-dark);
    opacity:0;
    transform-origin:center;
    transition:opacity .22s ease,transform .22s ease;
  }
  .value-label.show{
    opacity:1;
    transform:translateY(-3px);
  }
  .question{
    margin:15px 3px 0;
    background:#e8f7ff;
    border-radius:18px;
    padding:14px 16px;
    text-align:center;
    color:var(--ink);
    font-size:17px;
    line-height:1.3;
    font-weight:800;
    box-shadow:0 6px 14px rgba(69,135,177,.11);
    animation:rise .65s .16s ease both;
  }
  .feedback{
    min-height:30px;
    margin:10px auto 0;
    text-align:center;
    font-size:18px;
    font-weight:800;
    color:var(--blue-dark);
    transform:scale(.9);
    opacity:0;
    transition:opacity .2s ease,transform .2s ease;
  }
  .feedback.show{opacity:1;transform:scale(1)}
  .feedback.wrong{color:var(--coral)}
  .completion{
    display:none;
    text-align:center;
    margin-top:4px;
    font-size:18px;
    color:var(--green);
    font-weight:800;
    animation:pop .45s ease both;
  }
  .completion.show{display:block}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pop{0%{transform:scale(.75);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
</style>

<main class="page">
  <header class="top">
    <h1 id="title"></h1>
    <div class="fruit-row" aria-hidden="true">
      <i class="fruit a"></i><i class="fruit b"></i><i class="fruit c"></i>
    </div>
  </header>
  <section class="chart-card">
    <div class="chart-wrap">
      <svg id="chart" viewBox="0 0 340 365" role="img">
        <g id="gridLayer"></g>
        <g id="axisLayer"></g>
        <g id="barLayer"></g>
        <g id="labelLayer"></g>
        <text id="axisTitle" class="axis-title"></text>
      </svg>
    </div>
  </section>
  <section class="question" id="question"></section>
  <div class="feedback" id="feedback" aria-live="polite"></div>
  <div class="completion" id="completion" aria-live="polite"></div>
</main>

<script>
(function(){
  var data=Studio.params.data;
  var ns="http://www.w3.org/2000/svg";
  var chart=document.getElementById("chart");
  var grid=document.getElementById("gridLayer");
  var axes=document.getElementById("axisLayer");
  var bars=document.getElementById("barLayer");
  var labels=document.getElementById("labelLayer");
  var feedback=document.getElementById("feedback");
  var completion=document.getElementById("completion");
  var top=48, bottom=278, left=48, right=328, plotH=bottom-top;
  var max=0, i;
  for(i=0;i<data.length;i++) if(data[i].value>max) max=data[i].value;
  var raw=max/5;
  var power=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10));
  var unit=raw/power;
  var nice=unit<=1?1:unit<=2?2:unit<=5?5:10;
  var step=nice*power;
  var scaleMax=Math.ceil(max/step)*step;
  if(scaleMax===0) scaleMax=step;
  function node(tag,attrs,text){
    var el=document.createElementNS(ns,tag), k;
    for(k in attrs) el.setAttribute(k,attrs[k]);
    if(text!==undefined) el.textContent=text;
    return el;
  }
  document.getElementById("title").textContent=Studio.t("title");
  document.getElementById("question").textContent=Studio.t("ask");
  var axisTitle=document.getElementById("axisTitle");
  axisTitle.textContent=Studio.t("yaxis");
  axisTitle.setAttribute("x","17");
  axisTitle.setAttribute("y",String((top+bottom)/2));
  axisTitle.setAttribute("text-anchor","middle");
  axisTitle.setAttribute("transform","rotate(-90 17 "+String((top+bottom)/2)+")");

  for(var tick=0;tick<=scaleMax+step/100;tick+=step){
    var y=bottom-(tick/scaleMax)*plotH;
    grid.appendChild(node("line",{x1:left,y1:y,x2:right,y2:y,class:"grid"}));
    labels.appendChild(node("text",{x:left-8,y:y+4,"text-anchor":"end",class:"tick-text","data-tick":String(tick)},String(tick)));
  }
  axes.appendChild(node("line",{x1:left,y1:top,x2:left,y2:bottom,class:"axis"}));
  axes.appendChild(node("line",{x1:left,y1:bottom,x2:right,y2:bottom,class:"axis"}));

  var gap=(right-left)/data.length;
  var barWidth=48;
  var waiting=false, finished=false;
  function tapBar(event){
    if(waiting||finished)return;
    var rect=event.currentTarget;
    waiting=true;
    var all=bars.querySelectorAll(".bar");
    for(var q=0;q<all.length;q++)all[q].classList.remove("selected");
    rect.classList.add("selected");
    var valueText=document.getElementById("valueText");
    valueText.textContent=rect.getAttribute("data-value");
    valueText.setAttribute("x",String(Number(rect.getAttribute("x"))+barWidth/2));
    valueText.setAttribute("y",String(Math.max(top+16,Number(rect.getAttribute("y"))-8)));
    valueText.classList.add("show");
    feedback.className="feedback";
    Studio.event("bar_tap",{key:rect.getAttribute("data-bar"),value:Number(rect.getAttribute("data-value"))});
    Studio.answer(rect.getAttribute("data-bar"));
  }
  for(i=0;i<data.length;i++){
    var item=data[i];
    var x=left+gap*i+(gap-barWidth)/2;
    var h=(item.value/scaleMax)*plotH;
    var finalY=bottom-h;
    var rect=node("rect",{x:x,y:bottom,width:barWidth,height:0,rx:10,class:"bar","data-bar":item.key,"data-value":String(item.value)});
    rect.addEventListener("click",tapBar);
    bars.appendChild(rect);
    labels.appendChild(node("text",{x:x+barWidth/2,y:bottom+27,"text-anchor":"middle",class:"fruit-label"},Studio.t(item.key)));
    (function(r,y,height,delay){
      setTimeout(function(){r.setAttribute("y",y);r.setAttribute("height",height)},70+delay);
    })(rect,finalY,h,i*70);
  }
  var valueLabel=node("text",{id:"valueText",x:0,y:0,"text-anchor":"middle",class:"value-label"},"");
  labels.appendChild(valueLabel);

  Studio.onVerdict(function(result){
    if(finished)return;
    if(result.correct){
      finished=true;
      feedback.textContent=Studio.t("right");
      feedback.className="feedback show";
      completion.textContent=Studio.t("done");
      completion.className="completion show";
      Studio.done();
    }else{
      waiting=false;
      feedback.textContent=Studio.t("wrong");
      feedback.className="feedback show wrong";
    }
  });
  Studio.ready();
})();
</script>
