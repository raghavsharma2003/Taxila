<style>
  *{box-sizing:border-box}
  :root{
    --ink:#3c3552;
    --muted:#756d8b;
    --cream:#fff9ec;
    --card:#ffffff;
    --line:#eadfc9;
    --plain:#f4ead7;
    --shade:#ff9f43;
    --shade2:#ffca62;
    --green:#35b77c;
    --pink:#ef6f91;
  }
  body{
    margin:0;
    min-width:0;
    min-height:100vh;
    overflow-x:hidden;
    background:
      radial-gradient(circle at 12% 8%,#fff1ba 0 8%,transparent 8.5%),
      radial-gradient(circle at 88% 15%,#dff5ec 0 7%,transparent 7.5%),
      linear-gradient(160deg,#fffaf0,#f8f2ff);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    margin:auto;
    padding:22px 18px 26px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .top{
    width:100%;
    text-align:center;
    margin-bottom:12px;
  }
  h1{
    margin:0;
    font-size:clamp(25px,7vw,34px);
    line-height:1.15;
    letter-spacing:-.02em;
  }
  .instr{
    margin:9px auto 0;
    max-width:330px;
    color:var(--muted);
    font-size:16px;
    line-height:1.4;
  }
  .game-card{
    width:100%;
    padding:18px 14px 16px;
    border:2px solid rgba(234,223,201,.85);
    border-radius:30px;
    background:rgba(255,255,255,.92);
    box-shadow:0 14px 35px rgba(79,57,99,.12);
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:transform .28s ease,box-shadow .28s ease,border-color .28s ease;
  }
  .target{
    min-width:94px;
    min-height:54px;
    padding:7px 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:18px;
    background:#f2e9ff;
    color:#6746a5;
    font-size:30px;
    font-weight:800;
    line-height:1;
    box-shadow:inset 0 -3px 0 rgba(103,70,165,.09);
  }
  .picture-wrap{
    width:min(100%,290px);
    aspect-ratio:1;
    margin:10px auto 6px;
    display:grid;
    place-items:center;
    border-radius:50%;
  }
  #picture{
    width:100%;
    height:100%;
    overflow:visible;
    filter:drop-shadow(0 9px 9px rgba(83,54,30,.14));
  }
  [data-part]{
    cursor:pointer;
    outline:none;
    transform-box:fill-box;
    transform-origin:center;
    transition:fill .24s ease,transform .16s ease,filter .2s ease;
  }
  [data-part]:active{transform:scale(.94)}
  [data-part]:focus-visible{
    filter:drop-shadow(0 0 4px #6045a4);
  }
  [data-part][data-shaded="true"]{
    fill:var(--shade);
    filter:drop-shadow(0 3px 2px rgba(184,91,20,.2));
  }
  .controls{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  [data-action="check"]{
    width:min(100%,250px);
    min-height:54px;
    border:0;
    border-radius:18px;
    padding:11px 22px;
    background:linear-gradient(180deg,#7257bd,#5b3ea5);
    color:white;
    font:800 18px/1 system-ui,-apple-system,"Segoe UI",sans-serif;
    box-shadow:0 7px 0 #432d7d,0 10px 20px rgba(74,49,131,.22);
    cursor:pointer;
    transition:transform .14s ease,box-shadow .14s ease,opacity .2s ease;
  }
  [data-action="check"]:active{
    transform:translateY(5px) scale(.98);
    box-shadow:0 2px 0 #432d7d;
  }
  [data-action="check"]:disabled{
    cursor:default;
    opacity:.65;
  }
  .feedback{
    min-height:47px;
    width:100%;
    padding:4px 8px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--muted);
    font-size:16px;
    font-weight:700;
    line-height:1.3;
  }
  .game-card.correct{
    border-color:#8cdbb9;
    box-shadow:0 14px 38px rgba(53,183,124,.2);
    animation:happy .62s ease both;
  }
  .game-card.correct .feedback{color:#22865c}
  .game-card.wrong{
    border-color:#f6b2c3;
    animation:gentle .42s ease;
  }
  .game-card.wrong .feedback{color:#b34d69}
  .spark{
    opacity:0;
    transform-origin:center;
  }
  .correct .spark{
    animation:sparkle .7s ease-out both;
  }
  .done-card{
    width:100%;
    margin-top:56px;
    min-height:300px;
    padding:34px 22px;
    border-radius:32px;
    background:rgba(255,255,255,.94);
    border:2px solid #bce8d5;
    box-shadow:0 16px 40px rgba(53,183,124,.17);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    animation:arrive .55s ease both;
  }
  .done-bloom{
    width:150px;
    height:150px;
    margin-bottom:18px;
    animation:float 2.4s ease-in-out infinite;
  }
  .done-card h2{
    margin:0;
    font-size:30px;
    line-height:1.2;
    color:#278a62;
  }
  @keyframes happy{
    0%{transform:scale(1)}
    45%{transform:scale(1.025) rotate(-.6deg)}
    75%{transform:scale(1.015) rotate(.5deg)}
    100%{transform:scale(1)}
  }
  @keyframes gentle{
    0%,100%{transform:translateX(0)}
    30%{transform:translateX(-4px)}
    65%{transform:translateX(4px)}
  }
  @keyframes sparkle{
    0%{opacity:0;transform:scale(.3) rotate(0)}
    35%{opacity:1}
    100%{opacity:0;transform:scale(1.35) rotate(35deg)}
  }
  @keyframes arrive{
    from{opacity:0;transform:translateY(18px) scale(.96)}
    to{opacity:1;transform:none}
  }
  @keyframes float{
    0%,100%{transform:translateY(0) rotate(-2deg)}
    50%{transform:translateY(-8px) rotate(2deg)}
  }
  @media (max-height:620px){
    #app{padding-top:12px;padding-bottom:14px}
    .top{margin-bottom:7px}
    .instr{margin-top:5px}
    .game-card{padding-top:11px}
    .picture-wrap{width:min(100%,250px);margin-top:5px}
    .feedback{min-height:38px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
</style>

<main id="app">
  <header class="top">
    <h1 id="title"></h1>
    <p class="instr" id="instr"></p>
  </header>

  <section class="game-card" id="itemCard" data-item="">
    <div class="target" id="target"></div>

    <div class="picture-wrap">
      <svg id="picture" viewBox="0 0 240 240">
        <circle cx="120" cy="120" r="108" fill="#fff4dc" stroke="#d8a65b" stroke-width="5"></circle>
        <g id="parts"></g>
        <g aria-hidden="true">
          <path class="spark" d="M26 53l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#ffd45c"></path>
          <path class="spark" d="M205 38l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#ef6f91"></path>
          <path class="spark" d="M217 174l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#52c995"></path>
        </g>
      </svg>
    </div>

    <div class="controls">
      <button type="button" data-action="check" id="check"></button>
      <div class="feedback" id="feedback" aria-live="polite"></div>
    </div>
  </section>
</main>

<script>
(() => {
  const items = Studio.params.items;
  const pictureMode = Studio.params.picture;
  const app = document.getElementById('app');
  const card = document.getElementById('itemCard');
  const target = document.getElementById('target');
  const partsGroup = document.getElementById('parts');
  const check = document.getElementById('check');
  const feedback = document.getElementById('feedback');
  const ns = 'http://www.w3.org/2000/svg';

  let current = 0;
  let shaded = new Set();
  let waiting = false;
  let finished = false;

  document.getElementById('title').textContent = Studio.t('title');
  document.getElementById('instr').textContent = Studio.t('instr');
  check.textContent = Studio.t('check');
  check.setAttribute('aria-label', Studio.t('check'));

  function point(cx, cy, radius, angle) {
    const radians = (angle - 90) * Math.PI / 180;
    return {
      x: cx + radius * Math.cos(radians),
      y: cy + radius * Math.sin(radians)
    };
  }

  function makeParts(item) {
    partsGroup.replaceChildren();
    shaded = new Set();

    for (let index = 0; index < item.d; index += 1) {
      const start = index * 360 / item.d;
      const end = (index + 1) * 360 / item.d;
      const first = point(120, 120, 105, start);
      const second = point(120, 120, 105, end);
      const large = end - start > 180 ? 1 : 0;
      const path = document.createElementNS(ns, 'path');

      path.setAttribute('d',
        'M 120 120 L ' + first.x + ' ' + first.y +
        ' A 105 105 0 ' + large + ' 1 ' + second.x + ' ' + second.y + ' Z'
      );
      path.setAttribute('fill', '#f4ead7');
      path.setAttribute('stroke', '#b97b3e');
      path.setAttribute('stroke-width', '3');
      path.setAttribute('stroke-linejoin', 'round');
      path.setAttribute('data-part', String(index));
      path.setAttribute('data-shaded', 'false');
      path.setAttribute('tabindex', '0');
      path.setAttribute('role', 'button');
      path.setAttribute('aria-label', Studio.t('instr'));

      const toggle = () => {
        if (waiting) return;
        const isShaded = path.getAttribute('data-shaded') === 'true';
        path.setAttribute('data-shaded', isShaded ? 'false' : 'true');
        if (isShaded) shaded.delete(index);
        else shaded.add(index);
        card.classList.remove('wrong');
        feedback.textContent = '';
        Studio.event('part_toggle', {
          item: item.id,
          part: index,
          shaded: !isShaded,
          picture: pictureMode
        });
      };

      path.addEventListener('click', toggle);
      path.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          toggle();
        }
      });
      partsGroup.appendChild(path);
    }
  }

  function showItem() {
    const item = items[current];
    waiting = false;
    card.className = 'game-card';
    card.setAttribute('data-item', String(item.id));
    target.textContent = String(item.n) + '/' + String(item.d);
    feedback.textContent = '';
    check.disabled = false;
    makeParts(item);
    Studio.event('item_show', {item: item.id, picture: pictureMode});
  }

  function showDone() {
    if (finished) return;
    finished = true;
    app.innerHTML =
      '<section class="done-card">' +
        '<svg class="done-bloom" viewBox="0 0 160 160" aria-hidden="true">' +
          '<circle cx="80" cy="80" r="68" fill="#e3f8ef"/>' +
          '<circle cx="80" cy="45" r="25" fill="#ffca62"/>' +
          '<circle cx="112" cy="66" r="25" fill="#ef88a3"/>' +
          '<circle cx="100" cy="104" r="25" fill="#74d4aa"/>' +
          '<circle cx="60" cy="104" r="25" fill="#a990e5"/>' +
          '<circle cx="48" cy="66" r="25" fill="#ff9f43"/>' +
          '<circle cx="80" cy="78" r="27" fill="#fff9ec"/>' +
          '<path d="M66 78q14 18 29 0" fill="none" stroke="#3c3552" stroke-width="5" stroke-linecap="round"/>' +
          '<circle cx="68" cy="69" r="4" fill="#3c3552"/>' +
          '<circle cx="94" cy="69" r="4" fill="#3c3552"/>' +
        '</svg>' +
        '<h2>' + Studio.t('done') + '</h2>' +
      '</section>';
    Studio.event('activity_done', {});
    Studio.done();
  }

  check.addEventListener('click', () => {
    if (waiting || finished) return;
    waiting = true;
    check.disabled = true;
    feedback.textContent = '';
    const item = items[current];
    Studio.event('check', {item: item.id, coloured: shaded.size});
    Studio.answer({n: shaded.size, d: item.d});
  });

  Studio.onVerdict(verdict => {
    if (!waiting || finished) return;

    if (verdict.correct) {
      card.classList.remove('wrong');
      card.classList.add('correct');
      feedback.textContent = Studio.t('right');
      Studio.event('verdict', {item: items[current].id, correct: true});

      window.setTimeout(() => {
        current += 1;
        if (current >= items.length) showDone();
        else showItem();
      }, 850);
    } else {
      waiting = false;
      check.disabled = false;
      card.classList.remove('correct');
      card.classList.add('wrong');
      feedback.textContent = Studio.t('wrong') + ' · ' + Studio.t('hint');
      Studio.event('verdict', {item: items[current].id, correct: false});
    }
  });

  if (items.length) showItem();
  else showDone();

  Studio.ready();
})();
</script>
