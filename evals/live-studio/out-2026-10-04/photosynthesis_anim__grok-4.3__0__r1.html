<style>
:root { --bg:#f0f9f0; --green:#4ade80; --leaf:#22c55e; --soil:#92400e; --sun:#fbbf24; --blue:#3b82f6; --co2:#a78bfa; --o2:#f87171; --glu:#eab308; }
body { margin:0; padding:0; width:360px; height:640px; background:#f0f9f0; font-family: system-ui, -apple-system, sans-serif; overflow:hidden; }
.wrapper { width:360px; height:640px; display:flex; flex-direction:column; overflow:hidden; }
.scene { width:100%; height:290px; background:#e0f2fe; flex:0 0 290px; position:relative; }
svg { width:100%; height:100%; display:block; }
.controls { padding:6px 10px; background:white; border-top:2px solid #86efac; flex:0 0 auto; }
.play-row { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
.btn { min-width:48px; min-height:48px; padding:8px 12px; border:none; border-radius:9999px; font-size:15px; font-weight:600; cursor:pointer; transition:transform .08s ease; display:flex; align-items:center; justify-content:center; }
.btn:active { transform:scale(0.93); }
.play-btn { background:#4ade80; color:#166534; box-shadow:0 2px 0 #16a34a; }
.play-btn[data-playing="true"] { background:#f87171; color:#9f1239; }
.steps { display:flex; gap:6px; }
.step-btn { flex:1; min-height:44px; background:#dcfce7; color:#166534; font-size:15px; font-weight:700; border:2px solid #86efac; }
.step-btn.active { background:#22c55e; color:white; border-color:#15803d; transform:scale(1.04); }
.caption { margin:4px 8px 0; padding:8px 10px; background:#fefce8; border:2px solid #fde047; border-radius:10px; font-size:13px; color:#713f12; min-height:36px; display:flex; align-items:center; }
.question { padding:8px 10px; background:white; border-top:3px solid #eab308; flex:0 0 auto; }
.ask-text { font-size:14px; font-weight:600; color:#713f12; margin-bottom:6px; }
.options { display:flex; gap:8px; }
.opt-btn { flex:1; min-height:48px; background:#fefce8; border:2px solid #eab308; color:#713f12; font-weight:700; font-size:14px; border-radius:9999px; }
.opt-btn:active { transform:scale(0.94); background:#fde047; }
.feedback { margin-top:6px; font-size:13px; font-weight:600; text-align:center; min-height:18px; }
.particle { transition: cx .07s linear, cy .07s linear; }
.light-ray { stroke:#fbbf24; stroke-width:3; stroke-opacity:0.55; }
.glow { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:0.65} 50%{opacity:1} }
</style>
<div class="wrapper">
<svg id="scene" width="360" height="290" viewBox="0 0 360 290" xmlns="http://www.w3.org/2000/svg">
  <circle cx="180" cy="38" r="26" fill="#fbbf24" data-label="sun"/>
  <line x1="152" y1="52" x2="172" y2="98" class="light-ray"/>
  <line x1="208" y1="52" x2="188" y2="98" class="light-ray"/>
  <line x1="165" y1="46" x2="178" y2="100" class="light-ray"/>
  <line x1="195" y1="46" x2="182" y2="100" class="light-ray"/>
  <rect x="0" y="230" width="360" height="60" fill="#92400e"/>
  <rect x="0" y="230" width="360" height="12" fill="#78350f"/>
  <path d="M178 195 Q162 222 148 248" fill="none" stroke="#854d0e" stroke-width="6" stroke-linecap="round" data-entity="roots"/>
  <path d="M182 195 Q198 218 215 248" fill="none" stroke="#854d0e" stroke-width="6" stroke-linecap="round" data-entity="roots"/>
  <path d="M180 193 Q170 225 155 250" fill="none" stroke="#713f12" stroke-width="4" stroke-linecap="round" data-entity="roots"/>
  <rect x="174" y="118" width="12" height="82" rx="6" fill="#16a34a"/>
  <ellipse cx="248" cy="112" rx="52" ry="28" fill="#22c55e" stroke="#15803d" stroke-width="5" data-entity="leaf"/>
  <ellipse cx="248" cy="112" rx="32" ry="15" fill="#4ade80" opacity="0.45"/>
  <circle id="glucose" cx="248" cy="112" r="11" fill="#eab308" opacity="0" data-label="glucose"/>
  <text data-label="sun" x="180" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#713f12"/>
  <text data-label="leaf" x="305" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#166534"/>
  <text data-label="roots" x="180" y="265" text-anchor="middle" font-size="10" font-weight="700" fill="#fefce8"/>
  <text data-label="water" x="115" y="195" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af"/>
  <text data-label="co2" x="320" y="85" text-anchor="middle" font-size="10" font-weight="700" fill="#6b21a8"/>
  <text data-label="o2" x="95" y="72" text-anchor="middle" font-size="10" font-weight="700" fill="#9f1239"/>
  <circle r="4.5" fill="#3b82f6" data-flow="water"/>
  <circle r="4.5" fill="#3b82f6" data-flow="water"/>
  <circle r="4.5" fill="#3b82f6" data-flow="water"/>
  <circle r="4" fill="#a78bfa" data-flow="co2"/>
  <circle r="4" fill="#a78bfa" data-flow="co2"/>
  <circle r="4" fill="#a78bfa" data-flow="co2"/>
  <circle r="4" fill="#f87171" data-flow="o2"/>
  <circle r="4" fill="#f87171" data-flow="o2"/>
  <circle r="4" fill="#f87171" data-flow="o2"/>
</svg>
<div class="controls">
  <div class="play-row">
    <button class="btn play-btn" data-action="play"><span id="play-label"></span></button>
    <div class="steps">
      <button class="btn step-btn" data-action="step-1">1</button>
      <button class="btn step-btn" data-action="step-2">2</button>
      <button class="btn step-btn" data-action="step-3">3</button>
      <button class="btn step-btn" data-action="step-4">4</button>
      <button class="btn step-btn" data-action="step-5">5</button>
    </div>
  </div>
  <div class="caption" data-caption></div>
</div>
<div class="question">
  <div class="ask-text" data-label="ask"></div>
  <div class="options">
    <button class="btn opt-btn" data-option="co2"></button>
    <button class="btn opt-btn" data-option="o2"></button>
    <button class="btn opt-btn" data-option="water"></button>
  </div>
  <div class="feedback" id="feedback"></div>
</div>
</div>
<script>
(function(){
  const svg = document.getElementById('scene');
  const playBtn = document.querySelector('[data-action="play"]');
  const playLabel = document.getElementById('play-label');
  const captionEl = document.querySelector('[data-caption]');
  const feedbackEl = document.getElementById('feedback');
  const stepBtns = document.querySelectorAll('[data-action^="step-"]');
  const optBtns = document.querySelectorAll('[data-option]');
  const glucose = document.getElementById('glucose');
  let playing = true;
  let currentStep = 1;
  let animFrame = null;
  let particles = [];
  function t(key){ return Studio.t ? Studio.t(key) : key; }
  function populateTexts(){
    document.querySelectorAll('[data-label]').forEach(el => {
      const k = el.getAttribute('data-label');
      if(k) el.textContent = t(k);
    });
    document.querySelectorAll('[data-option]').forEach(el => {
      const k = el.getAttribute('data-option');
      if(k) el.textContent = t(k);
    });
    playLabel.textContent = playing ? t('pause') : t('play');
    const askEl = document.querySelector('[data-label="ask"]');
    if(askEl) askEl.textContent = t('ask');
  }
  function initParticles(){
    particles = [];
    const waterPs = svg.querySelectorAll('[data-flow="water"]');
    const co2Ps = svg.querySelectorAll('[data-flow="co2"]');
    const o2Ps = svg.querySelectorAll('[data-flow="o2"]');
    waterPs.forEach((p,i) => {
      p.setAttribute('cx', 180 + (i-1)*6);
      p.setAttribute('cy', 210 - i*15);
      particles.push({el:p, type:'water', progress: i*0.32});
    });
    co2Ps.forEach((p,i) => {
      p.setAttribute('cx', 305 - i*18);
      p.setAttribute('cy', 105 + (i-1)*9);
      particles.push({el:p, type:'co2', progress: i*0.32});
    });
    o2Ps.forEach((p,i) => {
      p.setAttribute('cx', 248 + (i-1)*11);
      p.setAttribute('cy', 95 - i*10);
      particles.push({el:p, type:'o2', progress: i*0.32});
    });
  }
  function animateParticles(){
    if(!playing) return;
    const leafX = 248, leafY = 112;
    const rootY = 195;
    particles.forEach(p => {
      const el = p.el;
      if(p.type === 'water'){
        p.progress = (p.progress + 0.015) % 1;
        const x = 180 + Math.sin(p.progress*6.28)*2.5;
        const y = rootY - p.progress * 82;
        el.setAttribute('cx', x);
        el.setAttribute('cy', Math.max(y, leafY+8));
        el.setAttribute('opacity', p.progress > 0.9 ? '0.35' : '1');
      } else if(p.type === 'co2'){
        p.progress = (p.progress + 0.019) % 1;
        const x = 295 - p.progress * 55;
        const y = 108 + Math.sin(p.progress*8)*6;
        el.setAttribute('cx', x);
        el.setAttribute('cy', y);
        el.setAttribute('opacity', x < leafX+22 ? '0.3' : '1');
      } else if(p.type === 'o2'){
        p.progress = (p.progress + 0.017) % 1;
        const x = leafX - 22 + p.progress * 48;
        const y = leafY - 18 - p.progress * 72;
        el.setAttribute('cx', x);
        el.setAttribute('cy', y);
      }
    });
    if(currentStep === 5){
      glucose.setAttribute('opacity', 0.8 + Math.sin(Date.now()/260)*0.2);
      glucose.classList.add('glow');
    } else {
      glucose.setAttribute('opacity', currentStep === 1 ? '0.12' : '0');
      glucose.classList.remove('glow');
    }
  }
  function loop(){
    animateParticles();
    animFrame = requestAnimationFrame(loop);
  }
  function setPlaying(state){
    playing = state;
    playBtn.setAttribute('data-playing', playing);
    playLabel.textContent = playing ? t('pause') : t('play');
    if(playing && !animFrame){
      animFrame = requestAnimationFrame(loop);
    }
    if(!playing && animFrame){
      cancelAnimationFrame(animFrame);
      animFrame = null;
    }
    Studio.event && Studio.event('toggle_play', {playing});
  }
  function showStep(step){
    currentStep = step;
    stepBtns.forEach(b => b.classList.remove('active'));
    const activeBtn = document.querySelector(`[data-action="step-${step}"]`);
    if(activeBtn) activeBtn.classList.add('active');
    captionEl.textContent = t('step' + step);
    const leaf = svg.querySelector('[data-entity="leaf"]');
    const roots = svg.querySelector('[data-entity="roots"]');
    if(leaf) leaf.style.filter = '';
    if(roots) roots.style.filter = '';
    svg.querySelectorAll('.light-ray').forEach(r => r.style.stroke = '#fbbf24');
    if(step === 1){
      svg.querySelectorAll('.light-ray').forEach(r => r.style.stroke = '#fde047');
    }
    if(step === 2 && roots) roots.style.filter = 'drop-shadow(0 0 4px #3b82f6)';
    if(step === 3 && leaf) leaf.style.filter = 'drop-shadow(0 0 5px #a78bfa)';
    if(step === 4 && leaf) leaf.style.filter = 'drop-shadow(0 0 5px #f87171)';
    if(step === 5){
      glucose.setAttribute('opacity', '0.85');
    }
    Studio.event && Studio.event('step_change', {step});
  }
  function setupControls(){
    playBtn.addEventListener('click', () => { setPlaying(!playing); });
    stepBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const step = parseInt(btn.getAttribute('data-action').split('-')[1]);
        showStep(step);
        if(!playing) setPlaying(true);
      });
    });
    optBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const val = btn.getAttribute('data-option');
        Studio.answer(val);
      });
    });
  }
  function initVerdict(){
    Studio.onVerdict && Studio.onVerdict(({correct}) => {
      if(correct){
        feedbackEl.textContent = 'Bahut accha!';
        feedbackEl.style.color = '#166534';
        setTimeout(() => { Studio.done(); }, 620);
      } else {
        feedbackEl.textContent = 'Phir se socho...';
        feedbackEl.style.color = '#b45309';
        setTimeout(() => { feedbackEl.textContent = ''; }, 1100);
      }
    });
  }
  function start(){
    populateTexts();
    initParticles();
    setupControls();
    initVerdict();
    showStep(1);
    setPlaying(true);
    Studio.ready && Studio.ready();
  }
  start();
})();
</script>
