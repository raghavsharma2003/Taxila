<style>
  *{box-sizing:border-box}
  :root{color-scheme:light}
  .activity{
    width:100%;
    min-height:100vh;
    margin:0;
    padding:16px 12px 20px;
    overflow:hidden;
    font-family:system-ui,-apple-system,sans-serif;
    color:#294554;
    background:
      radial-gradient(circle at 10% 7%,rgba(255,209,102,.32),transparent 24%),
      radial-gradient(circle at 94% 17%,rgba(91,196,183,.22),transparent 27%),
      linear-gradient(180deg,#fffaf1,#f2fbfa);
  }
  .top{
    padding:2px 6px 10px;
    text-align:center;
  }
  .title{
    margin:0;
    color:#294a5e;
    font-size:clamp(23px,7vw,30px);
    font-weight:850;
    line-height:1.15;
  }
  .ask{
    min-height:44px;
    margin:7px auto 0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#566b76;
    font-size:16px;
    font-weight:680;
    line-height:1.3;
  }
  .chart-card{
    width:100%;
    max-width:520px;
    margin:auto;
    padding:8px 4px 6px;
    overflow:hidden;
    border:1px solid rgba(42,91,103,.11);
    border-radius:24px;
    background:rgba(255,255,255,.9);
    box-shadow:0 12px 30px rgba(42,82,91,.12);
  }
  #chart{
    display:block;
    width:100%;
    height:auto;
  }
  .grid{
    stroke:#d6e5e5;
    stroke-width:1;
    stroke-dasharray:4 5;
  }
  .axis{
    stroke:#617881;
    stroke-width:2;
    stroke-linecap:round;
  }
  .tick-label{
    fill:#60747c;
    font-size:12px;
    font-weight:700;
    text-anchor:end;
    dominant-baseline:middle;
  }
  .fruit-label{
    fill:#304f5c;
    font-size:11px;
    font-weight:780;
    text-anchor:middle;
  }
  .axis-title{
    fill:#526b76;
    font-size:12px;
    font-weight:780;
    text-anchor:middle;
  }
  .bar{
    fill:#43a69a;
    stroke:#278478;
    stroke-width:1.5;
    cursor:pointer;
    outline:none;
    clip-path:inset(100% 0 0 0 round 14px);
    animation:grow .85s cubic-bezier(.2,.8,.25,1) forwards;
    filter:drop-shadow(0 4px 3px rgba(35,68,75,.15));
    transition:filter .18s ease,opacity .18s ease;
  }
  .bar:active{
    filter:brightness(1.08) drop-shadow(0 2px 2px rgba(35,68,75,.12));
  }
  .bar.popped{
    animation:pop .28s ease, grow .01s forwards;
  }
  .value-bubble{
    opacity:0;
    transform:translateY(5px) scale(.86);
    transform-box:fill-box;
    transform-origin:center;
    pointer-events:none;
    transition:opacity .2s ease,transform .24s cubic-bezier(.2,.8,.25,1.2);
  }
  .value-bubble.show{
    opacity:1;
    transform:translateY(0) scale(1);
  }
  .bubble-shape{
    fill:#294554;
    stroke:#fff;
    stroke-width:2;
  }
  .bubble-text{
    fill:#fff;
    font-size:13px;
    font-weight:850;
    text-anchor:middle;
    dominant-baseline:middle;
  }
  .feedback{
    min-height:64px;
    padding:8px 10px 2px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    color:#3b6470;
    text-align:center;
    font-size:19px;
    font-weight:850;
    line-height:1.2;
  }
  .feedback.show{animation:feedbackIn .35s cubic-bezier(.2,.8,.25,1.2)}
  .feedback.right{color:#248163}
  .feedback.wrong{color:#b64b58}
  .done{
    color:#526b76;
    font-size:15px;
    font-weight:720;
  }
  @keyframes grow{
    from{clip-path:inset(100% 0 0 0 round 14px)}
    to{clip-path:inset(0 0 0 0 round 14px)}
  }
  @keyframes pop{
    0%,100%{filter:brightness(1) drop-shadow(0 4px 3px rgba(35,68,75,.15))}
    50%{filter:brightness(1.15) drop-shadow(0 6px 4px rgba(35,68,75,.2))}
  }
  @keyframes feedbackIn{
    from{opacity:0;transform:translateY(7px) scale(.95)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
  @media (prefers-reduced-motion:reduce){
    .bar{animation-duration:.01ms}
    .value-bubble{transition:none}
    .feedback.show{animation:none}
  }
</style>

<main class="activity">
  <header class="top">
    <h1 class="title" id="title"></h1>
    <div class="ask" id="ask"></div>
  </header>
  <section class="chart-card">
    <svg id="chart" viewBox="0 0 360 410" role="img" aria-labelledby="title">
      <g id="gridLayer"></g>
      <g id="axisLayer"></g>
      <g id="barLayer"></g>
      <g id="labelLayer"></g>
      <g id="bubbleLayer"></g>
    </svg>
    <div class="feedback" id="feedback" aria-live="polite"></div>
  </section>
</main>

<script>
(() => {
  const data = Studio.params.data;
  const NS = 'http://www.w3.org/2000/svg';
  const title = document.getElementById('title');
  const ask = document.getElementById('ask');
  const feedback = document.getElementById('feedback');
  const gridLayer = document.getElementById('gridLayer');
  const axisLayer = document.getElementById('axisLayer');
  const barLayer = document.getElementById('barLayer');
  const labelLayer = document.getElementById('labelLayer');
  const bubbleLayer = document.getElementById('bubbleLayer');

  title.textContent = Studio.t('title');
  ask.textContent = Studio.t('ask');

  const make = (name, attrs, parent) => {
    const node = document.createElementNS(NS, name);
    Object.keys(attrs).forEach(key => node.setAttribute(key, attrs[key]));
    if (parent) parent.appendChild(node);
    return node;
  };

  const left = 56;
  const right = 350;
  const top = 28;
  const bottom = 326;
  const plotHeight = bottom - top;
  const plotWidth = right - left;
  const maxValue = Math.max(...data.map(item => item.value));
  const desiredIntervals = Math.max(1, data.length - 1);
  const rawStep = maxValue / desiredIntervals;
  const magnitude = Math.pow(10, Math.floor(Math.log10(rawStep || 1)));
  const normalized = rawStep / magnitude;
  const stepFactor = normalized <= 1 ? 1 : normalized <= 2 ? 2 : normalized <= 5 ? 5 : 10;
  const step = stepFactor * magnitude;
  const scaleMax = Math.ceil(maxValue / step) * step;
  const yFor = value => bottom - value / scaleMax * plotHeight;

  for (let value = 0; value <= scaleMax; value += step) {
    const y = yFor(value);
    make('line', {x1:left, y1:y, x2:right, y2:y, class:'grid'}, gridLayer);
    const tick = make('text', {
      x:left - 9,
      y:y,
      class:'tick-label',
      'data-tick':String(value)
    }, axisLayer);
    tick.textContent = String(value);
  }

  make('line', {x1:left, y1:top, x2:left, y2:bottom, class:'axis'}, axisLayer);
  make('line', {x1:left, y1:bottom, x2:right, y2:bottom, class:'axis'}, axisLayer);

  const axisTitle = make('text', {
    x:17,
    y:(top + bottom) / 2,
    class:'axis-title',
    transform:'rotate(-90 17 ' + ((top + bottom) / 2) + ')'
  }, axisLayer);
  axisTitle.textContent = Studio.t('yaxis');

  const slot = plotWidth / data.length;
  const barWidth = Math.min(52, slot * .88);
  let locked = false;
  let activeBubble = null;

  data.forEach((item, index) => {
    const center = left + slot * (index + .5);
    const y = yFor(item.value);
    const height = bottom - y;

    const bar = make('rect', {
      x:center - barWidth / 2,
      y:y,
      width:barWidth,
      height:height,
      rx:Math.min(14, barWidth / 4),
      class:'bar',
      tabindex:'0',
      role:'button',
      'aria-label':Studio.t(item.key),
      'data-bar':item.key,
      'data-value':String(item.value)
    }, barLayer);

    const label = make('text', {
      x:center,
      y:bottom + 25,
      class:'fruit-label'
    }, labelLayer);
    label.textContent = Studio.t(item.key);

    const bubble = make('g', {class:'value-bubble'}, bubbleLayer);
    const bubbleY = Math.max(5, y - 31);
    make('rect', {
      x:center - 22,
      y:bubbleY,
      width:44,
      height:28,
      rx:14,
      class:'bubble-shape'
    }, bubble);
    const bubbleText = make('text', {
      x:center,
      y:bubbleY + 14,
      class:'bubble-text'
    }, bubble);
    bubbleText.textContent = String(item.value);

    const choose = () => {
      if (locked) return;
      if (activeBubble) activeBubble.classList.remove('show');
      activeBubble = bubble;
      bubble.classList.add('show');
      bar.classList.remove('popped');
      void bar.getBoundingClientRect();
      bar.classList.add('popped');
      Studio.event('bar_tap', {key:item.key, value:item.value});
      Studio.answer(item.key);
    };

    bar.addEventListener('click', choose);
    bar.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        choose();
      }
    });
  });

  Studio.onVerdict(result => {
    feedback.replaceChildren();
    feedback.className = 'feedback show ' + (result.correct ? 'right' : 'wrong');

    const verdict = document.createElement('div');
    verdict.textContent = Studio.t(result.correct ? 'right' : 'wrong');
    feedback.appendChild(verdict);

    if (result.correct) {
      locked = true;
      const done = document.createElement('div');
      done.className = 'done';
      done.textContent = Studio.t('done');
      feedback.appendChild(done);
      Studio.done();
    }
  });

  Studio.ready();
})();
</script>
