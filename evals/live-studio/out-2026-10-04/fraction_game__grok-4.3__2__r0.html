<style>
  :root { --bg:#FFF8E7; --accent:#E76F51; --crust:#D35400; --base:#F4A261; --green:#2A9D8F; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { width:360px; height:640px; background:var(--bg); font-family:system-ui,-apple-system,sans-serif; overflow:hidden; color:#3D2B1F; }
  #root { width:100%; height:100%; display:flex; flex-direction:column; padding:16px; gap:12px; }
  #title { font-size:28px; font-weight:700; text-align:center; color:#264653; }
  #instr { font-size:18px; text-align:center; line-height:1.3; color:#4A3728; }
  #frac { font-size:48px; font-weight:800; text-align:center; color:#264653; margin:4px 0; }
  #item-container { display:flex; justify-content:center; align-items:center; flex:1; min-height:280px; }
  svg { width:300px; height:300px; filter:drop-shadow(0 8px 16px rgba(0,0,0,0.15)); }
  path { cursor:pointer; transition:fill 0.15s ease, transform 0.1s ease; transform-origin:center; }
  path:active { transform:scale(0.92); }
  #check { width:100%; height:56px; font-size:22px; font-weight:700; background:var(--green); color:white; border:none; border-radius:9999px; box-shadow:0 4px 0 #1E6B5F; cursor:pointer; }
  #check:active { transform:scale(0.97); box-shadow:0 2px 0 #1E6B5F; }
  #feedback { min-height:32px; font-size:20px; text-align:center; font-weight:600; }
  #hint { font-size:16px; text-align:center; color:#6B5B4F; min-height:24px; }
  .done { font-size:32px; text-align:center; padding-top:120px; color:#264653; }
  .celebrate { animation:pop 0.6s ease; }
  @keyframes pop { 0%{transform:scale(0.8)} 50%{transform:scale(1.1)} 100%{transform:scale(1)} }
</style>
<div id="root">
  <div id="title"></div>
  <div id="instr"></div>
  <div id="frac"><span id="num"></span>/<span id="den"></span></div>
  <div id="item-container" data-item="i1">
    <svg id="pizza-svg" width="300" height="300" viewBox="0 0 300 300">
      <path d="M150 150 L150 10 A140 140 0 0 1 238.99 80.99 Z" fill="#F4A261" stroke="#D35400" stroke-width="5" data-part="0" data-shaded="false"/>
      <path d="M150 150 L238.99 80.99 A140 140 0 0 1 238.99 219.01 Z" fill="#F4A261" stroke="#D35400" stroke-width="5" data-part="1" data-shaded="false"/>
      <path d="M150 150 L238.99 219.01 A140 140 0 0 1 150 290 Z" fill="#F4A261" stroke="#D35400" stroke-width="5" data-part="2" data-shaded="false"/>
      <path d="M150 150 L150 290 A140 140 0 0 1 61.01 219.01 Z" fill="#F4A261" stroke="#D35400" stroke-width="5" data-part="3" data-shaded="false"/>
    </svg>
  </div>
  <div id="hint"></div>
  <button id="check" data-action="check"></button>
  <div id="feedback"></div>
</div>
<script>
const params = Studio.params;
const items = params.items;
let current = 0;
const svg = document.getElementById('pizza-svg');
const numEl = document.getElementById('num');
const denEl = document.getElementById('den');
const container = document.getElementById('item-container');
const feedback = document.getElementById('feedback');
const hintEl = document.getElementById('hint');
const checkBtn = document.getElementById('check');
function setTexts() {
  document.getElementById('title').textContent = Studio.t('title');
  document.getElementById('instr').textContent = Studio.t('instr');
  checkBtn.textContent = Studio.t('check');
}
function toggleShade(path) {
  const isShaded = path.dataset.shaded === 'true';
  path.dataset.shaded = isShaded ? 'false' : 'true';
  path.setAttribute('fill', isShaded ? '#F4A261' : '#E76F51');
  path.style.transition = 'transform .08s ease';
  path.style.transform = 'scale(0.9)';
  setTimeout(() => { path.style.transform = 'scale(1)'; }, 80);
  Studio.event('tap_part', {part: path.dataset.part, shaded: !isShaded});
}
function attachListeners() {
  svg.querySelectorAll('path').forEach(p => {
    p.onclick = () => toggleShade(p);
  });
}
function rebuildPizza(d) {
  svg.innerHTML = '';
  const cx = 150, cy = 150, r = 140;
  for (let i = 0; i < d; i++) {
    const a0 = -Math.PI/2 + (i * 2 * Math.PI / d);
    const a1 = -Math.PI/2 + ((i + 1) * 2 * Math.PI / d);
    const x1 = cx + r * Math.cos(a0);
    const y1 = cy + r * Math.sin(a0);
    const x2 = cx + r * Math.cos(a1);
    const y2 = cy + r * Math.sin(a1);
    const large = (a1 - a0 > Math.PI) ? 1 : 0;
    const dAttr = `M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z`;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', dAttr);
    path.setAttribute('fill', '#F4A261');
    path.setAttribute('stroke', '#D35400');
    path.setAttribute('stroke-width', '5');
    path.dataset.part = i;
    path.dataset.shaded = 'false';
    path.onclick = () => toggleShade(path);
    svg.appendChild(path);
  }
}
function loadItem(idx) {
  const item = items[idx];
  container.dataset.item = item.id;
  numEl.textContent = item.n;
  denEl.textContent = item.d;
  feedback.textContent = '';
  hintEl.textContent = '';
  if (idx === 0) {
    attachListeners();
  } else {
    rebuildPizza(item.d);
  }
}
function celebrate() {
  svg.classList.add('celebrate');
  setTimeout(() => svg.classList.remove('celebrate'), 650);
}
function showDone() {
  const root = document.getElementById('root');
  root.innerHTML = `<div class="done">${Studio.t('done')}</div>`;
  Studio.done();
}
checkBtn.onclick = () => {
  const shadedPaths = container.querySelectorAll('path[data-shaded="true"]');
  const n = shadedPaths.length;
  const d = parseInt(denEl.textContent, 10);
  Studio.answer({n, d});
  Studio.event('submit', {n, d, target: items[current].n});
};
Studio.onVerdict(v => {
  if (v.correct) {
    feedback.style.color = '#2A9D8F';
    feedback.textContent = Studio.t('right');
    celebrate();
    setTimeout(() => {
      current++;
      if (current < items.length) {
        loadItem(current);
      } else {
        showDone();
      }
    }, 1350);
  } else {
    feedback.style.color = '#E76F51';
    feedback.textContent = Studio.t('wrong');
    hintEl.textContent = Studio.t('hint');
  }
});
setTexts();
loadItem(0);
Studio.ready();
</script>
