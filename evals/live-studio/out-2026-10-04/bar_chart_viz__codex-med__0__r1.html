<style>
  :root{
    --bg1:#f7f5ff;
    --bg2:#efeaff;
    --card:#ffffff;
    --ink:#2e2a4d;
    --muted:#746c9f;
    --grid:#e4def8;
    --bar:#7b8dff;
    --barTop:#9eabff;
    --barPress:#5f73f2;
    --ok:#1d9b66;
    --bad:#d44b59;
    --pill:#fff3cf;
  }
  *{box-sizing:border-box}
  #app{
    width:100%;
    min-height:100vh;
    margin:0;
    padding:10px;
    background:linear-gradient(180deg,var(--bg1),var(--bg2));
    display:flex;
    justify-content:center;
    align-items:flex-start;
    overflow:hidden;
    font-family:ui-rounded,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color:var(--ink);
  }
  #card{
    width:min(100%,360px);
    background:var(--card);
    border-radius:18px;
    box-shadow:0 10px 28px rgba(72,54,130,.14);
    padding:12px;
  }
  #title{
    font-size:22px;
    font-weight:800;
    line-height:1.2;
    margin:2px 2px 8px;
  }
  #ask{
    font-size:16px;
    font-weight:700;
    color:#544c7d;
    line-height:1.35;
    margin:0 2px 8px;
    min-height:22px;
  }
  #value{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:28px;
    min-width:50px;
    padding:4px 12px;
    border-radius:999px;
    background:var(--pill);
    color:#5e4c21;
    font-weight:800;
    margin:0 2px 8px;
    opacity:0;
    transform:scale(.9);
    transition:opacity .2s ease, transform .2s ease;
  }
  #value.show{opacity:1;transform:scale(1)}
  #chartWrap{
    display:grid;
    grid-template-columns:26px 1fr;
    gap:4px;
    align-items:stretch;
  }
  #yaxis{
    writing-mode:vertical-rl;
    transform:rotate(180deg);
    text-align:center;
    color:var(--muted);
    font-size:12px;
    font-weight:800;
    letter-spacing:.2px;
    user-select:none;
    padding-top:8px;
  }
  #chartArea{min-width:0}
  #plot{
    position:relative;
    height:280px;
    border-radius:12px;
    background:linear-gradient(180deg,#fcfbff,#f8f5ff);
    overflow:hidden;
  }
  #tickLayer{
    position:absolute;
    inset:0;
    pointer-events:none;
  }
  .tickLabel{
    position:absolute;
    left:2px;
    font-size:12px;
    font-weight:700;
    color:#837ab1;
    line-height:1;
  }
  .gridLine{
    position:absolute;
    left:34px;
    right:8px;
    border-top:1.5px solid var(--grid);
    height:0;
  }
  #bars{
    position:absolute;
    left:34px;
    right:8px;
    top:8px;
    bottom:0;
    display:grid;
    gap:8px;
    align-items:stretch;
  }
  .barSlot{
    position:relative;
    width:100%;
    height:100%;
    min-width:44px;
    min-height:44px;
    border:none;
    background:transparent;
    padding:0;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .barFill{
    width:78%;
    height:0%;
    border-radius:12px 12px 4px 4px;
    background:linear-gradient(180deg,var(--barTop),var(--bar));
    box-shadow:inset 0 -2px 0 rgba(48,61,145,.25);
    transition:height .85s cubic-bezier(.2,.8,.2,1), transform .12s ease, filter .2s ease;
    transform-origin:bottom center;
    pointer-events:none;
  }
  .barSlot:active .barFill{
    transform:scale(.98);
    background:linear-gradient(180deg,#8295ff,var(--barPress));
  }
  .barSlot.selected .barFill{animation:pulse .45s ease}
  @keyframes pulse{
    0%{transform:scale(1)}
    45%{transform:scale(1.04)}
    100%{transform:scale(1)}
  }
  #xlabels{
    margin-top:8px;
    margin-left:34px;
    margin-right:8px;
    display:grid;
    gap:8px;
  }
  .xlab{
    min-width:44px;
    text-align:center;
    font-size:13px;
    font-weight:700;
    color:#5f568a;
    line-height:1.2;
    min-height:32px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }
  #feedback{
    margin-top:8px;
    min-height:24px;
    font-size:17px;
    font-weight:800;
  }
  #feedback.ok{color:var(--ok)}
  #feedback.no{color:var(--bad)}
  #done{
    min-height:22px;
    font-size:16px;
    font-weight:800;
    color:#3f7d57;
    margin-top:2px;
  }
  .locked .barSlot{pointer-events:none}
</style>

<div id="app">
  <div id="card">
    <div id="title"></div>
    <div id="ask"></div>
    <div id="value"></div>
    <div id="chartWrap">
      <div id="yaxis"></div>
      <div id="chartArea">
        <div id="plot">
          <div id="tickLayer"></div>
          <div id="bars"></div>
        </div>
        <div id="xlabels"></div>
      </div>
    </div>
    <div id="feedback"></div>
    <div id="done"></div>
  </div>
</div>

<script>
(function(){
  const data = Array.isArray(Studio.params && Studio.params.data) ? Studio.params.data.slice() : [];
  const titleEl = document.getElementById('title');
  const askEl = document.getElementById('ask');
  const yAxisEl = document.getElementById('yaxis');
  const tickLayer = document.getElementById('tickLayer');
  const barsEl = document.getElementById('bars');
  const xlabelsEl = document.getElementById('xlabels');
  const valueEl = document.getElementById('value');
  const feedbackEl = document.getElementById('feedback');
  const doneEl = document.getElementById('done');
  const appEl = document.getElementById('app');

  titleEl.textContent = Studio.t('title');
  askEl.textContent = Studio.t('ask');
  yAxisEl.textContent = Studio.t('yaxis');

  const maxVal = data.reduce((m,d)=>Math.max(m, Number(d.value)||0), 0);

  function niceStep(maximum){
    if (maximum <= 5) return 1;
    const rough = maximum / 4;
    const mag = Math.pow(10, Math.floor(Math.log10(rough)));
    const n = rough / mag;
    if (n <= 1) return 1 * mag;
    if (n <= 2) return 2 * mag;
    if (n <= 5) return 5 * mag;
    return 10 * mag;
  }

  const step = niceStep(maxVal || 1);
  const topTick = Math.max(step, Math.ceil((maxVal || 1) / step) * step);

  const ticks = [];
  for(let v=0; v<=topTick; v+=step){ ticks.push(v); }

  ticks.forEach((v)=>{
    const p = (v / topTick) * 100;

    const label = document.createElement('div');
    label.className = 'tickLabel';
    label.setAttribute('data-tick', String(v));
    label.textContent = String(v);
    label.style.bottom = p + '%';
    tickLayer.appendChild(label);

    const line = document.createElement('div');
    line.className = 'gridLine';
    line.style.bottom = p + '%';
    tickLayer.appendChild(line);
  });

  barsEl.style.gridTemplateColumns = `repeat(${data.length}, minmax(44px, 1fr))`;
  xlabelsEl.style.gridTemplateColumns = `repeat(${data.length}, minmax(44px, 1fr))`;

  const slots = [];
  let waiting = false;
  let done = false;

  data.forEach((item, i)=>{
    const key = item.key;
    const value = Number(item.value) || 0;
    const h = (value / topTick) * 100;

    const slot = document.createElement('button');
    slot.type = 'button';
    slot.className = 'barSlot';
    slot.setAttribute('data-bar', key);
    slot.setAttribute('data-value', String(value));

    const fill = document.createElement('div');
    fill.className = 'barFill';
    fill.style.height = '0%';
    fill.dataset.target = String(h);
    slot.appendChild(fill);

    slot.addEventListener('click', function(){
      if (waiting || done) return;
      waiting = true;
      slots.forEach(s=>s.classList.remove('selected'));
      slot.classList.add('selected');
      valueEl.textContent = String(value);
      valueEl.classList.add('show');
      Studio.event('bar_tap',{key:key,value:value});
      Studio.answer(String(key));
    });

    barsEl.appendChild(slot);
    slots.push(slot);

    const xl = document.createElement('div');
    xl.className = 'xlab';
    xl.textContent = Studio.t(key);
    xlabelsEl.appendChild(xl);

    fill.style.transitionDelay = (i * 70) + 'ms';
  });

  requestAnimationFrame(function(){
    slots.forEach((s)=>{
      const fill = s.firstChild;
      fill.style.height = fill.dataset.target + '%';
    });
  });

  Studio.onVerdict(function(res){
    waiting = false;
    const correct = !!(res && res.correct);
    feedbackEl.className = correct ? 'ok' : 'no';
    feedbackEl.textContent = correct ? Studio.t('right') : Studio.t('wrong');
    Studio.event('verdict',{correct:correct});
    if (correct && !done){
      done = true;
      doneEl.textContent = Studio.t('done');
      appEl.classList.add('locked');
      Studio.done();
    }
  });

  Studio.ready();
})();
</script>
