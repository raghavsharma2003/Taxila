<style>
  :root {
    --bg: #f0f4f8;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --grid: #cbd5e1;
    --bar-top: #38bdf8;
    --bar-bot: #0284c7;
    --right: #22c55e;
    --wrong: #ef4444;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app {
    width: 100%;
    min-height: 100vh;
    padding: 16px 0 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-x: hidden;
  }
  .pad {
    padding-left: 16px;
    padding-right: 16px;
  }
  .title {
    margin: 0;
    font-size: 1.35rem;
    font-weight: 700;
    text-align: center;
    line-height: 1.3;
  }
  .card {
    background: var(--card);
    border-radius: 24px;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    overflow: hidden;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .axis-title {
    fill: var(--muted);
    font-size: 13px;
    font-weight: 700;
  }
  .tick {
    fill: var(--muted);
    font-size: 13px;
    font-weight: 600;
  }
  .gridline {
    stroke: var(--grid);
    stroke-width: 1;
    stroke-dasharray: 4 4;
  }
  .axis-line {
    stroke: var(--text);
    stroke-width: 2;
  }
  .xlabel {
    fill: var(--text);
    font-size: 14px;
    font-weight: 700;
  }
  .bar {
    fill: url(#barGrad);
    cursor: pointer;
    filter: drop-shadow(0 3px 5px rgba(2, 132, 199, 0.18));
    transform-origin: bottom;
    transform-box: fill-box;
    transition: filter 0.15s ease;
  }
  .bar:hover {
    filter: drop-shadow(0 4px 8px rgba(2, 132, 199, 0.28)) brightness(1.05);
  }
  .bar:active {
    filter: brightness(1.12) saturate(1.1);
  }
  .bar.selected {
    filter: drop-shadow(0 0 10px rgba(14, 165, 233, 0.55));
  }
  @keyframes growBar {
    from { transform: scaleY(0); }
    to { transform: scaleY(1); }
  }
  .bar.grow {
    animation: growBar 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .tooltip {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    transform: translateY(6px);
  }
  .tooltip.show {
    opacity: 1;
    transform: translateY(0);
  }
  .tip-bg {
    fill: var(--text);
  }
  .tip-text {
    fill: #fff;
    font-size: 13px;
    font-weight: 700;
    dominant-baseline: middle;
    text-anchor: middle;
  }
