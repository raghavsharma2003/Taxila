<style>
  :root{
    --bg:#fff8ef;
    --card:#ffffff;
    --ink:#2f2a2a;
    --muted:#6e6464;
    --accent:#ff8a65;
    --accent2:#ffd180;
    --good:#2e9e6f;
    --bad:#d95b5b;
    --line:#f0d7c7;
    --shade:#ff7043;
    --unshade:#ffe9dc;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    color:var(--ink);
  }
  .app{
    width:100%;
    max-width:360px;
    min-height:640px;
    margin:0 auto;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .card{
    background:var(--card);
    border:2px solid var(--line);
    border-radius:20px;
    padding:12px;
    box-shadow:0 6px 18px rgba(0,0,0,.06);
  }
  .title{
    font-weight:800;
    font-size:24px;
    line-height:1.15;
    margin:0;
  }
  .instr{
    margin:8px 0 0;
    color:var(--muted);
    font-size:15px;
    min-height:22px;
  }
  .hint{
    margin:6px 0 0;
    color:var(--accent);
    font-weight:700;
    font-size:14px;
    min-height:20px;
  }
  .item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .frac{
    background:linear-gradient(135deg,var(--accent2),#ffe8b3);
    color:#6b3f18;
    border:2px solid #ffc56f;
    border-radius:999px;
    padding:6px 16px;
    font-size:28px;
    font-weight:900;
    min-width:110px;
    text-align:center;
  }
  .viz-wrap{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:4px 0;
  }
  svg{
    width:292px;
    height:292px;
    display:block;
  }
  .plate{
    fill:#fffaf5;
    stroke:#f1c7ab;
    stroke-width:3;
  }
  .part{
    fill:var(--unshade);
    stroke:#fff7f2;
    stroke-width:2.5;
    transform-origin:150px 150px;
    transition:transform .15s ease, fill .2s ease, filter .2s ease;
    cursor:pointer;
  }
  .part[data-shaded="true"]{
    fill:var(--shade);
    filter:drop-shadow(0 2px 4px rgba(255,112,67,.35));
  }
  .part:active{ transform:scale(.97); }
  .part.tap{ animation:tapPop .22s ease; }
  @keyframes tapPop{
    0%{transform:scale(1)}
    50%{transform:scale(1.03)}
    100%{transform:scale(1)}
  }
  .feedback{
    min-height:24px;
    font-size:20px;
    font-weight:800;
    text-align:center;
  }
  .feedback.good{ color:var(--good); animation:bounce .36s ease; }
  .feedback.bad{ color:var(--bad); animation:shake .26s ease; }
  @keyframes bounce{
    0%{transform:scale(.9)}
    50%{transform:scale(1.08)}
    100%{transform:scale(1)}
  }
  @keyframes shake{
    0%{transform:translateX(0)}
    25%{transform:translateX(-4px)}
    50%{transform:translateX(4px)}
    75%{transform:translateX(-3px)}
    100%{transform:translateX(0)}
  }
  .actions{
    display:flex;
    justify-content:center;
    padding-top:2px;
  }
  .check{
    min-width:170px;
    min-height:48px;
    border:none;
    border-radius:14px;
    background:linear-gradient(180deg,#ff9c79,#ff7b55);
    color:white;
    font-weight:800;
    font-size:19px;
    box-shadow:0 6px 0 #db623f;
    transition:transform .08s ease, box-shadow .08s ease, opacity .2s ease;
  }
  .check:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 #db623f;
  }
  .check[disabled]{ opacity:.65; }
  .done{
    display:none;
    flex:1;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:32px;
    font-weight:900;
    color:var(--good);
    background:var(--card);
    border:2px solid #b8e4cd;
    border-radius:20px;
    animation:bounce .4s ease;
  }
</style>

<div class="app">
  <div id="game">
    <div class="card">
      <h1 class="title" id="title"></h1>
      <p class="instr" id="instr"></p>
      <p class="hint" id="hint"></p>
    </div>

    <div class="card item" id="itemBox" data-item="">
      <div class="frac" id="fracText">0/0</div>
      <div class="viz-wrap">
        <svg viewBox="0 0 300 300" aria-hidden="true">
          <circle class="plate" cx="150" cy="150" r="126"></circle>
          <g id="partsLayer"></g>
        </svg>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="actions">
        <button class="check" data-action="check" id="checkBtn" type="button"></button>
      </div>
    </div>
  </div>

  <div class="done" id="doneScreen"></div>
</div>

<script>
(function(){
  const params = Studio.params || {};
  const items = Array.isArray(params.items) ? params.items : [];

  const el = {
    title: document.getElementById('title'),
    instr: document.getElementById('instr'),
    hint: document.getElementById('hint'),
    itemBox: document.getElementById('itemBox'),
    fracText: document.getElementById('fracText'),
    partsLayer: document.getElementById('partsLayer'),
    feedback: document.getElementById('feedback'),
    checkBtn: document.getElementById('checkBtn'),
    game: document.getElementById('game'),
    done: document.getElementById('doneScreen')
  };

  el.title.textContent = Studio.t('title');
  el.instr.textContent = Studio.t('instr');
  el.hint.textContent = Studio.t('hint');
  el.checkBtn.textContent = Studio.t('check');

  let idx = 0;
  let awaiting = false;
  let finished = false;
  let doneCalled = false;

  function polar(cx, cy, r, a){
    return {x: cx + r * Math.cos(a), y: cy + r * Math.sin(a)};
  }

  function sectorPath(cx, cy, r, a0, a1){
    const p0 = polar(cx, cy, r, a0);
    const p1 = polar(cx, cy, r, a1);
    const da = a1 - a0;
    const largeArc = da > Math.PI ? 1 : 0;
    return `M ${cx} ${cy} L ${p0.x} ${p0.y} A ${r} ${r} 0 ${largeArc} 1 ${p1.x} ${p1.y} Z`;
  }

  function currentItem(){
    return items[idx];
  }

  function shadedCount(){
    return el.partsLayer.querySelectorAll('.part[data-shaded="true"]').length;
  }

  function clearFeedback(){
    el.feedback.textContent = '';
    el.feedback.className = 'feedback';
  }

  function buildItem(){
    const item = currentItem();
    if(!item){ return; }

    awaiting = false;
    el.checkBtn.disabled = false;
    clearFeedback();

    el.itemBox.setAttribute('data-item', String(item.id));
    el.fracText.textContent = String(item.n) + '/' + String(item.d);

    el.partsLayer.innerHTML = '';
    const d = item.d;
    const cx = 150, cy = 150, r = 118;
    const step = (Math.PI * 2) / d;
    const start = -Math.PI / 2;

    for(let i=0;i<d;i++){
      const a0 = start + i * step;
      const a1 = a0 + step;
      const p = document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d', sectorPath(cx, cy, r, a0, a1));
      p.setAttribute('class', 'part');
      p.setAttribute('data-part', String(i));
      p.setAttribute('data-shaded', 'false');
      p.style.pointerEvents = 'auto';
      p.addEventListener('click', function(){
        if(awaiting || finished) return;
        const now = p.getAttribute('data-shaded') === 'true';
        p.setAttribute('data-shaded', now ? 'false' : 'true');
        p.classList.remove('tap');
        void p.getBoundingClientRect();
        p.classList.add('tap');
        Studio.event('tap_part', {itemId: item.id, part: i, shaded: !now});
      });
      el.partsLayer.appendChild(p);
    }
  }

  function nextOrDone(){
    idx += 1;
    if(idx < items.length){
      buildItem();
      return;
    }
    finished = true;
    el.game.style.display = 'none';
    el.done.style.display = 'flex';
    el.done.textContent = Studio.t('done');
    if(!doneCalled){
      doneCalled = true;
      Studio.done();
    }
  }

  el.checkBtn.addEventListener('click', function(){
    if(awaiting || finished) return;
    const item = currentItem();
    if(!item) return;
    awaiting = true;
    el.checkBtn.disabled = true;
    Studio.event('check', {itemId: item.id, shaded: shadedCount(), d: item.d});
    Studio.answer({ n: shadedCount(), d: item.d });
  });

  Studio.onVerdict(function(v){
    if(finished) return;
    if(v && v.correct){
      el.feedback.textContent = Studio.t('right');
      el.feedback.className = 'feedback good';
      Studio.event('verdict', {correct:true, itemId: currentItem() && currentItem().id});
      setTimeout(nextOrDone, 700);
    }else{
      el.feedback.textContent = Studio.t('wrong');
      el.feedback.className = 'feedback bad';
      awaiting = false;
      el.checkBtn.disabled = false;
      Studio.event('verdict', {correct:false, itemId: currentItem() && currentItem().id});
    }
  });

  if(items.length > 0){
    buildItem();
    Studio.ready();
  }else{
    el.game.style.display = 'none';
    el.done.style.display = 'flex';
    el.done.textContent = Studio.t('done');
    Studio.ready();
    if(!doneCalled){
      doneCalled = true;
      Studio.done();
    }
  }
})();
</script>
