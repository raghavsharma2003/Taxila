<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    width: 360px;
    min-height: 640px;
    background: #FFF8F0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    padding: 20px 16px;
    color: #4A3728;
  }
  .title {
    font-size: 22px;
    font-weight: 700;
    color: #C26B3E;
    text-align: center;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }
  .chart-container {
    position: relative;
    width: 300px;
    height: 320px;
    margin: 12px 0 24px;
  }
  svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .gridline {
    stroke: #E6D3C8;
    stroke-width: 1;
    stroke-dasharray: 4 4;
  }
  .axis-label {
    font-size: 11px;
    fill: #9B7A6A;
    font-weight: 500;
  }
  .tick-label {
    font-size: 10px;
    fill: #8C6E5A;
    text-anchor: end;
    dominant-baseline: middle;
  }
  .bar {
    fill: #F4A460;
    rx: 6;
    ry: 6;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.1s ease;
    transform-origin: center bottom;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.08));
  }
  .bar:active {
    filter: brightness(0.9) drop-shadow(0 1px 2px rgba(0,0,0,0.12));
    transform: scaleY(0.98);
  }
  .bar-label {
    font-size: 11px;
    fill: #5C4033;
    text-anchor: middle;
    font-weight: 600;
  }
  .yaxis-title {
    font-size: 12px;
    fill: #8B5E3C;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .question-box {
    background: #FDE9DB;
    border-radius: 20px;
    padding: 16px 20px;
    width: 100%;
    max-width: 300px;
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    color: #6B4226;
    margin-bottom: 12px;
    box-shadow: 0 4px 12px rgba(180,120,80,0.12);
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .feedback {
    min-height: 40px;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    margin: 8px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    padding: 8px 16px;
    transition: all 0.2s ease;
  }
  .feedback.right {
    background: #D4EDC9;
    color: #2D5A27;
  }
  .feedback.wrong {
    background: #FBE3E3;
    color: #9E3B3B;
  }
  .done-text {
    font-size: 18px;
    font-weight: 700;
    color: #2D5A27;
    text-align: center;
    margin-top: 12px;
    padding: 12px;
    background: #E3F2D7;
    border-radius: 20px;
    width: 100%;
    max-width: 300px;
  }
  .click-hint {
    font-size: 12px;
    color: #B5937A;
    margin-top: 4px;
    font-style: italic;
  }
</style>

<div class="title" id="title"></div>

<div class="chart-container">
  <svg viewBox="0 0 300 320" preserveAspectRatio="xMidYMid meet" id="chart-svg">
    <!-- Y-axis title -->
    <text class="yaxis-title" x="12" y="18" id="yaxis-title"></text>
    <!-- Gridlines & tick labels will be injected -->
    <g id="grid-group"></g>
    <!-- Bars will be injected -->
    <g id="bars-group"></g>
    <!-- Axis line -->
    <line x1="48" y1="30" x2="48" y2="290" stroke="#D4B896" stroke-width="2"/>
    <line x1="48" y1="290" x2="290" y2="290" stroke="#D4B896" stroke-width="2"/>
  </svg>
</div>

<div class="question-box" id="question"></div>
<div class="feedback" id="feedback"></div>
<div class="done-text" id="done-text" style="display:none;"></div>
<div class="click-hint" id="hint"></div>

<script>
  (function() {
    const params = Studio.params;
    const data = params.data;
    const keys = data.map(d => d.key);
    const values = data.map(d => d.value);
    const maxVal = Math.max(...values);
    
    // Compute nice tick step
    const rawStep = maxVal / 4;
    const magnitude = Math.pow(10, Math.floor(Math.log10(rawStep)));
    const residual = rawStep / magnitude;
    let niceStep;
    if (residual <= 1.5) niceStep = 1 * magnitude;
    else if (residual <= 3) niceStep = 2 * magnitude;
    else if (residual <= 7) niceStep = 5 * magnitude;
    else niceStep = 10 * magnitude;
    
    const maxTick = Math.ceil(maxVal / niceStep) * niceStep;
    const ticks = [];
    for (let v = 0; v <= maxTick; v += niceStep) ticks.push(v);
    
    // Chart dimensions
    const chartTop = 38;
    const chartBottom = 290;
    const chartHeight = chartBottom - chartTop;
    const barAreaLeft = 62;
    const barAreaRight = 280;
    const barAreaWidth = barAreaRight - barAreaLeft;
    const barCount = data.length;
    const barGap = 12;
    const barWidth = Math.min(36, (barAreaWidth - (barCount + 1) * barGap) / barCount);
    const totalBarsWidth = barCount * barWidth + (barCount - 1) * barGap;
    const startX = barAreaLeft + (barAreaWidth - totalBarsWidth) / 2;
    
    // Populate static text
    document.getElementById('title').textContent = Studio.t('title');
    document.getElementById('yaxis-title').textContent = Studio.t('yaxis');
    document.getElementById('question').textContent = Studio.t('ask');
    
    const gridGroup = document.getElementById('grid-group');
    const barsGroup = document.getElementById('bars-group');
    
    // Draw gridlines and tick labels
    ticks.forEach(tick => {
      const y = chartBottom - (tick / maxTick) * chartHeight;
      // Gridline
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', 48);
      line.setAttribute('y1', y);
      line.setAttribute('x2', 290);
      line.setAttribute('y2', y);
      line.setAttribute('class', 'gridline');
      gridGroup.appendChild(line);
      
      // Tick label
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', 42);
      text.setAttribute('y', y);
      text.setAttribute('class', 'tick-label');
      text.setAttribute('data-tick', tick);
      text.textContent = tick;
      gridGroup.appendChild(text);
    });
    
    // Draw bars with animation
    data.forEach((d, i) => {
      const x = startX + i * (barWidth + barGap);
      const barHeight = (d.value / maxTick) * chartHeight;
      const y = chartBottom - barHeight;
      
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', x);
      rect.setAttribute('y', chartBottom); // start from bottom
      rect.setAttribute('width', barWidth);
      rect.setAttribute('height', '0');
      rect.setAttribute('class', 'bar');
      rect.setAttribute('data-bar', d.key);
      rect.setAttribute('data-value', d.value);
      rect.setAttribute('rx', '6');
      rect.setAttribute('ry', '6');
      
      // Animate grow
      setTimeout(() => {
        rect.style.transition = 'height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), y 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
        rect.setAttribute('y', y);
        rect.setAttribute('height', barHeight);
      }, 50 + i * 80);
      
      barsGroup.appendChild(rect);
      
      // Bar label (fruit name)
      const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      label.setAttribute('x', x + barWidth / 2);
      label.setAttribute('y', chartBottom + 18);
      label.setAttribute('class', 'bar-label');
      label.textContent = Studio.t(d.key);
      barsGroup.appendChild(label);
    });
    
    // Tap handling
    let answered = false;
    const bars = document.querySelectorAll('.bar');
    const feedbackDiv = document.getElementById('feedback');
    const doneDiv = document.getElementById('done-text');
    const hintDiv = document.getElementById('hint');
    
    // Show value on tap, before answering
    bars.forEach(bar => {
      bar.addEventListener('click', (e) => {
        if (answered) return;
        const key = bar.getAttribute('data-bar');
        const val = bar.getAttribute('data-value');
        
        // Show value hint temporarily (but don't answer yet)
        hintDiv.textContent = Studio.t(key) + ': ' + val;
        setTimeout(() => { if (!answered) hintDiv.textContent = ''; }, 1500);
        
        // Answer
        Studio.answer(key);
        answered = true;
        Studio.event('bar-tap', { key, value: val });
      });
    });
    
    Studio.onVerdict(({ correct }) => {
      if (correct) {
        feedbackDiv.textContent = Studio.t('right');
        feedbackDiv.className = 'feedback right';
        hintDiv.textContent = '';
        setTimeout(() => {
          doneDiv.style.display = 'block';
          doneDiv.textContent = Studio.t('done');
          Studio.done();
        }, 600);
      } else {
        feedbackDiv.textContent = Studio.t('wrong');
        feedbackDiv.className = 'feedback wrong';
        answered = false; // allow retry
        setTimeout(() => {
          feedbackDiv.textContent = '';
          feedbackDiv.className = 'feedback';
        }, 1200);
      }
    });
    
    Studio.ready();
  })();
</script>
