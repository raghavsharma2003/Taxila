<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: linear-gradient(180deg, #e0f7fa 0%, #fff 100%); color: #263238; height: 100vh; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; }
  #app { width: 100%; max-width: 360px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; }
  #title { margin: 6px 0 2px; text-align: center; font-size: 20px; font-weight: 800; color: #1b5e20; }
  .scene-wrap { flex: 0 0 360px; width: 100%; position: relative; overflow: hidden; border-radius: 0 0 24px 24px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
  #scene { width: 100%; height: 100%; display: block; }
  .panel { flex: 1 1 auto; background: #fff; border-radius: 24px 24px 0 0; margin-top: -12px; padding: 14px 12px 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -6px 24px rgba(0,0,0,0.08); }
  .controls { display: flex; gap: 8px; align-items: center; }
  button { border: none; cursor: pointer; transition: transform 0.1s; touch-action: manipulation; }
  button:active { transform: scale(0.95); }
  #playBtn { width: 64px; height: 44px; border-radius: 14px; background: #43a047; color: #fff; font-weight: 800; font-size: 14px; box-shadow: 0 3px 0 #2e7d32; }
  #playBtn.paused { background: #fb8c00; box-shadow: 0 3px 0 #ef6c00; }
  .step-btns { display: flex; gap: 6px; flex: 1; }
  .step-btn { flex: 1; height: 44px; border-radius: 12px; background: #e8f5e9; color: #2e7d32; font-weight: 800; font-size: 16px; }
  .step-btn.active { background: #66bb6a; color: #fff; transform: scale(1.05); }
  #caption { min-height: 26px; text-align: center; font-size: 16px; font-weight: 700; color: #37474f; }
  .quiz { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  #ask { text-align: center; font-size: 15px; font-weight: 700; color: #263238; }
  .options { display: flex; gap: 8px; justify-content: center; }
  .option-btn { flex: 1; height: 48px; border-radius: 14px; background: #fff3e0; color: #e65100; font-weight: 800; font-size: 16px; box-shadow: 0 2px 0 #ffe0b2; }
  .option-btn.selected.correct { background: #66bb6a; color: #fff; }
  .option-btn.selected.wrong { background: #ef5350; color: #fff; animation: shake 0.4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .sky { fill: url(#skyGrad); }
  .soil { fill: url(#soilGrad); }
  .stem { fill: #66bb6a; }
  .leaf { fill: #43a047; stroke: #2e7d32; stroke-width: 2; }
  .roots { fill: none; stroke: #795548; stroke-width: 5; stroke-linecap: round; }
  .sun { fill: #fdd835; stroke: #fbc02d; stroke-width: 2; }
  .ray { stroke: #fff176; stroke-width: 3; stroke-linecap: round; opacity: 0.35; }
  .glucose { fill: #ffd54f; opacity: 0.5; pointer-events: none; }
  text[data-label] { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 800; fill: #263238; paint-order: stroke; stroke: #fff; stroke-width: 3px; stroke-linejoin: round; pointer-events: none; transition: fill 0.3s, font-size 0.3s; }
  [data-flow] { transition: opacity 0.4s; }
  .scene.step-1 [data-flow]:not([data-flow="water"]),
  .scene.step-2 [data-flow]:not([data-flow="water"]),
  .scene.step-3 [data-flow]:not([data-flow="co2"]),
  .scene.step-4 [data-flow],
  .scene.step-5 [data-flow]:not([data-flow="o2"]) { opacity: 0.2; }
  .scene.step-1 [data-entity="roots"],
  .scene.step-2 [data-entity="roots"],
  .scene.step-3 [data-entity="leaf"],
  .scene.step-4 [data-entity="leaf"],
  .scene.step-5 [data-entity="leaf"] { filter: drop-shadow(0 0 5px #81c784); }
  .scene.step-1 [data-label="roots"],
  .scene.step-1 [data-label="water"],
  .scene.step-2 [data-label="water"],
  .scene.step-3 [data-label="leaf"],
  .scene.step-3 [data-label="co2"],
  .scene.step-4 [data-label="sun"],
  .scene.step-4 [data-label="leaf"],
  .scene.step-5 [data-label="leaf"],
  .scene.step-5 [data-label="o2"],
  .scene.step-5 [data-label="glucose"] { fill: #1565c0; font-size: 15px; }
  .scene.step-4 .ray { opacity: 0.95; filter: drop-shadow(0 0 4px #fff59d); }
  .scene.step-5 .glucose { opacity: 1; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:0.65; transform:scale(1.2)} }
</style>
<div id="app">
  <div id="title"></div>
  <div class="scene-wrap">
    <svg id="scene" class="scene" viewBox="0 0 360 380" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#81d4fa"/>
          <stop offset="100%" stop-color="#e0f7fa"/>
        </linearGradient>
        <linearGradient id="soilGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#8d6e63"/>
          <stop offset="100%" stop-color="#5d4037"/>
        </linearGradient>
      </defs>
      <rect class="sky" x="0" y="0" width="360" height="300"/>
      <circle class="sun" cx="180" cy="55" r="28"/>
      <g id="plant">
        <rect class="stem" x="174" y="170" width="12" height="135" rx="6"/>
        <path class="roots" data-entity="roots" d="M180 300 Q165 318 155 340 Q180 330 180 355 Q180 330 205 340 Q195 318 180 300"/>
        <path class="leaf" data-entity="leaf" d="M182 172 C150 130 170 95 225 95 C280 95 300 130 268 172 C245 198 205 198 182 172 Z"/>
      </g>
      <path class="soil" d="M0 300 Q180 290 360 300 L360 380 L0 380 Z"/>
      <g id="particles"></g>
      <text data-label="sun" x="180" y="100" text-anchor="middle"></text>
      <text data-label="leaf" x="275" y="150" text-anchor="start"></text>
      <text data-label="roots" x="180" y="368" text-anchor="middle"></text>
      <text data-label="water" x="120" y="260" text-anchor="middle"></text>
      <text data-label="co2" x="70" y="135" text-anchor="middle"></text>
      <text data-label="o2" x="315" y="135" text-anchor="middle"></text>
      <text data-label="glucose" x="220" y="155" text-anchor="middle"></text>
    </svg>
  </div>
  <div class="panel">
    <div class="controls">
      <button id="playBtn" data-action="play"></button>
      <div class="step-btns">
        <button class="step-btn" data-action="step-1">1</button>
        <button class="step-btn" data-action="step-2">2</button>
        <button class="step-btn" data-action="step-3">3</button>
        <button class="step-btn" data-action="step-4">4</button>
        <button class="step-btn" data-action="step-5">5</button>
      </div>
    </div>
    <div id="caption" data-caption></div>
    <div class="quiz">
      <div id="ask"></div>
      <div class="options">
        <button class="option-btn" data-option="co2"></button>
        <button class="option-btn" data-option="o2"></button>
        <button class="option-btn" data-option="water"></button>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  const svg = document.getElementById('scene');
  const particleGroup = document.getElementById('particles');
  const leafCenter = {x:220,y:135};
  const stemTop = {x:180,y:172};
  const rootBottom = {x:180,y:340};

  document.getElementById('title').textContent = Studio.t('title');
  document.getElementById('ask').textContent = Studio.t('ask');
  document.querySelectorAll('[data-label]').forEach(el => { el.textContent = Studio.t(el.dataset.label); });
  document.querySelectorAll('[data-option]').forEach(btn => {
    btn.textContent = Studio.t(btn.dataset.option);
    btn.addEventListener('click', onOptionClick);
  });

  let playing = true;
  let step = 1;
  const playBtn = document.getElementById('playBtn');
  const caption = document.getElementById('caption');

  function updatePlayBtn(){
    playBtn.textContent = Studio.t(playing ? 'pause' : 'play');
    playBtn.classList.toggle('paused', !playing);
  }
  function updateStep(){
    caption.textContent = Studio.t('step' + step);
    svg.className.baseVal = 'scene step-' + step;
    document.querySelectorAll('.step-btn').forEach((b,i) => { b.classList.toggle('active', i+1 === step); });
  }

  playBtn.addEventListener('click', function(){
    playing = !playing;
    updatePlayBtn();
    Studio.event('play', {playing: playing});
  });
  document.querySelectorAll('[data-action^="step-"]').forEach((btn,i) => {
    btn.addEventListener('click', function(){
      step = i+1;
      playing = true;
      updatePlayBtn();
      updateStep();
      Studio.event('step', {step: step});
    });
  });

  updatePlayBtn();
  updateStep();

  const rayTargets = [{x:210,y:135},{x:220,y:120},{x:235,y:145}];
  const rays = [];
  rayTargets.forEach(t => {
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', 180);
    line.setAttribute('y1', 55);
    line.setAttribute('x2', t.x);
    line.setAttribute('y2', t.y);
    line.setAttribute('class', 'ray');
    line.style.strokeDasharray = '10 8';
    svg.insertBefore(line, particleGroup);
    rays.push(line);
  });

  const particles = [];
  function makeParticle(flow, r, color, resetFn, updateFn){
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('r', r);
    c.setAttribute('fill', color);
    c.setAttribute('data-flow', flow);
    particleGroup.appendChild(c);
    const p = {el:c, flow:flow, progress:Math.random(), speed:0.35 + Math.random()*0.25, resetFn:resetFn, updateFn:updateFn};
    if(resetFn) resetFn(p);
    particles.push(p);
    return p;
  }

  for(let i=0;i<5;i++){
    makeParticle('water', 4, '#29b6f6', null, function(p){
      const t = p.progress;
      let x, y;
      if(t < 0.65){ x = 180; y = rootBottom.y - (rootBottom.y - stemTop.y) * (t / 0.65); }
      else { const u = (t - 0.65) / 0.35; x = stemTop.x + (leafCenter.x - stemTop.x) * u; y = stemTop.y + (leafCenter.y - stemTop.y) * u; }
      p.el.setAttribute('cx', x);
      p.el.setAttribute('cy', y);
    });
  }
  for(let i=0;i<5;i++){
    makeParticle('co2', 4, '#78909c', function(p){
      const side = Math.random() < 0.5 ? -1 : 1;
      const x = side < 0 ? 40 + Math.random()*70 : 300 + Math.random()*45;
      const y = 90 + Math.random()*80;
      p.start = {x:x, y:y};
    }, function(p){
      const s = p.start;
      const t = p.progress;
      p.el.setAttribute('cx', s.x + (leafCenter.x - s.x) * t);
      p.el.setAttribute('cy', s.y + (leafCenter.y - s.y) * t);
    });
  }
  for(let i=0;i<5;i++){
    makeParticle('o2', 4, '#e1
