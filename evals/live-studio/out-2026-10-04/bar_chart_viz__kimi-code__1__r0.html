<style>
  :root {
    --bg: #f0f4f8;
    --card: #ffffff;
    --accent: #0ea5e9;
    --bar: #38bdf8;
    --bar-dark: #0284c7;
    --text: #1e293b;
    --muted: #64748b;
    --grid: #e2e8f0;
    --right: #22c55e;
    --wrong: #ef4444;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app {
    width: 100%;
    max-width: 100vw;
    min-height: 100vh;
    padding: 16px;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .title {
    margin: 8px 0 4px;
    font-size: 1.35rem;
    font-weight: 700;
    text-align: center;
    color: var(--text);
    line-height: 1.3;
  }
  .chart-card {
    background: var(--card);
    border-radius: 24px;
    padding: 18px 14px 14px;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    position: relative;
  }
  .yaxis-title {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
    margin-left: 38px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .chart-wrap {
    position: relative;
    height: 292px;
    padding-top: 28px;
    margin-left: 36px;
  }
  .axis {
    position: absolute;
    left: -36px;
    top: 28px;
    bottom: 0;
    width: 32px;
    border-right: 2px solid var(--text);
  }
  .tick {
    position: absolute;
    right: 6px;
    font-size: 0.75rem;
    color: var(--muted);
    line-height: 1;
    transform: translateY(50%);
  }
  .plot {
    position: relative;
    width: 100%;
    height: 260px;
  }
  .gridlines {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .gridline {
    position: absolute;
    left: 0;
    right: 0;
    height: 1px;
    background: var(--grid);
    border-top: 1px dashed #cbd5e1;
  }
  .bars {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    justify-content: space-around;
    gap: 8px;
    z-index: 2;
  }
  .bar-wrapper {
    flex: 1 1 44px;
    max-width: 64px;
    height: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    position: relative;
  }
  .bar {
    width: 100%;
    max-width: 48px;
    background: linear-gradient(180deg, var(--bar) 0%, var(--bar-dark) 100%);
    border-radius: 10px 10px 4px 4px;
    cursor: pointer;
    position: relative;
    transform-origin: bottom center;
    transition: height 0.9s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.15s ease, box-shadow 0.2s ease;
    box-shadow: 0 4px 10px rgba(2, 132, 199, 0.18);
    touch-action: manipulation;
    user-select: none;
  }
  .bar:active {
    transform: scale(1.06) translateY(-3px);
  }
  .bar.selected {
    box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.35), 0 6px 16px rgba(2, 132, 199, 0.3);
    transform: scale(1.04);
  }
  .bar-value {
    position: absolute;
    top: -28px;
    left: 50%;
    transform: translateX(-50%) translateY(6px);
    background: var(--text);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 10px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    white-space: nowrap;
  }
  .bar-value.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .x-labels {
    display: flex;
    justify-content: space-around;
    gap: 8px;
    margin-top: 10px;
    margin-left: 36px;
  }
  .xlabel {
    flex: 1 1 44px;
    max-width: 64px;
    text-align: center;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text);
    line-height: 1.2;
  }
  .question {
    background: #e0f2fe;
    color: #0369a1;
    font-size: 1.05rem;
    font-weight: 600;
    padding: 14px 16px;
    border-radius: 16px;
    text-align: center;
    line-height: 1.4;
  }
  .feedback {
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.05rem;
    font-weight: 700;
    border-radius: 14px;
    text-align: center;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .feedback.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .feedback.right { color: #15803d; background: #dcfce7; }
  .feedback.wrong { color: #b91c1c; background: #fee2e2; }
  .done-banner {
    background: var(--right);
    color: #fff;
    font-size: 1.15rem;
    font-weight: 700;
    padding: 16px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(34, 197, 94, 0.25);
    animation: popIn 0.35s ease both;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
  }
</style>

<div class="app">
  <h1 class="title" id="title"></h1>
  <div class="chart-card">
    <div class="yaxis-title" id="yaxis"></div>
    <div class="chart-wrap">
      <div class="axis" id="axis"></div>
      <div class="plot">
        <div class="gridlines" id="gridlines"></div>
        <div class="bars" id="bars"></div>
      </div>
    </div>
    <div class="x-labels" id="xlabels"></div>
  </div>
  <div class="question" id="ask"></div>
  <div class="feedback" id="feedback"></div>
  <div id="done" hidden></div>
</div>

<script>
(function(){
  const data = Studio.params.data;
  const plotHeight = 260;
  const titleEl = document.getElementById('title');
  const yaxisEl = document.getElementById('yaxis');
  const askEl = document.getElementById('ask');
  const axisEl = document.getElementById('axis');
  const gridlinesEl = document.getElementById('gridlines');
  const barsEl = document.getElementById('bars');
  const xlabelsEl = document.getElementById('xlabels');
  const feedbackEl = document.getElementById('feedback');
  const doneEl = document.getElementById('done');

  function t(key){ return Studio.t(key); }

  titleEl.textContent = t('title');
  yaxisEl.textContent = t('yaxis');
  askEl.textContent = t('ask');

  function niceScale(max){
    let step = 1;
    while (true){
      const ticks = Math.ceil(max / step);
      if (ticks <= 8) return { step: step, maxTick: ticks * step };
      if (ticks <= 16) step *= 2;
      else if (ticks <= 40) step *= 5;
      else step *= 10;
    }
  }

  const maxValue = Math.max.apply(null, data.map(function(d){ return d.value; }));
  const scale = niceScale(maxValue);

  for (let v = 0; v <= scale.maxTick; v += scale.step){
    const pct = (v / scale.maxTick) * 100;
    const tick = document.createElement('div');
    tick.className = 'tick';
    tick.dataset.tick = String(v);
    tick.textContent = String(v);
    tick.style.bottom = 'calc(' + pct + '% - 0.5em)';
    axisEl.appendChild(tick);

    if (v > 0){
      const line = document.createElement('div');
      line.className = 'gridline';
      line.style.bottom = pct + '%';
      gridlinesEl.appendChild(line);
    }
  }

  data.forEach(function(item){
    const wrapper = document.createElement('div');
    wrapper.className = 'bar-wrapper';

    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.dataset.bar = item.key;
    bar.dataset.value = String(item.value);
    bar.style.height = '0%';
    bar.setAttribute('role', 'button');
    bar.setAttribute('aria-label', t(item.key));

    const valueLabel = document.createElement('span');
    valueLabel.className = 'bar-value';
    valueLabel.textContent = String(item.value);
    bar.appendChild(valueLabel);

    wrapper.appendChild(bar);
    barsEl.appendChild(wrapper);

    const xlabel = document.createElement('div');
    xlabel.className = 'xlabel';
    xlabel.textContent = t(item.key);
    xlabelsEl.appendChild(xlabel);

    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        bar.style.height = ((item.value / scale.maxTick) * 100) + '%';
      });
    });

    function onTap(){
      if (doneEl.hidden === false) return;
      Studio.event('bar_tap', { key: item.key });
      clearSelection();
      bar.classList.add('selected');
      valueLabel.classList.add('show');
      Studio.answer(item.key);
    }

    bar.addEventListener('click', onTap);
    bar.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' ') onTap();
    });
  });

  function clearSelection(){
    barsEl.querySelectorAll('.bar').forEach(function(b){
      b.classList.remove('selected');
      b.querySelector('.bar-value').classList.remove('show');
    });
  }

  Studio.onVerdict(function(verdict){
    feedbackEl.classList.add('visible');
    if (verdict.correct){
      feedbackEl.textContent = t('right');
      feedbackEl.className = 'feedback visible right';
      doneEl.className = 'done-banner';
      doneEl.textContent = t('done');
      doneEl.hidden = false;
      askEl.hidden = true;
      Studio.done();
    } else {
      feedbackEl.textContent = t('wrong');
      feedbackEl.className = 'feedback visible wrong';
      setTimeout(function(){
        clearSelection();
        feedbackEl.classList.remove('visible');
      }, 900);
    }
  });

  Studio.ready();
})();
</script>
