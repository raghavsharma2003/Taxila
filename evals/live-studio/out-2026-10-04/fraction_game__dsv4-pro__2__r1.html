<style>
  :root {
    --bg: #fef7e9;
    --surface: #fff;
    --text: #4a3728;
    --accent: #f28b82;
    --accent2: #fbbc04;
    --correct: #34a853;
    --shadow: 0 4px 12px rgba(0,0,0,0.08);
    --radius: 24px;
    --font: system-ui, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    font-family: var(--font);
    padding: 20px 16px;
    color: var(--text);
    text-align: center;
  }
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 360px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    transition: all 0.2s ease;
  }
  h2 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .instr {
    font-size: 1rem;
    opacity: 0.8;
    margin-bottom: 4px;
  }
  .fraction-display {
    font-size: 2.5rem;
    font-weight: 800;
    background: #fef3e0;
    padding: 8px 24px;
    border-radius: 40px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 0.02em;
  }
  .fraction-display .num { color: #d93025; }
  .fraction-display .den { color: #5f6368; }
  .pizza-container {
    width: 220px;
    height: 220px;
    position: relative;
    margin: 8px auto;
  }
  .pizza-slice {
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease;
    transform-origin: 50% 50%;
  }
  .pizza-slice:hover {
    filter: brightness(0.95);
  }
  .pizza-slice:active {
    transform: scale(0.95);
  }
  .bar-container {
    display: flex;
    gap: 6px;
    width: 100%;
    max-width: 300px;
    margin: 8px auto;
    flex-wrap: wrap;
    justify-content: center;
  }
  .bar-segment {
    flex: 1 1 0;
    min-width: 44px;
    height: 64px;
    background: #e8eaed;
    border-radius: 14px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    border: 2px solid transparent;
  }
  .bar-segment.shaded {
    background: var(--accent);
    border-color: #d9655b;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }
  .bar-segment:active {
    transform: scale(0.93);
  }
  .btn {
    background: #fff;
    border: 2px solid #dadce0;
    border-radius: 30px;
    padding: 14px 28px;
    font-weight: 700;
    font-size: 1.2rem;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    min-width: 120px;
    letter-spacing: 0.03em;
    color: var(--text);
    margin-top: 8px;
  }
  .btn:active {
    transform: scale(0.96);
    background: #f1f3f4;
  }
  .btn-primary {
    background: var(--accent2);
    border-color: #f9ab00;
    color: #202124;
    font-weight: 800;
  }
  .feedback {
    font-size: 1.1rem;
    font-weight: 600;
    min-height: 1.6em;
    transition: color 0.2s;
  }
  .hidden {
    display: none !important;
  }
  .done-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    padding: 32px 20px;
  }
  .done-icon {
    font-size: 4rem;
    animation: bounce 0.6s ease infinite alternate;
  }
  @keyframes bounce {
    from { transform: translateY(0); }
    to { transform: translateY(-8px); }
  }
</style>

<div id="app"></div>

<script>
  (function() {
    const items = Studio.params.items;
    const pictureType = Studio.params.picture || 'pizza';
    let currentIndex = 0;
    let shadedCount = 0;
    let currentItem = null;
    let partsElements = [];

    const app = document.getElementById('app');

    function renderFirstScreen() {
      if (!items.length) return;
      currentItem = items[0];
      app.innerHTML = buildItemHTML(currentItem);
      attachEvents();
      Studio.ready();
    }

    function buildItemHTML(item) {
      const d = item.d;
      const n = item.n;
      const id = item.id;
      const fractionHTML = `<span class="num">${n}</span><span>/</span><span class="den">${d}</span>`;
      let pictureHTML = '';
      if (pictureType === 'pizza') {
        pictureHTML = buildPizzaSVG(d);
      } else {
        pictureHTML = buildBarHTML(d);
      }
      return `
        <div class="card" data-item="${id}">
          <h2>${Studio.t('title')}</h2>
          <div class="instr">${Studio.t('instr')}</div>
          <div class="fraction-display">${fractionHTML}</div>
          ${pictureHTML}
          <button class="btn btn-primary" data-action="check">${Studio.t('check')}</button>
          <div class="feedback" id="feedback"></div>
        </div>
      `;
    }

    function buildPizzaSVG(slices) {
      const size = 220;
      const cx = size/2, cy = size/2, r = 100;
      const angle = 360 / slices;
      let paths = '';
      for (let i = 0; i < slices; i++) {
        const startAngle = i * angle;
        const endAngle = startAngle + angle;
        const startRad = (startAngle - 90) * Math.PI / 180;
        const endRad = (endAngle - 90) * Math.PI / 180;
        const x1 = cx + r * Math.cos(startRad);
        const y1 = cy + r * Math.sin(startRad);
        const x2 = cx + r * Math.cos(endRad);
        const y2 = cy + r * Math.sin(endRad);
        const largeArc = angle > 180 ? 1 : 0;
        const d = `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z`;
        paths += `<path class="pizza-slice" data-part="${i}" data-shaded="false" d="${d}" fill="#fddcb5" stroke="#c0a080" stroke-width="2" />`;
      }
      return `<div class="pizza-container"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths}</svg></div>`;
    }

    function buildBarHTML(segments) {
      let divs = '';
      for (let i = 0; i < segments; i++) {
        divs += `<div class="bar-segment" data-part="${i}" data-shaded="false"></div>`;
      }
      return `<div class="bar-container">${divs}</div>`;
    }

    function attachEvents() {
      const card = document.querySelector('.card');
      if (!card) return;
      partsElements = Array.from(card.querySelectorAll('[data-part]'));
      partsElements.forEach(el => {
        el.addEventListener('click', togglePart);
      });
      const checkBtn = card.querySelector('[data-action="check"]');
      if (checkBtn) {
        checkBtn.addEventListener('click', handleCheck);
      }
      updateShadedCountFromDOM();
    }

    function togglePart(e) {
      const el = e.currentTarget;
      const isShaded = el.dataset.shaded === 'true';
      if (isShaded) {
        el.dataset.shaded = 'false';
        if (pictureType === 'pizza') {
          el.setAttribute('fill', '#fddcb5');
        } else {
          el.classList.remove('shaded');
        }
      } else {
        el.dataset.shaded = 'true';
        if (pictureType === 'pizza') {
          el.setAttribute('fill', '#f28b82');
        } else {
          el.classList.add('shaded');
        }
      }
      updateShadedCountFromDOM();
      Studio.event('partToggle', { part: el.dataset.part, shaded: el.dataset.shaded });
    }

    function updateShadedCountFromDOM() {
      shadedCount = partsElements.filter(el => el.dataset.shaded === 'true').length;
    }

    function handleCheck() {
      if (!currentItem) return;
      Studio.answer({ n: shadedCount, d: currentItem.d });
    }

    Studio.onVerdict(({ correct }) => {
      const fb = document.getElementById('feedback');
      if (!fb) return;
      if (correct) {
        fb.textContent = '✓ ' + Studio.t('right');
        fb.style.color = 'var(--correct)';
        setTimeout(() => {
          advanceOrDone();
        }, 800);
      } else {
        fb.textContent = '✗ ' + Studio.t('wrong') + ' ' + Studio.t('hint');
        fb.style.color = '#d93025';
      }
    });

    function advanceOrDone() {
      currentIndex++;
      if (currentIndex >= items.length) {
        showDoneScreen();
      } else {
        currentItem = items[currentIndex];
        app.innerHTML = buildItemHTML(currentItem);
        attachEvents();
      }
    }

    function showDoneScreen() {
      app.innerHTML = `
        <div class="card done-screen">
          <div class="done-icon">🎉</div>
          <h2>${Studio.t('done')}</h2>
        </div>
      `;
      Studio.done();
    }

    renderFirstScreen();
  })();
</script>
