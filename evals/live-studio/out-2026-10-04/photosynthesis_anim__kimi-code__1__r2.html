<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: #ECEFF1; }
.app {
  width: 100%;
  max-width: 360px;
  margin: 0 auto;
  min-height: 640px;
  background: #F5F5F5;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  position: relative;
}
.title {
  font-size: 20px;
  text-align: center;
  padding: 12px 8px 8px;
  color: #1B5E20;
  font-weight: 800;
}
.scene {
  width: 100%;
  line-height: 0;
}
.diagram {
  width: 100%;
  height: auto;
  display: block;
}
.label {
  font-size: 12px;
  fill: #263238;
  font-weight: 700;
  pointer-events: none;
  transition: fill 0.3s, font-size 0.3s;
}
.sun-ring {
  transform-box: fill-box;
  transform-origin: center;
  animation: spin 12s linear infinite;
  animation-play-state: paused;
  opacity: 0.6;
}
.rays {
  opacity: 0.25;
  transition: opacity 0.4s;
}
.ray {
  stroke: #F9A825;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 10 10;
  animation: dash 1.4s linear infinite;
  animation-play-state: paused;
}
@keyframes dash { to { stroke-dashoffset: -20; } }
@keyframes spin { to { transform: rotate(360deg); } }
.plant .stem { stroke: #66BB6A; transition: stroke 0.4s, filter 0.4s; }
.plant .leaf { fill: #66BB6A; stroke: #43A047; transition: filter 0.4s; }
.particles circle {
  transition: r 0.35s, opacity 0.35s, filter 0.35s;
}
.particles circle[data-flow="water"] { fill: #29B6F6; opacity: 0.7; }
.particles circle[data-flow="co2"] { fill: #BDBDBD; opacity: 0.7; }
.particles circle[data-flow="o2"] { fill: #81C784; opacity: 0.7; }
.glucose {
  fill: #FFD54F;
  opacity: 0.2;
  transition: opacity 0.4s;
  transform-box: fill-box;
  transform-origin: center;
  animation: glucosePulse 1.3s ease-in-out infinite;
  animation-play-state: paused;
}
@keyframes glucosePulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.45); }
}
.playing .sun-ring { animation-play-state: running; }
.playing .ray { animation-play-state: running; }
.playing .glucose { animation-play-state: running; }
.step-1 .rays { opacity: 0.95; }
.step-1 .sun-ring { opacity: 1; }
.step-1 [data-label="sun"] { fill: #F57F17; font-size: 14px; }
.step-2 .particles circle[data-flow="water"] { r: 6; opacity: 1; filter: url(#glow); }
.step-2 .plant .stem { stroke: #29B6F6; filter: url(#glow); }
.step-2 [data-label="water"] { fill: #0277BD; font-size: 14px; }
.step-3 .particles circle[data-flow="co2"] { r: 6; opacity: 1; filter: url(#glow); }
.step-3 .plant .leaf { filter: url(#glow); }
.step-3 [data-label="co2"] { fill: #616161; font-size: 14px; }
.step-4 .glucose { opacity: 1; }
.step-4 [data-label="glucose"] { fill: #F57F17; font-size: 14px; }
.step-5 .particles circle[data-flow="o2"] { r: 6; opacity: 1; filter: url(#glow); }
.step-5 .plant .leaf { filter: url(#glow); }
.step-5 [data-label="o2"] { fill: #2E7D32; font-size: 14px; }
.caption {
  min-height: 52px;
  padding: 10px 16px;
  margin: 6px 12px 4px;
  background: #FFFFFF;
  border-radius: 16px;
  font-size: 15px;
  color: #263238;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
}
.controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  gap: 10px;
}
.play-btn {
  min-width: 92px;
  height: 48px;
  border: none;
  border-radius: 24px;
  background: #FF7043;
  color: #fff;
  font-size: 14px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  transition: transform 0.1s, background 0.2s;
  flex-shrink: 0;
}
.play-btn:active { transform: scale(0.93); }
.play-btn .icon { font-size: 11px; }
.steps {
  display: flex;
  gap: 6px;
  flex: 1;
  justify-content: flex-end;
}
.steps button {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2px solid #81C784;
  background: #fff;
  color: #1B5E20;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  transition: transform 0.12s, background 0.2s, color 0.2s, border-color 0.2s;
}
.steps button.active {
  background: #43A047;
  color: #fff;
  border-color: #43A047;
  transform: scale(1.08);
}
.steps button:active { transform: scale(0.92); }
.quiz {
  padding: 10px 14px 18px;
}
.question {
  font-size: 15px;
  color: #263238;
  text-align: center;
  margin-bottom: 12px;
  font-weight: 700;
  line-height: 1.35;
}
.options {
  display: flex;
  justify-content: center;
  gap: 10px;
}
.option {
  flex: 1;
  max-width: 104px;
  height: 50px;
  border: 2px solid #90CAF9;
  border-radius: 16px;
  background: #fff;
  color: #1565C0;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  transition: transform 0.1s, background 0.2s, border-color 0.2s, color 0.2s;
}
.option:active { transform: scale(0.94); }
.option:disabled { opacity: 0.55; cursor: default; }
.feedback {
  min-height: 44px;
  margin-top: 10px;
  text-align: center;
  font-size: 30px;
  font-weight: 800;
}
.feedback.correct { color: #43A047; animation: pop 0.45s; }
.feedback.incorrect { color: #E53935; animation: shake 0.45s; }
@keyframes pop {
  0% { transform: scale(0); }
  70% { transform: scale(1.25); }
  100% { transform: scale(1); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  60% { transform: translateX(8px); }
}
</style>

<div class="app playing" id="app">
  <h1 class="title" data-string="title"></h1>
  <div class="scene">
    <svg class="diagram" viewBox="0 0 360 420" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#E3F2FD"/>
          <stop offset="100%" stop-color="#BBDEFB"/>
        </linearGradient>
        <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#8D6E63"/>
          <stop offset="100
