<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  font-family: system-ui, -apple-system, sans-serif;
  background: #1a1a2e;
  min-height: 640px;
  width: 360px;
  overflow-x: hidden;
  color: #eee;
  padding: 8px;
}
.container {
  width: 344px;
  margin: 0 auto;
}
h1 {
  text-align: center;
  font-size: 20px;
  color: #ffe66d;
  margin-bottom: 6px;
  text-shadow: 0 0 10px rgba(255,230,109,0.3);
}
.svg-container {
  position: relative;
  width: 344px;
  height: 240px;
  background: linear-gradient(180deg, #4a90d9 0%, #87CEEB 60%, #c8e6c9 80%, #5d4037 100%);
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 4px;
}
svg { width: 100%; height: 100%; display: block; }
.controls {
  display: flex;
  gap: 4px;
  margin: 6px 0;
  flex-wrap: wrap;
  justify-content: center;
}
.btn {
  background: #3d3d5c;
  border: 2px solid #5a5a8a;
  color: #ddd;
  border-radius: 12px;
  padding: 6px 12px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.btn:active { transform: scale(0.94); }
.btn.active { background: #ffe66d; color: #1a1a2e; border-color: #ffd54f; font-weight: bold; }
.caption-box {
  background: #2a2a4a;
  border-radius: 12px;
  padding: 8px 12px;
  margin: 6px 0;
  text-align: center;
  font-size: 14px;
  min-height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid #5a5a8a;
}
.question-box {
  background: #2a2a4a;
  border-radius: 12px;
  padding: 10px;
  margin: 8px 0;
  text-align: center;
}
.question-box p { margin-bottom: 8px; font-size: 15px; }
.options {
  display: flex;
  gap: 6px;
  justify-content: center;
}
.option-btn {
  min-width: 80px;
  padding: 8px 14px;
  background: #3d3d5c;
  border: 2px solid #5a5a8a;
  border-radius: 12px;
  color: #ddd;
  font-size: 14px;
  cursor: pointer;
  min-height: 44px;
  transition: all 0.2s;
}
.option-btn:active { transform: scale(0.94); }
.feedback {
  margin-top: 6px;
  font-size: 14px;
  min-height: 20px;
}
.sun-glow { animation: pulseGlow 3s ease-in-out infinite; }
@keyframes pulseGlow {
  0%,100% { opacity: 0.7; }
  50% { opacity: 1; }
}
.particle { transition: all 0.8s ease; }
</style>

<div class="container">
  <h1><span data-label="title"></span></h1>
  <div class="svg-container">
    <svg viewBox="0 0 344 240" xmlns="http://www.w3.org/2000/svg">
      <!-- Sky gradient rect -->
      <defs>
        <radialGradient id="sunGrad" cx="50%" cy="20%" r="40%">
          <stop offset="0%" stop-color="#ffeb3b" stop-opacity="0.9"/>
          <stop offset="40%" stop-color="#ff9800" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#ff9800" stop-opacity="0"/>
        </radialGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      
      <!-- Sun -->
      <circle cx="280" cy="40" r="22" fill="#ffeb3b" filter="url(#glow)" class="sun-glow"/>
      <!-- Sun rays (lines that animate later) -->
      <g id="sunrays" stroke="#ffeb3b" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6">
        <line x1="280" y1="40" x2="200" y2="100" />
        <line x1="280" y1="40" x2="220" y2="60" />
        <line x1="280" y1="40" x2="240" y2="90" />
        <line x1="280" y1="40" x2="260" y2="110" />
      </g>
      
      <!-- Soil -->
      <rect x="0" y="190" width="344" height="50" fill="#5d4037" rx="4"/>
      <rect x="0" y="188" width="344" height="8" fill="#6d4c41" rx="2"/>
      
      <!-- Roots -->
      <g data-entity="roots" stroke="#8d6e63" stroke-width="3" fill="none" stroke-linecap="round">
        <path d="M170 188 Q168 210 160 225 Q155 230 150 235"/>
        <path d="M172 188 Q174 215 180 230 Q185 238 190 240"/>
        <path d="M165 188 Q155 205 145 218"/>
        <path d="M175 188 Q185 205 195 215"/>
      </g>
      
      <!-- Stem -->
      <path d="M170 188 Q168 160 170 130 Q172 110 170 90" stroke="#4caf50" stroke-width="6" fill="none" stroke-linecap="round"/>
      
      <!-- Leaf -->
      <g data-entity="leaf">
        <ellipse cx="170" cy="85" rx="35" ry="20" fill="#4caf50" transform="rotate(-10 170 85)"/>
        <ellipse cx="170" cy="85" rx="33" ry="18" fill="#66bb6a" transform="rotate(-10 170 85)"/>
        <line x1="170" y1="85" x2="170" y2="105" stroke="#388e3c" stroke-width="1.5"/>
        <line x1="170" y1="85" x2="185" y2="78" stroke="#388e3c" stroke-width="1"/>
        <line x1="170" y1="85" x2="155" y2="80" stroke="#388e3c" stroke-width="1"/>
      </g>
      
      <!-- Labels -->
      <text data-label="sun" x="280" y="28" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold"></text>
      <text data-label="leaf" x="170" y="65" text-anchor="middle" fill="#fff" font-size="8" font-weight="bold"></text>
      <text data-label="roots" x="150" y="240" text-anchor="middle" fill="#ddd" font-size="8" font-weight="bold"></text>
      
      <!-- Particle groups (animated) -->
      <!-- Water particles -->
      <circle data-flow="water" class="particle" cx="168" cy="220" r="3" fill="#42a5f5" opacity="0.8"/>
      <circle data-flow="water" class="particle" cx="172" cy="210" r="3" fill="#42a5f5" opacity="0.8"/>
      <circle data-flow="water" class="particle" cx="165" cy="200" r="3" fill="#42a5f5" opacity="0.8"/>
      <circle data-flow="water" class="particle" cx="175" cy="190" r="3" fill="#42a5f5" opacity="0.8"/>
      
      <!-- CO2 particles -->
      <circle data-flow="co2" class="particle" cx="60" cy="100" r="3" fill="#90a4ae" opacity="0.7"/>
      <circle data-flow="co2" class="particle" cx="90" cy="80" r="3" fill="#90a4ae" opacity="0.7"/>
      <circle data-flow="co2" class="particle" cx="120" cy="95" r="3" fill="#90a4ae" opacity="0.7"/>
      <circle data-flow="co2" class="particle" cx="130" cy="70" r="3" fill="#90a4ae" opacity="0.7"/>
      
      <!-- O2 particles -->
      <circle data-flow="o2" class="particle" cx="210" cy="80" r="3" fill="#a5d6a7" opacity="0.7"/>
      <circle data-flow="o2" class="particle" cx="240" cy="70" r="3" fill="#a5d6a7" opacity="0.7"/>
      <circle data-flow="o2" class="particle" cx="260" cy="90" r="3" fill="#a5d6a7" opacity="0.7"/>
      <circle data-flow="o2" class="particle" cx="200" cy="100" r="3" fill="#a5d6a7" opacity="0.7"/>
      
      <!-- Glucose glow (hidden initially) -->
      <circle id="glucose-glow" cx="170" cy="85" r="12" fill="#ffeb3b" opacity="0" filter="url(#glow)"/>
      <text data-label="glucose" x="170" y="88" text-anchor="middle" fill="#fff" font-size="7" font-weight="bold" opacity="0" id="glucose-label"></text>
      
      <!-- Water label near roots -->
      <text data-label="water" x="110" y="220" fill="#42a5f5" font-size="8" font-weight="bold"></text>
      <!-- CO2 label -->
      <text data-label="co2" x="50" y="60" fill="#90a4ae" font-size="8" font-weight="bold"></text>
      <!-- O2 label -->
      <text data-label="o2" x="270" y="60" fill="#a5d6a7" font-size="8" font-weight="bold"></text>
    </svg>
  </div>
  
  <div class="controls">
    <button class="btn active" data-action="play" id="playBtn"><span id="playLabel"></span></button>
    <button class="btn active" data-action="step-1">1</button>
    <button class="btn" data-action="step-2">2</button>
    <button class="btn" data-action="step-3">3</button>
    <button class="btn" data-action="step-4">4</button>
    <button class="btn" data-action="step-5">5</button>
  </div>
  
  <div class="caption-box" data-caption></div>
  
  <div class="question-box" id="questionBox" style="display:none;">
    <p data-ask></p>
    <div class="options">
      <button class="option-btn" data-option="co2"></button>
      <button class="option-btn" data-option="o2"></button>
      <button class="option-btn" data-option="water"></button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
</div>

<script>
(function() {
  const params = Studio.params;
  const t = Studio.t;
  
  // Fill labels
  document.querySelector('[data-label="title"]').textContent = t('title');
  document.querySelectorAll('[data-label]').forEach(el => {
    const key = el.getAttribute('data-label');
    if (key !== 'title' && t(key)) el.textContent = t(key);
  });
  
  // Play/pause
  let isPlaying = true;
  let currentStep = 1;
  const totalSteps = 5;
  const playBtn = document.getElementById('playBtn');
  const playLabel = document.getElementById('playLabel');
  const captionEl = document.querySelector('[data-caption]');
  
  function getStepKey(step) { return 'step' + step; }
  
  function updateCaption(step) {
    captionEl.textContent = t(getStepKey(step));
  }
  
  function setStep(step) {
    currentStep = step;
    document.querySelectorAll('[data-action^="step-"]').forEach(el => {
      const num = parseInt(el.getAttribute('data-action').split('-')[1]);
      el.classList.toggle('active', num === step);
    });
    updateCaption(step);
    // Show/hide glucose based on step
    const glucoseGlow = document.getElementById('glucose-glow');
    const glucoseLabel = document.getElementById('glucose-label');
    if (step >= 4) {
      glucoseGlow.style.opacity = '0.7';
      glucoseLabel.style.opacity = '1';
    } else {
      glucoseGlow.style.opacity = '0';
      glucoseLabel.style.opacity = '0';
    }
    // Enable/disable O2 particles based on step
    document.querySelectorAll('[data-flow="o2"]').forEach(p => {
      p.style.opacity = (step >= 3) ? '0.7' : '0';
    });
    // Enable/disable CO2 based on step
    document.querySelectorAll('[data-flow="co2"]').forEach(p => {
      p.style.opacity = (step >= 2) ? '0.7' : '0';
    });
    // Water always visible from step 1
    if (step >= 5) {
      // Show question after a moment
      document.getElementById('questionBox').style.display = 'block';
      document.querySelector('[data-ask]').textContent = t('ask');
      document.querySelector('[data-option="co2"]').textContent = t('co2');
      document.querySelector('[data-option="o2"]').textContent = t('o2');
      document.querySelector('[data-option="water"]').textContent = t('water');
    } else {
      document.getElementById('questionBox').style.display = 'none';
    }
  }
  
  // Particle animation
  function animateParticles() {
    const waterParticles = document.querySelectorAll('[data-flow="water"]');
    const co2Particles = document.querySelectorAll('[data-flow="co2"]');
    const o2Particles = document.querySelectorAll('[data-flow="o2"]');
    
    // Water: roots (y 220-190) -> leaf (y 85)
    waterParticles.forEach((p, i) => {
      const base = 220 - i * 10;
      const target = 90;
      const progress = isPlaying ? ((Date.now() % 3000) / 3000) : 0.5;
      const y = base - (base - target) * progress;
      const x = 168 + Math.sin(i * 2 + Date.now() / 1000) * 5;
      p.setAttribute('cy', y);
      p.setAttribute('cx', x);
    });
    
    // CO2: from left (cx 60-130) -> leaf (cx ~170, cy ~85)
    co2Particles.forEach((p, i) => {
      if (currentStep < 2) { p.style.opacity = '0'; return; }
      p.style.opacity = '0.7';
      const startX = [60, 90, 120, 130][i];
      const startY = [100, 80, 95, 70][i];
      const progress = isPlaying ? ((Date.now() % 4000) / 4000) : 0.5;
      const cx = startX + (170 - startX) * progress;
      const cy = startY + (85 - startY) * progress - Math.sin(progress * Math.PI) * 10;
      p.setAttribute('cx', cx);
      p.setAttribute('cy', cy);
    });
    
    // O2: from leaf -> right (cx 200-260, cy 70-100)
    o2Particles.forEach((p, i) => {
      if (currentStep < 3) { p.style.opacity = '0'; return; }
      p.style.opacity = '0.7';
      const targetX = [210, 240, 260, 200][i];
      const targetY = [80, 70, 90, 100][i];
      const progress = isPlaying ? ((Date.now() % 3500) / 3500) : 0.5;
      const cx = 170 + (targetX - 170) * progress;
      const cy = 85 + (targetY - 85) * progress - Math.sin(progress * Math.PI) * 8;
      p.setAttribute('cx', cx);
      p.setAttribute('cy', cy);
    });
    
    // Sun ray animation: subtle shift
    const rays = document.getElementById('sunrays');
    if (rays) {
      const angle = (Date.now() % 4000) / 4000 * Math.PI * 2;
      rays.setAttribute('transform', `rotate(${Math.sin(angle) * 5} 280 40)`);
    }
  }
  
  // Play/pause toggle
  playBtn.addEventListener('click', function() {
    isPlaying = !isPlaying;
    playLabel.textContent = isPlaying ? t('pause') : t('play');
    playBtn.classList.toggle('active', isPlaying);
    Studio.event('togglePlay', { playing: isPlaying });
  });
  
  // Step buttons
  document.querySelectorAll('[data-action^="step-"]').forEach(el => {
    el.addEventListener('click', function() {
      const step = parseInt(this.getAttribute('data-action').split('-')[1]);
      setStep(step);
      isPlaying = true;
      playLabel.textContent = t('pause');
      playBtn.classList.add('active');
      Studio.event('stepSelect', { step });
    });
  });
  
  // Option buttons
  document.querySelectorAll('.option-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const option = this.getAttribute('data-option');
      Studio.answer(option);
    });
  });
  
  Studio.onVerdict(function(result) {
    const fb = document.getElementById('feedback');
    if (result.correct) {
      fb.textContent = '✅ Sahi jawab!';
      fb.style.color = '#4caf50';
      Studio.done();
    } else {
      fb.textContent = '❌ Galat, dobara koshish karo!';
      fb.style.color = '#f44336';
    }
  });
  
  // Animation loop
  setInterval(animateParticles, 50);
  
  // Init
  setStep(1);
  playLabel.textContent = t('pause');
  isPlaying = true;
  
  Studio.ready();
})();
</script>
