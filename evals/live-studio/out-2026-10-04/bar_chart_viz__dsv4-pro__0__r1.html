<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width: 360px; height: 640px; overflow:hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(145deg, #fdf6f0 0%, #fff3e8 100%);
    display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start; padding: 20px 16px;
    position: relative;
  }

  .title {
    font-size: 22px; font-weight: 700; color: #5e3c1c;
    text-align: center; margin-bottom: 12px;
    letter-spacing: 0.5px;
  }

  .chart-wrap {
    position: relative; width: 100%; height: 340px;
    margin-bottom: 16px;
    border-left: 2px solid #b08968;
    border-bottom: 2px solid #b08968;
    background: rgba(255,250,245,0.6);
    border-radius: 0 12px 12px 0;
    box-shadow: 0 6px 14px rgba(140, 90, 40, 0.08);
  }

  .y-axis-title {
    position: absolute; left: -14px; top: 50%;
    transform: translate(-50%, -50%) rotate(-90deg);
    font-size: 13px; font-weight: 600; color: #8b5e3c;
    white-space: nowrap;
    letter-spacing: 0.4px;
  }

  .gridlines {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  .gridline {
    position: absolute; left: 0; width: 100%; height: 1px;
    background: rgba(176,137,104,0.25);
  }
  .tick-label {
    position: absolute; left: -38px; font-size: 11px; font-weight: 500;
    color: #7a5a3a; transform: translateY(-50%);
    text-align: right; width: 32px;
  }

  .bars-container {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
    display: flex; justify-content: space-around; align-items: flex-end;
    padding: 0 6px;
  }

  .bar-wrapper {
    display: flex; flex-direction: column; align-items: center;
    width: 44px; min-width: 44px; height: 100%;
    justify-content: flex-end;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.2s ease;
  }
  .bar-wrapper:active {
    transform: scale(0.96);
  }

  .bar {
    width: 40px; min-height: 44px; border-radius: 10px 10px 6px 6px;
    background: linear-gradient(180deg, #f9a66c 0%, #e07b4b 100%);
    box-shadow: 0 4px 8px rgba(200,100,30,0.25);
    transition: height 0.9s cubic-bezier(0.34,1.2,0.64,1);
    position: relative;
    margin-bottom: 4px;
  }
  .bar::after {
    content: ''; position: absolute; top: 6px; left: 50%;
    transform: translateX(-50%);
    width: 20px; height: 6px; background: rgba(255,255,255,0.5);
    border-radius: 10px;
  }

  .bar-label {
    font-size: 11px; font-weight: 600; color: #5e3c1c;
    text-align: center; margin-bottom: 6px;
  }

  .question {
    font-size: 17px; font-weight: 600; color: #4a2c14;
    background: #fef7e9; padding: 10px 18px;
    border-radius: 30px; margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(160,110,50,0.1);
    text-align: center; max-width: 90%;
  }

  .feedback {
    font-size: 15px; font-weight: 600; padding: 8px 20px;
    border-radius: 24px; margin-top: 4px;
    text-align: center;
    transition: all 0.2s;
  }
  .feedback.correct {
    background: #c8e6c9; color: #2e5a2e;
  }
  .feedback.wrong {
    background: #ffd9c6; color: #a13e1c;
  }

  .done-message {
    font-size: 18px; font-weight: 700; color: #5e3c1c;
    margin-top: 8px; text-align: center;
  }
</style>

<div class="title" id="title"></div>
<div class="chart-wrap" id="chartWrap">
  <div class="y-axis-title" id="yaxisTitle"></div>
  <div class="gridlines" id="gridlines"></div>
  <div class="bars-container" id="barsContainer"></div>
</div>
<div class="question" id="questionBox"></div>
<div id="feedbackBox" class="feedback"></div>
<div id="doneMessage" class="done-message"></div>

<script>
  (function() {
    const data = Studio.params.data;
    const values = data.map(d => d.value);
    const maxVal = Math.max(...values);
    const step = 2;
    const maxTick = Math.ceil(maxVal / step) * step;

    document.getElementById('title').textContent = Studio.t('title');
    document.getElementById('yaxisTitle').textContent = Studio.t('yaxis');
    document.getElementById('questionBox').textContent = Studio.t('ask');

    const barsContainer = document.getElementById('barsContainer');
    const gridlinesDiv = document.getElementById('gridlines');
    const chartWrap = document.getElementById('chartWrap');
    const feedbackBox = document.getElementById('feedbackBox');
    const doneMsg = document.getElementById('doneMessage');

    const chartInnerHeight = 340;
    const bottomMargin = 2;

    for (let tick = 0; tick <= maxTick; tick += step) {
      const yPos = chartInnerHeight - (tick / maxTick) * chartInnerHeight;
      const line = document.createElement('div');
      line.className = 'gridline';
      line.style.bottom = yPos + 'px';
      gridlinesDiv.appendChild(line);

      const label = document.createElement('div');
      label.className = 'tick-label';
      label.textContent = tick;
      label.setAttribute('data-tick', tick);
      label.style.bottom = (yPos - 1) + 'px';
      chartWrap.appendChild(label);
    }

    data.forEach(item => {
      const wrapper = document.createElement('div');
      wrapper.className = 'bar-wrapper';
      wrapper.setAttribute('data-bar', item.key);

      const barDiv = document.createElement('div');
      barDiv.className = 'bar';
      barDiv.setAttribute('data-bar', item.key);
      barDiv.setAttribute('data-value', item.value);
      const targetHeight = (item.value / maxTick) * chartInnerHeight;
      barDiv.style.height = '0px';
      barDiv.dataset.targetHeight = targetHeight;

      wrapper.appendChild(barDiv);

      const label = document.createElement('div');
      label.className = 'bar-label';
      label.textContent = Studio.t(item.key);
      wrapper.appendChild(label);

      barsContainer.appendChild(wrapper);
    });

    requestAnimationFrame(() => {
      const bars = document.querySelectorAll('.bar');
      bars.forEach(bar => {
        bar.style.height = bar.dataset.targetHeight + 'px';
      });
      Studio.ready();
    });

    let answered = false;
    const wrappers = document.querySelectorAll('.bar-wrapper');

    wrappers.forEach(wrapper => {
      wrapper.addEventListener('click', (e) => {
        if (answered) return;
        const barKey = wrapper.getAttribute('data-bar');
        Studio.answer(barKey);
        Studio.event('barTapped', { key: barKey });
        answered = true;

        Studio.onVerdict((verdict) => {
          if (verdict.correct) {
            feedbackBox.textContent = Studio.t('right');
            feedbackBox.className = 'feedback correct';
            doneMsg.textContent = Studio.t('done');
            Studio.done();
          } else {
            feedbackBox.textContent = Studio.t('wrong');
            feedbackBox.className = 'feedback wrong';
            answered = false;
          }
        });
      });
    });
  })();
</script>
