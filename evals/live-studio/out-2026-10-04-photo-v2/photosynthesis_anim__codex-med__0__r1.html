<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .app {
    width: 100%;
    max-width: 360px;
    height: 640px;
    margin: 0 auto;
    padding: 10px 10px 12px;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #eaf8ff 0%, #f6fff1 55%, #fff7e8 100%);
    color: #1f3b4d;
    overflow: hidden;
  }
  .title {
    margin: 0 0 6px;
    text-align: center;
    font-size: 20px;
    line-height: 1.1;
    color: #24506a;
  }
  .sceneWrap {
    border-radius: 16px;
    background: rgba(255,255,255,0.55);
    box-shadow: inset 0 0 0 2px rgba(36,80,106,0.12);
    padding: 6px;
  }
  svg { width: 100%; height: 290px; display: block; }
  .labelText {
    font-size: 12px;
    fill: #103447;
    font-weight: 700;
    paint-order: stroke;
    stroke: rgba(255,255,255,0.95);
    stroke-width: 3px;
    stroke-linejoin: round;
  }

  .rays line {
    stroke: #ffd44d;
    stroke-width: 4;
    stroke-linecap: round;
    stroke-dasharray: 7 7;
    animation: rayMove 1.8s linear infinite;
  }
  @keyframes rayMove {
    to { stroke-dashoffset: -28; }
  }

  .leaf {
    fill: #4caf50;
    stroke: #2f7d36;
    stroke-width: 3;
    transform-origin: 205px 178px;
    transition: transform .35s ease, filter .35s ease, opacity .35s ease;
  }
  .stem { fill: #62b95f; }
  .roots path {
    stroke: #9a6a3a;
    stroke-width: 4;
    stroke-linecap: round;
    fill: none;
  }
  .soil { fill: #d6a06c; }

  .particle {
    r: 4.2;
    transition: opacity .3s ease;
  }
  [data-flow="water"] { fill: #4bb8ff; }
  [data-flow="co2"] { fill: #6f7f95; }
  [data-flow="o2"] { fill: #85e7b0; }

  .glucoseDot {
    fill: #fff36a;
    stroke: #e8bd1c;
    stroke-width: 2;
    filter: drop-shadow(0 0 4px rgba(255,232,91,.7));
    animation: glow 1.5s ease-in-out infinite;
  }
  @keyframes glow {
    0%,100% { opacity: .45; transform: scale(.85); }
    50% { opacity: 1; transform: scale(1.08); }
  }

  .scene .rays, .scene .waterFlow, .scene .co2Flow, .scene .o2Flow, .scene .glucoseWrap { opacity: .33; transition: opacity .35s ease; }
  .scene.step-1 .rays { opacity: 1; }
  .scene.step-2 .waterFlow { opacity: 1; }
  .scene.step-3 .co2Flow { opacity: 1; }
  .scene.step-4 .glucoseWrap { opacity: 1; }
  .scene.step-5 .o2Flow { opacity: 1; }
  .scene.paused .particle { opacity: .5; }

  .controls {
    margin-top: 8px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 7px;
  }
  .row {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  button {
    border: none;
    border-radius: 12px;
    min-height: 44px;
    padding: 0 12px;
    font-size: 16px;
    font-weight: 700;
    color: #17364a;
    background: #ffffff;
    box-shadow: 0 3px 0 rgba(23,54,74,.18);
    transition: transform .12s ease, background .2s ease, box-shadow .2s ease;
  }
  button:active { transform: scale(.96); }
  .playBtn { min-width: 110px; background: #ffe784; }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; }
  .stepBtn {
    width: 44px;
    min-width: 44px;
    padding: 0;
    border-radius: 50%;
    background: #e6f5ff;
  }
  .stepBtn.active {
    background: #8fd4ff;
    box-shadow: 0 0 0 3px rgba(40,140,196,.25), 0 3px 0 rgba(23,54,74,.18);
    transform: scale(1.05);
  }
  [data-caption] {
    min-height: 38px;
    border-radius: 10px;
    padding: 8px 10px;
    background: rgba(255,255,255,.7);
    color: #1f4f69;
    font-weight: 700;
    line-height: 1.2;
    font-size: 14px;
  }

  .qa {
    margin-top: 8px;
    border-radius: 14px;
    background: rgba(255,255,255,.72);
    padding: 8px;
  }
  .ask {
    font-size: 15px;
    font-weight: 700;
    color: #20495f;
    margin-bottom: 8px;
    line-height: 1.25;
  }
  .options {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .opt {
    min-height: 46px;
    background: #ffffff;
  }
  .feedback {
    height: 24px;
    margin-top: 6px;
    text-align: center;
    font-size: 20px;
    font-weight: 900;
    transition: transform .2s ease;
  }
  .feedback.ok { color: #1e9a57; transform: scale(1.08); }
  .feedback.no { color: #d54545; transform: scale(1.08); }
</style>

<div class="app">
  <h1 class="title" id="title"></h1>

  <div class="sceneWrap">
    <svg viewBox="0 0 360 290" class="scene step-1" id="scene">
      <rect x="0" y="0" width="360" height="290" fill="transparent"></rect>

      <g id="sunGroup">
        <circle cx="58" cy="42" r="28" fill="#ffd54f" stroke="#f6b300" stroke-width="3"></circle>
        <g class="rays">
          <line x1="88" y1="42" x2="125" y2="56"></line>
          <line x1="82" y1="60" x2="116" y2="86"></line>
          <line x1="64" y1="72" x2="84" y2="110"></line>
          <line x1="95" y1="69" x2="176" y2="151"></line>
          <line x1="75" y1="78" x2="182" y2="167"></line>
          <line x1="54" y1="80" x2="166" y2="165"></line>
        </g>
      </g>

      <rect class="soil" x="0" y="228" width="360" height="62" rx="6"></rect>

      <g class="waterFlow">
        <rect class="stem" x="178" y="130" width="12" height="108" rx="6"></rect>
        <g id="waterParticles">
          <circle class="particle" data-flow="water" cx="0" cy="0"></circle>
          <circle class="particle" data-flow="water" cx="0" cy="0"></circle>
          <circle class="particle" data-flow="water" cx="0" cy="0"></circle>
          <circle class="particle" data-flow="water" cx="0" cy="0"></circle>
        </g>
      </g>

      <g class="roots" data-entity="roots">
        <path d="M184 236 C170 248,165 258,154 270"></path>
        <path d="M184 236 C196 248,206 258,218 272"></path>
        <path d="M184 238 C176 252,176 264,170 276"></path>
        <path d="M184 238 C192 252,196 264,204 278"></path>
      </g>

      <path class="leaf" data-entity="leaf" d="M192 170
        C213 138,255 143,274 170
        C255 198,213 204,192 170 Z"></path>
      <path d="M198 172 C224 167,246 169,266 176" fill="none" stroke="#2f7d36" stroke-width="2.5"></path>

      <g class="co2Flow" id="co2Particles">
        <circle class="particle" data-flow="co2" cx="0" cy="0"></circle>
        <circle class="particle" data-flow="co2" cx="0" cy="0"></circle>
        <circle class="particle" data-flow="co2" cx="0" cy="0"></circle>
        <circle class="particle" data-flow="co2" cx="0" cy="0"></circle>
      </g>

      <g class="o2Flow" id="o2Particles">
        <circle class="particle" data-flow="o2" cx="0" cy="0"></circle>
        <circle class="particle" data-flow="o2" cx="0" cy="0"></circle>
        <circle class="particle" data-flow="o2" cx="0" cy="0"></circle>
        <circle class="particle" data-flow="o2" cx="0" cy="0"></circle>
      </g>

      <g class="glucoseWrap">
        <circle class="glucoseDot" cx="225" cy="173" r="8"></circle>
      </g>

      <text class="labelText" data-label="sun" x="16" y="16"></text>
      <text class="labelText" data-label="leaf" x="285" y="164"></text>
      <text class="labelText" data-label="roots" x="226" y="266"></text>
      <text class="labelText" data-label="water" x="124" y="208"></text>
      <text class="labelText" data-label="co2" x="350" y="92" text-anchor="end"></text>
      <text class="labelText" data-label="o2" x="18" y="118"></text>
      <text class="labelText" data-label="glucose" x="350" y="216" text-anchor="end"></text>
    </svg>
  </div>

  <div class="controls">
    <div class="row">
      <button class="playBtn" data-action="play" id="playPause"></button>
      <div class="steps" id="stepButtons"></div>
    </div>
    <div data-caption id="caption"></div>
  </div>

  <div class="qa">
    <div class="ask" id="ask"></div>
    <div class="options">
      <button class="opt" data-option="co2" id="opt-co2"></button>
      <button class="opt" data-option="o2" id="opt-o2"></button>
      <button class="opt" data-option="water" id="opt-water"></button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
</div>

<script>
(function () {
  var params = Studio.params;
  var scene = document.getElementById('scene');
  var playBtn = document.getElementById('playPause');
  var stepWrap = document.getElementById('stepButtons');
  var caption = document.getElementById('caption');
  var feedback = document.getElementById('feedback');
  var title = document.getElementById('title');

  title.textContent = Studio.t('title');
  document.getElementById('ask').textContent = Studio.t('ask');
  document.getElementById('opt-co2').textContent = Studio.t('co2');
  document.getElementById('opt-o2').textContent = Studio.t('o2');
  document.getElementById('opt-water').textContent = Studio.t('water');

  var labelEls = document.querySelectorAll('[data-label]');
  for (var i = 0; i < labelEls.length; i++) {
    var k = labelEls[i].getAttribute('data-label');
    labelEls[i].textContent = Studio.t(k);
  }

  function keepTextInside(el) {
    el.setAttribute('font-size', '12');
    var tries = 0;
    while (tries < 4) {
      var b = el.getBBox();
      if (b.x >= 2 && (b.x + b.width) <= 358) break;
      var fs = parseFloat(el.getAttribute('font-size') || '12');
      if (fs <= 9) break;
      el.setAttribute('font-size', String(fs - 1));
      tries++;
    }
    var bb = el.getBBox();
    var dx = 0;
    if (bb.x < 2) dx = 2 - bb.x;
    if (bb.x + bb.width > 358) dx = 358 - (bb.x + bb.width);
    if (dx !== 0) {
      var x = parseFloat(el.getAttribute('x') || '0');
      el.setAttribute('x', String(x + dx));
    }
  }

  for (var li = 0; li < labelEls.length; li++) {
    keepTextInside(labelEls[li]);
  }

  var stepCount = params.steps;
  var currentStep = 1;
  var playing = true;
  var doneSent = false;

  var stepButtons = [];
  for (var s = 1; s <= stepCount; s++) {
    var b = document.createElement('button');
    b.className = 'stepBtn';
    b.setAttribute('data-action', 'step-' + s);
    b.textContent = String(s);
    (function (num, btn) {
      btn.addEventListener('click', function () {
        setStep(num);
        Studio.event('step', { step: num });
      });
    })(s, b);
    stepWrap.appendChild(b);
    stepButtons.push(b);
  }

  function setPlayLabel() {
    playBtn.textContent = playing ? Studio.t('pause') : Studio.t('play');
  }

  function setStep(n) {
    currentStep = n;
    caption.textContent = Studio.t('step' + n);
    scene.classList.remove('step-1', 'step-2', 'step-3', 'step-4', 'step-5');
    scene.classList.add('step-' + n);
    for (var i = 0; i < stepButtons.length; i++) {
      stepButtons[i].classList.toggle('active', i === (n - 1));
    }
  }

  playBtn.addEventListener('click', function () {
    playing = !playing;
    scene.classList.toggle('paused', !playing);
    setPlayLabel();
    Studio.event('play_toggle', { playing: playing });
  });

  setStep(1);
  setPlayLabel();

  var water = Array.prototype.slice.call(document.querySelectorAll('[data-flow="water"]'));
  var co2 = Array.prototype.slice.call(document.querySelectorAll('[data-flow="co2"]'));
  var o2 = Array.prototype.slice.call(document.querySelectorAll('[data-flow="o2"]'));

  function place(el, x, y) {
    el.setAttribute('transform', 'translate(' + x.toFixed(2) + ' ' + y.toFixed(2) + ')');
  }

  function animFlow(list, fn, tBase) {
    for (var i = 0; i < list.length; i++) {
      var t = (tBase + i / list.length) % 1;
      var p = fn(t, i);
      place(list[i], p.x, p.y);
    }
  }

  var progress = 0;
  var last = 0;

  function waterPath(t, i) {
    return {
      x: 171 + 22 * t + Math.sin((t * 10 + i) * 1.4) * 3.4,
      y: 274 - 102 * t + Math.cos((t * 8 + i) * 1.1) * 2
    };
  }
  function co2Path(t, i) {
    return {
      x: 328 - 130 * t + Math.sin((t * 7 + i) * 1.1) * 2.2,
      y: 130 + (i - 1.5) * 14 + 45 * t + Math.cos((t * 9 + i) * 1.4) * 1.8
    };
  }
  function o2Path(t, i) {
    return {
      x: 220 - 170 * t + Math.sin((t * 8 + i) * 1.2) * 2.5,
      y: 173 - 70 * t + (i - 1.5) * 9 + Math.cos((t * 7 + i) * 1.5) * 2
    };
  }

  function tick(ts) {
    if (!last) last = ts;
    var dt = ts - last;
    last = ts;
    if (playing) progress += dt * 0.00017;

    animFlow(water, waterPath, progress);
    animFlow(co2, co2Path, progress * 0.92);
    animFlow(o2, o2Path, progress * 1.05);

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function answer(key) {
    Studio.answer(key);
    Studio.event('answer', { value: key, step: currentStep });
  }

  document.getElementById('opt-co2').addEventListener('click', function () { answer('co2'); });
  document.getElementById('opt-o2').addEventListener('click', function () { answer('o2'); });
  document.getElementById('opt-water').addEventListener('click', function () { answer('water'); });

  Studio.onVerdict(function (v) {
    feedback.classList.remove('ok', 'no');
    if (v && v.correct) {
      feedback.textContent = '✓';
      feedback.classList.add('ok');
      if (!doneSent) {
        doneSent = true;
        Studio.done();
      }
    } else {
      feedback.textContent = '✗';
      feedback.classList.add('no');
    }
  });

  Studio.ready();
})();
</script>
