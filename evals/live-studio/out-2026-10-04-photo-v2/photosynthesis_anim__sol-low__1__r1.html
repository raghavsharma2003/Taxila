<style>
  *{box-sizing:border-box}
  :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#173a35}
  .activity{width:100%;max-width:360px;height:640px;margin:auto;overflow:hidden;background:linear-gradient(#dff7ff 0%,#f4fff5 68%,#fff9e8 100%);padding:8px;display:flex;flex-direction:column;gap:6px}
  .title{height:32px;margin:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#175d4c;text-align:center}
  .scene{width:100%;height:322px;display:block;flex:none;border-radius:24px;background:linear-gradient(#ccefff 0%,#ebfbff 65%,#c89862 66%,#9a623d 100%);box-shadow:0 5px 14px #315f5225,inset 0 0 0 2px #ffffffb8}
  .sun-core{fill:#ffd54a;stroke:#f5a623;stroke-width:3;filter:drop-shadow(0 0 7px #ffd54aaa)}
  .ray{stroke:#ffd54a;stroke-width:4;stroke-linecap:round;opacity:.78}
  .stem{fill:none;stroke:#398a45;stroke-width:12;stroke-linecap:round}
  .leaf-shape{fill:#55b95e;stroke:#23783a;stroke-width:3;transition:filter .3s,transform .3s;transform-origin:205px 151px}
  .vein{fill:none;stroke:#d7f59d;stroke-width:2;stroke-linecap:round;opacity:.9}
  .root-line{fill:none;stroke:#785032;stroke-width:6;stroke-linecap:round}
  .soil-line{stroke:#70462f;stroke-width:3;opacity:.55}
  .particle{stroke:#fff;stroke-width:1.5;filter:drop-shadow(0 2px 2px #163f4330)}
  .water-dot{fill:#2799ed}
  .co2-dot{fill:#835bd8}
  .o2-dot{fill:#31b9a3}
  .glucose-dot{fill:#ffd34e;opacity:.72;filter:drop-shadow(0 0 5px #fff19a)}
  .svg-label{font-size:12px;font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;fill:#173a35}
  .inside-label{font-size:10px}
  .flow{transition:opacity .25s}
  .scene.step-1 .rays,.scene.step-2 .water-flow,.scene.step-3 .co2-flow,.scene.step-4 .o2-flow,.scene.step-5 .glucose-flow{filter:drop-shadow(0 0 6px #fff);opacity:1}
  .scene.step-2 .water-dot,.scene.step-3 .co2-dot,.scene.step-4 .o2-dot{stroke-width:3}
  .scene.step-5 .leaf-shape{filter:drop-shadow(0 0 9px #ffd848);transform:scale(1.025)}
  .controls{height:91px;flex:none;border-radius:20px;background:#ffffffd9;padding:7px;box-shadow:0 3px 10px #315f5220}
  .control-top{width:100%;display:flex;gap:6px;align-items:center}
  button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  button:active{transform:scale(.94)}
  .play{width:72px;min-width:72px;height:44px;padding:0 4px;border-radius:15px;background:#176e59;color:#fff;font-size:13px;font-weight:800;box-shadow:0 3px 0 #0c4e3e;transition:transform .12s,background .2s}
  .steps{min-width:0;flex:1;display:grid;grid-template-columns:repeat(5,minmax(44px,1fr));gap:4px}
  .step{width:100%;min-width:44px;height:44px;padding:0;border-radius:14px;background:#ddf1e9;color:#176e59;font-weight:900;transition:transform .2s,background .2s,color .2s}
  .step.active{background:#ffd75d;color:#624700;transform:translateY(-2px);box-shadow:0 3px 0 #d4a72d}
  [data-caption]{height:32px;margin-top:3px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;font-weight:750;line-height:1.15;color:#315349;padding:0 4px}
  .check{height:165px;flex:none;border-radius:20px;background:#ffffffdf;padding:8px;box-shadow:0 3px 10px #315f5220}
  .ask{min-height:43px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;font-weight:800;line-height:1.15;padding:0 5px}
  .options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
  .option{width:100%;min-width:0;height:48px;padding:0 3px;border-radius:15px;background:#e3f3ff;color:#185b79;font-weight:850;box-shadow:0 3px 0 #9dcde5;transition:transform .12s,background .2s}
  .option:nth-child(2){background:#e8f8ed;color:#23703e;box-shadow:0 3px 0 #acd9b9}
  .option:nth-child(3){background:#ece5ff;color:#624497;box-shadow:0 3px 0 #c5b4e8}
  .option.good{background:#74d58a;color:#123f21;animation:pop .5s ease}
  .option.try{animation:shake .35s ease}
  .feedback{height:34px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:#258246}
  .feedback.bad{color:#c34d45}
  @keyframes pop{50%{transform:scale(1.08)}}
  @keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
</style>

<main class="activity">
  <h1 class="title" data-text="title"></h1>

  <svg class="scene step-1" viewBox="0 0 344 322" role="img">
    <g class="rays flow">
      <line class="ray" x1="63" y1="44" x2="166" y2="128"/>
      <line class="ray" x1="78" y1="27" x2="192" y2="119"/>
      <line class="ray" x1="46" y1="59" x2="150" y2="150"/>
    </g>

    <circle class="sun-core" cx="47" cy="35" r="25"/>
    <text class="svg-label" data-label="sun" x="82" y="29"></text>

    <path class="stem" d="M172 271 C174 228 170 188 194 155"/>
    <path class="leaf-shape" data-entity="leaf" d="M181 158 C192 113 244 106 271 128 C252 170 214 184 181 158 Z"/>
    <path class="vein" d="M185 157 C211 149 235 137 261 127 M215 148 L211 127 M231 140 L247 151"/>

    <g data-entity="roots">
      <path class="root-line" d="M172 267 C158 281 151 295 145 311"/>
      <path class="root-line" d="M172 269 C180 287 194 296 201 311"/>
      <path class="root-line" d="M168 276 C156 287 137 289 126 302"/>
      <path class="root-line" d="M177 279 C190 284 211 282 225 298"/>
    </g>
    <line class="soil-line" x1="0" y1="261" x2="344" y2="261"/>

    <g class="water-flow flow">
      <circle class="particle water-dot" data-flow="water" r="5"/>
      <circle class="particle water-dot" data-flow="water" r="5"/>
      <circle class="particle water-dot" data-flow="water" r="5"/>
      <circle class="particle water-dot" data-flow="water" r="5"/>
    </g>

    <g class="co2-flow flow">
      <circle class="particle co2-dot" data-flow="co2" r="6"/>
      <circle class="particle co2-dot" data-flow="co2" r="6"/>
      <circle class="particle co2-dot" data-flow="co2" r="6"/>
      <circle class="particle co2-dot" data-flow="co2" r="6"/>
    </g>

    <g class="o2-flow flow">
      <circle class="particle o2-dot" data-flow="o2" r="5"/>
      <circle class="particle o2-dot" data-flow="o2" r="5"/>
      <circle class="particle o2-dot" data-flow="o2" r="5"/>
      <circle class="particle o2-dot" data-flow="o2" r="5"/>
    </g>

    <g class="glucose-flow flow">
      <circle class="glucose-dot" cx="211" cy="151" r="8"/>
      <circle class="glucose-dot" cx="229" cy="142" r="6"/>
      <circle class="glucose-dot" cx="238" cy="157" r="5"/>
    </g>

    <text class="svg-label" data-label="leaf" x="218" y="105" text-anchor="middle"></text>
    <text class="svg-label" data-label="roots" x="96" y="306" text-anchor="middle"></text>
    <text class="svg-label" data-label="water" x="18" y="238"></text>
    <text class="svg-label" data-label="co2" x="326" y="153" text-anchor="end"></text>
    <text class="svg-label" data-label="o2" x="326" y="76" text-anchor="end"></text>
    <text class="svg-label inside-label" data-label="glucose" x="229" y="181" text-anchor="middle"></text>
  </svg>

  <section class="controls">
    <div class="control-top">
      <button class="play" type="button" data-action="play"></button>
      <div class="steps" data-steps></div>
    </div>
    <div data-caption></div>
  </section>

  <section class="check">
    <div class="ask" data-text="ask"></div>
    <div class="options">
      <button class="option" type="button" data-option="co2"></button>
      <button class="option" type="button" data-option="o2"></button>
      <button class="option" type="button" data-option="water"></button>
    </div>
    <div class="feedback" aria-live="polite"></div>
  </section>
</main>

<script>
(() => {
  const scene = document.querySelector('.scene');
  const playButton = document.querySelector('[data-action="play"]');
  const caption = document.querySelector('[data-caption]');
  const stepsBox = document.querySelector('[data-steps]');
  const feedback = document.querySelector('.feedback');
  const stepCount = Studio.params.steps;
  const flowNames = Object.keys(Studio.params.flows);
  let step = 0;
  let playing = true;
  let lastAdvance = performance.now();
  let submitted = null;
  let finished = false;

  document.querySelectorAll('[data-text]').forEach(el => {
    el.textContent = Studio.t(el.dataset.text);
  });

  document.querySelectorAll('[data-label]').forEach(el => {
    el.textContent = Studio.t(el.dataset.label);
  });

  document.querySelectorAll('[data-option]').forEach(el => {
    el.textContent = Studio.t(el.dataset.option);
    el.setAttribute('aria-label', Studio.t(el.dataset.option));
  });

  for (let i = 0; i < stepCount; i += 1) {
    const n = i + 1;
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'step';
    button.dataset.action = 'step-' + n;
    button.textContent = n;
    button.setAttribute('aria-label', Studio.t('step' + n));
    button.addEventListener('click', () => {
      step = i;
      lastAdvance = performance.now();
      renderStep();
      Studio.event('step', {step:n});
    });
    stepsBox.appendChild(button);
  }

  function renderStep() {
    const n = step + 1;
    for (let i = 1; i <= stepCount; i += 1) {
      scene.classList.remove('step-' + i);
    }
    scene.classList.add('step-' + n);
    caption.textContent = Studio.t('step' + n);
    document.querySelectorAll('.step').forEach((button, index) => {
      button.classList.toggle('active', index === step);
    });
    playButton.textContent = Studio.t(playing ? 'pause' : 'play');
    playButton.setAttribute('aria-label', Studio.t(playing ? 'pause' : 'play'));
  }

  playButton.addEventListener('click', () => {
    playing = !playing;
    lastAdvance = performance.now();
    renderStep();
    Studio.event('play', {playing});
  });

  const particles = {};
  flowNames.forEach(name => {
    particles[name] = Array.from(document.querySelectorAll('[data-flow="' + name + '"]'));
  });

  function positionWater(particle, phase) {
    const bend = Math.sin(phase * Math.PI) * 5;
    particle.setAttribute('cx', 171 + bend + phase * 22);
    particle.setAttribute('cy', 286 - phase * 143);
  }

  function positionCo2(particle, phase) {
    particle.setAttribute('cx', 332 - phase * 108);
    particle.setAttribute('cy', 137 + Math.sin(phase * Math.PI * 2) * 11);
  }

  function positionO2(particle, phase) {
    particle.setAttribute('cx', 235 + phase * 94);
    particle.setAttribute('cy', 126 - phase * 51 + Math.sin(phase * Math.PI * 2) * 7);
  }

  function animate(now) {
    if (playing) {
      const cycle = now / 2600;
      particles.water.forEach((particle, index) => {
        positionWater(particle, (cycle + index / particles.water.length) % 1);
      });
      particles.co2.forEach((particle, index) => {
        positionCo2(particle, (cycle + index / particles.co2.length) % 1);
      });
      particles.o2.forEach((particle, index) => {
        positionO2(particle, (cycle + index / particles.o2.length) % 1);
      });

      if (now - lastAdvance > 4200) {
        step = (step + 1) % stepCount;
        lastAdvance = now;
        renderStep();
      }
    }
    requestAnimationFrame(animate);
  }

  document.querySelectorAll('.option').forEach(button => {
    button.addEventListener('click', () => {
      if (finished) return;
      submitted = button;
      feedback.textContent = '';
      feedback.classList.remove('bad');
      document.querySelectorAll('.option').forEach(option => {
        option.classList.remove('try', 'good');
      });
      Studio.event('answer', {value:button.dataset.option});
      Studio.answer(button.dataset.option);
    });
  });

  Studio.onVerdict(result => {
    if (!submitted || finished) return;
    if (result.correct) {
      finished = true;
      submitted.classList.add('good');
      feedback.textContent = '✓';
      Studio.done();
    } else {
      submitted.classList.add('try');
      feedback.classList.add('bad');
      feedback.textContent = '↻';
      const current = submitted;
      setTimeout(() => current.classList.remove('try'), 400);
    }
  });

  renderStep();
  requestAnimationFrame(animate);
  Studio.ready();
})();
</script>
