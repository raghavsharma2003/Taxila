<style>
  :root{--ink:#21475b;--sky:#dff6ff;--sun:#ffd85c;--green:#56b96c;--deep:#2d8752;--soil:#a96e47;--water:#319ded;--co:#8976dc;--oxy:#51c8ab;--gold:#f5a93c}
  *{box-sizing:border-box}
  body{margin:0;overflow:hidden;background:linear-gradient(180deg,#e9f9ff,#f7fbed);font-family:system-ui,sans-serif;color:var(--ink)}
  .app{width:100%;max-width:360px;height:640px;margin:auto;padding:8px 9px;display:flex;flex-direction:column;gap:6px}
  h1{margin:0;height:26px;line-height:26px;text-align:center;font-size:20px;font-weight:850;color:#25546b}
  .scene{height:258px;flex:none;border:2px solid #fff;border-radius:21px;overflow:hidden;background:linear-gradient(#bfeaff 0%,#e9f9ff 66%,#d9bc89 66%);box-shadow:0 4px 14px #75aebe44}
  svg{display:block;width:100%;height:100%}
  .label{font-size:11px;font-weight:850;fill:#21475b;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
  .ray{stroke:#ffd85c;stroke-width:4;stroke-linecap:round;opacity:.72}
  .light-on .ray{animation:shine 1.4s ease-in-out infinite}
  @keyframes shine{50%{opacity:1;stroke-width:6}}
  .leafshape{transition:filter .3s,fill .3s}
  .glow{transform-origin:208px 119px}
  .light-on .glow{animation:glow 1.35s ease-in-out infinite}
  @keyframes glow{50%{opacity:.8;transform:scale(1.18)}}
  .focus-water .stem{filter:drop-shadow(0 0 5px #319ded)}
  .focus-co2 .leafshape{filter:drop-shadow(0 0 7px #8976dc)}
  .focus-o2 .leafshape{filter:drop-shadow(0 0 7px #51c8ab)}
  .focus-glucose .glow{opacity:1}
  .flow{stroke:#fff;stroke-width:1.5;filter:drop-shadow(0 1px 1px #21475b66)}
  .water{fill:#319ded}.co2{fill:#8976dc}.o2{fill:#51c8ab}
  .controls{height:45px;display:flex;align-items:center;gap:5px;flex:none}
  button{border:0;font:inherit;font-weight:850;cursor:pointer;min-height:44px;touch-action:manipulation;transition:transform .16s,background .16s,box-shadow .16s;color:var(--ink)}
  button:active{transform:scale(.93)}
  .play{width:78px;flex:none;border-radius:14px;background:#28566c;color:#fff;box-shadow:0 3px 0 #183b4d}
  .steps{flex:1;display:flex;justify-content:space-between;gap:3px}
  .step{width:44px;min-width:44px;border-radius:50%;background:#fff;border:2px solid #aad9e7;box-shadow:0 2px 0 #8bc2d0}
  .step.active{background:var(--sun);border-color:#e4aa24;box-shadow:0 3px 0 #c98c1e;transform:translateY(-2px)}
  [data-caption]{height:38px;flex:none;display:flex;align-items:center;justify-content:center;padding:3px 9px;border:2px solid #f2df9a;border-radius:14px;background:#fffdf0;text-align:center;font-size:13px;font-weight:750;line-height:15px;color:#5d4b22}
  .check{flex:none;border-radius:17px;background:#fff;padding:6px 7px 7px;box-shadow:0 3px 12px #75aebe33}
  .ask{min-height:18px;text-align:center;font-size:13px;line-height:18px;font-weight:850}
  .answers{display:flex;gap:6px;margin-top:4px}
  .answer{flex:1;border-radius:13px;background:#edf8fb;border:2px solid #b4dfeb}
  .answer.selected{background:#fff3b8;border-color:#edbd3d}
  .feedback{height:12px;line-height:12px;text-align:center;font-weight:900;font-size:13px;opacity:0;color:#45a66c;transition:opacity .2s}
  .feedback.show{opacity:1}.feedback.no{color:#d9695d}
</style>

<div class="app">
  <h1 data-text="title"></h1>
  <div class="scene light-on focus-water" id="scene">
    <svg viewBox="0 0 340 258" role="img">
      <circle cx="48" cy="42" r="23" fill="#ffd85c"></circle>
      <g>
        <path class="ray" d="M73 59 L160 101"></path>
        <path class="ray" d="M69 70 L160 113"></path>
        <path class="ray" d="M80 48 L169 91"></path>
      </g>
      <text class="label" data-label="sun" x="48" y="79" text-anchor="middle"></text>

      <path d="M0 176 Q46 167 90 177 T175 173 T260 178 T340 173 V258 H0Z" fill="#a96e47"></path>
      <path d="M0 186 Q48 176 93 186 T176 182 T260 187 T340 182" fill="none" stroke="#875439" stroke-width="5"></path>

      <g class="plant">
        <path class="stem" d="M162 184 C165 159 169 132 173 111" fill="none" stroke="#378b52" stroke-width="11" stroke-linecap="round"></path>
        <g data-entity="roots">
          <path d="M161 181 C146 191 138 211 132 239 M165 183 C182 194 191 216 204 240 M159 187 C153 205 156 222 157 243 M168 186 C177 204 175 223 174 243" fill="none" stroke="#824f38" stroke-width="5" stroke-linecap="round"></path>
        </g>
        <path class="leafshape" data-entity="leaf" d="M171 117 C182 78 230 67 260 85 C244 126 209 143 171 117Z" fill="#56b96c" stroke="#2d8752" stroke-width="3"></path>
        <path d="M176 115 Q207 103 245 88 M201 105 L211 125 M218 98 L229 116" fill="none" stroke="#d7f2ad" stroke-width="2.5" stroke-linecap="round"></path>
        <circle class="glow" cx="208" cy="111" r="17" fill="#ffe16c" opacity=".43"></circle>
        <circle cx="208" cy="111" r="7" fill="#f5a93c"></circle>
      </g>

      <circle class="flow water" data-flow="water" cx="156" cy="222" r="5"></circle>
      <circle class="flow water" data-flow="water" cx="161" cy="203" r="5"></circle>
      <circle class="flow water" data-flow="water" cx="166" cy="180" r="5"></circle>
      <circle class="flow co2" data-flow="co2" cx="303" cy="105" r="6"></circle>
      <circle class="flow co2" data-flow="co2" cx="284" cy="113" r="6"></circle>
      <circle class="flow co2" data-flow="co2" cx="264" cy="121" r="6"></circle>
      <circle class="flow o2" data-flow="o2" cx="239" cy="69" r="6"></circle>
      <circle class="flow o2" data-flow="o2" cx="267" cy="53" r="6"></circle>
      <circle class="flow o2" data-flow="o2" cx="296" cy="37" r="6"></circle>

      <text class="label" data-label="leaf" x="238" y="151" text-anchor="middle"></text>
      <text class="label" data-label="roots" x="79" y="236" text-anchor="middle"></text>
      <text class="label" data-label="water" x="112" y="166" text-anchor="middle"></text>
      <text class="label" data-label="co2" x="320" y="143" text-anchor="end"></text>
      <text class="label" data-label="o2" x="323" y="18" text-anchor="end"></text>
      <text class="label" data-label="glucose" x="208" y="166" text-anchor="middle"></text>
    </svg>
  </div>

  <div class="controls">
    <button class="play" data-action="play"></button>
    <div class="steps">
      <button class="step active" data-action="step-1"></button>
      <button class="step" data-action="step-2"></button>
      <button class="step" data-action="step-3"></button>
      <button class="step" data-action="step-4"></button>
      <button class="step" data-action="step-5"></button>
    </div>
  </div>

  <div data-caption></div>

  <div class="check">
    <div class="ask" data-text="ask"></div>
    <div class="answers">
      <button class="answer" data-option="co2"></button>
      <button class="answer" data-option="o2"></button>
      <button class="answer" data-option="water"></button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
</div>

<script>
(function(){
  var params=Studio.params, playing=true, step=1, tick=0, frame=0;
  var scene=document.getElementById('scene');
  var caption=document.querySelector('[data-caption]');
  var play=document.querySelector('[data-action="play"]');
  var feedback=document.getElementById('feedback');
  var waters=[].slice.call(document.querySelectorAll('[data-flow="water"]'));
  var carbon=[].slice.call(document.querySelectorAll('[data-flow="co2"]'));
  var oxygen=[].slice.call(document.querySelectorAll('[data-flow="o2"]'));

  document.querySelectorAll('[data-text]').forEach(function(el){el.textContent=Studio.t(el.getAttribute('data-text'));});
  document.querySelectorAll('[data-label]').forEach(function(el){el.textContent=Studio.t(el.getAttribute('data-label'));});
  document.querySelectorAll('[data-option]').forEach(function(el){el.textContent=Studio.t(el.getAttribute('data-option'));});
  document.querySelectorAll('.step').forEach(function(el,i){
    if(i<params.steps){el.textContent=String(i+1);}
    else{el.style.display='none';}
  });

  function showStep(n){
    step=n;
    caption.textContent=Studio.t('step'+n);
    document.querySelectorAll('.step').forEach(function(el,i){el.classList.toggle('active',i===n-1);});
    scene.className='scene light-on focus-'+(['water','co2','o2','glucose','glucose'][n-1]);
    Studio.event('step',{step:n});
  }

  function draw(){
    if(!playing)return;
    tick=(tick+1)%100;
    waters.forEach(function(el,i){
      var v=(tick+i*31)%100;
      el.setAttribute('cx',155+v*.16);
      el.setAttribute('cy',238-v*1.23);
    });
    carbon.forEach(function(el,i){
      var v=(tick+i*33)%100;
      el.setAttribute('cx',316-v*.72);
      el.setAttribute('cy',91+v*.30);
    });
    oxygen.forEach(function(el,i){
      var v=(tick+i*34)%100;
      el.setAttribute('cx',224+v*.78);
      el.setAttribute('cy',112-v*.78);
    });
    frame=requestAnimationFrame(draw);
  }

  function setPlaying(value){
    playing=value;
    play.textContent=Studio.t(playing?'pause':'play');
    scene.classList.toggle('light-on',playing);
    if(playing){frame=requestAnimationFrame(draw);}
    else if(frame){cancelAnimationFrame(frame);frame=0;}
    Studio.event('play',{playing:playing});
  }

  play.addEventListener('click',function(){setPlaying(!playing);});
  document.querySelectorAll('.step').forEach(function(el,i){
    el.addEventListener('click',function(){if(i<params.steps)showStep(i+1);});
  });

  document.querySelectorAll('[data-option]').forEach(function(button){
    button.addEventListener('click',function(){
      document.querySelectorAll('.answer').forEach(function(el){el.classList.remove('selected');});
      button.classList.add('selected');
      feedback.className='feedback';
      Studio.event('answer',{option:button.getAttribute('data-option')});
      Studio.answer(button.getAttribute('data-option'));
    });
  });

  Studio.onVerdict(function(verdict){
    feedback.textContent=verdict.correct?'✓':'↻';
    feedback.className='feedback show '+(verdict.correct?'':'no');
    if(verdict.correct)Studio.done();
  });

  showStep(step);
  play.textContent=Studio.t('pause');
  frame=requestAnimationFrame(draw);
  Studio.ready();
})();
</script>
