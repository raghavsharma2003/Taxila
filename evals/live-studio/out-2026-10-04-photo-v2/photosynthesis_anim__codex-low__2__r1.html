<style>
  :root{
    --bg:#f3fbff;
    --card:#ffffff;
    --ink:#1f2a44;
    --sun:#ffd34d;
    --leaf:#43b66e;
    --stem:#2f8f52;
    --soil:#9a6a43;
    --water:#35a7ff;
    --co2:#7a7a8c;
    --o2:#6ed7ff;
    --glucose:#ffd166;
    --ok:#25b05a;
    --bad:#e05353;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    font-family:ui-rounded,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color:var(--ink);
  }
  .wrap{
    width:360px;
    max-width:100vw;
    margin:0 auto;
    padding:8px;
  }
  .title{
    font-weight:800;
    font-size:20px;
    line-height:1.2;
    margin:2px 2px 8px;
    text-align:center;
  }
  .scene{
    width:100%;
    background:linear-gradient(#dff4ff 0%, #effbff 62%, #f8f1ea 62%, #f8f1ea 100%);
    border-radius:18px;
    border:2px solid #d2e9f7;
    overflow:hidden;
  }
  svg{display:block;width:100%;height:auto}
  .label{
    font-size:12px;
    font-weight:700;
    fill:#21304d;
    paint-order:stroke;
    stroke:#ffffff;
    stroke-width:3px;
    stroke-linejoin:round;
  }
  .controls{
    margin-top:8px;
    background:var(--card);
    border:2px solid #dbe8f5;
    border-radius:14px;
    padding:8px;
  }
  .row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center;
  }
  button{
    min-height:44px;
    border:none;
    border-radius:12px;
    padding:8px 12px;
    font-weight:800;
    color:#1e2740;
    background:#e9f1ff;
    cursor:pointer;
    transition:transform .12s ease, filter .2s ease, background .2s ease;
    touch-action:manipulation;
  }
  button:active{transform:scale(0.96)}
  .play{min-width:120px;background:#dff2ff}
  .step{min-width:44px;width:44px;padding:0;background:#eef3fb}
  .step.active{background:#cfe0ff;outline:2px solid #8fb0ff}
  .caption{
    margin-top:8px;
    min-height:44px;
    border-radius:12px;
    background:#f4f8ff;
    border:2px dashed #d7e5ff;
    padding:10px 12px;
    font-weight:700;
    color:#273657;
  }
  .qa{margin-top:8px;border-top:2px solid #edf3fb;padding-top:8px}
  .ask{font-weight:800;margin:2px 2px 8px}
  .opt{flex:1;min-width:96px;background:#edf7ff}
  .feedback{
    height:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:20px;
  }
  .good{color:var(--ok)}
  .bad{color:var(--bad)}
  .ray{opacity:.65;transition:opacity .35s ease}
  .glow{filter:url(#glow)}
  .dim{opacity:.22;transition:opacity .3s ease}
  .pulse{
    animation:pulse 1.2s ease-in-out infinite;
    transform-origin:center;
    transform-box:fill-box;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.06)}
  }
</style>

<div class="wrap">
  <div class="title" id="title"></div>

  <div class="scene">
    <svg viewBox="0 0 360 310" aria-hidden="true">
      <defs>
        <filter id="glow">
          <feGaussianBlur stdDeviation="2.2" result="b"></feGaussianBlur>
          <feMerge>
            <feMergeNode in="b"></feMergeNode>
            <feMergeNode in="SourceGraphic"></feMergeNode>
          </feMerge>
        </filter>
      </defs>

      <g id="sunGroup">
        <circle cx="56" cy="46" r="26" fill="#ffd34d" stroke="#f7b500" stroke-width="3"></circle>
        <line class="ray" x1="86" y1="50" x2="142" y2="86" stroke="#ffd34d" stroke-width="5" stroke-linecap="round"></line>
        <line class="ray" x1="80" y1="68" x2="147" y2="130" stroke="#ffd34d" stroke-width="4" stroke-linecap="round"></line>
        <line class="ray" x1="72" y1="80" x2="137" y2="163" stroke="#ffd34d" stroke-width="4" stroke-linecap="round"></line>
        <text class="label" data-label="sun" x="14" y="90"></text>
      </g>

      <rect x="0" y="220" width="360" height="90" fill="#c59062"></rect>
      <rect x="0" y="236" width="360" height="74" fill="#9a6a43"></rect>

      <g id="plant">
        <rect id="stem" x="178" y="122" width="10" height="102" rx="5" fill="#2f8f52"></rect>

        <g id="leafShape" data-entity="leaf">
          <ellipse cx="209" cy="118" rx="62" ry="33" transform="rotate(-15 209 118)" fill="#43b66e" stroke="#2f8f52" stroke-width="3"></ellipse>
          <path d="M162 130 Q209 116 258 104" fill="none" stroke="#2f8f52" stroke-width="3" stroke-linecap="round"></path>
          <circle id="glucoseCore" class="glow" cx="210" cy="118" r="8" fill="#ffd166" opacity="0.8"></circle>
          <text class="label" data-label="leaf" x="244" y="112"></text>
          <text class="label" data-label="glucose" x="226" y="132"></text>
        </g>

        <g id="rootsShape" data-entity="roots">
          <path d="M183 222 C180 244 168 250 157 256" stroke="#7b4b2a" stroke-width="5" fill="none" stroke-linecap="round"></path>
          <path d="M183 222 C190 245 204 252 220 258" stroke="#7b4b2a" stroke-width="5" fill="none" stroke-linecap="round"></path>
          <path d="M183 224 C182 248 178 260 170 268" stroke="#7b4b2a" stroke-width="4" fill="none" stroke-linecap="round"></path>
          <path d="M184 224 C190 248 197 262 206 270" stroke="#7b4b2a" stroke-width="4" fill="none" stroke-linecap="round"></path>
          <text class="label" data-label="roots" x="214" y="280"></text>
        </g>
      </g>

      <g id="waterFlow">
        <circle data-flow="water" r="4.5" fill="#35a7ff" cx="170" cy="258"></circle>
        <circle data-flow="water" r="4.5" fill="#35a7ff" cx="178" cy="248"></circle>
        <circle data-flow="water" r="4.5" fill="#35a7ff" cx="186" cy="238"></circle>
        <circle data-flow="water" r="4.5" fill="#35a7ff" cx="174" cy="228"></circle>
        <text class="label" data-label="water" x="114" y="258"></text>
      </g>

      <g id="co2Flow">
        <circle data-flow="co2" r="4.5" fill="#7a7a8c" cx="326" cy="102"></circle>
        <circle data-flow="co2" r="4.5" fill="#7a7a8c" cx="312" cy="110"></circle>
        <circle data-flow="co2" r="4.5" fill="#7a7a8c" cx="338" cy="128"></circle>
        <circle data-flow="co2" r="4.5" fill="#7a7a8c" cx="324" cy="138"></circle>
        <text class="label" data-label="co2" x="252" y="86"></text>
      </g>

      <g id="o2Flow">
        <circle data-flow="o2" r="4.5" fill="#6ed7ff" cx="120" cy="90"></circle>
        <circle data-flow="o2" r="4.5" fill="#6ed7ff" cx="108" cy="106"></circle>
        <circle data-flow="o2" r="4.5" fill="#6ed7ff" cx="94" cy="122"></circle>
        <circle data-flow="o2" r="4.5" fill="#6ed7ff" cx="82" cy="138"></circle>
        <text class="label" data-label="o2" x="20" y="108"></text>
      </g>
    </svg>
  </div>

  <div class="controls">
    <div class="row">
      <button class="play" data-action="play" id="playBtn"></button>
      <div class="row" id="stepRow"></div>
    </div>
    <div class="caption" data-caption id="caption"></div>

    <div class="qa">
      <div class="ask" id="ask"></div>
      <div class="row">
        <button class="opt" data-option="co2" id="opt-co2"></button>
        <button class="opt" data-option="o2" id="opt-o2"></button>
        <button class="opt" data-option="water" id="opt-water"></button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
  </div>
</div>

<script>
(function(){
  const steps = Number((Studio.params && Studio.params.steps) || 1);
  let currentStep = 1;
  let playing = true;
  let doneCalled = false;
  let stepElapsed = 0;
  let lastTs = 0;
  let flowTime = 0;
  const stepMs = 2600;

  const title = document.getElementById('title');
  const playBtn = document.getElementById('playBtn');
  const caption = document.getElementById('caption');
  const stepRow = document.getElementById('stepRow');
  const ask = document.getElementById('ask');
  const feedback = document.getElementById('feedback');

  title.textContent = Studio.t('title');
  ask.textContent = Studio.t('ask');

  document.querySelectorAll('[data-label]').forEach(function(el){
    el.textContent = Studio.t(el.getAttribute('data-label'));
  });

  document.getElementById('opt-co2').textContent = Studio.t('co2');
  document.getElementById('opt-o2').textContent = Studio.t('o2');
  document.getElementById('opt-water').textContent = Studio.t('water');

  const stepButtons = [];
  for(let i=1;i<=steps;i++){
    const b = document.createElement('button');
    b.className = 'step';
    b.setAttribute('data-action','step-'+i);
    b.textContent = i;
    b.addEventListener('click', function(){
      currentStep = i;
      playing = false;
      stepElapsed = 0;
      updatePlayLabel();
      applyStep();
      Studio.event('step_tap',{step:i});
    });
    stepRow.appendChild(b);
    stepButtons.push(b);
  }

  function updatePlayLabel(){
    playBtn.textContent = playing ? Studio.t('pause') : Studio.t('play');
  }

  function applyStep(){
    caption.textContent = Studio.t('step'+currentStep);
    stepButtons.forEach(function(b,idx){ b.classList.toggle('active', idx===currentStep-1); });

    const sun = document.getElementById('sunGroup');
    const water = document.getElementById('waterFlow');
    const co2 = document.getElementById('co2Flow');
    const o2 = document.getElementById('o2Flow');
    const glucose = document.getElementById('glucoseCore');
    const leaf = document.getElementById('leafShape');

    [sun,water,co2,o2,glucose,leaf].forEach(function(el){
      el.classList.remove('pulse');
      el.classList.add('dim');
    });
    glucose.style.opacity = '0.35';

    if(currentStep===1){ sun.classList.add('pulse'); sun.classList.remove('dim'); leaf.classList.remove('dim'); }
    if(currentStep===2){ water.classList.add('pulse'); water.classList.remove('dim'); leaf.classList.remove('dim'); }
    if(currentStep===3){ co2.classList.add('pulse'); co2.classList.remove('dim'); leaf.classList.remove('dim'); }
    if(currentStep===4){ glucose.classList.add('pulse'); glucose.classList.remove('dim'); leaf.classList.remove('dim'); glucose.style.opacity='0.95'; }
    if(currentStep===5){ o2.classList.add('pulse'); o2.classList.remove('dim'); leaf.classList.remove('dim'); }
  }

  playBtn.addEventListener('click', function(){
    playing = !playing;
    updatePlayLabel();
    Studio.event('play_toggle',{playing:playing});
  });

  const paths = {
    water:[{x:170,y:260},{x:176,y:240},{x:182,y:214},{x:183,y:182},{x:186,y:150},{x:194,y:128}],
    co2:[{x:336,y:104},{x:314,y:106},{x:290,y:108},{x:266,y:110},{x:242,y:113},{x:222,y:116}],
    o2:[{x:204,y:114},{x:182,y:108},{x:156,y:100},{x:130,y:92},{x:106,y:84},{x:82,y:76}]
  };

  function pointAlong(arr,t){
    const n = arr.length-1;
    const p = Math.max(0, Math.min(0.9999, t))*n;
    const i = Math.floor(p);
    const f = p-i;
    const a = arr[i], b = arr[i+1];
    return {x:a.x+(b.x-a.x)*f, y:a.y+(b.y-a.y)*f};
  }

  const waterDots = Array.from(document.querySelectorAll('[data-flow="water"]'));
  const co2Dots = Array.from(document.querySelectorAll('[data-flow="co2"]'));
  const o2Dots = Array.from(document.querySelectorAll('[data-flow="o2"]'));

  function drawParticles(){
    const drift = flowTime*0.00018;
    waterDots.forEach(function(c,i){
      const p = pointAlong(paths.water, (drift + i*0.22)%1);
      c.setAttribute('cx', p.x.toFixed(1));
      c.setAttribute('cy', p.y.toFixed(1));
    });
    co2Dots.forEach(function(c,i){
      const p = pointAlong(paths.co2, (drift + i*0.25)%1);
      c.setAttribute('cx', p.x.toFixed(1));
      c.setAttribute('cy', p.y.toFixed(1));
    });
    o2Dots.forEach(function(c,i){
      const p = pointAlong(paths.o2, (drift + i*0.24)%1);
      c.setAttribute('cx', p.x.toFixed(1));
      c.setAttribute('cy', p.y.toFixed(1));
    });
  }

  function animate(ts){
    if(!lastTs) lastTs = ts;
    const dt = ts - lastTs;
    lastTs = ts;

    if(playing){
      flowTime += dt;
      stepElapsed += dt;
      if(stepElapsed >= stepMs){
        currentStep = (currentStep % steps) + 1;
        stepElapsed = 0;
        applyStep();
      }
    }

    drawParticles();
    requestAnimationFrame(animate);
  }

  document.querySelectorAll('[data-option]').forEach(function(btn){
    btn.addEventListener('click', function(){
      const v = btn.getAttribute('data-option');
      Studio.answer(v);
      Studio.event('answer',{value:v});
    });
  });

  Studio.onVerdict(function(res){
    feedback.classList.remove('good','bad');
    if(res && res.correct){
      feedback.textContent = '✓';
      feedback.classList.add('good');
      if(!doneCalled){
        doneCalled = true;
        Studio.done();
      }
    }else{
      feedback.textContent = '✗';
      feedback.classList.add('bad');
    }
  });

  updatePlayLabel();
  applyStep();
  drawParticles();
  requestAnimationFrame(animate);
  Studio.ready();
})();
</script>
