<style>
  :root{
    --bg:#f3fbff;
    --card:#ffffff;
    --ink:#1f2a44;
    --soft:#6b7a99;
    --sun:#ffd54f;
    --leaf:#3fbf6f;
    --stem:#2e8b57;
    --soil:#9c6b3f;
    --water:#2f9bff;
    --co2:#7a6cff;
    --o2:#33c9a5;
    --glucose:#ff9f43;
    --accent:#ff6f91;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color:var(--ink);
  }
  .app{
    width:100%;
    max-width:360px;
    height:640px;
    margin:0 auto;
    padding:10px 10px 12px;
    display:flex;
    flex-direction:column;
    gap:8px;
    overflow:hidden;
  }
  .title{
    text-align:center;
    font-weight:800;
    font-size:20px;
    line-height:1.1;
    min-height:24px;
  }
  .sceneWrap{
    background:var(--card);
    border-radius:16px;
    padding:6px;
    box-shadow:0 4px 14px rgba(31,42,68,.12);
  }
  svg{width:100%;height:auto;display:block}
  .lbl{
    font-size:10px;
    font-weight:700;
    fill:#21304f;
    paint-order:stroke;
    stroke:#fff;
    stroke-width:2px;
    stroke-linejoin:round;
  }
  .particle{opacity:.85; transition:opacity .25s ease}
  .controls{
    display:flex;
    gap:6px;
    align-items:center;
  }
  button{
    border:0;
    border-radius:12px;
    min-height:44px;
    padding:8px 10px;
    font-weight:800;
    color:var(--ink);
    background:#e8eefc;
    transform:scale(1);
    transition:transform .12s ease, background .2s ease, box-shadow .2s ease, opacity .2s ease;
  }
  button:active{transform:scale(.96)}
  .play{
    min-width:92px;
    background:#d9f6e5;
  }
  .steps{
    display:flex;
    gap:5px;
    flex:1;
  }
  .stepBtn{
    flex:1;
    min-width:44px;
    padding:0;
    font-size:16px;
    background:#ecefff;
  }
  .stepBtn.active{
    background:#ffdff0;
    box-shadow:0 0 0 2px #ff8ab1 inset;
  }
  [data-caption]{
    min-height:32px;
    background:#fff;
    border-radius:10px;
    padding:7px 10px;
    font-weight:700;
    color:#2f4068;
    box-shadow:0 2px 8px rgba(31,42,68,.08);
    font-size:14px;
    line-height:1.3;
  }
  .ask{
    background:#ffffff;
    border-radius:12px;
    padding:8px;
    box-shadow:0 2px 8px rgba(31,42,68,.08);
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .askQ{
    font-weight:800;
    font-size:14px;
    line-height:1.25;
    min-height:18px;
  }
  .opts{
    display:flex;
    gap:6px;
  }
  .opt{
    flex:1;
    background:#eef3ff;
    font-size:14px;
  }
  .feedback{
    min-height:20px;
    text-align:center;
    font-size:20px;
    line-height:1;
  }
  .ray{opacity:.35; transition:opacity .3s ease}
  .flow-water .particle[data-flow="water"]{opacity:1}
  .flow-water .particle[data-flow="co2"],
  .flow-water .particle[data-flow="o2"]{opacity:.25}
  .flow-co2 .particle[data-flow="co2"]{opacity:1}
  .flow-co2 .particle[data-flow="water"],
  .flow-co2 .particle[data-flow="o2"]{opacity:.25}
  .flow-o2 .particle[data-flow="o2"]{opacity:1}
  .flow-o2 .particle[data-flow="water"],
  .flow-o2 .particle[data-flow="co2"]{opacity:.25}
  .step1 #rays .ray{opacity:1}
  .step2 #stem{filter:drop-shadow(0 0 4px rgba(47,155,255,.7))}
  .step3 [data-entity="leaf"]{filter:drop-shadow(0 0 5px rgba(122,108,255,.7))}
  .step4 #glucoseCore{opacity:1; transform-origin:170px 126px; animation:pulse 1s ease-in-out infinite}
  .step5 .o2-cloud{opacity:1}
  #glucoseCore{opacity:.55}
  .o2-cloud{opacity:.45; transition:opacity .3s}
  @keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.16)}
  }
</style>

<div class="app" id="app">
  <div class="title" id="title"></div>

  <div class="sceneWrap">
    <svg viewBox="0 0 340 290" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#dff6ff"/>
          <stop offset="100%" stop-color="#f8fdff"/>
        </linearGradient>
        <linearGradient id="soilGrad" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#b37a49"/>
          <stop offset="100%" stop-color="#8d5c33"/>
        </linearGradient>
      </defs>

      <rect x="0" y="0" width="340" height="290" rx="14" fill="url(#sky)"></rect>

      <g id="sunGroup">
        <circle cx="290" cy="42" r="26" fill="var(--sun)"></circle>
        <g id="rays" stroke="#ffcc33" stroke-width="4" stroke-linecap="round">
          <line class="ray" x1="255" y1="75" x2="198" y2="116"></line>
          <line class="ray" x1="270" y1="86" x2="206" y2="132"></line>
          <line class="ray" x1="286" y1="90" x2="217" y2="146"></line>
        </g>
        <text class="lbl" data-label="sun" x="254" y="14"></text>
      </g>

      <rect x="0" y="220" width="340" height="70" fill="url(#soilGrad)"></rect>

      <g id="plant">
        <rect id="stem" x="164" y="118" width="12" height="108" rx="6" fill="var(--stem)"></rect>
        <ellipse data-entity="leaf" cx="176" cy="126" rx="60" ry="30" fill="var(--leaf)" transform="rotate(-8 176 126)"></ellipse>

        <g data-entity="roots" stroke="#6f4525" stroke-width="5" stroke-linecap="round" fill="none">
          <path d="M170 226 C156 236,146 245,132 255"></path>
          <path d="M170 226 C180 238,188 246,200 255"></path>
          <path d="M170 226 C168 240,166 250,165 260"></path>
          <path d="M170 230 C152 240,145 250,140 262"></path>
          <path d="M170 230 C186 240,196 250,206 262"></path>
        </g>

        <circle id="glucoseCore" cx="170" cy="126" r="10" fill="var(--glucose)"></circle>
        <circle cx="170" cy="126" r="17" fill="none" stroke="var(--glucose)" stroke-opacity=".45" stroke-width="3"></circle>
      </g>

      <g id="waterFlow">
        <circle class="particle" data-flow="water" r="4.8" fill="var(--water)"></circle>
        <circle class="particle" data-flow="water" r="4.8" fill="var(--water)"></circle>
        <circle class="particle" data-flow="water" r="4.8" fill="var(--water)"></circle>
      </g>
      <g id="co2Flow">
        <circle class="particle" data-flow="co2" r="4.8" fill="var(--co2)"></circle>
        <circle class="particle" data-flow="co2" r="4.8" fill="var(--co2)"></circle>
        <circle class="particle" data-flow="co2" r="4.8" fill="var(--co2)"></circle>
      </g>
      <g id="o2Flow">
        <circle class="particle" data-flow="o2" r="4.8" fill="var(--o2)"></circle>
        <circle class="particle" data-flow="o2" r="4.8" fill="var(--o2)"></circle>
        <circle class="particle" data-flow="o2" r="4.8" fill="var(--o2)"></circle>
      </g>

      <g class="o2-cloud" fill="#ccfff3">
        <circle cx="263" cy="92" r="10"></circle>
        <circle cx="276" cy="88" r="8"></circle>
        <circle cx="288" cy="95" r="9"></circle>
      </g>

      <text class="lbl" data-label="leaf" x="112" y="98"></text>
      <text class="lbl" data-label="roots" x="104" y="274"></text>
      <text class="lbl" data-label="water" x="188" y="204"></text>
      <text class="lbl" data-label="co2" x="28" y="108"></text>
      <text class="lbl" data-label="o2" x="272" y="72"></text>
      <text class="lbl" data-label="glucose" x="191" y="132"></text>
    </svg>
  </div>

  <div class="controls">
    <button class="play" data-action="play" id="playBtn"></button>
    <div class="steps" id="steps"></div>
  </div>

  <div data-caption id="caption"></div>

  <div class="ask">
    <div class="askQ" id="ask"></div>
    <div class="opts">
      <button class="opt" data-option="co2" id="opt-co2"></button>
      <button class="opt" data-option="o2" id="opt-o2"></button>
      <button class="opt" data-option="water" id="opt-water"></button>
    </div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
  </div>
</div>

<script>
(() => {
  const app = document.getElementById('app');
  const stepsCount = Number(Studio.params.steps) || 5;
  let currentStep = 1;
  let playing = true;
  let doneSent = false;
  let lastStepSwitch = performance.now();
  const stepDuration = 2800;

  const title = document.getElementById('title');
  const playBtn = document.getElementById('playBtn');
  const caption = document.getElementById('caption');
  const ask = document.getElementById('ask');
  const feedback = document.getElementById('feedback');
  const stepsWrap = document.getElementById('steps');

  title.textContent = Studio.t('title');
  ask.textContent = Studio.t('ask');

  document.querySelectorAll('[data-label]').forEach(el => {
    el.textContent = Studio.t(el.getAttribute('data-label'));
  });

  document.getElementById('opt-co2').textContent = Studio.t('co2');
  document.getElementById('opt-o2').textContent = Studio.t('o2');
  document.getElementById('opt-water').textContent = Studio.t('water');

  function updatePlayText(){
    playBtn.textContent = playing ? Studio.t('pause') : Studio.t('play');
  }

  function setStep(n){
    currentStep = Math.max(1, Math.min(stepsCount, n));
    caption.textContent = Studio.t('step' + currentStep);
    app.classList.remove('step1','step2','step3','step4','step5','flow-water','flow-co2','flow-o2');
    app.classList.add('step' + currentStep);
    if (currentStep === 2) app.classList.add('flow-water');
    if (currentStep === 3) app.classList.add('flow-co2');
    if (currentStep === 5) app.classList.add('flow-o2');
    [...stepsWrap.children].forEach((b, i) => b.classList.toggle('active', i === currentStep - 1));
  }

  for(let i=1;i<=stepsCount;i++){
    const b = document.createElement('button');
    b.className = 'stepBtn';
    b.setAttribute('data-action', 'step-' + i);
    b.textContent = String(i);
    b.addEventListener('click', () => {
      setStep(i);
      lastStepSwitch = performance.now();
      Studio.event('step_tap', {step:i});
    });
    stepsWrap.appendChild(b);
  }

  playBtn.addEventListener('click', () => {
    playing = !playing;
    updatePlayText();
    Studio.event('play_toggle', {playing});
  });

  document.querySelectorAll('[data-option]').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = btn.getAttribute('data-option');
      Studio.answer(v);
      Studio.event('answer', {value:v});
    });
  });

  Studio.onVerdict(({correct}) => {
    feedback.textContent = correct ? '✅' : '❌';
    if (correct && !doneSent){
      doneSent = true;
      Studio.done();
    }
  });

  const waterNodes = [...document.querySelectorAll('#waterFlow [data-flow="water"]')];
  const co2Nodes = [...document.querySelectorAll('#co2Flow [data-flow="co2"]')];
  const o2Nodes = [...document.querySelectorAll('#o2Flow [data-flow="o2"]')];

  function posAlong(a,b,t){
    return {x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t};
  }

  function animate(now){
    if (playing && now - lastStepSwitch > stepDuration){
      setStep((currentStep % stepsCount) + 1);
      lastStepSwitch = now;
    }

    const tBase = now * 0.00022;

    waterNodes.forEach((n, i) => {
      const t = (tBase + i * 0.33) % 1;
      const p = posAlong({x:170,y:248},{x:170,y:132},t);
      n.setAttribute('cx', p.x.toFixed(2));
      n.setAttribute('cy', p.y.toFixed(2));
    });

    co2Nodes.forEach((n, i) => {
      const t = (tBase + i * 0.35) % 1;
      const p = posAlong({x:34,y:108},{x:127,y:126},t);
      n.setAttribute('cx', p.x.toFixed(2));
      n.setAttribute('cy', p.y.toFixed(2));
    });

    o2Nodes.forEach((n, i) => {
      const t = (tBase + i * 0.37) % 1;
      const p = posAlong({x:214,y:118},{x:306,y:70},t);
      n.setAttribute('cx', p.x.toFixed(2));
      n.setAttribute('cy', p.y.toFixed(2));
    });

    requestAnimationFrame(animate);
  }

  updatePlayText();
  setStep(1);
  requestAnimationFrame(animate);
  Studio.ready();
})();
</script>
