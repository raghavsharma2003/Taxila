<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: sans-serif; background: #e8f5e9; height: 640px; width: 360px; overflow: hidden; position: relative; }
  #scene { position: relative; width: 360px; height: 640px; overflow: hidden; }
  svg { position: absolute; top: 0; left: 0; width: 360px; height: 480px; }
  #bottom-panel { position: absolute; bottom: 0; left: 0; width: 360px; background: #c8e6c9; border-radius: 24px 24px 0 0; padding: 6px; display: flex; flex-direction: column; gap: 3px; align-items: center; }
  #play-area { display: flex; align-items: center; gap: 6px; width: 100%; justify-content: center; }
  #play-btn { background: #2e7d32; border: none; border-radius: 60px; width: 56px; height: 40px; font-size: 12px; font-weight: bold; color: white; cursor: pointer; transition: transform 0.15s; display: flex; align-items: center; justify-content: center; gap: 3px; }
  #play-btn:active { transform: scale(0.92); }
  #step-btns { display: flex; gap: 3px; }
  .step-btn { background: #81c784; border: none; border-radius: 40px; width: 40px; height: 40px; font-size: 12px; font-weight: bold; color: #1b5e20; cursor: pointer; transition: transform 0.15s, background 0.3s; }
  .step-btn.active { background: #2e7d32; color: white; transform: scale(1.05); }
  .step-btn:active { transform: scale(0.88); }
  #caption { font-size: 10px; color: #1b5e20; background: #a5d6a7; border-radius: 40px; padding: 3px 10px; width: 100%; text-align: center; min-height: 22px; display: flex; align-items: center; justify-content: center; }
  #ask-area { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 100%; margin-top: 3px; }
  #ask-label { font-size: 10px; font-weight: bold; color: #1b5e20; text-align: center; }
  #options { display: flex; gap: 5px; }
  .opt-btn { background: #66bb6a; border: none; border-radius: 60px; width: 80px; height: 40px; font-size: 11px; font-weight: bold; color: white; cursor: pointer; transition: transform 0.15s; }
  .opt-btn:active { transform: scale(0.92); }
  .opt-btn:disabled { opacity: 0.5; }
  .feedback { font-size: 10px; font-weight: bold; margin-top: 2px; min-height: 16px; text-align: center; }
  .feedback.correct { color: #1b5e20; }
  .feedback.wrong { color: #b71c1c; }
</style>
<div id="scene">
<svg viewBox="0 0 360 480" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="360" height="480" fill="#c8e6c9"/>
  <defs>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="60%" stop-color="#ffee58"/>
      <stop offset="100%" stop-color="#fdd835"/>
    </radialGradient>
    <linearGradient id="soilGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#795548"/>
      <stop offset="100%" stop-color="#4e342e"/>
    </linearGradient>
  </defs>
  <circle cx="280" cy="45" r="28" fill="url(#sunGrad)"/>
  <text x="280" y="50" text-anchor="middle" fill="#b71c1c" font-size="10" font-weight="bold" data-label="sun">सूरज</text>
  <line x1="270" y1="62" x2="210" y2="140" stroke="#fdd835" stroke-width="2" opacity="0.6"/>
  <line x1="290" y1="62" x2="250" y2="140" stroke="#fdd835" stroke-width="2" opacity="0.6"/>
  <line x1="250" y1="62" x2="170" y2="140" stroke="#fdd835" stroke-width="2" opacity="0.6"/>
  <path d="M30 380 H330 V470 H30 Z" fill="url(#soilGrad)"/>
  <text x="50" y="430" fill="#fff" font-size="9" data-label="roots">जड़ें</text>
  <path d="M180 360 Q175 260 180 210 Q185 180 180 160" stroke="#388e3c" stroke-width="7" fill="none"/>
  <g data-entity="leaf">
    <path d="M180 160 Q130 130 140 190 Q150 230 180 160" fill="#43a047" stroke="#2e7d32" stroke-width="2"/>
    <path d="M180 160 Q230 130 220 190 Q210 230 180 160" fill="#43a047" stroke="#2e7d32" stroke-width="2"/>
  </g>
  <text x="125" y="150" fill="#fff" font-size="9" font-weight="bold" data-label="leaf">पत्ती</text>
  <g data-entity="roots">
    <path d="M170 390 Q160 420 155 440" stroke="#6d4c41" stroke-width="3" fill="none"/>
    <path d="M190 390 Q200 420 195 440" stroke="#6d4c41" stroke-width="3" fill="none"/>
    <path d="M180 395 Q175 425 170 445" stroke="#6d4c41" stroke-width="3" fill="none"/>
  </g>
  <text x="120" y="405" fill="#1565c0" font-size="9" font-weight="bold" data-label="water">पानी</text>
  <text x="40" y="150" fill="#546e7a" font-size="9" font-weight="bold" data-label="co2">CO₂</text>
  <text x="300" y="150" fill="#2e7d32" font-size="9" font-weight="bold" data-label="o2">O₂</text>
  <text x="195" y="200" fill="#fff" font-size="8" font-weight="bold" data-label="glucose">ग्लूकोज़</text>
  <g id="water-particles"></g>
  <g id="co2-particles"></g>
  <g id="o2-particles"></g>
</svg>
<div id="bottom-panel">
  <div id="play-area">
    <button id="play-btn" data-action="play">⏸</button>
    <div id="step-btns">
      <button class="step-btn" data-action="step-1">1</button>
      <button class="step-btn" data-action="step-2">2</button>
      <button class="step-btn" data-action="step-3">3</button>
      <button class="step-btn" data-action="step-4">4</button>
      <button class="step-btn" data-action="step-5">5</button>
    </div>
  </div>
  <div id="caption" data-caption></div>
  <div id="ask-area">
    <div id="ask-label"></div>
    <div id="options">
      <button class="opt-btn" data-option="co2">CO₂</button>
      <button class="opt-btn" data-option="o2">O₂</button>
      <button class="opt-btn" data-option="water">पानी</button>
    </div>
    <div id="feedback" class="feedback"></div>
  </div>
</div>
</div>
<script>
(function(){
  const waterParticles = document.getElementById('water-particles');
  const co2Particles = document.getElementById('co2-particles');
  const o2Particles = document.getElementById('o2-particles');
  const playBtn = document.getElementById('play-btn');
  const stepBtns = document.querySelectorAll('.step-btn');
  const caption = document.getElementById('caption');
  const feedback = document.getElementById('feedback');
  const optBtns = document.querySelectorAll('.opt-btn');
  const askLabel = document.getElementById('ask-label');

  let playing = true;
  let currentStep = 1;
  let animFrame;
  let time = 0;
  const particleCount = 4;

  function makeParticles(container, type, baseX, baseY) {
    const colors = {water:'#42a5f5', co2:'#90a4ae', o2:'#66bb6a'};
    for (let i = 0; i < particleCount; i++) {
      const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
      circle.setAttribute('r','4');
      circle.setAttribute('fill', colors[type]);
      circle.setAttribute('data-flow', type);
      circle.setAttribute('cx', baseX + (i * 10 - 15));
      circle.setAttribute('cy', baseY + (i * 5 - 8));
      container.appendChild(circle);
    }
  }
  makeParticles(waterParticles, 'water', 170, 390);
  makeParticles(co2Particles, 'co2', 50, 180);
  makeParticles(o2Particles, 'o2', 200, 170);

  function getParticles(container) {
    return container.querySelectorAll('circle');
  }

  function animate() {
    if (playing) {
      time += 0.05;
      const waterCircs = getParticles(waterParticles);
      waterCircs.forEach((c, i) => {
        let cy = parseFloat(c.getAttribute('cy'));
        cy -= 1.8;
        if (cy < 175) cy = 400 + (i * 5);
        c.setAttribute('cy', cy);
        let cx = parseFloat(c.getAttribute('cx'));
        cx += Math.sin(cy * 0.04 + i) * 0.4;
        c.setAttribute('cx', cx);
      });
      const co2Circs = getParticles(co2Particles);
      co2Circs.forEach((c, i) => {
        let cx = parseFloat(c.getAttribute('cx'));
        cx += 1.2;
        if (cx > 160) cx = 40 + (i * 8);
        c.setAttribute('cx', cx);
        let cy = parseFloat(c.getAttribute('cy'));
        cy += Math.sin(time * 0.5 + i) * 0.3;
        c.setAttribute('cy', cy);
      });
      const o2Circs = getParticles(o2Particles);
      o2Circs.forEach((c, i) => {
        let cx = parseFloat(c.getAttribute('cx'));
        cx += 1.5;
        if (cx > 320) cx = 190 + (i * 8);
        c.setAttribute('cx', cx);
        let cy = parseFloat(c.getAttribute('cy'));
        cy += Math.sin(time * 0.4 + i) * 0.3;
        c.setAttribute('cy', cy);
      });
    }
    animFrame = requestAnimationFrame(animate);
  }
  animate();

  playBtn.addEventListener('click', function(){
    playing = !playing;
    this.textContent = playing ? '⏸' : '▶';
  });

  const stepCaptions = ['step1','step2','step3','step4','step5'];
  stepBtns.forEach((btn, idx) => {
    btn.addEventListener('click', function(){
      currentStep = idx+1;
      stepBtns.forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      caption.textContent = Studio.t(stepCaptions[idx]);
      if (!playing) {
        playing = true;
        playBtn.textContent = '⏸';
      }
    });
  });
  stepBtns[0].classList.add('active');
  caption.textContent = Studio.t('step1');
  askLabel.textContent = Studio.t('ask');

  let answered = false;

  optBtns.forEach(btn => {
    btn.addEventListener('click', function(){
      if (answered) return;
      const val = this.dataset.option;
      Studio.answer(val);
    });
  });

  Studio.onVerdict(function(result){
    if (result.correct) {
      feedback.textContent = 'सही! बहुत अच्छे!';
      feedback.className = 'feedback correct';
      answered = true;
      optBtns.forEach(b => b.disabled = true);
      Studio.done();
    } else {
      feedback.textContent = 'गलत, फिर कोशिश करो';
      feedback.className = 'feedback wrong';
    }
  });

  Studio.ready();
})();
</script>
