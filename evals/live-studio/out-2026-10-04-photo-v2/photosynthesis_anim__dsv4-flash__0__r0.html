<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: sans-serif; background: #e8f4e8; overflow: hidden; width: 360px; height: 640px; position: relative; }
#scene { width: 360px; height: 640px; position: relative; overflow: hidden; }
#svg-scene { position: absolute; top: 0; left: 0; width: 360px; height: 400px; }
#controls { position: absolute; top: 400px; left: 0; width: 360px; padding: 8px; }
#play-btn { display: inline-block; width: 60px; height: 44px; background: #4CAF50; color: white; border: none; border-radius: 22px; font-size: 16px; cursor: pointer; margin-right: 6px; transition: transform 0.15s; vertical-align: top; line-height: 44px; text-align: center; }
#play-btn:active { transform: scale(0.9); }
.step-btn { display: inline-block; width: 44px; height: 44px; background: #81c784; color: white; border: none; border-radius: 50%; font-size: 16px; font-weight: bold; cursor: pointer; margin: 0 2px; transition: all 0.2s; vertical-align: top; }
.step-btn.active { background: #388e3c; transform: scale(1.1); box-shadow: 0 0 10px #388e3c; }
.step-btn:active { transform: scale(0.85); }
#caption { margin: 6px 0; padding: 8px; background: rgba(255,255,255,0.9); border-radius: 12px; font-size: 13px; text-align: center; min-height: 36px; font-weight: bold; color: #2e7d32; }
#question-area { margin: 6px 0; text-align: center; }
#question-text { font-size: 14px; font-weight: bold; color: #1b5e20; margin-bottom: 6px; }
.option-btn { display: inline-block; width: 90px; height: 44px; background: #a5d6a7; color: #1b5e20; border: 2px solid #66bb6a; border-radius: 22px; font-size: 14px; font-weight: bold; cursor: pointer; margin: 0 4px; transition: all 0.2s; vertical-align: top; }
.option-btn:active { transform: scale(0.9); }
.option-btn:disabled { opacity: 0.6; cursor: default; }
#feedback { font-size: 13px; margin-top: 4px; min-height: 20px; font-weight: bold; }
.particle { transition: cx 0.8s linear, cy 0.8s linear; }
.light-ray { stroke-dasharray: 4 6; animation: dashMove 1s linear infinite; }
@keyframes dashMove { to { stroke-dashoffset: -10; } }
.glucose-glow { animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 0.7; } 50% { opacity: 1; filter: drop-shadow(0 0 6px #fdd835); } }
</style>
<div id="scene">
<svg id="svg-scene" viewBox="0 0 360 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky -->
  <rect width="360" height="400" fill="#d4e8d4"/>

  <!-- Sun -->
  <circle cx="300" cy="50" r="30" fill="#fdd835"/>
  <text x="300" y="55" text-anchor="middle" fill="#5d4037" font-size="14" font-weight="bold" data-label="sun">Suraj</text>
  <!-- Light rays -->
  <line class="light-ray" x1="275" y1="65" x2="220" y2="110" stroke="#fdd835" stroke-width="3"/>
  <line class="light-ray" x1="290" y1="75" x2="240" y2="120" stroke="#fdd835" stroke-width="3"/>
  <line class="light-ray" x1="310" y1="65" x2="260" y2="110" stroke="#fdd835" stroke-width="3"/>

  <!-- Plant -->
  <g id="plant">
    <!-- Stem -->
    <path d="M180 130 Q175 180 170 220 Q165 260 160 300" fill="none" stroke="#388e3c" stroke-width="8"/>
    <!-- Leaf -->
    <g data-entity="leaf">
      <path d="M180 130 Q200 100 220 120 Q210 140 180 130" fill="#4caf50"/>
      <path d="M180 130 Q160 100 140 120 Q150 140 180 130" fill="#43a047"/>
      <text x="180" y="115" text-anchor="middle" fill="white" font-size="11" font-weight="bold" data-label="leaf">Patti</text>
    </g>
    <!-- Roots -->
    <g data-entity="roots">
      <path d="M160 300 Q140 340 130 370" fill="none" stroke="#5d4037" stroke-width="5"/>
      <path d="M160 300 Q170 350 180 380" fill="none" stroke="#4e342e" stroke-width="5"/>
      <path d="M160 300 Q190 340 200 370" fill="none" stroke="#3e2723" stroke-width="5"/>
      <path d="M160 300 Q145 330 140 360" fill="none" stroke="#5d4037" stroke-width="4"/>
      <text x="160" y="395" text-anchor="middle" fill="#5d4037" font-size="11" font-weight="bold" data-label="roots">Jad</text>
    </g>
  </g>

  <!-- Soil -->
  <rect x="100" y="290" width="160" height="20" rx="5" fill="#6d4c41" opacity="0.6"/>

  <!-- Water label -->
  <text x="100" y="350" text-anchor="middle" fill="#1565c0" font-size="11" font-weight="bold" data-label="water">Paani</text>
  <!-- CO2 label -->
  <text x="50" y="180" text-anchor="middle" fill="#c62828" font-size="11" font-weight="bold" data-label="co2">CO₂</text>
  <!-- O2 label -->
  <text x="290" y="200" text-anchor="end" fill="#2e7d32" font-size="11" font-weight="bold" data-label="o2">O₂</text>
  <!-- Glucose label -->
  <text x="180" y="160" text-anchor="middle" fill="#f9a825" font-size="12" font-weight="bold" data-label="glucose">Glucose</text>

  <!-- Static particles animated via JS -->
</svg>

<div id="controls">
  <button id="play-btn" data-action="play">Pause</button>
  <button class="step-btn active" data-action="step-1">1</button>
  <button class="step-btn" data-action="step-2">2</button>
  <button class="step-btn" data-action="step-3">3</button>
  <button class="step-btn" data-action="step-4">4</button>
  <button class="step-btn" data-action="step-5">5</button>
  <div id="caption" data-caption></div>
  <div id="question-area">
    <div id="question-text"></div>
    <button class="option-btn" data-option="co2">CO₂</button>
    <button class="option-btn" data-option="o2">O₂</button>
    <button class="option-btn" data-option="water">Paani</button>
    <div id="feedback"></div>
  </div>
</div>
</div>

<script>
(function() {
  const svg = document.getElementById('svg-scene');
  const ns = 'http://www.w3.org/2000/svg';

  // Particle pools
  const waterParticles = [];
  const co2Particles = [];
  const o2Particles = [];

  // Create particles
  for (let i = 0; i < 4; i++) {
    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('r', '4');
    c.setAttribute('class', 'particle');
    c.setAttribute('data-flow', 'water');
    c.setAttribute('fill', '#42a5f5');
    svg.appendChild(c);
    waterParticles.push({ el: c, phase: i * 0.25 });
  }
  for (let i = 0; i < 4; i++) {
    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('r', '4');
    c.setAttribute('class', 'particle');
    c.setAttribute('data-flow', 'co2');
    c.setAttribute('fill', '#ef5350');
    svg.appendChild(c);
    co2Particles.push({ el: c, phase: i * 0.25 });
  }
  for (let i = 0; i < 4; i++) {
    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('r', '4');
    c.setAttribute('class', 'particle');
    c.setAttribute('data-flow', 'o2');
    c.setAttribute('fill', '#66bb6a');
    svg.appendChild(c);
    o2Particles.push({ el: c, phase: i * 0.25 });
  }

  // Glucose glow
  const glucoseGlow = document.createElementNS(ns, 'circle');
  glucoseGlow.setAttribute('cx', '180');
  glucoseGlow.setAttribute('cy', '150');
  glucoseGlow.setAttribute('r', '12');
  glucoseGlow.setAttribute('fill', '#fdd835');
  glucoseGlow.setAttribute('opacity', '0');
  glucoseGlow.setAttribute('class', 'glucose-glow');
  svg.appendChild(glucoseGlow);

  let isPlaying = true;
  let currentStep = 1;
  let animRunning = true;

  const captions = ['step1', 'step2', 'step3', 'step4', 'step5'];
  const stepNames = ['', 'step1', 'step2', 'step3', 'step4', 'step5'];

  const stepsConfig = [
    { water: true, co2: false, o2: false, glucose: false, light: true },
    { water: true, co2: true, o2: false, glucose: false, light: true },
    { water: true, co2: true, o2: true, glucose: false, light: true },
    { water: true, co2: true, o2: true, glucose: true, light: true },
    { water: true, co2: true, o2: true, glucose: true, light: true }
  ];

  function setCaption(step) {
    const capEl = document.querySelector('[data-caption]');
    capEl.textContent = Studio.t(stepNames[step]) || '';
  }

  function updateParticles(time) {
    if (!animRunning) return;

    const config = stepsConfig[currentStep - 1];

    // Water: from root (160,340) to leaf (180,140)
    waterParticles.forEach((p, i) => {
      const t = (time * 0.15 + p.phase) % 1;
      const x = 160 + (180 - 160) * t;
      const y = 340 - (340 - 140) * t;
      p.el.setAttribute('cx', x);
      p.el.setAttribute('cy', y);
      p.el.setAttribute('opacity', config.water ? '1' : '0');
    });

    // CO2: from air (50,180) to leaf (180,140)
    co2Particles.forEach((p, i) => {
      const t = (time * 0.12 + p.phase) % 1;
      const x = 50 + (180 - 50) * t;
      const y = 180 - (180 - 140) * t;
      p.el.setAttribute('cx', x);
      p.el.setAttribute('cy', y);
      p.el.setAttribute('opacity', config.co2 ? '1' : '0');
    });

    // O2: from leaf (180,140) to air (290,200)
    o2Particles.forEach((p, i) => {
      const t = (time * 0.12 + p.phase) % 1;
      const x = 180 + (290 - 180) * t;
      const y = 140 + (200 - 140) * t;
      p.el.setAttribute('cx', x);
      p.el.setAttribute('cy', y);
      p.el.setAttribute('opacity', config.o2 ? '1' : '0');
    });

    // Glucose glow
    glucoseGlow.setAttribute('opacity', config.glucose ? '0.7' : '0');
  }

  let time = 0;
  let lastTime = 0;

  function animate(timestamp) {
    if (lastTime === 0) lastTime = timestamp;
    const delta = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    if (isPlaying) {
      time += delta;
      updateParticles(time);
    }
    requestAnimationFrame(animate);
  }

  // Setup controls
  const playBtn = document.getElementById('play-btn');
  playBtn.addEventListener('click', function() {
    isPlaying = !isPlaying;
    this.textContent = isPlaying ? Studio.t('pause') : Studio.t('play');
    animRunning = isPlaying;
    if (!isPlaying) {
      // freeze particles
    }
    Studio.event('play_toggle', { playing: isPlaying });
  });

  const stepButtons = document.querySelectorAll('.step-btn');
  stepButtons.forEach(btn => {
    btn.addEventListener('click', function() {
      const stepNum = parseInt(this.textContent);
      setStep(stepNum);
    });
  });

  function setStep(step) {
    currentStep = step;
    stepButtons.forEach((btn, idx) => {
      const num = idx + 1;
      btn.classList.toggle('active', num === step);
    });
    setCaption(step);
    // Update scene
    const config = stepsConfig[step - 1];
    // Light rays visibility
    document.querySelectorAll('.light-ray').forEach(r => {
      r.setAttribute('opacity', config.light ? '1' : '0.3');
    });
    // Reset particle positions
    waterParticles.forEach(p => { p.phase = 0; });
    co2Particles.forEach(p => { p.phase = 0; });
    o2Particles.forEach(p => { p.phase = 0; });
    time = 0;
    if (isPlaying) animRunning = true;
    Studio.event('step_change', { step: step });
  }

  // Question
  const questionText = document.getElementById('question-text');
  questionText.textContent = Studio.t('ask') || 'Photosynthesis mein kaun si gas istemal hoti hai?';

  const optionBtns = document.querySelectorAll('.option-btn');
  let answered = false;

  optionBtns.forEach(btn => {
    btn.addEventListener('click', function() {
      if (this.disabled) return;
      const value = this.getAttribute('data-option');
      Studio.answer(value);
      // Disable while waiting for verdict
      optionBtns.forEach(b => b.disabled = true);
      Studio.event('answer', { option: value });
    });
  });

  Studio.onVerdict(function(result) {
    const feedback = document.getElementById('feedback');
    if (result.correct) {
      feedback.textContent = 'Sahi jawab! 👍';
      feedback.style.color = '#2e7d32';
      optionBtns.forEach(b => b.disabled = true);
      Studio.done();
    } else {
      feedback.textContent = 'Galat jawab, phir se koshish karo.';
      feedback.style.color = '#c62828';
      optionBtns.forEach(b => b.disabled = false);
    }
  });

  // Initial setup
  setStep(1);
  playBtn.textContent = Studio.t('pause');
  setCaption(1);

  // Start animation
  requestAnimationFrame(animate);

  Studio.ready();
})();
</script>
