<style>
  :root {
    --bg: #f7f9fc;
    --text: #1f2937;
    --primary: #4f9deB;
    --primary-dark: #3c7fc9;
    --success: #4caf7d;
    --error: #f28c6c;
    --shaded: #7cc4ff;
    --outline: #d8e2ee;
    --surface: #ffffff;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
  }

  .app {
    display: flex;
    flex-direction: column;
    width: 360px;
    height: 640px;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
    background: var(--bg);
  }

  .header {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 16px 16px 8px 16px;
  }

  .title {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.2;
    margin: 0;
  }

  .instr {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.4;
    margin: 0;
    opacity: 0.9;
  }

  .item-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 8px 16px 16px 16px;
    position: relative;
  }

  .fraction-display {
    font-size: 24px;
    font-weight: 700;
    color: var(--primary-dark);
    background: var(--surface);
    border-radius: 16px;
    padding: 10px 16px;
    box-shadow: 0 2px 8px rgba(79, 157, 235, 0.12);
    border: 1px solid var(--outline);
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .svg-wrapper {
    width: 100%;
    max-width: 280px;
    aspect-ratio: 1 / 1;
    background: var(--surface);
    border-radius: 20px;
    box-shadow: 0 4px 16px rgba(31, 41, 55, 0.08);
    border: 1px solid var(--outline);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }

  svg {
    width: 100%;
    height: 100%;
  }

  .part {
    cursor: pointer;
    transition: fill 220ms ease, stroke 220ms ease, transform 140ms ease, filter 220ms ease;
    transform-origin: center;
    outline: none;
  }

  .part:active {
    transform: scale(0.98);
    filter: brightness(0.98);
  }

  .part.shaded {
    fill: var(--shaded);
    stroke: var(--primary-dark);
    stroke-width: 2;
  }

  .part.unshaded {
    fill: #f0f6ff;
    stroke: var(--outline);
    stroke-width: 1.5;
  }

  .bar-segment {
    cursor: pointer;
    transition: fill 220ms ease, stroke 220ms ease, transform 140ms ease, filter 220ms ease;
    transform-origin: center;
    outline: none;
  }

  .bar-segment:active {
    transform: scale(0.995);
    filter: brightness(0.98);
  }

  .bar-segment.shaded {
    fill: var(--shaded);
    stroke: var(--primary-dark);
    stroke-width: 2;
  }

  .bar-segment.unshaded {
    fill: #f0f6ff;
    stroke: var(--outline);
    stroke-width: 1.5;
  }

  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 0 16px 16px 16px;
  }

  .check-btn {
    min-width: 160px;
    min-height: 44px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #ffffff;
    font-size: 16px;
    font-weight: 700;
    padding: 0 20px;
    box-shadow: 0 4px 12px rgba(79, 157, 235, 0.25);
    transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
    cursor: pointer;
  }

  .check-btn:active {
    transform: scale(0.98);
    box-shadow: 0 2px 8px rgba(79, 157, 235, 0.2);
    filter: brightness(0.98);
  }

  .check-btn[disabled] {
    opacity: 0.6;
    cursor: not-allowed;
    box-shadow: none;
  }

  .feedback {
    min-height: 44px;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    border-radius: 12px;
    padding: 10px 14px;
    max-width: 320px;
    transition: opacity 220ms ease, transform 220ms ease;
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
  }

  .feedback.show {
    opacity: 1;
    transform: translateY(0);
  }

  .feedback.right {
    background: rgba(76, 175, 125, 0.14);
    color: var(--success);
    border: 1px solid rgba(76, 175, 125, 0.28);
  }

  .feedback.wrong {
    background: rgba(242, 140, 108, 0.14);
    color: var(--error);
    border: 1px solid rgba(242, 140, 108, 0.28);
  }

  .done-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px;
    background: var(--bg);
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: opacity 280ms ease, transform 280ms ease;
  }

  .done-screen.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .done-card {
    background: var(--surface);
    border-radius: 24px;
    padding: 28px 20px;
    box-shadow: 0 6px 20px rgba(31, 41, 55, 0.08);
    border: 1px solid var(--outline);
    text-align: center;
    max-width: 300px;
  }

  .done-text {
    font-size: 18px;
    font-weight: 700;
    margin: 0;
    line-height: 1.3;
  }

  .celebrate {
    animation: celebrate-pop 520ms ease;
  }

  @keyframes celebrate-pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.06); }
    70% { transform: scale(0.99); }
    100% { transform: scale(1); }
  }

  .hint {
    font-size: 12px;
    opacity: 0.8;
    text-align: center;
    padding: 0 16px 8px 16px;
    min-height: 20px;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>

<div class="app" id="app">
  <header class="header">
    <h1 class="title" id="title"></h1>
    <p class="instr" id="instr"></p>
  </header>
  <main class="item-container" id="item-container" data-item="">
    <div class="fraction-display" id="fraction-display"></div>
    <div class="svg-wrapper" id="svg-wrapper"></div>
  </main>
  <div class="hint" id="hint"></div>
  <div class="controls">
    <button class="check-btn" id="check-btn" data-action="check"></button>
    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
  </div>
  <div class="done-screen" id="done-screen">
    <div class="done-card">
      <p class="done-text" id="done-text"></p>
    </div>
  </div>
</div>

<script>
(function(){
  var params = Studio.params;
  var items = params && params.items ? params.items : [];
  var pictureMode = params && params.picture ? params.picture : "pizza-or-bar";

  var app = document.getElementById("app");
  var titleEl = document.getElementById("title");
  var instrEl = document.getElementById("instr");
  var itemContainer = document.getElementById("item-container");
  var fractionDisplay = document.getElementById("fraction-display");
  var svgWrapper = document.getElementById("svg-wrapper");
  var hintEl = document.getElementById("hint");
  var checkBtn = document.getElementById("check-btn");
  var feedbackEl = document.getElementById("feedback");
  var doneScreen = document.getElementById("done-screen");
  var doneTextEl = document.getElementById("done-text");

  var currentIndex = 0;
  var isDone = false;

  function setText(el, key) {
    if (!el) return;
    var val = Studio.t(key);
    if (val === undefined || val === null) {
      el.textContent = "";
    } else {
      el.textContent = val;
    }
  }

  function renderStaticStrings() {
    setText(titleEl, "title");
    setText(instrEl, "instr");
    setText(checkBtn, "check");
    setText(hintEl, "hint");
    setText(doneTextEl, "done");
  }

  function renderFraction(n, d) {
    fractionDisplay.textContent = n + "/" + d;
  }

  function createPizza(nParts) {
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 200 200");
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
    svg.setAttribute("aria-hidden", "true");
    var cx = 100, cy = 100, r = 80;
    var g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    for (var i = 0; i < nParts; i++) {
      var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("class", "part unshaded");
      path.setAttribute("data-part", String(i));
      path.setAttribute("data-shaded", "false");
      var startAngle = (i * 2 * Math.PI) / nParts - Math.PI / 2;
      var endAngle = ((i + 1) * 2 * Math.PI) / nParts - Math.PI / 2;
      var x1 = cx + r * Math.cos(startAngle);
      var y1 = cy + r * Math.sin(startAngle);
      var x2 = cx + r * Math.cos(endAngle);
      var y2 = cy + r * Math.sin(endAngle);
      var largeArc = (endAngle - startAngle) > Math.PI ? 1 : 0;
      var dPath = "M " + cx + " " + cy + " L " + x1 + " " + y1 + " A " + r + " " + r + " 0 " + largeArc + " 1 " + x2 + " " + y2 + " Z";
      path.setAttribute("d", dPath);
      g.appendChild(path);
    }
    var ring = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    ring.setAttribute("cx", cx);
    ring.setAttribute("cy", cy);
    ring.setAttribute("r", r - 6);
    ring.setAttribute("fill", "none");
    ring.setAttribute("stroke", "#d8e2ee");
    ring.setAttribute("stroke-width", "2");
    ring.setAttribute("opacity", "0.6");
    svg.appendChild(g);
    svg.appendChild(ring);
    return svg;
  }

  function createBar(nParts) {
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 240 140");
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
    svg.setAttribute("aria-hidden", "true");
    var g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    var totalW = 200;
    var h = 60;
    var x0 = 20;
    var y0 = 40;
    var segW = totalW / nParts;
    for (var i = 0; i < nParts; i++) {
      var rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      rect.setAttribute("class", "bar-segment unshaded");
      rect.setAttribute("data-part", String(i));
      rect.setAttribute("data-shaded", "false");
      rect.setAttribute("x", x0 + i * segW + 1);
      rect.setAttribute("y", y0);
      rect.setAttribute("width", Math.max(0, segW - 2));
      rect.setAttribute("height", h);
      rect.setAttribute("rx", "8");
      rect.setAttribute("ry", "8");
      g.appendChild(rect);
    }
    svg.appendChild(g);
    return svg;
  }

  function renderItem(item) {
    if (!item) return;
    itemContainer.setAttribute("data-item", item.id);
    renderFraction(item.n, item.d);
    svgWrapper.innerHTML = "";
    var dCount = item.d;
    var useBar = false;
    if (pictureMode === "bar") {
      useBar = true;
    } else if (pictureMode === "pizza") {
      useBar = false;
    } else {
      useBar = (dCount > 6);
    }
    var svgEl;
    if (useBar) {
      svgEl = createBar(dCount);
    } else {
      svgEl = createPizza(dCount);
    }
    svgWrapper.appendChild(svgEl);
    bindParts(svgEl);
    feedbackEl.classList.remove("show", "right", "wrong");
    feedbackEl.textContent = "";
  }

  function bindParts(svgEl) {
    if (!svgEl) return;
    var parts = svgEl.querySelectorAll("[data-part]");
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      p.addEventListener("click", function() {
        var shaded = this.getAttribute("data-shaded") === "true";
        if (shaded) {
          this.setAttribute("data-shaded", "false");
          this.classList.remove("shaded");
          this.classList.add("unshaded");
        } else {
          this.setAttribute("data-shaded", "true");
          this.classList.remove("unshaded");
          this.classList.add("shaded");
        }
        Studio.event("part_toggle", { part: parseInt(this.getAttribute("data-part")) });
      }, { passive: true });
    }
  }

  function countShaded() {
    var container = svgWrapper;
    var parts = container.querySelectorAll("[data-part]");
    var c = 0;
    for (var i = 0; i < parts.length; i++) {
      if (parts[i].getAttribute("data-shaded") === "true") c++;
    }
    return c;
  }

  function advanceToNext() {
    currentIndex++;
    if (currentIndex >= items.length) {
      showDone();
    } else {
      renderItem(items[currentIndex]);
      checkBtn.removeAttribute("disabled");
    }
  }

  function showDone() {
    isDone = true;
    doneScreen.classList.add("show");
    Studio.done();
  }

  checkBtn.addEventListener("click", function() {
    if (isDone) return;
    var item = items[currentIndex];
    if (!item) return;
    var nCol = countShaded();
    var dCol = item.d;
    Studio.event("check", { id: item.id, n: nCol, d: dCol });
    Studio.answer({ n: nCol, d: dCol });
  }, { passive: true });

  Studio.onVerdict(function(v) {
    if (isDone) return;
    var correct = !!v.correct;
    if (correct) {
      feedbackEl.textContent = Studio.t("right");
      feedbackEl.classList.remove("wrong");
      feedbackEl.classList.add("show", "right");
      checkBtn.setAttribute("disabled", "true");
      var container = itemContainer;
      container.classList.add("celebrate");
      setTimeout(function() {
        container.classList.remove("celebrate");
        advanceToNext();
      }, 520);
    } else {
      feedbackEl.textContent = Studio.t("wrong");
      feedbackEl.classList.remove("right");
      feedbackEl.classList.add("show", "wrong");
    }
  });

  function init() {
    renderStaticStrings();
    if (items.length === 0) {
      showDone();
      return;
    }
    currentIndex = 0;
    renderItem(items[currentIndex]);
    Studio.ready();
  }

  init();
})();
</script>
