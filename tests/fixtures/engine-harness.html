<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>engine harness</title>
    <style>
      body { margin: 0; padding: 0; }
      iframe { display: block; width: 100%; height: 900px; border: 0; }
    </style>
  </head>
  <body>
    <!-- Minimal host for tests/engines-browser.test.mjs: the same handshake as src/modules/host.tsx (frame says
         "ready" on the window, the host answers with init + a MessagePort, everything after rides the port),
         with every module message recorded in window.events. -->
    <script>
      window.events = [];
      let port = null;
      let frame = null;
      let listener = null;
      window.mount = (engine, params, opts = {}) => {
        window.events = [];
        port = null;
        if (frame) frame.remove();
        const moduleId = opts.moduleId || "t1";
        frame = document.createElement("iframe");
        frame.setAttribute("sandbox", "allow-scripts");
        frame.src = "/modules.html#" + moduleId;
        document.body.appendChild(frame);
        const init = { type: "init", moduleId, engine, params, goal: opts.goal, lang: opts.lang || "english", ageBand: opts.ageBand || "10-15" };
        const onMsg = (e) => {
          if (e.source !== frame.contentWindow || !e.data || e.data.type !== "ready" || port) return;
          const ch = new MessageChannel();
          port = ch.port1;
          port.onmessage = (m) => window.events.push(m.data);
          frame.contentWindow.postMessage(init, "*", [ch.port2]);
        };
        if (listener) window.removeEventListener("message", listener);
        listener = onMsg;
        window.addEventListener("message", onMsg);
      };
      window.send = (msg) => port && port.postMessage(msg);
    </script>
  </body>
</html>
