<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F3EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Taxila is a personal AI teacher for classes 1 to 9 (CBSE, NCERT, RBSE and state boards). Lessons by voice, in English, Hindi or both. Your child always knows it's an AI, and you see what they learn." />
    <title>Taxila · a personal AI teacher</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="Taxila · a personal AI teacher for classes 1 to 9" />
    <meta property="og:description" content="Lessons by voice, in English, Hindi or both. Your child always knows it's an AI, and you see what they learn." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://taxila-web.nicebay-a0d3a12f.eastus2.azurecontainerapps.io/" />
    <!-- absolute: WhatsApp and Facebook scrapers do not resolve a relative og:image -->
    <meta property="og:image" content="https://taxila-web.nicebay-a0d3a12f.eastus2.azurecontainerapps.io/brand/share-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Taxila, a personal AI teacher for classes 1 to 9" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Fonts (PRODUCT-DESIGN-V2 §7.2): self-hosted from /fonts (OFL, public/fonts/OFL-NOTICE.txt), declared in
         src/styles/fonts.css. Only the UI face every first paint needs is preloaded; Literata (Older titles),
         Andika (early reading) and the Mukta Devanagari subset load on use, by unicode-range. -->
    <link rel="preload" href="/fonts/atkinson-hyperlegible-next-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The landing's hero art comes through the art ledger (src/ui/Art.tsx reads /assets/gen/manifest.json). On "/"
         only, start that fetch with the document so the hero image is not three round trips deep (LCP). -->
    <script>if(location.pathname==="/"){var l=document.createElement("link");l.rel="preload";l.as="fetch";l.href="/assets/gen/manifest.json";l.crossOrigin="anonymous";document.head.appendChild(l)}</script>
    <!-- W2-A #8 (smooth G5/G6): start the first API read with the document, before the bundle parses. Only when the
         readable session marker (tx_in, set at sign-in; never the token) says someone signed in on this browser, so
         the public landing never fires GET /api/me into a 401. Child home: ONE read (me + plan, /api/child/boot). The
         app takes the promise (src/app/boot.ts) or reads normally if it is absent or failed. -->
    <script>(function(){try{if(!/(?:^|; )tx_in=1/.test(document.cookie))return;var j=function(u){var p=fetch(u,{credentials:"same-origin"}).then(function(r){if(!r.ok)throw r.status;return r.json()});p.catch(function(){});return p};var m=location.pathname.match(/^\/c\/([0-9a-f-]{36})\/?$/i);if(m){window.__txBoot={cid:m[1],p:j("/api/child/boot?childId="+m[1])}}else if(location.pathname!=="/"){window.__txMe=j("/api/me")}}catch(e){}})();</script>
    <!-- inline first paint (smooth G6): a calm page and one card shape until the app renders over it -->
    <style>.tx-skel{position:fixed;inset:0;display:grid;place-items:center;background:#F6F3EC}.tx-skel i{display:block;width:min(88vw,420px);height:132px;border-radius:16px;background:#ECE6D8}@media (prefers-color-scheme:dark){.tx-skel{background:#121418}.tx-skel i{background:#1E2228}}</style>
  </head>
  <body>
    <div id="root"><div class="tx-skel" aria-hidden="true"><i></i></div></div>
    <noscript>Taxila needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
